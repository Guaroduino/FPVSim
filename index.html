        buoys: [
          { x: -28.0, z:  -6.0, name: 'B1 OESTE',     col: rgb565(255,  96,  24), topCol: C565.WHITE },
          { x: -12.0, z:  26.0, name: 'B2 NOROESTE',  col: rgb565(255, 215,  20), topCol: C565.RED   },
          { x:   4.0, z:  -4.0, name: 'B3 CENTRO SUR',col: rgb565(255,  96,  24), topCol: C565.WHITE },
          { x:  20.0, z:  28.0, name: 'B4 NORESTE',   col: rgb565(255, 215,  20), topCol: C565.RED   },
          { x:  38.0, z:   2.0, name: 'B5 ESTE',      col: rgb565(255,  96,  24), topCol: C565.WHITE },
          { x:   0.0, z: -12.0, name: 'B6 META SUR',  col: rgb565(255, 215,  20), topCol: C565.GREEN }
        ]
      }
    ];
    let SAIL_BUOYS = SAIL_COURSES[0].buoys;

    function selectSailCourse(idx) {
      fcProfile.sailCourseIdx = ((idx % SAIL_COURSES.length) + SAIL_COURSES.length) % SAIL_COURSES.length;
      SAIL_BUOYS = SAIL_COURSES[fcProfile.sailCourseIdx].buoys;
      if (typeof rcSailboatSim !== 'undefined') rcSailboatSim.activeBuoy = 0;
      if (typeof rcBoatSim !== 'undefined') rcBoatSim.activeBuoy = 0;
    }

    // Pool estático de Spray 3D de espuma blanca en la proa del velero (16 partículas, 0 allocs)
    const MAX_SAIL_SPRAY = 16;
    const SAIL_SPRAY_X   = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_Y   = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_Z   = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_VX  = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_VY  = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_VZ  = new Float32Array(MAX_SAIL_SPRAY);
    const SAIL_SPRAY_AGE = new Float32Array(MAX_SAIL_SPRAY);
    let sailSprayHead = 0;

    // 2 Veleros Rivales IA en memoria estática (compiten boya por boya con bordos de ceñida y trimado de vela)
    const SAIL_AI_BOATS = [
      { name: 'AI1', px: -12.0, pz: -12.0, py: 0.0, yaw: 1.05, spd: 2.1, heel: 0.15, boom: 0.42, buoy: 0, hullCol: rgb565(24, 195, 225), stripeCol: C565.GOLD,  spdMul: 0.94 },
      { name: 'AI2', px:  -4.0, pz: -13.0, py: 0.0, yaw: 1.15, spd: 2.0, heel: 0.14, boom: 0.44, buoy: 0, hullCol: rgb565(250, 175, 24), stripeCol: C565.GREEN, spdMul: 0.89 }
    ];

    function resetSailAiBoats() {
      SAIL_AI_BOATS[0].px = -12.5; SAIL_AI_BOATS[0].pz = -11.5; SAIL_AI_BOATS[0].yaw = 1.05; SAIL_AI_BOATS[0].spd = 2.0; SAIL_AI_BOATS[0].buoy = 0;
      SAIL_AI_BOATS[1].px =  -3.5; SAIL_AI_BOATS[1].pz = -12.5; SAIL_AI_BOATS[1].yaw = 1.15; SAIL_AI_BOATS[1].spd = 1.9; SAIL_AI_BOATS[1].buoy = 0;
    }

    function stepSailAiBoats(dt, trueWindX, trueWindZ) {
      if (!fcProfile.aiBots) return;
      const windSpd = Math.hypot(trueWindX, trueWindZ);
      const windFromAng = Math.atan2(-trueWindX, -trueWindZ); // Rumbo de donde viene el viento
      for (let i = 0; i < 2; i++) {
        const b = SAIL_AI_BOATS[i];
        const targetB = SAIL_BUOYS[b.buoy % SAIL_BUOYS.length];
        const dx = targetB.x - b.px, dz = targetB.z - b.pz;
        const dist = Math.hypot(dx, dz);
        if (dist < 5.8) {
          b.buoy = (b.buoy + 1) % SAIL_BUOYS.length;
        }
        let desYaw = Math.atan2(dx, dz);
        // Si el rumbo directo a la boya entra en la zona muerta contra el viento (< 42°), hacer bordo de ceñida
        let diffWind = Math.atan2(Math.sin(desYaw - windFromAng), Math.cos(desYaw - windFromAng));
        if (windSpd > 0.3 && Math.abs(diffWind) < 0.74) {
          const tackSign = (Math.floor((aeroEnv.time + i * 7.0) / 9.0) & 1) ? 1.0 : -1.0;
          desYaw = windFromAng + tackSign * 0.76;
          diffWind = tackSign * 0.76;
        }
        const yawErr = Math.atan2(Math.sin(desYaw - b.yaw), Math.cos(desYaw - b.yaw));
        b.yaw += Math.max(-1.35, Math.min(1.35, yawErr * 1.8)) * dt;

        const targetSpd = windSpd > 0.2 ? Math.min(3.8, (1.1 + windSpd * 0.34) * b.spdMul * (0.72 + 0.28 * Math.sin(Math.abs(diffWind)))) : 0.1;
        b.spd += (targetSpd - b.spd) * Math.min(1.0, dt * 1.8);
        b.px  += Math.sin(b.yaw) * b.spd * dt;
        b.pz  += Math.cos(b.yaw) * b.spd * dt;
        b.py   = getSailWaveHeight(b.px, b.pz, aeroEnv.time);
        b.boom = Math.max(-1.35, Math.min(1.35, -diffWind * 0.55));
        b.heel = Math.max(-0.45, Math.min(0.45, -Math.sin(diffWind) * 0.28 * Math.min(1.3, windSpd / 5.0)));
      }
    }

    // Buffer estático de estela en el agua (16 nodos, 0 allocs en bucle)
    const MAX_WAKE_PTS = 16;
    const WAKE_RING_X = new Float32Array(MAX_WAKE_PTS);
    const WAKE_RING_Z = new Float32Array(MAX_WAKE_PTS);
    const WAKE_RING_W = new Float32Array(MAX_WAKE_PTS);
    let wakeHeadIdx = 0;

    function getSailWaveHeight(wx, wz, t) {
      const wScale = (fcProfile.wind && fcProfile.wind.waveScale !== undefined) ? fcProfile.wind.waveScale : 1.0;
      if (wScale <= 0.01) return 0.0;
      const i1 = (Math.round(wx * 12.0 + wz * 5.0 - t * 48.0) & 511);
      const i2 = (Math.round(wz * 16.0 - wx * 7.0 - t * 38.0) & 511);
      const i3 = (Math.round((wx + wz) * 24.0 + t * 64.0) & 511);
      return (sinLut[i1] * 0.11 + sinLut[i2] * 0.07 + sinLut[i3] * 0.03) * wScale;
    }

    function generateSailboatBayVoxelMap() {
      activeWorldMapMode = 'sailboat';
      choroBakedInPsram  = false;
      WORLD_W_M   = 420.0;
      WORLD_H_M   = 300.0;
      MAP_SCALE_X = MAP_W / WORLD_W_M;
      MAP_SCALE_Z = MAP_H / WORLD_H_M;

      // 1. Cielo costero despejado con cúmulos blancos de regata
      for (let mz = 0; mz < SKY_DIM; mz++) {
        const zOff = mz << SKY_SHIFT;
        for (let mx = 0; mx < SKY_DIM; mx++) {
          const cn = fbmCloud(mx, mz);
          const cloudDensity = Math.max(0, Math.min(1, (cn - 0.06) * 1.9));
          const cSmooth = cloudDensity * cloudDensity * (3 - 2 * cloudDensity);
          const sr = 32 * (1 - cSmooth) + 250 * cSmooth;
          const sg = 96 * (1 - cSmooth) + 252 * cSmooth;
          const sb = 192 * (1 - cSmooth) + 255 * cSmooth;
          voxSkyMap[zOff + mx] = rgb565(clampByte(sr), clampByte(sg), clampByte(sb));
        }
      }

      // 2. Bahía Náutica en PSRAM: Agua azul con ondas + Costa de arena + Islas verdes + Muelle de madera al sur
      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const wz   = (mz - SPAWN_MZ) / MAP_SCALE_Z;
        const waveZ = sinLut[(mz * 3) & 511];

        for (let mx = 0; mx < MAP_W; mx++) {
          const wx = (mx - SPAWN_MX) / MAP_SCALE_X;

          // Muelle flotante de madera del piloto en el sur (wx: -4.5..+4.5, wz: -38..-23) a nivel 0 para paridad 1:1 con el agua
          if (Math.abs(wx) <= 4.2 && wz >= -38.0 && wz <= -23.5) {
            voxHeight[zOff + mx] = 0;
            const plank = ((mz >> 2) & 1) ? 148 : 132;
            const border = Math.abs(wx) > 3.6 ? 25 : 0;
            voxColor[zOff + mx] = rgb565(plank + border, plank - 28 + border, plank - 58);
            continue;
          }

          // Distancia normalizada al centro de la bahía para formar penínsulas e islas alrededor
          const bayTwist = sinLut[(mx >> 2) & 511] * 14.0 + sinLut[(mz >> 2) & 511] * 11.0;
          const distNorth = wz - (78.0 + bayTwist * 0.6);
          const distSouth = -35.0 - wz + sinLut[(mx >> 1) & 511] * 4.5;
          const distSide  = Math.abs(wx) - (108.0 + bayTwist);
          const shoreMetric = Math.max(distNorth, distSouth, distSide);

          // Pequeña isla faro al noreste (wx ~ 68, wz ~ 54)
          const dIsland = Math.hypot(wx - 68.0, wz - 54.0);
          const islandMetric = 16.0 - dIsland;
          const landVal = Math.max(shoreMetric, islandMetric);

          if (landVal > 0.0) {
            // Tierra firme / Playa / Colinas costeras
            const hRaw = Math.min(56, Math.round(2 + landVal * 1.15));
            voxHeight[zOff + mx] = hRaw;
            if (landVal < 5.5) {
              // Arena dorada de playa
              const grain = ((mx ^ mz) & 3) * 4;
              voxColor[zOff + mx] = rgb565(216 - grain, 194 - grain, 142 - grain);
            } else {
              // Vegetación costera verde con sombreado suave
              const shade = 0.88 + 0.18 * sinLut[(mx * 3 + mz * 2) & 511];
              const gBase = ((mx >> 4) ^ (mz >> 4)) & 1;
              const r = (gBase ? 46 : 56) * shade;
              const g = (gBase ? 108 : 122) * shade;
              const b = (gBase ? 44 : 48) * shade;
              voxColor[zOff + mx] = rgb565(clampByte(r), clampByte(g), clampByte(b));
            }
          } else {
            // Agua navegable con TEXTURA FIJA DE ALTO CONTRASTE en coordenadas del mundo (caústicas + celdas fijas)
            // para tener referencia visual absoluta de posición y velocidad del velero
            voxHeight[zOff + mx] = 0;
            const depthDist = -landVal; // > 0 hacia adentro del mar
            const shallow = Math.max(0.0, 1.0 - depthDist / 16.0);

            // Patrón celular fijo en el mundo (cada ~3.5m y ~7m) que no se mueve con el barco
            const cellX = Math.floor((wx + 500.0) / 3.5);
            const cellZ = Math.floor((wz + 500.0) / 3.5);
            const checker = ((cellX + cellZ) & 1) ? 14 : -10;
            const caustic = sinLut[(mx * 9 + mz * 13) & 511] * sinLut[(mx * 13 - mz * 7) & 511];
            const speck   = caustic > 0.52 ? 34 : (caustic < -0.45 ? -16 : 0);

            const r = 16 + shallow * 30 + checker * 0.6 + speck * 0.8;
            const g = 74 + shallow * 78 + checker * 1.1 + speck * 1.2;
            const b = 144 + shallow * 50 + checker * 1.3 + speck * 1.3;
            voxColor[zOff + mx] = rgb565(clampByte(r), clampByte(g), clampByte(b));
          }
        }
      }
    }

    // Dibuja el Modelo 3D Sólido del Velero RC (Casco IOM, Quilla con Bulbo, Timón, Mástil y Velas Mayor + Foque curvadas)
    function renderSolidSailboat320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      function wp(r, u, f) {
        return projPoint320(
          px + rx * r + ux * u + fx * f,
          py + ry * r + uy * u + fy * f,
          pz + rz * r + uz * u + fz * f
        );
      }

      // Colores náuticos de alta visibilidad en 320x240 RGB565
      const C_HULL_L  = sim.presetIdx === 1 ? rgb565(28, 132, 235) : rgb565(235, 52, 42);
      const C_HULL_D  = sim.presetIdx === 1 ? rgb565(18,  86, 168) : rgb565(168, 32, 26);
      const C_DECK    = rgb565(242, 245, 250);
      const C_COCKPIT = rgb565(58,  66,  78);
      const C_KEEL    = rgb565(72,  82,  96);
      const C_BULB    = rgb565(255, 205, 24);
      const C_SAIL_M1 = rgb565(250, 252, 255);
      const C_SAIL_M2 = rgb565(224, 234, 248);
      const C_SAIL_STRIPE = sim.presetIdx === 2 ? rgb565(255, 110, 24) : rgb565(235, 48, 48);
      const C_JIB     = rgb565(238, 244, 252);

      let fc = 0;

      // 0. Sombra 3D proyectada de las 2 velas y el casco sobre la superficie del agua (desplazada según el sol)
      const C_WATER_SHAD = rgb565(8, 36, 78);
      const bAngSh = sim.boomAngle;
      const sSinSh = Math.sin(bAngSh), sCosSh = Math.cos(bAngSh);
      function wpShadow(r, u, f) {
        const wx = px + rx * r + fx * f - u * 0.48;
        const wz = pz + rz * r + fz * f - u * 0.34;
        return projPoint320(wx, py - 0.02, wz);
      }
      const shBow  = wpShadow(0.0, 0.1,  1.50);
      const shMast = wpShadow(0.0, 0.2,  0.32);
      const shTop  = wpShadow(0.0, 3.45, 0.25);
      const shBoom = wpShadow(sSinSh * 1.55, 0.38, 0.32 - sCosSh * 1.55);
      const shStn  = wpShadow(0.0, 0.1, -1.32);
      fc = addCraftTri(fc, shMast, shTop, shBoom, C_WATER_SHAD);
      fc = addCraftTri(fc, shBow, shTop, shMast, C_WATER_SHAD);
      fc = addCraftTri(fc, shBow, shMast, shStn, C_WATER_SHAD);

      // 1. Quilla profunda y bulbo de plomo (visibles al escorar el casco)
      const kTopF = wp(0.00, -0.04,  0.12);
      const kTopR = wp(0.00, -0.04, -0.18);
      const kBotF = wp(0.00, -0.95,  0.04);
      const kBotR = wp(0.00, -0.95, -0.16);
      const bulbF = wp(0.00, -1.02,  0.26);
      const bulbL = wp(-0.11, -0.96, -0.06);
      const bulbR = wp( 0.11, -0.96, -0.06);
      const bulbB = wp(0.00, -1.02, -0.32);

      fc = addCraftQuad(fc, kTopF, kTopR, kBotR, kBotF, C_KEEL);
      fc = addCraftTri(fc, bulbF, bulbL, bulbB, C_BULB);
      fc = addCraftTri(fc, bulbF, bulbB, bulbR, C_BULB);

      // Pala del timón móvil en popa
      const rudSin = Math.sin(sim.rudderAngle), rudCos = Math.cos(sim.rudderAngle);
      const rTop   = wp(0.00, -0.05, -1.25);
      const rBot   = wp(rudSin * 0.28, -0.58, -1.25 - rudCos * 0.28);
      const rMid   = wp(0.00, -0.52, -1.18);
      fc = addCraftTri(fc, rTop, rMid, rBot, C_BULB);

      // 2. Casco Monocasco de Regata (Proa afilada, francobordo, espejo de popa y cubierta)
      const bowT  = wp( 0.00,  0.22,  1.55);
      const bowB  = wp( 0.00, -0.08,  1.42);
      const midLT = wp(-0.42,  0.18,  0.10);
      const midRT = wp( 0.42,  0.18,  0.10);
      const midLB = wp(-0.32, -0.12,  0.10);
      const midRB = wp( 0.32, -0.12,  0.10);
      const stnLT = wp(-0.30,  0.16, -1.35);
      const stnRT = wp( 0.30,  0.16, -1.35);
      const stnLB = wp(-0.20, -0.08, -1.30);
      const stnRB = wp( 0.20, -0.08, -1.30);
      const cockF = wp( 0.00,  0.21,  0.35);
      const cockR = wp( 0.00,  0.19, -0.95);

      // Costados babor y estribor + espejo de popa + cubierta blanca
      fc = addCraftQuad(fc, bowT, midLT, midLB, bowB, C_HULL_D);
      fc = addCraftQuad(fc, midLT, stnLT, stnLB, midLB, C_HULL_D);
      fc = addCraftQuad(fc, bowT, bowB, midRB, midRT, C_HULL_L);
      fc = addCraftQuad(fc, midRT, midRB, stnRB, stnRT, C_HULL_L);
      fc = addCraftQuad(fc, stnLT, stnRT, stnRB, stnLB, C_HULL_D);

      fc = addCraftTri(fc, bowT, midLT, cockF, C_DECK);
      fc = addCraftTri(fc, bowT, cockF, midRT, C_DECK);
      fc = addCraftQuad(fc, midLT, stnLT, cockR, cockF, C_DECK);
      fc = addCraftQuad(fc, cockF, cockR, stnRT, midRT, C_DECK);
      fc = addCraftTri(fc, stnLT, stnRT, cockR, C_COCKPIT);

      // 3. Mástil y 2 Velas Independientes 3D (Mayor + Foque) con Curvatura Exacta hacia Sotavento y Vectores Vivos
      const bAng = sim.boomAngle;
      const sSin = Math.sin(bAng), sCos = Math.cos(bAng);
      // El bolsillo de la vela (camber) se infla siempre en la dirección exacta de la normal de sotavento (mainLeeR, mainLeeF)
      const mainFlutter = sim.mainLuffing ? Math.sin(aeroEnv.time * 30.0) * 0.11 : 0.0;
      const mainBellMag = (sim.mainLuffing ? 0.02 : Math.min(0.28, 0.07 + sim.mainAeroMag * 0.06)) + mainFlutter;
      const perpR = sim.mainLeeR * mainBellMag;
      const perpF = sim.mainLeeF * mainBellMag;

      // Mástil situado en f = +0.32, altura = 3.48m
      const mastBase = wp(0.00, 0.22, 0.32);
      const mastMid1 = wp(0.00, 1.35, 0.30);
      const mastMid2 = wp(0.00, 2.45, 0.28);
      const mastTop  = wp(0.00, 3.48, 0.25);

      // Botavara de la Vela Mayor (largo 1.55m hacia popa rotada por bAng: 0° = pegada al centro del casco, +/-86° = casi 90°)
      const boomEnd   = wp(sSin * 1.55, 0.38, 0.32 - sCos * 1.55);
      const leechMid1 = wp(sSin * 1.22 + perpR, 1.38, 0.30 - sCos * 1.22 + perpF);
      const leechMid2 = wp(sSin * 0.72 + perpR * 0.7, 2.48, 0.28 - sCos * 0.72 + perpF * 0.7);

      // 3 Paneles de la Vela Mayor (con franja central de regata)
      fc = addCraftQuad(fc, mastBase, mastMid1, leechMid1, boomEnd, C_SAIL_M1);
      fc = addCraftQuad(fc, mastMid1, mastMid2, leechMid2, leechMid1, C_SAIL_STRIPE);
      fc = addCraftTri(fc, mastMid2, mastTop, leechMid2, C_SAIL_M2);

      // Foque de Proa Independiente (Jib: pivota en bowT con su propio ángulo sim.jibAngle y curvatura propia hacia sotavento)
      const jAng = sim.jibAngle;
      const jSin = Math.sin(jAng), jCos = Math.cos(jAng);
      const jibFlutter = sim.jibLuffing ? Math.cos(aeroEnv.time * 32.0) * 0.09 : 0.0;
      const jibBellMag = (sim.jibLuffing ? 0.02 : Math.min(0.22, 0.05 + sim.jibAeroMag * 0.05)) + jibFlutter;
      const jPerpR = sim.jibLeeR * jibBellMag;
      const jPerpF = sim.jibLeeF * jibBellMag;

      const jibTop  = wp(0.00, 2.68, 0.29);
      const jibClew = wp(jSin * 1.02, 0.40, 1.52 - jCos * 1.02);
      const jibMid  = wp(jSin * 0.58 + jPerpR, 1.45, 0.96 - jCos * 0.58 + jPerpF);
      fc = addCraftTri(fc, bowT, jibMid, jibClew, C_JIB);
      fc = addCraftTri(fc, bowT, jibTop, jibMid, C_SAIL_M2);

      renderSortedCraftFaces(fc);

      // Mástil negro/carbono en línea nítida
      projLine(
        px + ux * 0.20 + fx * 0.32, py + uy * 0.20 + fy * 0.32, pz + uz * 0.20 + fz * 0.32,
        px + ux * 3.52 + fx * 0.25, py + uy * 3.52 + fy * 0.25, pz + uz * 3.52 + fz * 0.25,
        0, 1
      );

      // Trazador 3D ultrafino de 1 solo píxel de grosor en 320x240 para vectores aerodinámicos/hidrodinámicos
      function projThinVec320(x0, y0, z0, x1, y1, z1, c565) {
        const p0 = projPoint320(x0, y0, z0);
        const p1 = projPoint320(x1, y1, z1);
        if (!p0 || !p1) return;
        let ix0 = Math.max(0, Math.min(DISP_W - 1, Math.round(p0.sx)));
        let iy0 = Math.max(0, Math.min(DISP_H - 1, Math.round(p0.sy)));
        const ix1 = Math.max(0, Math.min(DISP_W - 1, Math.round(p1.sx)));
        const iy1 = Math.max(0, Math.min(DISP_H - 1, Math.round(p1.sy)));
        const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
        const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
        let err = dx + dy, steps = 0;
        while (steps++ < 240) {
          vram565[iy0 * DISP_W + ix0] = c565;
          if (ix0 === ix1 && iy0 === iy1) break;
          const e2 = err << 1;
          if (e2 >= dy) { err += dy; ix0 += sx; }
          if (e2 <= dx) { err += dx; iy0 += sy; }
        }
      }

      // 4. VECTORES FÍSICOS 3D EN LÍNEA FINA DE 1 PÍXEL (Viento Aparente, Fuerza Mayor, Fuerza Foque, Quilla y Timón)
      // a) Vector de Viento Aparente en el tope del mástil (Cian fino 1px = hacia dónde fluye el aire sobre las velas)
      const topX = px + ux * 3.52 + fx * 0.25;
      const topY = py + uy * 3.52 + fy * 0.25;
      const topZ = pz + uz * 3.52 + fz * 0.25;
      const awLen = Math.max(0.5, sim.appWindSpd);
      const awDirX = sim.appWX / awLen, awDirZ = sim.appWZ / awLen;
      projThinVec320(topX - awDirX * 0.38, topY, topZ - awDirZ * 0.38, topX + awDirX * 0.62, topY, topZ + awDirZ * 0.62, C565.CYAN);

      // b) Vector Aerodinámico de la Vela Mayor (Verde fino 1px = empuje de la Mayor desde su centro vélico)
      const mCeX = px + rx * (sSin * 0.65) + ux * 1.40 + fx * (0.30 - sCos * 0.65);
      const mCeY = py + ry * (sSin * 0.65) + uy * 1.40 + fy * (0.30 - sCos * 0.65);
      const mCeZ = pz + rz * (sSin * 0.65) + uz * 1.40 + fz * (0.30 - sCos * 0.65);
      projThinVec320(
        mCeX, mCeY, mCeZ,
        mCeX + (rx * sim.mainForceR + fx * sim.mainForceF) * 0.34,
        mCeY + (ry * sim.mainForceR + fy * sim.mainForceF) * 0.34,
        mCeZ + (rz * sim.mainForceR + fz * sim.mainForceF) * 0.34,
        C565.GREEN
      );

      // c) Vector Aerodinámico del Foque (Verde fino 1px = empuje independiente del Foque en proa)
      const jCeX = px + rx * (jSin * 0.48) + ux * 1.20 + fx * (1.15 - jCos * 0.48);
      const jCeY = py + ry * (jSin * 0.48) + uy * 1.20 + fy * (1.15 - jCos * 0.48);
      const jCeZ = pz + rz * (jSin * 0.48) + uz * 1.20 + fz * (1.15 - jCos * 0.48);
      projThinVec320(
        jCeX, jCeY, jCeZ,
        jCeX + (rx * sim.jibForceR + fx * sim.jibForceF) * 0.44,
        jCeY + (ry * sim.jibForceR + fy * sim.jibForceF) * 0.44,
        jCeZ + (rz * sim.jibForceR + fz * sim.jibForceF) * 0.44,
        C565.GREEN
      );

      // d) Vectores Hidrodinámicos de la Quilla y del Timón bajo el casco (Dorado fino 1px)
      const kCeX = px - ux * 0.55, kCeY = py - uy * 0.55, kCeZ = pz - uz * 0.55;
      projThinVec320(kCeX, kCeY, kCeZ, kCeX + rx * sim.keelForceR * 0.28, kCeY + ry * sim.keelForceR * 0.28, kCeZ + rz * sim.keelForceR * 0.28, C565.GOLD);
      const rCeX = px - ux * 0.32 - fx * 1.25, rCeY = py - uy * 0.32 - fy * 1.25, rCeZ = pz - uz * 0.32 - fz * 1.25;
      projThinVec320(rCeX, rCeY, rCeZ, rCeX + rx * sim.rudForceR * 0.52, rCeY + ry * sim.rudForceR * 0.52, rCeZ + rz * sim.rudForceR * 0.52, C565.GOLD);
    }

    function renderSailBuoysAndWake320(sim, projPoint320, projLine) {
      const t = aeroEnv.time;

      // 0. Cuadrícula FIJA en el Mundo de Pequeños Voxels de Agua 3D (sin líneas azules móviles):
      //    Cada voxel está anclado en una coordenada fija (gx, gz) de la bahía y SOLO sube y baja en Y con la ola.
      //    Así el piloto ve con total claridad si el velero avanza, a qué velocidad cruza el agua y hacia dónde deriva.
      const GRID_STEP = 3.2;
      const baseIx = Math.round(sim.px / GRID_STEP);
      const baseIz = Math.round(sim.pz / GRID_STEP);
      const C_VOX_CREST = rgb565(185, 245, 255);
      const C_VOX_MID   = rgb565(56,  178, 232);
      const C_VOX_DEEP  = rgb565(18,   86, 156);
      const C_VOX_SHAD  = rgb565(10,   48,  98);

      for (let dz = -7; dz <= 7; dz++) {
        const gz = (baseIz + dz) * GRID_STEP;
        for (let dx = -7; dx <= 7; dx++) {
          // Desfase fijo tipo damero alterno por fila del mundo para una distribución orgánica pero 100% estática en (X, Z)
          const gx = (baseIx + dx) * GRID_STEP + (((baseIz + dz) & 1) ? GRID_STEP * 0.5 : 0.0);
          if (getTerrainHeightMeters(gx, gz) > 0.05) continue;

          const wy = getSailWaveHeight(gx, gz, t);
          // Proyectar la base (nivel 0) y la cresta vertical (wy) del pequeño voxel de ola
          const pTop  = projPoint320(gx, Math.max(0.02, wy + 0.08), gz);
          if (!pTop) continue;
          const sx = pTop.sx | 0;
          const sy = pTop.sy | 0;
          if (sx < 3 || sx >= DISP_W - 3 || sy < 3 || sy >= DISP_H - 3) continue;

          // Detectar manchas de ráfaga ("Catspaws") que viajan sobre el agua con el vector de viento real
          const gustPhase = Math.sin((gx * aeroEnv.windX + gz * aeroEnv.windZ) * 0.065 - t * 2.6)
                          * Math.cos((gx * 0.18 - gz * 0.14) - t * 1.2);
          const isCatspaw = (fcProfile.wind.gustPct > 0.08 && gustPhase > 0.42);
          const topCol = isCatspaw ? C565.CYAN : (wy > 0.06 ? C_VOX_CREST : (wy > -0.02 ? C_VOX_MID : C_VOX_DEEP));
          const pBase  = projPoint320(gx, -0.06, gz);
          const by     = pBase ? Math.max(sy + 1, Math.min(sy + 6, pBase.sy | 0)) : (sy + 2);

          // Dibujar columna/cubo voxel 3D (cara superior iluminada 2x2 + faldón vertical oscuro de relieve)
          for (let vy = sy; vy <= by; vy++) {
            if (vy < 0 || vy >= DISP_H) continue;
            const c = (vy === sy) ? topCol : C_VOX_SHAD;
            const rowOff = vy * DISP_W;
            vram565[rowOff + sx]     = c;
            vram565[rowOff + sx + 1] = c;
          }
        }
      }

      // 1. Dibujar líneas de espuma de la estela en V detrás del casco + anillos de agua
      for (let i = 0; i < MAX_WAKE_PTS - 1; i++) {
        const idx0 = (wakeHeadIdx - 1 - i + MAX_WAKE_PTS) % MAX_WAKE_PTS;
        const idx1 = (wakeHeadIdx - 2 - i + MAX_WAKE_PTS) % MAX_WAKE_PTS;
        const x0 = WAKE_RING_X[idx0], z0 = WAKE_RING_Z[idx0], w0 = WAKE_RING_W[idx0];
        const x1 = WAKE_RING_X[idx1], z1 = WAKE_RING_Z[idx1], w1 = WAKE_RING_W[idx1];
        if (w0 <= 0.01 || w1 <= 0.01) continue;
        if (Math.hypot(x1 - x0, z1 - z0) > 6.0) continue;

        const spread0 = 0.22 + i * 0.09;
        const spread1 = 0.22 + (i + 1) * 0.09;
        const colIdx  = i < 6 ? 1 : 5; // Blanco brillante cerca de la popa -> Cian espuma lejos
        projLine(
          x0 - sim.rx * spread0, 0.05, z0 - sim.rz * spread0,
          x1 - sim.rx * spread1, 0.04, z1 - sim.rz * spread1,
          i > 8 ? 1 : 0, colIdx
        );
        projLine(
          x0 + sim.rx * spread0, 0.05, z0 + sim.rz * spread0,
          x1 + sim.rx * spread1, 0.04, z1 + sim.rz * spread1,
          i > 8 ? 1 : 0, colIdx
        );
      }

      // 2. Línea táctica punteada hacia la boya activa
      const actB = SAIL_BUOYS[sim.activeBuoy];
      const dxB = actB.x - sim.px, dzB = actB.z - sim.pz;
      const distB = Math.hypot(dxB, dzB);
      if (distB > 2.0 && fcProfile.showSplinePath !== 0) {
        const steps = Math.min(10, Math.max(2, Math.floor(distB / 5.0)));
        for (let s = 1; s <= steps; s++) {
          const u = s / steps;
          const pt = projPoint320(sim.px + dxB * u, 0.12, sim.pz + dzB * u);
          if (pt && pt.sx > 4 && pt.sx < DISP_W - 4 && pt.sy > 4 && pt.sy < DISP_H - 4) {
            drawInavCircleDot320(pt.sx, pt.sy, s === steps ? 2 : 1, s === steps ? C565.GREEN : C565.CYAN);
          }
        }
      }

      // 3. Renderizar las 6 Boyas de Regata 3D flotando sobre las olas
      for (let i = 0; i < SAIL_BUOYS.length; i++) {
        const b = SAIL_BUOYS[i];
        const wy = getSailWaveHeight(b.x, b.z, t);
        const isAct = (i === sim.activeBuoy);
        const r = 0.85;

        const pBotL = projPoint320(b.x - r, wy,        b.z);
        const pBotR = projPoint320(b.x + r, wy,        b.z);
        const pMidL = projPoint320(b.x - r * 0.85, wy + 1.15, b.z);
        const pMidR = projPoint320(b.x + r * 0.85, wy + 1.15, b.z);
        const pTop  = projPoint320(b.x,     wy + 1.95, b.z);
        if (!pBotL || !pBotR || !pMidL || !pMidR || !pTop) continue;

        fillQuad320(pBotL, pBotR, pMidR, pMidL, b.col);
        fillTri320(pMidL.sx, pMidL.sy, pMidR.sx, pMidR.sy, pTop.sx, pTop.sy, isAct ? C565.GREEN : b.topCol);

        // Mástil y chevron luminoso en la boya activa
        if (isAct) {
          projLine(b.x, wy + 1.95, b.z, b.x, wy + 3.6, b.z, 0, 3);
          const pFlag = projPoint320(b.x, wy + 3.8, b.z);
          if (pFlag) {
            drawInavCircleDot320(pFlag.sx, pFlag.sy, 2, C565.GOLD);
            drawOsdSmall320(`B${i + 1}`, Math.round(pFlag.sx) - 4, Math.round(pFlag.sy) - 10, C565.GOLD);
          }
        }
      }

      // 4. Partículas 3D de Spray de Espuma Blanca en la proa al cortar las olas
      for (let i = 0; i < MAX_SAIL_SPRAY; i++) {
        const age = SAIL_SPRAY_AGE[i];
        if (age <= 0.0 || age > 0.55) continue;
        const pt = projPoint320(SAIL_SPRAY_X[i], SAIL_SPRAY_Y[i], SAIL_SPRAY_Z[i]);
        if (pt && pt.sx > 3 && pt.sx < DISP_W - 3 && pt.sy > 3 && pt.sy < DISP_H - 3) {
          drawInavCircleDot320(pt.sx, pt.sy, age < 0.22 ? 2 : 1, age < 0.28 ? C565.WHITE : C565.CYAN);
        }
      }

      // 5. Renderizar los 2 Veleros Rivales IA en la regata (si AI está activo)
      renderRemoteBlePlayer320(projPoint320, projLine);
      if (fcProfile.aiBots && sim === rcSailboatSim) {
        for (let a = 0; a < 2; a++) {
          const ab = SAIL_AI_BOATS[a];
          const cY = Math.cos(ab.yaw), sY = Math.sin(ab.yaw);
          const cH = Math.cos(ab.heel), sH = Math.sin(ab.heel);
          const fx = sY, fz = cY;
          const rx = cY * cH, ry = -sH, rz = -sY * cH;
          const ux = cY * sH, uy =  cH, uz = -sY * sH;
          function ap(r, u, f) {
            return projPoint320(ab.px + rx * r + ux * u + fx * f, ab.py + ry * r + uy * u, ab.pz + rz * r + uz * u + fz * f);
          }
          const pBow  = ap( 0.00, 0.20,  1.45);
          const pMidL = ap(-0.38, 0.16,  0.05);
          const pMidR = ap( 0.38, 0.16,  0.05);
          const pStnL = ap(-0.26, 0.15, -1.25);
          const pStnR = ap( 0.26, 0.15, -1.25);
          const pMastB = ap(0.00, 0.22,  0.28);
          const pMastT = ap(0.00, 3.25,  0.22);
          const sB = Math.sin(ab.boom), cB = Math.cos(ab.boom);
          const pBoom  = ap(sB * 1.42, 0.36, 0.28 - cB * 1.42);
          const pJibC  = ap(sB * 0.92, 0.38, 1.42 - cB * 0.92);
          const pJibT  = ap(0.00, 2.50, 0.25);
          if (pBow && pMidL && pMidR && pStnL && pStnR && pMastB && pMastT && pBoom) {
            fillTri320(pBow.sx, pBow.sy, pMidL.sx, pMidL.sy, pMidR.sx, pMidR.sy, ab.hullCol);
            fillQuad320(pMidL, pMidR, pStnR, pStnL, ab.hullCol);
            fillTri320(pMastB.sx, pMastB.sy, pMastT.sx, pMastT.sy, pBoom.sx, pBoom.sy, C565.WHITE);
            if (pJibC && pJibT) fillTri320(pBow.sx, pBow.sy, pJibT.sx, pJibT.sy, pJibC.sx, pJibC.sy, ab.stripeCol);
            drawOsdSmall320(ab.name, Math.round(pMastT.sx) - 6, Math.round(pMastT.sy) - 9, ab.stripeCol);
          }
        }
      }
    }

    const SAIL_PRESETS = [
      { name: 'IOM 1M PRO',  hullSpdScale: 1.05, keelRighting: 1.00, keelArea: 1.00, rudderAuth: 1.00 },
      { name: 'DF65 AGILE',  hullSpdScale: 1.15, keelRighting: 0.88, keelArea: 0.92, rudderAuth: 1.18 },
      { name: 'RG65 CARBON', hullSpdScale: 1.22, keelRighting: 0.95, keelArea: 1.08, rudderAuth: 1.10 }
    ];

    // =========================================================================
    // MODELO DE ARQUITECTURA NAVAL RC (v53):
    // Evalúa las fuerzas aerodinámicas reales sobre una vela individual (Mayor o Foque)
    // sin duplicar CL + CN:
    //  - Régimen Laminar (AoA 5°..32°): Sustentación alar (Lift _|_ viento) con pico claro a ~22° de AoA.
    //  - Régimen en Pérdida / Popa (AoA > 32°): Transición limpia (blend) a presión normal sobre la tela (leeR, leeF),
    //    de modo que sobrecazar la vela al centro en través/popa frena el avance y aumenta la escora hasta que sueltas escota.
    // =========================================================================
    function computeSingleSailForce(sailAng, wDirR, wDirF, qDynamic) {
      // Cuerda unitaria desde el grátil (mástil/estay) hacia el puño de escota: C = (sin(d), -cos(d))
      const cR = Math.sin(sailAng);
      const cF = -Math.cos(sailAng);
      // Normal perpendicular a la tela: N0 = (cos(d), sin(d))
      const n0R = Math.cos(sailAng);
      const n0F = Math.sin(sailAng);

      const dotNW = n0R * wDirR + n0F * wDirF;
      const dotCW = cR * wDirR + cF * wDirF;

      // Normal de sotavento (dirección hacia donde el viento infla la tela: N_lee . W >= 0)
      const leeSign = dotNW >= 0.0 ? 1.0 : -1.0;
      const leeR = n0R * leeSign;
      const leeF = n0F * leeSign;

      // Ángulo de ataque real en [0..PI] entre la cuerda C y el flujo de viento W
      const fullAoA = Math.atan2(Math.abs(dotNW), Math.max(-1.0, Math.min(1.0, dotCW)));

      // Si el ángulo es < 5.5° (0.095 rad), la vela flamea sin portar (Luffing)
      if (fullAoA < 0.095) {
        return {
          forceR: wDirR * (qDynamic * 0.03),
          forceF: wDirF * (qDynamic * 0.03),
          leeR, leeF,
          luffing: true,
          stalled: false,
          effAoA: fullAoA
        };
      }

      // Vector unitario de Sustentación (Lift) perpendicular al viento apuntando hacia sotavento
      const pDotLee = (-wDirF) * leeR + wDirR * leeF;
      const pSign   = pDotLee >= 0.0 ? 1.0 : -1.0;
      const liftR   = -wDirF * pSign;
      const liftF   =  wDirR * pSign;

      // Interpolación limpia entre Régimen Alar Laminar (wingBlend=1) y Régimen de Placa en Pérdida/Popa (wingBlend=0)
      // - Máxima eficiencia alar entre 12° y 28° (0.21..0.49 rad)
      // - Si AoA supera 33° (0.58 rad), el flujo se desprende progresivamente (Stall por sobrecazar la escota)
      let wingBlend = 0.0;
      let clWing    = 0.0;
      let cdWing    = 0.08;
      let stalled   = false;

      if (fullAoA <= 0.58) {
        wingBlend = 1.0;
        const u = (fullAoA - 0.095) / 0.485; // 0..1 entre 5.5° y 33°
        clWing = Math.sin(u * Math.PI * 0.85) * 1.55;
        cdWing = 0.06 + 0.22 * u * u;
      } else if (fullAoA < 1.15) {
        // Zona de transición Stall (33°..66°): cae la sustentación alar y domina la presión perpendicular a la tela
        const s = (fullAoA - 0.58) / 0.57;
        wingBlend = 1.0 - s;
        clWing = 1.35 * (1.0 - s);
        cdWing = 0.28 + 0.35 * s;
        stalled = (s > 0.25);
      } else {
        // Flujo francamente desprendido o de popa (> 66°)
        wingBlend = 0.0;
        stalled   = true;
      }

      // Fuerza en régimen alar (Lift + Drag) vs Fuerza en régimen de presión normal (perpendicular a la tela N_lee)
      const wingFR = clWing * liftR + cdWing * wDirR;
      const wingFF = clWing * liftF + cdWing * wDirF;

      const sinA   = Math.sin(fullAoA);
      const cnPlate = 1.45 * sinA * sinA;
      // En pérdida (stall con vela muy cerrada al centro), la turbulencia reduce el empuje longitudinal y aumenta la escora
      const plateFR = cnPlate * leeR + 0.08 * wDirR;
      const plateFF = cnPlate * leeF * (Math.abs(sailAng) < 0.45 ? 0.45 : 0.95) + 0.05 * wDirF;

      const totR = wingBlend * wingFR + (1.0 - wingBlend) * plateFR;
      const totF = wingBlend * wingFF + (1.0 - wingBlend) * plateFF;

      return {
        forceR: qDynamic * totR,
        forceF: qDynamic * totF,
        leeR, leeF,
        luffing: false,
        stalled,
        effAoA: fullAoA
      };
    }

    const rcSailboatSim = {
      px: -8.0, py: 0.0, pz: -10.0,
      vx: 0.0,  vy: 0.0, vz: 0.0,
      yaw: 1.10,
      yawRate: 0.0,
      heelAngle: 0.0,
      heelRate: 0.0,
      pitchAngle: 0.0,
      pitchRate: 0.0,
      rudderAngle: 0.0,
      sheetOpen01: 0.42, // 0.0 = velas pegadas al centro del casco (5°), 1.0 = abiertas casi a 90° (86°)
      boomAngle: 0.42,
      jibAngle: 0.45,
      mainLeeR: 1.0,
      mainLeeF: 0.0,
      jibLeeR: 1.0,
      jibLeeF: 0.0,
      mainLuffing: false,
      jibLuffing: false,
      mainAeroMag: 0.0,
      jibAeroMag: 0.0,
      mainForceF: 0.0,
      mainForceR: 0.0,
      jibForceF: 0.0,
      jibForceR: 0.0,
      keelForceR: 0.0,
      rudForceR: 0.0,
      appWX: 0.0,
      appWZ: -1.0,
      spd: 0.0,
      vmg: 0.0,
      appWindSpd: 5.4,
      appWindAng: 1.4,
      inIrons: false,
      pointOfSail: 'BEAM REACH (TRAVES)',
      presetIdx: 0,
      camMode: 0, // 0 = MIRADOR ALTO AUTO-ZOOM, 1 = MIRADOR PANORAMICO, 2 = FOLLOW 3D
      chaseCam: false,
      activeBuoy: 0,
      activeGate: 0,
      lapCount: 0,
      flightTime: 0.0,
      totalDistKm: 0.0,
      wakeTimer: 0.0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,

      reset() {
        if (activeWorldMapMode !== 'sailboat') {
          generateSailboatBayVoxelMap();
        }
        this.px = -8.0;
        this.py = 0.0;
        this.pz = -10.0;
        this.yaw = 1.10; // Rumbo inicial de través hacia la Boya 1 recibiendo la brisa del norte por babor
        this.yawRate = 0.0;
        this.heelAngle = 0.14;
        this.heelRate  = 0.0;
        this.pitchAngle = 0.0;
        this.pitchRate  = 0.0;
        this.rudderAngle = 0.0;
        this.sheetOpen01 = 0.42; // Escota a 42% (~39°) ideal para arrancar en través
        this.boomAngle = 0.42;
        this.jibAngle  = 0.45;
        this.mainLeeR  = Math.cos(this.boomAngle);
        this.mainLeeF  = Math.sin(this.boomAngle);
        this.jibLeeR   = Math.cos(this.jibAngle);
        this.jibLeeF   = Math.sin(this.jibAngle);
        this.spd = 2.0;
        this.vx = Math.sin(this.yaw) * this.spd;
        this.vz = Math.cos(this.yaw) * this.spd;
        this.vy = 0.0;
        this.activeBuoy = 0;
        this.activeGate = 0;
        this.flightTime = 0.0;
        this.wakeTimer  = 0.0;
        for (let i = 0; i < MAX_WAKE_PTS; i++) {
          WAKE_RING_X[i] = this.px;
          WAKE_RING_Z[i] = this.pz;
          WAKE_RING_W[i] = 0.0;
        }
        for (let i = 0; i < MAX_SAIL_SPRAY; i++) SAIL_SPRAY_AGE[i] = 0.0;
        resetSailAiBoats();
        this.updateBasis();
      },

      updateBasis() {
        const cY = Math.cos(this.yaw), sY = Math.sin(this.yaw);
        const cH = Math.cos(this.heelAngle), sH = Math.sin(this.heelAngle);
        const cP = Math.cos(this.pitchAngle), sP = Math.sin(this.pitchAngle);

        // Vector Forward (proa) con cabeceo de ola
        this.fx = sY * cP;
        this.fy = sP;
        this.fz = cY * cP;

        // Vector Right (estribor +r) y Up (mástil +u) inclinados por el ángulo de escora (heelAngle > 0 inclina el mástil a estribor +r)
        const r0x =  cY, r0z = -sY;
        this.rx = r0x * cH;
        this.ry = -sH;
        this.rz = r0z * cH;

        this.ux = r0x * sH - sY * sP * cH;
        this.uy = cH * cP;
        this.uz = r0z * sH - cY * sP * cH;
      },

      step(dt) {
        this.flightTime += dt;
        const preset = SAIL_PRESETS[this.presetIdx];

        // 1. Motor de Viento Marino Paramétrico sobre la bahía (controlado al 100% desde el menú [WIND])
        updateAeroEnvironment(this.px, 2.0, this.pz, 0.0, dt);
        const t = aeroEnv.time;
        const wCfg    = fcProfile.wind;
        const dirMode = fcProfile.windDirMode || 0;
        const baseDir  = dirMode === 0 ? -1.28 : WIND_DIR_RADS[dirMode];
        const shiftRad = (wCfg.shiftDeg * DEG2RAD) * (0.70 * Math.sin(t * 0.09) + 0.30 * Math.cos(t * 0.23))
                       + (wCfg.turbPct * 0.14) * Math.sin(t * 1.6 + this.px * 0.04);
        const marineWindDir = baseDir + shiftRad;

        const baseMs   = wCfg.baseKts * 0.51444;
        const gustEnv  = 1.0 + wCfg.gustPct * (0.42 * Math.sin(t * 0.32) + 0.28 * Math.cos(t * 0.78 - this.pz * 0.02))
                             + wCfg.turbPct * (0.16 * Math.sin(t * 2.4 + this.px * 0.05));
        const boostAdd = hwInput.btn.A ? Math.max(2.5, baseMs * 0.45) : 0.0;
        const marineWindSpd = Math.max(0.0, baseMs * Math.max(0.15, gustEnv) + boostAdd);
        const trueWindX = Math.cos(marineWindDir) * marineWindSpd;
        const trueWindZ = Math.sin(marineWindDir) * marineWindSpd;
        aeroEnv.windX = trueWindX;
        aeroEnv.windZ = trueWindZ;

        // 2. Vectores horizontales del casco: fwd = Proa (+f), rgt = Estribor (+r, derecha del casco)
        const fwdX = Math.sin(this.yaw), fwdZ = Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);

        // 3. Viento Aparente Escalado a Monocasco de Desplazamiento (V_barco_eff <= 0.34 * V_viento):
        //    Evita que la velocidad visual del barco en la bahía gire artificialmente el viento aparente hacia la proa
        //    y bloquee la apertura de las velas cuando abres el stick de Throttle al 100%.
        const aeroScaleVel = 0.32;
        const appWX = trueWindX - this.vx * aeroScaleVel;
        const appWZ = trueWindZ - this.vz * aeroScaleVel;
        this.appWX = appWX;
        this.appWZ = appWZ;
        this.appWindSpd = Math.max(0.15, Math.hypot(appWX, appWZ));

        // Componentes del flujo de viento en el sistema del barco:
        // flowFwd > 0 = viento de popa hacia proa; flowFwd < 0 = viento de proa hacia popa
        // flowRgt > 0 = viento fluye hacia estribor (+r); flowRgt < 0 = viento fluye hacia babor (-r)
        const flowFwd = appWX * fwdX + appWZ * fwdZ;
        const flowRgt = appWX * rgtX + appWZ * rgtZ;

        // Ángulo de dónde VIENE el viento respecto a la proa (0° = proa pura, +/-90° = través, +/-180° = popa)
        this.appWindAng = Math.atan2(-flowRgt, -flowFwd);
        const absWindFromBow = Math.abs(this.appWindAng);

        // 4. CONTROLES RC REALES:
        //    - Timón (Rudder) = Exclusivamente el eje horizontal del Joystick Derecho (hwInput.rx: derecha = virar a estribor)
        //    - Winche de Escota (Throttle = hwInput.ly):
        //      Abajo (0%) = velas pegaditas a la mitad del casco (5° max)
        //      Arriba (100%) = escota suelta hasta casi 90° respecto al casco (86° max)
        const targetRudder = applySuperExpo(hwInput.rx, 1.0, 0.30) * (38.0 * DEG2RAD);
        this.rudderAngle += (targetRudder - this.rudderAngle) * Math.min(1.0, dt * 16.0);

        // Eje vertical del Stick Derecho (hwInput.ry) ajusta suavemente el Zoom de la cámara LOS en tiempo real
        if (Math.abs(hwInput.ry) > 0.24 && Math.abs(hwInput.ry) > Math.abs(hwInput.rx) * 1.15) {
          fcProfile.losZoom = Math.max(0.50, Math.min(3.50, (fcProfile.losZoom || 1.25) + hwInput.ry * 0.95 * dt));
        }

        if (hwInput.leftActive || (isRadioThrottleActive() && !hwInput.leftActive)) {
          const targetSheet = Math.max(0.0, Math.min(1.0, (hwInput.ly + 1.0) * 0.5));
          this.sheetOpen01 += (targetSheet - this.sheetOpen01) * Math.min(1.0, dt * 18.0);
        } else if (rcInputConfig.thrMode === 3) {
          this.sheetOpen01 = Math.max(0.0, Math.min(1.0, (hwInput.ly + 1.0) * 0.5));
        } else if (Math.abs(hwInput.ly) > 0.08) {
          this.sheetOpen01 = Math.max(0.0, Math.min(1.0, this.sheetOpen01 + hwInput.ly * 0.85 * dt));
        }

        // Ángulo máximo permitido por el cabo de escota:
        // sheetOpen01 = 0% -> 5° (pegadas al centro del casco)
        // sheetOpen01 = 100% -> 86° (abiertas casi a 90° respecto al casco)
        const maxMainSheetRad = (5.0 + this.sheetOpen01 * 81.0) * DEG2RAD;
        const maxJibSheetRad  = Math.min(88.0 * DEG2RAD, maxMainSheetRad * 1.04 + 1.5 * DEG2RAD);

        // Ángulo libre de veleta hacia el cual el viento empuja las velas (con histéresis suave en popa cerrada)
        let effFlowRgt = flowRgt;
        if (flowFwd > 0.0 && Math.abs(flowRgt) < 0.35) {
          effFlowRgt = (this.boomAngle >= 0.0 ? 1.0 : -1.0) * 0.35;
        }
        const freeSailAng = marineWindSpd > 0.15 ? Math.atan2(effFlowRgt, -flowFwd) : this.boomAngle;
        const targetMainBoom = Math.max(-maxMainSheetRad, Math.min(maxMainSheetRad, freeSailAng));
        const targetJibBoom  = Math.max(-maxJibSheetRad,  Math.min(maxJibSheetRad,  freeSailAng));

        this.boomAngle += (targetMainBoom - this.boomAngle) * Math.min(1.0, dt * 10.0);
        this.jibAngle  += (targetJibBoom  - this.jibAngle)  * Math.min(1.0, dt * 11.5);

        // 5. FÍSICA VECTORIAL INDEPENDIENTE DE LA VELA MAYOR (62% área) Y DEL FOQUE (38% área)
        const wDirF = flowFwd / this.appWindSpd;
        const wDirR = flowRgt / this.appWindSpd;
        const qWind = (marineWindSpd > 0.15 ? 0.14 * this.appWindSpd * this.appWindSpd : 0.0) * preset.hullSpdScale;

        const mainAero = computeSingleSailForce(this.boomAngle, wDirR, wDirF, qWind * 0.62);
        const jibAero  = computeSingleSailForce(this.jibAngle,  wDirR, wDirF, qWind * 0.38);

        this.mainLuffing = mainAero.luffing || marineWindSpd <= 0.15;
        this.jibLuffing  = jibAero.luffing  || marineWindSpd <= 0.15;
        this.mainLeeR    = mainAero.leeR;
        this.mainLeeF    = mainAero.leeF;
        this.jibLeeR     = jibAero.leeR;
        this.jibLeeF     = jibAero.leeF;
        this.inIrons     = (marineWindSpd > 0.15 && absWindFromBow < 0.38); // < 22° de la proa

        // Efecto Slot Venturi entre el Foque y la Vela Mayor cuando ambas portan flujo adherido (+12% de empuje)
        const slotBonus = (!this.mainLuffing && !this.jibLuffing && !mainAero.stalled) ? 1.12 : 1.0;

        this.mainForceF  = mainAero.forceF * slotBonus;
        this.mainForceR  = mainAero.forceR * slotBonus;
        this.mainAeroMag = Math.hypot(this.mainForceF, this.mainForceR);

        this.jibForceF   = jibAero.forceF * slotBonus;
        this.jibForceR   = jibAero.forceR * slotBonus;
        this.jibAeroMag  = Math.hypot(this.jibForceF, this.jibForceR);

        // Al escorar (heelAngle), el área vélica efectiva disminuye con cos^2(heelAngle)
        const cosHeel    = Math.cos(this.heelAngle);
        const heelEff    = cosHeel * cosHeel;
        // En el cono de proa al viento (In Irons < 22°), el viento frena suavemente sin bloquear la inercia de virada
        const ironsFactor = this.inIrons ? -0.15 : 1.0;
        const sailDriveF  = (this.mainForceF + this.jibForceF) * heelEff * (this.inIrons ? 0.2 : 1.0) + (this.inIrons ? ironsFactor : 0.0);
        const sailSideR   = (this.mainForceR + this.jibForceR) * heelEff;

        // Estado táctico de las velas para el OSD
        if (marineWindSpd <= 0.15) {
          this.pointOfSail = 'CALM (0 KT SIN VIENTO)';
        } else if (this.inIrons) {
          this.pointOfSail = 'IN IRONS (PROA AL VIENTO)';
        } else if (this.mainLuffing) {
          this.pointOfSail = 'LUFFING (CAZA ESCOTA!)';
        } else if (mainAero.stalled && this.sheetOpen01 < 0.65 && absWindFromBow < 2.35) {
          this.pointOfSail = 'OVER-TRIM (SUELTA ESCOTA!)';
        } else if (absWindFromBow < 1.15) {
          this.pointOfSail = 'CLOSE HAUL (CENIDA)';
        } else if (absWindFromBow < 2.15) {
          this.pointOfSail = 'BEAM REACH (TRAVES)';
        } else {
          this.pointOfSail = 'RUNNING (POPA)';
        }

        // 6. VECTORES HIDRODINÁMICOS DE LA QUILLA DE ALTO ALARGAMIENTO Y DEL TIMÓN EN EL AGUA
        const uFwd = this.vx * fwdX + this.vz * fwdZ;
        const vLat = this.vx * rgtX + this.vz * rgtZ;
        const waterSpd = Math.hypot(uFwd, vLat);

        // a) Quilla de Regata (High-Aspect Fin Keel):
        //    Sostiene el 94% del empuje lateral de las velas con un ángulo de abatimiento (leeway) realista de solo 2°..4°,
        //    eliminando por completo el "efecto hovercraft / derrape sobre hielo".
        const keelResistRatio = Math.min(0.94, (0.35 + 0.65 * Math.min(1.0, waterSpd / 0.8)) * preset.keelArea);
        this.keelForceR = -sailSideR * keelResistRatio - vLat * (14.0 + waterSpd * 8.0) * preset.keelArea;
        const leewayAng = Math.atan2(-vLat, Math.max(0.30, Math.abs(uFwd)));

        // Resistencia hidrodinámica del casco: fricción viscosa + resistencia por ola de Froude (crece con uFwd^3 cerca de la velocidad de casco)
        const hullWaveDrag = 0.028 * uFwd * uFwd * Math.abs(uFwd);
        const keelDrag     = (0.26 + 0.08 * waterSpd) * uFwd + hullWaveDrag + Math.abs(sailSideR) * 0.025;

        // b) Vector del Timón en Popa Dependiente de la Velocidad Hidrodinámica (f = -1.25m):
        //    1) A muy baja velocidad (|uFwd| < 0.25 m/s): Casi NO hay flujo de agua sobre la pala (autoridad ~2%..8%).
        //       El barco necesita primero ganar arrancada (steerageway) con las velas para que el timón muerda el agua.
        //    2) A velocidad media de regata (1.0..2.2 m/s): La autoridad crece cuadráticamente hasta su punto óptimo.
        //    3) A muy alta velocidad (> 2.4 m/s): Meter todo el timón de golpe (> 20°) provoca cavitación/desprendimiento (Rudder Stall):
        //       la pala pierde mordiente de giro, vibra y actúa como un freno hidrodinámico fuerte que clava la proa.
        const absSpd      = Math.abs(uFwd);
        const spdNorm     = Math.min(1.0, absSpd / 1.65);
        // Curva cuadrática a baja velocidad: parado = 0.02 (2%), a 0.3 m/s = 6%, a 0.8 m/s = 28%, a 1.65 m/s = 100%
        const lowSpdAuth  = 0.02 + 0.98 * spdNorm * (0.22 + 0.78 * spdNorm);

        const absRud      = Math.abs(this.rudderAngle);
        const highSpdEx   = Math.max(0.0, absSpd - 2.1);
        // Ángulo crítico de entrada en pérdida/ventilación de la pala (se reduce a medida que vas muy rápido)
        const critRudRad  = Math.max(0.28, 0.58 - highSpdEx * 0.11); // ~33° a baja vel -> ~16° a muy alta vel
        let rudEffSin     = Math.sin(this.rudderAngle);
        let rudStallShake = 0.0;
        let rudStallDrag  = 1.0;

        if (absSpd > 1.8 && absRud > critRudRad) {
          // La pala del timón entra en pérdida hidrodinámica (cavitación) por exceso de mando a alta velocidad:
          // pierde hasta 50% de capacidad de giro, induce vibración y multiplica el frenado
          const overRud = Math.min(1.0, (absRud - critRudRad) / 0.32);
          rudEffSin    *= (1.0 - 0.52 * overRud);
          rudStallShake = Math.sin(t * 28.0) * 0.18 * overRud * highSpdEx;
          rudStallDrag  = 1.0 + 1.85 * overRud * (1.0 + highSpdEx * 0.5);
        }

        const dirSign  = uFwd >= -0.05 ? 1.0 : -1.0;
        this.rudForceR = -(dirSign * rudEffSin) * (1.75 * lowSpdAuth * preset.rudderAuth) + rudStallShake;
        const rudDrag  = (0.22 + 0.28 * absSpd) * Math.sin(this.rudderAngle) * Math.sin(this.rudderAngle) * rudStallDrag * uFwd;

        // Aceleración longitudinal y lateral neta del casco
        const fwdAcc = sailDriveF - keelDrag - rudDrag;
        const latAcc = sailSideR + this.keelForceR + this.rudForceR * 0.12;

        const newUFwd = Math.max(-0.5, Math.min(5.2, uFwd + fwdAcc * dt));
        const newVLat = Math.max(-0.28, Math.min(0.28, vLat + latAcc * dt));

        // 7. Dinámica Angular de Guiñada (Yaw):
        //    - Cuando el barco está casi parado, el desequilibrio entre Foque (proa) y Mayor (popa) permite abatir la proa suavemente para salir de proa al viento.
        //    - Cuando escora fuerte (> 16°), aparece Weather Helm (tendencia natural a orzar hacia el viento).
        const lowSpdSailPivot = (1.0 - spdNorm) * (this.jibForceR * 0.22 - this.mainForceR * 0.12) * 0.18;
        const weatherHelm     = -Math.sin(this.heelAngle) * Math.max(0.0, Math.abs(this.heelAngle) - 0.25) * 0.35 * spdNorm;
        const targetYawRate   = -this.rudForceR * 1.18 + weatherHelm + lowSpdSailPivot;
        this.yawRate += (targetYawRate - this.yawRate) * Math.min(1.0, dt * (5.5 + 4.5 * spdNorm));
        this.yaw     += this.yawRate * dt;

        this.vx = fwdX * newUFwd + rgtX * newVLat;
        this.vz = fwdZ * newUFwd + rgtZ * newVLat;
        this.spd = Math.hypot(this.vx, this.vz);
        this.totalDistKm += (this.spd * dt) / 1000.0;

        this.px += this.vx * dt;
        this.pz += this.vz * dt;

        // Mantener el velero dentro del agua navegable de la bahía (rebote suave si toca la orilla)
        const groundH = getTerrainHeightMeters(this.px, this.pz);
        if (groundH > 0.15) {
          this.px -= this.vx * dt * 2.2;
          this.pz -= this.vz * dt * 2.2;
          this.vx *= -0.35;
          this.vz *= -0.35;
          this.yaw += 0.6;
          showToast('ORILLA / BAJIO! VIRANDO...');
        }

        // 8. Dinámica Viva de Cabeceo (Pitch) y Variabilidad de Escora (Roll/Heel) inducida por las Olas:
        //    - Frecuencia de encuentro con las olas: al ceñir contra las olas (flowFwd < 0) el barco cabecea más vivo;
        //      en popa surfeando las olas (flowFwd > 0) el cabeceo es más largo y tendido.
        const waveScale  = (wCfg && wCfg.waveScale !== undefined) ? wCfg.waveScale : 1.0;
        const waveH      = getSailWaveHeight(this.px, this.pz, t);
        const waveHFwd   = getSailWaveHeight(this.px + fwdX * 1.25, this.pz + fwdZ * 1.25, t);
        const waveHAft   = getSailWaveHeight(this.px - fwdX * 1.25, this.pz - fwdZ * 1.25, t);
        const waveHRgt   = getSailWaveHeight(this.px + rgtX * 0.60, this.pz + rgtZ * 0.60, t);
        const waveHLft   = getSailWaveHeight(this.px - rgtX * 0.60, this.pz - rgtZ * 0.60, t);
        this.py = waveH;

        // Pendiente longitudinal de la ola + oscilación de cabeceo por encuentro de proa con las crestas
        const waveSlopePitch = Math.atan2(waveHFwd - waveHAft, 2.50) * 1.85;
        const encounterFreq  = 4.2 + Math.max(0.0, -flowFwd) * 0.45 + absSpd * 0.65;
        const bowChopPitch   = (Math.sin(t * encounterFreq + this.px * 0.35 + this.pz * 0.35) * 0.085
                             +  Math.cos(t * (encounterFreq * 0.63) - this.pz * 0.25) * 0.045) * waveScale * (0.45 + 0.55 * spdNorm);
        // Al clavar el timón a alta velocidad o ser empujado en popa, la proa tiende a hundirse ligeramente (bow-down trim)
        const aeroNoseTrim   = -Math.max(0.0, sailDriveF) * 0.012 - Math.abs(rudDrag) * 0.025;
        const targetPitch    = Math.max(-0.32, Math.min(0.32, waveSlopePitch + bowChopPitch + aeroNoseTrim));
        const pitchAcc       = (targetPitch - this.pitchAngle) * 22.0 - this.pitchRate * 4.2;
        this.pitchRate      += pitchAcc * dt;
        this.pitchAngle     += this.pitchRate * dt;

        // Variabilidad continua en la inclinación lateral (balanceo de ola + pulso de ráfaga en el mástil)
        const waveSlopeRoll = Math.atan2(waveHLft - waveHRgt, 1.20) * 1.65;
        const waveRocking   = (Math.sin(t * 3.4 + this.px * 0.28 - this.pz * 0.22) * 0.095
                            +  Math.cos(t * 5.1 - this.px * 0.18) * 0.045) * waveScale;
        const turbHeel      = (wCfg ? wCfg.turbPct : 0.2) * 0.07 * Math.sin(t * 3.8 + this.px * 0.08);
        const rawHeelRatio  = (sailSideR * 0.085) / (preset.keelRighting * 1.35);
        const eqHeel        = Math.atan(rawHeelRatio) * 0.78;
        const targetHeel    = Math.max(-0.68, Math.min(0.68, eqHeel + waveSlopeRoll + waveRocking + turbHeel));
        const heelAcc       = (targetHeel - this.heelAngle) * 14.0 - this.heelRate * 3.6;
        this.heelRate      += heelAcc * dt;
        this.heelAngle     += this.heelRate * dt;

        this.updateBasis();

        // 8A. Actualizar partículas 3D de Spray en proa y emitir espuma al cortar las olas con velocidad
        for (let i = 0; i < MAX_SAIL_SPRAY; i++) {
          if (SAIL_SPRAY_AGE[i] > 0.0) {
            SAIL_SPRAY_AGE[i] += dt;
            SAIL_SPRAY_X[i]   += SAIL_SPRAY_VX[i] * dt;
            SAIL_SPRAY_Y[i]   += SAIL_SPRAY_VY[i] * dt;
            SAIL_SPRAY_Z[i]   += SAIL_SPRAY_VZ[i] * dt;
            SAIL_SPRAY_VY[i]  -= 6.5 * dt;
          }
        }
        if (this.spd > 1.35 && (waveHFwd > 0.02 || Math.abs(this.pitchRate) > 0.18) && ((Math.floor(this.flightTime * 28) & 1) === 0)) {
          const side = (sailSprayHead & 1) ? 1.0 : -1.0;
          SAIL_SPRAY_X[sailSprayHead]   = this.px + fwdX * 1.42 + rgtX * (side * 0.18);
          SAIL_SPRAY_Y[sailSprayHead]   = this.py + 0.18;
          SAIL_SPRAY_Z[sailSprayHead]   = this.pz + fwdZ * 1.42 + rgtZ * (side * 0.18);
          SAIL_SPRAY_VX[sailSprayHead]  = this.vx * 0.35 + rgtX * (side * (0.9 + this.spd * 0.45));
          SAIL_SPRAY_VY[sailSprayHead]  = 1.25 + this.spd * 0.42;
          SAIL_SPRAY_VZ[sailSprayHead]  = this.vz * 0.35 + rgtZ * (side * (0.9 + this.spd * 0.45));
          SAIL_SPRAY_AGE[sailSprayHead] = 0.01;
          sailSprayHead = (sailSprayHead + 1) & (MAX_SAIL_SPRAY - 1);
        }

        // 8B. Actualizar los 2 Veleros Rivales IA
        stepSailAiBoats(dt, trueWindX, trueWindZ);

        // 8C. Registrar puntos de estela en V cada 0.07s
        this.wakeTimer += dt;
        if (this.wakeTimer >= 0.07) {
          this.wakeTimer = 0.0;
          WAKE_RING_X[wakeHeadIdx] = this.px - fwdX * 1.25;
          WAKE_RING_Z[wakeHeadIdx] = this.pz - fwdZ * 1.25;
          WAKE_RING_W[wakeHeadIdx] = this.spd > 0.25 ? this.spd : 0.0;
          wakeHeadIdx = (wakeHeadIdx + 1) % MAX_WAKE_PTS;
        }

        // 9. Paso por las 6 Boyas de Regata
        const b = SAIL_BUOYS[this.activeBuoy];
        const distBuoy = Math.hypot(this.px - b.x, this.pz - b.z);
        if (distBuoy < 6.2) {
          this.activeBuoy = (this.activeBuoy + 1) % SAIL_BUOYS.length;
          this.activeGate = this.activeBuoy;
          if (this.activeBuoy === 0) {
            this.lapCount++;
            showToast(`REGATA VUELTA ${this.lapCount} COMPLETADA!`);
            playTone(980, 0.12);
          } else {
            showToast(`BOYA ${this.activeBuoy}/6 OK -> ${SAIL_BUOYS[this.activeBuoy].name}`);
            playTone(860, 0.07);
          }
        }
      },

      render() {
        // Posición fija del Piloto en el Mirador / Muelle Alto (19.5m de altura) al sur de la bahía
        const dockX = 0.0, dockY = 19.5, dockZ = -28.0;
        let camX = dockX, camY = dockY, camZ = dockZ;
        let cRx = 1, cRy = 0, cRz = 0;
        let cUx = 0, cUy = 1, cUz = 0;
        let cFx = 0, cFy = 0, cFz = 1;
        let zoomFactor = 1.0;

        const userZoom = Math.max(0.50, Math.min(3.50, fcProfile.losZoom || 1.25));

        if (this.camMode === 2 || this.chaseCam) {
          // Vista Follow 3D elevada detrás del velero (también responde al Zoom ajustable)
          const fc = computeFollowCamPose(this, 6.8 / userZoom, Math.max(1.3, 2.8 / Math.sqrt(userZoom)), 15.0);
          camX = fc.camX; camY = Math.max(1.4, fc.camY); camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
          zoomFactor = userZoom;
        } else {
          // Vector horizontal LOS desde el Mirador del Muelle hacia el Velero
          const rawDx = this.px - dockX;
          const rawDz = this.pz - dockZ;
          const horizDist = Math.hypot(rawDx, rawDz) || 1.0;
          const dirHx = rawDx / horizDist;
          const dirHz = rawDz / horizDist;

          if (this.camMode === 0) {
            // MIRADOR ALTO AUTO-ZOOM DE TAMAÑO CONSTANTE:
            // Conserva el ángulo de visión LOS real desde el muelle (dirHx, dirHz), pero mantiene la distancia óptica
            // prácticamente constante (~9.5m..11.2m / userZoom) para que el velero conserve siempre el mismo tamaño en pantalla.
            const baseEff = 9.4 + Math.min(1.8, horizDist * 0.020);
            const effHoriz = Math.max(3.8, Math.min(32.0, baseEff / userZoom));
            zoomFactor = horizDist / Math.max(1.0, effHoriz);
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(3.4, Math.min(14.0, this.py + 2.1 + effHoriz * 0.42));
          } else {
            // MIRADOR ZOOM MANUAL (camMode === 1): zoom directo sobre la distancia real desde el muelle
            const effHoriz = Math.max(4.5, Math.min(90.0, horizDist / userZoom));
            zoomFactor = userZoom;
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(5.0, Math.min(25.0, 21.0 / Math.sqrt(userZoom)));
          }

          const dx = this.px - camX;
          const dy = (this.py + 0.85) - camY;
          const dz = this.pz - camZ;
          const dLen = Math.hypot(dx, dy, dz) || 1.0;
          cFx = dx / dLen;
          cFy = dy / dLen;
          cFz = dz / dLen;

          // Base ortonormal mano derecha sin roll (U = F x R -> cUy = +hLen > 0, horizonte marino al derecho)
          const hLen = Math.hypot(cFx, cFz) || 1.0;
          cRx =  cFz / hLen;
          cRy =  0.0;
          cRz = -cFx / hLen;

          cUx = cFy * cRz - cFz * cRy;
          cUy = cFz * cRx - cFx * cRz;
          cUz = cFx * cRy - cFy * cRx;
        }

        // 1. Renderizar Agua, Bahía y Cielo Voxel
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Proyector 3D + Olas 3D + Boyas de Regata + Estela + Velero 3D Sólido con Vectores
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderSailBuoysAndWake320(this, projPoint320, projLine);
        renderSolidSailboat320(this, projPoint320, projLine);

        // 3. OSD Náutico RC (Rosa de Viento Real/Aparente, Escota en Grados, Escora, Nudos y Boya)
        this.renderSailOsd320(cRx, cRz, cFx, cFz, zoomFactor);
      },

      renderSailOsd320(cRx, cRz, cFx, cFz, zoomFactor) {
        const WHITE = 0xFFFF;
        const preset = SAIL_PRESETS[this.presetIdx];

        // Encabezado superior: Clase de Velero + Estado de Trimado de Vela
        const titleStr = `RC SAIL // ${preset.name}`;
        drawOsdSmall320(titleStr, 160 - ((titleStr.length * 5) >> 1), 6, WHITE);
        const posCol = (this.inIrons || this.mainLuffing) ? C565.RED : (this.pointOfSail.includes('OVER-TRIM') ? C565.ORANGE : C565.GREEN);
        drawOsdSmall320(this.pointOfSail, 160 - ((this.pointOfSail.length * 5) >> 1), 16, posCol);

        // Rosa Náutica de Viento en la esquina superior izquierda (muestra hacia dónde SOPLA el viento en el plano horizontal de tu vista LOS)
        const wcx = 24, wcy = 24, wr = 14;
        for (let a = 0; a < 8; a++) {
          const ang = a * (Math.PI * 0.25);
          setPx320(wcx + Math.round(Math.sin(ang) * wr), wcy - Math.round(Math.cos(ang) * wr), WHITE);
        }
        // Vector horizontal unitario hacia adelante de la cámara = (-cRz, cRx)
        const camHorizFx = -cRz, camHorizFz = cRx;
        const windRelX = aeroEnv.windX * cRx + aeroEnv.windZ * cRz;
        const windRelZ = aeroEnv.windX * camHorizFx + aeroEnv.windZ * camHorizFz;
        const wMag = Math.hypot(windRelX, windRelZ) || 1.0;
        const wxN = windRelX / wMag, wzN = windRelZ / wMag;
        const tipX = wcx + Math.round(wxN * 11), tipY = wcy - Math.round(wzN * 11);
        const tailX = wcx - Math.round(wxN * 11), tailY = wcy + Math.round(wzN * 11);
        drawOutlinedLine320(tailX, tailY, tipX, tipY, C565.CYAN);
        // Punta verde en la cabeza de la flecha (hacia dónde EMPUJA el viento)
        drawInavCircleDot320(tipX, tipY, 2, C565.GREEN);

        const trueWindKts = (Math.hypot(aeroEnv.windX, aeroEnv.windZ) * 1.944).toFixed(1);
        const appWindKts  = (this.appWindSpd * 1.944).toFixed(1);
        drawOsdSmall320(`TW ${trueWindKts}KT`, 44, 10, C565.GOLD);
        drawOsdSmall320(`AW ${appWindKts}KT`,  44, 20, C565.CYAN);
        drawOsdSmall320(`WA ${Math.round(Math.abs(this.appWindAng) * RAD2DEG)}D`, 44, 30, WHITE);

        // Esquina superior derecha: Boya activa, distancia y cámara LOS
        const b = SAIL_BUOYS[this.activeBuoy];
        const distB = Math.round(Math.hypot(b.x - this.px, b.z - this.pz));
        drawOsdSmall320(`BUOY ${this.activeBuoy + 1}/6`, 264, 8, C565.GREEN);
        drawOsdSmall320(`DST ${distB}M`,                264, 18, WHITE);
        const zUsr = (fcProfile.losZoom || 1.25).toFixed(2);
        const camLbl = (this.camMode === 2 || this.chaseCam) ? `FLW Z:${zUsr}X` : (this.camMode === 0 ? `LOS ${zoomFactor.toFixed(1)}X` : `MAN ${zUsr}X`);
        drawOsdSmall320(camLbl,        254, 28, C565.CYAN);
        drawOsdSmall320(`[-ZOOM ${zUsr}+]`, 244, 38, C565.GOLD);

        // Columna izquierda inferior: Velocidad (KTS), Tope de Escota (SHEET °), Ángulo Real de Botavara (BOOM °) y Escora (HEEL °)
        const kts = (this.spd * 1.944).toFixed(1);
        const maxSheetDeg = Math.round(5 + this.sheetOpen01 * 81);
        const boomDeg     = Math.round(Math.abs(this.boomAngle) * RAD2DEG);
        const heelDeg     = Math.round(Math.abs(this.heelAngle) * RAD2DEG);
        const rudDeg      = Math.round(this.rudderAngle * RAD2DEG);

        drawOsdSmall320(`SPD   ${kts}KT`,              8, 174, C565.GREEN);
        drawOsdSmall320(`WINCH ${maxSheetDeg}D MAX`,   8, 185, C565.CYAN);
        drawOsdSmall320(`BOOM  ${boomDeg}D / RUD ${rudDeg >= 0 ? '+' : ''}${rudDeg}D`, 8, 196, WHITE);
        drawOsdSmall320(`HEEL  ${heelDeg}DEG`,         8, 207, heelDeg > 28 ? C565.ORANGE : WHITE);
        drawOsdSmall320(`L:ESCOTA  R:TIMON`,           8, 218, C565.GOLD);

        // Columna derecha inferior: Vueltas de regata y cronómetro
        const mins = String(Math.floor(this.flightTime / 60)).padStart(2, '0');
        const secs = String(Math.floor(this.flightTime % 60)).padStart(2, '0');
        drawOsdSmall320(`LAP ${this.lapCount}`,  270, 196, C565.GOLD);
        drawOsdSmall320(`TIM ${mins}:${secs}`,   255, 207, WHITE);
        drawOsdSmall320(`B:CAM Y:CLASE`,         248, 218, C565.CYAN);
      }
    };

    /***************************************************************************
     * 6C. SIMULADOR 4: CARRO RC 1/10 LOS (PISTA ASFALTO + SALTOS + DRIFT)
     *     - Vista Piloto LOS desde el Podio (Driver's Stand) con Auto-Zoom + Chase 3D
     *     - Física de 4 Ruedas con Slip Angle (Drift), Suspensión 3D y 2 Saltos
     *     - Cronometraje por Vuelta (Lap Timer) con 12 Checkpoints y Pórtico de Meta
     ***************************************************************************/
    const RC_CAR_TRACKS = [
      {
        name: 'GP MIXTO (2 SALTOS)',
        jumps: [{ x: 23.5, z: 19.0 }, { x: -32.0, z: 5.5 }],

          { x: -14.0, z:   6.0 }, { x: -18.0, z:  22.0 }, { x: -32.0, z:  14.0 }, { x: -32.0, z:  -3.0 }
        ]
      },
      {
        name: 'SUPER OVALO 3-JUMP',
        jumps: [{ x: 18.0, z: -12.0 }, { x: 14.0, z: 22.0 }, { x: -18.0, z: 22.0 }],
        wps: [
          { x: -22.0, z: -12.0 }, { x:   0.0, z: -12.0 }, { x:  24.0, z: -12.0 }, { x:  35.0, z:  -4.0 },
          { x:  35.0, z:  14.0 }, { x:  24.0, z:  22.0 }, { x:   0.0, z:  22.0 }, { x: -24.0, z:  22.0 },
          { x: -35.0, z:  14.0 }, { x: -35.0, z:  -4.0 }, { x: -30.0, z: -10.0 }, { x: -26.0, z: -12.0 }
        ]
      },
      {
        name: 'DRIFT PARK GYMKHANA',
        jumps: [],
        wps: [
          { x: -20.0, z: -12.0 }, { x:   0.0, z: -12.0 }, { x:  22.0, z: -12.0 }, { x:  32.0, z:   2.0 },
          { x:  14.0, z:   4.0 }, { x:  28.0, z:  20.0 }, { x:   4.0, z:  24.0 }, { x:   2.0, z:   2.0 },
          { x: -12.0, z:  22.0 }, { x: -30.0, z:  18.0 }, { x: -18.0, z:   2.0 }, { x: -32.0, z:  -6.0 }
        ]
      }
    ];
    let RC_TRACK_WPS = RC_CAR_TRACKS[0].wps;

    // Bordes 3D interior/exterior precalculados (0 allocs por frame)
    const RC_NUM_WPS    = 12;
    const RC_EDGE_IN_X  = new Float32Array(RC_NUM_WPS);
    const RC_EDGE_IN_Z  = new Float32Array(RC_NUM_WPS);
    const RC_EDGE_OUT_X = new Float32Array(RC_NUM_WPS);
    const RC_EDGE_OUT_Z = new Float32Array(RC_NUM_WPS);

    function rebuildRcTrackEdges() {
      const edgeHalfW = 4.35;
      for (let i = 0; i < RC_NUM_WPS; i++) {
        const prev = RC_TRACK_WPS[(i - 1 + RC_NUM_WPS) % RC_NUM_WPS];
        const curr = RC_TRACK_WPS[i];
        const next = RC_TRACK_WPS[(i + 1) % RC_NUM_WPS];
        let d1x = curr.x - prev.x, d1z = curr.z - prev.z;
        let d2x = next.x - curr.x, d2z = next.z - curr.z;
        const l1 = Math.hypot(d1x, d1z) || 1.0;
        const l2 = Math.hypot(d2x, d2z) || 1.0;
        d1x /= l1; d1z /= l1;
        d2x /= l2; d2z /= l2;
        let tx = d1x + d2x, tz = d1z + d2z;
        const tLen = Math.hypot(tx, tz) || 1.0;
        tx /= tLen; tz /= tLen;
        const nx = -tz, nz = tx;
        RC_EDGE_IN_X[i]  = curr.x + nx * edgeHalfW;
        RC_EDGE_IN_Z[i]  = curr.z + nz * edgeHalfW;
        RC_EDGE_OUT_X[i] = curr.x - nx * edgeHalfW;
        RC_EDGE_OUT_Z[i] = curr.z - nz * edgeHalfW;
      }
    }
    rebuildRcTrackEdges();

    function selectRcCarTrack(idx) {
      fcProfile.carTrackIdx = ((idx % RC_CAR_TRACKS.length) + RC_CAR_TRACKS.length) % RC_CAR_TRACKS.length;
      RC_TRACK_WPS = RC_CAR_TRACKS[fcProfile.carTrackIdx].wps;
      rebuildRcTrackEdges();
      if (activeWorldMapMode === 'rccar') generateRcCarTrackVoxelMap();
      if (typeof rcCarSim !== 'undefined') rcCarSim.reset();
    }

    // Ring-buffer estático de marcas de caucho / derrape en el asfalto (24 trazos dobles, 0 allocs)
    const MAX_SKID_SEGMENTS = 24;
    const SKID_AX = new Float32Array(MAX_SKID_SEGMENTS);
    const SKID_AZ = new Float32Array(MAX_SKID_SEGMENTS);
    const SKID_BX = new Float32Array(MAX_SKID_SEGMENTS);
    const SKID_BZ = new Float32Array(MAX_SKID_SEGMENTS);
    const SKID_ON = new Uint8Array(MAX_SKID_SEGMENTS);
    let skidHead = 0;

    // 2 Carros RC Rivales IA en memoria estática
    const CAR_AI_BOTS = [
      { name: 'AI1', px: -12.0, pz: -10.5, py: 0.25, yaw: 1.57, spd: 10.0, wp: 1, laneOff: -1.3, bodyCol: rgb565(250, 115, 24), wingCol: C565.WHITE, spdMax: 14.5 },
      { name: 'AI2', px: -15.0, pz: -13.5, py: 0.25, yaw: 1.57, spd:  9.5, wp: 1, laneOff:  1.3, bodyCol: rgb565(42,  215, 92), wingCol: C565.GOLD,  spdMax: 13.6 }
    ];

    function resetCarAiBots() {
      CAR_AI_BOTS[0].px = -12.0; CAR_AI_BOTS[0].pz = -10.6; CAR_AI_BOTS[0].yaw = Math.PI * 0.5; CAR_AI_BOTS[0].spd = 0.0; CAR_AI_BOTS[0].wp = 1;
      CAR_AI_BOTS[1].px = -14.5; CAR_AI_BOTS[1].pz = -13.4; CAR_AI_BOTS[1].yaw = Math.PI * 0.5; CAR_AI_BOTS[1].spd = 0.0; CAR_AI_BOTS[1].wp = 1;
    }

    function stepCarAiBots(dt) {
      if (!fcProfile.aiBots) return;
      for (let i = 0; i < 2; i++) {
        const b = CAR_AI_BOTS[i];
        const target = RC_TRACK_WPS[b.wp % RC_NUM_WPS];
        const dx = target.x - b.px, dz = target.z - b.pz;
        const dist = Math.hypot(dx, dz);
        if (dist < 6.0) {
          b.wp = (b.wp + 1) % RC_NUM_WPS;
        }
        const desYaw = Math.atan2(dx, dz);
        const yawErr = Math.atan2(Math.sin(desYaw - b.yaw), Math.cos(desYaw - b.yaw));
        b.yaw += Math.max(-3.6, Math.min(3.6, yawErr * 4.5)) * dt;

        const turnBrake = Math.max(0.58, 1.0 - Math.abs(yawErr) * 0.45);
        const targetSpd = b.spdMax * turnBrake;
        b.spd += (targetSpd - b.spd) * Math.min(1.0, dt * 3.5);
        b.px  += Math.sin(b.yaw) * b.spd * dt;
        b.pz  += Math.cos(b.yaw) * b.spd * dt;
        b.py   = getTerrainHeightMeters(b.px, b.pz) + 0.08;
      }
    }

    const RC_CAR_PRESETS = [
      { name: 'BUGGY 4WD',    topSpd: 16.5, accel: 21.0, grip: 1.10, driftSlip: 0.86, steerRate: 35.0, bodyCol: rgb565(32, 148, 250), wingCol: C565.GOLD  },
      { name: 'TOURING PRO',  topSpd: 18.5, accel: 24.0, grip: 1.45, driftSlip: 0.94, steerRate: 32.0, bodyCol: rgb565(240, 48,  42), wingCol: C565.WHITE },
      { name: 'DRIFT SPEC',   topSpd: 15.0, accel: 20.0, grip: 0.64, driftSlip: 0.72, steerRate: 42.0, bodyCol: rgb565(185, 52, 245), wingCol: C565.GREEN }
    ];

    // Buffer estático de partículas de humo de llanta / polvo de tierra (16 partículas, 0 allocs)
    const MAX_CAR_PARTICLES = 16;
    const CAR_PART_X   = new Float32Array(MAX_CAR_PARTICLES);
    const CAR_PART_Y   = new Float32Array(MAX_CAR_PARTICLES);
    const CAR_PART_Z   = new Float32Array(MAX_CAR_PARTICLES);
    const CAR_PART_AGE = new Float32Array(MAX_CAR_PARTICLES);
    const CAR_PART_COL = new Uint16Array(MAX_CAR_PARTICLES);
    let carPartHead = 0;

    // Evalúa distancia mínima de (wx, wz) al trazado del circuito RC y altura de las 2 rampas de salto
    function getRcTrackInfoAt(wx, wz) {
      let minDist = 999.0;
      let bestSeg = 0;
      let bestAlong = 0.0;
      const n = RC_TRACK_WPS.length;

      for (let i = 0; i < n; i++) {
        const a = RC_TRACK_WPS[i];
        const b = RC_TRACK_WPS[(i + 1) % n];
        const vx = b.x - a.x, vz = b.z - a.z;
        const len2 = vx * vx + vz * vz || 1.0;
        let t = ((wx - a.x) * vx + (wz - a.z) * vz) / len2;
        if (t < 0.0) t = 0.0;
        else if (t > 1.0) t = 1.0;
        const px = a.x + vx * t, pz = a.z + vz * t;
        const d  = Math.hypot(wx - px, wz - pz);
        if (d < minDist) {
          minDist = d;
          bestSeg = i;
          bestAlong = i + t * Math.sqrt(len2) * 0.32;
        }
      }

      // Mesetas de Salto (Tabletop Jumps) según la pista activa (0, 2 o 3 saltos)
      let jumpH = 0.0;
      if (minDist < 4.6) {
        const jumps = RC_CAR_TRACKS[fcProfile.carTrackIdx || 0].jumps;
        for (let j = 0; j < jumps.length; j++) {
          const dJ = Math.hypot(wx - jumps[j].x, wz - jumps[j].z);
          if (dJ < 4.5) {
            jumpH = Math.max(jumpH, Math.cos((dJ / 4.5) * Math.PI * 0.5) * 1.18);
          }
        }
      }

      return { dist: minDist, segIdx: bestSeg, along: bestAlong, jumpH };
    }

    function generateRcCarTrackVoxelMap() {
      activeWorldMapMode = 'rccar';
      choroBakedInPsram  = false;
      WORLD_W_M   = 160.0;
      WORLD_H_M   = 120.0;
      MAP_SCALE_X = MAP_W / WORLD_W_M;
      MAP_SCALE_Z = MAP_H / WORLD_H_M;

      // 1. Cielo de circuito de carreras
      for (let mz = 0; mz < SKY_DIM; mz++) {
        const zOff = mz << SKY_SHIFT;
        for (let mx = 0; mx < SKY_DIM; mx++) {
          const cn = fbmCloud(mx, mz);
          const cloudDensity = Math.max(0, Math.min(1, (cn - 0.08) * 1.8));
          const cSmooth = cloudDensity * cloudDensity * (3 - 2 * cloudDensity);
          const sr = 38 * (1 - cSmooth) + 248 * cSmooth;
          const sg = 88 * (1 - cSmooth) + 250 * cSmooth;
          const sb = 178 * (1 - cSmooth) + 254 * cSmooth;
          voxSkyMap[zOff + mx] = rgb565(clampByte(sr), clampByte(sg), clampByte(sb));
        }
      }

      // 2. Hornear el Circuito de Asfalto Oscuro de Alto Contraste + Pianos Rojo/Blanco + 2 Rampas + Césped en PSRAM
      const TRACK_HALF_W = 4.2;
      const CURB_OUTER_W = 5.55;

      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const wz   = (mz - SPAWN_MZ) / MAP_SCALE_Z;

        for (let mx = 0; mx < MAP_W; mx++) {
          const wx = (mx - SPAWN_MX) / MAP_SCALE_X;

          // Optimización rápida fuera del rectángulo del circuito (-44..+44, -22..+34)
          if (wx < -44.0 || wx > 44.0 || wz < -22.0 || wz > 34.0) {
            const borderDist = Math.max(Math.abs(wx) - 44.0, Math.abs(wz - 6.0) - 28.0);
            const hHill = borderDist > 10.0 ? Math.min(48, Math.round(2 + (borderDist - 10.0) * 0.75)) : 2;
            voxHeight[zOff + mx] = hHill;
            const mowerStripe = ((mx >> 4) + ((mz >> 4) & 1)) & 1;
            const r = mowerStripe ? 46 : 58;
            const g = mowerStripe ? 112 : 128;
            const b = mowerStripe ? 42 : 48;
            voxColor[zOff + mx] = rgb565(r, g, b);
            continue;
          }

          const info = getRcTrackInfoAt(wx, wz);
          const d = info.dist;

          if (d <= TRACK_HALF_W) {
            // Asfalto oscuro de alto contraste + líneas blancas de borde + línea central y 2 rampas de salto
            const hVox = Math.min(64, Math.round(2 + (info.jumpH / HEIGHT_SCALE)));
            voxHeight[zOff + mx] = hVox;

            const grain = ((mx * 17 ^ mz * 31) & 3) * 2;
            let r = 38 + grain, g = 42 + grain, b = 50 + grain;

            // Línea de Salida/Meta ajedrezada blanca/negra en wx ~ 0, wz ~ -12
            if (Math.abs(wx) < 1.25 && Math.abs(wz + 12.0) <= TRACK_HALF_W) {
              const check = ((mx >> 2) ^ (mz >> 2)) & 1;
              r = check ? 250 : 20;
              g = check ? 250 : 20;
              b = check ? 250 : 24;
            } else if (info.jumpH > 0.12) {
              // Franjas amarillas/naranjas de alta visibilidad en las 2 rampas de salto
              const stripe = ((mx + mz) >> 2) & 1;
              if (stripe) {
                r = 245; g = 190; b = 28;
              } else {
                r = 68; g = 72; b = 82;
              }
            } else if (d > TRACK_HALF_W - 0.52) {
              // Línea blanca ancha continua en ambos bordes del asfalto
              r = 244; g = 248; b = 252;
            } else if (d < 0.28 && (Math.floor(info.along * 2.5) & 1)) {
              // Línea discontinua amarilla central de guía de trazada
              r = 230; g = 195; b = 45;
            }
            voxColor[zOff + mx] = rgb565(clampByte(r), clampByte(g), clampByte(b));
          } else if (d <= CURB_OUTER_W) {
            // Pianos (Curbs) anchos alternados Rojo y Blanco en los bordes de la pista
            voxHeight[zOff + mx] = 3;
            const curbBand = (Math.floor(info.along * 3.0) & 1);
            if (curbBand) {
              voxColor[zOff + mx] = rgb565(242, 38, 32); // Rojo Racing Brillante
            } else {
              voxColor[zOff + mx] = rgb565(248, 250, 254); // Blanco Puro
            }
          } else {
            // Infield de césped verde vivo en franjas para máximo contraste con el asfalto oscuro
            voxHeight[zOff + mx] = 2;
            const mowerStripe = ((mx >> 4) + ((mz >> 4) & 1)) & 1;
            voxColor[zOff + mx] = mowerStripe ? rgb565(48, 118, 44) : rgb565(62, 136, 54);
          }
        }
      }
    }

    // Dibuja el Modelo 3D Sólido del Carro RC 1/10 (Carrocería, Cabina, Alerón Trasero y 4 Ruedas con Dirección Viva)
    function renderSolidRcCar320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      // Escala visual 1.65x para que a distancia LOS se distingan claramente las 4 ruedas, el alerón y la suspensión
      const S = 1.65;
      function wp(r, u, f) {
        return projPoint320(
          px + (rx * r + ux * u + fx * f) * S,
          py + (ry * r + uy * u + fy * f) * S,
          pz + (rz * r + uz * u + fz * f) * S
        );
      }

      const preset   = RC_CAR_PRESETS[sim.presetIdx];
      const C_BODY   = preset.bodyCol;
      const C_HOOD   = C565.WHITE;
      const C_GLASS  = rgb565(28, 38, 54);
      const C_CHASS  = rgb565(42, 46, 54);
      const C_WING   = preset.wingCol;
      const C_TIRE   = rgb565(24, 28, 32);
      const C_RIM    = sim.presetIdx === 2 ? C565.GREEN : C565.GOLD;

      let fc = 0;

      // 0. Sombra 3D proyectada directamente sobre el asfalto (groundY) debajo del chasis:
      //    Fundamental cuando el carro salta por las rampas para ver la altura exacta sobre la pista
      const groundY = getTerrainHeightMeters(px, pz) + 0.03;
      const shCos = Math.cos(sim.yaw), shSin = Math.sin(sim.yaw);
      function wpGroundShadow(r, f) {
        const wx = px + (shCos * r + shSin * f) * S;
        const wz = pz + (-shSin * r + shCos * f) * S;
        return projPoint320(wx, groundY, wz);
      }
      const shFL = wpGroundShadow(-0.56,  0.98), shFR = wpGroundShadow( 0.56,  0.98);
      const shRL = wpGroundShadow(-0.56, -0.98), shRR = wpGroundShadow( 0.56, -0.98);
      fc = addCraftQuad(fc, shFL, shFR, shRR, shRL, rgb565(14, 18, 24));

      // 1. Chasis y Carrocería principal
      const noseL = wp(-0.42, 0.14,  1.05), noseR = wp( 0.42, 0.14,  1.05);
      const hoodL = wp(-0.52, 0.28,  0.42), hoodR = wp( 0.52, 0.28,  0.42);
      const roofF = wp( 0.00, 0.52,  0.10);
      const roofL = wp(-0.38, 0.50, -0.32), roofR = wp( 0.38, 0.50, -0.32);
      const rearL = wp(-0.52, 0.30, -0.92), rearR = wp( 0.52, 0.30, -0.92);
      const botFL = wp(-0.50, 0.08,  0.95), botFR = wp( 0.50, 0.08,  0.95);
      const botRL = wp(-0.50, 0.08, -0.92), botRR = wp( 0.50, 0.08, -0.92);

      // Costados, capó bicolor, parabrisas y techo
      fc = addCraftQuad(fc, botFL, botRL, rearL, hoodL, C_BODY);
      fc = addCraftQuad(fc, botFR, hoodR, rearR, botRR, C_BODY);
      fc = addCraftQuad(fc, noseL, noseR, hoodR, hoodL, C_HOOD);
      fc = addCraftQuad(fc, noseL, hoodL, botFL, botFR, C_CHASS);
      fc = addCraftTri(fc, hoodL, hoodR, roofF, C_GLASS);
      fc = addCraftTri(fc, hoodL, roofF, roofL, C_GLASS);
      fc = addCraftTri(fc, hoodR, roofR, roofF, C_GLASS);
      fc = addCraftQuad(fc, roofL, roofR, rearR, rearL, C_BODY);
      fc = addCraftQuad(fc, rearL, rearR, botRR, botRL, C_CHASS);

      // 2. Alerón Trasero (Rear Wing) elevado
      const wL1 = wp(-0.58, 0.58, -0.82), wR1 = wp( 0.58, 0.58, -0.82);
      const wL2 = wp(-0.58, 0.66, -1.08), wR2 = wp( 0.58, 0.66, -1.08);
      fc = addCraftQuad(fc, wL1, wR1, wR2, wL2, C_WING);

      // 3. Las 4 Ruedas 3D (con las 2 delanteras girando según steerAngle)
      const wheelDefs = [
        { r: -0.62, f:  0.68, isFront: true  },
        { r:  0.62, f:  0.68, isFront: true  },
        { r: -0.64, f: -0.68, isFront: false },
        { r:  0.64, f: -0.68, isFront: false }
      ];
      const stCos = Math.cos(sim.steerAngle), stSin = Math.sin(sim.steerAngle);
      const wRad = 0.24, wHalfW = 0.12;

      for (let w = 0; w < 4; w++) {
        const wd = wheelDefs[w];
        const cF = wd.isFront ? stCos : 1.0;
        const sF = wd.isFront ? stSin : 0.0;
        const sideSign = wd.r >= 0 ? 1.0 : -1.0;
        const outR = wd.r + sideSign * wHalfW * cF;
        const outF = wd.f - sideSign * wHalfW * sF;

        const pTop = wp(outR, wRad * 1.95, outF);
        const pBot = wp(outR, 0.02,        outF);
        const pFrt = wp(outR + sF * wRad, wRad, outF + cF * wRad);
        const pBck = wp(outR - sF * wRad, wRad, outF - cF * wRad);

        fc = addCraftQuad(fc, pTop, pFrt, pBot, pBck, C_TIRE);
        const pHub = wp(outR + sideSign * 0.02, wRad, outF);
        if (pHub) drawInavCircleDot320(pHub.sx, pHub.sy, 2, C_RIM);
      }

      renderSortedCraftFaces(fc);
    }

    function renderRcTrackPropsAndParticles320(sim, projPoint320, projLine) {
      // 1. Bordes 3D Interior y Exterior de toda la pista (hace que cada curva y horquilla se entienda al 100% desde el podio)
      for (let i = 0; i < RC_NUM_WPS; i++) {
