    function resetRcInputDefaults() {
      rcInputConfig.mapMode = 0;
      rcInputConfig.thrMode = 0;
      rcInputConfig.deadzone = 0.03;
      rcInputConfig.invThr = 1;
      rcInputConfig.invYaw = 1;
      rcInputConfig.invPit = 1;
      rcInputConfig.invRol = 1;
      rcInputConfig.trimYaw = 0.0;
      rcInputConfig.trimPit = 0.0;
      rcInputConfig.trimRol = 0.0;
    }

    function resetWorldDefaults() {
      fcProfile.windScale = 1.0;
      fcProfile.windDirMode = 0;
      fcProfile.treeDensity = 1.0;
      fcProfile.showSplinePath = 1;
      fpvDroneSim. propwash = 1.0;
    }

    function adjustTuningParameter(tab, row, dir) {
      playTone(dir > 0 ? 690 : 540, 0.025);
      const activeSim = activeRomId === 'fpv_wing' ? fpvWingSim : fpvDroneSim;

      if (tab === 0) {
        // Pestaña 0 [WORLD]: Aeronave, Mapa, Circuito, Cámara, Viento (Fuerza y Dirección), Árboles, Spline y Sonido
        if (row === 0) {
          const keepCam = activeSim.chaseCam;
          const nextId = activeRomId === 'fpv_drone' ? 'fpv_wing' : 'fpv_drone';
          activeRomId = nextId;
          if (nextId === 'fpv_drone') {
            fpvDroneSim.chaseCam = keepCam;
            fpvDroneSim.reset();
            showToast('AERONAVE: FPV DRONE 5"');
          } else {
            fpvWingSim.chaseCam = keepCam;
            fpvWingSim.reset();
            showToast('AERONAVE: ALA FIJA FPV');
          }
        } else if (row === 1) {
          generateGentleVoxelMap(currentThemeIdx + dir);
          showToast(`MAPA: ${TERRAIN_THEMES[currentThemeIdx].name}`);
        } else if (row === 2) {
          selectChoroboboCircuit(currentCircuitIdx + dir, activeSim, true);
        } else if (row === 3) {
          activeSim.chaseCam = !activeSim.chaseCam;
          fpvDroneSim.chaseCam = activeSim.chaseCam;
          fpvWingSim.chaseCam  = activeSim.chaseCam;
          showToast(activeSim.chaseCam ? 'VISTA: FOLLOW 3D MODERNO' : 'VISTA: CABINA FPV');
        } else if (row === 4) {
          fcProfile.windScale = Math.max(0.0, Math.min(2.0, Math.round((fcProfile.windScale + dir * 0.2) * 10) / 10));
          fcProfile.drone.propwash = fcProfile.windScale;
          showToast(`VIENTO: ${Math.round(fcProfile.windScale * 100)}%`);
        } else if (row === 5) {
          const nDirs = WIND_DIR_NAMES.length;
          fcProfile.windDirMode = (((fcProfile.windDirMode || 0) + dir) % nDirs + nDirs) % nDirs;
          showToast(`RUMBO VIENTO: ${WIND_DIR_NAMES[fcProfile.windDirMode]}`);
        } else if (row === 6) {
          const densities = [0.0, 0.5, 1.0];
          let curIdx = fcProfile.treeDensity <= 0.1 ? 0 : (fcProfile.treeDensity < 0.8 ? 1 : 2);
          curIdx = ((curIdx + dir) % 3 + 3) % 3;
          fcProfile.treeDensity = densities[curIdx];
          showToast(`ARBOLES: ${Math.round(fcProfile.treeDensity * 100)}%`);
        } else if (row === 7) {
          fcProfile.showSplinePath = fcProfile.showSplinePath ? 0 : 1;
          showToast(fcProfile.showSplinePath ? 'CAMINO GUIA: ON' : 'CAMINO GUIA: OFF');
        } else if (row === 8) {
          soundEnabled = !soundEnabled;
          showToast(soundEnabled ? 'AUDIO: ACTIVADO' : 'AUDIO: SILENCIADO');
        }
      } else if (tab === 1) {
        // Pestaña 1 [WING]: Modelo de Ala/Avión, Modo de Vuelo, Rates, Rudder, Expo, Carga Alar, Motor y Modo de Gas
        const w = fcProfile.wing;
        if (row === 0) {
          applyWingPreset(fcProfile.wingPresetIdx + dir);
          showToast(`${w.name} (${w.hasRudder ? 'CON RUDDER' : 'SIN RUDDER'})`);
        } else if (row === 1) {
          const modes = ['MANU', 'ACRO', 'HOR'];
          const nextIdx = ((modes.indexOf(fpvWingSim.mode) + dir) % modes.length + modes.length) % modes.length;
          fpvWingSim.mode = modes[nextIdx];
          showToast(`MODO ALA: ${fpvWingSim.mode}`);
        } else if (row === 2) {
          w.pitchRate = Math.max(90, Math.min(420, w.pitchRate + dir * 15));
        } else if (row === 3) {
          w.rollRate = Math.max(120, Math.min(540, w.rollRate + dir * 20));
        } else if (row === 4) {
          w.yawRate = Math.max(0, Math.min(240, w.yawRate + dir * 15));
          w.hasRudder = w.yawRate > 0 ? 1 : 0;
          if (w.hasRudder && !w.rudderRoll) w.rudderRoll = 0.30;
          showToast(w.hasRudder ? `RUDDER ACTIVO: ${w.yawRate} D/S` : 'ALA VOLANTE: SIN RUDDER');
        } else if (row === 5) {
          w.expo = Math.max(0.0, Math.min(0.80, Math.round((w.expo + dir * 0.04) * 100) / 100));
        } else if (row === 6) {
          w.wingLoad = Math.max(0.65, Math.min(1.50, Math.round((w.wingLoad + dir * 0.05) * 100) / 100));
        } else if (row === 7) {
          w.maxThrustAcc = Math.max(11.0, Math.min(30.0, Math.round((w.maxThrustAcc + dir * 1.5) * 10) / 10));
        } else if (row === 8) {
          w.thrHold = w.thrHold ? 0 : 1;
          if (rcInputConfig.thrMode === 2 || rcInputConfig.thrMode === 3) rcInputConfig.thrMode = 0;
          showToast(w.thrHold ? 'THR ALA: FIJO (STICK IZQ)' : 'THR ALA: DIRECTO (RESORTE)');
        }
      } else if (tab === 2) {
        // Pestaña 2 [DRONE]: Preset, Modo de Vuelo, Rates P/R y Yaw, Expo, Masa, Potencia, Tilt de Cámara y AirMode
        const d = fcProfile.drone;
        if (row === 0) {
          applyDronePreset(fcProfile.dronePresetIdx + dir);
          showToast(`PRESET: ${d.name}`);
        } else if (row === 1) {
          fpvDroneSim.mode = fpvDroneSim.mode === 'ACRO' ? 'HOR' : 'ACRO';
          showToast(`MODO DRON: ${fpvDroneSim.mode}`);
        } else if (row === 2) {
          d.rcRate = Math.max(200, Math.min(960, d.rcRate + dir * 20));
          d.centerSens = Math.min(d.rcRate - 40, Math.max(70, Math.round(d.rcRate * 0.30)));
        } else if (row === 3) {
          d.yawRate = Math.max(100, Math.min(600, d.yawRate + dir * 20));
        } else if (row === 4) {
          d.expo = Math.max(0.0, Math.min(0.85, Math.round((d.expo + dir * 0.04) * 100) / 100));
        } else if (row === 5) {
          d.massKg = Math.max(0.35, Math.min(0.95, Math.round((d.massKg + dir * 0.04) * 100) / 100));
        } else if (row === 6) {
          d.maxThrustAcc = Math.max(20.0, Math.min(48.0, Math.round((d.maxThrustAcc + dir * 2.0) * 10) / 10));
        } else if (row === 7) {
          d.camTilt = Math.max(5, Math.min(45, d.camTilt + dir * 3));
        } else if (row === 8) {
          d.airMode = d.airMode ? 0 : 1;
        }
      } else {
        // Pestaña 3 [RC/PAD]: Mapeo de Emisora TX16S / Gamepad BT, Modo Throttle, Deadzone, Inversión, Calibrar y Launcher
        if (row === 0) {
          rcInputConfig.mapMode = ((rcInputConfig.mapMode + dir) % RC_MAP_NAMES.length + RC_MAP_NAMES.length) % RC_MAP_NAMES.length;
          showToast(`MAP: ${RC_MAP_NAMES[rcInputConfig.mapMode]}`);
        } else if (row === 1) {
          rcInputConfig.thrMode = ((rcInputConfig.thrMode + dir) % RC_THR_NAMES.length + RC_THR_NAMES.length) % RC_THR_NAMES.length;
          showToast(`THR: ${RC_THR_NAMES[rcInputConfig.thrMode]}`);
        } else if (row === 2) {
          rcInputConfig.deadzone = Math.max(0.0, Math.min(0.18, Math.round((rcInputConfig.deadzone + dir * 0.01) * 100) / 100));
        } else if (row === 3) {
          rcInputConfig.invThr *= -1;
        } else if (row === 4) {
          rcInputConfig.invYaw *= -1;
        } else if (row === 5) {
          rcInputConfig.invPit *= -1;
        } else if (row === 6) {
          rcInputConfig.invRol *= -1;
        } else if (row === 7) {
          calibrateControllerCenter();
          showToast('STICKS CENTRADOS OK');
        } else if (row === 8) {
          rgTuningOpen = false;
          rgOverlayOpen = false;
          osState = 'launcher';
          setFaceLabels('TEMA', 'MENU', 'WING', 'RUN', 'TOUCH/DPAD/STICK:NAV | A:RUN');
          showToast('RETRO-GO LAUNCHER');
        }
      }
    }

    function renderWorldMinimapPanel320(gx0, gy0, gw, gh) {
      // Panel Derecho en 320x240 para [WORLD]: Radar Táctico Cenital (Mapa + Edificios + Circuito + Aeronave + Vector Viento)
      for (let y = gy0; y <= gy0 + gh; y++) {
        vram565.fill(rgb565(10, 18, 28), y * DISP_W + gx0, y * DISP_W + gx0 + gw);
        setPx320(gx0, y, C565.CYAN);
        setPx320(gx0 + gw, y, C565.CYAN);
      }
      for (let x = gx0; x <= gx0 + gw; x++) {
        setPx320(x, gy0, C565.CYAN);
        setPx320(x, gy0 + gh, C565.CYAN);
      }

      const sizeLbl = WORLD_W_M >= 1000 ? `${(WORLD_W_M / 1000).toFixed(1)}X${(WORLD_H_M / 1000).toFixed(1)}KM` : `${Math.round(WORLD_W_M)}X${Math.round(WORLD_H_M)}M`;
      drawInavText320(`MAP ${sizeLbl}`, gx0 + 4, gy0 + 4, C565.CYAN);

      // Área del radar top-down (x: gx0+4 .. gx0+gw-4, y: gy0+18 .. gy0+112)
      const rx0 = gx0 + 4, ry0 = gy0 + 18, rw = gw - 8, rh = 92;
      const rcx = rx0 + (rw >> 1), rcy = ry0 + (rh >> 1);
      const mapBg = TERRAIN_THEMES[currentThemeIdx].isChorobobo ? rgb565(36, 48, 32) : rgb565(24, 38, 30);
      for (let y = ry0; y <= ry0 + rh; y++) {
        vram565.fill(mapBg, y * DISP_W + rx0, y * DISP_W + rx0 + rw);
        setPx320(rx0, y, C565.GREY);
        setPx320(rx0 + rw, y, C565.GREY);
      }
      for (let x = rx0; x <= rx0 + rw; x++) {
        setPx320(x, ry0, C565.GREY);
        setPx320(x, ry0 + rh, C565.GREY);
      }
      // Cruz central (0,0) de referencia
      for (let d = -3; d <= 3; d++) {
        setPx320(rcx + d, rcy, C565.GREY);
        setPx320(rcx, rcy + d, C565.GREY);
      }

      // Escala de conversión de metros del mundo a píxeles del radar
      const spanX = WORLD_W_M * 0.46;
      const spanZ = WORLD_H_M * 0.46;
      const scaleX = (rw * 0.46) / spanX;
      const scaleZ = (rh * 0.46) / spanZ;

      // 1. Dibujar edificios como pequeños bloques en el radar
      for (let i = 0; i < WORLD_BUILDINGS.length; i++) {
        const b = WORLD_BUILDINGS[i];
        const bx = Math.round(rcx + b.x * scaleX);
        const by = Math.round(rcy - b.z * scaleZ);
        if (bx > rx0 + 1 && bx < rx0 + rw - 1 && by > ry0 + 1 && by < ry0 + rh - 1) {
          setPx320(bx, by, C565.ORANGE);
          setPx320(bx + 1, by, C565.ORANGE);
        }
      }

      // 2. Dibujar trazado Spline y las 15 puertas del circuito activo
      const activeSim = activeRomId === 'fpv_wing' ? fpvWingSim : fpvDroneSim;
      if (!isFreeFlightNoGates()) {
        const circuit = CHOROBOBO_CIRCUITS[currentCircuitIdx];
        const sPts = circuit.splinePts;
        for (let i = 0; i < sPts.length; i++) {
          const sp = sPts[i];
          const sx = Math.round(rcx + sp.x * scaleX);
          const sy = Math.round(rcy - sp.z * scaleZ);
          if (sx > rx0 && sx < rx0 + rw && sy > ry0 && sy < ry0 + rh) {
            setPx320(sx, sy, circuit.lineCol565);
          }
        }
        const gates = circuit.gates;
        for (let i = 0; i < gates.length; i++) {
          const g = gates[i];
          const gx = Math.round(rcx + g.x * scaleX);
          const gy = Math.round(rcy - g.z * scaleZ);
          if (gx > rx0 + 1 && gx < rx0 + rw - 1 && gy > ry0 + 1 && gy < ry0 + rh - 1) {
            const isAct = (i === activeSim.activeGate);
            const gCol = isAct ? C565.GREEN : C565.WHITE;
            setPx320(gx, gy, gCol);
            if (isAct) {
              setPx320(gx - 1, gy, gCol); setPx320(gx + 1, gy, gCol);
              setPx320(gx, gy - 1, gCol); setPx320(gx, gy + 1, gCol);
            }
          }
        }
      }

      // 3. Dibujar posición y rumbo actual de la aeronave
      const ax = Math.max(rx0 + 3, Math.min(rx0 + rw - 3, Math.round(rcx + activeSim.px * scaleX)));
      const ay = Math.max(ry0 + 3, Math.min(ry0 + rh - 3, Math.round(rcy - activeSim.pz * scaleZ)));
      const hLen = Math.hypot(activeSim.fx, activeSim.fz) || 1.0;
      const hx = activeSim.fx / hLen, hz = activeSim.fz / hLen;
      drawOutlinedLine320(ax, ay, Math.round(ax + hx * 6), Math.round(ay - hz * 6), C565.GOLD);
      drawInavCircleDot320(ax, ay, 2, C565.WHITE);

      // 4. Indicador inferior de Viento en vivo (velocidad en KM/H + flecha de dirección)
      const windMs  = Math.hypot(aeroEnv.windX, aeroEnv.windZ);
      const windKmh = Math.round(windMs * 3.6);
      drawInavText320(`WND:${windKmh}KMH`, gx0 + 4, gy0 + 114, C565.GOLD);
      drawInavText320(isFreeFlightNoGates() ? 'FREE FLY' : `${CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode}:15 GATE`, gx0 + 4, gy0 + 131, C565.GREEN);

      // Rosa de viento en la esquina inferior derecha del panel
      const wcx = gx0 + gw - 16, wcy = gy0 + 126;
      drawInavCircleDot320(wcx, wcy, 9, rgb565(24, 36, 54));
      if (windMs > 0.2) {
        const wxN = aeroEnv.windX / windMs, wzN = aeroEnv.windZ / windMs;
        drawOutlinedLine320(wcx - Math.round(wxN * 6), wcy + Math.round(wzN * 6), wcx + Math.round(wxN * 7), wcy - Math.round(wzN * 7), C565.CYAN);
        setPx320(wcx + Math.round(wxN * 7), wcy - Math.round(wzN * 7), C565.GOLD);
      }
    }

    function updateAndRenderTuningMenu(dt) {
      if (navCooldown > 0) navCooldown -= dt;
      const numRows = 9;
      const numTabs = 4; // 0 = [WORLD], 1 = [WING], 2 = [DRONE], 3 = [RC/PAD]

      // Interacción táctil directa sobre la pantalla IPS 320x240 (128x64 lógicos)
      if (capTouch.justTapped) {
        if (capTouch.ly64 <= 10) {
          if (capTouch.lx128 < 29)      { rgTuningTab = 0; playTone(640, 0.03); }
          else if (capTouch.lx128 < 52) { rgTuningTab = 1; playTone(640, 0.03); }
          else if (capTouch.lx128 < 78) { rgTuningTab = 2; playTone(640, 0.03); }
          else if (capTouch.lx128 < 107){ rgTuningTab = 3; playTone(640, 0.03); }
          else { rgTuningOpen = false; rgOverlayOpen = false; playTone(520, 0.03); return; }
        } else if (capTouch.ly64 >= 11 && capTouch.ly64 <= 53 && capTouch.lx128 <= 82) {
          const clickedRow = Math.floor((capTouch.ly64 - 11) / 4.7);
          if (clickedRow >= 0 && clickedRow < numRows) {
            if (rgTuningCursor === clickedRow) {
              adjustTuningParameter(rgTuningTab, rgTuningCursor, capTouch.lx128 > 45 ? 1 : -1);
            } else {
              rgTuningCursor = clickedRow;
              playTone(480, 0.02);
            }
          }
        } else if (capTouch.ly64 > 53) {
          if (capTouch.lx128 < 34) adjustTuningParameter(rgTuningTab, rgTuningCursor, -1);
          else if (capTouch.lx128 < 68) adjustTuningParameter(rgTuningTab, rgTuningCursor, 1);
          else if (capTouch.lx128 < 98) {
            if (rgTuningTab === 0) resetWorldDefaults();
            else if (rgTuningTab === 1) applyWingPreset(fcProfile.wingPresetIdx);
            else if (rgTuningTab === 2) applyDronePreset(fcProfile.dronePresetIdx);
            else resetRcInputDefaults();
            showToast('DEFAULTS RESTORED');
          } else {
            rgTuningOpen = false;
            rgOverlayOpen = false;
            playTone(760, 0.04);
            return;
          }
        }
        capTouch.justTapped = false;
      }

      // En la pestaña [RC/PAD] (tab 3) dejamos libres los sticks analógicos para poder probarlos en las barras PWM sin mover el cursor
      const navY = rgTuningTab === 3 ? 0 : (isRadioThrottleActive() ? hwInput.ry : hwInput.ly);
      const navX = rgTuningTab === 3 ? 0 : hwInput.lx;

      if (navCooldown <= 0) {
        if (navY < -0.45 || hwInput.justPressed('DOWN')) {
          rgTuningCursor = (rgTuningCursor + 1) % numRows;
          navCooldown = 0.16;
          playTone(480, 0.02);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgTuningCursor = (rgTuningCursor - 1 + numRows) % numRows;
          navCooldown = 0.16;
          playTone(480, 0.02);
        } else if (navX > 0.50 || hwInput.justPressed('RIGHT') || hwInput.justPressed('A')) {
          adjustTuningParameter(rgTuningTab, rgTuningCursor, 1);
          navCooldown = 0.16;
        } else if (navX < -0.50 || hwInput.justPressed('LEFT')) {
          adjustTuningParameter(rgTuningTab, rgTuningCursor, -1);
          navCooldown = 0.16;
        }
      }

      if (hwInput.justPressed('Y') || hwInput.justPressed('SELECT')) {
        rgTuningTab = (rgTuningTab + 1) % numTabs;
        playTone(640, 0.03);
      }
      if (hwInput.justPressed('X')) {
        if (rgTuningTab === 0) resetWorldDefaults();
        else if (rgTuningTab === 1) applyWingPreset(fcProfile.wingPresetIdx);
        else if (rgTuningTab === 2) applyDronePreset(fcProfile.dronePresetIdx);
        else calibrateControllerCenter();
        showToast(rgTuningTab === 3 ? 'STICKS CENTRADOS' : 'VALORES POR DEFECTO');
        playTone(580, 0.04);
      }
      if (hwInput.justPressed('B')) {
        rgTuningOpen = false;
        rgOverlayOpen = false;
        playTone(740, 0.04);
        return;
      }

      // Fondo oscuro sobre el framebuffer 320x240
      fbRect(2, 2, 124, 60, true, 0);
      fbRect(2, 2, 124, 60, false, 5);
      fbRect(2, 2, 124, 8, true, 8);

      // 4 Pestañas superiores + Botón [FLY]: [WORLD] | [WING] | [DRONE] | [RC/PAD] | [FLY]
      fbRect(4, 3, 24, 6, true, rgTuningTab === 0 ? 3 : 8);
      fbDrawText('WORLD', 6, 4, rgTuningTab === 0 ? 0 : 1);

      fbRect(30, 3, 21, 6, true, rgTuningTab === 1 ? 2 : 8);
      fbDrawText('WING', 33, 4, rgTuningTab === 1 ? 0 : 1);

      fbRect(53, 3, 24, 6, true, rgTuningTab === 2 ? 5 : 8);
      fbDrawText('DRONE', 55, 4, rgTuningTab === 2 ? 0 : 1);

      fbRect(79, 3, 27, 6, true, rgTuningTab === 3 ? 9 : 8);
      fbDrawText('RC/PAD', 81, 4, rgTuningTab === 3 ? 0 : 1);

      fbRect(108, 3, 16, 6, true, 4);
      fbDrawText('FLY', 110, 4, 1);

      // Lista de 9 parámetros configurables en columna izquierda (nativa en 320x240 usando OSD ROM)
      const d = fcProfile.drone;
      const w = fcProfile.wing;
      const activeSim = activeRomId === 'fpv_wing' ? fpvWingSim : fpvDroneSim;
      const mapShort = ['AUTO', 'TX16S AETR', 'PAD MODE2', 'RC TAER', 'ANDROID BT'][rcInputConfig.mapMode];
      const thrShort = ['AUTO(W:FIJO)', 'RADIO 0-100', 'FIJO (INC)', 'SPRING DIR'][rcInputConfig.thrMode];
      const treeLbl  = fcProfile.treeDensity >= 0.9 ? '100% (ALTA)' : (fcProfile.treeDensity >= 0.4 ? '50% (MEDIA)' : 'OFF (LIMPIO)');

      const labels = rgTuningTab === 0 ? [
        `SIM :${activeRomId === 'fpv_wing' ? 'ALA FIJA FPV' : 'FPV DRONE 5"'}`,
        `MAPA:${TERRAIN_THEMES[currentThemeIdx].name.slice(0, 17)}`,
        `CIRC:${getActiveCircuitLabel().slice(0, 17)}`,
        `VIEW:${activeSim.chaseCam ? 'FOLLOW 3D' : 'FPV CABINA'}`,
        `WIND:${Math.round(fcProfile.windScale * 100)}% (${Math.round(Math.hypot(aeroEnv.windX, aeroEnv.windZ) * 3.6)}KMH)`,
        `WDIR:${WIND_DIR_NAMES[fcProfile.windDirMode || 0]}`,
        `TREE:${treeLbl}`,
        `PATH:${fcProfile.showSplinePath ? 'LUCES GUIA ON' : 'OFF (LIMPIO)'}`,
        `SND :${soundEnabled ? 'AUDIO ON' : 'AUDIO MUTE'}`
      ] : (rgTuningTab === 1 ? [
        `TYPE:${w.name}`,
        `MODO:${fpvWingSim.mode} (WING)`,
        `PIT :${w.pitchRate} D/S`,
        `ROL :${w.rollRate} D/S`,
        `RUDD:${w.hasRudder && w.yawRate > 0 ? w.yawRate + ' D/S' : 'OFF (WING)'}`,
        `EXPO:${Math.round(w.expo * 100)}%`,
        `LOAD:${Math.round(w.wingLoad * 100)}%`,
        `PWR :${Math.round(w.maxThrustAcc)}M/S2`,
        `THRL:${w.thrHold ? 'FIJO (INC)' : 'RESORTE'}`
      ] : (rgTuningTab === 2 ? [
        `PSET:${d.name}`,
        `MODO:${fpvDroneSim.mode} (QUAD)`,
        `P/R :${d.rcRate} D/S`,
        `YAW :${d.yawRate} D/S`,
        `EXPO:${Math.round(d.expo * 100)}%`,
        `MASS:${Math.round(d.massKg * 1000)}G`,
        `PWR :${Math.round(d.maxThrustAcc)}M/S2`,
        `TILT:${d.camTilt} DEG`,
        `AIRM:${d.airMode ? 'ON (BF)' : 'OFF'}`
      ] : [
        `MAP :${mapShort}`,
        `THR :${thrShort}`,
        `DEAD:${Math.round(rcInputConfig.deadzone * 100)}%`,
        `INVT:${rcInputConfig.invThr > 0 ? 'NORM' : 'INVERT'}`,
        `INVY:${rcInputConfig.invYaw > 0 ? 'NORM' : 'INVERT'}`,
        `INVP:${rcInputConfig.invPit > 0 ? 'NORM' : 'INVERT'}`,
        `INVR:${rcInputConfig.invRol > 0 ? 'NORM' : 'INVERT'}`,
        `CENT:A=CALIBRAR`,
        `EXIT:A=LAUNCHER`
      ]));

      for (let i = 0; i < numRows; i++) {
        const py320 = 42 + i * 17;
        const isSel = (i === rgTuningCursor);
        if (isSel) {
          for (let y = py320 - 1; y < py320 + 13; y++) {
            vram565.fill(C565.NAVY, y * DISP_W + 10, y * DISP_W + 202);
          }
        }
        drawInavText320((isSel ? '>' : ' ') + labels[i], 12, py320, isSel ? C565.GOLD : C565.WHITE);
      }

      if (rgTuningTab === 0) {
        renderWorldMinimapPanel320(206, 42, 104, 148);
      } else if (rgTuningTab === 3) {
        // Panel Derecho en 320x240 para [RC/PAD]: Monitor de Canales PWM (1000..2000 us) estilo Betaflight Receiver
        const gx0 = 206, gy0 = 42, gw = 104, gh = 148;
        for (let y = gy0; y <= gy0 + gh; y++) {
          vram565.fill(rgb565(10, 16, 28), y * DISP_W + gx0, y * DISP_W + gx0 + gw);
          setPx320(gx0, y, C565.CYAN);
          setPx320(gx0 + gw, y, C565.CYAN);
        }
        for (let x = gx0; x <= gx0 + gw; x++) {
          setPx320(x, gy0, C565.CYAN);
          setPx320(x, gy0 + gh, C565.CYAN);
        }

        drawInavText320(rcInputConfig.padShortName.slice(0, 12), gx0 + 4, gy0 + 4, rcInputConfig.connected ? C565.GREEN : C565.ORANGE);

        // 4 Barras de Canal en microsegundos (1000..2000 us): T (Throttle), R (Roll), P (Pitch), Y (Yaw)
        if (isWingStickyThrottleActive() && Math.abs(hwInput.ly) > 0.10) {
          const dStick = (hwInput.ly > 0 ? (hwInput.ly - 0.10) : (hwInput.ly + 0.10)) / 0.90;
          fpvWingSim.thrLatch = Math.max(0.0, Math.min(1.0, fpvWingSim.thrLatch + dStick * 0.72 * dt));
        }
        const thrNorm01 = isWingStickyThrottleActive() ? fpvWingSim.thrLatch : evalRcThrottle(0.5);
        const chNames = ['T', 'R', 'P', 'Y'];
        const chVals  = [thrNorm01 * 2.0 - 1.0, hwInput.rx, hwInput.ry, hwInput.lx];
        const chCols  = [C565.ORANGE, C565.CYAN, C565.GREEN, C565.GOLD];

        for (let c = 0; c < 4; c++) {
          const by = gy0 + 20 + c * 22;
          const val = Math.max(-1.0, Math.min(1.0, chVals[c]));
          const us  = Math.round(1500 + val * 500);
          drawInavText320(`${chNames[c]}:${us}`, gx0 + 4, by, C565.WHITE);

          const barX = gx0 + 54, barW = 44, barH = 8;
          for (let y = by + 2; y < by + 2 + barH; y++) {
            vram565.fill(rgb565(28, 36, 52), y * DISP_W + barX, y * DISP_W + barX + barW);
          }
          const fillW = Math.max(1, Math.min(barW, Math.round(((val + 1.0) * 0.5) * barW)));
          for (let y = by + 2; y < by + 2 + barH; y++) {
            vram565.fill(chCols[c], y * DISP_W + barX, y * DISP_W + barX + fillW);
            setPx320(barX + (barW >> 1), y, C565.WHITE);
          }
        }

        // Ejes crudos A0..A3 para diagnóstico directo de emisoras TX16S en Android / Windows
        const a0 = Math.round(rcInputConfig.rawAxes[0] * 100);
        const a1 = Math.round(rcInputConfig.rawAxes[1] * 100);
        const a2 = Math.round(rcInputConfig.rawAxes[2] * 100);
        const a3 = Math.round(rcInputConfig.rawAxes[3] * 100);
        drawInavText320(`A0:${a0} A1:${a1}`, gx0 + 4, gy0 + 112, C565.CYAN);
        drawInavText320(`A2:${a2} A3:${a3}`, gx0 + 4, gy0 + 128, C565.CYAN);
      } else {
        // Panel Derecho en 320x240 para [WING] (tab 1) y [DRONE] (tab 2): Gráfica en vivo de la Curva SuperExpo / Actual Rates
        const isDroneTab = (rgTuningTab === 2);
        const gx0 = 210, gy0 = 44, gw = 98, gh = 96;
        const gcx = gx0 + (gw >> 1), gcy = gy0 + (gh >> 1);
        for (let y = gy0; y <= gy0 + gh; y++) {
          vram565.fill(rgb565(12, 18, 32), y * DISP_W + gx0, y * DISP_W + gx0 + gw);
          setPx320(gx0, y, C565.CYAN);
          setPx320(gx0 + gw, y, C565.CYAN);
          setPx320(gcx, y, C565.GREY);
        }
        for (let x = gx0; x <= gx0 + gw; x++) {
          setPx320(x, gy0, C565.CYAN);
          setPx320(x, gy0 + gh, C565.CYAN);
          setPx320(x, gcy, C565.GREY);
        }

        const maxRateRef = isDroneTab ? 960.0 : 540.0;
        const curMaxRate = isDroneTab ? d.rcRate : w.rollRate;
        const curCenter  = isDroneTab ? d.centerSens : w.rollRate * (1.0 - w.expo);
        const curExpo    = isDroneTab ? d.expo : w.expo;

        let prevPy = gcy;
        for (let px = 0; px <= gw; px++) {
          const rcVal = (px / (gw * 0.5)) - 1.0;
          const rateDeg = evalActualRateRad(rcVal, curCenter, curMaxRate, curExpo) * RAD2DEG;
          const normY = Math.max(-1.0, Math.min(1.0, rateDeg / maxRateRef));
          const py = Math.round(gcy - normY * (gh * 0.46));
          const sx = gx0 + px;
          const yMin = Math.min(prevPy, py), yMax = Math.max(prevPy, py);
          for (let y = yMin; y <= yMax; y++) {
            setPx320(sx, y, C565.GREEN);
            setPx320(sx, Math.min(gy0 + gh - 1, y + 1), C565.GREEN);
          }
          prevPy = py;
        }

        // Punto en vivo del Joystick Derecho (Roll/Pitch) sobre la curva para probar el tacto en directo
        const liveStick = Math.abs(hwInput.rx) >= Math.abs(hwInput.ry) ? hwInput.rx : hwInput.ry;
        const liveRateDeg = Math.round(evalActualRateRad(liveStick, curCenter, curMaxRate, curExpo) * RAD2DEG);
        const dotX = Math.round(gcx + liveStick * (gw * 0.48));
        const dotY = Math.round(gcy - Math.max(-1.0, Math.min(1.0, liveRateDeg / maxRateRef)) * (gh * 0.46));
        drawInavCircleDot320(dotX, dotY, 3, C565.GOLD);

        drawInavText320('EXPO CURVE', 218, 47, C565.CYAN);
        drawInavText320(`${Math.abs(liveRateDeg)}D/S`, 216, 148, C565.GOLD);
        drawInavText320(isDroneTab ? `TWR:${(d.maxThrustAcc / 9.81).toFixed(1)}:1` : `VS:${(8.8 * Math.sqrt(w.wingLoad)).toFixed(1)}M/S`, 216, 166, C565.WHITE);
        drawInavText320('MOVE R-STICK!', 208, 184, C565.GREEN);
      }

      // Barra inferior de botones táctiles / atajos
      fbRect(4, 54, 30, 7, true, 8);
      fbDrawText('[-DEC]', 7, 56, 5);
      fbRect(36, 54, 30, 7, true, 8);
      fbDrawText('[+INC]', 39, 56, 3);
      fbRect(68, 54, 26, 7, true, 8);
      fbDrawText('[DEF]', 71, 56, 2);
      fbRect(96, 54, 28, 7, true, 4);
      fbDrawText('B:FLY', 100, 56, 1);
    }

    function updateAndRenderRetroGoOverlay(dt) {
      // Todo el menú dentro de la app es ahora 100% congruente en resolución nativa 320x240 con 4 pestañas
      updateAndRenderTuningMenu(dt);
    }

    // CARTUCHO 3: ILI9341V SPI + FT6336 TOUCH + ADC DIAGNOSTIC
    function renderHwDiagnostic() {
      fbClear(0);
      fbRect(0, 0, 128, 8, true, 8);
      fbDrawText('S3 ILI9341V + FT6336 + ADC', 4, 2, 2);

      fbRect(4, 11, 34, 34, false, 5);
      const lxPx = 21 + Math.round(hwInput.lx * 14), lyPx = 28 - Math.round(hwInput.ly * 14);
      fbDrawLine(21, 28, lxPx, lyPx, 0, 3);
      fbRect(lxPx - 1, lyPx - 1, 3, 3, true, 2);
      fbDrawText(`L3:${hwInput.btn.L3 ? 1 : 0}`, 6, 47, hwInput.btn.L3 ? 3 : 1);

      fbRect(90, 11, 34, 34, false, 5);
      const rxPx = 107 + Math.round(hwInput.rx * 14), ryPx = 28 - Math.round(hwInput.ry * 14);
      fbDrawLine(107, 28, rxPx, ryPx, 0, 3);
      fbRect(rxPx - 1, ryPx - 1, 3, 3, true, 2);
      fbDrawText(`R3:${hwInput.btn.R3 ? 1 : 0}`, 92, 47, hwInput.btn.R3 ? 3 : 1);

      const btns = ['Y', 'X', 'B', 'A'];
      for (let i = 0; i < 4; i++) {
        const bx = 44 + i * 10, pressed = hwInput.btn[btns[i]];
        fbRect(bx, 12, 8, 9, pressed, pressed ? 2 : 5);
        fbDrawText(btns[i], bx + 2, 14, pressed ? 0 : 1);
      }

      const dpad = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
      const dLbl = ['U', 'D', 'L', 'R'];
      for (let i = 0; i < 4; i++) {
        const bx = 44 + i * 10, pressed = hwInput.btn[dpad[i]];
        fbRect(bx, 23, 8, 9, pressed, pressed ? 3 : 5);
        fbDrawText(dLbl[i], bx + 2, 25, pressed ? 0 : 1);
      }

      const mode = SPI_MODES[paletteIdx];
      const dmaMs = (1228800 / (mode.spiMhz * 1e6) * 1000).toFixed(1);
      fbDrawText(`SPI:${mode.spiMhz}MHZ (${dmaMs}MS)`, 40, 35, 3);
      fbDrawText(`TCH:${capTouch.x320},${capTouch.y240}`, 40, 43, capTouch.active ? 2 : 5);
      fbRect(0, 55, 128, 9, true, 8);
      fbDrawText(rcInputConfig.connected ? `RC: ${rcInputConfig.padShortName} OK` : 'RC: CONECTA TX16S USB/BT PAD', 4, 57, rcInputConfig.connected ? 3 : 2);

      if (capTouch.active) {
        fbCircle(capTouch.lx128, capTouch.ly64, 5, 4);
        fbDrawLine(capTouch.lx128 - 8, capTouch.ly64, capTouch.lx128 + 8, capTouch.ly64, 0, 2);
        fbDrawLine(capTouch.lx128, capTouch.ly64 - 8, capTouch.lx128, capTouch.ly64 + 8, 0, 2);
      }
    }

    /***************************************************************************
     * 8. BUCLE PRINCIPAL DE SISTEMA RETRO-GO (CON SIMULADOR SPI DMA ILI9341V)
     ***************************************************************************/
    const btnPaletteEl = document.getElementById('btnPalette');
    if (btnPaletteEl) {
      btnPaletteEl.addEventListener('click', (e) => {
        paletteIdx = (paletteIdx + 1) % SPI_MODES.length;
        const m = SPI_MODES[paletteIdx];
        e.currentTarget.textContent = `🎨 ${m.name}`;
        showToast(m.name);
      });
    }

    let lastTime = performance.now();
    let fpsFrames = 0;
    let fpsClock = performance.now();

    function retroGoMainLoop(now) {
      requestAnimationFrame(retroGoMainLoop);

      try {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000.0));
        lastTime = now;

        updateInputPolling();

        if (osState === 'boot') {
          updateAndRenderRetroGoBoot(dt);
        } else if (osState === 'launcher') {
          updateAndRenderRetroGoLauncher(dt);
        } else if (osState === 'ingame') {
          if (hwInput.justPressed('MENU')) {
            if (rgOverlayOpen) {
              rgOverlayOpen = false;
              rgTuningOpen = false;
            } else {
              rgOverlayOpen = true;
              rgTuningOpen = true;
            }
            playTone(600, 0.04);
          }

          if (!rgOverlayOpen) {
            if (activeRomId === 'fpv_drone') {
              if (!handleInFlightShortcuts(fpvDroneSim)) {
                for (let s = 0; s < 4; s++) fpvDroneSim.step(dt * 0.25);
              }
              fpvDroneSim.render();
            } else if (activeRomId === 'fpv_wing') {
              if (!handleInFlightShortcuts(fpvWingSim)) {
                for (let s = 0; s < 4; s++) fpvWingSim.step(dt * 0.25);
              }
              fpvWingSim.render();
            } else if (activeRomId === 'hwtest') {
              renderHwDiagnostic();
            }
          } else {
            if (activeRomId === 'fpv_drone') fpvDroneSim.render();
            else if (activeRomId === 'fpv_wing') fpvWingSim.render();
            else if (activeRomId === 'hwtest') renderHwDiagnostic();

            updateAndRenderRetroGoOverlay(dt);
          }
        }

        if (toastTimer > 0) {
          toastTimer -= dt;
          const tw = toastMsg.length * 4 + 6;
          fbRect(64 - (tw >> 1), 1, tw, 9, true, 2);
          fbDrawText(toastMsg, 64 - (tw >> 1) + 3, 3, 0);
        }

        fbPresentToCanvas();
        snapshotPrevButtons();
        capTouch.justTapped = false;

        fpsFrames++;
        if (now - fpsClock >= 500) {
          const rawFps = Math.round((fpsFrames * 1000) / (now - fpsClock));
          const mode = SPI_MODES[paletteIdx];
          const dispFps = Math.min(rawFps, mode.targetFps);
          document.getElementById('uiFpsBattery').textContent = `${dispFps}FPS | SPI ${mode.spiMhz}MHz`;
          fpsFrames = 0;
          fpsClock = now;
        }
      } catch (err) {
        console.error('Frame error recovered:', err);
      }
    }

    requestAnimationFrame(retroGoMainLoop);
  </script>
</body>
