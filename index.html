<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#181a22" />
  <title>RETRO-GO // ESP32-S3 + 2.8" ILI9341V IPS 320x240 RGB565 v10</title>
  <style>
    :root {
      --case-main: #222530;
      --case-dark: #15171e;
      --bezel-black: #08090c;
      --rg-red: #e53935;
      --rg-gold: #ffb300;
      --rg-cyan: #00e5ff;
      --rg-green: #00e676;
      --btn-a: #d32f2f;
      --btn-b: #f57c00;
      --btn-x: #1976d2;
      --btn-y: #388e3c;
      --text: #eceff4;
      --muted: #9aa5b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: var(--case-dark);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      touch-action: none;
    }

    /* Fullscreen Edge-to-Edge Console Shell on Mobile */
    .retrogo-shell {
      width: 100%;
      height: 100%;
      container-type: size;
      background: linear-gradient(180deg, #2b2f3d 0%, #1e212b 55%, #15171f 100%);
      padding: env(safe-area-inset-top, 6px) 2.2vw env(safe-area-inset-bottom, 8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8dvh;
    }

    /* Only constrain width on large desktop PC monitors with mouse */
    @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090a0e;
      }
      .retrogo-shell {
        max-width: 460px;
        max-height: 920px;
        padding: 10px 12px;
        border: 3px solid #3c4254;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* 1. Top Status Bar */
    .shell-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7dvh 2vw;
      background: #14161d;
      border: 1px solid #313646;
      border-radius: 8px;
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      flex-shrink: 0;
    }

    .led-cluster {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .led {
      width: clamp(7px, 1.8cqw, 12px);
      height: clamp(7px, 1.8cqw, 12px);
      border-radius: 50%;
      background: var(--rg-green);
      box-shadow: 0 0 6px var(--rg-green);
    }

    .led.sd-act {
      background: var(--rg-gold);
      box-shadow: 0 0 6px var(--rg-gold);
      opacity: 0.3;
      transition: opacity 0.08s;
    }

    .led.sd-act.blink {
      opacity: 1;
    }

    .top-hw-pills {
      display: flex;
      gap: 1.2cqw;
    }

    .pill-btn {
      background: #232734;
      color: var(--text);
      border: 1.5px solid #404659;
      border-radius: 6px;
      padding: 0.5dvh 2cqw;
      font-family: inherit;
      font-size: clamp(0.64rem, 2.2cqw, 1rem);
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      border-color: var(--rg-gold);
      color: var(--rg-gold);
    }

    /* 2. Retro-Go Screen Lens (128x64 Native 1-Bit OLED) */
    .screen-lens {
      background: var(--bezel-black);
      border: 3px solid #141720;
      border-radius: 12px 12px 20px 12px;
      padding: 0.7dvh 2cqw 0.8dvh;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 1),
        0 2px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.4dvh;
      flex-shrink: 0;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.6rem, 2.1cqw, 0.95rem);
      color: #828c9e;
      letter-spacing: 0.6px;
    }

    .rg-stripe {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .rg-stripe i {
      width: clamp(9px, 2.2cqw, 15px);
      height: clamp(3px, 0.8cqw, 5px);
      display: inline-block;
      border-radius: 1px;
    }

    .oled-container {
      width: min(100%, 42cqh);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #040609;
      border: 2px solid #2b3344;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: pointer;
    }

    #oledCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .oled-container.pixel-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 50%, transparent 50%);
      background-size: 100% 2px;
      pointer-events: none;
    }

    .lens-branding {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1px;
    }

    .rg-logo-text {
      font-size: clamp(0.75rem, 2.8cqw, 1.25rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      color: #d8dee9;
    }

    .rg-logo-text span {
      color: var(--rg-red);
    }

    .rg-sub-status {
      font-size: clamp(0.58rem, 2cqw, 0.92rem);
      color: var(--rg-gold);
    }

    /* 3. UPPER CONTROLS: DUAL ANALOG JOYSTICKS (WITH L3 / R3 INTEGRATED) */
    .upper-joysticks-section {
      flex: 1.08;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      align-items: center;
      justify-items: center;
      padding: 0.4dvh 1cqw;
    }

    .stick-unit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7dvh;
      position: relative;
    }

    .stick-top-row {
      width: 94%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1cqw;
    }

    .stick-adc-label {
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .btn-stick-click {
      background: #1b1f2a;
      border: 2px solid #48526a;
      color: var(--rg-cyan);
      border-radius: 8px;
      padding: 0.6dvh 2.6cqw;
      font-family: inherit;
      font-size: clamp(0.68rem, 2.5cqw, 1.1rem);
      font-weight: 800;
      box-shadow: 0 3px 0 #0c0e13;
    }

    .btn-stick-click.pressed {
      transform: translateY(2px);
      background: var(--rg-cyan);
      color: #000;
    }

    .stick-canvas {
      width: min(44cqw, 26.5cqh);
      height: min(44cqw, 26.5cqh);
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at center, #1a1f2b 0%, #0b0d13 100%);
      border: 3px solid #3f485e;
      border-radius: 50%;
      touch-action: none;
      display: block;
      box-shadow: inset 0 6px 20px rgba(0, 0, 0, 0.95), 0 3px 8px rgba(255, 255, 255, 0.07);
    }

    .stick-canvas.engaged {
      border-color: var(--rg-gold);
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.95), 0 0 16px rgba(255, 179, 0, 0.45);
    }

    /* 4. LOWER CONTROLS: [D-PAD LEFT] — [SELECT / MENU CENTER] — [4 DIAMOND BUTTONS RIGHT] */
    .lower-controls-deck {
      flex: 1.05;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 1.5cqw;
      padding: 0.8dvh 1.5cqw 1dvh;
      background: rgba(12, 14, 20, 0.42);
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .hw-btn {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.04s;
    }

    .hw-btn.pressed {
      transform: translateY(2px);
      filter: brightness(1.3);
    }

    /* Classic Cross D-Pad (Left Side) - Scaled to fill left zone */
    .dpad-cross {
      width: min(37cqw, 25cqh);
      height: min(37cqw, 25cqh);
      position: relative;
    }

    .dpad-arm {
      position: absolute;
      background: linear-gradient(180deg, #323848 0%, #1d202b 100%);
      border: 2.5px solid #4a5268;
      color: #d0d8e8;
      font-size: clamp(1rem, 4.2cqw, 1.9rem);
      box-shadow: 0 4px 0 #090b10, 0 6px 12px rgba(0,0,0,0.55);
    }

    .dpad-arm.pressed {
      background: #41495f;
      color: var(--rg-gold);
      border-color: var(--rg-gold);
    }

    .dpad-up {
      top: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 18% 18% 0 0;
      border-bottom: none;
    }
    .dpad-down {
      bottom: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 0 0 18% 18%;
      border-top: none;
    }
    .dpad-left {
      top: 33%; left: 0; width: 36%; height: 34%;
      border-radius: 18% 0 0 18%;
      border-right: none;
    }
    .dpad-right {
      top: 33%; right: 0; width: 36%; height: 34%;
      border-radius: 0 18% 18% 0;
      border-left: none;
    }
    .dpad-center {
      position: absolute;
      top: 33%; left: 33%; width: 34%; height: 34%;
      background: #242834;
      pointer-events: none;
    }
    .dpad-center::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, #141720 20%, #292e3d 100%);
    }

    /* Center 2 System Buttons (SELECT + START/MENU) */
    .center-sys-cluster {
      display: flex;
      flex-direction: column;
      gap: 2.2cqh;
      align-items: center;
      justify-content: center;
      padding: 0 0.5cqw;
    }

    .btn-sys-pill {
      width: clamp(74px, 19.5cqw, 140px);
      height: clamp(36px, 5.4cqh, 62px);
      background: #1a1e28;
      border: 2.5px solid #4e566e;
      border-radius: 999px;
      color: #dce3ef;
      font-size: clamp(0.72rem, 2.5cqw, 1.18rem);
      letter-spacing: 0.6px;
      box-shadow: 0 4px 0 #0a0c10, 0 5px 10px rgba(0,0,0,0.45);
    }

    .btn-sys-pill.menu-pill {
      border-color: var(--rg-red);
      color: var(--rg-gold);
    }

    /* 4 Action Buttons in Classic Diamond (X Top, Y Left, A Right, B Bottom) - Scaled to fill right zone */
    .diamond-cluster {
      width: min(38cqw, 25.5cqh);
      height: min(38cqw, 25.5cqh);
      position: relative;
    }

    .btn-diamond {
      position: absolute;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3d4356, #1d202b);
      border: 3px solid #525a72;
      color: #fff;
      font-size: clamp(0.95rem, 3.8cqw, 1.75rem);
      line-height: 1;
      box-shadow: 0 5px 0 #090b10, 0 6px 12px rgba(0,0,0,0.6);
    }

    .btn-diamond small {
      font-size: clamp(0.54rem, 1.95cqw, 0.9rem);
      color: #d4dce8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Posiciones del Diamante en porcentaje: X arriba, Y izquierda, A derecha, B abajo */
    .btn-diamond.pos-top {
      top: 0; left: 32%;
      border-color: var(--btn-x);
    }
    .btn-diamond.pos-left {
      top: 32%; left: 0;
      border-color: var(--btn-y);
    }
    .btn-diamond.pos-right {
      top: 32%; right: 0;
      border-color: var(--btn-a);
    }
    .btn-diamond.pos-bottom {
      bottom: 0; left: 32%;
      border-color: var(--btn-b);
    }
  </style>
</head>
<body>
  <div class="retrogo-shell">
    <!-- 1. Top Hardware Bar -->
    <header class="shell-top-bar">
      <div class="led-cluster">
        <span class="led" title="Power ON"></span>
        <span>PWR</span>
        <span id="sdLed" class="led sd-act" title="Flash / SD Activity"></span>
        <span>SPI</span>
        <span style="color:#828c9e;margin-left:3px;">S3 N16R8 + INAV (v14)</span>
      </div>
      <div class="top-hw-pills">
        <button id="btnPalette" class="pill-btn">🎨 IPS 60MHz</button>
        <button id="btnAudio" class="pill-btn">🔇 SND</button>
        <button id="btnGrid" class="pill-btn">SCAN</button>
        <button id="btnFull" class="pill-btn">⛶</button>
      </div>
    </header>

    <!-- 2. Retro-Go 2.8" 320x240 IPS RGB565 ILI9341V + Capacitive Touch Screen Lens -->
    <section class="screen-lens">
      <div class="lens-header">
        <div class="rg-stripe">
          <i style="background:#e53935"></i>
          <i style="background:#ffb300"></i>
          <i style="background:#00e676"></i>
          <i style="background:#00e5ff"></i>
          <span style="margin-left:4px;">2.8" IPS 320×240 RGB565 (ILI9341V + TOUCH)</span>
        </div>
        <span id="uiFpsBattery">60FPS | DMA 60MHz</span>
      </div>

      <div id="oledContainer" class="oled-container">
        <canvas id="oledCanvas" width="320" height="240"></canvas>
      </div>

      <div class="lens-branding">
        <div class="rg-logo-text">RETRO<span>-GO</span> <small style="font-size:0.55em;color:#8b9bb4;font-style:normal;">ILI9341V + FT6336</small></div>
        <div id="uiHintBar" class="rg-sub-status">TOUCH/DPAD/STICK:NAV | A:RUN | MENU:OSD</div>
      </div>
    </section>

    <!-- 3. Upper Controls: 2 Analog Joysticks with L3 / R3 Click -->
    <section class="upper-joysticks-section">
      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutLeft" class="stick-adc-label">L:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="L3">L3 CLICK</button>
        </div>
        <canvas id="stickLeft" class="stick-canvas" width="200" height="200"></canvas>
      </div>

      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutRight" class="stick-adc-label">R:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="R3">R3 CLICK</button>
        </div>
        <canvas id="stickRight" class="stick-canvas" width="200" height="200"></canvas>
      </div>
    </section>

    <!-- 4. Lower Controls: [Cruceta D-Pad Izquierda] + [2 Botones Centro] + [4 Botones Diamante Derecha] -->
    <section class="lower-controls-deck">
      <!-- Left: Cross D-Pad -->
      <div class="dpad-cross">
        <button class="hw-btn dpad-arm dpad-up" data-btn="UP">▲</button>
        <button class="hw-btn dpad-arm dpad-down" data-btn="DOWN">▼</button>
        <button class="hw-btn dpad-arm dpad-left" data-btn="LEFT">◀</button>
        <button class="hw-btn dpad-arm dpad-right" data-btn="RIGHT">▶</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Center: 2 System Buttons (SELECT & MENU/START) -->
      <div class="center-sys-cluster">
        <button class="hw-btn btn-sys-pill" data-btn="SELECT">SELECT</button>
        <button class="hw-btn btn-sys-pill menu-pill" data-btn="MENU">★ MENU</button>
      </div>

      <!-- Right: 4 Action Buttons in Diamond Layout (X Top, Y Left, A Right, B Bottom) -->
      <div class="diamond-cluster">
        <button class="hw-btn btn-diamond pos-top" data-btn="X">
          <span>X</span>
          <small id="lblX">RST</small>
        </button>
        <button class="hw-btn btn-diamond pos-left" data-btn="Y">
          <span>Y</span>
          <small id="lblY">MOD</small>
        </button>
        <button class="hw-btn btn-diamond pos-right" data-btn="A">
          <span>A</span>
          <small id="lblA">GAS</small>
        </button>
        <button class="hw-btn btn-diamond pos-bottom" data-btn="B">
          <span>B</span>
          <small id="lblB">BRK</small>
        </button>
      </div>
    </section>
  </div>

  <script>
    /***************************************************************************
     * 1. HARDWARE ABSTRACTION LAYER (HAL) — 2.8" ILI9341V IPS 320x240 RGB565
     *    - Framebuffer real de 16 bits RGB565: 320 x 240 x 2 = 153,600 Bytes (150 KB)
     *    - Compatible con doble buffer DMA en SRAM del ESP32-S3 (LovyanGFX / esp_lcd)
     *    - Rasterizador Bresenham en resolución nativa 320x240 blindado contra bloqueos
     ***************************************************************************/
    const DISP_W = 320;
    const DISP_H = 240;
    const VRAM_PIXELS = DISP_W * DISP_H; // 76,800 píxeles
    const VRAM_BYTES  = VRAM_PIXELS * 2; // 153,600 bytes (150 KB RGB565)
    const vram565 = new Uint16Array(VRAM_PIXELS);

    // Coordenadas lógicas base (128x64 -> escaladas en hardware a 320x240 = x2.5, x3.75)
    const SCREEN_W = 128;
    const SCREEN_H = 64;
    const SCALE_X = DISP_W / SCREEN_W; // 2.5
    const SCALE_Y = DISP_H / SCREEN_H; // 3.75

    const oledCanvas = document.getElementById('oledCanvas');
    const oledCtx = oledCanvas.getContext('2d', { alpha: false });
    const oledImgData = oledCtx.createImageData(DISP_W, DISP_H);
    const rgbaPixels = oledImgData.data;

    function rgb565(r, g, b) {
      return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | ((b & 0xF8) >> 3);
    }

    // Tabla LUT precalculada para convertir RGB565 -> RGBA8888 en <0.3ms
    const LUT_R = new Uint8Array(65536);
    const LUT_G = new Uint8Array(65536);
    const LUT_B = new Uint8Array(65536);
    for (let c = 0; c < 65536; c++) {
      const r5 = (c >> 11) & 0x1F;
      const g6 = (c >> 5)  & 0x3F;
      const b5 =  c        & 0x1F;
      LUT_R[c] = (r5 << 3) | (r5 >> 2);
      LUT_G[c] = (g6 << 2) | (g6 >> 4);
      LUT_B[c] = (b5 << 3) | (b5 >> 2);
    }

    // Paleta de índices rápidos RGB565 (además de aceptar cualquier color 16-bit directo)
    const C565 = {
      BG:      rgb565(8, 12, 22),     // 0: Fondo oscuro IPS
      WHITE:   rgb565(240, 250, 255), // 1: Blanco brillante
      GOLD:    rgb565(255, 190, 0),   // 2: Retro-Go Gold / Ámbar
      GREEN:   rgb565(0, 235, 118),   // 3: Verde Neón
      RED:     rgb565(245, 55, 65),   // 4: Rojo Carmesí
      CYAN:    rgb565(0, 229, 255),   // 5: Cian HUD
      GREY:    rgb565(90, 102, 125),  // 6: Gris Asfalto / UI
      DARKGRN: rgb565(18, 85, 48),    // 7: Verde Terreno
      NAVY:    rgb565(20, 34, 68),    // 8: Azul Retro-Go Header
      ORANGE:  rgb565(255, 120, 20),  // 9: Naranja Rally / Fuego
      MAGENTA: rgb565(245, 60, 210),  // 10: Magenta Gate Activo
      SKYTOP:  rgb565(12, 24, 58),    // 11: Cielo Superior
      SKYBOT:  rgb565(38, 78, 138),   // 12: Horizonte Cielo
      GNDTOP:  rgb565(18, 46, 30),    // 13: Suelo Horizonte
      GNDBOT:  rgb565(10, 24, 18)     // 14: Suelo Cercano
    };

    const INDEX_PALETTE = [
      C565.BG, C565.WHITE, C565.GOLD, C565.GREEN,
      C565.RED, C565.CYAN, C565.GREY, C565.DARKGRN,
      C565.NAVY, C565.ORANGE, C565.MAGENTA, C565.SKYTOP,
      C565.SKYBOT, C565.GNDTOP, C565.GNDBOT
    ];

    // Modos de bus SPI en el ESP32-S3 + ILI9341V
    const SPI_MODES = [
      { name: 'IPS 60MHz DMA', spiMhz: 60, mono: false, targetFps: 60 },
      { name: 'IPS 80MHz QIO', spiMhz: 80, mono: false, targetFps: 60 },
      { name: 'IPS 40MHz SPI', spiMhz: 40, mono: false, targetFps: 45 },
      { name: '1-BIT MONO SIM',spiMhz: 40, mono: true,  targetFps: 60 }
    ];
    let paletteIdx = 0;

    function resolveColor565(color) {
      if (SPI_MODES[paletteIdx].mono) {
        return color === 0 ? rgb565(6, 10, 14) : rgb565(0, 235, 130);
      }
      if (color >= 0 && color < INDEX_PALETTE.length) return INDEX_PALETTE[color];
      return color & 0xFFFF;
    }

    function blinkSdLed() {
      const el = document.getElementById('sdLed');
      el.classList.add('blink');
      setTimeout(() => el.classList.remove('blink'), 120);
    }

    function fbClear(bgColor = 0) {
      vram565.fill(resolveColor565(bgColor));
    }

    // Relleno uniforme de cielo y tierra en 320x240 (sin sub-bandas artificiales)
    function fbFillHorizon320(horizonY240, skyCol, gndCol) {
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }
      const hy = Math.max(0, Math.min(DISP_H, horizonY240 | 0));
      if (hy > 0) vram565.fill(skyCol, 0, hy * DISP_W);
      if (hy < DISP_H) vram565.fill(gndCol, hy * DISP_W, DISP_H * DISP_W);
    }

    // Relleno de trapecio horizontal (para asfalto y pianos en WRC Rally a 320x240)
    function fbFillQuadScanline(x0Top, x1Top, yTop, x0Bot, x1Bot, yBot, color565) {
      if (SPI_MODES[paletteIdx].mono) return;
      const c = resolveColor565(color565);
      let ya = Math.round(yTop * SCALE_Y);
      let yb = Math.round(yBot * SCALE_Y);
      let xa0 = x0Top * SCALE_X, xa1 = x1Top * SCALE_X;
      let xb0 = x0Bot * SCALE_X, xb1 = x1Bot * SCALE_X;
      if (ya > yb) {
        [ya, yb] = [yb, ya];
        [xa0, xb0] = [xb0, xa0];
        [xa1, xb1] = [xb1, xa1];
      }
      const span = Math.max(1, yb - ya);
      const yStart = Math.max(0, ya), yEnd = Math.min(DISP_H - 1, yb);
      for (let y = yStart; y <= yEnd; y++) {
        const t = (y - ya) / span;
        const lx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa0 + (xb0 - xa0) * t)));
        const rx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa1 + (xb1 - xa1) * t)));
        if (rx >= lx) vram565.fill(c, y * DISP_W + lx, y * DISP_W + rx + 1);
      }
    }

    function fbSetPixel320(px, py, c565) {
      const ix = px | 0, iy = py | 0;
      if (ix < 0 || ix >= DISP_W || iy < 0 || iy >= DISP_H) return;
      vram565[iy * DISP_W + ix] = c565;
    }

    function fbSetPixel(x, y, color = 1) {
      const c = resolveColor565(color);
      const px = Math.round(x * SCALE_X);
      const py = Math.round(y * SCALE_Y);
      fbSetPixel320(px, py, c);
      fbSetPixel320(px + 1, py, c);
      fbSetPixel320(px, py + 1, c);
      fbSetPixel320(px + 1, py + 1, c);
    }

    function fbRect(x, y, w, h, fill = false, color = 1) {
      const c = resolveColor565(color);
      const x0 = Math.max(0, Math.round(x * SCALE_X));
      const y0 = Math.max(0, Math.round(y * SCALE_Y));
      const x1 = Math.min(DISP_W - 1, Math.round((x + w) * SCALE_X) - 1);
      const y1 = Math.min(DISP_H - 1, Math.round((y + h) * SCALE_Y) - 1);
      if (x1 < x0 || y1 < y0) return;

      if (fill) {
        for (let py = y0; py <= y1; py++) {
          vram565.fill(c, py * DISP_W + x0, py * DISP_W + x1 + 1);
        }
      } else {
        for (let px = x0; px <= x1; px++) {
          fbSetPixel320(px, y0, c); fbSetPixel320(px, y0 + 1, c);
          fbSetPixel320(px, y1, c); fbSetPixel320(px, y1 - 1, c);
        }
        for (let py = y0; py <= y1; py++) {
          fbSetPixel320(x0, py, c); fbSetPixel320(x0 + 1, py, c);
          fbSetPixel320(x1, py, c); fbSetPixel320(x1 - 1, py, c);
        }
      }
    }

    function fbCircle(cx, cy, r, color = 1) {
      if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
      const c = resolveColor565(color);
      const x0 = Math.round(cx * SCALE_X), y0 = Math.round(cy * SCALE_Y);
      let x = Math.min(280, Math.max(1, Math.round(r * ((SCALE_X + SCALE_Y) * 0.5)))), y = 0, err = 0;
      let guard = 0;
      while (x >= y && ++guard < 400) {
        const pts = [
          [x0 + x, y0 + y], [x0 + y, y0 + x], [x0 - y, y0 + x], [x0 - x, y0 + y],
          [x0 - x, y0 - y], [x0 - y, y0 - x], [x0 + y, y0 - x], [x0 + x, y0 - y]
        ];
        for (let i = 0; i < 8; i++) {
          fbSetPixel320(pts[i][0], pts[i][1], c);
          fbSetPixel320(pts[i][0] + 1, pts[i][1], c);
        }
        y += 1;
        if (err <= 0) err += 2 * y + 1;
        if (err > 0) { x -= 1; err -= 2 * x + 1; }
      }
    }

    const CLIP_LEFT = 1, CLIP_RIGHT = 2, CLIP_BOTTOM = 4, CLIP_TOP = 8;
    function computeOutCode320(x, y) {
      let c = 0;
      if (x < 0) c |= CLIP_LEFT; else if (x >= DISP_W) c |= CLIP_RIGHT;
      if (y < 0) c |= CLIP_TOP;  else if (y >= DISP_H) c |= CLIP_BOTTOM;
      return c;
    }

    // Bresenham en resolución nativa 320x240 con clipping Cohen-Sutherland blindado
    function fbDrawLine(lx0, ly0, lx1, ly1, dashedMask = 0, color = 1) {
      if (!Number.isFinite(lx0) || !Number.isFinite(ly0) || !Number.isFinite(lx1) || !Number.isFinite(ly1)) return;
      let x0 = lx0 * SCALE_X, y0 = ly0 * SCALE_Y;
      let x1 = lx1 * SCALE_X, y1 = ly1 * SCALE_Y;
      const c = resolveColor565(color);

      let out0 = computeOutCode320(x0, y0), out1 = computeOutCode320(x1, y1), accept = false;
      let clipIter = 0;

      while (++clipIter <= 12) {
        if (!(out0 | out1)) { accept = true; break; }
        else if (out0 & out1) break;
        else {
          let x = 0, y = 0;
          const out = out0 ? out0 : out1;
          const dx = x1 - x0, dy = y1 - y0;

          if (out & CLIP_BOTTOM) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (DISP_H - 1 - y0) / dy : x0;
            y = DISP_H - 1;
          } else if (out & CLIP_TOP) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (0 - y0) / dy : x0;
            y = 0;
          } else if (out & CLIP_RIGHT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (DISP_W - 1 - x0) / dx : y0;
            x = DISP_W - 1;
          } else if (out & CLIP_LEFT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (0 - x0) / dx : y0;
            x = 0;
          }

          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          if (out === out0) { x0 = x; y0 = y; out0 = computeOutCode320(x0, y0); }
          else { x1 = x; y1 = y; out1 = computeOutCode320(x1, y1); }
        }
      }

      if (!accept) return;

      let ix0 = Math.max(0, Math.min(DISP_W - 1, Math.round(x0)));
      let iy0 = Math.max(0, Math.min(DISP_H - 1, Math.round(y0)));
      const ix1 = Math.max(0, Math.min(DISP_W - 1, Math.round(x1)));
      const iy1 = Math.max(0, Math.min(DISP_H - 1, Math.round(y1)));

      const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
      const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
      let err = dx + dy, step = 0;

      while (step < 640) {
        if (!dashedMask || ((step >> 1) & dashedMask) === 0) {
          fbSetPixel320(ix0, iy0, c);
          if (ix0 + 1 < DISP_W) fbSetPixel320(ix0 + 1, iy0, c);
        }
        if (ix0 === ix1 && iy0 === iy1) break;
        const e2 = err << 1;
        if (e2 >= dy) { err += dy; ix0 += sx; }
        if (e2 <= dx) { err += dx; iy0 += sy; }
        step++;
      }
    }

    const FONT_3X5 = {
      '0': [7,5,5,5,7], '1': [2,6,2,2,7], '2': [7,1,7,4,7], '3': [7,1,7,1,7],
      '4': [5,5,7,1,1], '5': [7,4,7,1,7], '6': [7,4,7,5,7], '7': [7,1,1,2,2],
      '8': [7,5,7,5,7], '9': [7,5,7,1,7],
      'A': [2,5,7,5,5], 'B': [6,5,6,5,6], 'C': [7,4,4,4,7], 'D': [6,5,5,5,6],
      'E': [7,4,6,4,7], 'F': [7,4,6,4,4], 'G': [7,4,5,5,7], 'H': [5,5,7,5,5],
      'I': [7,2,2,2,7], 'J': [1,1,1,5,7], 'K': [5,5,6,5,5], 'L': [4,4,4,4,7],
      'M': [5,7,7,5,5], 'N': [5,7,7,7,5], 'O': [7,5,5,5,7], 'P': [7,5,7,4,4],
      'Q': [7,5,5,7,3], 'R': [6,5,6,5,5], 'S': [7,4,7,1,7], 'T': [7,2,2,2,2],
      'U': [5,5,5,5,7], 'V': [5,5,5,5,2], 'W': [5,5,7,7,5], 'X': [5,5,2,5,5],
      'Y': [5,5,2,2,2], 'Z': [7,1,2,4,7],
      ':': [0,2,0,2,0], '-': [0,0,7,0,0], '/': [1,1,2,4,4], '.': [0,0,0,0,2],
      '+': [0,2,7,2,0], '>': [4,2,1,2,4], '<': [1,2,4,2,1], '%': [5,1,2,4,5],
      '[': [7,4,4,4,7], ']': [7,1,1,1,7], '*': [5,2,7,2,5], '(': [2,4,4,4,2],
      ')': [2,1,1,1,2], '|': [2,2,2,2,2], ',': [0,0,0,2,4], '=': [0,7,0,7,0]
    };

    function fbDrawText(str, x, y, color = 1) {
      const s = String(str).toUpperCase();
      const c = resolveColor565(color);
      let cx = Math.round(x * SCALE_X);
      const cy = Math.round(y * SCALE_Y);
      for (let i = 0; i < s.length; i++) {
        const g = FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const b = g[r];
            for (let col = 0; col < 3; col++) {
              if (b & (4 >> col)) {
                const px = cx + col * 2;
                const py = cy + r * 3;
                for (let dy = 0; dy < 3; dy++) {
                  fbSetPixel320(px, py + dy, c);
                  fbSetPixel320(px + 1, py + dy, c);
                }
              }
            }
          }
        }
        cx += 10;
      }
    }

    function fbPresentToCanvas() {
      let pIdx = 0;
      for (let i = 0; i < VRAM_PIXELS; i++) {
        const c = vram565[i];
        rgbaPixels[pIdx]     = LUT_R[c];
        rgbaPixels[pIdx + 1] = LUT_G[c];
        rgbaPixels[pIdx + 2] = LUT_B[c];
        rgbaPixels[pIdx + 3] = 255;
        pIdx += 4;
      }
      oledCtx.putImageData(oledImgData, 0, 0);
    }

    /***************************************************************************
     * 2. AUDIO SINTETIZADO RETRO-GO
     ***************************************************************************/
    let audioCtx = null;
    let soundEnabled = false;

    function playTone(freq = 600, dur = 0.05, type = 'square', vol = 0.04) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur + 0.01);
      } catch (_) {}
    }

    /***************************************************************************
     * 3. ENTRADAS HARDWARE:
     *    - ARRIBA: 2 Joysticks Analógicos (con L3/R3 Click y doble toque)
     *    - ABAJO IZQ: Cruceta D-Pad (UP, DOWN, LEFT, RIGHT)
     *    - ABAJO CENTRO: SELECT y ★ MENU
     *    - ABAJO DER: 4 Botones en Diamante (X, Y, A, B)
     ***************************************************************************/
    const stickLeftCanvas = document.getElementById('stickLeft');
    const stickRightCanvas = document.getElementById('stickRight');
    const ctxLeft = stickLeftCanvas.getContext('2d');
    const ctxRight = stickRightCanvas.getContext('2d');

    const hwInput = {
      lx: 0.0, ly: 0.0,
      rx: 0.0, ry: 0.0,
      leftActive: false,
      rightActive: false,
      btn: {
        A: false, B: false, X: false, Y: false,
        L3: false, R3: false,
        SELECT: false, MENU: false,
        UP: false, DOWN: false, LEFT: false, RIGHT: false
      },
      prevBtn: {},
      justPressed(k) { return !!this.btn[k] && !this.prevBtn[k]; }
    };

    const touchTrack = { leftId: null, rightId: null, lastTapLeft: 0, lastTapRight: 0 };

    function computeStickXY(canvasEl, clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const maxR = Math.max(22, rect.width * 0.40);
      const dx = clientX - cx, dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const scale = dist > maxR ? (maxR / dist) : 1.0;
      return { x: (dx * scale) / maxR, y: (-dy * scale) / maxR };
    }

    // Eventos Touch dedicados directamente a los 2 Canvases de los Joysticks Superiores
    function attachStickCanvasEvents(canvasEl, side) {
      let activeId = null;

      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        const now = performance.now();
        if (side === 'left') {
          if (now - touchTrack.lastTapLeft < 260) hwInput.btn.L3 = true;
          touchTrack.lastTapLeft = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true;
        } else {
          if (now - touchTrack.lastTapRight < 260) hwInput.btn.R3 = true;
          touchTrack.lastTapRight = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true;
        }
      }, { passive: false });

      canvasEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === activeId) {
            const v = computeStickXY(canvasEl, t.clientX, t.clientY);
            if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
            else { hwInput.rx = v.x; hwInput.ry = v.y; }
            break;
          }
        }
      }, { passive: false });

      const endStick = (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeId) {
            activeId = null;
            if (side === 'left') {
              hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false;
              if (!btnTouchCounts.L3) hwInput.btn.L3 = false;
            } else {
              hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false;
              if (!btnTouchCounts.R3) hwInput.btn.R3 = false;
            }
            break;
          }
        }
      };

      canvasEl.addEventListener('touchend', endStick, { passive: false });
      canvasEl.addEventListener('touchcancel', endStick, { passive: false });

      // Soporte Mouse en PC
      let mouseDown = false;
      canvasEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        mouseDown = true;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true; }
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; }
      });
      window.addEventListener('mouseup', () => {
        if (!mouseDown) return;
        mouseDown = false;
        if (side === 'left') { hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false; }
        else { hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false; }
      });
    }

    attachStickCanvasEvents(stickLeftCanvas, 'left');
    attachStickCanvasEvents(stickRightCanvas, 'right');

    // Botones físicos (D-Pad UP/DOWN/LEFT/RIGHT, SELECT, MENU, Y, X, B, A, L3, R3)
    const btnTouchCounts = {};
    document.querySelectorAll('.hw-btn').forEach((btnEl) => {
      const key = btnEl.getAttribute('data-btn');
      btnTouchCounts[key] = 0;
      const press = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 1;
        hwInput.btn[key] = true;
        btnEl.classList.add('pressed');
        playTone(540, 0.02, 'square', 0.02);
      };
      const release = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 0;
        hwInput.btn[key] = false;
        btnEl.classList.remove('pressed');
      };
      btnEl.addEventListener('touchstart', press, { passive: false });
      btnEl.addEventListener('touchend', release, { passive: false });
      btnEl.addEventListener('touchcancel', release, { passive: false });
      btnEl.addEventListener('mousedown', press);
      btnEl.addEventListener('mouseup', release);
      btnEl.addEventListener('mouseleave', release);
    });

    const keyMap = {
      KeyZ: 'A', Space: 'A', Enter: 'A',
      KeyX: 'B', Backspace: 'B',
      KeyC: 'X', KeyR: 'X',
      KeyV: 'Y', KeyM: 'Y',
      KeyQ: 'L3', KeyE: 'R3',
      Tab: 'SELECT', Escape: 'MENU'
    };
    const rawKeys = {};
    window.addEventListener('keydown', (e) => {
      rawKeys[e.code] = true;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = true;
    });
    window.addEventListener('keyup', (e) => {
      rawKeys[e.code] = false;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = false;
    });

    function drawThumbstickWell(ctxG, canvasEl, x, y, active, clicked, label) {
      const w = canvasEl.width, h = canvasEl.height;
      const cx = w * 0.5, cy = h * 0.5, maxR = w * 0.36;
      const capR = w * 0.21;
      ctxG.clearRect(0, 0, w, h);

      ctxG.strokeStyle = active ? 'rgba(255, 179, 0, 0.5)' : 'rgba(154, 165, 180, 0.22)';
      ctxG.lineWidth = 2;
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR, 0, Math.PI * 2); ctxG.stroke();
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR * 0.52, 0, Math.PI * 2); ctxG.stroke();

      ctxG.beginPath();
      ctxG.moveTo(cx - maxR, cy); ctxG.lineTo(cx + maxR, cy);
      ctxG.moveTo(cx, cy - maxR); ctxG.lineTo(cx, cy + maxR);
      ctxG.stroke();

      const kx = cx + x * maxR;
      const ky = cy - y * maxR;

      ctxG.strokeStyle = '#5c6375';
      ctxG.lineWidth = 10;
      ctxG.lineCap = 'round';
      ctxG.beginPath(); ctxG.moveTo(cx, cy); ctxG.lineTo(kx, ky); ctxG.stroke();

      ctxG.fillStyle = clicked ? '#e53935' : (active ? '#3e4454' : '#2b303c');
      ctxG.beginPath(); ctxG.arc(kx, ky, capR, 0, Math.PI * 2); ctxG.fill();
      ctxG.lineWidth = 3;
      ctxG.strokeStyle = clicked ? '#ffb300' : (active ? '#00e5ff' : '#586178');
      ctxG.stroke();

      ctxG.beginPath(); ctxG.arc(kx, ky, capR * 0.62, 0, Math.PI * 2);
      ctxG.lineWidth = 2;
      ctxG.strokeStyle = 'rgba(255,255,255,0.22)';
      ctxG.stroke();

      ctxG.fillStyle = '#aeb9c9';
      ctxG.font = 'bold 12px monospace';
      ctxG.textAlign = 'center';
      ctxG.fillText(label, cx, 20);
      canvasEl.classList.toggle('engaged', active || clicked);
    }

    function updateInputPolling() {
      // Si no se toca el stick izquierdo, la cruceta D-Pad o WASD también pueden mover el eje izquierdo
      if (!hwInput.leftActive) {
        const dpadX = (hwInput.btn.RIGHT || rawKeys['KeyD'] ? 0.85 : 0) - (hwInput.btn.LEFT || rawKeys['KeyA'] ? 0.85 : 0);
        const dpadY = (hwInput.btn.UP    || rawKeys['KeyW'] ? 0.85 : 0) - (hwInput.btn.DOWN || rawKeys['KeyS'] ? 0.85 : 0);
        hwInput.lx = dpadX;
        hwInput.ly = dpadY;
      }
      if (!hwInput.rightActive) {
        hwInput.rx = (rawKeys['ArrowRight'] ? 0.8 : 0) - (rawKeys['ArrowLeft'] ? 0.8 : 0);
        hwInput.ry = (rawKeys['ArrowUp'] ? 0.8 : 0)    - (rawKeys['ArrowDown'] ? 0.8 : 0);
      }

      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (gp && gp.connected) {
          if (Math.abs(gp.axes[0]) > 0.08) hwInput.lx = gp.axes[0];
          if (Math.abs(gp.axes[1]) > 0.08) hwInput.ly = -gp.axes[1];
          if (Math.abs(gp.axes[2]) > 0.08) hwInput.rx = gp.axes[2];
          if (Math.abs(gp.axes[3]) > 0.08) hwInput.ry = -gp.axes[3];
          if (gp.buttons[0]?.pressed) hwInput.btn.A = true;
          if (gp.buttons[1]?.pressed) hwInput.btn.B = true;
          if (gp.buttons[2]?.pressed) hwInput.btn.X = true;
          if (gp.buttons[3]?.pressed) hwInput.btn.Y = true;
          if (gp.buttons[10]?.pressed) hwInput.btn.L3 = true;
          if (gp.buttons[11]?.pressed) hwInput.btn.R3 = true;
          if (gp.buttons[8]?.pressed) hwInput.btn.SELECT = true;
          if (gp.buttons[9]?.pressed) hwInput.btn.MENU = true;
          if (gp.buttons[12]?.pressed) hwInput.btn.UP = true;
          if (gp.buttons[13]?.pressed) hwInput.btn.DOWN = true;
          if (gp.buttons[14]?.pressed) hwInput.btn.LEFT = true;
          if (gp.buttons[15]?.pressed) hwInput.btn.RIGHT = true;
          break;
        }
      }

      drawThumbstickWell(ctxLeft, stickLeftCanvas, hwInput.lx, hwInput.ly, hwInput.leftActive, hwInput.btn.L3, 'LEFT STICK');
      drawThumbstickWell(ctxRight, stickRightCanvas, hwInput.rx, hwInput.ry, hwInput.rightActive, hwInput.btn.R3, 'RIGHT STICK');

      const adcLX = Math.round((hwInput.lx + 1) * 2047.5);
      const adcLY = Math.round((hwInput.ly + 1) * 2047.5);
      const adcRX = Math.round((hwInput.rx + 1) * 2047.5);
      const adcRY = Math.round((hwInput.ry + 1) * 2047.5);

      document.getElementById('readoutLeft').textContent  = `L:${adcLX},${adcLY}`;
      document.getElementById('readoutRight').textContent = `R:${adcRX},${adcRY}`;
    }

    function snapshotPrevButtons() {
      for (const k in hwInput.btn) hwInput.prevBtn[k] = hwInput.btn[k];
    }

    function setFaceLabels(y, x, b, a, hint) {
      document.getElementById('lblY').textContent = y;
      document.getElementById('lblX').textContent = x;
      document.getElementById('lblB').textContent = b;
      document.getElementById('lblA').textContent = a;
      document.getElementById('uiHintBar').textContent = hint;
    }

                    /***************************************************************************
     * 4. MOTOR VOXEL (TERRENO SUAVE + CIELO AZUL CON NUBES VOXEL) + INAV OSD 320x240
     ***************************************************************************/
    const DEG2RAD = Math.PI / 180.0;
    const RAD2DEG = 180.0 / Math.PI;

    // Mapa Voxel 512x512 en PSRAM (Terreno + Capa de Nubes 3D con la misma técnica)
    const MAP_DIM   = 512;
    const MAP_MASK  = 511;
    const MAP_SHIFT = 9;
    const MAP_SCALE = 4.0;      // 1 metro = 4 texels en terreno
    const HEIGHT_SCALE = 0.025; // Elevaciones suaves de 0.0m a 3.2m

    const voxHeight  = new Uint8Array(MAP_DIM * MAP_DIM);
    const voxColor   = new Uint16Array(MAP_DIM * MAP_DIM);
    const voxSkyMap  = new Uint16Array(MAP_DIM * MAP_DIM); // Textura Voxel 512x512 de cielo azul + nubes

    // Buffer intermedio des-rotado 256x256 para permitir Roll de 360° sin huecos
    const VOX_W = 256;
    const VOX_H = 256;
    const voxBuf = new Uint16Array(VOX_W * VOX_H);

    // Circuito original de 6 Gates
    const CIRCUIT_GATES = [
      { x:  0, y: 2.5, z:   5, w: 5.0, h: 4.0 },
      { x:  6, y: 3.0, z:  22, w: 5.0, h: 4.0 },
      { x: 22, y: 3.2, z:  34, w: 5.0, h: 4.0 },
      { x: 34, y: 2.5, z:  16, w: 5.0, h: 4.0 },
      { x: 22, y: 2.5, z:  -6, w: 5.0, h: 4.0 },
      { x:  0, y: 2.5, z: -18, w: 5.0, h: 4.0 }
    ];

    // 3 temas visuales con Cielo Azul + Nubes Voxel
    const TERRAIN_THEMES = [
      {
        name: 'CAMPO INAV DIA',
        skyZenith:  [52, 98, 175],
        skyHorizon: [195, 192, 182],
        cloudCol:   [245, 244, 240],
        fogCol:     rgb565(188, 186, 175),
        baseA:      [76, 98, 44],
        baseB:      [88, 110, 50],
        hillCol:    [122, 114, 62]
      },
      {
        name: 'PRADERA VERDE',
        skyZenith:  [36, 88, 180],
        skyHorizon: [155, 195, 225],
        cloudCol:   [248, 250, 252],
        fogCol:     rgb565(155, 195, 225),
        baseA:      [38, 92, 42],
        baseB:      [46, 106, 48],
        hillCol:    [86, 134, 58]
      },
      {
        name: 'ATARDECER DORADO',
        skyZenith:  [42, 68, 135],
        skyHorizon: [222, 168, 118],
        cloudCol:   [252, 225, 192],
        fogCol:     rgb565(215, 165, 118),
        baseA:      [96, 78, 44],
        baseB:      [112, 90, 50],
        hillCol:    [152, 116, 64]
      }
    ];
    let currentThemeIdx = 0;

    function clampByte(v) {
      return v < 0 ? 0 : (v > 255 ? 255 : (v | 0));
    }

    const sinLut = new Float32Array(512);
    for (let i = 0; i < 512; i++) sinLut[i] = Math.sin((i * 2 * Math.PI) / 512);

    function fbmCloud(mx, mz) {
      const n1 = sinLut[(mx + mz) & 511] * sinLut[(mx - mz + 128) & 511];
      const n2 = sinLut[(mx * 2 + mz * 3 + 40) & 511] * sinLut[(mz * 2 - mx + 190) & 511];
      const n3 = sinLut[(mx * 4 - mz * 3 + 70) & 511] * sinLut[(mx * 3 + mz * 5 + 110) & 511];
      const n4 = sinLut[(mx * 7 + mz * 6) & 511];
      return n1 * 0.45 + n2 * 0.30 + n3 * 0.16 + n4 * 0.09;
    }

    // Genera el Terreno Voxel suave (0..3.2m) Y el Domo de Cielo Azul con Nubes Voxel
    function generateGentleVoxelMap(themeIdx) {
      currentThemeIdx = ((themeIdx % TERRAIN_THEMES.length) + TERRAIN_THEMES.length) % TERRAIN_THEMES.length;
      const theme = TERRAIN_THEMES[currentThemeIdx];
      const TWO_PI_512 = (2 * Math.PI) / 512;

      for (let mz = 0; mz < MAP_DIM; mz++) {
        const zOff = mz << MAP_SHIFT;
        const wz = ((mz <= 256 ? mz : mz - 512)) / MAP_SCALE;

        for (let mx = 0; mx < MAP_DIM; mx++) {
          const wx = ((mx <= 256 ? mx : mx - 512)) / MAP_SCALE;

          // 1. Alturas suaves del terreno (0.0m a 3.2m)
          const wave1 = Math.sin(mx * TWO_PI_512 * 3) * Math.cos(mz * TWO_PI_512 * 3);
          const wave2 = Math.sin((mx + mz) * TWO_PI_512 * 5) * 0.5;
          const wave3 = Math.cos((mx - mz * 2) * TWO_PI_512 * 8) * 0.25;
          let rawH = Math.max(0, (wave1 + wave2 + wave3 + 0.55) * 52);

          const distSpawn = Math.hypot(wx, wz + 10);
          if (distSpawn < 14) rawH *= Math.max(0, (distSpawn - 6) / 8);

          for (let g = 0; g < CIRCUIT_GATES.length; g++) {
            const gt = CIRCUIT_GATES[g];
            const dg = Math.hypot(wx - gt.x, wz - gt.z);
            if (dg < 9) rawH *= Math.max(0.1, (dg - 3) / 6);
          }
          voxHeight[zOff + mx] = Math.max(0, Math.min(130, Math.round(rawH)));

          // 2. Mapa Voxel de Cielo Azul + Nubes suaves (con la misma técnica 512x512)
          const cn = fbmCloud(mx, mz);
          const cloudDensity = Math.max(0, Math.min(1, (cn - 0.08) * 1.85));
          const cSmooth = cloudDensity * cloudDensity * (3 - 2 * cloudDensity);
          const sr = theme.skyZenith[0] * (1 - cSmooth) + theme.cloudCol[0] * cSmooth;
          const sg = theme.skyZenith[1] * (1 - cSmooth) + theme.cloudCol[1] * cSmooth;
          const sb = theme.skyZenith[2] * (1 - cSmooth) + theme.cloudCol[2] * cSmooth;
          voxSkyMap[zOff + mx] = rgb565(clampByte(sr), clampByte(sg), clampByte(sb));
        }
      }

      // 3. Colorear terreno con franjas de cultivo/pradera (como en la foto de INAV) + sombreado solar
      for (let mz = 0; mz < MAP_DIM; mz++) {
        const zOff = mz << MAP_SHIFT;
        for (let mx = 0; mx < MAP_DIM; mx++) {
          const h  = voxHeight[zOff + mx];
          const hR = voxHeight[zOff + ((mx + 2) & MAP_MASK)];
          const hD = voxHeight[((mz + 2) & MAP_MASK) << MAP_SHIFT | mx];
          const slope = (h - hR) * 1.8 + (h - hD) * 1.4;
          const shade = Math.max(0.68, Math.min(1.28, 1.0 + slope * 0.025));

          // Franjas de campo agrícola / pradera + caminos rurales
          const fieldStripe = ((mx >> 4) + ((mz >> 5) & 1)) & 1;
          const isPath = ((mx & 63) === 0) || ((mz & 63) === 0);
          const base = fieldStripe ? theme.baseA : theme.baseB;
          const tHill = Math.min(1.0, h / 95.0);

          let r = base[0] * (1 - tHill) + theme.hillCol[0] * tHill;
          let g = base[1] * (1 - tHill) + theme.hillCol[1] * tHill;
          let b = base[2] * (1 - tHill) + theme.hillCol[2] * tHill;

          if (isPath) {
            r += 24; g += 18; b += 8;
          }

          voxColor[zOff + mx] = rgb565(
            clampByte(r * shade),
            clampByte(g * shade),
            clampByte(b * shade)
          );
        }
      }
    }

    generateGentleVoxelMap(0);

    function getTerrainHeightMeters(wx, wz) {
      const mx = Math.floor(wx * MAP_SCALE) & MAP_MASK;
      const mz = Math.floor(wz * MAP_SCALE) & MAP_MASK;
      return voxHeight[(mz << MAP_SHIFT) | mx] * HEIGHT_SCALE;
    }

    function blend565Half(c1, c2) {
      return (((c1 & 0xF7DE) >> 1) + ((c2 & 0xF7DE) >> 1));
    }

    // Focal unificada para que Voxel Terrain, Voxel Sky, Gates y Horizonte Artificial coincidan al 100%
    const FOCAL_128  = 68.0;
    const FOCAL_240  = FOCAL_128 * SCALE_Y; // 255.0
    const BLIT_SCALE = 0.62;
    const FOCAL_VOX  = FOCAL_240 * BLIT_SCALE; // 158.1
    let lastRollAngle = 0;
    let cloudDriftX = 0;

    // Renderizador Voxel de Terreno + Cielo con Nubes 3D
    function renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz, dt = 0.016) {
      cloudDriftX = (cloudDriftX + dt * 1.8) % 512;
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }

      const theme = TERRAIN_THEMES[currentThemeIdx];
      const fogCol = theme.fogCol;

      // 1. Extraer ángulo de Roll y base des-rotada exacta (R0, U0, F)
      const upMag = Math.hypot(cRy, cUy);
      if (upMag > 0.04) {
        lastRollAngle = Math.atan2(cRy, cUy);
      }
      const phi = lastRollAngle;
      const cosR = Math.cos(phi), sinR = Math.sin(phi);

      let R0x = cosR * cRx - sinR * cUx;
      let R0z = cosR * cRz - sinR * cUz;
      const rLen = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rLen;
      R0z /= rLen;

      const H0x = -R0z;
      const H0z =  R0x;

      const U0x = sinR * cRx + cosR * cUx;
      const U0y = sinR * cRy + cosR * cUy;
      const U0z = sinR * cRz + cosR * cUz;

      const uH = U0x * H0x + U0z * H0z;
      const fH = cFx * H0x + cFz * H0z;

      const fHClamped = Math.abs(fH) < 0.15 ? (fH >= 0 ? 0.15 : -0.15) : fH;
      const horizonV = Math.max(-128, Math.min(384, Math.round(128 - (uH / fHClamped) * FOCAL_VOX)));

      const invFocalVox = 1.0 / FOCAL_VOX;
      const maxDist = 75.0;
      const startX = camX * MAP_SCALE;
      const startZ = camZ * MAP_SCALE;
      const skyStartX = camX * 1.2 + cloudDriftX;
      const skyStartZ = camZ * 1.2;

      // 2. Raycasting por columna u (0..255): Terreno abajo + Techo de Nubes Voxel arriba
      for (let u = 0; u < VOX_W; u++) {
        const xi = (u - 128) * invFocalVox * Math.max(0.25, fH);
        const dirW_X = H0x + xi * R0x;
        const dirW_Z = H0z + xi * R0z;
        const dirX = dirW_X * MAP_SCALE;
        const dirZ = dirW_Z * MAP_SCALE;

        let yMax = VOX_H;
        let s = 0.6;
        let ds = 0.28;

        while (s < maxDist && yMax > 0) {
          const mx = (startX + dirX * s) & MAP_MASK;
          const mz = (startZ + dirZ * s) & MAP_MASK;
          const mIdx = (mz << MAP_SHIFT) | mx;

          const dy = voxHeight[mIdx] * HEIGHT_SCALE - camY;
          const cz = s * fH + dy * cFy;
          if (cz > 0.25) {
            const cy0 = s * uH + dy * U0y;
            const v = (128 - (cy0 * FOCAL_VOX) / cz) | 0;

            if (v < yMax) {
              const vTop = v < 0 ? 0 : v;
              let col = voxColor[mIdx];
              if (s > 38.0) {
                col = blend565Half(col, fogCol);
                if (s > 55.0) col = blend565Half(col, fogCol);
              }
              let ptr = (vTop << 8) | u;
              for (let y = vTop; y < yMax; y++, ptr += VOX_W) {
                voxBuf[ptr] = col;
              }
              yMax = vTop;
            }
          }

          s += ds;
          ds += 0.014;
        }

        // 3. Cielo Azul + Nubes proyectadas en perspectiva Voxel (misma técnica de plano horizontal a altura fija)
        if (yMax > 0) {
          let ptr = u;
          for (let y = 0; y < yMax; y++, ptr += VOX_W) {
            const dyHoriz = horizonV - y;
            if (dyHoriz <= 2) {
              // Bruma cálida justo en la línea del horizonte
              voxBuf[ptr] = fogCol;
            } else {
              // Intersección del rayo con el techo de nubes Voxel
              const sCloud = (2400.0 / (dyHoriz + 10));
              const cmx = (skyStartX + dirW_X * sCloud) & MAP_MASK;
              const cmz = (skyStartZ + dirW_Z * sCloud) & MAP_MASK;
              let skyCol = voxSkyMap[(cmz << MAP_SHIFT) | cmx];
              // Mezclar suavemente con la bruma cerca del horizonte (dyHoriz < 36)
              if (dyHoriz < 36) {
                skyCol = blend565Half(skyCol, fogCol);
                if (dyHoriz < 16) skyCol = blend565Half(skyCol, fogCol);
              }
              voxBuf[ptr] = skyCol;
            }
          }
        }
      }

      // 4. Blit Rotado en Punto Fijo 16.16 hacia la pantalla completa 320x240
      const du_dx = ( cosR * BLIT_SCALE * 65536) | 0;
      const dv_dx = (-sinR * BLIT_SCALE * 65536) | 0;
      const du_dy = ( sinR * BLIT_SCALE * 65536) | 0;
      const dv_dy = ( cosR * BLIT_SCALE * 65536) | 0;

      const centerU = 128 * 65536;
      const centerV = 128 * 65536;

      let rowU = centerU - 160 * du_dx - 120 * du_dy;
      let rowV = centerV - 160 * dv_dx - 120 * dv_dy;

      let dstIdx = 0;
      for (let sy = 0; sy < DISP_H; sy++) {
        let uFP = rowU;
        let vFP = rowV;
        for (let sx = 0; sx < DISP_W; sx++) {
          const uu = (uFP >> 16) & 255;
          const vv = (vFP >> 16) & 255;
          vram565[dstIdx++] = voxBuf[(vv << 8) | uu];
          uFP += du_dx;
          vFP += dv_dx;
        }
        rowU += du_dy;
        rowV += dv_dy;
      }
    }

    // Proyector 3D exacto en coordenadas nativas 320x240
    function createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz) {
      function projPoint320(wx, wy, wz) {
        const dx = wx - camX, dy = wy - camY, dz = wz - camZ;
        const cx = dx*cRx + dy*cRy + dz*cRz;
        const cy = dx*cUx + dy*cUy + dz*cUz;
        const cz = dx*cFx + dy*cFy + dz*cFz;
        if (cz < 0.25) return null;
        return {
          sx: 160 + (cx * FOCAL_240) / cz,
          sy: 120 - (cy * FOCAL_240) / cz,
          cz
        };
      }

      function projLine(x0, y0, z0, x1, y1, z1, dash = 0, col = 1) {
        const dx0 = x0 - camX, dy0 = y0 - camY, dz0 = z0 - camZ;
        const dx1 = x1 - camX, dy1 = y1 - camY, dz1 = z1 - camZ;
        let cx0 = dx0*cRx + dy0*cRy + dz0*cRz, cy0 = dx0*cUx + dy0*cUy + dz0*cUz, cz0 = dx0*cFx + dy0*cFy + dz0*cFz;
        let cx1 = dx1*cRx + dy1*cRy + dz1*cRz, cy1 = dx1*cUx + dy1*cUy + dz1*cUz, cz1 = dx1*cFx + dy1*cFy + dz1*cFz;
        if (cz0 < 0.2 && cz1 < 0.2) return;
        if (cz0 > 75 && cz1 > 75) return;
        if (cz0 < 0.2) { const t = (0.2 - cz0)/(cz1 - cz0); cx0 += t*(cx1 - cx0); cy0 += t*(cy1 - cy0); cz0 = 0.2; }
        else if (cz1 < 0.2) { const t = (0.2 - cz1)/(cz0 - cz1); cx1 += t*(cx0 - cx1); cy1 += t*(cy0 - cy1); cz1 = 0.2; }

        const sx0 = 160 + (cx0 * FOCAL_240) / cz0;
        const sy0 = 120 - (cy0 * FOCAL_240) / cz0;
        const sx1 = 160 + (cx1 * FOCAL_240) / cz1;
        const sy1 = 120 - (cy1 * FOCAL_240) / cz1;
        fbDrawLine(sx0 / SCALE_X, sy0 / SCALE_Y, sx1 / SCALE_X, sy1 / SCALE_Y, dash, col);
      }

      return { projPoint320, projLine };
    }

    function renderCircuitGates(projLine, activeGate) {
      for (let i = 0; i < CIRCUIT_GATES.length; i++) {
        const g = CIRCUIT_GATES[i];
        const hw = g.w * 0.5, hh = g.h * 0.5;
        const isAct = (i === activeGate);
        const col = isAct ? 10 : 5;
        const gFloor = getTerrainHeightMeters(g.x, g.z);
        projLine(g.x - hw, gFloor, g.z, g.x - hw, g.y + hh, g.z, 0, col);
        projLine(g.x + hw, gFloor, g.z, g.x + hw, g.y + hh, g.z, 0, col);
        projLine(g.x - hw, g.y + hh, g.z, g.x + hw, g.y + hh, g.z, 0, isAct ? 2 : col);
        projLine(g.x - hw, g.y - hh, g.z, g.x + hw, g.y - hh, g.z, 0, col);
        if (isAct) {
          projLine(g.x, g.y + hh + 1.2, g.z, g.x - 1, g.y + hh + 2.4, g.z, 0, 2);
          projLine(g.x, g.y + hh + 1.2, g.z, g.x + 1, g.y + hh + 2.4, g.z, 0, 2);
        }
      }
    }

    /***************************************************************************
     * PRIMITIVAS NATIVAS 320x240 PARA EL OSD ESTILO INAV (BLANCO CON BORDE NEGRO)
     ***************************************************************************/
    function setPx320(x, y, col565) {
      const ix = x | 0, iy = y | 0;
      if (ix >= 0 && ix < DISP_W && iy >= 0 && iy < DISP_H) {
        vram565[iy * DISP_W + ix] = col565;
      }
    }

    // Dibuja un bloque de 2x2 con contorno negro de 1px alrededor
    function drawOutlinedDot320(x, y, fg565 = 0xFFFF) {
      const ix = x | 0, iy = y | 0;
      for (let dy = -1; dy <= 2; dy++) {
        const py = iy + dy;
        if (py < 0 || py >= DISP_H) continue;
        const row = py * DISP_W;
        for (let dx = -1; dx <= 2; dx++) {
          const px = ix + dx;
          if (px < 0 || px >= DISP_W) continue;
          if (dx >= 0 && dx <= 1 && dy >= 0 && dy <= 1) {
            vram565[row + px] = fg565;
          } else if (vram565[row + px] !== fg565) {
            vram565[row + px] = 0x0000;
          }
        }
      }
    }

    // Dibuja un círculo pequeño estilo INAV (como las bolitas del horizonte artificial y escalas verticales)
    function drawInavCircleDot320(cx, cy, r = 2, fg565 = 0xFFFF) {
      const ix = Math.round(cx), iy = Math.round(cy);
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        for (let dx = -r - 1; dx <= r + 1; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 <= r * r) {
            setPx320(ix + dx, iy + dy, fg565);
          } else if (d2 <= (r + 1) * (r + 1) + 1) {
            setPx320(ix + dx, iy + dy, 0x0000);
          }
        }
      }
    }

    // Línea nativa en 320x240 con borde negro de 1px
    function drawOutlinedLine320(x0, y0, x1, y1, fg565 = 0xFFFF) {
      const steps = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0)));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx !== 0 || dy !== 0) setPx320(x + dx, y + dy, 0x0000);
          }
        }
      }
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        setPx320(x, y, fg565);
      }
    }

    // Texto nativo 320x240 estilo chip OSD MAX7456 de INAV (blanco puro con borde negro de 1px)
    const TICK_GLYPH = [2, 2, 0, 0, 0];
    function drawInavText320(str, x320, y240, fg565 = 0xFFFF) {
      const s = String(str).toUpperCase();
      let cx = x320 | 0;
      const cy = y240 | 0;

      // Pasada 1: Contorno negro de 1px
      for (let i = 0; i < s.length; i++) {
        const g = s[i] === '\'' ? TICK_GLYPH : FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const rowBits = g[r];
            for (let c = 0; c < 3; c++) {
              if ((rowBits >> (2 - c)) & 1) {
                const px = cx + c * 2;
                const py = cy + r * 2;
                for (let oy = -1; oy <= 2; oy++) {
                  for (let ox = -1; ox <= 2; ox++) {
                    setPx320(px + ox, py + oy, 0x0000);
                  }
                }
              }
            }
          }
        }
        cx += 8;
      }

      // Pasada 2: Relleno blanco nítido 2x2 por texel de fuente
      cx = x320 | 0;
      for (let i = 0; i < s.length; i++) {
        const g = s[i] === '\'' ? TICK_GLYPH : FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const rowBits = g[r];
            for (let c = 0; c < 3; c++) {
              if ((rowBits >> (2 - c)) & 1) {
                const px = cx + c * 2;
                const py = cy + r * 2;
                setPx320(px,     py,     fg565);
                setPx320(px + 1, py,     fg565);
                setPx320(px,     py + 1, fg565);
                setPx320(px + 1, py + 1, fg565);
              }
            }
          }
        }
        cx += 8;
      }
    }

    // Icono de batería INAV en 320x240
    function drawBatteryIcon320(x, y) {
      drawOutlinedLine320(x, y + 2, x + 7, y + 2);
      drawOutlinedLine320(x, y + 11, x + 7, y + 11);
      drawOutlinedLine320(x, y + 2, x, y + 11);
      drawOutlinedLine320(x + 7, y + 2, x + 7, y + 11);
      drawOutlinedLine320(x + 2, y, x + 5, y);
      for (let py = y + 4; py <= y + 9; py++) {
        for (let px = x + 2; px <= x + 5; px++) setPx320(px, py, 0xFFFF);
      }
    }

    // Icono de Casa (Home / Gate) INAV en 320x240
    function drawHomeIcon320(x, y) {
      drawOutlinedLine320(x + 4, y, x, y + 4);
      drawOutlinedLine320(x + 4, y, x + 8, y + 4);
      drawOutlinedLine320(x + 1, y + 4, x + 1, y + 9);
      drawOutlinedLine320(x + 7, y + 4, x + 7, y + 9);
      drawOutlinedLine320(x + 1, y + 9, x + 7, y + 9);
    }

    // Renderizador completo del OSD estilo INAV (basado en la imagen de referencia del usuario)
    function renderInavOsd320({
      callsign, modeLabel, spdMs, thrPct, altM, vario,
      activeGate, gateDist, gateBearingRad, totalDistKm,
      flightTimeSec, camX, camY, camZ,
      cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz, projPoint320
    }) {
      const WHITE = 0xFFFF;
      const GREEN_DOT = rgb565(120, 245, 120);

      // 1. HORIZONTE ARTIFICIAL INAV (9 círculos proyectados en 3D usando la misma base R0, H0 del Voxel)
      // Coincide con el horizonte Voxel a 14 decimales en cualquier combinación de Pitch, Roll y Yaw.
      const phi = Math.atan2(cRy, cUy);
      const cosR = Math.cos(phi), sinR = Math.sin(phi);
      let R0x = cosR * cRx - sinR * cUx;
      let R0z = cosR * cRz - sinR * cUz;
      const rLen = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rLen;
      R0z /= rLen;
      const H0x = -R0z, H0z = R0x;

      for (let i = -4; i <= 4; i++) {
        const span = i * 4.2;
        const wx = camX + H0x * 42.0 + R0x * span;
        const wz = camZ + H0z * 42.0 + R0z * span;
        const pt = projPoint320(wx, camY, wz);
        if (pt && pt.sx >= 48 && pt.sx <= 272 && pt.sy >= 24 && pt.sy <= 218) {
          drawInavCircleDot320(pt.sx, pt.sy, 2, i === 0 ? GREEN_DOT : WHITE);
        }
      }

      // 2. RETÍCULA CENTRAL FIJA INAV (───┐_┌───) en (160, 120)
      drawOutlinedLine320(134, 120, 151, 120, WHITE);
      drawOutlinedLine320(151, 120, 151, 125, WHITE);
      drawOutlinedLine320(151, 125, 169, 125, WHITE);
      drawOutlinedLine320(169, 125, 169, 120, WHITE);
      drawOutlinedLine320(169, 120, 186, 120, WHITE);

      // Flecha de dirección hacia el próximo Gate justo encima de la retícula central (160, 102)
      const ax = 160, ay = 101;
      const sB = Math.sin(gateBearingRad), cB = Math.cos(gateBearingRad);
      const tipX = ax + sB * 7, tipY = ay - cB * 7;
      const lWingX = ax - sB * 5 - cB * 5, lWingY = ay + cB * 5 - sB * 5;
      const rWingX = ax - sB * 5 + cB * 5, rWingY = ay + cB * 5 + sB * 5;
      drawOutlinedLine320(tipX, tipY, lWingX, lWingY, WHITE);
      drawOutlinedLine320(tipX, tipY, rWingX, rWingY, WHITE);
      drawOutlinedLine320(lWingX, lWingY, rWingX, rWingY, WHITE);

      // 3. ESCALAS VERTICALES LATERALES DE PUNTOS (Izquierda x=78 y Derecha x=242) + cursores '>' y '<'
      for (let i = -6; i <= 6; i++) {
        const py = 120 + i * 9;
        const rad = (i & 1) === 0 ? 2 : 1;
        drawInavCircleDot320(78,  py, rad, WHITE);
        drawInavCircleDot320(242, py, rad, WHITE);
      }
      // Indicador '>' a la izquierda (x=83, y=120)
      drawOutlinedLine320(82, 116, 87, 120, WHITE);
      drawOutlinedLine320(87, 120, 82, 124, WHITE);
      // Indicador '<' a la derecha (x=237, y=120)
      drawOutlinedLine320(238, 116, 233, 120, WHITE);
      drawOutlinedLine320(233, 120, 238, 124, WHITE);

      // 4. BRÚJULA SUPERIOR CENTRAL (W ' | ' N ' | ' E) + NOMBRE DEL MODELO
      const headingDeg = ((Math.atan2(H0x, H0z) * RAD2DEG) % 360 + 360) % 360;
      const cardinals = ['N', 'I', 'E', 'I', 'S', 'I', 'W', 'I'];
      const stepDeg = 45;
      const baseIdx = Math.floor(headingDeg / stepDeg);
      let compassStr = '';
      for (let k = -2; k <= 2; k++) {
        const idx = (baseIdx + k + 8) % 8;
        compassStr += cardinals[idx] + (k < 2 ? '\'' : '');
      }
      drawInavText320(compassStr, 124, 10, WHITE);
      drawInavText320(callsign,   112, 24, WHITE);

      // 5. ESQUINA SUPERIOR DERECHA (Satélites + HDOP)
      drawInavText320('SAT 12',   262, 22, WHITE);
      drawInavText320('HDOP 1.2', 246, 36, WHITE);

      // 6. COLUMNA IZQUIERDA (Velocidad km/h, Throttle %, Amperios, mAh, Voltaje Total y Voltaje por Celda)
      const kmh = Math.round(spdMs * 3.6);
      drawInavText320(`${String(kmh).padStart(2, ' ')}KMH`, 22, 115, WHITE);
      drawInavText320(`THR ${Math.round(thrPct)}%`,         14, 134, WHITE);

      const amps = (2.2 + (thrPct / 100) * 14.5).toFixed(1);
      const mah  = Math.round(120 + flightTimeSec * 4.2);
      const packV = Math.max(14.2, 16.8 - flightTimeSec * 0.005);
      const cellV = (packV / 4).toFixed(2);

      drawInavText320(`A ${amps}`,     14, 156, WHITE);
      drawInavText320(`MAH ${mah}`,    14, 174, WHITE);
      drawBatteryIcon320(10, 191);
      drawInavText320(`${packV.toFixed(2)}V`, 22, 192, WHITE);
      drawBatteryIcon320(10, 209);
      drawInavText320(`${cellV}V`,     22, 210, WHITE);

      // 7. COLUMNA DERECHA (Altitud Alt m, Variómetro m/s, Rumbo a Gate, Tiempo de Vuelo, Distancia)
      drawInavText320(`ALT ${Math.round(altM)}M`, 252, 104, WHITE);
      drawInavText320(`${vario.toFixed(1)}M/S`,   252, 120, WHITE);

      const brgDeg = Math.round(gateBearingRad * RAD2DEG);
      drawHomeIcon320(246, 155);
      drawInavText320(`G${activeGate + 1} ${brgDeg >= 0 ? '+' : ''}${brgDeg}`, 258, 156, WHITE);

      const mins = String(Math.floor(flightTimeSec / 60)).padStart(2, '0');
      const secs = String(Math.floor(flightTimeSec % 60)).padStart(2, '0');
      drawInavText320(`FLY ${mins}:${secs}`,      246, 174, WHITE);
      drawInavText320(`TD ${totalDistKm.toFixed(2)}`, 246, 192, WHITE);
      drawHomeIcon320(246, 209);
      drawInavText320(`DST ${Math.min(999, Math.round(gateDist))}M`, 258, 210, WHITE);

      // 8. CENTRO INFERIOR (Modo de Vuelo: HOR / ACRO / STAB)
      drawInavText320(modeLabel, 146, 214, WHITE);
    }

    function handleInFlightShortcuts(craft) {
      if (hwInput.justPressed('SELECT')) {
        generateGentleVoxelMap(currentThemeIdx + 1);
        showToast(TERRAIN_THEMES[currentThemeIdx].name);
        playTone(700, 0.04);
      }
      if (hwInput.justPressed('LEFT') || hwInput.justPressed('RIGHT')) {
        const nextId = activeRomId === 'fpv_drone' ? 'fpv_wing' : 'fpv_drone';
        launchRom(nextId);
        showToast(nextId === 'fpv_drone' ? 'MODO: FPV DRONE' : 'MODO: ALA FIJA FPV');
        return true;
      }
      if (capTouch.justTapped && capTouch.ly64 <= 12) {
        if (capTouch.lx128 < 45) {
          generateGentleVoxelMap(currentThemeIdx + 1);
          showToast(TERRAIN_THEMES[currentThemeIdx].name);
        } else if (capTouch.lx128 < 85) {
          craft.mode = craft.mode === 'ACRO' ? 'HOR' : 'ACRO';
          showToast(`MODE: ${craft.mode}`);
        } else {
          const nextId = activeRomId === 'fpv_drone' ? 'fpv_wing' : 'fpv_drone';
          launchRom(nextId);
          showToast(nextId === 'fpv_drone' ? 'MODO: FPV DRONE' : 'MODO: ALA FIJA FPV');
          return true;
        }
        capTouch.justTapped = false;
      }
      return false;
    }

    function stepRotationSO3(craft, dt) {
      const p = craft.pitchRate * dt, r = craft.rollRate * dt, y = craft.yawRate * dt;
      const thSq = p*p + r*r + y*y;
      if (thSq > 1e-12) {
        const th = Math.sqrt(thSq);
        const c1 = Math.sin(th) / th, c2 = (1 - Math.cos(th)) / thSq;
        const rx = craft.rx, ry = craft.ry, rz = craft.rz;
        const ux = craft.ux, uy = craft.uy, uz = craft.uz;
        const fx = craft.fx, fy = craft.fy, fz = craft.fz;

        const v1Rx = -r*ux - y*fx, v1Ry = -r*uy - y*fy, v1Rz = -r*uz - y*fz;
        const v1Ux =  r*rx + p*fx, v1Uy =  r*ry + p*fy, v1Uz =  r*rz + p*fz;
        const v1Fx =  y*rx - p*ux, v1Fy =  y*ry - p*uy, v1Fz =  y*rz - p*uz;

        const v2Rx = -r*v1Ux - y*v1Fx, v2Ry = -r*v1Uy - y*v1Fy, v2Rz = -r*v1Uz - y*v1Fz;
        const v2Ux =  r*v1Rx + p*v1Fx, v2Uy =  r*v1Ry + p*v1Fy, v2Uz =  r*v1Rz + p*v1Fz;
        const v2Fx =  y*v1Rx - p*v1Ux, v2Fy =  y*v1Ry - p*v1Uy, v2Fz =  y*v1Rz - p*v1Uz;

        craft.rx = rx + c1*v1Rx + c2*v2Rx; craft.ry = ry + c1*v1Ry + c2*v2Ry; craft.rz = rz + c1*v1Rz + c2*v2Rz;
        craft.ux = ux + c1*v1Ux + c2*v2Ux; craft.uy = uy + c1*v1Uy + c2*v2Uy; craft.uz = uz + c1*v1Uz + c2*v2Uz;
        craft.fx = fx + c1*v1Fx + c2*v2Fx; craft.fy = fy + c1*v1Fy + c2*v2Fy; craft.fz = fz + c1*v1Fz + c2*v2Fz;

        const fL = Math.hypot(craft.fx, craft.fy, craft.fz) || 1;
        craft.fx /= fL; craft.fy /= fL; craft.fz /= fL;
        const dot = craft.ux*craft.fx + craft.uy*craft.fy + craft.uz*craft.fz;
        craft.ux -= dot*craft.fx; craft.uy -= dot*craft.fy; craft.uz -= dot*craft.fz;
        const uL = Math.hypot(craft.ux, craft.uy, craft.uz) || 1;
        craft.ux /= uL; craft.uy /= uL; craft.uz /= uL;
        craft.rx = craft.uy*craft.fz - craft.uz*craft.fy;
        craft.ry = craft.uz*craft.fx - craft.ux*craft.fz;
        craft.rz = craft.ux*craft.fy - craft.uy*craft.fx;
      }
    }

    /***************************************************************************
     * 5. SIMULADOR 1: FPV DRONE (FISICAS Y CIRCUITO ORIGINALES + TERRENO Y NUBES VOXEL)
     ***************************************************************************/
    const fpvDroneSim = {
      px: 0, py: 2.2, pz: -10,
      vx: 0, vy: 0, vz: 0,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      mode: 'ACRO',
      chaseCam: false,
      activeGate: 0,
      thrCmd: 0.36,
      flightTime: 0,
      totalDistKm: 0,

      reset() {
        this.px = 0; this.py = 2.2; this.pz = -10;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.pitchRate = 0; this.rollRate = 0; this.yawRate = 0;
        this.rx = 1; this.ry = 0; this.rz = 0;
        this.ux = 0; this.uy = 1; this.uz = 0;
        this.fx = 0; this.fy = 0; this.fz = 1;
        this.activeGate = 0;
        this.flightTime = 0;
        this.totalDistKm = 0;
        lastRollAngle = 0;
      },

      step(dt) {
        if (handleInFlightShortcuts(this)) return;
        this.flightTime += dt;

        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) {
          this.mode = this.mode === 'ACRO' ? 'HOR' : 'ACRO';
          showToast(`MODE: ${this.mode}`);
        }
        if (hwInput.justPressed('X')) { this.reset(); showToast('DRONE RESET'); }
        if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
          this.chaseCam = !this.chaseCam;
          showToast(this.chaseCam ? 'CAM: 3RD PERSON' : 'CAM: FPV FULL');
        }

        const baseThr = 0.36;
        let thr = hwInput.ly >= 0 ? baseThr + hwInput.ly * (1 - baseThr) : baseThr * (1 + hwInput.ly);
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.25);
        this.thrCmd = thr;

        const curPitch = Math.atan2(-this.fy, this.uy);
        const curRoll  = Math.atan2(-this.ry, this.uy);

        let tPitch = 0, tRoll = 0, tYaw = hwInput.lx * 210 * DEG2RAD;
        if (this.mode === 'ACRO') {
          tPitch = hwInput.ry * 300 * DEG2RAD;
          tRoll  = hwInput.rx * 300 * DEG2RAD;
        } else {
          tPitch = ((hwInput.ry * 48 * DEG2RAD) - curPitch) * 7.0;
          tRoll  = ((hwInput.rx * 48 * DEG2RAD) - curRoll)  * 7.0;
        }

        const alpha = Math.min(1.0, 20.0 * dt);
        this.pitchRate += (tPitch - this.pitchRate) * alpha;
        this.rollRate  += (tRoll  - this.rollRate)  * alpha;
        this.yawRate   += (tYaw   - this.yawRate)   * alpha;

        stepRotationSO3(this, dt);

        const thrust = thr * 26.0;
        const spd = Math.hypot(this.vx, this.vy, this.vz);
        this.totalDistKm += (spd * dt) / 1000.0;
        const drag = 0.08 + 0.008 * spd;
        this.vx += (this.ux * thrust - this.vx * drag) * dt;
        this.vy += (this.uy * thrust - 9.81 - this.vy * drag) * dt;
        this.vz += (this.uz * thrust - this.vz * drag) * dt;

        this.px += this.vx * dt; this.py += this.vy * dt; this.pz += this.vz * dt;
        const groundH = getTerrainHeightMeters(this.px, this.pz);
        if (this.py < groundH + 0.30) {
          this.py = groundH + 0.30;
          if (this.vy < 0) this.vy = -this.vy * 0.2;
          this.vx *= 0.92; this.vz *= 0.92;
        }

        const g = CIRCUIT_GATES[this.activeGate];
        if (Math.hypot(this.px - g.x, this.py - g.y, this.pz - g.z) < 3.5) {
          this.activeGate = (this.activeGate + 1) % CIRCUIT_GATES.length;
          showToast(`GATE ${this.activeGate}/${CIRCUIT_GATES.length} OK!`);
          playTone(880, 0.08);
        }
      },

      render() {
        const tilt = 15 * DEG2RAD;
        const cT = Math.cos(tilt), sT = Math.sin(tilt);
        const cRx = this.rx, cRy = this.ry, cRz = this.rz;
        const cUx = cT*this.ux - sT*this.fx, cUy = cT*this.uy - sT*this.fy, cUz = cT*this.uz - sT*this.fz;
        const cFx = sT*this.ux + cT*this.fx, cFy = sT*this.uy + cT*this.fy, cFz = sT*this.uz + cT*this.fz;

        const camX = this.chaseCam ? this.px - cFx * 3.5 + cUx * 1.0 : this.px;
        const camZ = this.chaseCam ? this.pz - cFz * 3.5 + cUz * 1.0 : this.pz;
        const minCamY = getTerrainHeightMeters(camX, camZ) + 0.35;
        const camY = Math.max(minCamY, this.chaseCam ? this.py - cFy * 3.5 + cUy * 1.0 : this.py);

        // 1. Terreno Voxel + Cielo Azul con Nubes Voxel a pantalla completa
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Gates 3D
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderCircuitGates(projLine, this.activeGate);

        if (this.chaseCam) {
          const arm = 0.65;
          projLine(this.px - (this.fx + this.rx)*arm, this.py, this.pz - (this.fz + this.rz)*arm,
                   this.px + (this.fx + this.rx)*arm, this.py, this.pz + (this.fz + this.rz)*arm, 0, 2);
          projLine(this.px - (this.fx - this.rx)*arm, this.py, this.pz - (this.fz - this.rz)*arm,
                   this.px + (this.fx - this.rx)*arm, this.py, this.pz + (this.fz - this.rz)*arm, 0, 2);
        }

        // 3. OSD estilo INAV con Horizonte Artificial proyectado directamente sobre el horizonte 3D
        const g = CIRCUIT_GATES[this.activeGate];
        const dxG = g.x - this.px, dzG = g.z - this.pz;
        const gateDist = Math.hypot(dxG, g.y - this.py, dzG);
        const gateBearingRad = Math.atan2(dxG * this.rx + dzG * this.rz, dxG * this.fx + dzG * this.fz);
        const spd = Math.hypot(this.vx, this.vy, this.vz);

        renderInavOsd320({
          callsign: 'Q-50 INAV-S3',
          modeLabel: this.mode,
          spdMs: spd,
          thrPct: this.thrCmd * 100,
          altM: this.py,
          vario: this.vy,
          activeGate: this.activeGate,
          gateDist,
          gateBearingRad,
          totalDistKm: this.totalDistKm,
          flightTimeSec: this.flightTime,
          camX, camY, camZ,
          cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz,
          projPoint320
        });
      }
    };

    /***************************************************************************
     * 6. SIMULADOR 2: FPV FIXED-WING / ALA FIJA (Z-84 INAV)
     ***************************************************************************/
    const fpvWingSim = {
      px: 0, py: 2.8, pz: -14,
      vx: 0, vy: 0, vz: 14,
      spd: 14,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      mode: 'HOR',
      chaseCam: false,
      activeGate: 0,
      thrCmd: 0.45,
      flightTime: 0,
      totalDistKm: 0,

      reset() {
        this.px = 0; this.py = 2.8; this.pz = -14;
        this.spd = 14.0;
        this.vx = 0; this.vy = 0; this.vz = 14.0;
        this.pitchRate = 0; this.rollRate = 0; this.yawRate = 0;
        this.rx = 1; this.ry = 0; this.rz = 0;
        this.ux = 0; this.uy = 1; this.uz = 0;
        this.fx = 0; this.fy = 0; this.fz = 1;
        this.activeGate = 0;
        this.flightTime = 0;
        this.totalDistKm = 0;
        lastRollAngle = 0;
      },

      step(dt) {
        if (handleInFlightShortcuts(this)) return;
        this.flightTime += dt;

        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) {
          this.mode = this.mode === 'ACRO' ? 'HOR' : 'ACRO';
          showToast(`WING MODE: ${this.mode}`);
        }
        if (hwInput.justPressed('X')) { this.reset(); showToast('WING RESET'); }
        if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
          this.chaseCam = !this.chaseCam;
          showToast(this.chaseCam ? 'CAM: 3RD PERSON' : 'CAM: FPV FULL');
        }

        const baseThr = 0.45;
        let thr = hwInput.ly >= 0 ? baseThr + hwInput.ly * (1 - baseThr) : baseThr * (1 + hwInput.ly);
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.35);
        this.thrCmd = thr;

        const curPitch = Math.atan2(-this.fy, this.uy);
        const curRoll  = Math.atan2(-this.ry, this.uy);

        const bankTurnYaw = -this.ry * 1.15;
        let tPitch = 0, tRoll = 0, tYaw = (hwInput.lx * 120 * DEG2RAD) + bankTurnYaw;

        if (this.mode === 'ACRO') {
          tPitch = hwInput.ry * 180 * DEG2RAD;
          tRoll  = hwInput.rx * 240 * DEG2RAD;
        } else {
          tPitch = ((hwInput.ry * 40 * DEG2RAD) - curPitch) * 6.5;
          tRoll  = ((hwInput.rx * 55 * DEG2RAD) - curRoll)  * 6.5;
        }

        const alpha = Math.min(1.0, 18.0 * dt);
        this.pitchRate += (tPitch - this.pitchRate) * alpha;
        this.rollRate  += (tRoll  - this.rollRate)  * alpha;
        this.yawRate   += (tYaw   - this.yawRate)   * alpha;

        stepRotationSO3(this, dt);

        const accel = thr * 18.0 - 9.81 * this.fy - 0.55 * this.spd;
        this.spd = Math.max(7.0, Math.min(34.0, this.spd + accel * dt));
        this.totalDistKm += (this.spd * dt) / 1000.0;

        const stallSink = this.spd < 9.5 ? (9.5 - this.spd) * 1.2 : 0;
        const targetVx = this.fx * this.spd;
        const targetVy = this.fy * this.spd - stallSink;
        const targetVz = this.fz * this.spd;

        const wingGrip = Math.min(1.0, 12.0 * dt);
        this.vx += (targetVx - this.vx) * wingGrip;
        this.vy += (targetVy - this.vy) * wingGrip;
        this.vz += (targetVz - this.vz) * wingGrip;

        this.px += this.vx * dt; this.py += this.vy * dt; this.pz += this.vz * dt;
        const groundH = getTerrainHeightMeters(this.px, this.pz);
        if (this.py < groundH + 0.35) {
          this.py = groundH + 0.35;
          if (this.vy < 0) this.vy = -this.vy * 0.2;
        }

        const g = CIRCUIT_GATES[this.activeGate];
        if (Math.hypot(this.px - g.x, this.py - g.y, this.pz - g.z) < 3.8) {
          this.activeGate = (this.activeGate + 1) % CIRCUIT_GATES.length;
          showToast(`GATE ${this.activeGate}/${CIRCUIT_GATES.length} OK!`);
          playTone(920, 0.08);
        }
      },

      render() {
        const cRx = this.rx, cRy = this.ry, cRz = this.rz;
        const cUx = this.ux, cUy = this.uy, cUz = this.uz;
        const cFx = this.fx, cFy = this.fy, cFz = this.fz;

        const camX = this.chaseCam ? this.px - cFx * 3.8 + cUx * 0.9 : this.px;
        const camZ = this.chaseCam ? this.pz - cFz * 3.8 + cUz * 0.9 : this.pz;
        const minCamY = getTerrainHeightMeters(camX, camZ) + 0.35;
        const camY = Math.max(minCamY, this.chaseCam ? this.py - cFy * 3.8 + cUy * 0.9 : this.py);

        // 1. Terreno Voxel + Cielo Azul con Nubes Voxel
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Gates 3D
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderCircuitGates(projLine, this.activeGate);

        if (this.chaseCam) {
