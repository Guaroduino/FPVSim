                            /***************************************************************************
     * 4. MOTOR VOXEL (TERRENO SUAVE + CIELO AZUL CON NUBES VOXEL) + INAV OSD 320x240
     ***************************************************************************/
    const DEG2RAD = Math.PI / 180.0;
    const RAD2DEG = 180.0 / Math.PI;

    // =========================================================================
    // MAPA VOXEL EN PSRAM OCTAL (ESP32-S3 N16R8: 6.5 MB de 8.0 MB PSRAM)
    // - Terreno Satelital 2048x1024 a escala real: 6,000m (6 km) x 4,000m (4 km)
    //   * voxHeight: 2048 * 1024 * 1B = 2.0 MB PSRAM
    //   * voxColor : 2048 * 1024 * 2B = 4.0 MB PSRAM
    // - Domo de Cielo + Nubes Voxel 512x512:
    //   * voxSkyMap:  512 *  512 * 2B = 0.5 MB PSRAM
    // =========================================================================
    const MAP_W        = 2048;
    const MAP_H        = 1024;
    const MAP_MASK_X   = 2047;
    const MAP_MASK_Z   = 1023;
    const MAP_SHIFT_X  = 11;           // mz << 11 == mz * 2048
    const WORLD_W_M    = 6000.0;       // 6 km Este-Oeste (escala real Chorobobo)
    const WORLD_H_M    = 4000.0;       // 4 km Norte-Sur  (escala real Chorobobo)
    const MAP_SCALE_X  = MAP_W / WORLD_W_M; // 0.3413333 texels/m (1 texel = 2.93 m)
    const MAP_SCALE_Z  = MAP_H / WORLD_H_M; // 0.2560000 texels/m (1 texel = 3.91 m)
    const HEIGHT_SCALE = 0.125;        // 0.125 m por unidad uint8 (0.0m a 31.8m para árboles y lomas)

    // Coordenada exacta de la Pista Aeromodelismo A.I.A Chorobobo en el ortomosaico 6x4 km
    const SPAWN_MX     = 1198;         // u = 0.585 * 2048
    const SPAWN_MZ     = 650;          // v = (1 - 0.365) * 1024 (Norte hacia +wz)

    // Cielo Voxel 512x512 en PSRAM
    const SKY_DIM      = 512;
    const SKY_MASK     = 511;
    const SKY_SHIFT    = 9;

    const voxHeight    = new Uint8Array(MAP_W * MAP_H);
    const voxColor     = new Uint16Array(MAP_W * MAP_H);
    const voxSkyMap    = new Uint16Array(SKY_DIM * SKY_DIM);

    let choroDecodedImg = null;
    let choroSatelliteReady = false;

    // Buffer intermedio des-rotado 256x256 en SRAM Interna (128 KB) para permitir Roll de 360°
    const VOX_W = 256;
    const VOX_H = 256;
    const voxBuf = new Uint16Array(VOX_W * VOX_H);

    // Conversión exacta de coordenada normalizada (u, v) sobre la ortofoto 6x4 km a metros (wx, wz)
    function uvToWorld(u, v) {
      return {
        x: Math.round((u - (SPAWN_MX / MAP_W)) * WORLD_W_M),
        z: Math.round(((SPAWN_MZ / MAP_H) - v) * WORLD_H_M)
      };
    }

    // Construye un circuito de 15 Gates orientados perpendicularmente a la tangente de vuelo (altura ideal 8-20m)
    function buildOrientedCircuit(id, name, shortCode, lineCol565, palIdx, uvList) {
      const n = uvList.length;
      const pts = uvList.map(([u, v]) => uvToWorld(u, v));
      const gates = [];
      for (let i = 0; i < n; i++) {
        const cur = pts[i];
        const nxt = pts[(i + 1) % n];
        const prv = pts[(i - 1 + n) % n];
        // Vector tangente promedio en la puerta i
        let tx = nxt.x - prv.x;
        let tz = nxt.z - prv.z;
        const tLen = Math.hypot(tx, tz) || 1.0;
        tx /= tLen;
        tz /= tLen;
        // Vector lateral derecho perpendicular a la tangente: (nx, nz) = (tz, -tx)
        gates.push({
          x: cur.x,
          y: 12.0,     // Centro de puerta a ~12m sobre el suelo (ideal para volar entre 8m y 20m)
          z: cur.z,
          w: 18.0,     // 18m de ancho para paso fluido a escala real 6x4 km
          h: 12.0,     // 12m de alto (de 6m a 18m AGL)
          tx, tz,
          nx: tz,
          nz: -tx
        });
      }
      return { id, name, shortCode, lineCol565, palIdx, gates };
    }

    // Los 3 Circuitos de 15 Gates trazados sobre el valle de Chorobobo (Rojo, Morado y Naranja)
    const CHOROBOBO_CIRCUITS = [
      // 1. CIRCUITO ROJO (15 Gates): Óvalo central por la Pista A.I.A Chorobobo y los tablones centrales
      buildOrientedCircuit('rojo', 'C1 ROJO PISTA', 'C1', rgb565(235, 52, 48), 4, [
        [0.575, 0.362], [0.532, 0.348], [0.488, 0.334], [0.442, 0.320], [0.402, 0.318],
        [0.412, 0.365], [0.436, 0.418], [0.462, 0.468], [0.492, 0.502], [0.542, 0.506],
        [0.592, 0.510], [0.642, 0.510], [0.658, 0.472], [0.656, 0.415], [0.618, 0.382]
      ]),
      // 2. CIRCUITO MORADO (15 Gates): Circuito medio hasta la laguna oeste, PDVSA Etanol y borde sur del bosque
      buildOrientedCircuit('morado', 'C2 MORADO VALLE', 'C2', rgb565(190, 58, 235), 10, [
        [0.545, 0.352], [0.455, 0.325], [0.352, 0.305], [0.268, 0.340], [0.214, 0.388],
        [0.174, 0.478], [0.215, 0.525], [0.315, 0.545], [0.415, 0.562], [0.515, 0.582],
        [0.610, 0.595], [0.680, 0.568], [0.692, 0.475], [0.665, 0.408], [0.605, 0.376]
      ]),
      // 3. CIRCUITO NARANJA (15 Gates): Gran circuito largo por los meandros del Río Turbio y recta sur
      buildOrientedCircuit('naranja', 'C3 NARANJA RIO', 'C3', rgb565(248, 132, 28), 9, [
        [0.550, 0.335], [0.544, 0.215], [0.522, 0.102], [0.462, 0.082], [0.392, 0.148],
        [0.318, 0.215], [0.242, 0.278], [0.135, 0.312], [0.068, 0.392], [0.145, 0.468],
        [0.285, 0.495], [0.425, 0.518], [0.560, 0.538], [0.665, 0.508], [0.642, 0.405]
      ])
    ];

    // Modos de circuito: 0 = C1 Rojo, 1 = C2 Morado, 2 = C3 Naranja, 3 = SIN GATES (Vuelo Libre)
    const TOTAL_CIRCUIT_MODES = CHOROBOBO_CIRCUITS.length + 1;
    let currentCircuitIdx = 0;
    let CIRCUIT_GATES = CHOROBOBO_CIRCUITS[0].gates;

    function isFreeFlightNoGates() {
      return currentCircuitIdx >= CHOROBOBO_CIRCUITS.length;
    }

    function getActiveCircuitLabel() {
      if (isFreeFlightNoGates()) return 'SIN GATES (LIBRE)';
      return CHOROBOBO_CIRCUITS[currentCircuitIdx].name;
    }

    function selectChoroboboCircuit(idx, craft = null, resetCraft = false) {
      currentCircuitIdx = ((idx % TOTAL_CIRCUIT_MODES) + TOTAL_CIRCUIT_MODES) % TOTAL_CIRCUIT_MODES;
      if (!isFreeFlightNoGates()) {
        CIRCUIT_GATES = CHOROBOBO_CIRCUITS[currentCircuitIdx].gates;
      }
      if (craft) {
        craft.activeGate = 0;
        if (resetCraft && !isFreeFlightNoGates()) craft.reset();
      }
      if (isFreeFlightNoGates()) {
        showToast('MAPA LIMPIO: SIN GATES (VUELO LIBRE)');
      } else {
        showToast(`${CHOROBOBO_CIRCUITS[currentCircuitIdx].name} (15 GATES)`);
      }
      playTone(840, 0.05);
    }

    // 4 Mapas / Temas con Cielo Azul + Nubes Voxel (El #1 es el ortomosaico satelital 6x4 km de Chorobobo)
    const TERRAIN_THEMES = [
      {
        id: 'chorobobo',
        name: 'AIA CHOROBOBO 6X4KM',
        skyZenith:  [48, 94, 175],
        skyHorizon: [192, 188, 176],
        cloudCol:   [246, 245, 240],
        fogCol:     rgb565(186, 182, 170),
        baseA:      [114, 98, 78],
        baseB:      [98, 84, 68],
        hillCol:    [42, 78, 38]
      },
      {
        id: 'campo',
        name: 'CAMPO INAV DIA',
        skyZenith:  [52, 98, 175],
        skyHorizon: [195, 192, 182],
        cloudCol:   [245, 244, 240],
        fogCol:     rgb565(188, 186, 175),
        baseA:      [76, 98, 44],
        baseB:      [88, 110, 50],
        hillCol:    [122, 114, 62]
      },
      {
        id: 'pradera',
        name: 'PRADERA VERDE',
        skyZenith:  [36, 88, 180],
        skyHorizon: [155, 195, 225],
        cloudCol:   [248, 250, 252],
        fogCol:     rgb565(155, 195, 225),
        baseA:      [38, 92, 42],
        baseB:      [46, 106, 48],
        hillCol:    [86, 134, 58]
      },
      {
        id: 'atardecer',
        name: 'ATARDECER DORADO',
        skyZenith:  [42, 68, 135],
        skyHorizon: [222, 168, 118],
        cloudCol:   [252, 225, 192],
        fogCol:     rgb565(215, 165, 118),
        baseA:      [96, 78, 44],
        baseB:      [112, 90, 50],
        hillCol:    [152, 116, 64]
      }
    ];
    let currentThemeIdx = 0;

    function clampByte(v) {
      return v < 0 ? 0 : (v > 255 ? 255 : (v | 0));
    }

    const sinLut = new Float32Array(512);
    for (let i = 0; i < 512; i++) sinLut[i] = Math.sin((i * 2 * Math.PI) / 512);

    function fbmCloud(mx, mz) {
      const n1 = sinLut[(mx + mz) & 511] * sinLut[(mx - mz + 128) & 511];
      const n2 = sinLut[(mx * 2 + mz * 3 + 40) & 511] * sinLut[(mz * 2 - mx + 190) & 511];
      const n3 = sinLut[(mx * 4 - mz * 3 + 70) & 511] * sinLut[(mx * 3 + mz * 5 + 110) & 511];
      const n4 = sinLut[(mx * 7 + mz * 6) & 511];
      return n1 * 0.45 + n2 * 0.30 + n3 * 0.16 + n4 * 0.09;
    }

    // Genera el Domo de Cielo Azul con Nubes Voxel (512x512) y el Terreno Voxel 2048x1024 (6 km x 4 km)
    function generateGentleVoxelMap(themeIdx) {
      currentThemeIdx = ((themeIdx % TERRAIN_THEMES.length) + TERRAIN_THEMES.length) % TERRAIN_THEMES.length;
      const theme = TERRAIN_THEMES[currentThemeIdx];

      // 1. Generar siempre el Domo de Cielo Azul + Nubes 512x512 para el tema activo
      for (let mz = 0; mz < SKY_DIM; mz++) {
        const zOff = mz << SKY_SHIFT;
        for (let mx = 0; mx < SKY_DIM; mx++) {
          const cn = fbmCloud(mx, mz);
          const cloudDensity = Math.max(0, Math.min(1, (cn - 0.08) * 1.85));
          const cSmooth = cloudDensity * cloudDensity * (3 - 2 * cloudDensity);
          const sr = theme.skyZenith[0] * (1 - cSmooth) + theme.cloudCol[0] * cSmooth;
          const sg = theme.skyZenith[1] * (1 - cSmooth) + theme.cloudCol[1] * cSmooth;
          const sb = theme.skyZenith[2] * (1 - cSmooth) + theme.cloudCol[2] * cSmooth;
          voxSkyMap[zOff + mx] = rgb565(clampByte(sr), clampByte(sg), clampByte(sb));
        }
      }

      // Si el tema es AIA CHOROBOBO y la foto satelital ya está disponible, decodificarla directamente en PSRAM
      if (theme.id === 'chorobobo' && choroDecodedImg) {
        bakeChoroboboToPsram(choroDecodedImg);
        return;
      }

      // 2. Generador procedural a escala 6 km x 4 km para los otros 3 mapas (CAMPO, PRADERA, ATARDECER)
      const TWO_PI_W = (2 * Math.PI) / MAP_W;
      const TWO_PI_H = (2 * Math.PI) / MAP_H;

      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const wz = (mz - SPAWN_MZ) / MAP_SCALE_Z;
        const cosZ3 = Math.cos(mz * TWO_PI_H * 6);

        for (let mx = 0; mx < MAP_W; mx++) {
          const wx = (mx - SPAWN_MX) / MAP_SCALE_X;
          const wave1 = Math.sin(mx * TWO_PI_W * 9) * cosZ3;
          const wave2 = Math.sin((mx + mz) * TWO_PI_W * 15) * 0.5;
          let rawH = Math.max(2, (wave1 + wave2 + 0.65) * 14); // 0.25m a 4.0m (en unidades de 0.125m)

          const distSpawn = Math.hypot(wx, wz);
          if (distSpawn < 55) rawH = 2 + (rawH - 2) * Math.max(0, (distSpawn - 25) / 30);

          voxHeight[zOff + mx] = Math.max(0, Math.min(90, Math.round(rawH)));
        }
      }

      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const zNext = ((mz + 2) & MAP_MASK_Z) << MAP_SHIFT_X;
        for (let mx = 0; mx < MAP_W; mx++) {
          const h  = voxHeight[zOff + mx];
          const hR = voxHeight[zOff + ((mx + 2) & MAP_MASK_X)];
          const hD = voxHeight[zNext + mx];
          const slope = (h - hR) * 1.8 + (h - hD) * 1.4;
          const shade = Math.max(0.70, Math.min(1.26, 1.0 + slope * 0.04));

          const fieldStripe = ((mx >> 5) + ((mz >> 5) & 1)) & 1;
          const isPath = ((mx & 63) === 0) || ((mz & 63) === 0);
          const base = fieldStripe ? theme.baseA : theme.baseB;
          const tHill = Math.min(1.0, h / 32.0);

          let r = base[0] * (1 - tHill) + theme.hillCol[0] * tHill;
          let g = base[1] * (1 - tHill) + theme.hillCol[1] * tHill;
          let b = base[2] * (1 - tHill) + theme.hillCol[2] * tHill;
          if (isPath) { r += 24; g += 18; b += 8; }

          voxColor[zOff + mx] = rgb565(clampByte(r * shade), clampByte(g * shade), clampByte(b * shade));
        }
      }
    }

    // Decodifica la ortofoto satelital limpia de 6 km x 4 km (chorobobo.jpg) en el mapa PSRAM 2048x1024
    function bakeChoroboboToPsram(img) {
      const cnv = document.createElement('canvas');
      cnv.width = MAP_W;
      cnv.height = MAP_H;
      const ctx = cnv.getContext('2d');
      // Invertir eje vertical de la imagen para que +mz (+wz) apunte exactamente al NORTE (Río Turbio arriba)
      ctx.save();
      ctx.translate(0, MAP_H);
      ctx.scale(1, -1);
      ctx.drawImage(img, 0, 0, MAP_W, MAP_H);
      ctx.restore();
      const rgba = ctx.getImageData(0, 0, MAP_W, MAP_H).data;

      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const wz = (mz - SPAWN_MZ) / MAP_SCALE_Z;
        const edgeZ = mz < 48 ? mz / 48.0 : (mz > MAP_H - 49 ? (MAP_H - 1 - mz) / 48.0 : 1.0);

        for (let mx = 0; mx < MAP_W; mx++) {
          const wx = (mx - SPAWN_MX) / MAP_SCALE_X;
          const pIdx = (zOff + mx) * 4;
          let r = rgba[pIdx], g = rgba[pIdx + 1], b = rgba[pIdx + 2];

          // Transición suave en los bordes exteriores (a 3 km de distancia) para evitar costuras
          const edgeX = mx < 48 ? mx / 48.0 : (mx > MAP_W - 49 ? (MAP_W - 1 - mx) / 48.0 : 1.0);
          const edgeW = Math.min(edgeX, edgeZ);
          if (edgeW < 1.0) {
            const oppIdx = ((((MAP_H - 1 - mz) << MAP_SHIFT_X) | (MAP_W - 1 - mx))) * 4;
            r = r * edgeW + rgba[oppIdx]     * (1 - edgeW);
            g = g * edgeW + rgba[oppIdx + 1] * (1 - edgeW);
            b = b * edgeW + rgba[oppIdx + 2] * (1 - edgeW);
          }

          // Extraer relieve Voxel 3D a escala real (unidades de HEIGHT_SCALE = 0.125 m):
          const luma = (r * 77 + g * 150 + b * 29) >> 8;
          const greenExcess = g - Math.max(r, b);
          let h = 2;

          if (greenExcess > 6 && luma < 96) {
            // Dosel de árboles densos (bosque junto a la pista y riberas del Río Turbio)
            h = 24 + Math.min(48, (greenExcess * 2) + ((96 - luma) >> 1));
          } else if (luma < 44 && b >= r - 6) {
            // Cauce del Río Turbio y lagunas de riego
            h = 0;
          } else {
            // Parcelas agrícolas planas en el valle central y colinas suaves en los extremos NW / SW
            h = 2 + ((luma >> 6) & 3);
            if (wx < -900 && (wz > 450 || wz < -550)) {
              const hillDist = Math.min(1.0, (-900 - wx) / 1400.0);
              h += Math.round(hillDist * hillDist * (95 + ((luma >> 2) & 31)));
            } else if (wz > 950) {
              const northHill = Math.min(1.0, (wz - 950) / 900.0);
              h += Math.round(northHill * northHill * (70 + ((luma >> 2) & 25)));
            }
          }

          const distSpawn = Math.hypot(wx, wz);
          if (distSpawn < 65) {
            h = Math.round(2 + (h - 2) * Math.max(0, (distSpawn - 38) / 27));
          }

          voxHeight[zOff + mx] = Math.max(0, Math.min(240, h));
          voxColor[zOff + mx]  = rgb565(clampByte(r), clampByte(g), clampByte(b));
        }
      }
    }

    function initChoroboboSatelliteMap() {
      if (typeof Image === 'undefined') return;
      const img = new Image();
      img.onload = () => {
        try {
          choroDecodedImg = img;
          choroSatelliteReady = true;
          if (TERRAIN_THEMES[currentThemeIdx].id === 'chorobobo') {
            bakeChoroboboToPsram(img);
          }
        } catch (err) {
          console.warn('No se pudo decodificar chorobobo.jpg:', err);
        }
      };
      img.src = 'chorobobo.jpg?v=19';
    }

    generateGentleVoxelMap(0);
    initChoroboboSatelliteMap();

    function getTerrainHeightMeters(wx, wz) {
      const mx = Math.floor(SPAWN_MX + wx * MAP_SCALE_X) & MAP_MASK_X;
      const mz = Math.floor(SPAWN_MZ + wz * MAP_SCALE_Z) & MAP_MASK_Z;
      return voxHeight[(mz << MAP_SHIFT_X) | mx] * HEIGHT_SCALE;
    }

    function blend565Half(c1, c2) {
      return (((c1 & 0xF7DE) >> 1) + ((c2 & 0xF7DE) >> 1));
    }

    // Focal unificada para que Voxel Terrain, Voxel Sky, Gates y Horizonte Artificial coincidan al 100%
    const FOCAL_128  = 68.0;
    const FOCAL_240  = FOCAL_128 * SCALE_Y; // 255.0
    const BLIT_SCALE = 0.62;
    const FOCAL_VOX  = FOCAL_240 * BLIT_SCALE; // 158.1
    let lastRollAngle = 0;
    let cloudDriftX = 0;

    // =========================================================================
    // TABLAS LUT EN PUNTO FIJO INT32 PARA ESP32-S3 (CERO DIVISIONES EN BUCLE)
    // En ESP32-S3 viven en SRAM Interna (< 2.5 KB):
    // - RAY_S_Q8[k]: distancia horizontal s * 256 (optimizado para vuelo a 8-20m AGL)
    // - RAY_INV_S_Q14[k]: (1 / s) * 16384 precalculado (cambia '/' por '*' + '>> 16')
    // - CLOUD_DIST_Q8[dy]: distancia al plano de nubes * 256 para dyHoriz (0..511)
    // - MICRO_TEX_LUT[256]: micro-textura sub-texel extendida hasta ~240m de alcance
    // =========================================================================
    const NUM_RAY_STEPS = 128;
    const RAY_S_Q8      = new Int32Array(NUM_RAY_STEPS);
    const RAY_INV_S_Q14 = new Int32Array(NUM_RAY_STEPS);
    const CLOUD_DIST_Q8 = new Int32Array(512);
    const MICRO_TEX_LUT = new Uint8Array(256);

    (function initS3FixedPointLuts() {
      // Distribución de pasos optimizada para volar entre 8m y 20m de altura:
      // Los primeros 96 pasos (k = 0..95) cubren con alta densidad desde 0.8m hasta 240m frente a la aeronave
      let s = 0.8, ds = 0.25;
      for (let k = 0; k < NUM_RAY_STEPS; k++) {
        RAY_S_Q8[k]      = Math.round(s * 256);
        RAY_INV_S_Q14[k] = Math.round((1.0 / s) * 16384);
        if (k < 96) {
          s  += ds;
          ds += 0.046; // En k=95 alcanza ~240m con excelente resolución para 8-20m de altura
        } else {
          // Pasos 96..127 cubren desde 240m hasta ~1,650m hacia el horizonte del valle
          s *= 1.062;
        }
      }
      for (let dy = 0; dy < 512; dy++) {
        CLOUD_DIST_Q8[dy] = Math.round((2400.0 / (dy + 10)) * 256);
      }
      for (let i = 0; i < 256; i++) {
        const h = (i * 73 + (i >> 4) * 37) ^ (i * 29);
        MICRO_TEX_LUT[i] = h & 3; // 0,1 = neutro, 2 = grano oscuro (-1 LSB), 3 = grano claro (+1 LSB)
      }
    })();

    // Renderizador Voxel 100% Punto Fijo Int32 en bucle interno (1 a 1 con C/ESP-IDF en ESP32-S3)
    function renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz, dt = 0.016) {
      cloudDriftX = (cloudDriftX + dt * 1.8) % 512;
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }

      const theme = TERRAIN_THEMES[currentThemeIdx];
      const fogCol = theme.fogCol;

      // 1. Extraer ángulo de Roll y base des-rotada exacta (R0, U0, F) (1 vez por frame)
      const upMag = Math.hypot(cRy, cUy);
      if (upMag > 0.04) {
        lastRollAngle = Math.atan2(cRy, cUy);
      }
      const phi = lastRollAngle;
      const cosR = Math.cos(phi), sinR = Math.sin(phi);

      let R0x = cosR * cRx - sinR * cUx;
      let R0z = cosR * cRz - sinR * cUz;
      const rLen = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rLen;
      R0z /= rLen;

      const H0x = -R0z;
      const H0z =  R0x;

      const U0x = sinR * cRx + cosR * cUx;
      const U0y = sinR * cRy + cosR * cUy;
      const U0z = sinR * cRz + cosR * cUz;

      const uH = U0x * H0x + U0z * H0z;
      const fH = cFx * H0x + cFz * H0z;

      const fHClamped = Math.abs(fH) < 0.20 ? (fH >= 0 ? 0.20 : -0.20) : fH;
      const horizonV = Math.max(-128, Math.min(384, Math.round(128 - (uH / fHClamped) * FOCAL_VOX)));

      // Factores en punto fijo precalculados 1 sola vez por frame para eliminar divisiones por paso
      const invFocalVox = 1.0 / FOCAL_VOX;
      const hProjScale  = (U0y * FOCAL_VOX) / fHClamped;
      const camY_Tex    = Math.round(camY / HEIGHT_SCALE);
      // Altura proyectada por unidad de voxHeight (en Q2 para multiplicar por RAY_INV_S_Q14 y hacer >> 16)
      const heightFactorQ2 = Math.round(HEIGHT_SCALE * hProjScale * 4);

      const startX_Q16    = Math.round((SPAWN_MX + camX * MAP_SCALE_X) * 65536);
      const startZ_Q16    = Math.round((SPAWN_MZ + camZ * MAP_SCALE_Z) * 65536);
      const skyStartX_Q16 = Math.round((camX * 0.45 + cloudDriftX) * 65536);
      const skyStartZ_Q16 = Math.round((camZ * 0.45) * 65536);

      // 2. Raycasting por columna u (0..255) usando SOLO enteros de 32 bits y LUTs
      for (let u = 0; u < VOX_W; u++) {
        const xi = (u - 128) * invFocalVox * Math.max(0.25, fH);
        const dirW_X = H0x + xi * R0x;
        const dirW_Z = H0z + xi * R0z;

        // Direcciones en Q8 (al multiplicar por RAY_S_Q8 o CLOUD_DIST_Q8 dan Q16; luego >> 16 da el texel)
        const dirX_Q8  = Math.round(dirW_X * MAP_SCALE_X * 256);
        const dirZ_Q8  = Math.round(dirW_Z * MAP_SCALE_Z * 256);
        const dirWX_Q8 = Math.round(dirW_X * 256);
        const dirWZ_Q8 = Math.round(dirW_Z * 256);

        let yMax = VOX_H;

        for (let k = 0; k < NUM_RAY_STEPS && yMax > 0; k++) {
          const sQ8  = RAY_S_Q8[k];
          const xQ16 = startX_Q16 + dirX_Q8 * sQ8;
          const zQ16 = startZ_Q16 + dirZ_Q8 * sQ8;
          const mx   = (xQ16 >> 16) & MAP_MASK_X;
          const mz   = (zQ16 >> 16) & MAP_MASK_Z;
          const mIdx = (mz << MAP_SHIFT_X) | mx;

          const dhTex = voxHeight[mIdx] - camY_Tex;
          // Proyección perspectiva sin divisiones: multiplicación entera + shift >> 16
          const v = horizonV - ((dhTex * heightFactorQ2 * RAY_INV_S_Q14[k]) >> 16);

          if (v < yMax) {
            const vTop = v < 0 ? 0 : v;
            let col = voxColor[mIdx];
            if (k < 96) {
              // Micro-pixelado sub-texel extendido hasta ~240m de distancia para que al volar a 8-20m
              // de altura todo el terreno cercano y medio tenga textura fina y sensación de velocidad
              const shiftSub = k < 48 ? 12 : 13;
              const subIdx = ((xQ16 >> shiftSub) & 15) | (((zQ16 >> shiftSub) & 15) << 4);
              const mVal = MICRO_TEX_LUT[subIdx];
              if (mVal === 2) {
                // Oscurecer ~6% por canal sin préstamo/underflow hacia el canal Rojo (0xF800)
                col = col - ((col >> 4) & 0x0861);
              } else if (mVal === 3) {
                // Aclarar ~6% por canal sin desbordamiento/overflow entre canales RGB565
                col = col + (((col ^ 0xFFFF) >> 4) & 0x0861);
              }
            } else if (k > 106) {
              col = blend565Half(col, fogCol);
              if (k > 118) col = blend565Half(col, fogCol);
            }
            let ptr = (vTop << 8) | u;
            for (let y = vTop; y < yMax; y++, ptr += VOX_W) {
              voxBuf[ptr] = col;
            }
            yMax = vTop;
          }
        }

        // 3. Cielo Azul + Nubes usando LUT entera CLOUD_DIST_Q8 (cero divisiones por píxel)
        if (yMax > 0) {
          let ptr = u;
          for (let y = 0; y < yMax; y++, ptr += VOX_W) {
            const dyHoriz = horizonV - y;
            if (dyHoriz <= 2) {
              voxBuf[ptr] = fogCol;
            } else {
              const lutIdx = dyHoriz < 511 ? dyHoriz : 511;
              const sCloudQ8 = CLOUD_DIST_Q8[lutIdx];
              const cmx = ((skyStartX_Q16 + dirWX_Q8 * sCloudQ8) >> 16) & SKY_MASK;
              const cmz = ((skyStartZ_Q16 + dirWZ_Q8 * sCloudQ8) >> 16) & SKY_MASK;
              let skyCol = voxSkyMap[(cmz << SKY_SHIFT) | cmx];
              if (dyHoriz < 36) {
                skyCol = blend565Half(skyCol, fogCol);
                if (dyHoriz < 16) skyCol = blend565Half(skyCol, fogCol);
              }
              voxBuf[ptr] = skyCol;
            }
          }
        }
      }

      // 4. Blit Rotado en Punto Fijo 16.16 hacia la pantalla completa 320x240
      const du_dx = ( cosR * BLIT_SCALE * 65536) | 0;
      const dv_dx = (-sinR * BLIT_SCALE * 65536) | 0;
      const du_dy = ( sinR * BLIT_SCALE * 65536) | 0;
      const dv_dy = ( cosR * BLIT_SCALE * 65536) | 0;

      const centerU = 128 * 65536;
      const centerV = 128 * 65536;

      let rowU = centerU - 160 * du_dx - 120 * du_dy;
      let rowV = centerV - 160 * dv_dx - 120 * dv_dy;

      let dstIdx = 0;
      for (let sy = 0; sy < DISP_H; sy++) {
        let uFP = rowU;
        let vFP = rowV;
        for (let sx = 0; sx < DISP_W; sx++) {
          const uu = (uFP >> 16) & 255;
          const vv = (vFP >> 16) & 255;
          vram565[dstIdx++] = voxBuf[(vv << 8) | uu];
          uFP += du_dx;
          vFP += dv_dx;
        }
        rowU += du_dy;
        rowV += dv_dy;
      }
    }

    // Proyector 3D exacto en coordenadas nativas 320x240 (alcance extendido a 950m para circuitos a escala 6x4 km)
    function createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz) {
      function projPoint320(wx, wy, wz) {
        const dx = wx - camX, dy = wy - camY, dz = wz - camZ;
        const cx = dx*cRx + dy*cRy + dz*cRz;
        const cy = dx*cUx + dy*cUy + dz*cUz;
        const cz = dx*cFx + dy*cFy + dz*cFz;
        if (cz < 0.25) return null;
        return {
          sx: 160 + (cx * FOCAL_240) / cz,
          sy: 120 - (cy * FOCAL_240) / cz,
          cz
        };
      }

      function projLine(x0, y0, z0, x1, y1, z1, dash = 0, col = 1) {
        const dx0 = x0 - camX, dy0 = y0 - camY, dz0 = z0 - camZ;
        const dx1 = x1 - camX, dy1 = y1 - camY, dz1 = z1 - camZ;
        let cx0 = dx0*cRx + dy0*cRy + dz0*cRz, cy0 = dx0*cUx + dy0*cUy + dz0*cUz, cz0 = dx0*cFx + dy0*cFy + dz0*cFz;
        let cx1 = dx1*cRx + dy1*cRy + dz1*cRz, cy1 = dx1*cUx + dy1*cUy + dz1*cUz, cz1 = dx1*cFx + dy1*cFy + dz1*cFz;
        if (cz0 < 0.2 && cz1 < 0.2) return;
        if (cz0 > 950 && cz1 > 950) return;
        if (cz0 < 0.2) { const t = (0.2 - cz0)/(cz1 - cz0); cx0 += t*(cx1 - cx0); cy0 += t*(cy1 - cy0); cz0 = 0.2; }
        else if (cz1 < 0.2) { const t = (0.2 - cz1)/(cz0 - cz1); cx1 += t*(cx0 - cx1); cy1 += t*(cy0 - cy1); cz1 = 0.2; }

        const sx0 = 160 + (cx0 * FOCAL_240) / cz0;
        const sy0 = 120 - (cy0 * FOCAL_240) / cz0;
        const sx1 = 160 + (cx1 * FOCAL_240) / cz1;
        const sy1 = 120 - (cy1 * FOCAL_240) / cz1;
        fbDrawLine(sx0 / SCALE_X, sy0 / SCALE_Y, sx1 / SCALE_X, sy1 / SCALE_Y, dash, col);
      }

      return { projPoint320, projLine };
    }

    // Renderiza únicamente el circuito activo seleccionado (Rojo, Morado o Naranja) o ninguno en modo Vuelo Libre (SIN GATES)
    function renderCircuitGates(projLine, activeGate) {
      if (isFreeFlightNoGates()) return;

      const circuit = CHOROBOBO_CIRCUITS[currentCircuitIdx];
      const gates = circuit.gates;
      const baseCol = circuit.palIdx; // 4 = Rojo, 10 = Morado, 9 = Naranja

      for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        const isAct = (i === activeGate);
        const isNext = (i === (activeGate + 1) % gates.length);
        const col = isAct ? 3 : (isNext ? 2 : baseCol);

        const hw = g.w * 0.5, hh = g.h * 0.5;
        const gFloor = getTerrainHeightMeters(g.x, g.z);
        const gCenterY = gFloor + g.y;
        const yBot = gFloor + Math.max(2.0, g.y - hh);
        const yTop = gCenterY + hh;

        const lx = g.x - g.nx * hw, lz = g.z - g.nz * hw;
        const rx = g.x + g.nx * hw, rz = g.z + g.nz * hw;

        // Postes laterales desde el suelo hasta el tope + travesaño superior e inferior orientados 3D
        projLine(lx, gFloor, lz, lx, yTop, lz, 0, col);
        projLine(rx, gFloor, rz, rx, yTop, rz, 0, col);
        projLine(lx, yTop,   lz, rx, yTop, rz, 0, isAct ? 2 : col);
        projLine(lx, yBot,   lz, rx, yBot, rz, 0, col);

        if (isAct) {
          // Chevron luminoso sobre la puerta activa actual (Gate 1..15)
          projLine(g.x, yTop + 2.0, g.z, g.x - g.nx * 3.5, yTop + 5.0, g.z - g.nz * 3.5, 0, 2);
          projLine(g.x, yTop + 2.0, g.z, g.x + g.nx * 3.5, yTop + 5.0, g.z + g.nz * 3.5, 0, 2);
        }
      }
    }

    /***************************************************************************
     * PRIMITIVAS NATIVAS 320x240 PARA EL OSD ESTILO INAV (BLANCO CON BORDE NEGRO)
     ***************************************************************************/
    function setPx320(x, y, col565) {
      const ix = x | 0, iy = y | 0;
      if (ix >= 0 && ix < DISP_W && iy >= 0 && iy < DISP_H) {
        vram565[iy * DISP_W + ix] = col565;
      }
    }

    // Dibuja un bloque de 2x2 con contorno negro de 1px alrededor
    function drawOutlinedDot320(x, y, fg565 = 0xFFFF) {
      const ix = x | 0, iy = y | 0;
      for (let dy = -1; dy <= 2; dy++) {
        const py = iy + dy;
        if (py < 0 || py >= DISP_H) continue;
        const row = py * DISP_W;
        for (let dx = -1; dx <= 2; dx++) {
          const px = ix + dx;
          if (px < 0 || px >= DISP_W) continue;
          if (dx >= 0 && dx <= 1 && dy >= 0 && dy <= 1) {
            vram565[row + px] = fg565;
          } else if (vram565[row + px] !== fg565) {
            vram565[row + px] = 0x0000;
          }
        }
      }
    }

    // Dibuja un círculo pequeño estilo INAV (como las bolitas del horizonte artificial y escalas verticales)
    function drawInavCircleDot320(cx, cy, r = 2, fg565 = 0xFFFF) {
      const ix = Math.round(cx), iy = Math.round(cy);
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        for (let dx = -r - 1; dx <= r + 1; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 <= r * r) {
            setPx320(ix + dx, iy + dy, fg565);
          } else if (d2 <= (r + 1) * (r + 1) + 1) {
            setPx320(ix + dx, iy + dy, 0x0000);
          }
        }
      }
    }

    // Línea nativa en 320x240 con borde negro de 1px
    function drawOutlinedLine320(x0, y0, x1, y1, fg565 = 0xFFFF) {
      const steps = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0)));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx !== 0 || dy !== 0) setPx320(x + dx, y + dy, 0x0000);
          }
        }
      }
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        setPx320(x, y, fg565);
      }
    }

    // =========================================================================
    // ROM DE CARACTERES OSD ESTILO CHIP MAX7456 (SPRITES 8x12 PRE-BORDEADOS)
    // En ESP32-S3 se guarda en Flash/SRAM (~6 KB) y se dibuja en 1 sola pasada
    // lineal sin bucles vecinos por frame: 0 = transparente, 1 = negro, 2 = blanco
    // =========================================================================
    const TICK_GLYPH = [2, 2, 0, 0, 0];
    const OSD_GLYPH_W = 8;
    const OSD_GLYPH_H = 12;
    const OSD_CHAR_ROM = new Uint8Array(128 * OSD_GLYPH_W * OSD_GLYPH_H);

    (function buildMax7456CharacterRom() {
      for (let code = 32; code < 128; code++) {
        const ch = String.fromCharCode(code);
        const g = ch === '\'' ? TICK_GLYPH : FONT_3X5[ch];
        if (!g) continue;
        const baseOff = code * (OSD_GLYPH_W * OSD_GLYPH_H);

        // Pasada 1 (solo al iniciar): marcar borde negro (1) y relleno blanco (2)
        for (let r = 0; r < 5; r++) {
          const rowBits = g[r];
          for (let c = 0; c < 3; c++) {
            if ((rowBits >> (2 - c)) & 1) {
              const px = 1 + c * 2;
              const py = 1 + r * 2;
              for (let oy = -1; oy <= 2; oy++) {
                for (let ox = -1; ox <= 2; ox++) {
                  const gx = px + ox, gy = py + oy;
                  if (gx >= 0 && gx < OSD_GLYPH_W && gy >= 0 && gy < OSD_GLYPH_H) {
                    const idx = baseOff + gy * OSD_GLYPH_W + gx;
                    if (ox >= 0 && ox <= 1 && oy >= 0 && oy <= 1) {
                      OSD_CHAR_ROM[idx] = 2; // Relleno blanco
                    } else if (OSD_CHAR_ROM[idx] === 0) {
                      OSD_CHAR_ROM[idx] = 1; // Borde negro 1px
                    }
                  }
                }
              }
            }
          }
        }
      }
    })();

    // Dibuja texto OSD en 1 sola pasada lineal desde la ROM pre-bordeada (1 a 1 con C en ESP32-S3)
    function drawInavText320(str, x320, y240, fg565 = 0xFFFF) {
      const s = String(str).toUpperCase();
      let cx = (x320 | 0) - 1;
      const cy = (y240 | 0) - 1;

      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i) & 127;
        const baseOff = code * (OSD_GLYPH_W * OSD_GLYPH_H);
        for (let gy = 0; gy < OSD_GLYPH_H; gy++) {
          const py = cy + gy;
          if (py < 0 || py >= DISP_H) continue;
          const dstRow = py * DISP_W;
          const srcRow = baseOff + gy * OSD_GLYPH_W;
          for (let gx = 0; gx < OSD_GLYPH_W; gx++) {
            const v = OSD_CHAR_ROM[srcRow + gx];
            if (v !== 0) {
              const px = cx + gx;
              if (px >= 0 && px < DISP_W) {
                vram565[dstRow + px] = v === 1 ? 0x0000 : fg565;
              }
            }
          }
        }
        cx += 8;
      }
    }

    // Icono de batería INAV en 320x240
    function drawBatteryIcon320(x, y) {
      drawOutlinedLine320(x, y + 2, x + 7, y + 2);
      drawOutlinedLine320(x, y + 11, x + 7, y + 11);
      drawOutlinedLine320(x, y + 2, x, y + 11);
      drawOutlinedLine320(x + 7, y + 2, x + 7, y + 11);
      drawOutlinedLine320(x + 2, y, x + 5, y);
      for (let py = y + 4; py <= y + 9; py++) {
        for (let px = x + 2; px <= x + 5; px++) setPx320(px, py, 0xFFFF);
      }
    }

    // Icono de Casa (Home / Gate) INAV en 320x240
    function drawHomeIcon320(x, y) {
      drawOutlinedLine320(x + 4, y, x, y + 4);
      drawOutlinedLine320(x + 4, y, x + 8, y + 4);
      drawOutlinedLine320(x + 1, y + 4, x + 1, y + 9);
      drawOutlinedLine320(x + 7, y + 4, x + 7, y + 9);
      drawOutlinedLine320(x + 1, y + 9, x + 7, y + 9);
    }

    // Renderizador completo del OSD estilo INAV (basado en la imagen de referencia del usuario)
    function renderInavOsd320({
      callsign, modeLabel, spdMs, thrPct, altM, vario,
      activeGate, gateDist, gateBearingRad, totalDistKm,
      flightTimeSec, camX, camY, camZ,
      cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz, projPoint320
    }) {
      const WHITE = 0xFFFF;
      const GREEN_DOT = rgb565(120, 245, 120);

      // 1. HORIZONTE ARTIFICIAL INAV (9 círculos proyectados en 3D usando la misma base R0, H0 del Voxel)
      // Coincide con el horizonte Voxel a 14 decimales en cualquier combinación de Pitch, Roll y Yaw.
      const phi = Math.atan2(cRy, cUy);
      const cosR = Math.cos(phi), sinR = Math.sin(phi);
      let R0x = cosR * cRx - sinR * cUx;
      let R0z = cosR * cRz - sinR * cUz;
      const rLen = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rLen;
      R0z /= rLen;
      const H0x = -R0z, H0z = R0x;

      for (let i = -4; i <= 4; i++) {
        const span = i * 4.2;
        const wx = camX + H0x * 42.0 + R0x * span;
        const wz = camZ + H0z * 42.0 + R0z * span;
        const pt = projPoint320(wx, camY, wz);
        if (pt && pt.sx >= 48 && pt.sx <= 272 && pt.sy >= 24 && pt.sy <= 218) {
          drawInavCircleDot320(pt.sx, pt.sy, 2, i === 0 ? GREEN_DOT : WHITE);
        }
      }

      // 2. RETÍCULA CENTRAL FIJA INAV (───┐_┌───) en (160, 120)
      drawOutlinedLine320(134, 120, 151, 120, WHITE);
      drawOutlinedLine320(151, 120, 151, 125, WHITE);
      drawOutlinedLine320(151, 125, 169, 125, WHITE);
      drawOutlinedLine320(169, 125, 169, 120, WHITE);
      drawOutlinedLine320(169, 120, 186, 120, WHITE);

      // Flecha de dirección hacia el próximo Gate justo encima de la retícula central (160, 102)
      const ax = 160, ay = 101;
      const sB = Math.sin(gateBearingRad), cB = Math.cos(gateBearingRad);
      const tipX = ax + sB * 7, tipY = ay - cB * 7;
      const lWingX = ax - sB * 5 - cB * 5, lWingY = ay + cB * 5 - sB * 5;
      const rWingX = ax - sB * 5 + cB * 5, rWingY = ay + cB * 5 + sB * 5;
      drawOutlinedLine320(tipX, tipY, lWingX, lWingY, WHITE);
      drawOutlinedLine320(tipX, tipY, rWingX, rWingY, WHITE);
      drawOutlinedLine320(lWingX, lWingY, rWingX, rWingY, WHITE);

      // 3. ESCALAS VERTICALES LATERALES DE PUNTOS (Izquierda x=78 y Derecha x=242) + cursores '>' y '<'
      for (let i = -6; i <= 6; i++) {
        const py = 120 + i * 9;
        const rad = (i & 1) === 0 ? 2 : 1;
        drawInavCircleDot320(78,  py, rad, WHITE);
        drawInavCircleDot320(242, py, rad, WHITE);
      }
      // Indicador '>' a la izquierda (x=83, y=120)
      drawOutlinedLine320(82, 116, 87, 120, WHITE);
      drawOutlinedLine320(87, 120, 82, 124, WHITE);
      // Indicador '<' a la derecha (x=237, y=120)
      drawOutlinedLine320(238, 116, 233, 120, WHITE);
      drawOutlinedLine320(233, 120, 238, 124, WHITE);

      // 4. BRÚJULA SUPERIOR CENTRAL (W ' | ' N ' | ' E) + NOMBRE DEL MODELO
      const headingDeg = ((Math.atan2(H0x, H0z) * RAD2DEG) % 360 + 360) % 360;
      const cardinals = ['N', 'I', 'E', 'I', 'S', 'I', 'W', 'I'];
      const stepDeg = 45;
      const baseIdx = Math.floor(headingDeg / stepDeg);
      let compassStr = '';
      for (let k = -2; k <= 2; k++) {
        const idx = (baseIdx + k + 8) % 8;
        compassStr += cardinals[idx] + (k < 2 ? '\'' : '');
      }
      drawInavText320(compassStr, 124, 10, WHITE);
      drawInavText320(callsign,   112, 24, WHITE);

      // 5. ESQUINA SUPERIOR DERECHA (Satélites + HDOP) Y ESQUINA SUPERIOR IZQUIERDA (Viento INAV)
      drawInavText320('SAT 12',   262, 22, WHITE);
      drawInavText320('HDOP 1.2', 246, 36, WHITE);

      // Indicador de Viento INAV (Flecha de dirección relativa + velocidad en KMH)
      const windSpdKmh = Math.round(Math.hypot(aeroEnv.windX, aeroEnv.windZ) * 3.6);
      const windRelAng = Math.atan2(
        aeroEnv.windX * R0x + aeroEnv.windZ * R0z,
        aeroEnv.windX * H0x + aeroEnv.windZ * H0z
      );
      const wx0 = 20, wy0 = 27;
      const sW = Math.sin(windRelAng), cW = Math.cos(windRelAng);
      drawOutlinedLine320(wx0 - sW * 6, wy0 + cW * 6, wx0 + sW * 6, wy0 - cW * 6, WHITE);
      drawOutlinedLine320(wx0 + sW * 6, wy0 - cW * 6, wx0 + sW * 1 - cW * 4, wy0 - cW * 1 - sW * 4, WHITE);
      drawOutlinedLine320(wx0 + sW * 6, wy0 - cW * 6, wx0 + sW * 1 + cW * 4, wy0 - cW * 1 + sW * 4, WHITE);
      drawInavText320(`W${String(windSpdKmh).padStart(2, ' ')}K`, 30, 22, WHITE);
      if (aeroEnv.stallWarn) {
        drawInavText320('!STALL!', 132, 74, WHITE);
      }

      // 6. COLUMNA IZQUIERDA (Velocidad Tierra + Aire km/h, Throttle %, Amperios, mAh, Voltaje con Sag real)
      const kmh = Math.round(spdMs * 3.6);
      const airKmh = Math.round((aeroEnv.airSpd || spdMs) * 3.6);
      drawInavText320(`AR${String(airKmh).padStart(2, ' ')}`, 14, 98, WHITE);
      drawInavText320(`${String(kmh).padStart(2, ' ')}KMH`,  22, 115, WHITE);
      drawInavText320(`THR ${Math.round(thrPct)}%`,          14, 134, WHITE);

      const loadFactor = (thrPct / 100);
      const amps = (1.8 + loadFactor * loadFactor * 22.5).toFixed(1);
      const mah  = Math.round(120 + flightTimeSec * 4.8);
      const sagV = loadFactor * loadFactor * 0.85;
      const packV = Math.max(13.6, 16.8 - flightTimeSec * 0.004 - sagV);
      const cellV = (packV / 4).toFixed(2);

      drawInavText320(`A ${amps}`,     14, 156, WHITE);
      drawInavText320(`MAH ${mah}`,    14, 174, WHITE);
      drawBatteryIcon320(10, 191);
      drawInavText320(`${packV.toFixed(2)}V`, 22, 192, WHITE);
      drawBatteryIcon320(10, 209);
      drawInavText320(`${cellV}V`,     22, 210, WHITE);

      // 7. COLUMNA DERECHA (Altitud Alt m, Variómetro m/s, Rumbo a Gate, Tiempo de Vuelo, Distancia)
      drawInavText320(`ALT ${Math.round(altM)}M`, 252, 104, WHITE);
      drawInavText320(`${vario.toFixed(1)}M/S`,   252, 120, WHITE);

      const brgDeg = Math.round(gateBearingRad * RAD2DEG);
      drawHomeIcon320(238, 155);
      if (isFreeFlightNoGates()) {
        drawInavText320('FREE FLY', 250, 140, GREEN_DOT);
      } else {
        const cShort = CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode;
        drawInavText320(`${cShort} ${activeGate + 1}/15`, 250, 140, WHITE);
      }
      drawInavText320(`BRG ${brgDeg >= 0 ? '+' : ''}${brgDeg}`, 250, 156, WHITE);

      const mins = String(Math.floor(flightTimeSec / 60)).padStart(2, '0');
      const secs = String(Math.floor(flightTimeSec % 60)).padStart(2, '0');
      drawInavText320(`FLY ${mins}:${secs}`,      246, 174, WHITE);
      drawInavText320(`TD ${totalDistKm.toFixed(2)}`, 246, 192, WHITE);
      drawHomeIcon320(246, 209);
      drawInavText320(`DST ${Math.min(999, Math.round(gateDist))}M`, 258, 210, WHITE);

      // 8. CENTRO INFERIOR (Modo de Vuelo + Telemetría 4 Motores Quad-X o Elevones/AoA en Ala)
      drawInavText320(modeLabel, 128, 214, WHITE);

      if (activeRomId === 'fpv_drone' && fpvDroneSim.mRpm) {
        // 4 Barras de RPM reales (M1..M4) del mezclador Betaflight Quad-X + AirMode
        const bx = 92, by = 212;
        for (let m = 0; m < 4; m++) {
          const mx = bx + m * 7;

          for (let py = by; py <= by + 12; py++) {
            setPx320(mx, py, 0x0000);
            setPx320(mx + 4, py, 0x0000);
          }
          for (let py = by + 12 - h; py <= by + 12; py++) {
            const mCol = fpvDroneSim.mRpm[m] > 0.88 ? C565.ORANGE : GREEN_DOT;
            setPx320(mx + 1, py, mCol);
            setPx320(mx + 2, py, mCol);
            setPx320(mx + 3, py, mCol);
          }

      } else if (activeRomId === 'fpv_wing') {
        const aoaDeg = Math.round((fpvWingSim.lastAlpha || 0) * RAD2DEG);
        drawInavText320(`AOA ${aoaDeg >= 0 ? '+' : ''}${aoaDeg}`, 72, 214, aeroEnv.stallWarn ? C565.RED : WHITE);
