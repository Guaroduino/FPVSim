    const NUM_WORLD_TREES = 180;
    const WORLD_TREES     = [];
    const WORLD_BUILDINGS = [];
    var worldObjectsInitialized = true;
    // Buffers estáticos en SRAM para ordenar objetos de atrás hacia adelante sin 'new' por frame
    const MAX_VIS_OBJS  = 72;
    const VIS_OBJ_TYPE  = new Uint8Array(MAX_VIS_OBJS); // 0 = árbol, 1 = edificio
    const VIS_OBJ_IDX   = new Uint16Array(MAX_VIS_OBJS);
    const VIS_OBJ_CZ    = new Float32Array(MAX_VIS_OBJS);
    const VIS_SORT_ORD  = new Uint8Array(MAX_VIS_OBJS);

    function rebuildWorldObjectsForScale() {
      WORLD_BUILDINGS.length = 0;
      const bScale = WORLD_W_M <= 2000.0 ? 0.78 : 1.15;
      for (let i = 0; i < BUILDING_UV_DEFS.length; i++) {
        const b = BUILDING_UV_DEFS[i];
        const pos = uvToWorld(b.u, b.v);
        WORLD_BUILDINGS.push({
          x: pos.x,
          z: pos.z,
          w: b.w * bScale,
          d: b.d * bScale,
          h: Math.min(7.2, b.h),
          roofH: Math.min(2.2, b.roofH),
          cosY: Math.cos(b.yaw),
          sinY: Math.sin(b.yaw),
          wallL: b.wallL,
          wallD: b.wallD,
          roofCol: b.roofCol
        });
      }

      WORLD_TREES.length = 0;
      let seed = 0x13579BDF;
      const c0 = CHOROBOBO_CIRCUITS[0].gates;
      for (let i = 0; i < NUM_WORLD_TREES; i++) {
        seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
        const r1 = ((seed >>> 0) & 0xFFFF) / 65536.0;
        seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
        const r2 = ((seed >>> 0) & 0xFFFF) / 65536.0;
        seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
        const r3 = ((seed >>> 0) & 0xFFFF) / 65536.0;

        // Distribuir árboles en linderos de parcelas y riberas (u: 0.14..0.82, v: 0.12..0.78)
        const u = 0.14 + r1 * 0.68;
        const v = 0.12 + r2 * 0.66;
        const pos = uvToWorld(u, v);

        // Evitar colocar árboles justo en medio de las puertas del circuito principal
        let tooClose = false;
        for (let g = 0; g < c0.length; g++) {
          if (Math.hypot(pos.x - c0[g].x, pos.z - c0[g].z) < 16.0) {
            tooClose = true;
            break;
          }
        }
        if (tooClose) {
          pos.x += 22.0;
          pos.z += 18.0;
        }

        const spriteType = (i & 1);
        const heightM = 5.0 + r3 * 2.8; // Entre 5.0 m y 7.8 m (siempre <= 8.0 m máximo)
        const widthM  = spriteType === 0 ? heightM * 1.05 : heightM * 0.90;
        WORLD_TREES.push({
          x: pos.x,
          z: pos.z,
          h: heightM,
          w: widthM,
          type: spriteType
        });
      }
    }
    rebuildWorldObjectsForScale();

    // Dibuja un sprite de árbol 24x28 anclado 100% perpendicular al terreno 3D (entre ptTop y ptBase) en punto fijo 16.16
    function drawTreeBillboard320(ptBase, ptTop, wPx, type) {
      const vx = ptBase.sx - ptTop.sx;
      const vy = ptBase.sy - ptTop.sy;
      const hPx = Math.hypot(vx, vy);
      if (hPx < 3.0 || wPx < 2.5) return;

      // Vector unitario en pantalla desde la copa (tv=0) hacia la base en el suelo (tv=TREE_SP_H)
      const downX = vx / hPx;
      const downY = vy / hPx;
      // Vector unitario perpendicular hacia la derecha del árbol en el terreno (tu=0 -> tu=TREE_SP_W)
      const rightX =  downY;
      const rightY = -downX;

      const cx = (ptBase.sx + ptTop.sx) * 0.5;
      const cy = (ptBase.sy + ptTop.sy) * 0.5;

      const rad = Math.ceil(Math.max(wPx, hPx) * 0.68);
      const x0 = Math.max(0, Math.floor(cx - rad));
      const x1 = Math.min(DISP_W - 1, Math.ceil(cx + rad));
      const y0 = Math.max(0, Math.floor(cy - rad));
      const y1 = Math.min(DISP_H - 1, Math.ceil(cy + rad));
      if (x0 > x1 || y0 > y1) return;

      const scaleU = TREE_SP_W / Math.max(2.0, wPx);
      const scaleV = TREE_SP_H / Math.max(2.0, hPx);

      const du_dx = Math.round(rightX * scaleU * 65536);
      const dv_dx = Math.round(downX  * scaleV * 65536);
      const du_dy = Math.round(rightY * scaleU * 65536);
      const dv_dy = Math.round(downY  * scaleV * 65536);

      const centerU_Q16 = (TREE_SP_W >> 1) << 16;
      const centerV_Q16 = (TREE_SP_H >> 1) << 16;
      const dx0 = x0 - cx, dy0 = y0 - cy;
      let rowU = centerU_Q16 + Math.round(dx0 * du_dx + dy0 * du_dy);
      let rowV = centerV_Q16 + Math.round(dx0 * dv_dx + dy0 * dv_dy);

      const romOff = type * (TREE_SP_W * TREE_SP_H);
      for (let sy = y0; sy <= y1; sy++) {
        let uFP = rowU;
        let vFP = rowV;
        const dstRow = sy * DISP_W;
        for (let sx = x0; sx <= x1; sx++) {
          const tu = uFP >> 16;
          const tv = vFP >> 16;
          if ((tu >>> 0) < TREE_SP_W && (tv >>> 0) < TREE_SP_H) {
            const col = TREE_SPRITE_ROM[romOff + tv * TREE_SP_W + tu];
            if (col !== 0) {
              vram565[dstRow + sx] = col;
            }
          }
          uFP += du_dx;
          vFP += dv_dx;
        }
        rowU += du_dy;
        rowV += dv_dy;
      }
    }

    function renderBuildingLowPoly320(b, camX, camZ, projPoint320) {
      const y0 = getTerrainHeightMeters(b.x, b.z);
      const y1 = y0 + b.h;
      const y2 = y1 + b.roofH;
      const hw = b.w * 0.5, hd = b.d * 0.5;
      const rx = b.cosY, rz = b.sinY;
      const fx = -b.sinY, fz = b.cosY;

      // 4 esquinas inferiores, 4 superiores de pared y 2 cumbreras del techo a dos aguas
      const b00 = projPoint320(b.x - rx*hw - fx*hd, y0, b.z - rz*hw - fz*hd);
      const b10 = projPoint320(b.x + rx*hw - fx*hd, y0, b.z + rz*hw - fz*hd);
      const b11 = projPoint320(b.x + rx*hw + fx*hd, y0, b.z + rz*hw + fz*hd);
      const b01 = projPoint320(b.x - rx*hw + fx*hd, y0, b.z - rz*hw + fz*hd);

      const t00 = projPoint320(b.x - rx*hw - fx*hd, y1, b.z - rz*hw - fz*hd);
      const t10 = projPoint320(b.x + rx*hw - fx*hd, y1, b.z + rz*hw - fz*hd);
      const t11 = projPoint320(b.x + rx*hw + fx*hd, y1, b.z + rz*hw + fz*hd);
      const t01 = projPoint320(b.x - rx*hw + fx*hd, y1, b.z - rz*hw + fz*hd);

      const r0  = projPoint320(b.x - rx*hw, y2, b.z - rz*hw);
      const r1  = projPoint320(b.x + rx*hw, y2, b.z + rz*hw);

      if (!b00 || !b10 || !b11 || !b01 || !t00 || !t10 || !t11 || !t01 || !r0 || !r1) return;

      // Dibujar primero las paredes traseras y luego las visibles hacia la cámara (Painter's simple por signo del producto punto)
      const vx = camX - b.x, vz = camZ - b.z;
      const dotF = vx * fx + vz * fz;
      const dotR = vx * rx + vz * rz;

      if (dotF >= 0) {
        fillQuad320(b00, b10, t10, t00, b.wallD);
        fillQuad320(b01, b11, t11, t01, b.wallL);
      } else {
        fillQuad320(b01, b11, t11, t01, b.wallL);
        fillQuad320(b00, b10, t10, t00, b.wallD);
      }

      if (dotR >= 0) {
        fillQuad320(b00, b01, t01, t00, b.wallD);
        fillTri320(t00.sx, t00.sy, t01.sx, t01.sy, r0.sx, r0.sy, b.wallD);
        fillQuad320(b10, b11, t11, t10, b.wallL);
        fillTri320(t10.sx, t10.sy, t11.sx, t11.sy, r1.sx, r1.sy, b.wallL);
      } else {
        fillQuad320(b10, b11, t11, t10, b.wallL);
        fillTri320(t10.sx, t10.sy, t11.sx, t11.sy, r1.sx, r1.sy, b.wallL);
        fillQuad320(b00, b01, t01, t00, b.wallD);
        fillTri320(t00.sx, t00.sy, t01.sx, t01.sy, r0.sx, r0.sy, b.wallD);
      }

      // Dos aguas del techo (una iluminada y otra con ligero sombreado)
      const roofDark = b.roofCol - ((b.roofCol >> 3) & 0x18E3);
      if (dotF >= 0) {
        fillQuad320(t00, t10, r1, r0, roofDark);
        fillQuad320(t01, t11, r1, r0, b.roofCol);
      } else {
        fillQuad320(t01, t11, r1, r0, b.roofCol);
        fillQuad320(t00, t10, r1, r0, roofDark);
      }
    }

    // Renderiza todos los Árboles Sprite y Edificios Low-Poly visibles ordenados de atrás hacia adelante
    function renderComancheWorldObjects(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz, projPoint320) {
      let count = 0;
      const maxDistTree = 340.0;
      const maxDistBldg = 520.0;

      // 1. Recolectar edificios dentro del frustum
      for (let i = 0; i < WORLD_BUILDINGS.length && count < MAX_VIS_OBJS; i++) {
        const b = WORLD_BUILDINGS[i];
        const dx = b.x - camX, dz = b.z - camZ;
        const cz = dx * cFx + dz * cFz;
        if (cz < 3.0 || cz > maxDistBldg) continue;
        const cx = dx * cRx + dz * cRz;
        if (Math.abs(cx) > cz * 1.15 + 18.0) continue;
        VIS_OBJ_TYPE[count] = 1;
        VIS_OBJ_IDX[count]  = i;
        VIS_OBJ_CZ[count]   = cz;
        VIS_SORT_ORD[count] = count;
        count++;
      }

      // 2. Recolectar árboles cercanos dentro del frustum según la densidad configurada en el menú [WORLD]
      const treeDensity = (typeof fcProfile !== 'undefined' && fcProfile.treeDensity !== undefined) ? fcProfile.treeDensity : 1.0;
      const activeTreeLimit = Math.round(WORLD_TREES.length * treeDensity);
      for (let i = 0; i < activeTreeLimit && count < MAX_VIS_OBJS; i++) {
        const tr = WORLD_TREES[i];
        const dx = tr.x - camX, dz = tr.z - camZ;
        const cz = dx * cFx + dz * cFz;
        if (cz < 2.2 || cz > maxDistTree) continue;
        const cx = dx * cRx + dz * cRz;
        if (Math.abs(cx) > cz * 0.95 + 8.0) continue;
        VIS_OBJ_TYPE[count] = 0;
        VIS_OBJ_IDX[count]  = i;
        VIS_OBJ_CZ[count]   = cz;
        VIS_SORT_ORD[count] = count;
        count++;
      }

      // Ordenamiento por inserción en buffer estático (de mayor cz a menor cz = Painter's Algorithm)
      for (let i = 1; i < count; i++) {
        const keyOrd = VIS_SORT_ORD[i];
        const keyCz  = VIS_OBJ_CZ[keyOrd];
        let j = i - 1;
        while (j >= 0 && VIS_OBJ_CZ[VIS_SORT_ORD[j]] < keyCz) {
          VIS_SORT_ORD[j + 1] = VIS_SORT_ORD[j];
          j--;
        }
        VIS_SORT_ORD[j + 1] = keyOrd;
      }

      for (let k = 0; k < count; k++) {
        const ord  = VIS_SORT_ORD[k];
        const type = VIS_OBJ_TYPE[ord];
        const idx  = VIS_OBJ_IDX[ord];
        if (type === 1) {
          renderBuildingLowPoly320(WORLD_BUILDINGS[idx], camX, camZ, projPoint320);
        } else {
          const tr = WORLD_TREES[idx];
          const yFloor = getTerrainHeightMeters(tr.x, tr.z);
          const ptBase = projPoint320(tr.x, yFloor, tr.z);
          const ptTop  = projPoint320(tr.x, yFloor + tr.h, tr.z);
          if (ptBase && ptTop) {
            const wPx = (tr.w * FOCAL_240) / ptBase.cz;
            drawTreeBillboard320(ptBase, ptTop, wPx, tr.type);
          }
        }
      }
    }

    // =========================================================================
    // MODELOS 3D SÓLIDOS LOW-POLY PARA VISTA FOLLOW (ALA, AVIÓN CON COLA Y DRON)
    // =========================================================================
    const MAX_CRAFT_FACES = 32;
    const CRAFT_FACES = Array.from({ length: MAX_CRAFT_FACES }, () => ({
      p0: null, p1: null, p2: null, col: 0, cz: 0
    }));
    const CRAFT_FACE_ORD = new Uint8Array(MAX_CRAFT_FACES);

    function renderSortedCraftFaces(faceCount) {
      for (let i = 0; i < faceCount; i++) CRAFT_FACE_ORD[i] = i;
      for (let i = 1; i < faceCount; i++) {
        const kOrd = CRAFT_FACE_ORD[i];
        const kCz  = CRAFT_FACES[kOrd].cz;
        let j = i - 1;
        while (j >= 0 && CRAFT_FACES[CRAFT_FACE_ORD[j]].cz < kCz) {
          CRAFT_FACE_ORD[j + 1] = CRAFT_FACE_ORD[j];
          j--;
        }
        CRAFT_FACE_ORD[j + 1] = kOrd;
      }
      for (let i = 0; i < faceCount; i++) {
        const f = CRAFT_FACES[CRAFT_FACE_ORD[i]];
        fillTri320(f.p0.sx, f.p0.sy, f.p1.sx, f.p1.sy, f.p2.sx, f.p2.sy, f.col);
      }
    }

    function addCraftTri(fc, p0, p1, p2, col) {
      if (!p0 || !p1 || !p2 || fc >= MAX_CRAFT_FACES) return fc;
      const slot = CRAFT_FACES[fc];
      slot.p0  = p0;
      slot.p1  = p1;
      slot.p2  = p2;
      slot.col = col;
      slot.cz  = (p0.cz + p1.cz + p2.cz) * 0.3333;
      return fc + 1;
    }

    function addCraftQuad(fc, p0, p1, p2, p3, col) {
      fc = addCraftTri(fc, p0, p1, p2, col);
      fc = addCraftTri(fc, p0, p2, p3, col);
      return fc;
    }

    // Cámara Follow Moderna con Resorte Elástico (Spring-Lag + Horizon Damping, 0 allocs en SRAM)
    const followCamState = {
      activeCraft: null,
      fx: 0, fy: 0, fz: 1,
      ux: 0, uy: 1, uz: 0,
      rx: 1, ry: 0, rz: 0,
      camX: 0, camY: 5, camZ: -15,
      cRx: 1, cRy: 0, cRz: 0,
      cUx: 0, cUy: 1, cUz: 0,
      cFx: 0, cFy: 0, cFz: 1
    };

    function computeFollowCamPose(craft, baseDist, baseUp, lookDownDeg) {
      // Dirección objetivo: combina 58% trayectoria real (velocidad) + 42% morro para apreciar AoA, derrape y virajes
      const spd = Math.hypot(craft.vx, craft.vy, craft.vz);
      let tfx = craft.fx, tfy = craft.fy, tfz = craft.fz;
      if (spd > 2.5) {
        const vxN = craft.vx / spd, vyN = craft.vy / spd, vzN = craft.vz / spd;
        tfx = craft.fx * 0.42 + vxN * 0.58;
        tfy = craft.fy * 0.42 + vyN * 0.58;
        tfz = craft.fz * 0.42 + vzN * 0.58;
        const tLen = Math.hypot(tfx, tfy, tfz) || 1.0;
        tfx /= tLen; tfy /= tLen; tfz /= tLen;
      }

      // Vector Up objetivo: 74% horizonte mundial + 26% alabeo del avión (el avión se inclina y gira libremente frente a la cámara)
      const upWorldWeight = craft.uy >= -0.15 ? 0.74 : 0.45;
      let tux = craft.ux * (1.0 - upWorldWeight);
      let tuy = craft.uy * (1.0 - upWorldWeight) + upWorldWeight;
      let tuz = craft.uz * (1.0 - upWorldWeight);
      const uLen0 = Math.hypot(tux, tuy, tuz) || 1.0;
      tux /= uLen0; tuy /= uLen0; tuz /= uLen0;

      if (followCamState.activeCraft !== craft) {
        followCamState.activeCraft = craft;
        followCamState.fx = tfx; followCamState.fy = tfy; followCamState.fz = tfz;
        followCamState.ux = tux; followCamState.uy = tuy; followCamState.uz = tuz;
      } else {
        const lagF = 0.11;
        const lagU = 0.09;
        followCamState.fx += (tfx - followCamState.fx) * lagF;
        followCamState.fy += (tfy - followCamState.fy) * lagF;
        followCamState.fz += (tfz - followCamState.fz) * lagF;
        followCamState.ux += (tux - followCamState.ux) * lagU;
        followCamState.uy += (tuy - followCamState.uy) * lagU;
        followCamState.uz += (tuz - followCamState.uz) * lagU;
      }

      let fL = Math.hypot(followCamState.fx, followCamState.fy, followCamState.fz) || 1.0;
      let fx = followCamState.fx / fL, fy = followCamState.fy / fL, fz = followCamState.fz / fL;
      const dotUF = followCamState.ux * fx + followCamState.uy * fy + followCamState.uz * fz;
      let ux = followCamState.ux - dotUF * fx;
      let uy = followCamState.uy - dotUF * fy;
      let uz = followCamState.uz - dotUF * fz;
      const uL = Math.hypot(ux, uy, uz) || 1.0;
      ux /= uL; uy /= uL; uz /= uL;
      const rx = uy * fz - uz * fy;
      const ry = uz * fx - ux * fz;
      const rz = ux * fy - uy * fx;

      followCamState.fx = fx; followCamState.fy = fy; followCamState.fz = fz;
      followCamState.ux = ux; followCamState.uy = uy; followCamState.uz = uz;
      followCamState.rx = rx; followCamState.ry = ry; followCamState.rz = rz;

      // Distancia más amplia con ligero estiramiento dinámico al dar gas
      const dynDist = baseDist + (craft.thrCmd || 0.5) * 0.65;
      const camX = craft.px - fx * dynDist + ux * baseUp;
      const camZ = craft.pz - fz * dynDist + uz * baseUp;
      const minCamY = getTerrainHeightMeters(camX, camZ) + 0.45;
      const camY = Math.max(minCamY, craft.py - fy * dynDist + uy * baseUp);

      const pitchDown = lookDownDeg * DEG2RAD;
      const cP = Math.cos(pitchDown), sP = Math.sin(pitchDown);
      followCamState.camX = camX;
      followCamState.camY = camY;
      followCamState.camZ = camZ;
      followCamState.cRx = rx;
      followCamState.cRy = ry;
      followCamState.cRz = rz;
      followCamState.cUx = cP * ux + sP * fx;
      followCamState.cUy = cP * uy + sP * fy;
      followCamState.cUz = cP * uz + sP * fz;
      followCamState.cFx = -sP * ux + cP * fx;
      followCamState.cFy = -sP * uy + cP * fy;
      followCamState.cFz = -sP * uz + cP * fz;
      return followCamState;
    }

    // Dibuja el Modelo 3D Sólido del Ala Volante (Z-84 / AR Wing) o Avión con Cola (Bixler / Talon / Edge 540)
    function renderSolidWingModel320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      function wp(r, u, f) {
        return projPoint320(
          px + rx * r + ux * u + fx * f,
          py + ry * r + uy * u + fy * f,
          pz + rz * r + uz * u + fz * f
        );
      }

      const hasRudder = !!(fcProfile.wing.hasRudder && fcProfile.wing.yawRate > 0);
      let fc = 0;

      if (!hasRudder) {
        // 1. ALA VOLANTE SÓLIDA (Z-84 / AR WING LR): fuselaje central + alas delta en flecha + winglets + elevones móviles
        const C_BODY_TOP = rgb565(56, 62, 72);
        const C_BODY_BOT = rgb565(34, 38, 46);
        const C_WING_L   = rgb565(238, 72, 38);  // Franja naranja/roja de alta visibilidad
        const C_WING_R   = rgb565(218, 58, 30);
        const C_CANOPY   = rgb565(30, 165, 235);
        const C_WLET     = rgb565(245, 190, 32);
        const C_ELEV     = rgb565(240, 244, 248);

        const nose   = wp( 0.00,  0.00,  0.95);
        const canopy = wp( 0.00,  0.16,  0.22);
        const belly  = wp( 0.00, -0.11,  0.15);
        const rootL  = wp(-0.28,  0.03,  0.38);
        const rootR  = wp( 0.28,  0.03,  0.38);
        const tailC  = wp( 0.00,  0.04, -0.52);
        const tailB  = wp( 0.00, -0.06, -0.52);
        const rearL  = wp(-0.34,  0.02, -0.48);
        const rearR  = wp( 0.34,  0.02, -0.48);

        const tipLF  = wp(-1.48,  0.05, -0.22);
        const tipLR  = wp(-1.48,  0.04, -0.62);
        const tipLT  = wp(-1.54,  0.34, -0.66); // Winglet izquierdo

        const tipRF  = wp( 1.48,  0.05, -0.22);
        const tipRR  = wp( 1.48,  0.04, -0.62);
        const tipRT  = wp( 1.54,  0.34, -0.66); // Winglet derecho

        // Elevones móviles (deflexión física real en vista Follow)
        const elDefL = Math.max(-0.22, Math.min(0.22, sim.elevL * 0.16));
        const elDefR = Math.max(-0.22, Math.min(0.22, sim.elevR * 0.16));
        const elL1   = wp(-0.36,  0.02 + elDefL, -0.68);
        const elL2   = wp(-1.38,  0.04 + elDefL, -0.78);
        const elR1   = wp( 0.36,  0.02 + elDefR, -0.68);
        const elR2   = wp( 1.38,  0.04 + elDefR, -0.78);

        // Fuselaje central y panza
        fc = addCraftTri(fc, nose, rootL, canopy, C_CANOPY);
        fc = addCraftTri(fc, nose, canopy, rootR, C_CANOPY);
        fc = addCraftTri(fc, canopy, rootL, tailC, C_BODY_TOP);
        fc = addCraftTri(fc, canopy, tailC, rootR, C_BODY_TOP);
        fc = addCraftTri(fc, rootL, rearL, tailC, C_BODY_TOP);
        fc = addCraftTri(fc, rootR, tailC, rearR, C_BODY_TOP);
        fc = addCraftTri(fc, nose, belly, rootL, C_BODY_BOT);
        fc = addCraftTri(fc, nose, rootR, belly, C_BODY_BOT);
        fc = addCraftTri(fc, belly, tailB, rearL, C_BODY_BOT);
        fc = addCraftTri(fc, belly, rearR, tailB, C_BODY_BOT);

        // Semialas izquierda y derecha + Winglets + Elevones móviles
        fc = addCraftQuad(fc, rootL, tipLF, tipLR, rearL, C_WING_L);
        fc = addCraftQuad(fc, rootR, rearR, tipRR, tipRF, C_WING_R);
        fc = addCraftTri(fc, tipLF, tipLR, tipLT, C_WLET);
        fc = addCraftTri(fc, tipRF, tipRR, tipRT, C_WLET);
        fc = addCraftQuad(fc, rearL, tipLR, elL2, elL1, C_ELEV);
        fc = addCraftQuad(fc, rearR, elR1, elR2, tipRR, C_ELEV);

        renderSortedCraftFaces(fc);

        // Disco de hélice trasera Pusher girando
        const propAng = sim.flightTime * (18.0 + sim.motorRpm * 45.0);
        const pCos = Math.cos(propAng) * 0.26, pSin = Math.sin(propAng) * 0.26;
        projLine(
          px - fx * 0.58 + rx * pCos + ux * pSin, py - fy * 0.58 + ry * pCos + uy * pSin, pz - fz * 0.58 + rz * pCos + uz * pSin,
          px - fx * 0.58 - rx * pCos - ux * pSin, py - fy * 0.58 - ry * pCos - uy * pSin, pz - fz * 0.58 - rz * pCos - uz * pSin,
          0, 1
        );
      } else {
        // 2. AVIÓN CON FUSELAJE, CABINA, ALAS Y COLA CON TIMÓN MÓVIL (BIXLER / TALON VTAIL / EDGE 540)
        const is3D   = fcProfile.wing.pitchRate >= 280;
        const C_FUS_L = is3D ? rgb565(235, 48, 42)  : rgb565(236, 240, 245);
        const C_FUS_D = is3D ? rgb565(165, 28, 24)  : rgb565(172, 182, 196);
        const C_WING  = is3D ? rgb565(250, 195, 28) : rgb565(225, 232, 240);
        const C_TIPS  = rgb565(235, 64, 36);
        const C_CAN   = rgb565(36, 175, 245);
        const C_RUD   = rgb565(250, 200, 36);

        const nose  = wp( 0.00,  0.00,  1.12);
        const canF  = wp( 0.00,  0.18,  0.45);
        const canR  = wp( 0.00,  0.22, -0.05);
        const fusL  = wp(-0.14,  0.02,  0.20);
        const fusR  = wp( 0.14,  0.02,  0.20);
        const fusB  = wp( 0.00, -0.15,  0.15);
        const tail  = wp( 0.00,  0.04, -1.22);

        // Alas principales con ligero diedro
        const wRootLF = wp(-0.14, 0.08,  0.26), wRootLR = wp(-0.14, 0.06, -0.18);
        const wRootRF = wp( 0.14, 0.08,  0.26), wRootRR = wp( 0.14, 0.06, -0.18);
        const wTipLF  = wp(-1.58, 0.18,  0.16), wTipLR  = wp(-1.58, 0.16, -0.18);
        const wTipRF  = wp( 1.58, 0.18,  0.16), wTipRR  = wp( 1.58, 0.16, -0.18);

        // Estabilizador horizontal + Timón vertical con deflexión viva de Rudder (hwInput.lx)
        const rudDef  = Math.max(-0.26, Math.min(0.26, -hwInput.lx * 0.24));
        const hStabL  = wp(-0.56, 0.08, -1.18), hStabR = wp(0.56, 0.08, -1.18);
        const hStabF  = wp( 0.00, 0.08, -0.92);
        const finTop  = wp( 0.00, 0.52, -1.16);
        const rudRear = wp( rudDef, 0.44, -1.36);

        // Fuselaje y cabina
        fc = addCraftTri(fc, nose, fusL, canF, C_CAN);
        fc = addCraftTri(fc, nose, canF, fusR, C_CAN);
        fc = addCraftTri(fc, canF, fusL, canR, C_CAN);
        fc = addCraftTri(fc, canF, canR, fusR, C_CAN);
        fc = addCraftTri(fc, fusL, tail, canR, C_FUS_D);
        fc = addCraftTri(fc, fusR, canR, tail, C_FUS_L);
        fc = addCraftTri(fc, fusL, fusB, tail, C_FUS_D);
        fc = addCraftTri(fc, fusR, tail, fusB, C_FUS_L);

        // Alas principales + puntas rojas
        fc = addCraftQuad(fc, wRootLF, wTipLF, wTipLR, wRootLR, C_WING);
        fc = addCraftQuad(fc, wRootRF, wRootRR, wTipRR, wTipRF, C_WING);
        fc = addCraftTri(fc, wTipLF, wp(-1.72, 0.22, -0.02), wTipLR, C_TIPS);
        fc = addCraftTri(fc, wTipRF, wTipRR, wp( 1.72, 0.22, -0.02), C_TIPS);

        // Cola horizontal y Timón vertical móvil
        fc = addCraftTri(fc, hStabF, hStabL, tail, C_WING);
        fc = addCraftTri(fc, hStabF, tail, hStabR, C_WING);
        fc = addCraftTri(fc, wp(0, 0.06, -0.90), tail, finTop, C_FUS_L);
        fc = addCraftTri(fc, tail, finTop, rudRear, C_RUD);

        renderSortedCraftFaces(fc);
      }
    }

    // Dibuja el Modelo 3D Sólido del Dron FPV Quad-X 5" (Chasis carbono, Batería LiPo 4S, 4 Brazos y 4 Rotores)
    function renderSolidDroneModel320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      function wp(r, u, f) {
        return projPoint320(
          px + rx * r + ux * u + fx * f,
          py + ry * r + uy * u + fy * f,
          pz + rz * r + uz * u + fz * f
        );
      }

      const C_CARBON = rgb565(46, 52, 60);
      const C_ARMS   = rgb565(68, 76, 88);
      const C_LIPO   = rgb565(32, 148, 235);
      const C_STRAP  = rgb565(245, 180, 28);
      const C_CAM    = rgb565(235, 58, 38);

      let fc = 0;
      // Placa central de carbono + Cámara FPV frontal + Batería LiPo 4S superior
      const bFL = wp(-0.14, 0.02,  0.26), bFR = wp( 0.14, 0.02,  0.26);
      const bRL = wp(-0.14, 0.02, -0.26), bRR = wp( 0.14, 0.02, -0.26);
      fc = addCraftQuad(fc, bFL, bFR, bRR, bRL, C_CARBON);

      const lFL = wp(-0.09, 0.12,  0.14), lFR = wp( 0.09, 0.12,  0.14);
      const lRL = wp(-0.09, 0.12, -0.16), lRR = wp( 0.09, 0.12, -0.16);
      fc = addCraftQuad(fc, lFL, lFR, lRR, lRL, C_LIPO);
      fc = addCraftQuad(fc, bRL, bRR, lRR, lRL, C_STRAP);
      fc = addCraftTri(fc, bFL, bFR, wp(0.0, 0.09, 0.34), C_CAM);

      // 4 Brazos de fibra de carbono en X
      const armCoords = [
        [ 0.48, -0.44], // M1 RR
        [ 0.48,  0.44], // M2 FR
        [-0.48, -0.44], // M3 RL
        [-0.48,  0.44]  // M4 FL
      ];
      for (let m = 0; m < 4; m++) {
        const ar = armCoords[m][0], af = armCoords[m][1];
        const a0 = wp(ar * 0.22 - 0.04, 0.01, af * 0.22);
        const a1 = wp(ar * 0.22 + 0.04, 0.01, af * 0.22);
        const a2 = wp(ar + 0.04, 0.01, af);
        const a3 = wp(ar - 0.04, 0.01, af);
        fc = addCraftQuad(fc, a0, a1, a2, a3, C_ARMS);
      }

      renderSortedCraftFaces(fc);

      // 4 Campanas de motor y discos de hélice girando a sus RPM reales
      const propR = 0.22;
      for (let m = 0; m < 4; m++) {
        const ar = armCoords[m][0], af = armCoords[m][1];
        const mHub = wp(ar, 0.05, af);
        if (mHub) drawInavCircleDot320(mHub.sx, mHub.sy, 2, m < 2 ? C565.ORANGE : C565.GREEN);
        const ang = sim.flightTime * (28.0 + sim.mRpm[m] * 55.0) + m * 1.1;
        const cA = Math.cos(ang) * propR, sA = Math.sin(ang) * propR;
        const wx = px + rx * ar + ux * 0.06 + fx * af;
        const wy = py + ry * ar + uy * 0.06 + fy * af;
        const wz = pz + rz * ar + uz * 0.06 + fz * af;
        projLine(
          wx + rx * cA + fx * sA, wy + ry * cA + fy * sA, wz + rz * cA + fz * sA,
          wx - rx * cA - fx * sA, wy - ry * cA - fy * sA, wz - rz * cA - fz * sA,
          0, 1
        );
      }
    }

    /***************************************************************************
     * PRIMITIVAS NATIVAS 320x240 PARA EL OSD ESTILO INAV (BLANCO CON BORDE NEGRO)
     ***************************************************************************/
    function setPx320(x, y, col565) {
      const ix = x | 0, iy = y | 0;
      if (ix >= 0 && ix < DISP_W && iy >= 0 && iy < DISP_H) {
        vram565[iy * DISP_W + ix] = col565;
      }
    }

    // Dibuja un bloque de 2x2 con contorno negro de 1px alrededor
    function drawOutlinedDot320(x, y, fg565 = 0xFFFF) {
      const ix = x | 0, iy = y | 0;
      for (let dy = -1; dy <= 2; dy++) {
        const py = iy + dy;
        if (py < 0 || py >= DISP_H) continue;
        const row = py * DISP_W;
        for (let dx = -1; dx <= 2; dx++) {
          const px = ix + dx;
          if (px < 0 || px >= DISP_W) continue;
          if (dx >= 0 && dx <= 1 && dy >= 0 && dy <= 1) {
            vram565[row + px] = fg565;
          } else if (vram565[row + px] !== fg565) {
            vram565[row + px] = 0x0000;
          }
        }
      }
    }

    // Dibuja un círculo pequeño estilo INAV (como las bolitas del horizonte artificial y escalas verticales)
    function drawInavCircleDot320(cx, cy, r = 2, fg565 = 0xFFFF) {
      const ix = Math.round(cx), iy = Math.round(cy);
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        for (let dx = -r - 1; dx <= r + 1; dx++) {
          const d2 = dx * dx + dy * dy;
          if (d2 <= r * r) {
            setPx320(ix + dx, iy + dy, fg565);
          } else if (d2 <= (r + 1) * (r + 1) + 1) {
            setPx320(ix + dx, iy + dy, 0x0000);
          }
        }
      }
    }

    // Línea nativa en 320x240 con borde negro de 1px
    function drawOutlinedLine320(x0, y0, x1, y1, fg565 = 0xFFFF) {
      const steps = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0)));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx !== 0 || dy !== 0) setPx320(x + dx, y + dy, 0x0000);
          }
        }
      }
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = Math.round(x0 + (x1 - x0) * t);
        const y = Math.round(y0 + (y1 - y0) * t);
        setPx320(x, y, fg565);
      }
    }

    // =========================================================================
    // ROM DE CARACTERES OSD ESTILO CHIP MAX7456 (PRE-BORDEADOS 2-BIT)
    // - OSD_SMALL_ROM (5x7 px: núcleo 3x5 1:1 nativo en 320x240 + borde negro 1px)
    //   usado en el OSD de vuelo para máxima visibilidad y nitidez real en el panel IPS 2.8".
    // - OSD_CHAR_ROM  (7x9 px: núcleo pixel-art 5x7 real estilo Nintendo + borde 1px)
    //   usado en menús, tarjetas, notificaciones y selectores.
    // Ambos se dibujan en 1 sola pasada lineal sin bucles vecinos por frame:
    //   0 = transparente, 1 = borde negro 0x0000, 2 = relleno blanco/color
    // =========================================================================
    const TICK_GLYPH = [2, 2, 0, 0, 0];
    const FONT_5X7 = {
      '0': [14,17,19,21,25,17,14], '1': [ 4,12, 4, 4, 4, 4,14], '2': [14,17, 1, 6, 8,16,31],
      '3': [30, 1, 1,14, 1, 1,30], '4': [ 2, 6,10,18,31, 2, 2], '5': [31,16,30, 1, 1,17,14],
      '6': [14,16,16,30,17,17,14], '7': [31, 1, 2, 4, 8, 8, 8], '8': [14,17,17,14,17,17,14],
      '9': [14,17,17,15, 1, 1,14],
      'A': [14,17,17,31,17,17,17], 'B': [30,17,17,30,17,17,30], 'C': [14,17,16,16,16,17,14],
      'D': [30,17,17,17,17,17,30], 'E': [31,16,16,30,16,16,31], 'F': [31,16,16,30,16,16,16],
      'G': [14,17,16,23,17,17,15], 'H': [17,17,17,31,17,17,17], 'I': [14, 4, 4, 4, 4, 4,14],
      'J': [ 7, 2, 2, 2,18,18,12], 'K': [17,18,20,24,20,18,17], 'L': [16,16,16,16,16,16,31],
      'M': [17,27,21,21,17,17,17], 'N': [17,25,21,19,17,17,17], 'O': [14,17,17,17,17,17,14],
      'P': [30,17,17,30,16,16,16], 'Q': [14,17,17,17,21,18,13], 'R': [30,17,17,30,20,18,17],
      'S': [15,16,16,14, 1, 1,30], 'T': [31, 4, 4, 4, 4, 4, 4], 'U': [17,17,17,17,17,17,14],
      'V': [17,17,17,17,17,10, 4], 'W': [17,17,17,21,21,27,17], 'X': [17,17,10, 4,10,17,17],
      'Y': [17,17,10, 4, 4, 4, 4], 'Z': [31, 1, 2, 4, 8,16,31],
      ':': [ 0, 4, 4, 0, 4, 4, 0], '-': [ 0, 0, 0,31, 0, 0, 0], '/': [ 1, 2, 2, 4, 8, 8,16],
      '.': [ 0, 0, 0, 0, 0, 6, 6], '+': [ 0, 4, 4,31, 4, 4, 0], '>': [16, 8, 4, 2, 4, 8,16],
      '<': [ 2, 4, 8,16, 8, 4, 2], '%': [25,25, 2, 4, 8,19,19], '[': [14, 8, 8, 8, 8, 8,14],
      ']': [14, 2, 2, 2, 2, 2,14], '*': [ 0,21,14,31,14,21, 0], '(': [ 2, 4, 8, 8, 8, 4, 2],
      ')': [ 8, 4, 2, 2, 2, 4, 8], '|': [ 4, 4, 4, 4, 4, 4, 4], ',': [ 0, 0, 0, 0, 0, 4, 8],
      '=': [ 0, 0,31, 0,31, 0, 0], '!': [ 4, 4, 4, 4, 4, 0, 4], '?': [14,17, 1, 6, 4, 0, 4],
      '\'':[ 4, 4, 0, 0, 0, 0, 0], '"': [10,10, 0, 0, 0, 0, 0]
    };

    const OSD_GLYPH_W = 7;
    const OSD_GLYPH_H = 9;
    const OSD_CHAR_ROM = new Uint8Array(128 * OSD_GLYPH_W * OSD_GLYPH_H);

    const OSD_SM_W = 5;
    const OSD_SM_H = 7;
    const OSD_SMALL_ROM = new Uint8Array(128 * OSD_SM_W * OSD_SM_H);

    (function buildMax7456CharacterRom() {
      for (let code = 32; code < 128; code++) {
        const ch = String.fromCharCode(code);

        // 1. Glifo compacto nativo 5x7 (núcleo 3x5 1:1 en 320x240 + contorno negro 1px)
        const g35 = ch === '\'' ? TICK_GLYPH : FONT_3X5[ch];
        if (g35) {
          const smBase = code * (OSD_SM_W * OSD_SM_H);
          for (let r = 0; r < 5; r++) {
            const rowBits = g35[r];
            for (let c = 0; c < 3; c++) {
              if ((rowBits >> (2 - c)) & 1) {
                const px = 1 + c;
                const py = 1 + r;
                for (let oy = -1; oy <= 1; oy++) {
                  for (let ox = -1; ox <= 1; ox++) {
                    const gx = px + ox, gy = py + oy;
                    const idx = smBase + gy * OSD_SM_W + gx;
                    if (ox === 0 && oy === 0) {
                      OSD_SMALL_ROM[idx] = 2; // Relleno 1px nativo
                    } else if (OSD_SMALL_ROM[idx] === 0) {
                      OSD_SMALL_ROM[idx] = 1; // Borde negro 1px
                    }
                  }
                }
              }
            }
          }
        }

        // 2. Glifo pixel-art 5x7 real (celda 7x9 con contorno 1px) estilo consola Nintendo
        const g57 = FONT_5X7[ch];
        if (g57) {
          const baseOff = code * (OSD_GLYPH_W * OSD_GLYPH_H);
          for (let r = 0; r < 7; r++) {
            const rowBits = g57[r];
            for (let c = 0; c < 5; c++) {
              if ((rowBits >> (4 - c)) & 1) {
                const px = 1 + c;
                const py = 1 + r;
                for (let oy = -1; oy <= 1; oy++) {
                  for (let ox = -1; ox <= 1; ox++) {
                    const gx = px + ox, gy = py + oy;
                    const idx = baseOff + gy * OSD_GLYPH_W + gx;
                    if (ox === 0 && oy === 0) {
                      OSD_CHAR_ROM[idx] = 2;
                    } else if (OSD_CHAR_ROM[idx] === 0) {
                      OSD_CHAR_ROM[idx] = 1;
                    }
                  }
                }
              }
            }
          }
        }
      }
    })();

    // Dibuja texto pixel-art 5x7 real (celda 7x9, avance 6px) en 1 sola pasada lineal
    // Si outline565 === -1 se omite el borde para texto plano limpio dentro de tarjetas UI
    function drawInavText320(str, x320, y240, fg565 = 0xFFFF, outline565 = 0x0000) {
      const s = String(str).toUpperCase();
      let cx = (x320 | 0) - 1;
      const cy = (y240 | 0) - 1;

      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i) & 127;
        const baseOff = code * (OSD_GLYPH_W * OSD_GLYPH_H);
        for (let gy = 0; gy < OSD_GLYPH_H; gy++) {
          const py = cy + gy;
          if (py < 0 || py >= DISP_H) continue;
          const dstRow = py * DISP_W;
          const srcRow = baseOff + gy * OSD_GLYPH_W;
          for (let gx = 0; gx < OSD_GLYPH_W; gx++) {
            const v = OSD_CHAR_ROM[srcRow + gx];
            if (v === 2) {
              const px = cx + gx;
              if (px >= 0 && px < DISP_W) vram565[dstRow + px] = fg565;
            } else if (v === 1 && outline565 >= 0) {
              const px = cx + gx;
              if (px >= 0 && px < DISP_W) vram565[dstRow + px] = outline565;
            }
          }
        }
        cx += 6;
      }
    }

    // =========================================================================
    // SISTEMA VISUAL NINTENDO SWITCH DARK MATTE EN VRAM565 (320x240 NATIVO, 0 ALLOCS)
    // =========================================================================
    const NIN565 = {
      BG:        rgb565(22, 24, 30),    // Fondo principal grafito mate
      HEADER:    rgb565(30, 34, 42),    // Barra superior e inferior
      CARD:      rgb565(34, 38, 48),    // Tarjeta normal
      CARD_SEL:  rgb565(48, 56, 72),    // Tarjeta activa seleccionada
      PANEL:     rgb565(25, 29, 37),    // Panel derecho de telemetría/radar
      BORDER:    rgb565(56, 62, 76),    // Borde sutil de 1px
      BORDER_HI: rgb565(235, 242, 250), // Borde activo nítido
      RED:       rgb565(230, 0, 18),    // Rojo Nintendo (#E60012)
      BLUE:      rgb565(0, 145, 240),   // Azul Nintendo Switch
      GREEN:     rgb565(26, 200, 92),   // Verde Nintendo
      GOLD:      rgb565(245, 182, 8),   // Ámbar / Dorado SNES
      WHITE:     0xFFFF,
      MUTED:     rgb565(150, 162, 180), // Texto secundario limpio
      TRACK:     rgb565(18, 20, 25),    // Fondo de sliders
      SHADOW:    rgb565(14, 16, 20)     // Sombra de texto 1px en tarjetas
    };

    function fillRect320(x, y, w, h, col565) {
      const x0 = Math.max(0, x | 0);
      const y0 = Math.max(0, y | 0);
      const x1 = Math.min(DISP_W - 1, ((x + w) | 0) - 1);
      const y1 = Math.min(DISP_H - 1, ((y + h) | 0) - 1);
      if (x1 < x0 || y1 < y0) return;
      for (let py = y0; py <= y1; py++) {
        vram565.fill(col565, py * DISP_W + x0, py * DISP_W + x1 + 1);
      }
    }

    // Tarjeta con esquinas redondeadas pixel-art de 2px y borde de 1px en vram565
    function drawRoundedCard320(x, y, w, h, bg565, border565 = -1) {
      const x0 = x | 0, y0 = y | 0, w0 = w | 0, h0 = h | 0;
      if (w0 < 6 || h0 < 6) return;
      for (let ry = 0; ry < h0; ry++) {
        const py = y0 + ry;
        if (py < 0 || py >= DISP_H) continue;
        const inset = (ry === 0 || ry === h0 - 1) ? 2 : ((ry === 1 || ry === h0 - 2) ? 1 : 0);
        const lx = Math.max(0, x0 + inset);
        const rx = Math.min(DISP_W - 1, x0 + w0 - 1 - inset);
        if (rx >= lx) {
          vram565.fill(bg565, py * DISP_W + lx, py * DISP_W + rx + 1);
          if (border565 >= 0) {
            if (ry === 0 || ry === h0 - 1) {
              vram565.fill(border565, py * DISP_W + lx, py * DISP_W + rx + 1);
            } else if (ry === 1 || ry === h0 - 2) {
              vram565[py * DISP_W + lx] = border565;
              vram565[py * DISP_W + rx] = border565;
            } else {
              vram565[py * DISP_W + lx] = border565;
              vram565[py * DISP_W + rx] = border565;
            }
          }
        }
      }
    }

    // Píldora redondeada con texto centrado (5x7 o 3x5 compacto)
    function drawPillBadge320(x, y, w, h, bg565, textStr, fg565 = 0xFFFF, useSmall = false, border565 = -1) {
      drawRoundedCard320(x, y, w, h, bg565, border565);
      const s = String(textStr);
      const charW = useSmall ? 5 : 6;
      const textW = s.length * charW - 1;
      const tx = (x | 0) + ((w - textW) >> 1);
      const ty = (y | 0) + ((h - (useSmall ? 5 : 7)) >> 1);
      if (useSmall) {
        drawOsdSmall320(s, tx, ty, fg565);
      } else {
        drawInavText320(s, tx, ty, fg565, -1);
      }
    }

    // Icono circular de botón estilo Nintendo (A)(B)(X)(Y) de 11x11 px + etiqueta al lado
    function drawBtnPrompt320(x, y, btnChar, btnCol565, labelStr, labelCol565 = 0xFFFF) {
      const cx = (x | 0) + 5, cy = (y | 0) + 5;
      for (let dy = -5; dy <= 5; dy++) {
        const py = cy + dy;
        if (py < 0 || py >= DISP_H) continue;
        const span = Math.abs(dy) === 5 ? 2 : (Math.abs(dy) === 4 ? 3 : (Math.abs(dy) === 3 ? 4 : 5));
        const lx = Math.max(0, cx - span);
        const rx = Math.min(DISP_W - 1, cx + span);
        vram565.fill(btnCol565, py * DISP_W + lx, py * DISP_W + rx + 1);
      }
      drawOsdSmall320(btnChar, cx - 1, cy - 2, 0xFFFF);
      if (labelStr) {
        drawInavText320(labelStr, (x | 0) + 14, (y | 0) + 2, labelCol565, -1);
      }
    }

    // Barra de progreso / slider horizontal limpia estilo consola
    function drawSliderBar320(x, y, w, h, norm01, fillCol565) {
      const clamped = Math.max(0.0, Math.min(1.0, norm01));
      fillRect320(x, y, w, h, NIN565.TRACK);
      const fw = Math.round(clamped * w);
      if (fw > 0) fillRect320(x, y, fw, h, fillCol565);
    }

    // Notificación flotante Mini-Píldora (13px de alto) para avisos de Gates y ajustes sin tapar la vista
    function renderNintendoToast320(msg) {
      const s = String(msg).toUpperCase();
      const isWarn = s.includes('FAILSAFE') || s.includes('CRITICO') || s.includes('BAJIO') || s.includes('DESCONECTADO');
      const isOk   = s.includes('GATE') || s.includes('BOYA') || s.includes('LAP') || s.includes('OK') || s.includes('COMPLETADA');
      const accentCol = isWarn ? NIN565.RED : (isOk ? NIN565.GREEN : NIN565.GOLD);

      // Usamos fuente compacta 3x5 (5px/char) para que el aviso de Gate sea súper discreto y nítido
      const textW = s.length * 5;
      const pillW = Math.min(304, textW + 20);
      const pillH = 13;
      const px = 160 - (pillW >> 1);
      // Si estamos en vuelo/juego sin menú abierto, lo ubicamos en y=26 (debajo de la brújula superior)
      const py = rgOverlayOpen || osState !== 'ingame' ? 6 : 26;

      drawRoundedCard320(px, py, pillW, pillH, NIN565.HEADER, NIN565.BORDER);
      // Indicador lateral de color de 4x7 px dentro de la píldora
      fillRect320(px + 4, py + 3, 4, 7, accentCol);
      drawOsdSmall320(s, px + 12, py + 4, 0xFFFF);
    }

    // Dibuja texto OSD compacto (5x7 nativo 1:1 en 320x240) en 1 sola pasada lineal (100% real en ILI9341V)
    function drawOsdSmall320(str, x320, y240, fg565 = 0xFFFF) {
      const s = String(str).toUpperCase();
      let cx = (x320 | 0) - 1;
      const cy = (y240 | 0) - 1;

      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i) & 127;
        const baseOff = code * (OSD_SM_W * OSD_SM_H);
        for (let gy = 0; gy < OSD_SM_H; gy++) {
          const py = cy + gy;
          if (py < 0 || py >= DISP_H) continue;
          const dstRow = py * DISP_W;
          const srcRow = baseOff + gy * OSD_SM_W;
          for (let gx = 0; gx < OSD_SM_W; gx++) {
            const v = OSD_SMALL_ROM[srcRow + gx];
            if (v !== 0) {
              const px = cx + gx;
              if (px >= 0 && px < DISP_W) {
                vram565[dstRow + px] = v === 1 ? 0x0000 : fg565;
              }
            }
          }
        }
        cx += 5;
      }
    }

    // Icono de batería compacto (5x7 px) acorde a la fuente OSD nativa 320x240
    function drawBatteryIcon320(x, y) {
      drawOutlinedLine320(x, y + 1, x + 4, y + 1);
      drawOutlinedLine320(x, y + 6, x + 4, y + 6);
      drawOutlinedLine320(x, y + 1, x, y + 6);
      drawOutlinedLine320(x + 4, y + 1, x + 4, y + 6);
      drawOutlinedLine320(x + 1, y, x + 3, y);
      for (let py = y + 2; py <= y + 5; py++) {
        for (let px = x + 1; px <= x + 3; px++) setPx320(px, py, 0xFFFF);
      }
    }

    // Icono de Casa (Home / Gate) compacto (7x6 px) en 320x240
    function drawHomeIcon320(x, y) {
      drawOutlinedLine320(x + 3, y, x, y + 3);
      drawOutlinedLine320(x + 3, y, x + 6, y + 3);
      drawOutlinedLine320(x + 1, y + 3, x + 1, y + 6);
      drawOutlinedLine320(x + 5, y + 3, x + 5, y + 6);
      drawOutlinedLine320(x + 1, y + 6, x + 5, y + 6);
    }

    // Icono de Antena RSSI compacto (7x6 px: 3 barras de señal escalonadas) en 320x240
    function drawRssiIcon320(x, y, col565 = 0xFFFF) {
      drawOutlinedLine320(x,     y + 4, x,     y + 6, col565);
      drawOutlinedLine320(x + 2, y + 2, x + 2, y + 6, col565);
      drawOutlinedLine320(x + 4, y,     x + 4, y + 6, col565);
    }

    // Generador entero Xorshift32 de nieve analógica 5.8GHz y bandas de pérdida de sincronismo (0 divisiones flotantes)
    let fpvStaticSeed = 0x9E3779B9;
    function applyFpvLinkStatic320(rssiPct) {
      if (rssiPct >= 38) return;
      const loss = 38 - (rssiPct | 0); // 1..38
      let s = fpvStaticSeed | 1;

      // 1. Nieve de radiofrecuencia proporcional a la caída de RSSI en el borde del mapa
      const snowDots = loss * 42;
      for (let i = 0; i < snowDots; i++) {
        s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
        const idx = (s >>> 0) % (DISP_W * DISP_H);
        const gray = (s & 1) ? 0xFFFF : 0x39E7;
        vram565[idx] = gray;
        if (idx + 1 < DISP_W * DISP_H && (s & 4)) vram565[idx + 1] = 0x0000;
      }

      // 2. Líneas horizontales de desgarro (Sync Tear) cuando RSSI baja de 24%
      if (rssiPct < 24) {
        const tearLines = (24 - (rssiPct | 0)) >> 2;
        for (let b = 0; b <= tearLines; b++) {
          s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
          const rowY = (s >>> 0) % DISP_H;
          const rowOff = rowY * DISP_W;
          for (let x = 0; x < DISP_W; x += 2) {
            s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
            vram565[rowOff + x] = (s & 2) ? 0xBDF7 : 0x18E3;
          }
        }
      }
      fpvStaticSeed = s;
    }

    // Renderizador completo del OSD estilo INAV con tipografía compacta nativa 5x7 en 320x240
    function renderInavOsd320({
      callsign, modeLabel, spdMs, thrPct, altM, vario,
      activeGate, gateDist, gateBearingRad, totalDistKm,
      flightTimeSec, camX, camY, camZ,
      cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz, projPoint320
    }) {
      const WHITE = 0xFFFF;
      const GREEN_DOT = rgb565(120, 245, 120);

      // Si el RSSI cae cerca del borde del mapa (<38%), inyectar nieve analógica 5.8GHz antes del OSD
      applyFpvLinkStatic320(aeroEnv.rssiPct);

      // 1. HORIZONTE ARTIFICIAL INAV (9 círculos finos proyectados en 3D usando la misma base R0, H0 del Voxel)
      const phi = Math.atan2(cRy, cUy);
      const cosR = Math.cos(phi), sinR = Math.sin(phi);
      let R0x = cosR * cRx - sinR * cUx;
      let R0z = cosR * cRz - sinR * cUz;
      const rLen = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rLen;
      R0z /= rLen;
      const H0x = -R0z, H0z = R0x;

      for (let i = -4; i <= 4; i++) {
        const span = i * 4.0;
        const wx = camX + H0x * 42.0 + R0x * span;
        const wz = camZ + H0z * 42.0 + R0z * span;
        const pt = projPoint320(wx, camY, wz);
        if (pt && pt.sx >= 44 && pt.sx <= 276 && pt.sy >= 20 && pt.sy <= 220) {
          drawInavCircleDot320(pt.sx, pt.sy, 1, i === 0 ? GREEN_DOT : WHITE);
        }
      }

      // 2. RETÍCULA CENTRAL FIJA INAV (───┐_┌───) compacta en (160, 120)
      drawOutlinedLine320(140, 120, 153, 120, WHITE);
      drawOutlinedLine320(153, 120, 153, 124, WHITE);
      drawOutlinedLine320(153, 124, 167, 124, WHITE);
      drawOutlinedLine320(167, 124, 167, 120, WHITE);
      drawOutlinedLine320(167, 120, 180, 120, WHITE);

      // Flecha de dirección hacia el próximo Gate abajo centrada (160, 211), justo encima del modo de vuelo
      if (!isFreeFlightNoGates()) {
        const ax = 160, ay = 211;
        const sB = Math.sin(gateBearingRad), cB = Math.cos(gateBearingRad);
        const tipX = ax + sB * 5, tipY = ay - cB * 5;
        const lWingX = ax - sB * 4 - cB * 4, lWingY = ay + cB * 4 - sB * 4;
        const rWingX = ax - sB * 4 + cB * 4, rWingY = ay + cB * 4 + sB * 4;
        drawOutlinedLine320(tipX, tipY, lWingX, lWingY, WHITE);
        drawOutlinedLine320(tipX, tipY, rWingX, rWingY, WHITE);
        drawOutlinedLine320(lWingX, lWingY, rWingX, rWingY, WHITE);
      }

      // 3. ESCALAS VERTICALES LATERALES FINAS (Izquierda x=68 y Derecha x=252) + cursores '>' y '<'
      for (let i = -6; i <= 6; i++) {
        const py = 120 + i * 8;
        drawInavCircleDot320(68,  py, 1, WHITE);
        drawInavCircleDot320(252, py, 1, WHITE);
      }
      // Indicador '>' a la izquierda (x=72, y=120)
      drawOutlinedLine320(71, 117, 75, 120, WHITE);
      drawOutlinedLine320(75, 120, 71, 123, WHITE);
      // Indicador '<' a la derecha (x=248, y=120)
      drawOutlinedLine320(249, 117, 245, 120, WHITE);
      drawOutlinedLine320(245, 120, 249, 123, WHITE);

      // 4. BRÚJULA SUPERIOR CENTRAL (W ' | ' N ' | ' E) + NOMBRE DEL MODELO
      const headingDeg = ((Math.atan2(H0x, H0z) * RAD2DEG) % 360 + 360) % 360;
      const cardinals = ['N', 'I', 'E', 'I', 'S', 'I', 'W', 'I'];
      const stepDeg = 45;
      const baseIdx = Math.floor(headingDeg / stepDeg);
      let compassStr = '';
      for (let k = -2; k <= 2; k++) {
        const idx = (baseIdx + k + 8) % 8;
        compassStr += cardinals[idx] + (k < 2 ? '\'' : '');
      }
      const callStr = String(callsign);
      drawOsdSmall320(compassStr, 160 - ((compassStr.length * 5) >> 1), 6, WHITE);
      drawOsdSmall320(callStr,    160 - ((callStr.length * 5) >> 1),   16, WHITE);

      // 5. ESQUINA SUPERIOR DERECHA (Satélites + HDOP) Y ESQUINA SUPERIOR IZQUIERDA (Viento + RSSI INAV)
      drawOsdSmall320('SAT 12',   282, 8,  WHITE);
      drawOsdSmall320('HDOP 1.2', 272, 18, WHITE);

      // Indicador de Viento INAV compacto (Flecha de dirección relativa + velocidad en KMH)
      const windSpdKmh = Math.round(Math.hypot(aeroEnv.windX, aeroEnv.windZ) * 3.6);
      const windRelAng = Math.atan2(
        aeroEnv.windX * R0x + aeroEnv.windZ * R0z,
        aeroEnv.windX * H0x + aeroEnv.windZ * H0z
      );
      const wx0 = 12, wy0 = 11;
      const sW = Math.sin(windRelAng), cW = Math.cos(windRelAng);
      drawOutlinedLine320(wx0 - sW * 4, wy0 + cW * 4, wx0 + sW * 4, wy0 - cW * 4, WHITE);
      drawOutlinedLine320(wx0 + sW * 4, wy0 - cW * 4, wx0 + sW * 1 - cW * 3, wy0 - cW * 1 - sW * 3, WHITE);
      drawOutlinedLine320(wx0 + sW * 4, wy0 - cW * 4, wx0 + sW * 1 + cW * 3, wy0 - cW * 1 + sW * 3, WHITE);
      drawOsdSmall320(`W${String(windSpdKmh).padStart(2, ' ')}K`, 20, 8, WHITE);

      // Indicador RSSI (%) y nivel de enlace hacia el borde del mapa
      const rssiVal = Math.round(aeroEnv.rssiPct);
      const rssiCol = rssiVal < 15 ? C565.RED : (rssiVal < 35 ? C565.ORANGE : WHITE);
      drawRssiIcon320(8, 19, rssiCol);
      drawOsdSmall320(`RSSI ${String(rssiVal).padStart(2, ' ')}%`, 16, 19, rssiCol);
      drawOsdSmall320(`${aeroEnv.rssiDbm}DBM`, 8, 29, rssiCol);

      // Alertas centrales de Pérdida Aerodinámica (!STALL!) y Límite de Mapa (!LOW RSSI! / !FAILSAFE RTH!)
      if (aeroEnv.failsafeTimer > 0) {
        drawOsdSmall320('!FAILSAFE RTH - LIMITE MAPA!', 90, 70, C565.RED);
      } else if (rssiVal < 32 && ((Math.floor(flightTimeSec * 5) & 1) === 0)) {
        const warnStr = rssiVal < 15 ? `!LINK CRITICO ${rssiVal}%!` : `!LOW RSSI ${rssiVal}%!`;
        drawOsdSmall320(warnStr, 160 - ((warnStr.length * 5) >> 1), 70, rssiCol);
      }
      if (aeroEnv.stallWarn) {
        drawOsdSmall320('!STALL!', 142, 82, C565.RED);
      }

      // 6. COLUMNA IZQUIERDA COMPACTA (Velocidad Aire/Tierra km/h, Throttle %, Amperios, mAh, Voltajes)
      const kmh = Math.round(spdMs * 3.6);
      const airKmh = Math.round((aeroEnv.airSpd || spdMs) * 3.6);
      drawOsdSmall320(`AR ${String(airKmh).padStart(2, ' ')}`, 8, 102, WHITE);
      drawOsdSmall320(`GS ${String(kmh).padStart(2, ' ')}K`,   8, 114, WHITE);
      drawOsdSmall320(`THR ${Math.round(thrPct)}%`,           8, 126, WHITE);

      const loadFactor = (thrPct / 100);
      const amps = (1.8 + loadFactor * loadFactor * 22.5).toFixed(1);
      const mah  = Math.round(120 + flightTimeSec * 4.8);
      const sagV = loadFactor * loadFactor * 0.85;
      const packV = Math.max(13.6, 16.8 - flightTimeSec * 0.004 - sagV);
      const cellV = (packV / 4).toFixed(2);

      drawOsdSmall320(`A ${amps}`,          8,  176, WHITE);
      drawOsdSmall320(`MAH ${mah}`,         8,  188, WHITE);
      drawBatteryIcon320(8, 199);
      drawOsdSmall320(`${packV.toFixed(2)}V`, 16, 200, WHITE);
      drawBatteryIcon320(8, 211);
      drawOsdSmall320(`${cellV}V`,          16, 212, WHITE);

      // 7. COLUMNA DERECHA COMPACTA (Altitud Alt m, Variómetro m/s, Rumbo a Gate, Tiempo de Vuelo, Distancia)
      drawOsdSmall320(`ALT ${Math.round(altM)}M`, 270, 108, WHITE);
      drawOsdSmall320(`${vario >= 0 ? '+' : ''}${vario.toFixed(1)}M/S`, 270, 120, WHITE);

      const brgDeg = Math.round(gateBearingRad * RAD2DEG);
      if (isFreeFlightNoGates()) {
        drawOsdSmall320('FREE FLY', 270, 164, GREEN_DOT);
      } else {
        const cShort = CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode;
        drawOsdSmall320(`${cShort} ${activeGate + 1}/15`, 265, 164, WHITE);
      }
      drawHomeIcon320(260, 175);
      drawOsdSmall320(`BRG ${brgDeg >= 0 ? '+' : ''}${brgDeg}`, 270, 176, WHITE);

      const mins = String(Math.floor(flightTimeSec / 60)).padStart(2, '0');
      const secs = String(Math.floor(flightTimeSec % 60)).padStart(2, '0');
      drawOsdSmall320(`FLY ${mins}:${secs}`,          265, 188, WHITE);
      drawOsdSmall320(`TD ${totalDistKm.toFixed(2)}K`, 265, 200, WHITE);
      drawHomeIcon320(260, 211);
      drawOsdSmall320(`DST ${Math.min(999, Math.round(gateDist))}M`, 270, 212, WHITE);

      // 8. CENTRO INFERIOR (Modo de Vuelo + Telemetría 4 Motores Quad-X o AoA en Ala)
      const mStr = String(modeLabel);
      drawOsdSmall320(mStr, 160 - ((mStr.length * 5) >> 1), 224, WHITE);

      if (activeRomId === 'fpv_drone' && fpvDroneSim.mRpm) {
        // 4 Barras de RPM reales (M1..M4) del mezclador Betaflight Quad-X + AirMode
        const bx = 114, by = 221;
        for (let m = 0; m < 4; m++) {
          const mx = bx + m * 6;
          const h = Math.max(1, Math.min(8, Math.round(fpvDroneSim.mRpm[m] * 8)));
          for (let py = by; py <= by + 8; py++) {
            setPx320(mx, py, 0x0000);
            setPx320(mx + 3, py, 0x0000);
          }
          for (let py = by + 8 - h; py <= by + 8; py++) {
            const mCol = fpvDroneSim.mRpm[m] > 0.88 ? C565.ORANGE : GREEN_DOT;
            setPx320(mx + 1, py, mCol);
            setPx320(mx + 2, py, mCol);
          }
        }
      } else if (activeRomId === 'fpv_wing') {
        const aoaDeg = Math.round((fpvWingSim.lastAlpha || 0) * RAD2DEG);
        drawOsdSmall320(`AOA ${aoaDeg >= 0 ? '+' : ''}${aoaDeg}`, 104, 224, aeroEnv.stallWarn ? C565.RED : WHITE);
      }
    }

    function cycleCraftFlightMode(craft) {
      if (craft === fpvWingSim) {
        const modes = ['MANU', 'ACRO', 'HOR'];
        const nextIdx = (modes.indexOf(craft.mode) + 1) % modes.length;
        craft.mode = modes[nextIdx];
        showToast(`WING MODE: ${craft.mode}`);
      } else {
        craft.mode = craft.mode === 'ACRO' ? 'HOR' : 'ACRO';
        showToast(`DRONE MODE: ${craft.mode}`);
      }
      playTone(760, 0.04);
    }

    const PLAYABLE_SIM_IDS = ['fpv_wing', 'fpv_drone', 'rc_sailboat', 'rc_boat', 'rc_car', 'rc_crawler'];
    const PLAYABLE_SIM_NAMES = {
      fpv_wing:    'ALA FIJA FPV',
      fpv_drone:   'FPV DRONE 5"',
      rc_sailboat: 'VELERO RC LOS',
      rc_boat:     'LANCHA RC LOS',
      rc_car:      'CARRO RC LOS',
      rc_crawler:  'CRAWLER 4X4'
    };

    function isLosSimId(id) {
      return id === 'rc_sailboat' || id === 'rc_boat' || id === 'rc_car' || id === 'rc_crawler';
    }

    function getActiveSimObject() {
      if (activeRomId === 'fpv_drone')   return fpvDroneSim;
      if (activeRomId === 'rc_sailboat') return rcSailboatSim;
      if (activeRomId === 'rc_boat')     return rcBoatSim;
      if (activeRomId === 'rc_car')      return rcCarSim;
      if (activeRomId === 'rc_crawler')  return rcCrawlerSim;
      return fpvWingSim;
    }

    function cyclePlayableSim(dir = 1) {
      let idx = PLAYABLE_SIM_IDS.indexOf(activeRomId);
      if (idx < 0) idx = 0;
      const nextIdx = ((idx + dir) % PLAYABLE_SIM_IDS.length + PLAYABLE_SIM_IDS.length) % PLAYABLE_SIM_IDS.length;
      const nextId  = PLAYABLE_SIM_IDS[nextIdx];
      launchRom(nextId);
      showToast(`SIM: ${PLAYABLE_SIM_NAMES[nextId]}`);
    }

    // Se ejecuta 1 sola vez por frame (60 Hz) antes de los 4 sub-steps físicos (240 Hz)
    function handleInFlightShortcuts(craft) {
      if (hwInput.justPressed('SELECT')) {
        // SELECT abre directamente el Selector Principal de Simuladores (Launcher)
        rgOverlayOpen = false;
        rgTuningOpen  = false;
        osState = 'launcher';
        setFaceLabels('TEMA', 'CFG', 'BACK', 'RUN', 'UP/DN:ELEGIR SIMULADOR | A:ABRIR | X:CFG');
        showToast('SELECTOR DE SIMULADORES');
        playTone(720, 0.04);
        return true;
      }
      if (hwInput.justPressed('UP')) {
        if (activeRomId === 'fpv_wing' || activeRomId === 'fpv_drone') {
          selectChoroboboCircuit(currentCircuitIdx + 1, craft, true);
        } else {
          fcProfile.losZoom = Math.min(3.50, Math.round(((fcProfile.losZoom || 1.25) + 0.25) * 100) / 100);
          showToast(`ZOOM CAMARA LOS: ${fcProfile.losZoom.toFixed(2)}X`);
          playTone(740, 0.03);
        }
        return true;
      }
      if (hwInput.justPressed('DOWN')) {
        if (activeRomId === 'fpv_wing' || activeRomId === 'fpv_drone') {
          selectChoroboboCircuit(currentCircuitIdx - 1, craft, true);
        } else {
          fcProfile.losZoom = Math.max(0.50, Math.round(((fcProfile.losZoom || 1.25) - 0.25) * 100) / 100);
          showToast(`ZOOM CAMARA LOS: ${fcProfile.losZoom.toFixed(2)}X`);
          playTone(580, 0.03);
        }
        return true;
      }
      // Toque directo en el indicador superior derecho [-ZOOM / +ZOOM] en los 4 simuladores LOS
      if (capTouch.justTapped && isLosSimId(activeRomId) && capTouch.y240 >= 22 && capTouch.y240 <= 46 && capTouch.x320 >= 232) {
        const zStep = capTouch.x320 >= 276 ? 0.25 : -0.25;
        fcProfile.losZoom = Math.max(0.50, Math.min(3.50, Math.round(((fcProfile.losZoom || 1.25) + zStep) * 100) / 100));
        showToast(`ZOOM CAMARA LOS: ${fcProfile.losZoom.toFixed(2)}X`);
        playTone(zStep > 0 ? 740 : 580, 0.03);
        capTouch.justTapped = false;
        return true;
      }
      if (hwInput.justPressed('LEFT')) {
        cyclePlayableSim(-1);
        return true;
      }
      if (hwInput.justPressed('RIGHT')) {
        cyclePlayableSim(1);
        return true;
      }
      if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) {
        if (activeRomId === 'rc_sailboat') {
          rcSailboatSim.presetIdx = (rcSailboatSim.presetIdx + 1) % SAIL_PRESETS.length;
          showToast(`VELERO: ${SAIL_PRESETS[rcSailboatSim.presetIdx].name}`);
          playTone(760, 0.04);
        } else if (activeRomId === 'rc_boat') {
          rcBoatSim.presetIdx = (rcBoatSim.presetIdx + 1) % RC_BOAT_PRESETS.length;
          showToast(`LANCHA: ${RC_BOAT_PRESETS[rcBoatSim.presetIdx].name}`);
          playTone(760, 0.04);
        } else if (activeRomId === 'rc_car') {
          rcCarSim.presetIdx = (rcCarSim.presetIdx + 1) % RC_CAR_PRESETS.length;
          showToast(`CARRO: ${RC_CAR_PRESETS[rcCarSim.presetIdx].name}`);
          playTone(760, 0.04);
        } else if (activeRomId === 'rc_crawler') {
          rcCrawlerSim.presetIdx = (rcCrawlerSim.presetIdx + 1) % RC_CRAWLER_PRESETS.length;
          showToast(`CRAWLER: ${RC_CRAWLER_PRESETS[rcCrawlerSim.presetIdx].name}`);
          playTone(760, 0.04);
        } else {
          cycleCraftFlightMode(craft);
        }
      }
      if (hwInput.justPressed('X')) {
        craft.reset();
        if (activeRomId === 'rc_sailboat') showToast('REGATA REINICIADA!');
        else if (activeRomId === 'rc_boat') showToast('LANCHA EN MUELLE!');
        else if (activeRomId === 'rc_car') showToast('CARRO EN SALIDA!');
        else if (activeRomId === 'rc_crawler') showToast('WINCH / CRAWLER OK!');
        else showToast(craft === fpvWingSim ? 'HAND LAUNCH! Z-84' : 'DRONE RESET');
        return true;
      }
      if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
        if (isLosSimId(activeRomId)) {
          craft.camMode = (craft.camMode + 1) % 3;
          craft.chaseCam = (craft.camMode === 2);
          const camNames = ['VISTA: LOS AUTO-ZOOM', 'VISTA: LOS ZOOM MANUAL', 'VISTA: CHASE 3D'];
          showToast(camNames[craft.camMode]);
        } else {
          craft.chaseCam = !craft.chaseCam;
          fpvDroneSim.chaseCam = craft.chaseCam;
          fpvWingSim.chaseCam  = craft.chaseCam;
          showToast(craft.chaseCam ? 'VISTA: FOLLOW 3D' : 'VISTA: FPV CABINA');
        }
      }
      if (capTouch.justTapped && capTouch.ly64 <= 12) {
        if (capTouch.lx128 < 42) {
          if (activeRomId === 'fpv_wing' || activeRomId === 'fpv_drone') {
            selectChoroboboCircuit(currentCircuitIdx + 1, craft, false);
          } else {
            osState = 'launcher';
            showToast('SELECTOR DE SIMULADORES');
          }
        } else if (capTouch.lx128 < 86) {
          // Tocar el centro superior abre directamente el Menú Unificado en la pestaña [WORLD]
          rgOverlayOpen = true;
          rgTuningOpen = true;
          rgTuningTab = 0;
          playTone(680, 0.04);
        } else {
          cyclePlayableSim(1);
          return true;
        }
        capTouch.justTapped = false;
      }
      return false;
    }

      const p = WING_PRESETS[fcProfile.wingPresetIdx];
