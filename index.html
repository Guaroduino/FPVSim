<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#181a22" />
  <title>RETRO-GO // ESP32-S3 + 2.8" ILI9341V IPS 320x240 RGB565 v10</title>
  <style>
    :root {
      --case-main: #222530;
      --case-dark: #15171e;
      --bezel-black: #08090c;
      --rg-red: #e53935;
      --rg-gold: #ffb300;
      --rg-cyan: #00e5ff;
      --rg-green: #00e676;
      --btn-a: #d32f2f;
      --btn-b: #f57c00;
      --btn-x: #1976d2;
      --btn-y: #388e3c;
      --text: #eceff4;
      --muted: #9aa5b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: var(--case-dark);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      touch-action: none;
    }

    /* Fullscreen Edge-to-Edge Console Shell on Mobile */
    .retrogo-shell {
      width: 100%;
      height: 100%;
      container-type: size;
      background: linear-gradient(180deg, #2b2f3d 0%, #1e212b 55%, #15171f 100%);
      padding: env(safe-area-inset-top, 6px) 2.2vw env(safe-area-inset-bottom, 8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8dvh;
    }

    /* Only constrain width on large desktop PC monitors with mouse */
    @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090a0e;
      }
      .retrogo-shell {
        max-width: 460px;
        max-height: 920px;
        padding: 10px 12px;
        border: 3px solid #3c4254;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* 1. Top Status Bar */
    .shell-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7dvh 2vw;
      background: #14161d;
      border: 1px solid #313646;
      border-radius: 8px;
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      flex-shrink: 0;
    }

    .led-cluster {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .led {
      width: clamp(7px, 1.8cqw, 12px);
      height: clamp(7px, 1.8cqw, 12px);
      border-radius: 50%;
      background: var(--rg-green);
      box-shadow: 0 0 6px var(--rg-green);
    }

    .led.sd-act {
      background: var(--rg-gold);
      box-shadow: 0 0 6px var(--rg-gold);
      opacity: 0.3;
      transition: opacity 0.08s;
    }

    .led.sd-act.blink {
      opacity: 1;
    }

    .top-hw-pills {
      display: flex;
      gap: 1.2cqw;
    }

    .pill-btn {
      background: #232734;
      color: var(--text);
      border: 1.5px solid #404659;
      border-radius: 6px;
      padding: 0.5dvh 2cqw;
      font-family: inherit;
      font-size: clamp(0.64rem, 2.2cqw, 1rem);
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      border-color: var(--rg-gold);
      color: var(--rg-gold);
    }

    /* 2. Retro-Go Screen Lens (128x64 Native 1-Bit OLED) */
    .screen-lens {
      background: var(--bezel-black);
      border: 3px solid #141720;
      border-radius: 12px 12px 20px 12px;
      padding: 0.7dvh 2cqw 0.8dvh;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 1),
        0 2px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.4dvh;
      flex-shrink: 0;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.6rem, 2.1cqw, 0.95rem);
      color: #828c9e;
      letter-spacing: 0.6px;
    }

    .rg-stripe {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .rg-stripe i {
      width: clamp(9px, 2.2cqw, 15px);
      height: clamp(3px, 0.8cqw, 5px);
      display: inline-block;
      border-radius: 1px;
    }

    .oled-container {
      width: min(100%, 42cqh);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #040609;
      border: 2px solid #2b3344;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: pointer;
    }

    #oledCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .oled-container.pixel-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 50%, transparent 50%);
      background-size: 100% 2px;
      pointer-events: none;
    }

    .lens-branding {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1px;
    }

    .rg-logo-text {
      font-size: clamp(0.75rem, 2.8cqw, 1.25rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      color: #d8dee9;
    }

    .rg-logo-text span {
      color: var(--rg-red);
    }

    .rg-sub-status {
      font-size: clamp(0.58rem, 2cqw, 0.92rem);
      color: var(--rg-gold);
    }

    /* 3. UPPER CONTROLS: DUAL ANALOG JOYSTICKS (WITH L3 / R3 INTEGRATED) */
    .upper-joysticks-section {
      flex: 1.08;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      align-items: center;
      justify-items: center;
      padding: 0.4dvh 1cqw;
    }

    .stick-unit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7dvh;
      position: relative;
    }

    .stick-top-row {
      width: 94%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1cqw;
    }

    .stick-adc-label {
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .btn-stick-click {
      background: #1b1f2a;
      border: 2px solid #48526a;
      color: var(--rg-cyan);
      border-radius: 8px;
      padding: 0.6dvh 2.6cqw;
      font-family: inherit;
      font-size: clamp(0.68rem, 2.5cqw, 1.1rem);
      font-weight: 800;
      box-shadow: 0 3px 0 #0c0e13;
    }

    .btn-stick-click.pressed {
      transform: translateY(2px);
      background: var(--rg-cyan);
      color: #000;
    }

    .stick-canvas {
      width: min(44cqw, 26.5cqh);
      height: min(44cqw, 26.5cqh);
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at center, #1a1f2b 0%, #0b0d13 100%);
      border: 3px solid #3f485e;
      border-radius: 50%;
      touch-action: none;
      display: block;
      box-shadow: inset 0 6px 20px rgba(0, 0, 0, 0.95), 0 3px 8px rgba(255, 255, 255, 0.07);
    }

    .stick-canvas.engaged {
      border-color: var(--rg-gold);
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.95), 0 0 16px rgba(255, 179, 0, 0.45);
    }

    /* 4. LOWER CONTROLS: [D-PAD LEFT] — [SELECT / MENU CENTER] — [4 DIAMOND BUTTONS RIGHT] */
    .lower-controls-deck {
      flex: 1.05;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 1.5cqw;
      padding: 0.8dvh 1.5cqw 1dvh;
      background: rgba(12, 14, 20, 0.42);
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .hw-btn {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.04s;
    }

    .hw-btn.pressed {
      transform: translateY(2px);
      filter: brightness(1.3);
    }

    /* Classic Cross D-Pad (Left Side) - Scaled to fill left zone */
    .dpad-cross {
      width: min(37cqw, 25cqh);
      height: min(37cqw, 25cqh);
      position: relative;
    }

    .dpad-arm {
      position: absolute;
      background: linear-gradient(180deg, #323848 0%, #1d202b 100%);
      border: 2.5px solid #4a5268;
      color: #d0d8e8;
      font-size: clamp(1rem, 4.2cqw, 1.9rem);
      box-shadow: 0 4px 0 #090b10, 0 6px 12px rgba(0,0,0,0.55);
    }

    .dpad-arm.pressed {
      background: #41495f;
      color: var(--rg-gold);
      border-color: var(--rg-gold);
    }

    .dpad-up {
      top: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 18% 18% 0 0;
      border-bottom: none;
    }
    .dpad-down {
      bottom: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 0 0 18% 18%;
      border-top: none;
    }
    .dpad-left {
      top: 33%; left: 0; width: 36%; height: 34%;
      border-radius: 18% 0 0 18%;
      border-right: none;
    }
    .dpad-right {
      top: 33%; right: 0; width: 36%; height: 34%;
      border-radius: 0 18% 18% 0;
      border-left: none;
    }
    .dpad-center {
      position: absolute;
      top: 33%; left: 33%; width: 34%; height: 34%;
      background: #242834;
      pointer-events: none;
    }
    .dpad-center::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, #141720 20%, #292e3d 100%);
    }

    /* Center 2 System Buttons (SELECT + START/MENU) */
    .center-sys-cluster {
      display: flex;
      flex-direction: column;
      gap: 2.2cqh;
      align-items: center;
      justify-content: center;
      padding: 0 0.5cqw;
    }

    .btn-sys-pill {
      width: clamp(74px, 19.5cqw, 140px);
      height: clamp(36px, 5.4cqh, 62px);
      background: #1a1e28;
      border: 2.5px solid #4e566e;
      border-radius: 999px;
      color: #dce3ef;
      font-size: clamp(0.72rem, 2.5cqw, 1.18rem);
      letter-spacing: 0.6px;
      box-shadow: 0 4px 0 #0a0c10, 0 5px 10px rgba(0,0,0,0.45);
    }

    .btn-sys-pill.menu-pill {
      border-color: var(--rg-red);
      color: var(--rg-gold);
    }

    /* 4 Action Buttons in Classic Diamond (X Top, Y Left, A Right, B Bottom) - Scaled to fill right zone */
    .diamond-cluster {
      width: min(38cqw, 25.5cqh);
      height: min(38cqw, 25.5cqh);
      position: relative;
    }

    .btn-diamond {
      position: absolute;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3d4356, #1d202b);
      border: 3px solid #525a72;
      color: #fff;
      font-size: clamp(0.95rem, 3.8cqw, 1.75rem);
      line-height: 1;
      box-shadow: 0 5px 0 #090b10, 0 6px 12px rgba(0,0,0,0.6);
    }

    .btn-diamond small {
      font-size: clamp(0.54rem, 1.95cqw, 0.9rem);
      color: #d4dce8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Posiciones del Diamante en porcentaje: X arriba, Y izquierda, A derecha, B abajo */
    .btn-diamond.pos-top {
      top: 0; left: 32%;
      border-color: var(--btn-x);
    }
    .btn-diamond.pos-left {
      top: 32%; left: 0;
      border-color: var(--btn-y);
    }
    .btn-diamond.pos-right {
      top: 32%; right: 0;
      border-color: var(--btn-a);
    }
    .btn-diamond.pos-bottom {
      bottom: 0; left: 32%;
      border-color: var(--btn-b);
    }
  </style>
</head>
<body>
  <div class="retrogo-shell">
    <!-- 1. Top Hardware Bar -->
    <header class="shell-top-bar">
      <div class="led-cluster">
        <span class="led" title="Power ON"></span>
        <span>PWR</span>
        <span id="sdLed" class="led sd-act" title="Flash / SD Activity"></span>
        <span>SPI</span>
        <span style="color:#828c9e;margin-left:3px;">S3 N16R8 + ILI9341V (v10)</span>
      </div>
      <div class="top-hw-pills">
        <button id="btnPalette" class="pill-btn">🎨 IPS 60MHz</button>
        <button id="btnAudio" class="pill-btn">🔇 SND</button>
        <button id="btnGrid" class="pill-btn active">SCAN</button>
        <button id="btnFull" class="pill-btn">⛶</button>
      </div>
    </header>

    <!-- 2. Retro-Go 2.8" 320x240 IPS RGB565 ILI9341V + Capacitive Touch Screen Lens -->
    <section class="screen-lens">
      <div class="lens-header">
        <div class="rg-stripe">
          <i style="background:#e53935"></i>
          <i style="background:#ffb300"></i>
          <i style="background:#00e676"></i>
          <i style="background:#00e5ff"></i>
          <span style="margin-left:4px;">2.8" IPS 320×240 RGB565 (ILI9341V + TOUCH)</span>
        </div>
        <span id="uiFpsBattery">60FPS | DMA 60MHz</span>
      </div>

      <div id="oledContainer" class="oled-container pixel-grid">
        <canvas id="oledCanvas" width="320" height="240"></canvas>
      </div>

      <div class="lens-branding">
        <div class="rg-logo-text">RETRO<span>-GO</span> <small style="font-size:0.55em;color:#8b9bb4;font-style:normal;">ILI9341V + FT6336</small></div>
        <div id="uiHintBar" class="rg-sub-status">TOUCH/DPAD/STICK:NAV | A:RUN | MENU:OSD</div>
      </div>
    </section>

    <!-- 3. Upper Controls: 2 Analog Joysticks with L3 / R3 Click -->
    <section class="upper-joysticks-section">
      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutLeft" class="stick-adc-label">L:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="L3">L3 CLICK</button>
        </div>
        <canvas id="stickLeft" class="stick-canvas" width="200" height="200"></canvas>
      </div>

      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutRight" class="stick-adc-label">R:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="R3">R3 CLICK</button>
        </div>
        <canvas id="stickRight" class="stick-canvas" width="200" height="200"></canvas>
      </div>
    </section>

    <!-- 4. Lower Controls: [Cruceta D-Pad Izquierda] + [2 Botones Centro] + [4 Botones Diamante Derecha] -->
    <section class="lower-controls-deck">
      <!-- Left: Cross D-Pad -->
      <div class="dpad-cross">
        <button class="hw-btn dpad-arm dpad-up" data-btn="UP">▲</button>
        <button class="hw-btn dpad-arm dpad-down" data-btn="DOWN">▼</button>
        <button class="hw-btn dpad-arm dpad-left" data-btn="LEFT">◀</button>
        <button class="hw-btn dpad-arm dpad-right" data-btn="RIGHT">▶</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Center: 2 System Buttons (SELECT & MENU/START) -->
      <div class="center-sys-cluster">
        <button class="hw-btn btn-sys-pill" data-btn="SELECT">SELECT</button>
        <button class="hw-btn btn-sys-pill menu-pill" data-btn="MENU">★ MENU</button>
      </div>

      <!-- Right: 4 Action Buttons in Diamond Layout (X Top, Y Left, A Right, B Bottom) -->
      <div class="diamond-cluster">
        <button class="hw-btn btn-diamond pos-top" data-btn="X">
          <span>X</span>
          <small id="lblX">RST</small>
        </button>
        <button class="hw-btn btn-diamond pos-left" data-btn="Y">
          <span>Y</span>
          <small id="lblY">MOD</small>
        </button>
        <button class="hw-btn btn-diamond pos-right" data-btn="A">
          <span>A</span>
          <small id="lblA">GAS</small>
        </button>
        <button class="hw-btn btn-diamond pos-bottom" data-btn="B">
          <span>B</span>
          <small id="lblB">BRK</small>
        </button>
      </div>
    </section>
  </div>

  <script>
    /***************************************************************************
     * 1. HARDWARE ABSTRACTION LAYER (HAL) — 2.8" ILI9341V IPS 320x240 RGB565
     *    - Framebuffer real de 16 bits RGB565: 320 x 240 x 2 = 153,600 Bytes (150 KB)
     *    - Compatible con doble buffer DMA en SRAM del ESP32-S3 (LovyanGFX / esp_lcd)
     *    - Rasterizador Bresenham en resolución nativa 320x240 blindado contra bloqueos
     ***************************************************************************/
    const DISP_W = 320;
    const DISP_H = 240;
    const VRAM_PIXELS = DISP_W * DISP_H; // 76,800 píxeles
    const VRAM_BYTES  = VRAM_PIXELS * 2; // 153,600 bytes (150 KB RGB565)
    const vram565 = new Uint16Array(VRAM_PIXELS);

    // Coordenadas lógicas base (128x64 -> escaladas en hardware a 320x240 = x2.5, x3.75)
    const SCREEN_W = 128;
    const SCREEN_H = 64;
    const SCALE_X = DISP_W / SCREEN_W; // 2.5
    const SCALE_Y = DISP_H / SCREEN_H; // 3.75

    const oledCanvas = document.getElementById('oledCanvas');
    const oledCtx = oledCanvas.getContext('2d', { alpha: false });
    const oledImgData = oledCtx.createImageData(DISP_W, DISP_H);
    const rgbaPixels = oledImgData.data;

    function rgb565(r, g, b) {
      return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | ((b & 0xF8) >> 3);
    }

    // Tabla LUT precalculada para convertir RGB565 -> RGBA8888 en <0.3ms
    const LUT_R = new Uint8Array(65536);
    const LUT_G = new Uint8Array(65536);
    const LUT_B = new Uint8Array(65536);
    for (let c = 0; c < 65536; c++) {
      const r5 = (c >> 11) & 0x1F;
      const g6 = (c >> 5)  & 0x3F;
      const b5 =  c        & 0x1F;
      LUT_R[c] = (r5 << 3) | (r5 >> 2);
      LUT_G[c] = (g6 << 2) | (g6 >> 4);
      LUT_B[c] = (b5 << 3) | (b5 >> 2);
    }

    // Paleta de índices rápidos RGB565 (además de aceptar cualquier color 16-bit directo)
    const C565 = {
      BG:      rgb565(8, 12, 22),     // 0: Fondo oscuro IPS
      WHITE:   rgb565(240, 250, 255), // 1: Blanco brillante
      GOLD:    rgb565(255, 190, 0),   // 2: Retro-Go Gold / Ámbar
      GREEN:   rgb565(0, 235, 118),   // 3: Verde Neón
      RED:     rgb565(245, 55, 65),   // 4: Rojo Carmesí
      CYAN:    rgb565(0, 229, 255),   // 5: Cian HUD
      GREY:    rgb565(90, 102, 125),  // 6: Gris Asfalto / UI
      DARKGRN: rgb565(18, 85, 48),    // 7: Verde Terreno
      NAVY:    rgb565(20, 34, 68),    // 8: Azul Retro-Go Header
      ORANGE:  rgb565(255, 120, 20),  // 9: Naranja Rally / Fuego
      MAGENTA: rgb565(245, 60, 210),  // 10: Magenta Gate Activo
      SKYTOP:  rgb565(12, 24, 58),    // 11: Cielo Superior
      SKYBOT:  rgb565(38, 78, 138),   // 12: Horizonte Cielo
      GNDTOP:  rgb565(18, 46, 30),    // 13: Suelo Horizonte
      GNDBOT:  rgb565(10, 24, 18)     // 14: Suelo Cercano
    };

    const INDEX_PALETTE = [
      C565.BG, C565.WHITE, C565.GOLD, C565.GREEN,
      C565.RED, C565.CYAN, C565.GREY, C565.DARKGRN,
      C565.NAVY, C565.ORANGE, C565.MAGENTA, C565.SKYTOP,
      C565.SKYBOT, C565.GNDTOP, C565.GNDBOT
    ];

    // Modos de bus SPI en el ESP32-S3 + ILI9341V
    const SPI_MODES = [
      { name: 'IPS 60MHz DMA', spiMhz: 60, mono: false, targetFps: 60 },
      { name: 'IPS 80MHz QIO', spiMhz: 80, mono: false, targetFps: 60 },
      { name: 'IPS 40MHz SPI', spiMhz: 40, mono: false, targetFps: 45 },
      { name: '1-BIT MONO SIM',spiMhz: 40, mono: true,  targetFps: 60 }
    ];
    let paletteIdx = 0;

    function resolveColor565(color) {
      if (SPI_MODES[paletteIdx].mono) {
        return color === 0 ? rgb565(6, 10, 14) : rgb565(0, 235, 130);
      }
      if (color >= 0 && color < INDEX_PALETTE.length) return INDEX_PALETTE[color];
      return color & 0xFFFF;
    }

    function blinkSdLed() {
      const el = document.getElementById('sdLed');
      el.classList.add('blink');
      setTimeout(() => el.classList.remove('blink'), 120);
    }

    function fbClear(bgColor = 0) {
      vram565.fill(resolveColor565(bgColor));
    }

    // Relleno rápido de cielo y tierra en 320x240 para juegos 3D
    function fbFillHorizon320(horizonY240, skyTop, skyBot, gndTop, gndBot) {
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }
      const hy = Math.max(0, Math.min(DISP_H, horizonY240 | 0));
      for (let y = 0; y < DISP_H; y++) {
        const c = y < hy
          ? (y < (hy >> 1) ? skyTop : skyBot)
          : (y < hy + ((DISP_H - hy) >> 1) ? gndTop : gndBot);
        vram565.fill(c, y * DISP_W, (y + 1) * DISP_W);
      }
    }

    // Relleno de trapecio horizontal (para asfalto y pianos en WRC Rally a 320x240)
    function fbFillQuadScanline(x0Top, x1Top, yTop, x0Bot, x1Bot, yBot, color565) {
      if (SPI_MODES[paletteIdx].mono) return;
      const c = resolveColor565(color565);
      let ya = Math.round(yTop * SCALE_Y);
      let yb = Math.round(yBot * SCALE_Y);
      let xa0 = x0Top * SCALE_X, xa1 = x1Top * SCALE_X;
      let xb0 = x0Bot * SCALE_X, xb1 = x1Bot * SCALE_X;
      if (ya > yb) {
        [ya, yb] = [yb, ya];
        [xa0, xb0] = [xb0, xa0];
        [xa1, xb1] = [xb1, xa1];
      }
      const span = Math.max(1, yb - ya);
      const yStart = Math.max(0, ya), yEnd = Math.min(DISP_H - 1, yb);
      for (let y = yStart; y <= yEnd; y++) {
        const t = (y - ya) / span;
        const lx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa0 + (xb0 - xa0) * t)));
        const rx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa1 + (xb1 - xa1) * t)));
        if (rx >= lx) vram565.fill(c, y * DISP_W + lx, y * DISP_W + rx + 1);
      }
    }

    function fbSetPixel320(px, py, c565) {
      const ix = px | 0, iy = py | 0;
      if (ix < 0 || ix >= DISP_W || iy < 0 || iy >= DISP_H) return;
      vram565[iy * DISP_W + ix] = c565;
    }

    function fbSetPixel(x, y, color = 1) {
      const c = resolveColor565(color);
      const px = Math.round(x * SCALE_X);
      const py = Math.round(y * SCALE_Y);
      fbSetPixel320(px, py, c);
      fbSetPixel320(px + 1, py, c);
      fbSetPixel320(px, py + 1, c);
      fbSetPixel320(px + 1, py + 1, c);
    }

    function fbRect(x, y, w, h, fill = false, color = 1) {
      const c = resolveColor565(color);
      const x0 = Math.max(0, Math.round(x * SCALE_X));
      const y0 = Math.max(0, Math.round(y * SCALE_Y));
      const x1 = Math.min(DISP_W - 1, Math.round((x + w) * SCALE_X) - 1);
      const y1 = Math.min(DISP_H - 1, Math.round((y + h) * SCALE_Y) - 1);
      if (x1 < x0 || y1 < y0) return;

      if (fill) {
        for (let py = y0; py <= y1; py++) {
          vram565.fill(c, py * DISP_W + x0, py * DISP_W + x1 + 1);
        }
      } else {
        for (let px = x0; px <= x1; px++) {
          fbSetPixel320(px, y0, c); fbSetPixel320(px, y0 + 1, c);
          fbSetPixel320(px, y1, c); fbSetPixel320(px, y1 - 1, c);
        }
        for (let py = y0; py <= y1; py++) {
          fbSetPixel320(x0, py, c); fbSetPixel320(x0 + 1, py, c);
          fbSetPixel320(x1, py, c); fbSetPixel320(x1 - 1, py, c);
        }
      }
    }

    function fbCircle(cx, cy, r, color = 1) {
      if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
      const c = resolveColor565(color);
      const x0 = Math.round(cx * SCALE_X), y0 = Math.round(cy * SCALE_Y);
      let x = Math.min(280, Math.max(1, Math.round(r * ((SCALE_X + SCALE_Y) * 0.5)))), y = 0, err = 0;
      let guard = 0;
      while (x >= y && ++guard < 400) {
        const pts = [
          [x0 + x, y0 + y], [x0 + y, y0 + x], [x0 - y, y0 + x], [x0 - x, y0 + y],
          [x0 - x, y0 - y], [x0 - y, y0 - x], [x0 + y, y0 - x], [x0 + x, y0 - y]
        ];
        for (let i = 0; i < 8; i++) {
          fbSetPixel320(pts[i][0], pts[i][1], c);
          fbSetPixel320(pts[i][0] + 1, pts[i][1], c);
        }
        y += 1;
        if (err <= 0) err += 2 * y + 1;
        if (err > 0) { x -= 1; err -= 2 * x + 1; }
      }
    }

    const CLIP_LEFT = 1, CLIP_RIGHT = 2, CLIP_BOTTOM = 4, CLIP_TOP = 8;
    function computeOutCode320(x, y) {
      let c = 0;
      if (x < 0) c |= CLIP_LEFT; else if (x >= DISP_W) c |= CLIP_RIGHT;
      if (y < 0) c |= CLIP_TOP;  else if (y >= DISP_H) c |= CLIP_BOTTOM;
      return c;
    }

    // Bresenham en resolución nativa 320x240 con clipping Cohen-Sutherland blindado
    function fbDrawLine(lx0, ly0, lx1, ly1, dashedMask = 0, color = 1) {
      if (!Number.isFinite(lx0) || !Number.isFinite(ly0) || !Number.isFinite(lx1) || !Number.isFinite(ly1)) return;
      let x0 = lx0 * SCALE_X, y0 = ly0 * SCALE_Y;
      let x1 = lx1 * SCALE_X, y1 = ly1 * SCALE_Y;
      const c = resolveColor565(color);

      let out0 = computeOutCode320(x0, y0), out1 = computeOutCode320(x1, y1), accept = false;
      let clipIter = 0;

      while (++clipIter <= 12) {
        if (!(out0 | out1)) { accept = true; break; }
        else if (out0 & out1) break;
        else {
          let x = 0, y = 0;
          const out = out0 ? out0 : out1;
          const dx = x1 - x0, dy = y1 - y0;

          if (out & CLIP_BOTTOM) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (DISP_H - 1 - y0) / dy : x0;
            y = DISP_H - 1;
          } else if (out & CLIP_TOP) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (0 - y0) / dy : x0;
            y = 0;
          } else if (out & CLIP_RIGHT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (DISP_W - 1 - x0) / dx : y0;
            x = DISP_W - 1;
          } else if (out & CLIP_LEFT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (0 - x0) / dx : y0;
            x = 0;
          }

          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          if (out === out0) { x0 = x; y0 = y; out0 = computeOutCode320(x0, y0); }
          else { x1 = x; y1 = y; out1 = computeOutCode320(x1, y1); }
        }
      }

      if (!accept) return;

      let ix0 = Math.max(0, Math.min(DISP_W - 1, Math.round(x0)));
      let iy0 = Math.max(0, Math.min(DISP_H - 1, Math.round(y0)));
      const ix1 = Math.max(0, Math.min(DISP_W - 1, Math.round(x1)));
      const iy1 = Math.max(0, Math.min(DISP_H - 1, Math.round(y1)));

      const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
      const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
      let err = dx + dy, step = 0;

      while (step < 640) {
        if (!dashedMask || ((step >> 1) & dashedMask) === 0) {
          fbSetPixel320(ix0, iy0, c);
          if (ix0 + 1 < DISP_W) fbSetPixel320(ix0 + 1, iy0, c);
        }
        if (ix0 === ix1 && iy0 === iy1) break;
        const e2 = err << 1;
        if (e2 >= dy) { err += dy; ix0 += sx; }
        if (e2 <= dx) { err += dx; iy0 += sy; }
        step++;
      }
    }

    const FONT_3X5 = {
      '0': [7,5,5,5,7], '1': [2,6,2,2,7], '2': [7,1,7,4,7], '3': [7,1,7,1,7],
      '4': [5,5,7,1,1], '5': [7,4,7,1,7], '6': [7,4,7,5,7], '7': [7,1,1,2,2],
      '8': [7,5,7,5,7], '9': [7,5,7,1,7],
      'A': [2,5,7,5,5], 'B': [6,5,6,5,6], 'C': [7,4,4,4,7], 'D': [6,5,5,5,6],
      'E': [7,4,6,4,7], 'F': [7,4,6,4,4], 'G': [7,4,5,5,7], 'H': [5,5,7,5,5],
      'I': [7,2,2,2,7], 'J': [1,1,1,5,7], 'K': [5,5,6,5,5], 'L': [4,4,4,4,7],
      'M': [5,7,7,5,5], 'N': [5,7,7,7,5], 'O': [7,5,5,5,7], 'P': [7,5,7,4,4],
      'Q': [7,5,5,7,3], 'R': [6,5,6,5,5], 'S': [7,4,7,1,7], 'T': [7,2,2,2,2],
      'U': [5,5,5,5,7], 'V': [5,5,5,5,2], 'W': [5,5,7,7,5], 'X': [5,5,2,5,5],
      'Y': [5,5,2,2,2], 'Z': [7,1,2,4,7],
      ':': [0,2,0,2,0], '-': [0,0,7,0,0], '/': [1,1,2,4,4], '.': [0,0,0,0,2],
      '+': [0,2,7,2,0], '>': [4,2,1,2,4], '<': [1,2,4,2,1], '%': [5,1,2,4,5],
      '[': [7,4,4,4,7], ']': [7,1,1,1,7], '*': [5,2,7,2,5], '(': [2,4,4,4,2],
      ')': [2,1,1,1,2], '|': [2,2,2,2,2], ',': [0,0,0,2,4], '=': [0,7,0,7,0]
    };

    function fbDrawText(str, x, y, color = 1) {
      const s = String(str).toUpperCase();
      const c = resolveColor565(color);
      let cx = Math.round(x * SCALE_X);
      const cy = Math.round(y * SCALE_Y);
      for (let i = 0; i < s.length; i++) {
        const g = FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const b = g[r];
            for (let col = 0; col < 3; col++) {
              if (b & (4 >> col)) {
                const px = cx + col * 2;
                const py = cy + r * 3;
                for (let dy = 0; dy < 3; dy++) {
                  fbSetPixel320(px, py + dy, c);
                  fbSetPixel320(px + 1, py + dy, c);
                }
              }
            }
          }
        }
        cx += 10;
      }
    }

    function fbPresentToCanvas() {
      let pIdx = 0;
      for (let i = 0; i < VRAM_PIXELS; i++) {
        const c = vram565[i];
        rgbaPixels[pIdx]     = LUT_R[c];
        rgbaPixels[pIdx + 1] = LUT_G[c];
        rgbaPixels[pIdx + 2] = LUT_B[c];
        rgbaPixels[pIdx + 3] = 255;
        pIdx += 4;
      }
      oledCtx.putImageData(oledImgData, 0, 0);
    }

    /***************************************************************************
     * 2. AUDIO SINTETIZADO RETRO-GO
     ***************************************************************************/
    let audioCtx = null;
    let soundEnabled = false;

    function playTone(freq = 600, dur = 0.05, type = 'square', vol = 0.04) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur + 0.01);
      } catch (_) {}
    }

    /***************************************************************************
     * 3. ENTRADAS HARDWARE:
     *    - ARRIBA: 2 Joysticks Analógicos (con L3/R3 Click y doble toque)
     *    - ABAJO IZQ: Cruceta D-Pad (UP, DOWN, LEFT, RIGHT)
     *    - ABAJO CENTRO: SELECT y ★ MENU
     *    - ABAJO DER: 4 Botones en Diamante (X, Y, A, B)
     ***************************************************************************/
    const stickLeftCanvas = document.getElementById('stickLeft');
    const stickRightCanvas = document.getElementById('stickRight');
    const ctxLeft = stickLeftCanvas.getContext('2d');
    const ctxRight = stickRightCanvas.getContext('2d');

    const hwInput = {
      lx: 0.0, ly: 0.0,
      rx: 0.0, ry: 0.0,
      leftActive: false,
      rightActive: false,
      btn: {
        A: false, B: false, X: false, Y: false,
        L3: false, R3: false,
        SELECT: false, MENU: false,
        UP: false, DOWN: false, LEFT: false, RIGHT: false
      },
      prevBtn: {},
      justPressed(k) { return !!this.btn[k] && !this.prevBtn[k]; }
    };

    const touchTrack = { leftId: null, rightId: null, lastTapLeft: 0, lastTapRight: 0 };

    function computeStickXY(canvasEl, clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const maxR = Math.max(22, rect.width * 0.40);
      const dx = clientX - cx, dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const scale = dist > maxR ? (maxR / dist) : 1.0;
      return { x: (dx * scale) / maxR, y: (-dy * scale) / maxR };
    }

    // Eventos Touch dedicados directamente a los 2 Canvases de los Joysticks Superiores
    function attachStickCanvasEvents(canvasEl, side) {
      let activeId = null;

      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        const now = performance.now();
        if (side === 'left') {
          if (now - touchTrack.lastTapLeft < 260) hwInput.btn.L3 = true;
          touchTrack.lastTapLeft = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true;
        } else {
          if (now - touchTrack.lastTapRight < 260) hwInput.btn.R3 = true;
          touchTrack.lastTapRight = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true;
        }
      }, { passive: false });

      canvasEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === activeId) {
            const v = computeStickXY(canvasEl, t.clientX, t.clientY);
            if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
            else { hwInput.rx = v.x; hwInput.ry = v.y; }
            break;
          }
        }
      }, { passive: false });

      const endStick = (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeId) {
            activeId = null;
            if (side === 'left') {
              hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false;
              if (!btnTouchCounts.L3) hwInput.btn.L3 = false;
            } else {
              hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false;
              if (!btnTouchCounts.R3) hwInput.btn.R3 = false;
            }
            break;
          }
        }
      };

      canvasEl.addEventListener('touchend', endStick, { passive: false });
      canvasEl.addEventListener('touchcancel', endStick, { passive: false });

      // Soporte Mouse en PC
      let mouseDown = false;
      canvasEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        mouseDown = true;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true; }
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; }
      });
      window.addEventListener('mouseup', () => {
        if (!mouseDown) return;
        mouseDown = false;
        if (side === 'left') { hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false; }
        else { hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false; }
      });
    }

    attachStickCanvasEvents(stickLeftCanvas, 'left');
    attachStickCanvasEvents(stickRightCanvas, 'right');

    // Botones físicos (D-Pad UP/DOWN/LEFT/RIGHT, SELECT, MENU, Y, X, B, A, L3, R3)
    const btnTouchCounts = {};
    document.querySelectorAll('.hw-btn').forEach((btnEl) => {
      const key = btnEl.getAttribute('data-btn');
      btnTouchCounts[key] = 0;
      const press = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 1;
        hwInput.btn[key] = true;
        btnEl.classList.add('pressed');
        playTone(540, 0.02, 'square', 0.02);
      };
      const release = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 0;
        hwInput.btn[key] = false;
        btnEl.classList.remove('pressed');
      };
      btnEl.addEventListener('touchstart', press, { passive: false });
      btnEl.addEventListener('touchend', release, { passive: false });
      btnEl.addEventListener('touchcancel', release, { passive: false });
      btnEl.addEventListener('mousedown', press);
      btnEl.addEventListener('mouseup', release);
      btnEl.addEventListener('mouseleave', release);
    });

    const keyMap = {
      KeyZ: 'A', Space: 'A', Enter: 'A',
      KeyX: 'B', Backspace: 'B',
      KeyC: 'X', KeyR: 'X',
      KeyV: 'Y', KeyM: 'Y',
      KeyQ: 'L3', KeyE: 'R3',
      Tab: 'SELECT', Escape: 'MENU'
    };
    const rawKeys = {};
    window.addEventListener('keydown', (e) => {
      rawKeys[e.code] = true;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = true;
    });
    window.addEventListener('keyup', (e) => {
      rawKeys[e.code] = false;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = false;
    });

    function drawThumbstickWell(ctxG, canvasEl, x, y, active, clicked, label) {
      const w = canvasEl.width, h = canvasEl.height;
      const cx = w * 0.5, cy = h * 0.5, maxR = w * 0.36;
      const capR = w * 0.21;
      ctxG.clearRect(0, 0, w, h);

      ctxG.strokeStyle = active ? 'rgba(255, 179, 0, 0.5)' : 'rgba(154, 165, 180, 0.22)';
      ctxG.lineWidth = 2;
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR, 0, Math.PI * 2); ctxG.stroke();
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR * 0.52, 0, Math.PI * 2); ctxG.stroke();

      ctxG.beginPath();
      ctxG.moveTo(cx - maxR, cy); ctxG.lineTo(cx + maxR, cy);
      ctxG.moveTo(cx, cy - maxR); ctxG.lineTo(cx, cy + maxR);
      ctxG.stroke();

      const kx = cx + x * maxR;
      const ky = cy - y * maxR;

      ctxG.strokeStyle = '#5c6375';
      ctxG.lineWidth = 10;
      ctxG.lineCap = 'round';
      ctxG.beginPath(); ctxG.moveTo(cx, cy); ctxG.lineTo(kx, ky); ctxG.stroke();

      ctxG.fillStyle = clicked ? '#e53935' : (active ? '#3e4454' : '#2b303c');
      ctxG.beginPath(); ctxG.arc(kx, ky, capR, 0, Math.PI * 2); ctxG.fill();
      ctxG.lineWidth = 3;
      ctxG.strokeStyle = clicked ? '#ffb300' : (active ? '#00e5ff' : '#586178');
      ctxG.stroke();

      ctxG.beginPath(); ctxG.arc(kx, ky, capR * 0.62, 0, Math.PI * 2);
      ctxG.lineWidth = 2;
      ctxG.strokeStyle = 'rgba(255,255,255,0.22)';
      ctxG.stroke();

      ctxG.fillStyle = '#aeb9c9';
      ctxG.font = 'bold 12px monospace';
      ctxG.textAlign = 'center';
      ctxG.fillText(label, cx, 20);
      canvasEl.classList.toggle('engaged', active || clicked);
    }

    function updateInputPolling() {
      // Si no se toca el stick izquierdo, la cruceta D-Pad o WASD también pueden mover el eje izquierdo
      if (!hwInput.leftActive) {
        const dpadX = (hwInput.btn.RIGHT || rawKeys['KeyD'] ? 0.85 : 0) - (hwInput.btn.LEFT || rawKeys['KeyA'] ? 0.85 : 0);
        const dpadY = (hwInput.btn.UP    || rawKeys['KeyW'] ? 0.85 : 0) - (hwInput.btn.DOWN || rawKeys['KeyS'] ? 0.85 : 0);
        hwInput.lx = dpadX;
        hwInput.ly = dpadY;
      }
      if (!hwInput.rightActive) {
        hwInput.rx = (rawKeys['ArrowRight'] ? 0.8 : 0) - (rawKeys['ArrowLeft'] ? 0.8 : 0);
        hwInput.ry = (rawKeys['ArrowUp'] ? 0.8 : 0)    - (rawKeys['ArrowDown'] ? 0.8 : 0);
      }

      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (gp && gp.connected) {
          if (Math.abs(gp.axes[0]) > 0.08) hwInput.lx = gp.axes[0];
          if (Math.abs(gp.axes[1]) > 0.08) hwInput.ly = -gp.axes[1];
          if (Math.abs(gp.axes[2]) > 0.08) hwInput.rx = gp.axes[2];
          if (Math.abs(gp.axes[3]) > 0.08) hwInput.ry = -gp.axes[3];
          if (gp.buttons[0]?.pressed) hwInput.btn.A = true;
          if (gp.buttons[1]?.pressed) hwInput.btn.B = true;
          if (gp.buttons[2]?.pressed) hwInput.btn.X = true;
          if (gp.buttons[3]?.pressed) hwInput.btn.Y = true;
          if (gp.buttons[10]?.pressed) hwInput.btn.L3 = true;
          if (gp.buttons[11]?.pressed) hwInput.btn.R3 = true;
          if (gp.buttons[8]?.pressed) hwInput.btn.SELECT = true;
          if (gp.buttons[9]?.pressed) hwInput.btn.MENU = true;
          if (gp.buttons[12]?.pressed) hwInput.btn.UP = true;
          if (gp.buttons[13]?.pressed) hwInput.btn.DOWN = true;
          if (gp.buttons[14]?.pressed) hwInput.btn.LEFT = true;
          if (gp.buttons[15]?.pressed) hwInput.btn.RIGHT = true;
          break;
        }
      }

      drawThumbstickWell(ctxLeft, stickLeftCanvas, hwInput.lx, hwInput.ly, hwInput.leftActive, hwInput.btn.L3, 'LEFT STICK');
      drawThumbstickWell(ctxRight, stickRightCanvas, hwInput.rx, hwInput.ry, hwInput.rightActive, hwInput.btn.R3, 'RIGHT STICK');

      const adcLX = Math.round((hwInput.lx + 1) * 2047.5);
      const adcLY = Math.round((hwInput.ly + 1) * 2047.5);
      const adcRX = Math.round((hwInput.rx + 1) * 2047.5);
      const adcRY = Math.round((hwInput.ry + 1) * 2047.5);

      document.getElementById('readoutLeft').textContent  = `L:${adcLX},${adcLY}`;
      document.getElementById('readoutRight').textContent = `R:${adcRX},${adcRY}`;
    }

    function snapshotPrevButtons() {
      for (const k in hwInput.btn) hwInput.prevBtn[k] = hwInput.btn[k];

    function setFaceLabels(y, x, b, a, hint) {
      document.getElementById('lblY').textContent = y;
      document.getElementById('lblX').textContent = x;

    /***************************************************************************
     * 4. SISTEMA OPERATIVO RETRO-GO
     ***************************************************************************/
    const ROM_LIST = [
      { id: 'fpv',    sys: 'S3-3D', name: 'FPV DRONE ACRO',  size: '64KB', fav: true  },
      { id: 'rally',  sys: 'S3-3D', name: 'WRC RALLY STAGE', size: '96KB', fav: true  },
      { id: 'space',  sys: 'S3-3D', name: 'STARFIGHTER 3D',  size: '80KB', fav: false },
      { id: 'arena',  sys: 'ARCDE', name: 'TWIN-STICK ARENA',size: '48KB', fav: true  },
      { id: 'hwtest', sys: 'TOOLS', name: 'SPI & TOUCH DIAG',size: '32KB', fav: false }
    ];

    let osState = 'boot';
    let bootTimer = 1.0;
    let activeRomId = 'fpv';
    let rgTabIdx = 0;
    let rgCursor = 0;
    let navCooldown = 0;
    let previewAnimT = 0;

    // Emulación del controlador táctil capacitivo FT6336U (I2C) integrado en la pantalla IPS 2.8"
    const capTouch = {
      active: false,
      x320: 160,
      y240: 120,
      lx128: 64,
      ly64: 32,
      justTapped: false
    };

    function handleOledTouchPoint(clientX, clientY, isStart) {
      const rect = oledCanvas.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (clientX - rect.left) / (rect.width || 1)));
      const ny = Math.max(0, Math.min(1, (clientY - rect.top) / (rect.height || 1)));
      capTouch.x320 = Math.round(nx * (DISP_W - 1));
      capTouch.y240 = Math.round(ny * (DISP_H - 1));
      capTouch.lx128 = nx * SCREEN_W;
      capTouch.ly64  = ny * SCREEN_H;
      capTouch.active = true;
      if (isStart) capTouch.justTapped = true;
    }

    oledCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, true);
    }, { passive: false });
    oledCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, false);
    }, { passive: false });
    oledCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      capTouch.active = false;
    }, { passive: false });
    oledCanvas.addEventListener('mousedown', (e) => {
      handleOledTouchPoint(e.clientX, e.clientY, true);
    });
    window.addEventListener('mousemove', (e) => {
      if (capTouch.active && e.buttons === 1) handleOledTouchPoint(e.clientX, e.clientY, false);
    });
    window.addEventListener('mouseup', () => { capTouch.active = false; });

    let rgOverlayOpen = false;
    let rgOverlayCursor = 0;
    const RG_OVERLAY_ITEMS = [
      'CONTINUE GAME',
      'SAVE STATE (NVS)',
      'LOAD STATE (NVS)',
      'RESET CART',
      'QUIT TO RETRO-GO'
    ];
    const savedStates = {};
    let toastMsg = '';
    let toastTimer = 0;

    function showToast(msg) {
      toastMsg = msg;
      toastTimer = 1.4;
      blinkSdLed();
    }

    function launchRom(romId) {
      blinkSdLed();
      activeRomId = romId;
      osState = 'ingame';
      rgOverlayOpen = false;
      playTone(820, 0.08);

      if (romId === 'fpv') {
        setFaceLabels('MODO', 'RST', 'CAM', 'BOOST', 'L:THR/YAW R:PIT/ROL MENU:OSD');

      } else if (romId === 'rally') {
        setFaceLabels('CAM', 'RST', 'DRFT', 'GAS', 'L/DPAD:GIRO A:GAS B:DRIFT');
        rallyGame.reset();
      } else if (romId === 'space') {
        setFaceLabels('RDR', 'RST', 'TRBO', 'FIRE', 'STICKS:NAVE A/R3:LASER');
        spaceGame.reset();
      } else if (romId === 'arena') {
        setFaceLabels('EMP', 'RST', 'BOMB', 'FIRE', 'L/DPAD:MOVER R:APUNTAR 360');
        arenaGame.reset();
      } else if (romId === 'hwtest') {
        setFaceLabels('Y', 'X', 'B', 'A', 'TOCA LA PANTALLA IPS O PULSA ★ MENU');
      }
    }

    function updateAndRenderRetroGoBoot(dt) {
      bootTimer -= dt;
      fbClear(0);

      fbDrawText('LCD : 2.8" 320X240 RGB565 DMA', 8, 34, 5);
      fbDrawText('TCH : FT6336 CAPACITIVE I2C', 8, 42, 2);

      const pct = Math.min(1.0, (1.0 - bootTimer) / 0.85);
      fbRect(12, 51, 104, 6, false, 1);
      fbRect(14, 53, Math.round(pct * 100), 2, true, 3);

      if (bootTimer <= 0 || hwInput.justPressed('A') || hwInput.justPressed('MENU') || capTouch.justTapped) {

    function updateAndRenderRetroGoLauncher(dt) {
      previewAnimT += dt;
      if (navCooldown > 0) navCooldown -= dt;

      const filteredRoms = rgTabIdx === 1 ? ROM_LIST.filter(r => r.fav) : ROM_LIST;
      if (rgCursor >= filteredRoms.length) rgCursor = Math.max(0, filteredRoms.length - 1);

      // Soporte Touch Capacitivo directo sobre la pantalla 2.8" IPS en el Launcher
      if (capTouch.justTapped) {
        if (capTouch.ly64 <= 11) {
          if (capTouch.lx128 < 32) rgTabIdx = 0;
          else if (capTouch.lx128 < 60) rgTabIdx = 1;
          else rgTabIdx = 2;
          playTone(620, 0.03);
        } else if (rgTabIdx !== 2 && capTouch.ly64 >= 12 && capTouch.ly64 <= 52) {
          const idx = Math.floor((capTouch.ly64 - 12) / 8);
          if (idx >= 0 && idx < filteredRoms.length) {
            if (rgCursor === idx || capTouch.lx128 > 82) {
              launchRom(filteredRoms[idx].id);
              capTouch.justTapped = false;
              return;
            } else {
              rgCursor = idx;
              playTone(480, 0.025);
            }
          }
        }
      }

      const navY = Math.abs(hwInput.ly) > Math.abs(hwInput.ry) ? hwInput.ly : hwInput.ry;
      const navX = Math.abs(hwInput.lx) > Math.abs(hwInput.rx) ? hwInput.lx : hwInput.rx;

      if (navCooldown <= 0) {
        if (navY < -0.45 || hwInput.justPressed('DOWN')) {
          rgCursor = (rgCursor + 1) % (filteredRoms.length || 1);
          navCooldown = 0.17;
          playTone(480, 0.025);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgCursor = (rgCursor - 1 + (filteredRoms.length || 1)) % (filteredRoms.length || 1);
          navCooldown = 0.17;
          playTone(480, 0.025);
        } else if (navX > 0.55 || hwInput.justPressed('RIGHT') || hwInput.justPressed('SELECT')) {
          rgTabIdx = (rgTabIdx + 1) % 3;
          navCooldown = 0.22;
          playTone(620, 0.03);
        } else if (navX < -0.55 || hwInput.justPressed('LEFT') || hwInput.justPressed('B')) {
          rgTabIdx = (rgTabIdx + 2) % 3;
          navCooldown = 0.22;
          playTone(620, 0.03);
        }
      }

      if (hwInput.justPressed('Y') && filteredRoms[rgCursor]) {
        filteredRoms[rgCursor].fav = !filteredRoms[rgCursor].fav;
        blinkSdLed();
        playTone(700, 0.04);
      }

      if (hwInput.justPressed('X')) {
        rgTabIdx = rgTabIdx === 2 ? 0 : 2;
        playTone(580, 0.03);
      }

      if ((hwInput.justPressed('A') || hwInput.justPressed('L3') || hwInput.justPressed('R3')) && rgTabIdx !== 2) {
        const rom = filteredRoms[rgCursor];
        if (rom) {
          launchRom(rom.id);
          return;
        }
      }

      fbClear(0);
      fbRect(0, 0, 128, 10, true, 8);
      const tabs = ['[ROMS]', '[FAV]', '[S3-FW]'];
      let tx = 2;
      for (let i = 0; i < tabs.length; i++) {
        if (i === rgTabIdx) {
          fbRect(tx - 1, 1, tabs[i].length * 4 + 2, 8, true, 2);
          fbDrawText(tabs[i], tx, 2, 0);
        } else {
          fbDrawText(tabs[i], tx, 2, 1);
        }
        tx += tabs[i].length * 4 + 5;
      }
      fbDrawText('320X240', 98, 2, 3);

      if (rgTabIdx === 2) {
        fbDrawText('LCD : 2.8" ILI9341V IPS SPI', 4, 13, 5);
        fbDrawText('RES : 320X240 RGB565 (150KB)', 4, 21, 2);
        fbDrawText('SPI : 60-80MHZ DUAL-CORE DMA', 4, 29, 3);
        fbDrawText('FPS : 48-60 FPS CONTINUOS', 4, 37, 1);
        fbDrawText('TCH : FT6336 CAPACITIVE I2C', 4, 45, 9);
        fbDrawLine(0, 53, 127, 53, 0, 6);
        fbDrawText('TOCA TAB O PULSA B PARA ROMS', 4, 56, 2);
        return;
      }

      for (let i = 0; i < filteredRoms.length; i++) {
        const rom = filteredRoms[i];
        const y = 13 + i * 8;
        const sel = (i === rgCursor);
        const label = (rom.fav ? '*' : ' ') + rom.name.slice(0, 18);
        if (sel) {
          fbRect(1, y - 1, 82, 7, true, 4);
          fbDrawText('>' + label, 2, y, 1);
        } else {
          fbDrawText(' ' + label, 2, y, rom.fav ? 2 : 1);
        }
      }

      const currentRom = filteredRoms[rgCursor];
      if (currentRom) {
        drawRomBoxArt(currentRom.id, previewAnimT);
        fbRect(0, 53, 128, 11, true, 8);
        fbDrawText(`${currentRom.sys} | ${currentRom.size} | A/TOUCH:RUN`, 2, 56, 3);
      }
    }

    function updateAndRenderRetroGoOverlay(dt) {
      if (navCooldown > 0) navCooldown -= dt;

      if (capTouch.justTapped && capTouch.ly64 >= 16 && capTouch.ly64 <= 54) {
        const idx = Math.floor((capTouch.ly64 - 17) / 7);
        if (idx >= 0 && idx < RG_OVERLAY_ITEMS.length) {
          rgOverlayCursor = idx;

        }

      const navY = Math.abs(hwInput.ly) > Math.abs(hwInput.ry) ? hwInput.ly : hwInput.ry;

          rgOverlayCursor = (rgOverlayCursor + 1) % RG_OVERLAY_ITEMS.length;
          navCooldown = 0.17;
          playTone(500, 0.025);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgOverlayCursor = (rgOverlayCursor - 1 + RG_OVERLAY_ITEMS.length) % RG_OVERLAY_ITEMS.length;
          navCooldown = 0.17;
          playTone(500, 0.025);

          showToast('STATE SAVED TO NVS');

        } else if (rgOverlayCursor === 2) {

          if (activeRomId === 'rally' && savedStates.rally) {

          showToast('STATE LOADED');
          rgOverlayOpen = false;
        } else if (rgOverlayCursor === 3) {
          launchRom(activeRomId);

        } else if (rgOverlayCursor === 4) {
          rgOverlayOpen = false;

          setFaceLabels('FAV*', 'INFO', 'TAB', 'RUN', 'TOUCH/DPAD/STICK:NAV | A:RUN');
        }
        return;
      }

      fbRect(16, 6, 96, 52, true, 0);
      fbRect(16, 6, 96, 52, false, 2);
      fbRect(16, 6, 96, 9, true, 4);
      fbDrawText('RETRO-GO IN-GAME MENU', 22, 8, 1);

      for (let i = 0; i < RG_OVERLAY_ITEMS.length; i++) {
        const y = 18 + i * 7;
        if (i === rgOverlayCursor) {
          fbRect(19, y - 1, 90, 7, true, 2);
          fbDrawText('>' + RG_OVERLAY_ITEMS[i], 21, y, 0);
        } else {
          fbDrawText(' ' + RG_OVERLAY_ITEMS[i], 21, y, 1);
        }
      }
    }

    /***************************************************************************
     * 5. LOS 5 CARTUCHOS / JUEGOS
     ***************************************************************************/
    const DEG2RAD = Math.PI / 180.0;

    // CARTUCHO 1: FPV DRONE 3D ACRO
    const fpvGame = {
      px: 0, py: 2.2, pz: -10,
      vx: 0, vy: 0, vz: 0,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      mode: 'ACRO',
      chaseCam: false,
      activeGate: 0,
      thrCmd: 0.36,
      gates: [
        { x:  0, y: 2.5, z:   5, w: 5.0, h: 4.0 },
        { x:  6, y: 3.0, z:  22, w: 5.0, h: 4.0 },
        { x: 22, y: 3.2, z:  34, w: 5.0, h: 4.0 },
        { x: 34, y: 2.5, z:  16, w: 5.0, h: 4.0 },
        { x: 22, y: 2.5, z:  -6, w: 5.0, h: 4.0 },
        { x:  0, y: 2.5, z: -18, w: 5.0, h: 4.0 }
      ],
      reset() {
        this.px = 0; this.py = 2.2; this.pz = -10;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.pitchRate = 0; this.rollRate = 0; this.yawRate = 0;
        this.rx = 1; this.ry = 0; this.rz = 0;
        this.ux = 0; this.uy = 1; this.uz = 0;
        this.fx = 0; this.fy = 0; this.fz = 1;
        this.activeGate = 0;
      },
      step(dt) {
        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) {
          this.mode = this.mode === 'ACRO' ? 'STAB' : 'ACRO';
          showToast(`MODE: ${this.mode}`);
        }
        if (hwInput.justPressed('X')) { this.reset(); showToast('DRONE RESET'); }
        if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
          this.chaseCam = !this.chaseCam;
          showToast(this.chaseCam ? 'CAM: 3RD PERSON' : 'CAM: FPV');
        }

        const baseThr = 0.36;
        let thr = hwInput.ly >= 0 ? baseThr + hwInput.ly * (1 - baseThr) : baseThr * (1 + hwInput.ly);
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.25);
        this.thrCmd = thr;

        const curPitch = Math.atan2(-this.fy, this.uy);
        const curRoll  = Math.atan2(-this.ry, this.uy);

        let tPitch = 0, tRoll = 0, tYaw = hwInput.lx * 210 * DEG2RAD;
        if (this.mode === 'ACRO') {
          tPitch = hwInput.ry * 300 * DEG2RAD;
          tRoll  = hwInput.rx * 300 * DEG2RAD;
        } else {
          tPitch = ((hwInput.ry * 48 * DEG2RAD) - curPitch) * 7.0;
          tRoll  = ((hwInput.rx * 48 * DEG2RAD) - curRoll)  * 7.0;
        }

        const alpha = Math.min(1.0, 20.0 * dt);
        this.pitchRate += (tPitch - this.pitchRate) * alpha;
        this.rollRate  += (tRoll  - this.rollRate)  * alpha;
        this.yawRate   += (tYaw   - this.yawRate)   * alpha;

        const p = this.pitchRate * dt, r = this.rollRate * dt, y = this.yawRate * dt;
        const thSq = p*p + r*r + y*y;
        if (thSq > 1e-12) {
          const th = Math.sqrt(thSq);
          const c1 = Math.sin(th) / th, c2 = (1 - Math.cos(th)) / thSq;
          const rx = this.rx, ry = this.ry, rz = this.rz;
          const ux = this.ux, uy = this.uy, uz = this.uz;
          const fx = this.fx, fy = this.fy, fz = this.fz;

          const v1Rx = -r*ux - y*fx, v1Ry = -r*uy - y*fy, v1Rz = -r*uz - y*fz;
          const v1Ux =  r*rx + p*fx, v1Uy =  r*ry + p*fy, v1Uz =  r*rz + p*fz;
          const v1Fx =  y*rx - p*ux, v1Fy =  y*ry - p*uy, v1Fz =  y*rz - p*uz;

          const v2Rx = -r*v1Ux - y*v1Fx, v2Ry = -r*v1Uy - y*v1Fy, v2Rz = -r*v1Uz - y*v1Fz;
          const v2Ux =  r*v1Rx + p*v1Fx, v2Uy =  r*v1Ry + p*v1Fy, v2Uz =  r*v1Rz + p*v1Fz;
          const v2Fx =  y*v1Rx - p*v1Ux, v2Fy =  y*v1Ry - p*v1Uy, v2Fz =  y*v1Rz - p*v1Uz;

          this.rx = rx + c1*v1Rx + c2*v2Rx; this.ry = ry + c1*v1Ry + c2*v2Ry; this.rz = rz + c1*v1Rz + c2*v2Rz;
          this.ux = ux + c1*v1Ux + c2*v2Ux; this.uy = uy + c1*v1Uy + c2*v2Uy; this.uz = uz + c1*v1Uz + c2*v2Uz;
          this.fx = fx + c1*v1Fx + c2*v2Fx; this.fy = fy + c1*v1Fy + c2*v2Fy; this.fz = fz + c1*v1Fz + c2*v2Fz;

          const fL = Math.hypot(this.fx, this.fy, this.fz) || 1;
          this.fx /= fL; this.fy /= fL; this.fz /= fL;
          const dot = this.ux*this.fx + this.uy*this.fy + this.uz*this.fz;
          this.ux -= dot*this.fx; this.uy -= dot*this.fy; this.uz -= dot*this.fz;
          const uL = Math.hypot(this.ux, this.uy, this.uz) || 1;
          this.ux /= uL; this.uy /= uL; this.uz /= uL;
          this.rx = this.uy*this.fz - this.uz*this.fy;
          this.ry = this.uz*this.fx - this.ux*this.fz;
          this.rz = this.ux*this.fy - this.uy*this.fx;
        }

        const thrust = thr * 26.0;
        const spd = Math.hypot(this.vx, this.vy, this.vz);
        const drag = 0.08 + 0.008 * spd;
        this.vx += (this.ux * thrust - this.vx * drag) * dt;
        this.vy += (this.uy * thrust - 9.81 - this.vy * drag) * dt;
        this.vz += (this.uz * thrust - this.vz * drag) * dt;

        this.px += this.vx * dt; this.py += this.vy * dt; this.pz += this.vz * dt;
        if (this.py < 0.25) {
          this.py = 0.25;
          if (this.vy < 0) this.vy = -this.vy * 0.2;
          this.vx *= 0.92; this.vz *= 0.92;
        }

        const g = this.gates[this.activeGate];
        if (Math.hypot(this.px - g.x, this.py - g.y, this.pz - g.z) < 3.5) {
          this.activeGate = (this.activeGate + 1) % this.gates.length;
          showToast(`GATE ${this.activeGate}/${this.gates.length} OK!`);
          playTone(880, 0.08);
        }
      },
      render() {
        const tilt = 15 * DEG2RAD;
        const cT = Math.cos(tilt), sT = Math.sin(tilt);
        const cRx = this.rx, cRy = this.ry, cRz = this.rz;
        const cUx = cT*this.ux - sT*this.fx, cUy = cT*this.uy - sT*this.fy, cUz = cT*this.uz - sT*this.fz;
        const cFx = sT*this.ux + cT*this.fx, cFy = sT*this.uy + cT*this.fy, cFz = sT*this.uz + cT*this.fz;

        const horizonY240 = Math.round(120 + (cFy / Math.max(0.25, Math.abs(cUy))) * 140);
        fbFillHorizon320(horizonY240, C565.SKYTOP, C565.SKYBOT, C565.GNDTOP, C565.GNDBOT);

        const camX = this.chaseCam ? this.px - cFx * 3.5 + cUx * 1.0 : this.px;
        const camY = this.chaseCam ? Math.max(0.3, this.py - cFy * 3.5 + cUy * 1.0) : this.py;
        const camZ = this.chaseCam ? this.pz - cFz * 3.5 + cUz * 1.0 : this.pz;

        const projLine = (x0, y0, z0, x1, y1, z1, dash = 0, col = 1) => {
          const dx0 = x0 - camX, dy0 = y0 - camY, dz0 = z0 - camZ;
          const dx1 = x1 - camX, dy1 = y1 - camY, dz1 = z1 - camZ;
          let cx0 = dx0*cRx + dy0*cRy + dz0*cRz, cy0 = dx0*cUx + dy0*cUy + dz0*cUz, cz0 = dx0*cFx + dy0*cFy + dz0*cFz;
          let cx1 = dx1*cRx + dy1*cRy + dz1*cRz, cy1 = dx1*cUx + dy1*cUy + dz1*cUz, cz1 = dx1*cFx + dy1*cFy + dz1*cFz;
          if (cz0 < 0.2 && cz1 < 0.2) return;
          if (cz0 > 75 && cz1 > 75) return;
          if (cz0 < 0.2) { const t = (0.2 - cz0)/(cz1 - cz0); cx0 += t*(cx1 - cx0); cy0 += t*(cy1 - cy0); cz0 = 0.2; }
          else if (cz1 < 0.2) { const t = (0.2 - cz1)/(cz0 - cz1); cx1 += t*(cx0 - cx1); cy1 += t*(cy0 - cy1); cz1 = 0.2; }
          const f = 68.0;
          fbDrawLine(64 + cx0*f/cz0, 32 - cy0*f/cz0, 64 + cx1*f/cz1, 32 - cy1*f/cz1, dash, col);
        };

        for (let i = -48; i <= 48; i += 8) {
          projLine(i, 0, -48, i, 0, 48, 1, 7);
          projLine(-48, 0, i, 48, 0, i, 1, 7);
        }

        for (let i = 0; i < this.gates.length; i++) {
          const g = this.gates[i];
          const hw = g.w * 0.5, hh = g.h * 0.5;
          const isAct = (i === this.activeGate);
          const col = isAct ? 10 : 5;
          projLine(g.x - hw, 0, g.z, g.x - hw, g.y + hh, g.z, 0, col);
          projLine(g.x + hw, 0, g.z, g.x + hw, g.y + hh, g.z, 0, col);
          projLine(g.x - hw, g.y + hh, g.z, g.x + hw, g.y + hh, g.z, 0, isAct ? 2 : col);
          projLine(g.x - hw, g.y - hh, g.z, g.x + hw, g.y - hh, g.z, 0, col);
          if (isAct) {
            projLine(g.x, g.y + hh + 1.2, g.z, g.x - 1, g.y + hh + 2.4, g.z, 0, 2);
            projLine(g.x, g.y + hh + 1.2, g.z, g.x + 1, g.y + hh + 2.4, g.z, 0, 2);
          }
        }

        let hFx = cFx, hFz = cFz, hN = Math.hypot(hFx, hFz) || 1;
        hFx /= hN; hFz /= hN;
        const hRx = hFz, hRz = -hFx;
        projLine(camX + hFx*45 - hRx*14, camY, camZ + hFx*45 - hRz*14,
                 camX + hFx*45 + hRx*14, camY, camZ + hFz*45 + hRz*14, 0, 3);

        fbRect(0, 0, 128, 8, true, 0);
        fbDrawText(this.mode, 2, 2, this.mode === 'ACRO' ? 2 : 3);
        fbDrawText('16.4V', 48, 2, 5);
        fbDrawText(`G${this.activeGate + 1}/6`, 104, 2, 10);

        const spd = Math.hypot(this.vx, this.vy, this.vz);
        fbRect(0, 56, 128, 8, true, 0);
        fbDrawText(`V:${Math.round(spd)}M/S`, 2, 58, 1);
        fbDrawText(`THR:${Math.round(this.thrCmd * 100)}%`, 48, 58, 2);
        fbDrawText(`A:${this.py.toFixed(1)}M`, 96, 58, 3);
      }
    };

    // CARTUCHO 2: RALLY STAGE 3D WRC (ASFALTO + PIANOS ROJOS/BLANCOS + COCHE WRC RGB565)
    const rallyGame = {
      trackZ: 0, playerX: 0, speed: 0, driftAngle: 0, distance: 0, camChase: true,
      reset() { this.trackZ = 0; this.playerX = 0; this.speed = 0; this.driftAngle = 0; this.distance = 0; },
      getCurveAt(z) { return Math.sin(z * 0.035) * 1.4 + Math.cos(z * 0.08) * 0.9; },
      getHillAt(z) { return Math.sin(z * 0.05) * 1.8; },
      step(dt) {
        if (hwInput.justPressed('X')) { this.reset(); showToast('STAGE RESTART'); }
        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) {
          this.camChase = !this.camChase;
          showToast(this.camChase ? 'CAM: CHASE WRC' : 'CAM: BUMPER');
        }

        const steerInput = Math.abs(hwInput.lx) > Math.abs(hwInput.rx) ? hwInput.lx : hwInput.rx;
        const gasInput   = Math.max(hwInput.btn.A ? 1.0 : 0.0, Math.max(0, hwInput.ry), Math.max(0, hwInput.ly));
        const brakeInput = Math.max(hwInput.btn.B || hwInput.btn.R3 ? 1.0 : 0.0, Math.max(0, -hwInput.ry));

        const offRoad = Math.abs(this.playerX) > 1.05;
        const maxSpd = offRoad ? 105 : 215;

        if (gasInput > 0.05) this.speed += gasInput * 75 * dt;
        else this.speed -= 22 * dt;
        if (brakeInput > 0.05) this.speed -= brakeInput * 95 * dt;
        if (offRoad) this.speed -= 45 * dt;
        this.speed = Math.max(0, Math.min(maxSpd, this.speed));

        const spdNorm = this.speed / 180.0;
        const dz = (this.speed * 0.28) * dt;
        this.trackZ += dz;
        this.distance += dz;

        const roadCurve = this.getCurveAt(this.trackZ);
        const isDrifting = brakeInput > 0.2 && Math.abs(steerInput) > 0.25 && this.speed > 60;
        const targetDrift = isDrifting ? steerInput * 0.85 : steerInput * 0.25;
        this.driftAngle += (targetDrift - this.driftAngle) * Math.min(1, 8 * dt);

        const turnRate = steerInput * (isDrifting ? 2.3 : 1.75) * Math.min(1.0, this.speed / 45.0);
        const centrifugal = roadCurve * spdNorm * spdNorm * 1.15;
        this.playerX = Math.max(-2.2, Math.min(2.2, this.playerX + (turnRate - centrifugal) * dt));
      },
      render() {
        fbFillHorizon320(82, C565.SKYTOP, C565.SKYBOT, C565.GNDTOP, C565.GNDBOT);
        const bgOffset = ((this.trackZ * 2) | 0) % 32;
        fbDrawLine(0, 21, 127, 21, 0, 5);
        fbDrawLine(0, 21, 24 - (bgOffset >> 2), 11, 0, 9);
        fbDrawLine(24 - (bgOffset >> 2), 11, 52 - (bgOffset >> 2), 21, 0, 9);
        fbDrawLine(60, 21, 88, 9, 0, 10);
        fbDrawLine(88, 9, 120, 21, 0, 10);

        const numSegs = 26, segLen = 2.2;
        const baseZ = Math.floor(this.trackZ / segLen) * segLen;
        const fracZ = (this.trackZ - baseZ) / segLen;
        let prevLeftX = 0, prevRightX = 0, prevY = 0, accumCurve = 0, curveVel = 0;

        for (let i = 1; i <= numSegs; i++) {
          const worldZ = baseZ + i * segLen;
          const relZ = (i - fracZ) * segLen;
          if (relZ < 0.5) continue;

          curveVel += this.getCurveAt(worldZ) * 0.14;
          accumCurve += curveVel;
          const hill = this.getHillAt(worldZ) - this.getHillAt(this.trackZ);
          const scale = 38.0 / relZ;

          const roadCenterX = 64 + (accumCurve - this.playerX * 3.4) * scale;
          const roadHalfW   = 3.2 * scale;
          const sy = Math.max(21, Math.min(63, Math.round(22 + (1.45 - hill * 0.15) * scale)));
          const lx = roadCenterX - roadHalfW, rx = roadCenterX + roadHalfW;

          if (i > 1) {
            const segIdx = Math.floor(worldZ / segLen);
            const roadCol = (segIdx & 1) ? rgb565(46, 52, 66) : rgb565(36, 42, 54);
            fbFillQuadScanline(lx, rx, sy, prevLeftX, prevRightX, prevY, roadCol);

            const kerbCol = (segIdx & 1) ? 4 : 1;
            fbDrawLine(prevLeftX, prevY, lx, sy, 0, kerbCol);
            fbDrawLine(prevRightX, prevY, rx, sy, 0, kerbCol);

            if (segIdx % 2 === 0) {
              const cx0 = (prevLeftX + prevRightX) * 0.5, cx1 = (lx + rx) * 0.5;
              fbDrawLine(cx0, prevY, cx1, sy, 0, 2);
              if (segIdx % 4 === 0 && i < 18) {
                const postH = Math.max(2, Math.round(2.0 * scale));
                fbDrawLine(lx - 1.2 * scale, sy, lx - 1.2 * scale, sy - postH, 0, 2);
                fbDrawLine(rx + 1.2 * scale, sy, rx + 1.2 * scale, sy - postH, 0, 2);
              }
            }
          }
          prevLeftX = lx; prevRightX = rx; prevY = sy;
        }

        if (this.camChase) {
          const carCx = 64 + Math.round(this.driftAngle * 10), carCy = 55;
          const skew = Math.round(this.driftAngle * 7);
          fbRect(carCx - 11 + skew, carCy - 5, 22, 6, true, 4);
          fbRect(carCx - 11 + skew, carCy - 5, 22, 6, false, 1);
          fbDrawLine(carCx - 7 + skew, carCy - 9, carCx + 7 + skew, carCy - 9, 0, 5);
          fbDrawLine(carCx - 11 + skew, carCy - 5, carCx - 7 + skew, carCy - 9, 0, 1);
          fbDrawLine(carCx + 11 + skew, carCy - 5, carCx + 7 + skew, carCy - 9, 0, 1);
          fbRect(carCx - 9 + skew, carCy - 4, 4, 2, true, 2);
          fbRect(carCx + 5 + skew, carCy - 4, 4, 2, true, 2);
          fbRect(carCx - 13 + skew, carCy - 2, 4, 4, true, 0);
          fbRect(carCx + 9 + skew,  carCy - 2, 4, 4, true, 0);
        }

        fbRect(0, 0, 128, 8, true, 0);
        fbDrawText(`${Math.round(this.speed)}KMH`, 2, 2, 3);
        const gear = this.speed < 5 ? 'N' : Math.min(6, Math.ceil(this.speed / 36));
        fbDrawText(`G:${gear}`, 54, 2, 2);
        fbDrawText(`${(this.distance / 100).toFixed(1)}KM`, 90, 2, 5);
      }
    };

    // CARTUCHO 3: STARFIGHTER 3D (RGB565 SPACE COMBAT)
    const spaceGame = {
      score: 0, shield: 100, speed: 22, enemies: [], stars: [], lasers: [], cooldown: 0,
      reset() {
        this.score = 0; this.shield = 100; this.enemies = []; this.lasers = []; this.stars = [];
        for (let i = 0; i < 40; i++) this.stars.push({ x: (Math.random() - 0.5) * 90, y: (Math.random() - 0.5) * 50, z: Math.random() * 60 + 2, c: (i % 3 === 0) ? 5 : 1 });
        for (let i = 0; i < 4; i++) this.spawnEnemy(25 + i * 14);
      },
      spawnEnemy(zDist = 55) {
        this.enemies.push({ x: (Math.random() - 0.5) * 32, y: (Math.random() - 0.5) * 18, z: zDist, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 4 });
      },
      step(dt) {
        if (hwInput.justPressed('X')) { this.reset(); showToast('MISSION RESET'); }
        if (this.cooldown > 0) this.cooldown -= dt;

        const yawIn   = Math.abs(hwInput.rx) > Math.abs(hwInput.lx) ? hwInput.rx : hwInput.lx;
        const pitchIn = Math.abs(hwInput.ry) > Math.abs(hwInput.ly) ? hwInput.ry : hwInput.ly;
        this.speed = hwInput.btn.B ? 42 : (20 + Math.max(0, hwInput.ly) * 18);

        if ((hwInput.btn.A || hwInput.btn.R3 || hwInput.btn.L3) && this.cooldown <= 0) {
          this.lasers.push({ z: 2.0 });
          this.cooldown = 0.16;
          playTone(920, 0.05, 'sawtooth', 0.04);
        }

        for (const s of this.stars) {
          s.x -= yawIn * 26 * dt; s.y -= pitchIn * 18 * dt; s.z -= this.speed * dt;
          if (s.z < 1) { s.z = 60; s.x = (Math.random() - 0.5) * 90; s.y = (Math.random() - 0.5) * 50; }
        }
        for (let i = this.lasers.length - 1; i >= 0; i--) {
          this.lasers[i].z += 85 * dt;
          if (this.lasers[i].z > 65) this.lasers.splice(i, 1);
        }
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const e = this.enemies[i];
          e.x += (e.vx - yawIn * 22) * dt; e.y += (e.vy - pitchIn * 16) * dt; e.z -= (this.speed * 0.65) * dt;
          let hit = false;
          for (let j = this.lasers.length - 1; j >= 0; j--) {
            if (Math.abs(this.lasers[j].z - e.z) < 4.5 && Math.hypot(e.x, e.y) < 4.8) {
              hit = true; this.lasers.splice(j, 1); break;
            }
          }
          if (hit) {
            this.score += 100; playTone(220, 0.12); this.enemies.splice(i, 1); this.spawnEnemy(58);
          } else if (e.z < 1.5) {
            if (Math.hypot(e.x, e.y) < 4.5) this.shield = Math.max(0, this.shield - 15);
            this.enemies.splice(i, 1); this.spawnEnemy(58);
          }
        }
      },
      render() {
        fbClear(0);
        const f = 58.0;
        for (const s of this.stars) fbSetPixel(64 + (s.x * f) / s.z, 32 - (s.y * f) / s.z, s.c || 1);
        for (const e of this.enemies) {
          const sx = 64 + (e.x * f) / e.z, sy = 32 - (e.y * f) / e.z;
          const r = Math.max(2, Math.round((2.2 * f) / e.z));
          fbCircle(sx, sy, r, 4);
          fbDrawLine(sx - r * 1.6, sy - r * 1.4, sx - r * 1.6, sy + r * 1.4, 0, 9);
          fbDrawLine(sx + r * 1.6, sy - r * 1.4, sx + r * 1.6, sy + r * 1.4, 0, 9);
          fbDrawLine(sx - r * 1.6, sy, sx + r * 1.6, sy, 0, 2);
        }
        for (const l of this.lasers) {
          const z1 = l.z + 6;
          fbDrawLine(20, 56, 64 - (8 * f) / z1, 32 + (2 * f) / z1, 0, 3);
          fbDrawLine(108, 56, 64 + (8 * f) / z1, 32 + (2 * f) / z1, 0, 3);
        }
        fbCircle(64, 32, 6, 5); fbSetPixel(64, 32, 2);
        fbRect(0, 0, 128, 8, true, 8);
        fbDrawText(`SCR:${this.score}`, 2, 2, 2);
        fbDrawText(`SHD:${this.shield}%`, 86, 2, this.shield > 30 ? 3 : 4);
      }
    };

    // CARTUCHO 4: TWIN-STICK ARENA (RGB565 GEOMETRY WARS STYLE)
    const arenaGame = {
      px: 64, py: 32, aimX: 1, aimY: 0, bullets: [], foes: [], score: 0, lives: 3, bombs: 3, fireTimer: 0, spawnTimer: 0,
      reset() { this.px = 64; this.py = 32; this.bullets = []; this.foes = []; this.score = 0; this.lives = 3; this.bombs = 3; },
      step(dt) {
        if (hwInput.justPressed('X')) this.reset();
        this.px = Math.max(6, Math.min(121, this.px + hwInput.lx * 52 * dt));
        this.py = Math.max(10, Math.min(59, this.py - hwInput.ly * 52 * dt));

        if ((hwInput.justPressed('B') || hwInput.justPressed('Y') || hwInput.justPressed('L3')) && this.bombs > 0) {
          this.bombs--; this.score += this.foes.length * 10; this.foes.length = 0;
          showToast('EMP DETONATED!');
        }

        const rMag = Math.hypot(hwInput.rx, hwInput.ry);
        if (rMag > 0.2) { this.aimX = hwInput.rx / rMag; this.aimY = -hwInput.ry / rMag; }

        this.fireTimer -= dt;
        if ((rMag > 0.25 || hwInput.btn.A || hwInput.btn.R3) && this.fireTimer <= 0) {
          this.bullets.push({ x: this.px + this.aimX * 4, y: this.py + this.aimY * 4, vx: this.aimX * 115, vy: this.aimY * 115 });
          this.fireTimer = 0.11; playTone(760, 0.03);
        }

        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.x < 2 || b.x > 125 || b.y < 9 || b.y > 62) this.bullets.splice(i, 1);
        }

        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0 && this.foes.length < 14) {
          const edge = (Math.random() * 4) | 0;
          this.foes.push({
            x: edge === 0 ? 4 : (edge === 1 ? 123 : Math.random() * 120 + 4),
            y: edge === 2 ? 10 : (edge === 3 ? 60 : Math.random() * 50 + 10)
          });
          this.spawnTimer = 0.65;
        }

        for (let i = this.foes.length - 1; i >= 0; i--) {
          const f = this.foes[i];
          const dx = this.px - f.x, dy = this.py - f.y, dist = Math.hypot(dx, dy) || 1;
          f.x += (dx / dist) * 24 * dt; f.y += (dy / dist) * 24 * dt;
          if (dist < 4.5) {
            this.lives = Math.max(0, this.lives - 1); this.foes.splice(i, 1);
            if (this.lives === 0) this.reset();
            continue;
          }
          for (let j = this.bullets.length - 1; j >= 0; j--) {
            const b = this.bullets[j];
            if (Math.hypot(b.x - f.x, b.y - f.y) < 4.0) {
              this.score += 25; this.foes.splice(i, 1); this.bullets.splice(j, 1); break;
            }
          }
        }
      },
      render() {
        fbClear(0);
        for (let gx = 16; gx < 128; gx += 16) fbDrawLine(gx, 8, gx, 63, 1, 8);
        for (let gy = 16; gy < 64; gy += 12) fbDrawLine(0, gy, 127, gy, 1, 8);
        fbRect(0, 8, 128, 56, false, 5);
        fbCircle(this.px, this.py, 3, 3);
        fbDrawLine(this.px, this.py, this.px + this.aimX * 8, this.py + this.aimY * 8, 0, 5);
        for (const b of this.bullets) fbRect(b.x - 1, b.y - 1, 2, 2, true, 2);
        for (const f of this.foes) {
          fbDrawLine(f.x, f.y - 3, f.x + 3, f.y, 0, 4); fbDrawLine(f.x + 3, f.y, f.x, f.y + 3, 0, 4);
          fbDrawLine(f.x, f.y + 3, f.x - 3, f.y, 0, 10); fbDrawLine(f.x - 3, f.y, f.x, f.y - 3, 0, 10);
        }
        fbRect(0, 0, 128, 8, true, 8);
        fbDrawText(`PTS:${this.score}`, 2, 1, 2);
        fbDrawText(`HP:${this.lives}`, 60, 1, 3);
        fbDrawText(`EMP:${this.bombs}`, 94, 1, 5);
      }
    };

      soundEnabled = !soundEnabled;
      e.currentTarget.textContent = soundEnabled ? '🔊 SND' : '🔇 SND';
      e.currentTarget.classList.toggle('active', soundEnabled);
    });

    document.getElementById('btnGrid').addEventListener('click', (e) => {
      const c = document.getElementById('oledContainer');
      c.classList.toggle('pixel-grid');
      e.currentTarget.classList.toggle('active', c.classList.contains('pixel-grid'));
    });

    document.getElementById('btnFull').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    let lastTime = performance.now();
    let fpsFrames = 0;
    let fpsClock = performance.now();

    function retroGoMainLoop(now) {
      requestAnimationFrame(retroGoMainLoop);

      try {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000.0));
        lastTime = now;

        updateInputPolling();

        if (osState === 'boot') {
          updateAndRenderRetroGoBoot(dt);
        } else if (osState === 'launcher') {
          updateAndRenderRetroGoLauncher(dt);
        } else if (osState === 'ingame') {
          if (hwInput.justPressed('MENU')) {
            rgOverlayOpen = !rgOverlayOpen;
            rgOverlayCursor = 0;
            playTone(600, 0.04);
          }

          if (!rgOverlayOpen) {
            if (activeRomId === 'fpv') {
              for (let s = 0; s < 4; s++) fpvGame.step(dt / 4);
              fpvGame.render();
            } else if (activeRomId === 'rally') {
              rallyGame.step(dt);
              rallyGame.render();
            } else if (activeRomId === 'space') {
              spaceGame.step(dt);
              spaceGame.render();
            } else if (activeRomId === 'arena') {
              arenaGame.step(dt);
              arenaGame.render();
            } else if (activeRomId === 'hwtest') {
              renderHwDiagnostic();
            }
          } else {
            if (activeRomId === 'fpv') fpvGame.render();
            else if (activeRomId === 'rally') rallyGame.render();
            else if (activeRomId === 'space') spaceGame.render();
            else if (activeRomId === 'arena') arenaGame.render();
            else if (activeRomId === 'hwtest') renderHwDiagnostic();

            updateAndRenderRetroGoOverlay(dt);
          }
        }

        if (toastTimer > 0) {
          toastTimer -= dt;
          const tw = toastMsg.length * 4 + 6;
          fbRect(64 - (tw >> 1), 1, tw, 9, true, 2);
          fbDrawText(toastMsg, 64 - (tw >> 1) + 3, 3, 0);
        }

        fbPresentToCanvas();
        snapshotPrevButtons();
        capTouch.justTapped = false;

        fpsFrames++;
        if (now - fpsClock >= 500) {
          const rawFps = Math.round((fpsFrames * 1000) / (now - fpsClock));
          const mode = SPI_MODES[paletteIdx];
          const dispFps = Math.min(rawFps, mode.targetFps);
          document.getElementById('uiFpsBattery').textContent = `${dispFps}FPS | SPI ${mode.spiMhz}MHz`;
          fpsFrames = 0;
          fpsClock = now;
        }
      } catch (err) {
        console.error('Frame error recovered:', err);
      }
    }

    requestAnimationFrame(retroGoMainLoop);
  </script>
</body>
</html>
