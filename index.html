    // Selector Principal de Simuladores en resolución nativa 320x240 estilo Nintendo Switch Dark Matte
    function updateAndRenderRetroGoLauncher(dt) {
      previewAnimT += dt;
      if (navCooldown > 0) navCooldown -= dt;

      if (rgCursor >= ROM_LIST.length) rgCursor = 0;

      // Soporte táctil directo sobre las 6 tarjetas izquierdas, panel derecho y barra inferior
      if (capTouch.justTapped) {
        if (capTouch.y240 >= 28 && capTouch.y240 <= 210 && capTouch.x320 <= 202) {
          const idx = Math.floor((capTouch.y240 - 28) / 22);
          if (idx >= 0 && idx < ROM_LIST.length) {
            if (rgCursor === idx) {
              launchRom(ROM_LIST[idx].id);
              capTouch.justTapped = false;
              return;
            } else {
              rgCursor = idx;
              playTone(480, 0.025);
            }
          }
        } else if (capTouch.x320 > 202 && capTouch.y240 >= 28 && capTouch.y240 <= 210) {
          launchRom(ROM_LIST[rgCursor].id);
          capTouch.justTapped = false;
          return;
        } else if (capTouch.y240 > 210) {
          if (capTouch.x320 < 95) {
            launchRom(ROM_LIST[rgCursor].id);
          } else if (capTouch.x320 < 175) {
            launchRom('fc_tuning');
          } else if (capTouch.x320 < 245) {
            generateGentleVoxelMap(currentThemeIdx + 1);
            showToast(TERRAIN_THEMES[currentThemeIdx].name);
            playTone(700, 0.04);
          } else {
            launchRom(activeRomId);
          }
          capTouch.justTapped = false;
          return;
        }
        capTouch.justTapped = false;
      }

      const navY = isRadioThrottleActive() ? hwInput.ry : (Math.abs(hwInput.ly) > Math.abs(hwInput.ry) ? hwInput.ly : hwInput.ry);
      if (navCooldown <= 0) {
        if (navY < -0.45 || hwInput.justPressed('DOWN')) {
          rgCursor = (rgCursor + 1) % ROM_LIST.length;
          navCooldown = 0.16;
          playTone(480, 0.025);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgCursor = (rgCursor - 1 + ROM_LIST.length) % ROM_LIST.length;
          navCooldown = 0.16;
          playTone(480, 0.025);
        }
      }

      if (hwInput.justPressed('Y')) {
        generateGentleVoxelMap(currentThemeIdx + 1);
        showToast(TERRAIN_THEMES[currentThemeIdx].name);
        playTone(700, 0.04);
      }

      if (hwInput.justPressed('X')) {
        launchRom('fc_tuning');
        return;
      }

      if (hwInput.justPressed('B') || hwInput.justPressed('SELECT')) {
        launchRom(activeRomId || 'fpv_wing');
        return;
      }

      if (hwInput.justPressed('A') || hwInput.justPressed('L3') || hwInput.justPressed('R3')) {
        const rom = ROM_LIST[rgCursor];
        if (rom) {
          launchRom(rom.id);
          return;
        }
      }

      // 1. Fondo y Barra Superior Nintendo Switch Dark Matte
      vram565.fill(NIN565.BG);
      fillRect320(0, 0, DISP_W, 22, NIN565.HEADER);
      fillRect320(0, 22, DISP_W, 2, NIN565.RED);
      drawPillBadge320(6, 4, 42, 14, NIN565.RED, 'RC SIM', NIN565.WHITE, true);
      drawInavText320('SELECT SIMULATOR', 54, 8, NIN565.WHITE, -1);
      drawPillBadge320(268, 4, 46, 14, NIN565.CARD, '60 FPS', NIN565.GREEN, true, NIN565.BORDER);

      // 2. Lista de 8 Tarjetas Redondeadas a la izquierda (x=6..200, paso vertical 22px)
      const cleanNames = [
        'FPV FIXED-WING',
        'FPV DRONE 5"',
        'RC SAILBOAT',
        'RC SPEEDBOAT 6S',
        'RC CAR 1/10',
        'ROCK CRAWLER 4X4',
        'WORLD & RC SETUP',
        'HW DIAGNOSTIC'
      ];
      for (let i = 0; i < ROM_LIST.length; i++) {
        const rom = ROM_LIST[i];
        const cy = 28 + i * 22;
        const isSel = (i === rgCursor);
        const isRunning = (rom.id === activeRomId);

        drawRoundedCard320(
          6, cy, 194, 20,
          isSel ? NIN565.CARD_SEL : NIN565.CARD,
          isSel ? NIN565.BORDER_HI : NIN565.BORDER
        );

        if (isSel) {
          fillRect320(8, cy + 3, 3, 14, NIN565.RED);
        } else if (isRunning) {
          fillRect320(8, cy + 4, 2, 12, NIN565.GREEN);
        }

        const tagCol = rom.sys === 'FPV-3D' ? NIN565.GREEN : (rom.sys === 'RC-LOS' ? NIN565.BLUE : NIN565.GOLD);
        drawPillBadge320(154, cy + 4, 40, 11, NIN565.PANEL, rom.sys, tagCol, true);

        drawInavText320(cleanNames[i] || rom.name, 16, cy + 3, isSel ? NIN565.WHITE : rgb565(215, 222, 232), -1);
        drawOsdSmall320(rom.desc, 16, cy + 12, isSel ? NIN565.GOLD : NIN565.MUTED);
      }

      // 3. Panel Derecho: Tarjeta de Vista Previa + Botón de Inicio
      drawRoundedCard320(206, 28, 108, 179, NIN565.PANEL, NIN565.BORDER);
      const curRom = ROM_LIST[rgCursor];
      if (curRom) {
        drawRomBoxArt(curRom.id, previewAnimT);
        drawOsdSmall320('CONTROLS', 214, 127, NIN565.MUTED);
        drawOsdSmall320(curRom.ctrl.slice(0, 19), 214, 137, NIN565.WHITE);
        drawOsdSmall320('MAP THEME', 214, 151, NIN565.MUTED);
        drawOsdSmall320(TERRAIN_THEMES[currentThemeIdx].name.slice(0, 18), 214, 161, NIN565.GOLD);
        drawPillBadge320(214, 178, 92, 21, NIN565.RED, 'START SIM', NIN565.WHITE, false);
      }

      // 4. Barra Inferior con Iconos Circulares Nintendo (A)(X)(Y)(B)
      fillRect320(0, 214, DISP_W, 26, NIN565.HEADER);
      fillRect320(0, 214, DISP_W, 1, NIN565.BORDER);
      drawBtnPrompt320(8,   221, 'A', NIN565.RED,   'START',  NIN565.WHITE);
      drawBtnPrompt320(86,  221, 'X', NIN565.BLUE,  'SETUP',  NIN565.WHITE);
      drawBtnPrompt320(166, 221, 'Y', NIN565.GREEN, 'MAP',    NIN565.WHITE);
      drawBtnPrompt320(238, 221, 'B', NIN565.GOLD,  'RESUME', NIN565.WHITE);
    }

    // =========================================================================
    // MENÚ UNIFICADO CONGRUENTE 320x240 EN 4 PESTAÑAS: [WORLD] | [WING] | [DRONE] | [RC/PAD]
    // Todo se controla desde dentro de la app (Simulador, Mapa, Circuito, Viento, Árboles, Vista, Audio, Rates y RC)
    // =========================================================================
    function resetRcInputDefaults() {
      rcInputConfig.mapMode = 0;
      rcInputConfig.thrMode = 0;
      rcInputConfig.deadzone = 0.03;
      rcInputConfig.invThr = 1;
      rcInputConfig.invYaw = 1;
      rcInputConfig.invPit = 1;
      rcInputConfig.invRol = 1;
      rcInputConfig.trimYaw = 0.0;
      rcInputConfig.trimPit = 0.0;
      rcInputConfig.trimRol = 0.0;
    }

    function resetWorldDefaults() {
      applyWindPreset(3); // BRISA REGATA (12 KT)
      fcProfile.windDirMode = 0;
      fcProfile.losZoom = 1.25;
      fcProfile.treeDensity = 1.0;
      fcProfile.showSplinePath = 1;
      fpvDroneSim.propwash = 1.0;
    }

    function adjustTuningParameter(tab, row, dir) {
      playTone(dir > 0 ? 690 : 540, 0.025);
      const activeSim = getActiveSimObject();

      if (tab === 0) {
        // Pestaña 0 [WRLD]: Simulador Activo, Mapa/Clase, Circuito/Regata, Cámara, Clima/Viento, Menú Viento, Árboles, Spline y Launcher
        if (row === 0) {
          let idx = PLAYABLE_SIM_IDS.indexOf(activeRomId);
          if (idx < 0) idx = 0;
          const nextIdx = ((idx + dir) % PLAYABLE_SIM_IDS.length + PLAYABLE_SIM_IDS.length) % PLAYABLE_SIM_IDS.length;
          const nextId  = PLAYABLE_SIM_IDS[nextIdx];
          launchRom(nextId);
          rgOverlayOpen = true;
          rgTuningOpen  = true;
          rgTuningTab   = 0;
          showToast(`SIM: ${PLAYABLE_SIM_NAMES[nextId]}`);
        } else if (row === 1) {
          if (activeRomId === 'rc_sailboat') {
            rcSailboatSim.presetIdx = ((rcSailboatSim.presetIdx + dir) % SAIL_PRESETS.length + SAIL_PRESETS.length) % SAIL_PRESETS.length;
            showToast(`CLASE VELERO: ${SAIL_PRESETS[rcSailboatSim.presetIdx].name}`);
          } else if (activeRomId === 'rc_boat') {
            rcBoatSim.presetIdx = ((rcBoatSim.presetIdx + dir) % RC_BOAT_PRESETS.length + RC_BOAT_PRESETS.length) % RC_BOAT_PRESETS.length;
            showToast(`CLASE LANCHA: ${RC_BOAT_PRESETS[rcBoatSim.presetIdx].name}`);
          } else if (activeRomId === 'rc_car') {
            rcCarSim.presetIdx = ((rcCarSim.presetIdx + dir) % RC_CAR_PRESETS.length + RC_CAR_PRESETS.length) % RC_CAR_PRESETS.length;
            showToast(`ESPEC CARRO: ${RC_CAR_PRESETS[rcCarSim.presetIdx].name}`);
          } else if (activeRomId === 'rc_crawler') {
            rcCrawlerSim.presetIdx = ((rcCrawlerSim.presetIdx + dir) % RC_CRAWLER_PRESETS.length + RC_CRAWLER_PRESETS.length) % RC_CRAWLER_PRESETS.length;
            showToast(`CRAWLER: ${RC_CRAWLER_PRESETS[rcCrawlerSim.presetIdx].name}`);
          } else {
            generateGentleVoxelMap(currentThemeIdx + dir);
            showToast(`MAPA: ${TERRAIN_THEMES[currentThemeIdx].name}`);
          }
        } else if (row === 2) {
          if (activeRomId === 'fpv_wing' || activeRomId === 'fpv_drone') {
            selectChoroboboCircuit(currentCircuitIdx + dir, activeSim, true);
          } else if (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat') {
            selectSailCourse((fcProfile.sailCourseIdx || 0) + dir);
            showToast(`REGATA: ${SAIL_COURSES[fcProfile.sailCourseIdx].name}`);
          } else if (activeRomId === 'rc_car') {
            selectRcCarTrack((fcProfile.carTrackIdx || 0) + dir);
            showToast(`PISTA: ${RC_CAR_TRACKS[fcProfile.carTrackIdx].name}`);
          } else {
            activeSim.reset();
            showToast('REINICIADO EN SALIDA!');
          }
        } else if (row === 3) {
          if (isLosSimId(activeRomId)) {
            activeSim.camMode = ((activeSim.camMode + dir) % 3 + 3) % 3;
            activeSim.chaseCam = (activeSim.camMode === 2);
            const cLbl = activeSim.camMode === 0 ? 'LOS AUTO-ZOOM' : (activeSim.camMode === 1 ? 'LOS WIDE' : 'FOLLOW 3D');
            showToast(`VISTA: ${cLbl}`);
          } else {
            activeSim.chaseCam = !activeSim.chaseCam;
            fpvDroneSim.chaseCam = activeSim.chaseCam;
            fpvWingSim.chaseCam  = activeSim.chaseCam;
            showToast(activeSim.chaseCam ? 'VISTA: FOLLOW 3D MODERNO' : 'VISTA: CABINA FPV');
          }
        } else if (row === 4) {
          applyWindPreset(fcProfile.windPresetIdx + dir);
          showToast(`CLIMA: ${fcProfile.wind.name} (${fcProfile.wind.baseKts}KT)`);
        } else if (row === 5) {
          rgTuningTab    = 1;
          rgTuningCursor = 0;
          showToast('MENU COMPLETO DE VIENTO Y OLAS');
        } else if (row === 6) {
          if (isLosSimId(activeRomId)) {
            fcProfile.losZoom = Math.max(0.50, Math.min(3.50, Math.round(((fcProfile.losZoom || 1.25) + dir * 0.25) * 100) / 100));
            showToast(`ZOOM CAMARA LOS: ${fcProfile.losZoom.toFixed(2)}X`);
          } else {
            const densities = [0.0, 0.5, 1.0];
            let curIdx = fcProfile.treeDensity <= 0.1 ? 0 : (fcProfile.treeDensity < 0.8 ? 1 : 2);
            curIdx = ((curIdx + dir) % 3 + 3) % 3;
            fcProfile.treeDensity = densities[curIdx];
            showToast(`ARBOLES: ${Math.round(fcProfile.treeDensity * 100)}%`);
          }
        } else if (row === 7) {
          fcProfile.aiBots = fcProfile.aiBots ? 0 : 1;
          showToast(fcProfile.aiBots ? 'RIVALES IA + BLE MP: ON' : 'MODO SOLO (IA OFF)');
        } else if (row === 8) {
          // Fila 8: Abrir el Selector Principal de Simuladores (Launcher)
          rgTuningOpen = false;
          rgOverlayOpen = false;
          osState = 'launcher';
          setFaceLabels('TEMA', 'CFG', 'BACK', 'RUN', 'UP/DN/TOUCH:ELEGIR SIMULADOR | A:INICIAR');
          showToast('SELECTOR DE SIMULADORES');
        }
      } else if (tab === 1) {
        // Pestaña 1 [WIND]: Menú Completo dedicado al Viento, Ráfagas, Turbulencia, Roles, Térmicas y Olas
        const wnd = fcProfile.wind;
        if (row === 0) {
          applyWindPreset(fcProfile.windPresetIdx + dir);
          showToast(`CLIMA: ${wnd.name} (${wnd.baseKts} KT)`);
        } else if (row === 1) {
          wnd.baseKts = Math.max(0.0, Math.min(30.0, Math.round((wnd.baseKts + dir * 1.0) * 10) / 10));
          syncCustomWindScale();
          showToast(`VIENTO BASE: ${wnd.baseKts} KT (${Math.round(wnd.baseKts * 1.852)} KMH)`);
        } else if (row === 2) {
          const nDirs = WIND_DIR_NAMES.length;
          fcProfile.windDirMode = (((fcProfile.windDirMode || 0) + dir) % nDirs + nDirs) % nDirs;
          showToast(`DIRECCION: ${WIND_DIR_NAMES[fcProfile.windDirMode]}`);
        } else if (row === 3) {
          wnd.gustPct = Math.max(0.0, Math.min(1.0, Math.round((wnd.gustPct + dir * 0.10) * 100) / 100));
          syncCustomWindScale();
          showToast(`RAFAGAS (GUSTS): ${Math.round(wnd.gustPct * 100)}%`);
        } else if (row === 4) {
          wnd.turbPct = Math.max(0.0, Math.min(1.0, Math.round((wnd.turbPct + dir * 0.10) * 100) / 100));
          syncCustomWindScale();
          showToast(`TURBULENCIA: ${Math.round(wnd.turbPct * 100)}%`);
        } else if (row === 5) {
          wnd.shiftDeg = Math.max(0, Math.min(40, wnd.shiftDeg + dir * 4));
          syncCustomWindScale();
          showToast(`ROLES DE DIRECCION: +/- ${wnd.shiftDeg} DEG`);
        } else if (row === 6) {
          wnd.thermalPct = Math.max(0.0, Math.min(1.0, Math.round((wnd.thermalPct + dir * 0.10) * 100) / 100));
          syncCustomWindScale();
          showToast(`TERMICAS / SHEAR: ${Math.round(wnd.thermalPct * 100)}%`);
        } else if (row === 7) {
          wnd.waveScale = Math.max(0.0, Math.min(2.0, Math.round((wnd.waveScale + dir * 0.20) * 100) / 100));
          syncCustomWindScale();
          showToast(`OLAS DEL AGUA: ${Math.round(wnd.waveScale * 100)}%`);
        } else if (row === 8) {
          applyWindPreset(fcProfile.windPresetIdx);
          showToast(`RESTAURADO: ${WIND_PRESETS[fcProfile.windPresetIdx].name}`);
        }
      } else if (tab === 2) {
        // Pestaña 2 [WING]: Modelo de Ala/Avión, Modo de Vuelo, Rates, Rudder, Expo, Carga Alar, Motor y Modo de Gas
        const w = fcProfile.wing;
        if (row === 0) {
          applyWingPreset(fcProfile.wingPresetIdx + dir);
          showToast(`${w.name} (${w.hasRudder ? 'CON RUDDER' : 'SIN RUDDER'})`);
        } else if (row === 1) {
          const modes = ['MANU', 'ACRO', 'HOR'];
          const nextIdx = ((modes.indexOf(fpvWingSim.mode) + dir) % modes.length + modes.length) % modes.length;
          fpvWingSim.mode = modes[nextIdx];
          showToast(`MODO ALA: ${fpvWingSim.mode}`);
        } else if (row === 2) {
          w.pitchRate = Math.max(90, Math.min(420, w.pitchRate + dir * 15));
        } else if (row === 3) {
          w.rollRate = Math.max(120, Math.min(540, w.rollRate + dir * 20));
        } else if (row === 4) {
          w.yawRate = Math.max(0, Math.min(240, w.yawRate + dir * 15));
          w.hasRudder = w.yawRate > 0 ? 1 : 0;
          if (w.hasRudder && !w.rudderRoll) w.rudderRoll = 0.30;
          showToast(w.hasRudder ? `RUDDER ACTIVO: ${w.yawRate} D/S` : 'ALA VOLANTE: SIN RUDDER');
        } else if (row === 5) {
          w.expo = Math.max(0.0, Math.min(0.80, Math.round((w.expo + dir * 0.04) * 100) / 100));
        } else if (row === 6) {
          w.wingLoad = Math.max(0.65, Math.min(1.50, Math.round((w.wingLoad + dir * 0.05) * 100) / 100));
        } else if (row === 7) {
          w.maxThrustAcc = Math.max(11.0, Math.min(30.0, Math.round((w.maxThrustAcc + dir * 1.5) * 10) / 10));
        } else if (row === 8) {
          w.thrHold = w.thrHold ? 0 : 1;
          if (rcInputConfig.thrMode === 2 || rcInputConfig.thrMode === 3) rcInputConfig.thrMode = 0;
          showToast(w.thrHold ? 'THR ALA: FIJO (STICK IZQ)' : 'THR ALA: DIRECTO (RESORTE)');
        }
      } else if (tab === 3) {
        // Pestaña 3 [DRON]: Preset, Modo de Vuelo, Rates P/R y Yaw, Expo, Masa, Potencia, Tilt de Cámara y AirMode
        const d = fcProfile.drone;
        if (row === 0) {
          applyDronePreset(fcProfile.dronePresetIdx + dir);
          showToast(`PRESET: ${d.name}`);
        } else if (row === 1) {
          fpvDroneSim.mode = fpvDroneSim.mode === 'ACRO' ? 'HOR' : 'ACRO';
          showToast(`MODO DRON: ${fpvDroneSim.mode}`);
        } else if (row === 2) {
          d.rcRate = Math.max(200, Math.min(960, d.rcRate + dir * 20));
          d.centerSens = Math.min(d.rcRate - 40, Math.max(70, Math.round(d.rcRate * 0.30)));
        } else if (row === 3) {
          d.yawRate = Math.max(100, Math.min(600, d.yawRate + dir * 20));
        } else if (row === 4) {
          d.expo = Math.max(0.0, Math.min(0.85, Math.round((d.expo + dir * 0.04) * 100) / 100));
        } else if (row === 5) {
          d.massKg = Math.max(0.35, Math.min(0.95, Math.round((d.massKg + dir * 0.04) * 100) / 100));
        } else if (row === 6) {
          d.maxThrustAcc = Math.max(20.0, Math.min(48.0, Math.round((d.maxThrustAcc + dir * 2.0) * 10) / 10));
        } else if (row === 7) {
          d.camTilt = Math.max(5, Math.min(45, d.camTilt + dir * 3));
        } else if (row === 8) {
          d.airMode = d.airMode ? 0 : 1;
        }
      } else {
        // Pestaña 4 [RC]: Mapeo de Emisora TX16S / Gamepad BT, Modo Throttle, Deadzone, Inversión, Calibrar y Launcher
        if (row === 0) {
          rcInputConfig.mapMode = ((rcInputConfig.mapMode + dir) % RC_MAP_NAMES.length + RC_MAP_NAMES.length) % RC_MAP_NAMES.length;
          showToast(`MAP: ${RC_MAP_NAMES[rcInputConfig.mapMode]}`);
        } else if (row === 1) {
          rcInputConfig.thrMode = ((rcInputConfig.thrMode + dir) % RC_THR_NAMES.length + RC_THR_NAMES.length) % RC_THR_NAMES.length;
          showToast(`THR: ${RC_THR_NAMES[rcInputConfig.thrMode]}`);
        } else if (row === 2) {
          rcInputConfig.deadzone = Math.max(0.0, Math.min(0.18, Math.round((rcInputConfig.deadzone + dir * 0.01) * 100) / 100));
        } else if (row === 3) {
          rcInputConfig.invThr *= -1;
        } else if (row === 4) {
          rcInputConfig.invYaw *= -1;
        } else if (row === 5) {
          rcInputConfig.invPit *= -1;
        } else if (row === 6) {
          rcInputConfig.invRol *= -1;
        } else if (row === 7) {
          calibrateControllerCenter();
          showToast('STICKS CENTRADOS OK');
        } else if (row === 8) {
          rgTuningOpen = false;
          rgOverlayOpen = false;
          osState = 'launcher';
          setFaceLabels('TEMA', 'CFG', 'BACK', 'RUN', 'UP/DN/TOUCH:ELEGIR SIMULADOR | A:INICIAR');
          showToast('SELECTOR DE SIMULADORES');
        }
      }
    }

    // Panel Derecho en 320x240 para la Pestaña 1 [WIND]: Rosa Náutica + Cono de Roles + Medidores de Rachas/Olas en Vivo
    function renderWindAnalyzerPanel320(gx0, gy0, gw, gh) {
      drawRoundedCard320(gx0, gy0, gw, gh, NIN565.PANEL, NIN565.BORDER);
      fillRect320(gx0 + 1, gy0 + 1, gw - 2, 14, NIN565.HEADER);
      drawOsdSmall320('WIND RADAR', gx0 + 6, gy0 + 5, NIN565.CYAN);

      // Rosa de los Vientos en el centro del panel
      const wcx = gx0 + (gw >> 1), wcy = gy0 + 62, wr = 32;
      for (let a = 0; a < 16; a++) {
        const ang = a * (Math.PI / 8.0);
        const rIn = (a & 3) === 0 ? wr - 4 : wr - 1;
        const x0 = wcx + Math.round(Math.cos(ang) * rIn);
        const y0 = wcy - Math.round(Math.sin(ang) * rIn);
        const x1 = wcx + Math.round(Math.cos(ang) * wr);
        const y1 = wcy - Math.round(Math.sin(ang) * wr);
        drawOutlinedLine320(x0, y0, x1, y1, (a & 3) === 0 ? NIN565.WHITE : NIN565.MUTED);
      }
      drawOsdSmall320('N', wcx - 2, wcy - wr - 7, NIN565.GOLD);
      drawOsdSmall320('S', wcx - 2, wcy + wr + 3, NIN565.MUTED);
      drawOsdSmall320('E', wcx + wr + 3, wcy - 3, NIN565.MUTED);
      drawOsdSmall320('W', wcx - wr - 6, wcy - 3, NIN565.MUTED);

      // Cono de oscilación (shiftDeg) y vector instantáneo del viento en vivo
      const wCfg    = fcProfile.wind;
      const dirMode = fcProfile.windDirMode || 0;
      const baseDir = dirMode === 0 ? (activeRomId === 'rc_sailboat' ? -1.28 : 1.12) : WIND_DIR_RADS[dirMode];
      if (wCfg.shiftDeg > 0 && wCfg.baseKts > 0.1) {
        const sRad = wCfg.shiftDeg * DEG2RAD;
        const a1 = baseDir - sRad, a2 = baseDir + sRad;
        drawOutlinedLine320(wcx, wcy, wcx + Math.round(Math.cos(a1) * (wr - 4)), wcy - Math.round(Math.sin(a1) * (wr - 4)), C565.ORANGE);
        drawOutlinedLine320(wcx, wcy, wcx + Math.round(Math.cos(a2) * (wr - 4)), wcy - Math.round(Math.sin(a2) * (wr - 4)), C565.ORANGE);
      }

      const liveMs  = Math.hypot(aeroEnv.windX, aeroEnv.windZ);
      const liveKts = liveMs * 1.944;
      const liveKmh = Math.round(liveMs * 3.6);
      if (liveMs > 0.15) {
        const wxN = aeroEnv.windX / liveMs, wzN = aeroEnv.windZ / liveMs;
        const lenPx = Math.max(8, Math.min(wr - 3, Math.round(8 + (liveKts / 25.0) * (wr - 10))));
        const tx = wcx + Math.round(wxN * lenPx), ty = wcy - Math.round(wzN * lenPx);
        const bx = wcx - Math.round(wxN * 10),    by = wcy + Math.round(wzN * 10);
        drawOutlinedLine320(bx, by, tx, ty, NIN565.CYAN);
        drawInavCircleDot320(tx, ty, 3, NIN565.GREEN);
      } else {
        drawInavCircleDot320(wcx, wcy, 2, NIN565.MUTED);
      }

      // Lecturas digitales de velocidad en Nudos (KT), KM/H y estado del mar
      fillRect320(gx0 + 4, gy0 + 106, gw - 8, 1, NIN565.BORDER);
      drawInavText320(`${liveKts.toFixed(1)}KT / ${liveKmh}KMH`, gx0 + 6, gy0 + 111, NIN565.GOLD);
      const seaStr = wCfg.waveScale <= 0.05 ? 'MAR: ESPEJO' : (wCfg.waveScale < 0.75 ? 'MAR: RIZADO' : (wCfg.waveScale < 1.35 ? 'MAR: MODERADO' : 'MAR: PICADO'));
      drawOsdSmall320(seaStr, gx0 + 6, gy0 + 127, NIN565.CYAN);
      const turbStr = wCfg.gustPct <= 0.02 && wCfg.turbPct <= 0.02 ? 'FLUJO LAMINAR' : `GUST ${Math.round(wCfg.gustPct * 100)}% TURB ${Math.round(wCfg.turbPct * 100)}%`;
      drawOsdSmall320(turbStr, gx0 + 6, gy0 + 137, NIN565.GREEN);
      drawOsdSmall320(`DIR: ${WIND_DIR_NAMES[dirMode]}`, gx0 + 6, gy0 + 147, NIN565.SILVER);
    }

    function renderWorldMinimapPanel320(gx0, gy0, gw, gh) {
      // Panel Derecho en 320x240 para [WORLD]: Radar Táctico Cenital adaptado al Simulador Activo
      drawRoundedCard320(gx0, gy0, gw, gh, NIN565.PANEL, NIN565.BORDER);
      fillRect320(gx0 + 1, gy0 + 1, gw - 2, 14, NIN565.HEADER);

      const sizeLbl = WORLD_W_M >= 1000 ? `${(WORLD_W_M / 1000).toFixed(1)}X${(WORLD_H_M / 1000).toFixed(1)}KM` : `${Math.round(WORLD_W_M)}X${Math.round(WORLD_H_M)}M`;
      drawOsdSmall320(`MAP ${sizeLbl}`, gx0 + 6, gy0 + 5, NIN565.CYAN);

      const rx0 = gx0 + 5, ry0 = gy0 + 19, rw = gw - 10, rh = 100;
      const rcx = rx0 + (rw >> 1), rcy = ry0 + (rh >> 1);
      const mapBg = (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat') ? rgb565(14, 48, 96) : (activeRomId === 'rc_crawler' ? rgb565(92, 42, 24) : (TERRAIN_THEMES[currentThemeIdx].isChorobobo ? rgb565(32, 46, 30) : rgb565(22, 36, 28)));
      drawRoundedCard320(rx0, ry0, rw, rh, mapBg, NIN565.BORDER);

      for (let d = -3; d <= 3; d++) {
        setPx320(rcx + d, rcy, NIN565.MUTED);
        setPx320(rcx, rcy + d, NIN565.MUTED);
      }

      const activeSim = getActiveSimObject();
      const spanX = (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat') ? 60.0 : (activeRomId === 'rc_car' ? 44.0 : (activeRomId === 'rc_crawler' ? 24.0 : WORLD_W_M * 0.46));
      const spanZ = (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat') ? 55.0 : (activeRomId === 'rc_car' ? 34.0 : (activeRomId === 'rc_crawler' ? 24.0 : WORLD_H_M * 0.46));
      const scaleX = (rw * 0.46) / spanX;
      const scaleZ = (rh * 0.46) / spanZ;

      if (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat') {
        drawOutlinedLine320(rcx, Math.round(rcy + 30 * scaleZ), rcx, Math.round(rcy + 23 * scaleZ), C565.ORANGE);
        for (let i = 0; i < SAIL_BUOYS.length; i++) {
          const b = SAIL_BUOYS[i];
          const bx = Math.round(rcx + b.x * scaleX);
          const by = Math.round(rcy - b.z * scaleZ);
          drawInavCircleDot320(bx, by, i === activeSim.activeBuoy ? 2 : 1, i === activeSim.activeBuoy ? NIN565.GREEN : NIN565.GOLD);
        }
      } else if (activeRomId === 'rc_crawler') {
        for (let i = 0; i < CRAWLER_GATES.length; i++) {
          const g = CRAWLER_GATES[i];
          const gx = Math.round(rcx + g.x * scaleX);
          const gy = Math.round(rcy - (g.z - 5.0) * scaleZ);
          drawInavCircleDot320(gx, gy, i === rcCrawlerSim.activeGate ? 2 : 1, i === rcCrawlerSim.activeGate ? NIN565.GREEN : NIN565.GOLD);
        }
      } else if (activeRomId === 'rc_car') {
        for (let i = 0; i < RC_TRACK_WPS.length; i++) {
          const a = RC_TRACK_WPS[i];
          const b = RC_TRACK_WPS[(i + 1) % RC_TRACK_WPS.length];
          const ax0 = Math.round(rcx + a.x * scaleX), ay0 = Math.round(rcy - a.z * scaleZ);
          const bx0 = Math.round(rcx + b.x * scaleX), by0 = Math.round(rcy - b.z * scaleZ);
          drawOutlinedLine320(ax0, ay0, bx0, by0, NIN565.WHITE);
          if (i === rcCarSim.activeGate) drawInavCircleDot320(ax0, ay0, 2, NIN565.GREEN);
        }
      } else {
        for (let i = 0; i < WORLD_BUILDINGS.length; i++) {
          const b = WORLD_BUILDINGS[i];
          const bx = Math.round(rcx + b.x * scaleX);
          const by = Math.round(rcy - b.z * scaleZ);
          if (bx > rx0 + 1 && bx < rx0 + rw - 1 && by > ry0 + 1 && by < ry0 + rh - 1) {
            setPx320(bx, by, C565.ORANGE);
            setPx320(bx + 1, by, C565.ORANGE);
          }
        }
        if (!isFreeFlightNoGates()) {
          const circuit = CHOROBOBO_CIRCUITS[currentCircuitIdx];
          const sPts = circuit.splinePts;
          for (let i = 0; i < sPts.length; i++) {
            const sp = sPts[i];
            const sx = Math.round(rcx + sp.x * scaleX);
            const sy = Math.round(rcy - sp.z * scaleZ);
            if (sx > rx0 && sx < rx0 + rw && sy > ry0 && sy < ry0 + rh) {
              setPx320(sx, sy, circuit.lineCol565);
            }
          }
          const gates = circuit.gates;
          for (let i = 0; i < gates.length; i++) {
            const g = gates[i];
            const gx = Math.round(rcx + g.x * scaleX);
            const gy = Math.round(rcy - g.z * scaleZ);
            if (gx > rx0 + 1 && gx < rx0 + rw - 1 && gy > ry0 + 1 && gy < ry0 + rh - 1) {
              const isAct = (i === activeSim.activeGate);
              const gCol = isAct ? NIN565.GREEN : NIN565.WHITE;
              setPx320(gx, gy, gCol);
              if (isAct) {
                setPx320(gx - 1, gy, gCol); setPx320(gx + 1, gy, gCol);
                setPx320(gx, gy - 1, gCol); setPx320(gx, gy + 1, gCol);
              }
            }
          }
        }
      }

      // Posición y rumbo actual del modelo activo
      const ax = Math.max(rx0 + 3, Math.min(rx0 + rw - 3, Math.round(rcx + activeSim.px * scaleX)));
      const ay = Math.max(ry0 + 3, Math.min(ry0 + rh - 3, Math.round(rcy - activeSim.pz * scaleZ)));
      const hLen = Math.hypot(activeSim.fx, activeSim.fz) || 1.0;
      const hx = activeSim.fx / hLen, hz = activeSim.fz / hLen;
      drawOutlinedLine320(ax, ay, Math.round(ax + hx * 6), Math.round(ay - hz * 6), NIN565.GOLD);
      drawInavCircleDot320(ax, ay, 2, NIN565.WHITE);

      const windMs  = Math.hypot(aeroEnv.windX, aeroEnv.windZ);
      const windKmh = Math.round(windMs * 3.6);
      drawOsdSmall320(`WIND: ${windKmh} KMH`, gx0 + 6, gy0 + 126, NIN565.GOLD);
      const subStatus = activeRomId === 'rc_sailboat' ? '6 BUOYS BAY' : (activeRomId === 'rc_car' ? '12 WP TRACK' : (isFreeFlightNoGates() ? 'FREE FLIGHT' : `${CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode}: 15 GATES`));
      drawOsdSmall320(subStatus, gx0 + 6, gy0 + 138, NIN565.GREEN);
      drawOsdSmall320(`ALT: ${Math.round(activeSim.py)}M`, gx0 + 6, gy0 + 149, NIN565.SILVER);

      const wcx = gx0 + gw - 16, wcy = gy0 + 139;
      drawInavCircleDot320(wcx, wcy, 9, NIN565.CARD);
      if (windMs > 0.2) {
        const wxN = aeroEnv.windX / windMs, wzN = aeroEnv.windZ / windMs;
        drawOutlinedLine320(wcx - Math.round(wxN * 6), wcy + Math.round(wzN * 6), wcx + Math.round(wxN * 7), wcy - Math.round(wzN * 7), NIN565.CYAN);
        setPx320(wcx + Math.round(wxN * 7), wcy - Math.round(wzN * 7), NIN565.GOLD);
      }
    }

    function updateAndRenderTuningMenu(dt) {
      if (navCooldown > 0) navCooldown -= dt;
      const numRows = 9;
      const numTabs = 5; // 0 = WORLD, 1 = WIND, 2 = WING, 3 = DRONE, 4 = RC

      // Interacción táctil directa sobre la pantalla IPS 320x240
      if (capTouch.justTapped) {
        const tx = capTouch.x320, ty = capTouch.y240;
        if (ty <= 26) {
          if (tx < 56)       { rgTuningTab = 0; playTone(640, 0.03); }
          else if (tx < 108) { rgTuningTab = 1; playTone(640, 0.03); }
          else if (tx < 160) { rgTuningTab = 2; playTone(640, 0.03); }
          else if (tx < 214) { rgTuningTab = 3; playTone(640, 0.03); }
          else if (tx < 264) { rgTuningTab = 4; playTone(640, 0.03); }
          else { rgTuningOpen = false; rgOverlayOpen = false; playTone(520, 0.03); capTouch.justTapped = false; return; }
        } else if (ty >= 28 && ty <= 210 && tx <= 202) {
          const clickedRow = Math.floor((ty - 28) / 20);
          if (clickedRow >= 0 && clickedRow < numRows) {
            if (rgTuningCursor === clickedRow) {
              adjustTuningParameter(rgTuningTab, rgTuningCursor, tx > 110 ? 1 : -1);
            } else {
              rgTuningCursor = clickedRow;
              playTone(480, 0.02);
            }
          }
        } else if (ty > 210) {
          if (tx < 54) adjustTuningParameter(rgTuningTab, rgTuningCursor, -1);
          else if (tx < 108) adjustTuningParameter(rgTuningTab, rgTuningCursor, 1);
          else if (tx < 185) {
            rgTuningOpen = false;
            rgOverlayOpen = false;
            osState = 'launcher';
            showToast('SIM SELECTOR');
            playTone(700, 0.04);
            capTouch.justTapped = false;
            return;
          } else {
            rgTuningOpen = false;
            rgOverlayOpen = false;
            playTone(760, 0.04);
            capTouch.justTapped = false;
            return;
          }
        }
        capTouch.justTapped = false;
      }

      // En la pestaña [RC] (tab 4) dejamos libres los sticks analógicos para poder probarlos en las barras PWM sin mover el cursor
      const navY = rgTuningTab === 4 ? 0 : (isRadioThrottleActive() ? hwInput.ry : hwInput.ly);
      const navX = rgTuningTab === 4 ? 0 : hwInput.lx;

      if (navCooldown <= 0) {
        if (navY < -0.45 || hwInput.justPressed('DOWN')) {
          rgTuningCursor = (rgTuningCursor + 1) % numRows;
          navCooldown = 0.16;
          playTone(480, 0.02);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgTuningCursor = (rgTuningCursor - 1 + numRows) % numRows;
          navCooldown = 0.16;
          playTone(480, 0.02);
        } else if (navX > 0.50 || hwInput.justPressed('RIGHT') || hwInput.justPressed('A')) {
          adjustTuningParameter(rgTuningTab, rgTuningCursor, 1);
          navCooldown = 0.16;
        } else if (navX < -0.50 || hwInput.justPressed('LEFT')) {
          adjustTuningParameter(rgTuningTab, rgTuningCursor, -1);
          navCooldown = 0.16;
        }
      }

      if (hwInput.justPressed('Y')) {
        rgTuningTab = (rgTuningTab + 1) % numTabs;
        playTone(640, 0.03);
      }
      if (hwInput.justPressed('SELECT')) {
        rgTuningOpen = false;
        rgOverlayOpen = false;
        osState = 'launcher';
        showToast('SIM SELECTOR');
        playTone(700, 0.04);
        return;
      }
      if (hwInput.justPressed('X')) {
        if (rgTuningTab === 0) resetWorldDefaults();
        else if (rgTuningTab === 1) applyWindPreset(fcProfile.windPresetIdx);
        else if (rgTuningTab === 2) applyWingPreset(fcProfile.wingPresetIdx);
        else if (rgTuningTab === 3) applyDronePreset(fcProfile.dronePresetIdx);
        else calibrateControllerCenter();
        showToast(rgTuningTab === 4 ? 'STICKS CENTERED' : 'DEFAULTS RESTORED');
        playTone(580, 0.04);
      }
      if (hwInput.justPressed('B')) {
        rgTuningOpen = false;
        rgOverlayOpen = false;
        playTone(740, 0.04);
        return;
      }

      // Fondo limpio Nintendo Switch Dark Matte en 320x240
      fillRect320(0, 0, DISP_W, DISP_H, NIN565.BG_DARK);
      fillRect320(0, 0, DISP_W, 25, NIN565.HEADER);
      fillRect320(0, 25, DISP_W, 1, NIN565.BORDER);

      // 5 Pestañas superiores tipo píldora Nintendo Switch + botón [FLY]
      const tabNames = ['WORLD', 'WIND', 'WING', 'DRONE', 'RC'];
      const tabX     = [5, 58, 107, 156, 212];
      const tabW     = [50, 46, 46, 53, 38];
      for (let t = 0; t < 5; t++) {
        const isAct = (rgTuningTab === t);
        drawRoundedCard320(tabX[t], 4, tabW[t], 17, isAct ? NIN565.RED : NIN565.CARD, isAct ? NIN565.RED_HI : NIN565.BORDER);
        const tw = tabNames[t].length * 6;
        drawInavText320(tabNames[t], tabX[t] + ((tabW[t] - tw) >> 1), 8, isAct ? NIN565.WHITE : NIN565.SILVER);
      }
      drawRoundedCard320(256, 4, 58, 17, NIN565.GREEN, NIN565.BORDER_HI);
      drawInavText320('FLY >', 271, 8, NIN565.WHITE);

      // Preparar filas de parámetros (Etiqueta izquierda + Valor derecha + Barra opcional)
      const d   = fcProfile.drone;
      const w   = fcProfile.wing;
      const wnd = fcProfile.wind;
      const activeSim = getActiveSimObject();
      const mapShort = ['AUTO', 'TX16S AETR', 'PAD MODE2', 'RC TAER', 'BT PAD'][rcInputConfig.mapMode];
      const thrShort = ['AUTO', 'RADIO 0-100', 'STICKY INC', 'SPRING'][rcInputConfig.thrMode];
      const treeLbl  = fcProfile.treeDensity >= 0.9 ? 'HIGH 100%' : (fcProfile.treeDensity >= 0.4 ? 'MED 50%' : 'OFF');

      const row1World = activeRomId === 'rc_sailboat'
        ? `BOAT:${SAIL_PRESETS[rcSailboatSim.presetIdx].name.slice(0, 14)}`
        : (activeRomId === 'rc_boat'
          ? `BOAT:${RC_BOAT_PRESETS[rcBoatSim.presetIdx].name.slice(0, 14)}`
          : (activeRomId === 'rc_car'
            ? `CAR :${RC_CAR_PRESETS[rcCarSim.presetIdx].name.slice(0, 14)}`
            : (activeRomId === 'rc_crawler'
              ? `RIG :${RC_CRAWLER_PRESETS[rcCrawlerSim.presetIdx].name.slice(0, 14)}`
              : `MAP :${TERRAIN_THEMES[currentThemeIdx].name.slice(0, 14)}`)));

      const row2World = (activeRomId === 'rc_sailboat' || activeRomId === 'rc_boat')
        ? `RACE:${SAIL_COURSES[fcProfile.sailCourseIdx || 0].name.slice(0, 14)}`
        : (activeRomId === 'rc_car'
          ? `TRK :${RC_CAR_TRACKS[fcProfile.carTrackIdx || 0].name.slice(0, 14)}`
          : (activeRomId === 'rc_crawler'
            ? `TRL :10 ROCK GATES`
            : `CIRC:${getActiveCircuitLabel().slice(0, 14)}`));

      const row3View = isLosSimId(activeRomId)
        ? `VIEW:${activeSim.camMode === 0 ? 'LOS AUTO' : (activeSim.camMode === 1 ? 'LOS WIDE' : 'FOLLOW 3D')}`
        : `VIEW:${activeSim.chaseCam ? 'FOLLOW 3D' : 'FPV COCKPIT'}`;

      const labels = rgTuningTab === 0 ? [
        `SIM :${(PLAYABLE_SIM_NAMES[activeRomId] || 'FPV WING').slice(0, 14)}`,
        row1World,
        row2World,
        row3View,
        `WIND:${wnd.name.slice(0, 9)} ${wnd.baseKts.toFixed(0)}KT`,
        `TUNE:OPEN WIND LAB`,
        isLosSimId(activeRomId) ? `ZOOM:${(fcProfile.losZoom || 1.25).toFixed(2)}X` : `TREE:${treeLbl}`,
        `RIVL:${fcProfile.aiBots ? 'AI + BLE ON' : 'SOLO OFF'}`,
        `HOME:SIM SELECTOR`
      ] : (rgTuningTab === 1 ? [
        `PSET:${wnd.name.slice(0, 14)}`,
        `SPD :${wnd.baseKts.toFixed(0)}KT (${Math.round(wnd.baseKts * 1.852)}KMH)`,
        `DIR :${WIND_DIR_NAMES[fcProfile.windDirMode || 0].slice(0, 14)}`,
        `GUST:${Math.round(wnd.gustPct * 100)}%`,
        `TURB:${Math.round(wnd.turbPct * 100)}%`,
        `SHFT:+/-${wnd.shiftDeg} DEG`,
        `THER:${Math.round(wnd.thermalPct * 100)}%`,
        `WAVE:${Math.round(wnd.waveScale * 100)}%`,
        `REST:RESET PRESET`
      ] : (rgTuningTab === 2 ? [
        `WING:${w.name.slice(0, 14)}`,
        `MODE:${fpvWingSim.mode}`,
        `PITC:${w.pitchRate} D/S`,
        `ROLL:${w.rollRate} D/S`,
        `RUDD:${w.hasRudder && w.yawRate > 0 ? w.yawRate + ' D/S' : 'OFF'}`,
        `EXPO:${Math.round(w.expo * 100)}%`,
        `LOAD:${Math.round(w.wingLoad * 100)}%`,
        `POWR:${Math.round(w.maxThrustAcc)} M/S2`,
        `THRL:${w.thrHold ? 'STICKY' : 'SPRING'}`
      ] : (rgTuningTab === 3 ? [
        `QUAD:${d.name.slice(0, 14)}`,
        `MODE:${fpvDroneSim.mode}`,
        `RATE:${d.rcRate} D/S`,
        `YAW :${d.yawRate} D/S`,
        `EXPO:${Math.round(d.expo * 100)}%`,
        `MASS:${Math.round(d.massKg * 1000)}G`,
        `POWR:${Math.round(d.maxThrustAcc)} M/S2`,
        `TILT:${d.camTilt} DEG`,
        `AIRM:${d.airMode ? 'ON (BF)' : 'OFF'}`
      ] : [
        `MAP :${mapShort}`,
        `THRL:${thrShort}`,
        `DEAD:${Math.round(rcInputConfig.deadzone * 100)}%`,
        `INVT:${rcInputConfig.invThr > 0 ? 'NORMAL' : 'INVERT'}`,
        `INVY:${rcInputConfig.invYaw > 0 ? 'NORMAL' : 'INVERT'}`,
        `INVP:${rcInputConfig.invPit > 0 ? 'NORMAL' : 'INVERT'}`,
        `INVR:${rcInputConfig.invRol > 0 ? 'NORMAL' : 'INVERT'}`,
        `CAL :CENTER STICKS`,
        `HOME:SIM SELECTOR`
      ])));

      for (let i = 0; i < numRows; i++) {
        const ry = 29 + i * 20;
        const isSel = (i === rgTuningCursor);
        const raw = labels[i];
        const sep = raw.indexOf(':');
        const keyStr = sep >= 0 ? raw.slice(0, sep).trim() : raw;
        const valStr = sep >= 0 ? raw.slice(sep + 1).trim() : '';

        if (isSel) {
          drawRoundedCard320(6, ry, 194, 19, NIN565.CARD_SEL, NIN565.BORDER_HI);
          fillRect320(7, ry + 3, 3, 13, NIN565.RED);
        } else {
          fillRect320(6, ry, 194, 18, (i & 1) === 0 ? NIN565.PANEL : NIN565.BG_DARK);
        }

        drawOsdSmall320(keyStr, 14, ry + 7, isSel ? NIN565.CYAN : NIN565.MUTED);
        const valW = valStr.length * 6;
        const valX = Math.max(52, 194 - valW);
        drawInavText320(valStr, valX, ry + 5, isSel ? NIN565.GOLD : NIN565.WHITE);
      }

      // Panel derecho (x = 204..314, y = 29..208)
      if (rgTuningTab === 0) {
        renderWorldMinimapPanel320(204, 29, 110, 178);
      } else if (rgTuningTab === 1) {
        renderWindAnalyzerPanel320(204, 29, 110, 178);
      } else if (rgTuningTab === 4) {
        // Panel Derecho en 320x240 para [RC]: Monitor de Canales PWM (1000..2000 us)
        const gx0 = 204, gy0 = 29, gw = 110, gh = 178;
        drawRoundedCard320(gx0, gy0, gw, gh, NIN565.PANEL, NIN565.BORDER);
        fillRect320(gx0 + 1, gy0 + 1, gw - 2, 14, NIN565.HEADER);
        drawOsdSmall320(rcInputConfig.padShortName.slice(0, 14), gx0 + 6, gy0 + 5, rcInputConfig.connected ? NIN565.GREEN : C565.ORANGE);

        if (isWingStickyThrottleActive() && Math.abs(hwInput.ly) > 0.10) {
          const dStick = (hwInput.ly > 0 ? (hwInput.ly - 0.10) : (hwInput.ly + 0.10)) / 0.90;
          fpvWingSim.thrLatch = Math.max(0.0, Math.min(1.0, fpvWingSim.thrLatch + dStick * 0.72 * dt));
        }
        const thrNorm01 = isWingStickyThrottleActive() ? fpvWingSim.thrLatch : evalRcThrottle(0.5);
        const chNames = ['THR', 'ROL', 'PIT', 'YAW'];
        const chVals  = [thrNorm01 * 2.0 - 1.0, hwInput.rx, hwInput.ry, hwInput.lx];
        const chCols  = [C565.ORANGE, NIN565.CYAN, NIN565.GREEN, NIN565.GOLD];

        for (let c = 0; c < 4; c++) {
          const by = gy0 + 22 + c * 28;
          const val = Math.max(-1.0, Math.min(1.0, chVals[c]));
          const us  = Math.round(1500 + val * 500);
          drawOsdSmall320(chNames[c], gx0 + 6, by, NIN565.SILVER);
          drawOsdSmall320(`${us}`, gx0 + gw - 30, by, NIN565.WHITE);
          drawSliderBar320(gx0 + 6, by + 9, gw - 12, (val + 1.0) * 0.5, chCols[c]);
        }

        const a0 = Math.round(rcInputConfig.rawAxes[0] * 100);
        const a1 = Math.round(rcInputConfig.rawAxes[1] * 100);
        const a2 = Math.round(rcInputConfig.rawAxes[2] * 100);
        const a3 = Math.round(rcInputConfig.rawAxes[3] * 100);
        fillRect320(gx0 + 4, gy0 + 138, gw - 8, 1, NIN565.BORDER);
        drawOsdSmall320(`A0:${a0}  A1:${a1}`, gx0 + 6, gy0 + 145, NIN565.CYAN);
        drawOsdSmall320(`A2:${a2}  A3:${a3}`, gx0 + 6, gy0 + 157, NIN565.CYAN);
      } else {
        // Panel Derecho en 320x240 para [WING] (tab 2) y [DRONE] (tab 3): Curva SuperExpo / Actual Rates
        const isDroneTab = (rgTuningTab === 3);
        const gx0 = 204, gy0 = 29, gw = 110, gh = 178;
        drawRoundedCard320(gx0, gy0, gw, gh, NIN565.PANEL, NIN565.BORDER);
        fillRect320(gx0 + 1, gy0 + 1, gw - 2, 14, NIN565.HEADER);
        drawOsdSmall320('RATES CURVE', gx0 + 6, gy0 + 5, NIN565.CYAN);

        const rx0 = gx0 + 6, ry0 = gy0 + 20, rw = gw - 12, rh = 96;
        const gcx = rx0 + (rw >> 1), gcy = ry0 + (rh >> 1);
        drawRoundedCard320(rx0, ry0, rw, rh, NIN565.BG_DARK, NIN565.BORDER);
        for (let y = ry0 + 1; y < ry0 + rh - 1; y++) setPx320(gcx, y, NIN565.BORDER);
        for (let x = rx0 + 1; x < rx0 + rw - 1; x++) setPx320(x, gcy, NIN565.BORDER);

        const maxRateRef = isDroneTab ? 960.0 : 540.0;
        const curMaxRate = isDroneTab ? d.rcRate : w.rollRate;
        const curCenter  = isDroneTab ? d.centerSens : w.rollRate * (1.0 - w.expo);
        const curExpo    = isDroneTab ? d.expo : w.expo;

        let prevPy = gcy;
        for (let px = 1; px < rw - 1; px++) {
          const rcVal = (px / (rw * 0.5)) - 1.0;
          const rateDeg = evalActualRateRad(rcVal, curCenter, curMaxRate, curExpo) * RAD2DEG;
          const normY = Math.max(-1.0, Math.min(1.0, rateDeg / maxRateRef));
          const py = Math.round(gcy - normY * (rh * 0.44));
          const sx = rx0 + px;
          const yMin = Math.min(prevPy, py), yMax = Math.max(prevPy, py);
          for (let y = yMin; y <= yMax; y++) {
            setPx320(sx, y, NIN565.GREEN);
            setPx320(sx, Math.min(ry0 + rh - 2, y + 1), NIN565.GREEN);
          }
          prevPy = py;
        }

        const liveStick = Math.abs(hwInput.rx) >= Math.abs(hwInput.ry) ? hwInput.rx : hwInput.ry;
        const liveRateDeg = Math.round(evalActualRateRad(liveStick, curCenter, curMaxRate, curExpo) * RAD2DEG);
        const dotX = Math.round(gcx + liveStick * (rw * 0.45));
        const dotY = Math.round(gcy - Math.max(-1.0, Math.min(1.0, liveRateDeg / maxRateRef)) * (rh * 0.44));
        drawInavCircleDot320(dotX, dotY, 3, NIN565.GOLD);

        drawInavText320(`${Math.abs(liveRateDeg)} D/S`, gx0 + 8, gy0 + 124, NIN565.GOLD);
        drawOsdSmall320(isDroneTab ? `TWR: ${(d.maxThrustAcc / 9.81).toFixed(1)}:1` : `STALL: ${(8.8 * Math.sqrt(w.wingLoad)).toFixed(1)}M/S`, gx0 + 8, gy0 + 141, NIN565.WHITE);
        drawOsdSmall320('TEST RIGHT STICK', gx0 + 8, gy0 + 155, NIN565.GREEN);
      }

      // Barra inferior de controles estilo Nintendo Switch
      fillRect320(0, 213, DISP_W, 27, NIN565.HEADER);
      fillRect320(0, 213, DISP_W, 1, NIN565.BORDER);

      drawRoundedCard320(6, 217, 44, 19, NIN565.CARD, NIN565.BORDER);
      drawInavText320('- DEC', 13, 222, NIN565.SILVER);
      drawRoundedCard320(54, 217, 44, 19, NIN565.CARD, NIN565.BORDER);
      drawInavText320('+ INC', 61, 222, NIN565.WHITE);

      drawBtnPrompt320(114, 221, 'Y', NIN565.GREEN, 'TAB');
      drawBtnPrompt320(164, 221, 'X', NIN565.CYAN, 'DEF');
      drawBtnPrompt320(214, 221, 'B', NIN565.GOLD, 'RESUME');
    }

    function updateAndRenderRetroGoOverlay(dt) {
      updateAndRenderTuningMenu(dt);
    }

    // CARTUCHO DIAGNÓSTICO: ILI9341V SPI + FT6336 TOUCH + ADC DIAGNOSTIC
    function renderHwDiagnostic() {
      fillRect320(0, 0, DISP_W, DISP_H, NIN565.BG_DARK);
      fillRect320(0, 0, DISP_W, 24, NIN565.HEADER);
      fillRect320(0, 24, DISP_W, 1, NIN565.BORDER);
      drawPillBadge320(6, 5, 'HW TEST', NIN565.RED, NIN565.WHITE);
      drawInavText320('S3 ILI9341V + FT6336 + ADC', 56, 7, NIN565.WHITE);

      drawRoundedCard320(12, 34, 82, 82, NIN565.PANEL, NIN565.BORDER);
      const lxPx = 53 + Math.round(hwInput.lx * 34), lyPx = 75 - Math.round(hwInput.ly * 34);
      drawOutlinedLine320(53, 75, lxPx, lyPx, NIN565.CYAN);
      drawInavCircleDot320(lxPx, lyPx, 3, NIN565.GOLD);
      drawOsdSmall320(`L3:${hwInput.btn.L3 ? 1 : 0}`, 16, 120, hwInput.btn.L3 ? NIN565.GREEN : NIN565.SILVER);

      drawRoundedCard320(226, 34, 82, 82, NIN565.PANEL, NIN565.BORDER);
      const rxPx = 267 + Math.round(hwInput.rx * 34), ryPx = 75 - Math.round(hwInput.ry * 34);
      drawOutlinedLine320(267, 75, rxPx, ryPx, NIN565.CYAN);
      drawInavCircleDot320(rxPx, ryPx, 3, NIN565.GOLD);
      drawOsdSmall320(`R3:${hwInput.btn.R3 ? 1 : 0}`, 230, 120, hwInput.btn.R3 ? NIN565.GREEN : NIN565.SILVER);

      const btns = ['Y', 'X', 'B', 'A'];
      for (let i = 0; i < 4; i++) {
        const bx = 108 + i * 26, pressed = hwInput.btn[btns[i]];
        drawRoundedCard320(bx, 38, 22, 22, pressed ? NIN565.RED : NIN565.CARD, NIN565.BORDER_HI);
        drawInavText320(btns[i], bx + 8, 45, NIN565.WHITE);
      }

      const dpad = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
      const dLbl = ['U', 'D', 'L', 'R'];
      for (let i = 0; i < 4; i++) {
        const bx = 108 + i * 26, pressed = hwInput.btn[dpad[i]];
        drawRoundedCard320(bx, 66, 22, 22, pressed ? NIN565.CYAN : NIN565.CARD, NIN565.BORDER_HI);
        drawInavText320(dLbl[i], bx + 8, 73, NIN565.WHITE);
      }

      const mode = SPI_MODES[paletteIdx];
      const dmaMs = (1228800 / (mode.spiMhz * 1e6) * 1000).toFixed(1);
      drawInavText320(`SPI: ${mode.spiMhz}MHZ (${dmaMs}MS)`, 104, 102, NIN565.GREEN);
      drawInavText320(`TOUCH: ${capTouch.x320},${capTouch.y240}`, 104, 118, capTouch.active ? NIN565.GOLD : NIN565.SILVER);

      fillRect320(0, 214, DISP_W, 26, NIN565.HEADER);
      drawInavText320(rcInputConfig.connected ? `RC: ${rcInputConfig.padShortName} OK` : 'RC: CONNECT USB / BT CONTROLLER', 10, 223, rcInputConfig.connected ? NIN565.GREEN : NIN565.GOLD);

      if (capTouch.active) {
        drawInavCircleDot320(capTouch.x320, capTouch.y240, 5, NIN565.RED);
      }
      if (hwInput.justPressed('SELECT') || hwInput.justPressed('B')) {
        osState = 'launcher';
      }
    }

    /***************************************************************************
     * 8. BUCLE PRINCIPAL DE SISTEMA RETRO-GO (CON SIMULADOR SPI DMA ILI9341V)
     ***************************************************************************/
    const btnPaletteEl = document.getElementById('btnPalette');
    if (btnPaletteEl) {
      btnPaletteEl.addEventListener('click', (e) => {
        paletteIdx = (paletteIdx + 1) % SPI_MODES.length;
        const m = SPI_MODES[paletteIdx];
        e.currentTarget.textContent = m.name;
        showToast(m.name);
      });
    }
    const btnSoundEl = document.getElementById('btnSound');
    if (btnSoundEl) {
      btnSoundEl.addEventListener('click', () => toggleSoundSynth());
    }
    const btnBleMpEl = document.getElementById('btnBleMp');
    if (btnBleMpEl) {
      btnBleMpEl.addEventListener('click', () => connectWebBluetoothPeer());
    }

    let lastTime = performance.now();
    let fpsFrames = 0;
    let fpsClock = performance.now();

    function retroGoMainLoop(now) {
      requestAnimationFrame(retroGoMainLoop);

      try {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000.0));
        lastTime = now;

        updateInputPolling();

        if (osState === 'boot') {
          updateAndRenderRetroGoBoot(dt);
        } else if (osState === 'launcher') {
          updateAndRenderRetroGoLauncher(dt);
        } else if (osState === 'ingame') {
          if (hwInput.justPressed('MENU')) {
            if (rgOverlayOpen) {
              rgOverlayOpen = false;
              rgTuningOpen = false;
            } else {
              rgOverlayOpen = true;
              rgTuningOpen = true;
            }
            playTone(600, 0.04);
          }

          if (!rgOverlayOpen) {
            if (activeRomId === 'fpv_drone') {
              if (!handleInFlightShortcuts(fpvDroneSim)) {
                for (let s = 0; s < 4; s++) fpvDroneSim.step(dt * 0.25);
              }
              fpvDroneSim.render();
            } else if (activeRomId === 'fpv_wing') {
              if (!handleInFlightShortcuts(fpvWingSim)) {
                for (let s = 0; s < 4; s++) fpvWingSim.step(dt * 0.25);
              }
              fpvWingSim.render();
            } else if (activeRomId === 'rc_sailboat') {
              if (!handleInFlightShortcuts(rcSailboatSim)) {
                for (let s = 0; s < 4; s++) rcSailboatSim.step(dt * 0.25);
              }
              rcSailboatSim.render();
            } else if (activeRomId === 'rc_boat') {
              if (!handleInFlightShortcuts(rcBoatSim)) {
                for (let s = 0; s < 4; s++) rcBoatSim.step(dt * 0.25);
              }
              rcBoatSim.render();
            } else if (activeRomId === 'rc_car') {
              if (!handleInFlightShortcuts(rcCarSim)) {
                for (let s = 0; s < 4; s++) rcCarSim.step(dt * 0.25);
              }
              rcCarSim.render();
            } else if (activeRomId === 'rc_crawler') {
              if (!handleInFlightShortcuts(rcCrawlerSim)) {
                for (let s = 0; s < 4; s++) rcCrawlerSim.step(dt * 0.25);
              }
              rcCrawlerSim.render();
            } else if (activeRomId === 'hwtest') {
              renderHwDiagnostic();
            }
          } else {
            if (activeRomId === 'fpv_drone') fpvDroneSim.render();
            else if (activeRomId === 'fpv_wing') fpvWingSim.render();
            else if (activeRomId === 'rc_sailboat') rcSailboatSim.render();
            else if (activeRomId === 'rc_boat') rcBoatSim.render();
            else if (activeRomId === 'rc_car') rcCarSim.render();
            else if (activeRomId === 'rc_crawler') rcCrawlerSim.render();
            else if (activeRomId === 'hwtest') renderHwDiagnostic();

            updateAndRenderRetroGoOverlay(dt);
          }
        }

        updatePhysicalSynthAudio(dt);
        stepAndBroadcastBleMp(dt);

        if (toastTimer > 0) {
          toastTimer -= dt;
          renderNintendoToast320(toastMsg);
        }

        fbPresentToCanvas();
        snapshotPrevButtons();
        capTouch.justTapped = false;

        fpsFrames++;
        if (now - fpsClock >= 500) {
          const rawFps = Math.round((fpsFrames * 1000) / (now - fpsClock));
          const mode = SPI_MODES[paletteIdx];
          const dispFps = Math.min(rawFps, mode.targetFps);
          document.getElementById('uiFpsBattery').textContent = `${dispFps}FPS | SPI ${mode.spiMhz}MHz`;
          fpsFrames = 0;
          fpsClock = now;
        }
      } catch (err) {
        console.error('Frame error recovered:', err);
      }
    }

    requestAnimationFrame(retroGoMainLoop);
  </script>
</body>
</html>
