        const nxt = (i + 1) % RC_NUM_WPS;
        const yA  = getTerrainHeightMeters(RC_TRACK_WPS[i].x,   RC_TRACK_WPS[i].z)   + 0.12;
        const yB  = getTerrainHeightMeters(RC_TRACK_WPS[nxt].x, RC_TRACK_WPS[nxt].z) + 0.12;
        const isNextSeg = (i === sim.activeGate || nxt === sim.activeGate);
        const edgeCol   = isNextSeg ? 3 : 1; // 3 = Verde brillante en el tramo activo, 1 = Blanco en el resto
        projLine(RC_EDGE_IN_X[i],  yA, RC_EDGE_IN_Z[i],  RC_EDGE_IN_X[nxt],  yB, RC_EDGE_IN_Z[nxt],  0, edgeCol);
        projLine(RC_EDGE_OUT_X[i], yA, RC_EDGE_OUT_Z[i], RC_EDGE_OUT_X[nxt], yB, RC_EDGE_OUT_Z[nxt], 0, edgeCol);

        // Línea guía central punteada hacia la siguiente curva (si CAMINO GUIA está activo)
        if (fcProfile.showSplinePath !== 0) {
          projLine(RC_TRACK_WPS[i].x, yA + 0.05, RC_TRACK_WPS[i].z, RC_TRACK_WPS[nxt].x, yB + 0.05, RC_TRACK_WPS[nxt].z, 2, 2);
        }
      }

      // 2. Pórtico de Salida / Meta (START / FINISH) en (0, -12)
      const gX = 0.0, gZ = -12.0, gH = 4.4, gW = 4.5;
      projLine(gX, 0.25, gZ - gW, gX, gH, gZ - gW, 0, 1);
      projLine(gX, 0.25, gZ + gW, gX, gH, gZ + gW, 0, 1);
      const b0 = projPoint320(gX, gH - 0.8, gZ - gW);
      const b1 = projPoint320(gX, gH - 0.8, gZ + gW);
      const b2 = projPoint320(gX, gH,       gZ + gW);
      const b3 = projPoint320(gX, gH,       gZ - gW);
      if (b0 && b1 && b2 && b3) {
        fillQuad320(b0, b1, b2, b3, C565.RED);
        const midX = Math.round((b0.sx + b1.sx) * 0.5) - 12;
        const midY = Math.round((b0.sy + b2.sy) * 0.5) - 3;
        drawOsdSmall320('START', midX, midY, C565.WHITE);
      }

      // 3. Arco / Baliza 3D en el Siguiente Checkpoint (sim.activeGate) + Conos en los vértices
      for (let i = 0; i < RC_NUM_WPS; i++) {
        const wp = RC_TRACK_WPS[i];
        const isNext = (i === sim.activeGate);
        const y0 = getTerrainHeightMeters(wp.x, wp.z) + 0.15;
        if (isNext) {
          // Postes laterales verdes en los bordes de la curva objetivo
          projLine(RC_EDGE_IN_X[i],  y0, RC_EDGE_IN_Z[i],  RC_EDGE_IN_X[i],  y0 + 2.4, RC_EDGE_IN_Z[i],  0, 3);
          projLine(RC_EDGE_OUT_X[i], y0, RC_EDGE_OUT_Z[i], RC_EDGE_OUT_X[i], y0 + 2.4, RC_EDGE_OUT_Z[i], 0, 3);
          projLine(RC_EDGE_IN_X[i],  y0 + 2.4, RC_EDGE_IN_Z[i], RC_EDGE_OUT_X[i], y0 + 2.4, RC_EDGE_OUT_Z[i], 1, 3);
        }
        const pt = projPoint320(wp.x, y0 + (isNext ? 2.6 : 0.45), wp.z);
        if (pt && pt.sx > 4 && pt.sx < DISP_W - 4 && pt.sy > 4 && pt.sy < DISP_H - 4) {
          drawInavCircleDot320(pt.sx, pt.sy, isNext ? 2 : 1, isNext ? C565.GREEN : C565.ORANGE);
        }
      }

      // 3B. Marcas de caucho / derrape sobre el asfalto (Skidmarks)
      for (let i = 0; i < MAX_SKID_SEGMENTS; i++) {
        if (!SKID_ON[i]) continue;
        const yS = getTerrainHeightMeters(SKID_AX[i], SKID_AZ[i]) + 0.04;
        projLine(SKID_AX[i], yS, SKID_AZ[i], SKID_BX[i], yS, SKID_BZ[i], 0, 8);
      }

      // 4. Partículas de humo de neumáticos (drift) o polvo de tierra
      for (let i = 0; i < MAX_CAR_PARTICLES; i++) {
        const age = CAR_PART_AGE[i];
        if (age <= 0.0 || age > 0.65) continue;
        const pt = projPoint320(CAR_PART_X[i], CAR_PART_Y[i] + age * 0.6, CAR_PART_Z[i]);
        if (pt && pt.sx > 4 && pt.sx < DISP_W - 4 && pt.sy > 4 && pt.sy < DISP_H - 4) {
          drawInavCircleDot320(pt.sx, pt.sy, age < 0.25 ? 2 : 1, CAR_PART_COL[i]);
        }
      }

      // 5. Renderizar los 2 Carros RC Rivales IA en pista
      if (fcProfile.aiBots) {
        for (let a = 0; a < 2; a++) {
          const ab = CAR_AI_BOTS[a];
          const cY = Math.cos(ab.yaw), sY = Math.sin(ab.yaw);
          const S = 1.55;
          function cp(r, u, f) {
            return projPoint320(ab.px + (cY * r + sY * f) * S, ab.py + u * S, ab.pz + (-sY * r + cY * f) * S);
          }
          const bFL = cp(-0.48, 0.16,  0.95), bFR = cp( 0.48, 0.16,  0.95);
          const bRL = cp(-0.50, 0.28, -0.90), bRR = cp( 0.50, 0.28, -0.90);
          const rTop = cp(0.0,  0.52, -0.10);
          const wL = cp(-0.54, 0.58, -0.95), wR = cp( 0.54, 0.58, -0.95);
          if (bFL && bFR && bRL && bRR && rTop) {
            fillQuad320(bFL, bFR, bRR, bRL, ab.bodyCol);
            fillTri320(bFL.sx, bFL.sy, bFR.sx, bFR.sy, rTop.sx, rTop.sy, C565.WHITE);
            if (wL && wR) drawOutlinedLine320(wL.sx, wL.sy, wR.sx, wR.sy, ab.wingCol);
            drawOsdSmall320(ab.name, Math.round(rTop.sx) - 6, Math.round(rTop.sy) - 9, ab.wingCol);
          }
        }
      }
    }

    const rcCarSim = {
      px: -8.0, py: 0.25, pz: -12.0,
      vx: 0.0,  vy: 0.0,  vz: 0.0,
      yaw: Math.PI * 0.5, // Mirando hacia +X en la recta principal frente al podio
      spd: 0.0,
      uFwd: 0.0,
      vLat: 0.0,
      steerAngle: 0.0,
      thrCmd: 0.0,
      suspPitch: 0.0,
      suspRoll: 0.0,
      slipDeg: 0,
      airborne: false,
      onTrack: true,
      presetIdx: 0,
      camMode: 0, // 0 = PODIO ALTO ZOOM, 1 = PODIO PANORAMICO, 2 = CHASE CAM 3D
      chaseCam: false,
      activeGate: 1,
      lapCount: 0,
      lapTime: 0.0,
      lastLapTime: 0.0,
      bestLapTime: 0.0,
      flightTime: 0.0,
      totalDistKm: 0.0,
      partTimer: 0.0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,

      reset() {
        if (activeWorldMapMode !== 'rccar') {
          generateRcCarTrackVoxelMap();
        }
        this.px = -8.0;
        this.pz = -12.0;
        this.py = getTerrainHeightMeters(this.px, this.pz) + 0.05;
        this.yaw = Math.PI * 0.5;
        this.vx = 0.0; this.vy = 0.0; this.vz = 0.0;
        this.uFwd = 0.0; this.vLat = 0.0; this.spd = 0.0;
        this.steerAngle = 0.0;
        this.thrCmd = 0.0;
        this.suspPitch = 0.0;
        this.suspRoll  = 0.0;
        this.airborne  = false;
        this.activeGate = 1;
        this.lapTime    = 0.0;
        for (let i = 0; i < MAX_CAR_PARTICLES; i++) CAR_PART_AGE[i] = 0.0;
        for (let i = 0; i < MAX_SKID_SEGMENTS; i++) SKID_ON[i] = 0;
        resetCarAiBots();
        this.updateBasis();
      },

      updateBasis() {
        const cY = Math.cos(this.yaw), sY = Math.sin(this.yaw);
        const cP = Math.cos(this.suspPitch), sP = Math.sin(this.suspPitch);
        const cR = Math.cos(this.suspRoll),  sR = Math.sin(this.suspRoll);

        this.fx = sY * cP;
        this.fy = sP;
        this.fz = cY * cP;

        const r0x = cY, r0z = -sY;
        this.rx = r0x * cR;
        this.ry = sR;
        this.rz = r0z * cR;

        this.ux = -r0x * sR - sY * sP * cR;
        this.uy = cR * cP;
        this.uz = -r0z * sR - cY * sP * cR;
      },

      step(dt) {
        this.flightTime += dt;
        this.lapTime    += dt;
        const preset = RC_CAR_PRESETS[this.presetIdx];

        // 1. Envejecer partículas de humo/polvo
        for (let i = 0; i < MAX_CAR_PARTICLES; i++) {
          if (CAR_PART_AGE[i] > 0.0) CAR_PART_AGE[i] += dt;
        }

        // 2. Dirección (Stick Derecho X o Stick Izquierdo X) y Gatillo ESC (Stick Izquierdo Y o Botón A)
        const rawSteer = Math.abs(hwInput.rx) >= Math.abs(hwInput.lx) ? hwInput.rx : hwInput.lx;
        const spdDamp  = 1.0 - 0.32 * Math.min(1.0, Math.abs(this.uFwd) / preset.topSpd);
        const targetSteer = applySuperExpo(rawSteer, 1.0, 0.35) * (preset.steerRate * DEG2RAD) * spdDamp;
        this.steerAngle += (targetSteer - this.steerAngle) * Math.min(1.0, dt * 18.0);

        // Eje vertical del Stick Derecho (hwInput.ry) ajusta suavemente el Zoom de la cámara LOS en tiempo real
        if (Math.abs(hwInput.ry) > 0.24 && Math.abs(hwInput.ry) > Math.abs(hwInput.rx) * 1.15) {
          fcProfile.losZoom = Math.max(0.50, Math.min(3.50, (fcProfile.losZoom || 1.25) + hwInput.ry * 0.95 * dt));
        }

        let escInput = hwInput.ly;
        if (hwInput.btn.A) escInput = 1.0;
        this.thrCmd = escInput;

        // 3. Evaluar superficie bajo las 4 ruedas (Asfalto vs Piano vs Césped/Tierra + Rampa de Salto)
        const trackInfo = getRcTrackInfoAt(this.px, this.pz);
        this.onTrack = (trackInfo.dist <= 5.4);
        const surfaceGrip = this.onTrack ? 1.0 : 0.65;
        const surfaceDrag = this.onTrack ? 0.55 : 2.15;

        const fwdX = Math.sin(this.yaw), fwdZ = Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);

        this.uFwd = this.vx * fwdX + this.vz * fwdZ;
        this.vLat = this.vx * rgtX + this.vz * rgtZ;

        // 4. Tracción longitudinal ESC Brushless 2S (Acelerador, Freno Proporcional y Reversa)
        let longAcc = -this.uFwd * surfaceDrag;
        if (!this.airborne) {
          if (escInput > 0.05) {
            const ratio = Math.max(0.0, 1.0 - this.uFwd / (preset.topSpd * (this.onTrack ? 1.0 : 0.72)));
            longAcc += escInput * preset.accel * (0.28 + 0.72 * ratio);
          } else if (escInput < -0.05) {
            if (this.uFwd > 0.6) {
              // Frenando hacia adelante
              longAcc += escInput * preset.accel * 1.45;
            } else {
              // Reversa controlada (máx -6.5 m/s)
              const revRatio = Math.max(0.0, 1.0 - Math.abs(this.uFwd) / 6.5);
              longAcc += escInput * preset.accel * 0.55 * revRatio;
            }
          }
        }

        this.uFwd += longAcc * dt;

        // 5. Dinámica de Giro y Derrape (Slip Angle + Oversteer)
        if (!this.airborne && Math.abs(this.uFwd) > 0.15) {
          const dirSign  = this.uFwd >= 0 ? 1.0 : -1.0;
          const turnRate = this.steerAngle * dirSign * Math.min(1.0, Math.abs(this.uFwd) / 2.2) * 3.85;
          this.yaw += turnRate * dt;

          // Fuerza centrífuga que induce deslizamiento lateral (drift)
          const centrifAcc = turnRate * this.uFwd * (1.05 - preset.driftSlip * 0.45);
          const tireGripAcc = -this.vLat * (6.8 * preset.grip * surfaceGrip);
          this.vLat += (centrifAcc + tireGripAcc) * dt;
        } else {
          this.vLat *= (1.0 - Math.min(1.0, dt * 3.0));
        }

        this.vx = fwdX * this.uFwd + rgtX * this.vLat;
        this.vz = fwdZ * this.uFwd + rgtZ * this.vLat;
        this.spd = Math.hypot(this.vx, this.vz);
        this.totalDistKm += (this.spd * dt) / 1000.0;
        this.slipDeg = this.spd > 1.5 ? Math.round(Math.atan2(Math.abs(this.vLat), Math.abs(this.uFwd)) * RAD2DEG) : 0;

        const prevX = this.px, prevZ = this.pz;
        this.px += this.vx * dt;
        this.pz += this.vz * dt;

        // Límite perimetral del estadio RC
        if (Math.abs(this.px) > 42.0) { this.px = Math.sign(this.px) * 42.0; this.vx *= -0.4; }
        if (this.pz < -21.0)          { this.pz = -21.0; this.vz *= -0.4; }
        if (this.pz >  32.0)          { this.pz =  32.0; this.vz *= -0.4; }

        // 6. Altitud, Rampas de Salto y Suspensión 3D (Pitch / Roll)
        const floorH = getTerrainHeightMeters(this.px, this.pz) + 0.04;
        const prevFloorH = getTerrainHeightMeters(prevX, prevZ) + 0.04;
        const rampSlopeVy = (floorH - prevFloorH) / Math.max(0.001, dt);

        if (!this.airborne) {
          if (rampSlopeVy < -0.7 && this.spd > 7.5 && floorH > 0.42) {
            // Despegue en la cresta de la meseta de salto
            this.airborne = true;
          } else {
            this.py = floorH;
            this.vy = Math.max(0.0, rampSlopeVy);
          }
        } else {
          this.vy -= 18.5 * dt; // Gravedad a escala 1/10 RC
          this.py += this.vy * dt;
          if (this.py <= floorH) {
            this.py = floorH;
            this.vy = 0.0;
            this.airborne = false;
            this.suspPitch = -0.14; // Compresión de suspensión al aterrizar
            playTone(280, 0.03);
          }
        }

        // Suspensión física real:
        // - En Pitch (+suspPitch = morro arriba): al acelerar (+longAcc) hunde la trasera y levanta el morro (squat); al frenar (-longAcc) clava el morro (dive).
        // - En Roll (+suspRoll = lado derecho sube / lado izquierdo se hunde): al girar a la derecha (+steerAngle), la fuerza centrífuga
        //   transfiere el peso hacia las ruedas exteriores (izquierdas), hundiendo el lado izquierdo y levantando el interior (derecho).
        const targetPitch = this.airborne
          ? Math.max(-0.28, Math.min(0.28, this.vy * 0.04))
          : Math.max(-0.16, Math.min(0.16, (floorH - prevFloorH) * 2.2 + longAcc * 0.0065));
        const latG = (this.steerAngle * (this.uFwd / preset.topSpd)) - (this.vLat * 0.045);
        const targetRoll = Math.max(-0.24, Math.min(0.24, latG * 0.46));

        this.suspPitch += (targetPitch - this.suspPitch) * Math.min(1.0, dt * 14.0);
        this.suspRoll  += (targetRoll  - this.suspRoll)  * Math.min(1.0, dt * 14.0);
        this.updateBasis();

        // 7A. Emitir partículas de humo de neumáticos y registrar marcas de derrape (Skidmarks) en el asfalto
        this.partTimer += dt;
        if (!this.airborne && this.partTimer >= 0.045 && (this.slipDeg >= 14 || (!this.onTrack && this.spd > 3.5))) {
          this.partTimer = 0.0;
          CAR_PART_X[carPartHead]   = this.px - fwdX * 1.1 + (Math.random() - 0.5) * 0.6;
          CAR_PART_Y[carPartHead]   = this.py + 0.12;
          CAR_PART_Z[carPartHead]   = this.pz - fwdZ * 1.1 + (Math.random() - 0.5) * 0.6;
          CAR_PART_AGE[carPartHead] = 0.01;
          CAR_PART_COL[carPartHead] = this.onTrack ? C565.WHITE : C565.GOLD;
          carPartHead = (carPartHead + 1) & (MAX_CAR_PARTICLES - 1);

          if (this.onTrack && this.slipDeg >= 15) {
            const side = (skidHead & 1) ? 0.85 : -0.85;
            const wx0 = this.px - fwdX * 1.05 + rgtX * side;
            const wz0 = this.pz - fwdZ * 1.05 + rgtZ * side;
            SKID_AX[skidHead] = wx0;
            SKID_AZ[skidHead] = wz0;
            SKID_BX[skidHead] = wx0 - this.vx * 0.07;
            SKID_BZ[skidHead] = wz0 - this.vz * 0.07;
            SKID_ON[skidHead] = 1;
            skidHead = (skidHead + 1) % MAX_SKID_SEGMENTS;
          }
        }

        // 7B. Actualizar los 2 Carros RC Rivales IA
        stepCarAiBots(dt);

        // 8. Checkpoints del circuito y Cronómetro de Vuelta (Lap Timer)
        const wp = RC_TRACK_WPS[this.activeGate];
        if (Math.hypot(this.px - wp.x, this.pz - wp.z) < 6.8) {
          this.activeGate = (this.activeGate + 1) % RC_TRACK_WPS.length;
          if (this.activeGate === 1) {
            // Cruzó el Pórtico de Meta (WP 1)
            this.lapCount++;
            this.lastLapTime = this.lapTime;
            if (this.bestLapTime === 0.0 || this.lapTime < this.bestLapTime) {
              this.bestLapTime = this.lapTime;
              showToast(`BEST LAP! ${this.lapTime.toFixed(2)}S`);
              playTone(1040, 0.10);
            } else {
              showToast(`LAP ${this.lapCount}: ${this.lapTime.toFixed(2)}S`);
              playTone(880, 0.07);
            }
            this.lapTime = 0.0;
          } else {
            playTone(680, 0.02);
          }
        }
      },

      render() {
        // Posición fija del Piloto en la Torre / Podio Alto (High Driver's Stand: 21.5m de altura) al sur de la Recta Principal
        const standX = 0.0, standY = 21.5, standZ = -26.0;
        let camX = standX, camY = standY, camZ = standZ;
        let cRx = 1, cRy = 0, cRz = 0;
        let cUx = 0, cUy = 1, cUz = 0;
        let cFx = 0, cFy = 0, cFz = 1;
        let zoomFactor = 1.0;

        const userZoom = Math.max(0.50, Math.min(3.50, fcProfile.losZoom || 1.25));

        if (this.camMode === 2 || this.chaseCam) {
          // Vista Chase Cam 3D elevada detrás del Carro RC (también responde al Zoom ajustable)
          const fc = computeFollowCamPose(this, 5.5 / userZoom, Math.max(1.3, 2.55 / Math.sqrt(userZoom)), 17.5);
          camX = fc.camX; camY = Math.max(1.4, fc.camY); camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
          zoomFactor = userZoom;
        } else {
          // Vector horizontal LOS desde la Torre/Podio hacia el Carro RC
          const rawDx = this.px - standX;
          const rawDz = this.pz - standZ;
          const horizDist = Math.hypot(rawDx, rawDz) || 1.0;
          const dirHx = rawDx / horizDist;
          const dirHz = rawDz / horizDist;

          if (this.camMode === 0) {
            // PODIO ALTO AUTO-ZOOM + ZOOM DE USUARIO: mantiene el acimut LOS del podio y acerca/aleja sobre el rayo LOS
            const baseEff = horizDist > 13.5 ? (13.5 + (horizDist - 13.5) * 0.28) : horizDist;
            const effHoriz = Math.max(3.8, Math.min(78.0, baseEff / userZoom));
            zoomFactor = horizDist / Math.max(1.0, effHoriz);
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(4.5, Math.min(25.0, 4.4 + effHoriz * 0.78));
          } else {
            // PODIO ZOOM MANUAL (camMode === 1): zoom directo sobre la distancia real desde el podio
            const effHoriz = Math.max(4.0, Math.min(82.0, horizDist / userZoom));
            zoomFactor = userZoom;
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(5.0, Math.min(25.0, 22.5 / Math.sqrt(userZoom)));
          }

          const dx = this.px - camX;
          const dy = (this.py + 0.30) - camY;
          const dz = this.pz - camZ;
          const dLen = Math.hypot(dx, dy, dz) || 1.0;
          cFx = dx / dLen;
          cFy = dy / dLen;
          cFz = dz / dLen;

          // Base ortonormal mano derecha sin roll (U = F x R -> cUy = +hLen > 0, horizonte de pista al derecho)
          const hLen = Math.hypot(cFx, cFz) || 1.0;
          cRx =  cFz / hLen;
          cRy =  0.0;
          cRz = -cFx / hLen;

          cUx = cFy * cRz - cFz * cRy;
          cUy = cFz * cRx - cFx * cRz;
          cUz = cFx * cRy - cFy * cRx;
        }

        // 1. Renderizar Circuito de Asfalto, Pianos, Rampas y Cielo Voxel
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Proyector 3D + Bordes 3D de Pista + Pórtico de Meta + Conos + Humo + Carro RC 3D Sólido
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderRcTrackPropsAndParticles320(this, projPoint320, projLine);
        renderSolidRcCar320(this, projPoint320, projLine);

        // 3. OSD de Telemetría, Mini-Mapa de Pista en Vivo y Lap Timer RC Car
        this.renderRcCarOsd320(zoomFactor);
      },

      renderRcCarOsd320(zoomFactor) {
        const WHITE = 0xFFFF;
        const preset = RC_CAR_PRESETS[this.presetIdx];

        // Encabezado superior: Modo de Carro + Estado de Superficie / Drift
        const titleStr = `RC 1/10 // ${preset.name}`;
        drawOsdSmall320(titleStr, 160 - ((titleStr.length * 5) >> 1), 6, WHITE);

        let statusStr = 'ON TRACK // GRIP';
        let statusCol = C565.GREEN;
        if (this.airborne) {
          statusStr = '!AIRBORNE JUMP!';
          statusCol = C565.GOLD;
        } else if (!this.onTrack) {
          statusStr = 'OFF-TRACK GRASS!';
          statusCol = C565.ORANGE;
        } else if (this.slipDeg >= 16) {
          statusStr = `DRIFTING ${this.slipDeg} DEG!`;
          statusCol = C565.CYAN;
        }
        drawOsdSmall320(statusStr, 160 - ((statusStr.length * 5) >> 1), 16, statusCol);

        // Esquina superior izquierda: Cronómetro de vuelta en vivo, Última Vuelta y Récord (Best Lap)
        drawOsdSmall320(`LAP  ${this.lapCount} (${this.activeGate}/12)`, 8, 8,  C565.GOLD);
        drawOsdSmall320(`TIME ${this.lapTime.toFixed(1)}S`,               8, 18, WHITE);
        drawOsdSmall320(`BEST ${this.bestLapTime > 0 ? this.bestLapTime.toFixed(2) + 'S' : '--.--'}`, 8, 28, C565.GREEN);

        // Esquina superior derecha: Cámara LOS Podio Alto + Control de Zoom
        const zUsr = (fcProfile.losZoom || 1.25).toFixed(2);
        const camLbl = (this.camMode === 2 || this.chaseCam) ? `CHS Z:${zUsr}X` : (this.camMode === 0 ? `LOS ${zoomFactor.toFixed(1)}X` : `MAN ${zUsr}X`);
        drawOsdSmall320(camLbl,            256, 8,  C565.CYAN);
        drawOsdSmall320(`B:CAM Y:MOD`,     255, 18, WHITE);
        drawOsdSmall320(`[-ZOOM ${zUsr}+]`, 244, 28, C565.GOLD);

        // Mini-Radar del Circuito en vivo en la esquina inferior derecha (muestra el trazado completo + tu carro)
        const mCx = 282, mCy = 178, mScale = 0.72;
        for (let i = 0; i < RC_NUM_WPS; i++) {
          const a = RC_TRACK_WPS[i];
          const b = RC_TRACK_WPS[(i + 1) % RC_NUM_WPS];
          drawOutlinedLine320(
            Math.round(mCx + a.x * mScale), Math.round(mCy - (a.z - 5.0) * mScale),
            Math.round(mCx + b.x * mScale), Math.round(mCy - (b.z - 5.0) * mScale),
            i === this.activeGate ? C565.GREEN : WHITE
          );
        }
        const carMx = Math.round(mCx + this.px * mScale);
        const carMy = Math.round(mCy - (this.pz - 5.0) * mScale);
        drawInavCircleDot320(carMx, carMy, 2, C565.RED);

        // Esquina inferior izquierda: Velocidad en KM/H, Acelerador/Freno ESC y Ángulo de Dirección
        const kmh = Math.round(this.spd * 3.6);
        const escPct = Math.round(this.thrCmd * 100);
        const steerDeg = Math.round(this.steerAngle * RAD2DEG);
        drawOsdSmall320(`SPD ${String(kmh).padStart(2, ' ')} KMH`, 8, 194, C565.GREEN);
        drawOsdSmall320(`ESC ${escPct >= 0 ? '+' : ''}${escPct}%`, 8, 205, escPct < 0 ? C565.ORANGE : WHITE);
        drawOsdSmall320(`STR ${steerDeg >= 0 ? '+' : ''}${steerDeg}D`, 8, 216, C565.CYAN);

        // Esquina inferior derecha bajo el mini-mapa: Última vuelta y distancia
        drawOsdSmall320(`LAST ${this.lastLapTime > 0 ? this.lastLapTime.toFixed(2) + 'S' : '--.--'}`, 252, 205, WHITE);
        drawOsdSmall320(`ODO  ${this.totalDistKm.toFixed(2)}K`, 252, 216, C565.GOLD);
      }
    };

    /***************************************************************************
     * 6D. SIMULADOR 5: LANCHA RC BRUSHLESS (DEEP-V / CATAMARAN / F1 TUNNEL)
     *     - Física Hidrodinámica de Planeo (Planing Hull) + Salto de Olas
     *     - Gran Cola de Gallo (Rooster Tail) 3D de espuma blanca en la hélice
     *     - 2 Lanchas Rivales IA en Regata sobre los 3 circuitos de boyas
     ***************************************************************************/
    const RC_BOAT_PRESETS = [
      { name: 'DEEP-V 4S MONO', topSpd: 18.5, accel: 16.5, turnRate: 2.65, bankGain: 0.34, planingSpd: 4.5, hullCol: rgb565(245, 58, 32),  deckCol: C565.WHITE, canopyCol: rgb565(24, 34, 48) },
      { name: 'CATAMARAN 6S',   topSpd: 23.5, accel: 21.0, turnRate: 2.25, bankGain: 0.22, planingSpd: 5.2, hullCol: rgb565(28, 165, 250), deckCol: C565.GOLD,  canopyCol: rgb565(24, 34, 48) },
      { name: 'F1 TUNNEL HULL', topSpd: 21.0, accel: 19.5, turnRate: 3.35, bankGain: 0.42, planingSpd: 4.0, hullCol: rgb565(45, 225, 88),  deckCol: C565.WHITE, canopyCol: rgb565(24, 34, 48) }
    ];

    // Pool estático de 24 partículas para la Cola de Gallo (Rooster Tail) de la hélice de superficie (0 allocs)
    const MAX_ROOSTER_PARTICLES = 24;
    const ROOSTER_X   = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_Y   = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_Z   = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_VX  = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_VY  = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_VZ  = new Float32Array(MAX_ROOSTER_PARTICLES);
    const ROOSTER_AGE = new Float32Array(MAX_ROOSTER_PARTICLES);
    let roosterHeadIdx = 0;

    const BOAT_AI_BOTS = [
      { px: -5.0, py: 0.0, pz: -17.0, yaw: 0.42, pitch: 0.08, roll: 0.0, spd: 0.0, buoy: 0, spdMul: 0.78, col: C565.CYAN },
      { px:  5.0, py: 0.0, pz: -19.0, yaw: 0.48, pitch: 0.08, roll: 0.0, spd: 0.0, buoy: 0, spdMul: 0.70, col: C565.GOLD }
    ];

    function resetBoatAiBots() {
      BOAT_AI_BOTS[0].px = -5.0; BOAT_AI_BOTS[0].pz = -17.0; BOAT_AI_BOTS[0].yaw = 0.42; BOAT_AI_BOTS[0].spd = 0.0; BOAT_AI_BOTS[0].buoy = 0;
      BOAT_AI_BOTS[1].px =  5.0; BOAT_AI_BOTS[1].pz = -19.0; BOAT_AI_BOTS[1].yaw = 0.48; BOAT_AI_BOTS[1].spd = 0.0; BOAT_AI_BOTS[1].buoy = 0;
    }

    function stepBoatAiBots(dt) {
      if (!fcProfile.aiBots) return;
      for (let i = 0; i < 2; i++) {
        const b = BOAT_AI_BOTS[i];
        const targetB = SAIL_BUOYS[b.buoy % SAIL_BUOYS.length];
        const dx = targetB.x - b.px, dz = targetB.z - b.pz;
        const dist = Math.hypot(dx, dz);
        if (dist < 6.5) b.buoy = (b.buoy + 1) % SAIL_BUOYS.length;
        const desYaw = Math.atan2(dx, dz);
        const yawErr = Math.atan2(Math.sin(desYaw - b.yaw), Math.cos(desYaw - b.yaw));
        const turnRate = Math.max(-2.4, Math.min(2.4, yawErr * 2.5));
        b.yaw += turnRate * dt;
        const targetSpd = (dist < 14.0 ? 11.5 : 15.8) * b.spdMul;
        b.spd += (targetSpd - b.spd) * Math.min(1.0, dt * 3.0);
        b.px  += Math.sin(b.yaw) * b.spd * dt;
        b.pz  += Math.cos(b.yaw) * b.spd * dt;
        b.py   = getSailWaveHeight(b.px, b.pz, aeroEnv.time);
        b.pitch = 0.09 + Math.sin(aeroEnv.time * 5.2 + i) * 0.04;
        b.roll  = -turnRate * 0.16;
      }
    }

    function renderSolidSpeedboat320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      const S = 1.65;
      function wp(r, u, f) {
        return projPoint320(
          px + (rx * r + ux * u + fx * f) * S,
          py + (ry * r + uy * u + fy * f) * S,
          pz + (rz * r + uz * u + fz * f) * S
        );
      }

      const preset = RC_BOAT_PRESETS[sim.presetIdx];
      let fc = 0;

      // 0. Sombra proyectada sobre el agua (clave cuando salta olas)
      const waterY = getSailWaveHeight(px, pz, aeroEnv.time) + 0.02;
      const shBow  = projPoint320(px + fx * 1.9, waterY, pz + fz * 1.9);
      const shStL  = projPoint320(px - fx * 1.4 - rx * 0.65, waterY, pz - fz * 1.4 - rz * 0.65);
      const shStR  = projPoint320(px - fx * 1.4 + rx * 0.65, waterY, pz - fz * 1.4 + rz * 0.65);
      if (shBow && shStL && shStR) {
        fillTriangle320(shBow, shStR, shStL, rgb565(8, 28, 62));
      }

      // 1. Casco Deep-V afilado de competición Offshore
      const bowTip = wp( 0.00,  0.18,  1.35);
      const keelF  = wp( 0.00, -0.04,  0.55);
      const keelB  = wp( 0.00, -0.06, -0.95);
      const deckFL = wp(-0.34,  0.18,  0.50), deckFR = wp( 0.34,  0.18,  0.50);
      const deckBL = wp(-0.42,  0.20, -0.95), deckBR = wp( 0.42,  0.20, -0.95);
      const chineL = wp(-0.36,  0.02, -0.88), chineR = wp( 0.36,  0.02, -0.88);

      fc = addCraftTri(fc, bowTip, deckFR, deckFL, preset.deckCol);
      fc = addCraftQuad(fc, deckFL, deckFR, deckBR, deckBL, preset.hullCol);
      fc = addCraftTri(fc, bowTip, deckFL, keelF, preset.hullCol);
      fc = addCraftTri(fc, bowTip, keelF, deckFR, preset.hullCol);
      fc = addCraftQuad(fc, deckFL, deckBL, chineL, keelF, preset.hullCol);
      fc = addCraftQuad(fc, deckFR, keelF, chineR, deckBR, preset.hullCol);
      fc = addCraftQuad(fc, deckBL, deckBR, chineR, chineL, rgb565(30, 34, 42));

      // 2. Cabina aerodinámica + Alerón / Aleta dorsal
      const canF  = wp( 0.00, 0.24,  0.28);
      const canL  = wp(-0.22, 0.36, -0.18), canR = wp( 0.22, 0.36, -0.18);
      const canB  = wp( 0.00, 0.34, -0.62);
      fc = addCraftTri(fc, canF, canR, canL, preset.canopyCol);
      fc = addCraftTri(fc, canL, canR, canB, preset.canopyCol);

      renderSortedCraftFaces(fc);

      // 3. Cola de Gallo (Rooster Tail) 3D de espuma blanca detrás de la hélice de superficie
      for (let i = 0; i < MAX_ROOSTER_PARTICLES; i++) {
        const age = ROOSTER_AGE[i];
        if (age <= 0.0 || age > 0.55) continue;
        const pt = projPoint320(ROOSTER_X[i], ROOSTER_Y[i], ROOSTER_Z[i]);
        if (pt && pt.sx > 4 && pt.sx < DISP_W - 4 && pt.sy > 4 && pt.sy < DISP_H - 4) {
          drawInavCircleDot320(pt.sx, pt.sy, age < 0.22 ? 2 : 1, age < 0.30 ? C565.WHITE : C565.CYAN);
        }
      }

      // 4. Renderizar las 2 Lanchas Rivales IA + Jugador Remoto BLE
      if (fcProfile.aiBots) {
        for (let bIdx = 0; bIdx < 2; bIdx++) {
          const b = BOAT_AI_BOTS[bIdx];
          const cY = Math.cos(b.yaw), sY = Math.sin(b.yaw);
          const pBow = projPoint320(b.px + sY * 1.9, b.py + 0.28, b.pz + cY * 1.9);
          const pStL = projPoint320(b.px - sY * 1.4 - cY * 0.65, b.py + 0.22, b.pz - cY * 1.4 + sY * 0.65);
          const pStR = projPoint320(b.px - sY * 1.4 + cY * 0.65, b.py + 0.22, b.pz - cY * 1.4 - sY * 0.65);
          const pCan = projPoint320(b.px - sY * 0.2, b.py + 0.58, b.pz - cY * 0.2);
          if (pBow && pStL && pStR && pCan) {
            fillTriangle320(pBow, pStR, pStL, b.col);
            fillTriangle320(pBow, pStR, pCan, C565.WHITE);
            // Mini Rooster Tail de la lancha IA
            const pRoost = projPoint320(b.px - sY * 2.8, b.py + 0.85, b.pz - cY * 2.8);
            if (pRoost) drawOutlinedLine320(pStL.sx, pStL.sy, pRoost.sx, pRoost.sy, C565.WHITE);
          }
        }
      }
      renderRemoteBlePlayer320(projPoint320, projLine);
    }

    const rcBoatSim = {
      px: 0.0, py: 0.0, pz: -15.0,
      vx: 0.0, vy: 0.0, vz: 0.0,
      yaw: 0.45,
      spd: 0.0,
      uFwd: 0.0,
      vLat: 0.0,
      thrCmd: 0.0,
      rudderAngle: 0.0,
      pitchAngle: 0.04,
      rollAngle: 0.0,
      airborne: false,
      planing: false,
      presetIdx: 0,
      camMode: 0,
      chaseCam: false,
      activeBuoy: 0,
      lapCount: 0,
      flightTime: 0.0,
      totalDistKm: 0.0,
      wakeTimer: 0.0,
      roosterTimer: 0.0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,

      reset() {
        if (activeWorldMapMode !== 'sailboat') {
          generateSailboatBayVoxelMap();
        }
        this.px = 0.0; this.py = 0.0; this.pz = -15.0;
        this.vx = 0.0; this.vy = 0.0; this.vz = 0.0;
        this.yaw = 0.45;
        this.spd = 0.0; this.uFwd = 0.0; this.vLat = 0.0;
        this.thrCmd = 0.0;
        this.rudderAngle = 0.0;
        this.pitchAngle = 0.04;
        this.rollAngle  = 0.0;
        this.airborne   = false;
        this.planing    = false;
        this.activeBuoy = 0;
        for (let i = 0; i < MAX_WAKE_PTS; i++) {
          WAKE_RING_X[i] = this.px; WAKE_RING_Z[i] = this.pz; WAKE_RING_W[i] = 0.0;
        }
        for (let i = 0; i < MAX_ROOSTER_PARTICLES; i++) ROOSTER_AGE[i] = 0.0;
        resetBoatAiBots();
        this.updateBasis();
      },

      updateBasis() {
        const cY = Math.cos(this.yaw), sY = Math.sin(this.yaw);
        const cP = Math.cos(this.pitchAngle), sP = Math.sin(this.pitchAngle);
        const cR = Math.cos(this.rollAngle),  sR = Math.sin(this.rollAngle);
        this.fx = sY * cP;
        this.fy = sP;
        this.fz = cY * cP;
        const r0x = cY, r0z = -sY;
        this.rx = r0x * cR;
        this.ry = sR;
        this.rz = r0z * cR;
        this.ux = -r0x * sR - sY * sP * cR;
        this.uy = cR * cP;
        this.uz = -r0z * sR - cY * sP * cR;
      },

      step(dt) {
        this.flightTime += dt;
        const preset = RC_BOAT_PRESETS[this.presetIdx];
        const groundH = getTerrainHeightMeters(this.px, this.pz);
        updateAeroEnvironment(this.px, 2.0, this.pz, groundH, dt);

        // 1. Controles RC: Gatillo ESC (Stick Izquierdo Y o Botón A) y Timón (Stick Derecho X)
        let esc = hwInput.ly;
        if (hwInput.btn.A) esc = 1.0;
        this.thrCmd = esc;

        const rawRud = Math.abs(hwInput.rx) >= Math.abs(hwInput.lx) ? hwInput.rx : hwInput.lx;
        const targetRud = applySuperExpo(rawRud, 1.0, 0.35) * (32.0 * DEG2RAD);
        this.rudderAngle += (targetRud - this.rudderAngle) * Math.min(1.0, dt * 16.0);

        // Eje vertical del Stick Derecho (hwInput.ry) ajusta suavemente el Zoom de la cámara LOS
        if (Math.abs(hwInput.ry) > 0.24 && Math.abs(hwInput.ry) > Math.abs(hwInput.rx) * 1.15) {
          fcProfile.losZoom = Math.max(0.50, Math.min(3.50, (fcProfile.losZoom || 1.25) + hwInput.ry * 0.95 * dt));
        }

        const fwdX = Math.sin(this.yaw), fwdZ = Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);
        this.uFwd = this.vx * fwdX + this.vz * fwdZ;
        this.vLat = this.vx * rgtX + this.vz * rgtZ;

        // 2. Hidrodinámica de Planeo (Planing Hull): al superar planingSpd el casco sube al pad y reduce su resistencia hidrodinámica
        this.planing = (this.uFwd >= preset.planingSpd);
        const hullDrag = this.airborne ? 0.12 : (this.planing ? 0.42 : 0.95);
        let longAcc = -this.uFwd * hullDrag;

        if (!this.airborne) {
          if (esc > 0.04) {
            const ratio = Math.max(0.0, 1.0 - this.uFwd / preset.topSpd);
            longAcc += esc * preset.accel * (0.30 + 0.70 * ratio);
          } else if (esc < -0.05) {
            if (this.uFwd > 0.8) longAcc += esc * preset.accel * 1.15;
            else longAcc += esc * preset.accel * 0.35 * Math.max(0.0, 1.0 - Math.abs(this.uFwd) / 4.0);
          }
        }
        this.uFwd += longAcc * dt;

        // 3. Giro con Inclinación Interior (Inward Banking) y Prop-Walk de Hélice de Superficie
        const flowAuth = Math.min(1.2, Math.max(0.0, (Math.abs(this.uFwd) + Math.max(0, esc) * 4.5) / 5.5));
        const turnOmega = !this.airborne
          ? (this.rudderAngle / (32.0 * DEG2RAD)) * preset.turnRate * flowAuth * (this.uFwd >= -0.1 ? 1.0 : -1.0)
          : 0.0;
        this.yaw += turnOmega * dt;

        const chineGrip = this.airborne ? 0.5 : 7.8;
        const centrifLat = turnOmega * this.uFwd * 0.38;
        this.vLat += (centrifLat - this.vLat * chineGrip) * dt;

        this.vx = fwdX * this.uFwd + rgtX * this.vLat;
        this.vz = fwdZ * this.uFwd + rgtZ * this.vLat;
        this.spd = Math.hypot(this.vx, this.vz);
        this.totalDistKm += (this.spd * dt) / 1000.0;

        const prevX = this.px, prevZ = this.pz;
        this.px += this.vx * dt;
        this.pz += this.vz * dt;

        // Rebote suave si toca costa o muelle
        const nextGroundH = getTerrainHeightMeters(this.px, this.pz);
        if (nextGroundH > 0.15 || (Math.abs(this.px) < 4.5 && this.pz < -23.0)) {
          this.px = prevX; this.pz = prevZ;
          this.vx *= -0.45; this.vz *= -0.45;
          this.uFwd *= -0.45;
          playTone(220, 0.05);
        }

        // 4. Olas 3D y Salto de Crestas (Wave Jumping) a alta velocidad
        const waveNow  = getSailWaveHeight(this.px, this.pz, aeroEnv.time);
        const wavePrev = getSailWaveHeight(prevX, prevZ, aeroEnv.time);
        const waveSlopeVy = (waveNow - wavePrev) / Math.max(0.001, dt);

        if (!this.airborne) {
          if (waveSlopeVy < -0.55 && this.uFwd > 11.5 && (fcProfile.wind.waveScale || 1.0) >= 0.55) {
            this.airborne = true;
            this.vy = Math.min(3.4, this.uFwd * 0.16);
          } else {
            this.py = waveNow;
            this.vy = waveSlopeVy;
          }
        } else {
          this.vy -= 14.5 * dt;
          this.py += this.vy * dt;
          if (this.py <= waveNow) {
            this.py = waveNow;
            this.vy = 0.0;
            this.airborne = false;
            this.pitchAngle = 0.02;
            playTone(290, 0.03);
          }
        }

        // Cabeceo hidrodinámico (sube la proa en transición 3..6 m/s y asienta al planear) + canteo interior en curva
        const humpNoseUp = this.uFwd > 0.5 ? Math.sin(Math.min(1.0, this.uFwd / 6.0) * Math.PI) * 0.11 : 0.0;
        const planingTrim = this.planing ? 0.065 : 0.03;
        const targetPitch = this.airborne
          ? Math.max(-0.25, Math.min(0.32, 0.12 + this.vy * 0.05))
          : (planingTrim + humpNoseUp + (waveNow - wavePrev) * 1.4);
        const targetRoll = -turnOmega * preset.bankGain * Math.min(1.0, this.uFwd / 8.0);

        this.pitchAngle += (targetPitch - this.pitchAngle) * Math.min(1.0, dt * 11.0);
        this.rollAngle  += (targetRoll  - this.rollAngle)  * Math.min(1.0, dt * 12.0);
        this.updateBasis();

        // 5. Estela en el agua y partículas 3D de la Cola de Gallo (Rooster Tail)
        this.wakeTimer += dt;
        if (this.wakeTimer >= 0.09) {
          this.wakeTimer = 0.0;
          WAKE_RING_X[wakeHeadIdx] = this.px - fwdX * 1.6;
          WAKE_RING_Z[wakeHeadIdx] = this.pz - fwdZ * 1.6;
          WAKE_RING_W[wakeHeadIdx] = (!this.airborne && this.spd > 1.0) ? Math.min(1.6, 0.35 + this.spd * 0.08) : 0.0;
          wakeHeadIdx = (wakeHeadIdx + 1) & (MAX_WAKE_PTS - 1);
        }

        for (let i = 0; i < MAX_ROOSTER_PARTICLES; i++) {
          if (ROOSTER_AGE[i] > 0.0) {
            ROOSTER_AGE[i] += dt;
            ROOSTER_X[i]  += ROOSTER_VX[i] * dt;
            ROOSTER_Y[i]  += ROOSTER_VY[i] * dt;
            ROOSTER_Z[i]  += ROOSTER_VZ[i] * dt;
            ROOSTER_VY[i] -= 12.5 * dt;
          }
        }
        this.roosterTimer += dt;
        if (!this.airborne && (esc > 0.18 || this.spd > 3.5) && this.roosterTimer >= 0.022) {
          this.roosterTimer = 0.0;
          const pwr = Math.max(esc, this.spd / preset.topSpd);
          ROOSTER_X[roosterHeadIdx]   = this.px - fwdX * 1.7;
          ROOSTER_Y[roosterHeadIdx]   = this.py + 0.15;
          ROOSTER_Z[roosterHeadIdx]   = this.pz - fwdZ * 1.7;
          ROOSTER_VX[roosterHeadIdx]  = -fwdX * (4.5 + pwr * 7.5) + (Math.random() - 0.5) * 1.4;
          ROOSTER_VY[roosterHeadIdx]  = 2.2 + pwr * 3.8 + Math.random() * 0.9;
          ROOSTER_VZ[roosterHeadIdx]  = -fwdZ * (4.5 + pwr * 7.5) + (Math.random() - 0.5) * 1.4;
          ROOSTER_AGE[roosterHeadIdx] = 0.01;
          roosterHeadIdx = (roosterHeadIdx + 1) % MAX_ROOSTER_PARTICLES;
        }

        stepBoatAiBots(dt);

        // 6. Progreso por las 6 Boyas de Regata
        const b = SAIL_BUOYS[this.activeBuoy];
        if (Math.hypot(this.px - b.x, this.pz - b.z) < 6.8) {
          this.activeBuoy = (this.activeBuoy + 1) % SAIL_BUOYS.length;
          if (this.activeBuoy === 0) {
            this.lapCount++;
            showToast(`LANCHA VUELTA ${this.lapCount} OK!`);
            playTone(980, 0.10);
          } else {
            showToast(`BOYA ${this.activeBuoy}/6 -> ${SAIL_BUOYS[this.activeBuoy].name}`);
            playTone(860, 0.06);
          }
        }
      },

      render() {
        const dockX = 0.0, dockY = 19.5, dockZ = -28.0;
        let camX = dockX, camY = dockY, camZ = dockZ;
        let cRx = 1, cRy = 0, cRz = 0;
        let cUx = 0, cUy = 1, cUz = 0;
        let cFx = 0, cFy = 0, cFz = 1;
        let zoomFactor = 1.0;

        const userZoom = Math.max(0.50, Math.min(3.50, fcProfile.losZoom || 1.25));

        if (this.camMode === 2 || this.chaseCam) {
          const fc = computeFollowCamPose(this, 6.2 / userZoom, Math.max(1.3, 2.5 / Math.sqrt(userZoom)), 16.0);
          camX = fc.camX; camY = Math.max(1.4, fc.camY); camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
          zoomFactor = userZoom;
        } else {
          const rawDx = this.px - dockX;
          const rawDz = this.pz - dockZ;
          const horizDist = Math.hypot(rawDx, rawDz) || 1.0;
          const dirHx = rawDx / horizDist;
          const dirHz = rawDz / horizDist;

          if (this.camMode === 0) {
            const baseEff = 9.8 + Math.min(2.0, horizDist * 0.022);
            const effHoriz = Math.max(4.0, Math.min(34.0, baseEff / userZoom));
            zoomFactor = horizDist / Math.max(1.0, effHoriz);
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(3.5, Math.min(14.5, this.py + 2.2 + effHoriz * 0.44));
          } else {
            const effHoriz = Math.max(4.5, Math.min(90.0, horizDist / userZoom));
            zoomFactor = userZoom;
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(5.0, Math.min(25.0, 21.0 / Math.sqrt(userZoom)));
          }

          const dx = this.px - camX;
          const dy = (this.py + 0.45) - camY;
          const dz = this.pz - camZ;
          const dLen = Math.hypot(dx, dy, dz) || 1.0;
          cFx = dx / dLen; cFy = dy / dLen; cFz = dz / dLen;
          const hLen = Math.hypot(cFx, cFz) || 1.0;
          cRx =  cFz / hLen; cRy = 0.0; cRz = -cFx / hLen;
          cUx = cFy * cRz - cFz * cRy;
          cUy = cFz * cRx - cFx * cRz;
          cUz = cFx * cRy - cFy * cRx;
        }

        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderSailBuoysAndWake320(this, projPoint320, projLine);
        renderSolidSpeedboat320(this, projPoint320, projLine);
        this.renderBoatOsd320(zoomFactor);
      },

      renderBoatOsd320(zoomFactor) {
        const WHITE = 0xFFFF;
        const preset = RC_BOAT_PRESETS[this.presetIdx];
        const titleStr = `RC BOAT // ${preset.name}`;
        drawOsdSmall320(titleStr, 160 - ((titleStr.length * 5) >> 1), 6, WHITE);

        const stateStr = this.airborne ? '!WAVE JUMP AIRBORNE!' : (this.planing ? 'HYDRO PLANING // ROOSTER TAIL' : 'DISPLACEMENT HULL');
        const stateCol = this.airborne ? C565.GOLD : (this.planing ? C565.GREEN : C565.CYAN);
        drawOsdSmall320(stateStr, 160 - ((stateStr.length * 5) >> 1), 16, stateCol);

        const b = SAIL_BUOYS[this.activeBuoy];
        const distB = Math.round(Math.hypot(b.x - this.px, b.z - this.pz));
        drawOsdSmall320(`BUOY ${this.activeBuoy + 1}/6`, 8, 8,  C565.GREEN);
        drawOsdSmall320(`DST  ${distB}M`,                8, 18, WHITE);
        drawOsdSmall320(`LAP  ${this.lapCount}`,        8, 28, C565.GOLD);

        const zUsr = (fcProfile.losZoom || 1.25).toFixed(2);
        const camLbl = (this.camMode === 2 || this.chaseCam) ? `CHS Z:${zUsr}X` : (this.camMode === 0 ? `LOS ${zoomFactor.toFixed(1)}X` : `MAN ${zUsr}X`);
        drawOsdSmall320(camLbl,            254, 8,  C565.CYAN);
        drawOsdSmall320(`B:CAM Y:CLASE`,   248, 18, WHITE);
        drawOsdSmall320(`[-ZOOM ${zUsr}+]`, 244, 28, C565.GOLD);

        const kmh = Math.round(this.spd * 3.6);
        const kts = (this.spd * 1.944).toFixed(1);
        const thrPct = Math.round(this.thrCmd * 100);
        const trimDeg = Math.round(this.pitchAngle * RAD2DEG);
        drawOsdSmall320(`SPD  ${kmh}KMH (${kts}KT)`, 8, 185, C565.GREEN);
        drawOsdSmall320(`ESC  ${thrPct >= 0 ? '+' : ''}${thrPct}%`, 8, 196, WHITE);
        drawOsdSmall320(`TRIM ${trimDeg >= 0 ? '+' : ''}${trimDeg} DEG`, 8, 207, C565.CYAN);
        drawOsdSmall320(`L:GAS/REV  R:TIMON`, 8, 218, C565.GOLD);
      }
    };

    /***************************************************************************
     * 6E. SIMULADOR 6: ROCK CRAWLER 4X4 TRAIL (CAÑÓN DE ROCA ROJA + 10 PUERTAS)
     *     - Articulación Independiente de 4 Ruedas y 2 Ejes Sólidos (Axle Flex)
     *     - Caja Reductora LOW 4:1 / HIGH 1:1 (Botón A) + Freno en Pendiente 100%
     *     - Inclinómetro Pitch / Roll en Vivo con Riesgo Real de Vuelco (Rollover)
     ***************************************************************************/
    const RC_CRAWLER_PRESETS = [
      { name: 'TRX-4 TRAIL',   lowSpd: 2.3, highSpd: 6.2, climbGrip: 1.25, flexScale: 1.00, tipDeg: 46, bodyCol: rgb565(235, 118, 24), roofCol: C565.WHITE },
      { name: 'SCX10 COMP',    lowSpd: 2.6, highSpd: 6.8, climbGrip: 1.38, flexScale: 1.18, tipDeg: 49, bodyCol: rgb565(46, 188, 72),  roofCol: rgb565(28, 34, 42) },
      { name: 'MOA PRO RIG',   lowSpd: 2.1, highSpd: 5.2, climbGrip: 1.52, flexScale: 1.32, tipDeg: 52, bodyCol: rgb565(36, 152, 248), roofCol: C565.GOLD  }
    ];

    const CRAWLER_GATES = [
      { x:   0.0, z: -12.0, yaw:  0.00, name: 'G1 START SLAB'   },
      { x:   2.5, z:  -4.0, yaw:  0.25, name: 'G2 RED STEP'     },
      { x:   9.0, z:   3.0, yaw:  0.65, name: 'G3 BOULDER GARDEN'},
      { x:  14.5, z:  12.0, yaw:  0.15, name: 'G4 SIDE HILL'    },
      { x:   8.0, z:  20.0, yaw: -0.95, name: 'G5 CANYON CREST' },
      { x:   0.0, z:  22.0, yaw: -1.57, name: 'G6 HIGH BRIDGE'  },
      { x:  -9.5, z:  18.0, yaw: -2.25, name: 'G7 DROP LEDGE'   },
      { x: -14.5, z:   8.0, yaw: -2.85, name: 'G8 TWIN ROCKS'   },
      { x: -10.0, z:  -2.0, yaw:  2.45, name: 'G9 OFF-CAMBER'   },
      { x:  -2.5, z:  -9.5, yaw:  1.95, name: 'G10 FINISH ROCK' }
    ];

    function evalCrawlerRockHeight(wx, wz) {
      // Escenario de Trial 4x4 en Cañón de Roca Roja (escalones de piedra, losas inclinadas y puente central)
      const r = Math.hypot(wx, wz - 5.0);
      if (r > 28.0) {
        return Math.min(11.0, 0.5 + (r - 28.0) * 0.48 + Math.sin(wx * 0.35) * 0.6);
      }
      // Losas escalonadas y rocas en la ruta de las 10 puertas
      const slab1 = Math.max(0.0, 1.35 - Math.hypot(wx - 2.5, wz + 3.5) * 0.25);
      const slab2 = Math.max(0.0, 2.20 - Math.hypot(wx - 11.5, wz - 7.5) * 0.24);
      const crest = Math.max(0.0, 3.10 - Math.hypot(wx - 4.0, wz - 21.0) * 0.26);
      const dropW = Math.max(0.0, 2.45 - Math.hypot(wx + 12.0, wz - 13.0) * 0.25);
      const camber = Math.max(0.0, 1.65 - Math.hypot(wx + 11.0, wz + 1.0) * 0.28);
      // Rugosidad de bloques de piedra (escalones de tracción para ver trabajar la suspensión 4x4)
      const boulders = (Math.sin(wx * 0.85) * Math.cos(wz * 0.85) + Math.sin((wx + wz) * 1.45) * 0.45) * 0.28;
      return Math.max(0.25, 0.35 + slab1 + slab2 + crest + dropW + camber + Math.max(-0.15, boulders));
    }

    function generateCrawlerRockVoxelMap() {
      activeWorldMapMode = 'crawler';
      choroBakedInPsram  = false;
      WORLD_W_M   = 120.0;
      WORLD_H_M   = 100.0;
      MAP_SCALE_X = MAP_W / WORLD_W_M;
      MAP_SCALE_Z = MAP_H / WORLD_H_M;

      // 1. Cielo cálido de cañón desértico (Utah / Moab Red Rock)
      for (let mz = 0; mz < SKY_DIM; mz++) {
        const zOff = mz << SKY_SHIFT;
        for (let mx = 0; mx < SKY_DIM; mx++) {
          const cn = fbmCloud(mx, mz);
          const cloudDensity = Math.max(0, Math.min(1, (cn - 0.10) * 1.7));
          const cSmooth = cloudDensity * cloudDensity * (3 - 2 * cloudDensity);
          const sr = 48 * (1 - cSmooth) + 252 * cSmooth;
          const sg = 104 * (1 - cSmooth) + 246 * cSmooth;
          const sb = 196 * (1 - cSmooth) + 238 * cSmooth;
          voxSkyMap[zOff + mx] = rgb565(clampByte(sr), clampByte(sg), clampByte(sb));
        }
      }

      // 2. Hornear el Cañón de Roca Roja Estratificada en PSRAM
      for (let mz = 0; mz < MAP_H; mz++) {
        const zOff = mz << MAP_SHIFT_X;
        const wz   = (mz - SPAWN_MZ) / MAP_SCALE_Z;

        for (let mx = 0; mx < MAP_W; mx++) {
          const wx = (mx - SPAWN_MX) / MAP_SCALE_X;
          const hMeters = evalCrawlerRockHeight(wx, wz);
          const hVox = Math.max(1, Math.min(64, Math.round(hMeters / HEIGHT_SCALE)));
          voxHeight[zOff + mx] = hVox;

          // Estratos geológicos de arenisca roja/naranja/ocre con grietas oscuras de referencia visual fija
          const stratum = (hVox + ((mx >> 3) & 1)) % 5;
          const crack   = (((mx * 13 ^ mz * 29) & 7) === 0) ? -18 : (((mx + mz) & 3) * 3);
          let r = 176 + stratum * 11 + crack;
          let g = 86  + stratum * 7  + crack;
          let b = 46  + stratum * 4  + crack;

          // Senda de neumáticos ligeramente oscurecida entre las 10 puertas
          for (let gIdx = 0; gIdx < CRAWLER_GATES.length; gIdx++) {
            const gt = CRAWLER_GATES[gIdx];
            if (Math.hypot(wx - gt.x, wz - gt.z) < 2.2) {
              r -= 16; g -= 12; b -= 8;
              break;
            }
          }
          voxColor[zOff + mx] = rgb565(clampByte(r), clampByte(g), clampByte(b));
        }
      }
    }

    function renderCrawlerGatesAndProps320(sim, projPoint320, projLine) {
      for (let i = 0; i < CRAWLER_GATES.length; i++) {
        const g = CRAWLER_GATES[i];
        const isAct = (i === sim.activeGate);
        const cY = Math.cos(g.yaw), sY = Math.sin(g.yaw);
        const halfW = 1.65;
        const lx = g.x - cY * halfW, lz = g.z + sY * halfW;
        const rx = g.x + cY * halfW, rz = g.z - sY * halfW;
        const ly = getTerrainHeightMeters(lx, lz);
        const ry = getTerrainHeightMeters(rx, rz);
        const poleH = isAct ? 1.85 : 1.10;

        // Banderín izquierdo (Rojo) y derecho (Verde) de cada puerta de Trial
        projLine(lx, ly, lz, lx, ly + poleH, lz, 0, 4);
        projLine(rx, ry, rz, rx, ry + poleH, rz, 0, 3);
        if (isAct) {
          projLine(lx, ly + poleH, lz, rx, ry + poleH, rz, 1, 2);
          const pTop = projPoint320(g.x, Math.max(ly, ry) + poleH + 0.45, g.z);
          if (pTop && pTop.sx > 8 && pTop.sx < DISP_W - 8 && pTop.sy > 8 && pTop.sy < DISP_H - 8) {
            drawOsdSmall320(`G${i + 1}`, pTop.sx - 5, pTop.sy - 4, C565.GOLD);
          }
        }
      }
    }

    function renderSolidRockCrawler320(sim, projPoint320, projLine) {
      const px = sim.px, py = sim.py, pz = sim.pz;
      const rx = sim.rx, ry = sim.ry, rz = sim.rz;
      const ux = sim.ux, uy = sim.uy, uz = sim.uz;
      const fx = sim.fx, fy = sim.fy, fz = sim.fz;

      const S = 1.68;
      function wp(r, u, f) {
        return projPoint320(
          px + (rx * r + ux * u + fx * f) * S,
          py + (ry * r + uy * u + fy * f) * S,
          pz + (rz * r + uz * u + fz * f) * S
        );
      }

      const preset = RC_CRAWLER_PRESETS[sim.presetIdx];
      let fc = 0;

      // 0. Sombra 3D bajo el chasis sobre la roca
      const groundY = getTerrainHeightMeters(px, pz) + 0.03;
      const shFL = projPoint320(px - rx * 0.9 + fx * 1.3, groundY, pz - rz * 0.9 + fz * 1.3);
      const shFR = projPoint320(px + rx * 0.9 + fx * 1.3, groundY, pz + rz * 0.9 + fz * 1.3);
      const shRL = projPoint320(px - rx * 0.9 - fx * 1.3, groundY, pz - rz * 0.9 - fz * 1.3);
      const shRR = projPoint320(px + rx * 0.9 - fx * 1.3, groundY, pz + rz * 0.9 - fz * 1.3);
      if (shFL && shFR && shRL && shRR) {
        fillQuad320(shFL, shFR, shRR, shRL, rgb565(48, 24, 14));
      }

      // 1. Ejes Sólidos Delantero y Trasero con Articulación Independiente (Axle Flex) + Links Naranjas
      const fFlexL = sim.flSusp, fFlexR = sim.frSusp;
      const rFlexL = sim.rlSusp, rFlexR = sim.rrSusp;
      const axFL = wp(-0.66, 0.18 + fFlexL,  0.72), axFR = wp( 0.66, 0.18 + fFlexR,  0.72);
      const axRL = wp(-0.66, 0.18 + rFlexL, -0.72), axRR = wp( 0.66, 0.18 + rFlexR, -0.72);
      const chCenter = wp(0.0, 0.34, 0.0);
      if (axFL && axFR) drawOutlinedLine320(axFL.sx, axFL.sy, axFR.sx, axFR.sy, C565.SILVER);
      if (axRL && axRR) drawOutlinedLine320(axRL.sx, axRL.sy, axRR.sx, axRR.sy, C565.SILVER);
      if (chCenter && axFL && axFR && axRL && axRR) {
        drawOutlinedLine320(chCenter.sx, chCenter.sy, axFL.sx, axFL.sy, C565.ORANGE);
        drawOutlinedLine320(chCenter.sx, chCenter.sy, axFR.sx, axFR.sy, C565.ORANGE);
        drawOutlinedLine320(chCenter.sx, chCenter.sy, axRL.sx, axRL.sy, C565.ORANGE);
        drawOutlinedLine320(chCenter.sx, chCenter.sy, axRR.sx, axRR.sy, C565.ORANGE);
      }

      // 2. Carrocería 4x4 Trail elevada (Capó, Cabina cuadrada, Jaula antivuelco y Batea trasera)
      const noseL = wp(-0.46, 0.42,  1.02), noseR = wp( 0.46, 0.42,  1.02);
      const hoodL = wp(-0.50, 0.52,  0.38), hoodR = wp( 0.50, 0.52,  0.38);
      const roofFL = wp(-0.44, 0.82,  0.22), roofFR = wp( 0.44, 0.82,  0.22);
      const roofRL = wp(-0.44, 0.82, -0.45), roofRR = wp( 0.44, 0.82, -0.45);
      const bedL   = wp(-0.50, 0.52, -0.98), bedR   = wp( 0.50, 0.52, -0.98);
      const sillFL = wp(-0.50, 0.30,  0.96), sillFR = wp( 0.50, 0.30,  0.96);
      const sillRL = wp(-0.50, 0.30, -0.96), sillRR = wp( 0.50, 0.30, -0.96);

      fc = addCraftQuad(fc, sillFL, sillRL, bedL, hoodL, preset.bodyCol);
      fc = addCraftQuad(fc, sillFR, hoodR, bedR, sillRR, preset.bodyCol);
      fc = addCraftQuad(fc, noseL, noseR, hoodR, hoodL, preset.bodyCol);
      fc = addCraftQuad(fc, hoodL, hoodR, roofFR, roofFL, rgb565(32, 44, 62));
      fc = addCraftQuad(fc, roofFL, roofFR, roofRR, roofRL, preset.roofCol);
      fc = addCraftQuad(fc, roofRL, roofRR, bedR, bedL, preset.bodyCol);

      // 3. Las 4 Ruedas Sobredimensionadas de Tacos con desplazamiento vertical independiente por roca
      const wheelDefs = [
        { r: -0.68, f:  0.72, susp: fFlexL, isFront: true  },
        { r:  0.68, f:  0.72, susp: fFlexR, isFront: true  },
        { r: -0.68, f: -0.72, susp: rFlexL, isFront: false },
        { r:  0.68, f: -0.72, susp: rFlexR, isFront: false }
      ];
      const stCos = Math.cos(sim.steerAngle), stSin = Math.sin(sim.steerAngle);
      const wRad = 0.33;

      for (let w = 0; w < 4; w++) {
        const wd = wheelDefs[w];
        const cF = wd.isFront ? stCos : 1.0;
        const sF = wd.isFront ? stSin : 0.0;
        const uBase = wd.susp;
        const pTop = wp(wd.r, uBase + wRad * 2.0, wd.f);
        const pBot = wp(wd.r, uBase,              wd.f);
        const pFrt = wp(wd.r + sF * wRad, uBase + wRad, wd.f + cF * wRad);
        const pBck = wp(wd.r - sF * wRad, uBase + wRad, wd.f - cF * wRad);
        fc = addCraftQuad(fc, pTop, pFrt, pBot, pBck, rgb565(22, 25, 30));
        const pBeadlock = wp(wd.r, uBase + wRad, wd.f);
        if (pBeadlock) drawInavCircleDot320(pBeadlock.sx, pBeadlock.sy, 2, C565.ORANGE);
      }

      renderSortedCraftFaces(fc);
      renderRemoteBlePlayer320(projPoint320, projLine);
    }

    const rcCrawlerSim = {
      px: 0.0, py: 0.5, pz: -16.0,
      vx: 0.0, vy: 0.0, vz: 0.0,
      yaw: 0.0,
      spd: 0.0,
      uFwd: 0.0,
      steerAngle: 0.0,
      thrCmd: 0.0,
      lowGear: true, // true = LOW 4:1 Rock Crawl + Drag Brake 100%, false = HIGH 1:1 Trail
      pitchRad: 0.0,
      rollRad: 0.0,
      flSusp: 0.0, frSusp: 0.0, rlSusp: 0.0, rrSusp: 0.0,
      tippedOver: false,
      presetIdx: 0,
      camMode: 0,
      chaseCam: false,
      activeGate: 0,
      lapCount: 0,
      penalties: 0,
      flightTime: 0.0,
      totalDistKm: 0.0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,

      reset() {
        if (activeWorldMapMode !== 'crawler') {
          generateCrawlerRockVoxelMap();
        }
        const g0 = CRAWLER_GATES[this.activeGate % CRAWLER_GATES.length];
        this.px = g0.x - Math.sin(g0.yaw) * 3.2;
        this.pz = g0.z - Math.cos(g0.yaw) * 3.2;
        this.py = getTerrainHeightMeters(this.px, this.pz) + 0.06;
        this.yaw = g0.yaw;
        this.vx = 0.0; this.vy = 0.0; this.vz = 0.0;
        this.uFwd = 0.0; this.spd = 0.0;
        this.steerAngle = 0.0;
        this.thrCmd = 0.0;
        this.pitchRad = 0.0;
        this.rollRad  = 0.0;
        this.tippedOver = false;
        this.updateBasis();
      },

      updateBasis() {
        const cY = Math.cos(this.yaw), sY = Math.sin(this.yaw);
        const cP = Math.cos(this.pitchRad), sP = Math.sin(this.pitchRad);
        const cR = Math.cos(this.rollRad),  sR = Math.sin(this.rollRad);
        this.fx = sY * cP;
        this.fy = sP;
        this.fz = cY * cP;
        const r0x = cY, r0z = -sY;
        this.rx = r0x * cR;
        this.ry = sR;
        this.rz = r0z * cR;
        this.ux = -r0x * sR - sY * sP * cR;
        this.uy = cR * cP;
        this.uz = -r0z * sR - cY * sP * cR;
      },

      step(dt) {
        this.flightTime += dt;
        const preset = RC_CRAWLER_PRESETS[this.presetIdx];

        // Botón A cambia entre Reductora LOW 4:1 (Rock Crawl + Drag Brake) y HIGH 1:1 (Trail)
        if (hwInput.justPressed('A')) {
          this.lowGear = !this.lowGear;
          showToast(this.lowGear ? 'CAJA: LOW 4:1 (DRAG BRAKE ON)' : 'CAJA: HIGH 1:1 (TRAIL SPEED)');
          playTone(this.lowGear ? 520 : 780, 0.05);
        }

        // Eje vertical del Stick Derecho (hwInput.ry) ajusta el Zoom de la cámara LOS
        if (Math.abs(hwInput.ry) > 0.24 && Math.abs(hwInput.ry) > Math.abs(hwInput.rx) * 1.15) {
          fcProfile.losZoom = Math.max(0.50, Math.min(3.50, (fcProfile.losZoom || 1.25) + hwInput.ry * 0.95 * dt));
        }

        if (this.tippedOver) {
          // Si volcó por exceso de inclinación (> tipDeg), mantener volcado hasta pulsar X (Winch/Reset)
          this.rollRad += (Math.sign(this.rollRad || 1) * 1.45 - this.rollRad) * Math.min(1.0, dt * 6.0);
          this.uFwd = 0.0; this.spd = 0.0;
          this.updateBasis();
          return;
        }

        const rawSteer = Math.abs(hwInput.rx) >= Math.abs(hwInput.lx) ? hwInput.rx : hwInput.lx;
        const targetSteer = applySuperExpo(rawSteer, 1.0, 0.30) * (38.0 * DEG2RAD);
        this.steerAngle += (targetSteer - this.steerAngle) * Math.min(1.0, dt * 15.0);

        const esc = hwInput.ly;
        this.thrCmd = esc;

        const fwdX = Math.sin(this.yaw), fwdZ = Math.cos(this.yaw);
        const rgtX = Math.cos(this.yaw), rgtZ = -Math.sin(this.yaw);

        // 1. Muestreo de las 4 Ruedas sobre el Mapa Voxel de Roca para calcular Pitch, Roll y Articulación de Ejes
        const halfTrack = 1.05, halfWb = 1.25;
        const hFL = getTerrainHeightMeters(this.px - rgtX * halfTrack + fwdX * halfWb, this.pz - rgtZ * halfTrack + fwdZ * halfWb);
        const hFR = getTerrainHeightMeters(this.px + rgtX * halfTrack + fwdX * halfWb, this.pz + rgtZ * halfTrack + fwdZ * halfWb);
        const hRL = getTerrainHeightMeters(this.px - rgtX * halfTrack - fwdX * halfWb, this.pz - rgtZ * halfTrack - fwdZ * halfWb);
        const hRR = getTerrainHeightMeters(this.px + rgtX * halfTrack - fwdX * halfWb, this.pz + rgtZ * halfTrack - fwdZ * halfWb);

        const avgH   = 0.25 * (hFL + hFR + hRL + hRR);
        const tPitch = Math.atan2((0.5 * (hFL + hFR)) - (0.5 * (hRL + hRR)), halfWb * 2.0);
        const tRoll  = Math.atan2((0.5 * (hFL + hRL)) - (0.5 * (hFR + hRR)), halfTrack * 2.0);

        this.py       += (avgH + 0.05 - this.py) * Math.min(1.0, dt * 16.0);
        this.pitchRad += (tPitch - this.pitchRad) * Math.min(1.0, dt * 12.0);
        this.rollRad  += (tRoll  - this.rollRad)  * Math.min(1.0, dt * 12.0);

        // Desplazamiento vertical relativo de cada rueda respecto al plano del chasis (Axle Flex visible en 3D)
        const flexMul = 0.28 * preset.flexScale;
        this.flSusp = Math.max(-0.22, Math.min(0.26, (hFL - avgH) * flexMul));
        this.frSusp = Math.max(-0.22, Math.min(0.26, (hFR - avgH) * flexMul));
        this.rlSusp = Math.max(-0.22, Math.min(0.26, (hRL - avgH) * flexMul));
        this.rrSusp = Math.max(-0.22, Math.min(0.26, (hRR - avgH) * flexMul));

        // 2. Comprobación de Vuelco por Centro de Gravedad (Rollover si supera tipDeg)
        const tiltDeg = Math.hypot(this.pitchRad, this.rollRad) * RAD2DEG;
        if (Math.abs(this.rollRad * RAD2DEG) > preset.tipDeg || Math.abs(this.pitchRad * RAD2DEG) > preset.tipDeg + 6) {
          this.tippedOver = true;
          this.penalties++;
          showToast('!VUELCO / ROLLOVER! PULSA X:WINCH');
          playTone(190, 0.14);
          return;
        }

        // 3. Tracción 4x4 con Diferenciales Bloqueados y Freno de Arrastre en Pendiente (Drag Brake 100% en LOW)
        const maxSpd = this.lowGear ? preset.lowSpd : preset.highSpd;
        const gravitySlopeAcc = -9.81 * Math.sin(this.pitchRad) * 0.65;

        if (Math.abs(esc) < 0.06 && this.lowGear) {
          // Drag Brake activo al 100%: clava el crawler en la roca inclinada al soltar el stick
          this.uFwd *= Math.max(0.0, 1.0 - dt * 22.0);
        } else {
          const targetSpd = esc * maxSpd;
          const torqueGain = this.lowGear ? 14.0 : 7.5;
          this.uFwd += ((targetSpd - this.uFwd) * torqueGain + gravitySlopeAcc * (this.lowGear ? 0.25 : 0.85)) * dt;
        }

        if (Math.abs(this.uFwd) > 0.04) {
          const dirSign = this.uFwd >= 0 ? 1.0 : -1.0;
          this.yaw += this.steerAngle * dirSign * Math.min(1.0, Math.abs(this.uFwd) / 0.8) * 1.95 * dt;
        }

        this.vx = Math.sin(this.yaw) * this.uFwd;
        this.vz = Math.cos(this.yaw) * this.uFwd;
        this.spd = Math.abs(this.uFwd);
        this.totalDistKm += (this.spd * dt) / 1000.0;

        this.px = Math.max(-36.0, Math.min(36.0, this.px + this.vx * dt));
        this.pz = Math.max(-24.0, Math.min(32.0, this.pz + this.vz * dt));
        this.updateBasis();

        // 4. Paso por las 10 Puertas Numeradas de Trial
        const g = CRAWLER_GATES[this.activeGate];
        if (Math.hypot(this.px - g.x, this.pz - g.z) < 2.35) {
          this.activeGate = (this.activeGate + 1) % CRAWLER_GATES.length;
          if (this.activeGate === 0) {
            this.lapCount++;
            showToast(`TRIAL COMPLETADO! VUELTA ${this.lapCount}`);
            playTone(1020, 0.12);
          } else {
            showToast(`PUERTA ${this.activeGate}/10 OK -> ${CRAWLER_GATES[this.activeGate].name}`);
            playTone(840, 0.06);
          }
        }
      },

      render() {
        const rockStandX = 0.0, rockStandY = 14.5, rockStandZ = -24.0;
        let camX = rockStandX, camY = rockStandY, camZ = rockStandZ;
        let cRx = 1, cRy = 0, cRz = 0;
        let cUx = 0, cUy = 1, cUz = 0;
        let cFx = 0, cFy = 0, cFz = 1;
        let zoomFactor = 1.0;

        const userZoom = Math.max(0.50, Math.min(3.50, fcProfile.losZoom || 1.25));

        if (this.camMode === 2 || this.chaseCam) {
          const fc = computeFollowCamPose(this, 4.8 / userZoom, Math.max(1.1, 2.1 / Math.sqrt(userZoom)), 16.0);
          camX = fc.camX; camY = Math.max(getTerrainHeightMeters(camX, camZ) + 0.9, fc.camY); camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
          zoomFactor = userZoom;
        } else {
          const rawDx = this.px - rockStandX;
          const rawDz = this.pz - rockStandZ;
          const horizDist = Math.hypot(rawDx, rawDz) || 1.0;
          const dirHx = rawDx / horizDist;
          const dirHz = rawDz / horizDist;

          if (this.camMode === 0) {
            const baseEff = horizDist > 10.5 ? (10.5 + (horizDist - 10.5) * 0.28) : horizDist;
            const effHoriz = Math.max(3.4, Math.min(60.0, baseEff / userZoom));
            zoomFactor = horizDist / Math.max(1.0, effHoriz);
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(getTerrainHeightMeters(camX, camZ) + 2.2, Math.min(20.0, this.py + 2.6 + effHoriz * 0.58));
          } else {
            const effHoriz = Math.max(3.6, Math.min(68.0, horizDist / userZoom));
            zoomFactor = userZoom;
            camX = this.px - dirHx * effHoriz;
            camZ = this.pz - dirHz * effHoriz;
            camY = Math.max(getTerrainHeightMeters(camX, camZ) + 2.4, Math.min(22.0, 16.0 / Math.sqrt(userZoom)));
          }

          const dx = this.px - camX;
          const dy = (this.py + 0.35) - camY;
          const dz = this.pz - camZ;
          const dLen = Math.hypot(dx, dy, dz) || 1.0;
          cFx = dx / dLen; cFy = dy / dLen; cFz = dz / dLen;
          const hLen = Math.hypot(cFx, cFz) || 1.0;
          cRx =  cFz / hLen; cRy = 0.0; cRz = -cFx / hLen;
          cUx = cFy * cRz - cFz * cRy;
          cUy = cFz * cRx - cFx * cRz;
          cUz = cFx * cRy - cFy * cRx;
        }

        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderCrawlerGatesAndProps320(this, projPoint320, projLine);
        renderSolidRockCrawler320(this, projPoint320, projLine);
        this.renderCrawlerOsd320(zoomFactor);
      },

      renderCrawlerOsd320(zoomFactor) {
        const WHITE = 0xFFFF;
        const preset = RC_CRAWLER_PRESETS[this.presetIdx];
        const titleStr = `4X4 CRAWLER // ${preset.name}`;
        drawOsdSmall320(titleStr, 160 - ((titleStr.length * 5) >> 1), 6, WHITE);

        const pitchDeg = Math.round(this.pitchRad * RAD2DEG);
        const rollDeg  = Math.round(this.rollRad  * RAD2DEG);
        const maxTilt  = Math.max(Math.abs(pitchDeg), Math.abs(rollDeg));

        let statusStr = this.lowGear ? 'LOW 4:1 // DRAG BRAKE 100%' : 'HIGH 1:1 // TRAIL GEAR';
        let statusCol = this.lowGear ? C565.GREEN : C565.CYAN;
        if (this.tippedOver) {
          statusStr = '!ROLLOVER! PRESS X FOR WINCH';
          statusCol = C565.RED;
        } else if (maxTilt >= preset.tipDeg - 8) {
          statusStr = `!CRITICAL TILT ${maxTilt} DEG!`;
          statusCol = C565.ORANGE;
        }
        drawOsdSmall320(statusStr, 160 - ((statusStr.length * 5) >> 1), 16, statusCol);

        const g = CRAWLER_GATES[this.activeGate];
        const distG = Math.hypot(g.x - this.px, g.z - this.pz).toFixed(1);
        drawOsdSmall320(`GATE ${this.activeGate + 1}/10`, 8, 8,  C565.GOLD);
        drawOsdSmall320(`DST  ${distG}M`,                8, 18, WHITE);
        drawOsdSmall320(`PEN  ${this.penalties}`,       8, 28, this.penalties > 0 ? C565.ORANGE : C565.GREEN);

        const zUsr = (fcProfile.losZoom || 1.25).toFixed(2);
        const camLbl = (this.camMode === 2 || this.chaseCam) ? `CHS Z:${zUsr}X` : (this.camMode === 0 ? `LOS ${zoomFactor.toFixed(1)}X` : `MAN ${zUsr}X`);
        drawOsdSmall320(camLbl,            254, 8,  C565.CYAN);
        drawOsdSmall320(`A:GEAR X:WINCH`,  246, 18, WHITE);
        drawOsdSmall320(`[-ZOOM ${zUsr}+]`, 244, 28, C565.GOLD);

        // Inclinómetro Gráfico Pitch & Roll en la esquina inferior derecha
        const icx = 282, icy = 192, ir = 18;
        drawInavCircleDot320(icx, icy, 2, NIN565.CARD);
        const rLineX = Math.round(Math.cos(this.rollRad) * ir);
        const rLineY = Math.round(Math.sin(this.rollRad) * ir);
        const incCol = maxTilt >= preset.tipDeg - 8 ? C565.RED : (maxTilt >= 25 ? C565.GOLD : C565.GREEN);
        drawOutlinedLine320(icx - rLineX, icy - rLineY, icx + rLineX, icy + rLineY, incCol);
        drawOsdSmall320(`PIT ${pitchDeg >= 0 ? '+' : ''}${pitchDeg}D`, 248, 212, WHITE);
        drawOsdSmall320(`ROL ${rollDeg  >= 0 ? '+' : ''}${rollDeg}D`,  248, 222, incCol);

        const kmh = (this.spd * 3.6).toFixed(1);
        drawOsdSmall320(`SPD  ${kmh} KMH`, 8, 194, C565.GREEN);
        drawOsdSmall320(`GEAR ${this.lowGear ? 'LOW 4:1' : 'HIGH 1:1'}`, 8, 205, C565.GOLD);
        drawOsdSmall320(`DIFF LOCKED 4WD`, 8, 216, C565.CYAN);
      }
    };

    function handleOledTouchPoint(clientX, clientY, isStart) {
      const rect = oledCanvas.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (clientX - rect.left) / (rect.width || 1)));
      const ny = Math.max(0, Math.min(1, (clientY - rect.top) / (rect.height || 1)));
      capTouch.x320 = Math.round(nx * (DISP_W - 1));
      capTouch.y240 = Math.round(ny * (DISP_H - 1));
      capTouch.lx128 = nx * SCREEN_W;
      capTouch.ly64  = ny * SCREEN_H;
      capTouch.active = true;
      if (isStart) capTouch.justTapped = true;
    }

    oledCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, true);
    }, { passive: false });
    oledCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, false);
    }, { passive: false });
    oledCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      capTouch.active = false;
    }, { passive: false });
    oledCanvas.addEventListener('mousedown', (e) => {
      handleOledTouchPoint(e.clientX, e.clientY, true);
    });
    window.addEventListener('mousemove', (e) => {
      if (capTouch.active && e.buttons === 1) handleOledTouchPoint(e.clientX, e.clientY, false);
