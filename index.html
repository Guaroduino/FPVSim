<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#181a22" />
  <title>RETRO-GO // ESP32-S3 + 2.8" ILI9341V IPS 320x240 RGB565 v10</title>
  <style>
    :root {
      --case-main: #222530;
      --case-dark: #15171e;
      --bezel-black: #08090c;
      --rg-red: #e53935;
      --rg-gold: #ffb300;
      --rg-cyan: #00e5ff;
      --rg-green: #00e676;
      --btn-a: #d32f2f;
      --btn-b: #f57c00;
      --btn-x: #1976d2;
      --btn-y: #388e3c;
      --text: #eceff4;
      --muted: #9aa5b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: var(--case-dark);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      touch-action: none;
    }

    /* Fullscreen Edge-to-Edge Console Shell on Mobile */
    .retrogo-shell {
      width: 100%;
      height: 100%;
      container-type: size;
      background: linear-gradient(180deg, #2b2f3d 0%, #1e212b 55%, #15171f 100%);
      padding: env(safe-area-inset-top, 6px) 2.2vw env(safe-area-inset-bottom, 8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8dvh;
    }

    /* Only constrain width on large desktop PC monitors with mouse */
    @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090a0e;
      }
      .retrogo-shell {
        max-width: 460px;
        max-height: 920px;
        padding: 10px 12px;
        border: 3px solid #3c4254;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* 1. Top Status Bar */
    .shell-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7dvh 2vw;
      background: #14161d;
      border: 1px solid #313646;
      border-radius: 8px;
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      flex-shrink: 0;
    }

    .led-cluster {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .led {
      width: clamp(7px, 1.8cqw, 12px);
      height: clamp(7px, 1.8cqw, 12px);
      border-radius: 50%;
      background: var(--rg-green);
      box-shadow: 0 0 6px var(--rg-green);
    }

    .led.sd-act {
      background: var(--rg-gold);
      box-shadow: 0 0 6px var(--rg-gold);
      opacity: 0.3;
      transition: opacity 0.08s;
    }

    .led.sd-act.blink {
      opacity: 1;
    }

    .top-hw-pills {
      display: flex;
      gap: 1.2cqw;
    }

    .pill-btn {
      background: #232734;
      color: var(--text);
      border: 1.5px solid #404659;
      border-radius: 6px;
      padding: 0.5dvh 2cqw;
      font-family: inherit;
      font-size: clamp(0.64rem, 2.2cqw, 1rem);
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      border-color: var(--rg-gold);
      color: var(--rg-gold);
    }

    /* 2. Retro-Go Screen Lens (128x64 Native 1-Bit OLED) */
    .screen-lens {
      background: var(--bezel-black);
      border: 3px solid #141720;
      border-radius: 12px 12px 20px 12px;
      padding: 0.7dvh 2cqw 0.8dvh;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 1),
        0 2px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.4dvh;
      flex-shrink: 0;
    }

    .lens-header {
      display: none;
    }

    .rg-stripe {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .rg-stripe i {
      width: clamp(9px, 2.2cqw, 15px);
      height: clamp(3px, 0.8cqw, 5px);
      display: inline-block;
      border-radius: 1px;
    }

    .oled-container {
      width: min(100%, 46cqh);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #040609;
      border: 2px solid #2b3344;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: pointer;
    }

    #oledCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .oled-container.pixel-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 50%, transparent 50%);
      background-size: 100% 2px;
      pointer-events: none;
    }

    .lens-branding {
      display: none;
    }

    .rg-logo-text {
      font-size: clamp(0.75rem, 2.8cqw, 1.25rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      color: #d8dee9;
    }

    .rg-logo-text span {
      color: var(--rg-red);
    }

    .rg-sub-status {
      font-size: clamp(0.58rem, 2cqw, 0.92rem);
      color: var(--rg-gold);
    }

    /* 3. UPPER CONTROLS: DUAL ANALOG JOYSTICKS (WITH L3 / R3 INTEGRATED) */
    .upper-joysticks-section {
      flex: 1.08;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      align-items: center;
      justify-items: center;
      padding: 0.4dvh 1cqw;
    }

    .stick-unit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7dvh;
      position: relative;
    }

    .stick-top-row {
      width: 94%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 1cqw;
    }

    .stick-adc-label {
      display: none;
    }

    .btn-stick-click {
      background: #1b1f2a;
      border: 2px solid #48526a;
      color: var(--rg-cyan);
      border-radius: 8px;
      padding: 0.6dvh 2.6cqw;
      font-family: inherit;
      font-size: clamp(0.68rem, 2.5cqw, 1.1rem);
      font-weight: 800;
      box-shadow: 0 3px 0 #0c0e13;
    }

    .btn-stick-click.pressed {
      transform: translateY(2px);
      background: var(--rg-cyan);
      color: #000;
    }

    .stick-canvas {
      width: min(44cqw, 26.5cqh);
      height: min(44cqw, 26.5cqh);
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at center, #1a1f2b 0%, #0b0d13 100%);
      border: 3px solid #3f485e;
      border-radius: 50%;
      touch-action: none;
      display: block;
      box-shadow: inset 0 6px 20px rgba(0, 0, 0, 0.95), 0 3px 8px rgba(255, 255, 255, 0.07);
    }

    .stick-canvas.engaged {
      border-color: var(--rg-gold);
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.95), 0 0 16px rgba(255, 179, 0, 0.45);
    }

    /* 4. LOWER CONTROLS: [D-PAD LEFT] — [SELECT / MENU CENTER] — [4 DIAMOND BUTTONS RIGHT] */
    .lower-controls-deck {
      flex: 1.05;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 1.5cqw;
      padding: 0.8dvh 1.5cqw 1dvh;
      background: rgba(12, 14, 20, 0.42);
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .hw-btn {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.04s;
    }

    .hw-btn.pressed {
      transform: translateY(2px);
      filter: brightness(1.3);
    }

    /* Classic Cross D-Pad (Left Side) - Scaled to fill left zone */
    .dpad-cross {
      width: min(37cqw, 25cqh);
      height: min(37cqw, 25cqh);
      position: relative;
    }

    .dpad-arm {
      position: absolute;
      background: linear-gradient(180deg, #323848 0%, #1d202b 100%);
      border: 2.5px solid #4a5268;
      color: #d0d8e8;
      font-size: clamp(1rem, 4.2cqw, 1.9rem);
      box-shadow: 0 4px 0 #090b10, 0 6px 12px rgba(0,0,0,0.55);
    }

    .dpad-arm.pressed {
      background: #41495f;
      color: var(--rg-gold);
      border-color: var(--rg-gold);
    }

    .dpad-up {
      top: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 18% 18% 0 0;
      border-bottom: none;
    }
    .dpad-down {
      bottom: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 0 0 18% 18%;
      border-top: none;
    }
    .dpad-left {
      top: 33%; left: 0; width: 36%; height: 34%;
      border-radius: 18% 0 0 18%;
      border-right: none;
    }
    .dpad-right {
      top: 33%; right: 0; width: 36%; height: 34%;
      border-radius: 0 18% 18% 0;
      border-left: none;
    }
    .dpad-center {
      position: absolute;
      top: 33%; left: 33%; width: 34%; height: 34%;
      background: #242834;
      pointer-events: none;
    }
    .dpad-center::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, #141720 20%, #292e3d 100%);
    }

    /* Center 2 System Buttons (SELECT + START/MENU) */
    .center-sys-cluster {
      display: flex;
      flex-direction: column;
      gap: 2.2cqh;
      align-items: center;
      justify-content: center;
      padding: 0 0.5cqw;
    }

    .btn-sys-pill {
      width: clamp(74px, 19.5cqw, 140px);
      height: clamp(36px, 5.4cqh, 62px);
      background: #1a1e28;
      border: 2.5px solid #4e566e;
      border-radius: 999px;
      color: #dce3ef;
      font-size: clamp(0.72rem, 2.5cqw, 1.18rem);
      letter-spacing: 0.6px;
      box-shadow: 0 4px 0 #0a0c10, 0 5px 10px rgba(0,0,0,0.45);
    }

    .btn-sys-pill.menu-pill {
      border-color: var(--rg-red);
      color: var(--rg-gold);
    }

    /* 4 Action Buttons in Classic Diamond (X Top, Y Left, A Right, B Bottom) - Scaled to fill right zone */
    .diamond-cluster {
      width: min(38cqw, 25.5cqh);
      height: min(38cqw, 25.5cqh);
      position: relative;
    }

    .btn-diamond {
      position: absolute;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3d4356, #1d202b);
      border: 3px solid #525a72;
      color: #fff;
      font-size: clamp(0.95rem, 3.8cqw, 1.75rem);
      line-height: 1;
      box-shadow: 0 5px 0 #090b10, 0 6px 12px rgba(0,0,0,0.6);
    }

    .btn-diamond small {
      font-size: clamp(0.54rem, 1.95cqw, 0.9rem);
      color: #d4dce8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Posiciones del Diamante en porcentaje: X arriba, Y izquierda, A derecha, B abajo */
    .btn-diamond.pos-top {
      top: 0; left: 32%;
      border-color: var(--btn-x);
    }
    .btn-diamond.pos-left {
      top: 32%; left: 0;
      border-color: var(--btn-y);
    }
    .btn-diamond.pos-right {
      top: 32%; right: 0;
      border-color: var(--btn-a);
    }
    .btn-diamond.pos-bottom {
      bottom: 0; left: 32%;
      border-color: var(--btn-b);
    }
  </style>
</head>
<body>
  <div class="retrogo-shell">
    <!-- 1. Top Hardware Bar -->
    <header class="shell-top-bar">
      <div class="led-cluster">
        <span class="led" title="Power ON"></span>
        <span>PWR</span>
        <span id="sdLed" class="led sd-act" title="Flash / SD Activity"></span>
        <span>SPI</span>
        <span style="color:#828c9e;margin-left:3px;">S3 N16R8 + COMANCHE 3D (v47)</span>
      </div>
      <div class="top-hw-pills">
        <button id="btnPalette" class="pill-btn" title="Cambiar Modo de Pantalla SPI / IPS / 1-Bit">🎨 IPS 60MHz</button>
      </div>
    </header>

    <!-- 2. Retro-Go 2.8" 320x240 IPS RGB565 ILI9341V + Capacitive Touch Screen Lens -->
    <section class="screen-lens">
      <div class="lens-header">
        <div class="rg-stripe">
          <i style="background:#e53935"></i>
          <i style="background:#ffb300"></i>
          <i style="background:#00e676"></i>
          <i style="background:#00e5ff"></i>
          <span style="margin-left:4px;">2.8" IPS 320×240 RGB565 (ILI9341V + TOUCH)</span>
        </div>
        <span id="uiFpsBattery">60FPS | DMA 60MHz</span>
      </div>

      <div id="oledContainer" class="oled-container">
        <canvas id="oledCanvas" width="320" height="240"></canvas>
      </div>

      <div class="lens-branding">
        <div class="rg-logo-text">RETRO<span>-GO</span> <small style="font-size:0.55em;color:#8b9bb4;font-style:normal;">ILI9341V + FT6336</small></div>
        <div id="uiHintBar" class="rg-sub-status">TOUCH/DPAD/STICK:NAV | A:RUN | MENU:OSD</div>
      </div>
    </section>

    <!-- 3. Upper Controls: 2 Analog Joysticks with L3 / R3 Click -->
    <section class="upper-joysticks-section">
      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutLeft" class="stick-adc-label">L:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="L3">L3 CLICK</button>
        </div>
        <canvas id="stickLeft" class="stick-canvas" width="200" height="200"></canvas>
      </div>

      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutRight" class="stick-adc-label">R:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="R3">R3 CLICK</button>
        </div>
        <canvas id="stickRight" class="stick-canvas" width="200" height="200"></canvas>
      </div>
    </section>

    <!-- 4. Lower Controls: [Cruceta D-Pad Izquierda] + [2 Botones Centro] + [4 Botones Diamante Derecha] -->
    <section class="lower-controls-deck">
      <!-- Left: Cross D-Pad -->
      <div class="dpad-cross">
        <button class="hw-btn dpad-arm dpad-up" data-btn="UP">▲</button>
        <button class="hw-btn dpad-arm dpad-down" data-btn="DOWN">▼</button>
        <button class="hw-btn dpad-arm dpad-left" data-btn="LEFT">◀</button>
        <button class="hw-btn dpad-arm dpad-right" data-btn="RIGHT">▶</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Center: 2 System Buttons (SELECT & MENU/START) -->
      <div class="center-sys-cluster">
        <button class="hw-btn btn-sys-pill" data-btn="SELECT">SELECT</button>
        <button class="hw-btn btn-sys-pill menu-pill" data-btn="MENU">★ MENU</button>
      </div>

      <!-- Right: 4 Action Buttons in Diamond Layout (X Top, Y Left, A Right, B Bottom) -->
      <div class="diamond-cluster">
        <button class="hw-btn btn-diamond pos-top" data-btn="X">
          <span>X</span>
          <small id="lblX">RST</small>
        </button>
        <button class="hw-btn btn-diamond pos-left" data-btn="Y">
          <span>Y</span>
          <small id="lblY">MOD</small>
        </button>
        <button class="hw-btn btn-diamond pos-right" data-btn="A">
          <span>A</span>
          <small id="lblA">GAS</small>
        </button>
        <button class="hw-btn btn-diamond pos-bottom" data-btn="B">
          <span>B</span>
          <small id="lblB">BRK</small>
        </button>
      </div>
    </section>
  </div>

  <script>
    /***************************************************************************
     * 1. HARDWARE ABSTRACTION LAYER (HAL) — 2.8" ILI9341V IPS 320x240 RGB565
     *    - Framebuffer real de 16 bits RGB565: 320 x 240 x 2 = 153,600 Bytes (150 KB)
     *    - Compatible con doble buffer DMA en SRAM del ESP32-S3 (LovyanGFX / esp_lcd)
     *    - Rasterizador Bresenham en resolución nativa 320x240 blindado contra bloqueos
     ***************************************************************************/
    const DISP_W = 320;
    const DISP_H = 240;
    const VRAM_PIXELS = DISP_W * DISP_H; // 76,800 píxeles
    const VRAM_BYTES  = VRAM_PIXELS * 2; // 153,600 bytes (150 KB RGB565)
    const vram565 = new Uint16Array(VRAM_PIXELS);

    // Coordenadas lógicas base (128x64 -> escaladas en hardware a 320x240 = x2.5, x3.75)
    const SCREEN_W = 128;
    const SCREEN_H = 64;
    const SCALE_X = DISP_W / SCREEN_W; // 2.5
    const SCALE_Y = DISP_H / SCREEN_H; // 3.75

    const oledCanvas = document.getElementById('oledCanvas');
    const oledCtx = oledCanvas.getContext('2d', { alpha: false });
    const oledImgData = oledCtx.createImageData(DISP_W, DISP_H);
    const rgbaPixels = oledImgData.data;

    function rgb565(r, g, b) {
      return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | ((b & 0xF8) >> 3);
    }

    // Tabla LUT precalculada para convertir RGB565 -> RGBA8888 en <0.3ms
    const LUT_R = new Uint8Array(65536);
    const LUT_G = new Uint8Array(65536);
    const LUT_B = new Uint8Array(65536);
    for (let c = 0; c < 65536; c++) {
      const r5 = (c >> 11) & 0x1F;
      const g6 = (c >> 5)  & 0x3F;
      const b5 =  c        & 0x1F;
      LUT_R[c] = (r5 << 3) | (r5 >> 2);
      LUT_G[c] = (g6 << 2) | (g6 >> 4);
      LUT_B[c] = (b5 << 3) | (b5 >> 2);
    }

    // Paleta de índices rápidos RGB565 (además de aceptar cualquier color 16-bit directo)
    const C565 = {
      BG:      rgb565(8, 12, 22),     // 0: Fondo oscuro IPS
      WHITE:   rgb565(240, 250, 255), // 1: Blanco brillante
      GOLD:    rgb565(255, 190, 0),   // 2: Retro-Go Gold / Ámbar
      GREEN:   rgb565(0, 235, 118),   // 3: Verde Neón
      RED:     rgb565(245, 55, 65),   // 4: Rojo Carmesí
      CYAN:    rgb565(0, 229, 255),   // 5: Cian HUD
      GREY:    rgb565(90, 102, 125),  // 6: Gris Asfalto / UI
      DARKGRN: rgb565(18, 85, 48),    // 7: Verde Terreno
      NAVY:    rgb565(20, 34, 68),    // 8: Azul Retro-Go Header
      ORANGE:  rgb565(255, 120, 20),  // 9: Naranja Rally / Fuego
      MAGENTA: rgb565(245, 60, 210),  // 10: Magenta Gate Activo
      SKYTOP:  rgb565(12, 24, 58),    // 11: Cielo Superior
      SKYBOT:  rgb565(38, 78, 138),   // 12: Horizonte Cielo
      GNDTOP:  rgb565(18, 46, 30),    // 13: Suelo Horizonte
      GNDBOT:  rgb565(10, 24, 18)     // 14: Suelo Cercano
    };

    const INDEX_PALETTE = [
      C565.BG, C565.WHITE, C565.GOLD, C565.GREEN,
      C565.RED, C565.CYAN, C565.GREY, C565.DARKGRN,
      C565.NAVY, C565.ORANGE, C565.MAGENTA, C565.SKYTOP,
      C565.SKYBOT, C565.GNDTOP, C565.GNDBOT
    ];

    // Modos de bus SPI en el ESP32-S3 + ILI9341V
    const SPI_MODES = [
      { name: 'IPS 60MHz DMA', spiMhz: 60, mono: false, targetFps: 60 },
      { name: 'IPS 80MHz QIO', spiMhz: 80, mono: false, targetFps: 60 },
      { name: 'IPS 40MHz SPI', spiMhz: 40, mono: false, targetFps: 45 },
      { name: '1-BIT MONO SIM',spiMhz: 40, mono: true,  targetFps: 60 }
    ];
    let paletteIdx = 0;

    function resolveColor565(color) {
      if (SPI_MODES[paletteIdx].mono) {
        return color === 0 ? rgb565(6, 10, 14) : rgb565(0, 235, 130);
      }
      if (color >= 0 && color < INDEX_PALETTE.length) return INDEX_PALETTE[color];
      return color & 0xFFFF;
    }

    function blinkSdLed() {
      const el = document.getElementById('sdLed');
      el.classList.add('blink');
      setTimeout(() => el.classList.remove('blink'), 120);
    }

    function fbClear(bgColor = 0) {
      vram565.fill(resolveColor565(bgColor));
    }

    // Relleno uniforme de cielo y tierra en 320x240 (sin sub-bandas artificiales)
    function fbFillHorizon320(horizonY240, skyCol, gndCol) {
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }
      const hy = Math.max(0, Math.min(DISP_H, horizonY240 | 0));
      if (hy > 0) vram565.fill(skyCol, 0, hy * DISP_W);
      if (hy < DISP_H) vram565.fill(gndCol, hy * DISP_W, DISP_H * DISP_W);
    }

    // Relleno de trapecio horizontal (para asfalto y pianos en WRC Rally a 320x240)
    function fbFillQuadScanline(x0Top, x1Top, yTop, x0Bot, x1Bot, yBot, color565) {
      if (SPI_MODES[paletteIdx].mono) return;
      const c = resolveColor565(color565);
      let ya = Math.round(yTop * SCALE_Y);
      let yb = Math.round(yBot * SCALE_Y);
      let xa0 = x0Top * SCALE_X, xa1 = x1Top * SCALE_X;
      let xb0 = x0Bot * SCALE_X, xb1 = x1Bot * SCALE_X;
      if (ya > yb) {
        [ya, yb] = [yb, ya];
        [xa0, xb0] = [xb0, xa0];
        [xa1, xb1] = [xb1, xa1];
      }
      const span = Math.max(1, yb - ya);
      const yStart = Math.max(0, ya), yEnd = Math.min(DISP_H - 1, yb);
      for (let y = yStart; y <= yEnd; y++) {
        const t = (y - ya) / span;
        const lx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa0 + (xb0 - xa0) * t)));
        const rx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa1 + (xb1 - xa1) * t)));
        if (rx >= lx) vram565.fill(c, y * DISP_W + lx, y * DISP_W + rx + 1);
      }
    }

    function fbSetPixel320(px, py, c565) {
      const ix = px | 0, iy = py | 0;
      if (ix < 0 || ix >= DISP_W || iy < 0 || iy >= DISP_H) return;
      vram565[iy * DISP_W + ix] = c565;
    }

    function fbSetPixel(x, y, color = 1) {
      const c = resolveColor565(color);
      const px = Math.round(x * SCALE_X);
      const py = Math.round(y * SCALE_Y);
      fbSetPixel320(px, py, c);
      fbSetPixel320(px + 1, py, c);
      fbSetPixel320(px, py + 1, c);
      fbSetPixel320(px + 1, py + 1, c);
    }

    function fbRect(x, y, w, h, fill = false, color = 1) {
      const c = resolveColor565(color);
      const x0 = Math.max(0, Math.round(x * SCALE_X));
      const y0 = Math.max(0, Math.round(y * SCALE_Y));
      const x1 = Math.min(DISP_W - 1, Math.round((x + w) * SCALE_X) - 1);
      const y1 = Math.min(DISP_H - 1, Math.round((y + h) * SCALE_Y) - 1);
      if (x1 < x0 || y1 < y0) return;

      if (fill) {
        for (let py = y0; py <= y1; py++) {
          vram565.fill(c, py * DISP_W + x0, py * DISP_W + x1 + 1);
        }
      } else {
        for (let px = x0; px <= x1; px++) {
          fbSetPixel320(px, y0, c); fbSetPixel320(px, y0 + 1, c);
          fbSetPixel320(px, y1, c); fbSetPixel320(px, y1 - 1, c);
        }
        for (let py = y0; py <= y1; py++) {
          fbSetPixel320(x0, py, c); fbSetPixel320(x0 + 1, py, c);
          fbSetPixel320(x1, py, c); fbSetPixel320(x1 - 1, py, c);
        }
      }
    }

    function fbCircle(cx, cy, r, color = 1) {
      if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
      const c = resolveColor565(color);
      const x0 = Math.round(cx * SCALE_X), y0 = Math.round(cy * SCALE_Y);
      let x = Math.min(280, Math.max(1, Math.round(r * ((SCALE_X + SCALE_Y) * 0.5)))), y = 0, err = 0;
      let guard = 0;
      while (x >= y && ++guard < 400) {
        const pts = [
          [x0 + x, y0 + y], [x0 + y, y0 + x], [x0 - y, y0 + x], [x0 - x, y0 + y],
          [x0 - x, y0 - y], [x0 - y, y0 - x], [x0 + y, y0 - x], [x0 + x, y0 - y]
        ];
        for (let i = 0; i < 8; i++) {
          fbSetPixel320(pts[i][0], pts[i][1], c);
          fbSetPixel320(pts[i][0] + 1, pts[i][1], c);
        }
        y += 1;
        if (err <= 0) err += 2 * y + 1;
        if (err > 0) { x -= 1; err -= 2 * x + 1; }
      }
    }

    const CLIP_LEFT = 1, CLIP_RIGHT = 2, CLIP_BOTTOM = 4, CLIP_TOP = 8;
    function computeOutCode320(x, y) {
      let c = 0;
      if (x < 0) c |= CLIP_LEFT; else if (x >= DISP_W) c |= CLIP_RIGHT;
      if (y < 0) c |= CLIP_TOP;  else if (y >= DISP_H) c |= CLIP_BOTTOM;
      return c;
    }

    // Bresenham en resolución nativa 320x240 con clipping Cohen-Sutherland blindado
    function fbDrawLine(lx0, ly0, lx1, ly1, dashedMask = 0, color = 1) {
      if (!Number.isFinite(lx0) || !Number.isFinite(ly0) || !Number.isFinite(lx1) || !Number.isFinite(ly1)) return;
      let x0 = lx0 * SCALE_X, y0 = ly0 * SCALE_Y;
      let x1 = lx1 * SCALE_X, y1 = ly1 * SCALE_Y;
      const c = resolveColor565(color);

      let out0 = computeOutCode320(x0, y0), out1 = computeOutCode320(x1, y1), accept = false;
      let clipIter = 0;

      while (++clipIter <= 12) {
        if (!(out0 | out1)) { accept = true; break; }
        else if (out0 & out1) break;
        else {
          let x = 0, y = 0;
          const out = out0 ? out0 : out1;
          const dx = x1 - x0, dy = y1 - y0;

          if (out & CLIP_BOTTOM) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (DISP_H - 1 - y0) / dy : x0;
            y = DISP_H - 1;
          } else if (out & CLIP_TOP) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (0 - y0) / dy : x0;
            y = 0;
          } else if (out & CLIP_RIGHT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (DISP_W - 1 - x0) / dx : y0;
            x = DISP_W - 1;
          } else if (out & CLIP_LEFT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (0 - x0) / dx : y0;
            x = 0;
          }

          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          if (out === out0) { x0 = x; y0 = y; out0 = computeOutCode320(x0, y0); }
          else { x1 = x; y1 = y; out1 = computeOutCode320(x1, y1); }
        }
      }

      if (!accept) return;

      let ix0 = Math.max(0, Math.min(DISP_W - 1, Math.round(x0)));
      let iy0 = Math.max(0, Math.min(DISP_H - 1, Math.round(y0)));
      const ix1 = Math.max(0, Math.min(DISP_W - 1, Math.round(x1)));
      const iy1 = Math.max(0, Math.min(DISP_H - 1, Math.round(y1)));

      const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
      const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
      let err = dx + dy, step = 0;

      while (step < 640) {
        if (!dashedMask || ((step >> 1) & dashedMask) === 0) {
          fbSetPixel320(ix0, iy0, c);
          if (ix0 + 1 < DISP_W) fbSetPixel320(ix0 + 1, iy0, c);
        }
        if (ix0 === ix1 && iy0 === iy1) break;
        const e2 = err << 1;
        if (e2 >= dy) { err += dy; ix0 += sx; }
        if (e2 <= dx) { err += dx; iy0 += sy; }
        step++;
      }
    }

    const FONT_3X5 = {
      '0': [7,5,5,5,7], '1': [2,6,2,2,7], '2': [7,1,7,4,7], '3': [7,1,7,1,7],
      '4': [5,5,7,1,1], '5': [7,4,7,1,7], '6': [7,4,7,5,7], '7': [7,1,1,2,2],
      '8': [7,5,7,5,7], '9': [7,5,7,1,7],
      'A': [2,5,7,5,5], 'B': [6,5,6,5,6], 'C': [7,4,4,4,7], 'D': [6,5,5,5,6],
      'E': [7,4,6,4,7], 'F': [7,4,6,4,4], 'G': [7,4,5,5,7], 'H': [5,5,7,5,5],
      'I': [7,2,2,2,7], 'J': [1,1,1,5,7], 'K': [5,5,6,5,5], 'L': [4,4,4,4,7],
      'M': [5,7,7,5,5], 'N': [5,7,7,7,5], 'O': [7,5,5,5,7], 'P': [7,5,7,4,4],
      'Q': [7,5,5,7,3], 'R': [6,5,6,5,5], 'S': [7,4,7,1,7], 'T': [7,2,2,2,2],
      'U': [5,5,5,5,7], 'V': [5,5,5,5,2], 'W': [5,5,7,7,5], 'X': [5,5,2,5,5],
      'Y': [5,5,2,2,2], 'Z': [7,1,2,4,7],
      ':': [0,2,0,2,0], '-': [0,0,7,0,0], '/': [1,1,2,4,4], '.': [0,0,0,0,2],
      '+': [0,2,7,2,0], '>': [4,2,1,2,4], '<': [1,2,4,2,1], '%': [5,1,2,4,5],
      '[': [7,4,4,4,7], ']': [7,1,1,1,7], '*': [5,2,7,2,5], '(': [2,4,4,4,2],
      ')': [2,1,1,1,2], '|': [2,2,2,2,2], ',': [0,0,0,2,4], '=': [0,7,0,7,0]
    };

    function fbDrawText(str, x, y, color = 1) {
      const s = String(str).toUpperCase();
      const c = resolveColor565(color);
      let cx = Math.round(x * SCALE_X);
      const cy = Math.round(y * SCALE_Y);
      for (let i = 0; i < s.length; i++) {
        const g = FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const b = g[r];
            for (let col = 0; col < 3; col++) {
              if (b & (4 >> col)) {
                const px = cx + col * 2;
                const py = cy + r * 3;
                for (let dy = 0; dy < 3; dy++) {
                  fbSetPixel320(px, py + dy, c);
                  fbSetPixel320(px + 1, py + dy, c);
                }
              }
            }
          }
        }
        cx += 10;
      }
    }

    function fbPresentToCanvas() {
      let pIdx = 0;
      for (let i = 0; i < VRAM_PIXELS; i++) {
        const c = vram565[i];
        rgbaPixels[pIdx]     = LUT_R[c];
        rgbaPixels[pIdx + 1] = LUT_G[c];
        rgbaPixels[pIdx + 2] = LUT_B[c];
        rgbaPixels[pIdx + 3] = 255;
        pIdx += 4;
      }
      oledCtx.putImageData(oledImgData, 0, 0);
    }

    /***************************************************************************
     * 2. AUDIO SINTETIZADO RETRO-GO
     ***************************************************************************/
    let audioCtx = null;
    let soundEnabled = false;

    function playTone(freq = 600, dur = 0.05, type = 'square', vol = 0.04) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur + 0.01);
      } catch (_) {}
    }

    /***************************************************************************
     * 3. ENTRADAS HARDWARE:
     *    - ARRIBA: 2 Joysticks Analógicos (con L3/R3 Click y doble toque)
     *    - ABAJO IZQ: Cruceta D-Pad (UP, DOWN, LEFT, RIGHT)
     *    - ABAJO CENTRO: SELECT y ★ MENU
     *    - ABAJO DER: 4 Botones en Diamante (X, Y, A, B)
     ***************************************************************************/
    const stickLeftCanvas = document.getElementById('stickLeft');
    const stickRightCanvas = document.getElementById('stickRight');
    const ctxLeft = stickLeftCanvas.getContext('2d');
    const ctxRight = stickRightCanvas.getContext('2d');

    const hwInput = {
      lx: 0.0, ly: 0.0,
      rx: 0.0, ry: 0.0,
      leftActive: false,
      rightActive: false,
      btn: {
        A: false, B: false, X: false, Y: false,
        L3: false, R3: false,
        SELECT: false, MENU: false,
        UP: false, DOWN: false, LEFT: false, RIGHT: false
      },
      prevBtn: {},
      justPressed(k) { return !!this.btn[k] && !this.prevBtn[k]; }
    };

    const touchTrack = { leftId: null, rightId: null, lastTapLeft: 0, lastTapRight: 0 };

    function computeStickXY(canvasEl, clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const maxR = Math.max(22, rect.width * 0.40);
      const dx = clientX - cx, dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const scale = dist > maxR ? (maxR / dist) : 1.0;
      return { x: (dx * scale) / maxR, y: (-dy * scale) / maxR };
    }

    // Eventos Touch dedicados directamente a los 2 Canvases de los Joysticks Superiores
    function attachStickCanvasEvents(canvasEl, side) {
      let activeId = null;

      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        const now = performance.now();
        if (side === 'left') {
          if (now - touchTrack.lastTapLeft < 260) hwInput.btn.L3 = true;
          touchTrack.lastTapLeft = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true;
        } else {
          if (now - touchTrack.lastTapRight < 260) hwInput.btn.R3 = true;
          touchTrack.lastTapRight = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true;
        }
      }, { passive: false });

      canvasEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === activeId) {
            const v = computeStickXY(canvasEl, t.clientX, t.clientY);
            if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
            else { hwInput.rx = v.x; hwInput.ry = v.y; }
            break;
          }
        }
      }, { passive: false });

      const endStick = (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeId) {
            activeId = null;
            if (side === 'left') {
              hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false;
              if (!btnTouchCounts.L3) hwInput.btn.L3 = false;
            } else {
              hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false;
              if (!btnTouchCounts.R3) hwInput.btn.R3 = false;
            }
            break;
          }
        }
      };

      canvasEl.addEventListener('touchend', endStick, { passive: false });
      canvasEl.addEventListener('touchcancel', endStick, { passive: false });

      // Soporte Mouse en PC
      let mouseDown = false;
      canvasEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        mouseDown = true;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true; }
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; }
      });
      window.addEventListener('mouseup', () => {
        if (!mouseDown) return;
        mouseDown = false;
        if (side === 'left') { hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false; }
        else { hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false; }
      });
    }

    attachStickCanvasEvents(stickLeftCanvas, 'left');
    attachStickCanvasEvents(stickRightCanvas, 'right');

    // Botones físicos (D-Pad UP/DOWN/LEFT/RIGHT, SELECT, MENU, Y, X, B, A, L3, R3)
    const btnTouchCounts = {};
    document.querySelectorAll('.hw-btn').forEach((btnEl) => {
      const key = btnEl.getAttribute('data-btn');
      btnTouchCounts[key] = 0;
      const press = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 1;
        hwInput.btn[key] = true;
        btnEl.classList.add('pressed');
        playTone(540, 0.02, 'square', 0.02);
      };
      const release = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 0;
        hwInput.btn[key] = false;
        btnEl.classList.remove('pressed');
      };
      btnEl.addEventListener('touchstart', press, { passive: false });
      btnEl.addEventListener('touchend', release, { passive: false });
      btnEl.addEventListener('touchcancel', release, { passive: false });
      btnEl.addEventListener('mousedown', press);
      btnEl.addEventListener('mouseup', release);
      btnEl.addEventListener('mouseleave', release);
    });

    const keyMap = {
      KeyZ: 'A', Space: 'A', Enter: 'A',
      KeyX: 'B', Backspace: 'B',
      KeyC: 'X', KeyR: 'X',
      KeyV: 'Y', KeyM: 'Y',
      KeyQ: 'L3', KeyE: 'R3',
      Tab: 'SELECT', Escape: 'MENU'
    };
    const rawKeys = {};
    window.addEventListener('keydown', (e) => {
      rawKeys[e.code] = true;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = true;
    });
    window.addEventListener('keyup', (e) => {
      rawKeys[e.code] = false;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = false;
    });

    function drawThumbstickWell(ctxG, canvasEl, x, y, active, clicked, label, holdLevel = -1) {
      const w = canvasEl.width, h = canvasEl.height;
      const cx = w * 0.5, cy = h * 0.5, maxR = w * 0.36;
      const capR = w * 0.21;
      ctxG.clearRect(0, 0, w, h);

      ctxG.strokeStyle = active ? 'rgba(255, 179, 0, 0.5)' : 'rgba(154, 165, 180, 0.22)';
      ctxG.lineWidth = 2;
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR, 0, Math.PI * 2); ctxG.stroke();
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR * 0.52, 0, Math.PI * 2); ctxG.stroke();

      ctxG.beginPath();
      ctxG.moveTo(cx - maxR, cy); ctxG.lineTo(cx + maxR, cy);
      ctxG.moveTo(cx, cy - maxR); ctxG.lineTo(cx, cy + maxR);
      ctxG.stroke();

      // Si el modo de acelerador fijo/incremental (Throttle Hold) está activo en Ala Fija, dibujar la barra del nivel fijado
      if (holdLevel >= 0) {
        const hy = cy - (holdLevel * 2.0 - 1.0) * maxR;
        ctxG.strokeStyle = '#00e676';
        ctxG.lineWidth = 3;
        ctxG.beginPath();
        ctxG.moveTo(cx - maxR * 0.72, hy);
        ctxG.lineTo(cx + maxR * 0.72, hy);
        ctxG.stroke();
        ctxG.fillStyle = '#00e676';
        ctxG.font = 'bold 11px monospace';
        ctxG.textAlign = 'center';
        ctxG.fillText(`HOLD ${Math.round(holdLevel * 100)}%`, cx, h - 10);
      }

      const kx = cx + x * maxR;
      const ky = cy - y * maxR;

      ctxG.strokeStyle = '#5c6375';
      ctxG.lineWidth = 10;
      ctxG.lineCap = 'round';
      ctxG.beginPath(); ctxG.moveTo(cx, cy); ctxG.lineTo(kx, ky); ctxG.stroke();

      ctxG.fillStyle = clicked ? '#e53935' : (active ? '#3e4454' : '#2b303c');
      ctxG.beginPath(); ctxG.arc(kx, ky, capR, 0, Math.PI * 2); ctxG.fill();
      ctxG.lineWidth = 3;
      ctxG.strokeStyle = clicked ? '#ffb300' : (active ? '#00e5ff' : '#586178');
      ctxG.stroke();

      ctxG.beginPath(); ctxG.arc(kx, ky, capR * 0.62, 0, Math.PI * 2);
      ctxG.lineWidth = 2;
      ctxG.strokeStyle = 'rgba(255,255,255,0.22)';
      ctxG.stroke();

      canvasEl.classList.toggle('engaged', active || clicked);
    }

    function detectControllerProfile(gp) {
      const idLow = (gp.id || '').toLowerCase();
      const isRadio = (
        idLow.includes('opentx') ||
        idLow.includes('edgetx') ||
        idLow.includes('radiomaster') ||
        idLow.includes('tx16') ||
        idLow.includes('tx12') ||
        idLow.includes('boxer') ||
        idLow.includes('pocket') ||
        idLow.includes('zorro') ||
        idLow.includes('elrs') ||
        idLow.includes('expresslrs') ||
        idLow.includes('betafpv') ||
        idLow.includes('frsky') ||
        idLow.includes('taranis') ||
        idLow.includes('jumper') ||
        idLow.includes('flysky') ||
        idLow.includes('futaba') ||
        idLow.includes('spektrum') ||
        idLow.includes('vjoy')
      );
      rcInputConfig.isEdgeTxRadio = isRadio;

      // Limpiar nombre corto para el OSD / Menú (máx 14 chars)
      if (isRadio) {
        if (idLow.includes('elrs') || idLow.includes('expresslrs')) rcInputConfig.padShortName = 'ELRS BT RADIO';
        else if (idLow.includes('tx16')) rcInputConfig.padShortName = 'TX16S EDGETX';
        else rcInputConfig.padShortName = 'EDGETX RADIO';
      } else {
        if (idLow.includes('xbox') || idLow.includes('xinput')) rcInputConfig.padShortName = 'XBOX/WIN PAD';
        else if (idLow.includes(' wireless controller') || idLow.includes('dualshock') || idLow.includes('dualsense') || idLow.includes('054c')) rcInputConfig.padShortName = 'PS BT GAMEPAD';
        else if (idLow.includes('8bitdo')) rcInputConfig.padShortName = '8BITDO BT PAD';
        else {
          const clean = (gp.id || 'BT GAMEPAD').replace(/\([^)]*\)/g, '').trim().toUpperCase();
          rcInputConfig.padShortName = clean.slice(0, 14) || 'BT/USB PAD';
        }
      }
    }

    window.addEventListener('gamepadconnected', (e) => {
      const gp = e.gamepad;
      if (!gp) return;
      detectControllerProfile(gp);
      rcInputConfig.connected = true;
      const btnRc = document.getElementById('btnRcPad');
      if (btnRc) {
        btnRc.classList.add('active');
        btnRc.textContent = rcInputConfig.isEdgeTxRadio ? '🎮 TX16S OK' : '🎮 PAD OK';
      }
      if (typeof showToast === 'function') {
        showToast(`CONECTADO: ${rcInputConfig.padShortName}`);
      }
    });

    window.addEventListener('gamepaddisconnected', () => {
      rcInputConfig.connected = false;
      rcInputConfig.isEdgeTxRadio = false;
      rcInputConfig.padShortName = 'NO PAD (TOUCH)';
      const btnRc = document.getElementById('btnRcPad');
      if (btnRc) {
        btnRc.classList.remove('active');
        btnRc.textContent = '🎮 RC/PAD';
      }
      if (typeof showToast === 'function') {
        showToast('CONTROLADOR DESCONECTADO');
      }
    });

    function applyAxisDeadzone(val, dz) {
      const av = Math.abs(val);
      if (av <= dz) return 0.0;
      const sign = val >= 0 ? 1.0 : -1.0;
      return Math.max(-1.0, Math.min(1.0, sign * ((av - dz) / Math.max(0.05, 1.0 - dz))));
    }

    function isRadioThrottleActive() {
      if (!rcInputConfig.connected) return false;
      if (rcInputConfig.thrMode === 1) return true;
      if (rcInputConfig.thrMode === 2 || rcInputConfig.thrMode === 3) return false;
      // En AUTO (0): si el mapeo activo es AETR (1) o TAER (3) o se detectó emisora EdgeTX, usar recorrido completo -1..+1 -> 0..100%
      return rcInputConfig.isEdgeTxRadio || rcInputConfig.activeMapResolved === 1 || rcInputConfig.activeMapResolved === 3;
    }

    // Indica si el Ala Fija debe usar acelerador fijo/incremental al usar joysticks con autocentrado (Touch, Gamepad BT, Teclado)
    function isWingStickyThrottleActive() {
      if (isRadioThrottleActive() && !hwInput.leftActive) return false; // Emisora real sin resorte usa posición directa
      if (rcInputConfig.thrMode === 2) return true;  // Forzado a FIJO (INCREMENT)
      if (rcInputConfig.thrMode === 3) return false; // Forzado a SPRING (DIRECTO)
      // En AUTO (0): usa el ajuste del perfil de Ala Fija (activado por defecto: thrHold = 1)
      return !!(typeof fcProfile !== 'undefined' && fcProfile.wing && fcProfile.wing.thrHold);
    }

    // Convierte hwInput.ly en comando de acelerador (0.0 a 1.0) respetando si es Gimbal sin resorte (TX16S) o Stick con resorte (Gamepad/Touch)
    function evalRcThrottle(baseCruiseThr) {
      if (isRadioThrottleActive() && !hwInput.leftActive) {
        // Gimbal real de emisora RC (TX16S / EdgeTX): -1.0 abajo = 0% gas, 0.0 medio = 50% gas, +1.0 arriba = 100% gas
        return Math.max(0.0, Math.min(1.0, (hwInput.ly + 1.0) * 0.5));
      }
      // Stick con resorte al centro (Gamepad Bluetooth / Touch / Teclado): 0.0 centro = baseCruiseThr
      return hwInput.ly >= 0
        ? baseCruiseThr + hwInput.ly * (1.0 - baseCruiseThr)
        : baseCruiseThr * (1.0 + hwInput.ly);
    }

    function calibrateControllerCenter() {
      // Guarda el centro actual de Yaw, Pitch y Roll para corregir deriva o centrado en Android/Windows
      if (!rcInputConfig.connected) return;
      const a0 = rcInputConfig.rawAxes[0], a1 = rcInputConfig.rawAxes[1];
      const a2 = rcInputConfig.rawAxes[2], a3 = rcInputConfig.rawAxes[3];
      const a5 = rcInputConfig.rawAxes[5];
      const mode = rcInputConfig.activeMapResolved;
      if (mode === 1) { // AETR: CH1=Rol(a0), CH2=Pit(a1), CH4=Yaw(a3)
        rcInputConfig.trimRol = a0;
        rcInputConfig.trimPit = a1;
        rcInputConfig.trimYaw = a3;
      } else if (mode === 3) { // TAER: CH2=Rol(a1), CH3=Pit(a2), CH4=Yaw(a3)
        rcInputConfig.trimRol = a1;
        rcInputConfig.trimPit = a2;
        rcInputConfig.trimYaw = a3;
      } else if (mode === 4) { // ANDROID BT ALT: L=a0/a1, R=a2/a5
        rcInputConfig.trimYaw = a0;
        rcInputConfig.trimRol = a2;
        rcInputConfig.trimPit = -a5;
      } else { // GAMEPAD MODE 2: L=a0/a1, R=a2/a3
        rcInputConfig.trimYaw = a0;
        rcInputConfig.trimRol = a2;
        rcInputConfig.trimPit = -a3;
      }
    }

    function updateInputPolling() {
      // Si no se toca el stick izquierdo, la cruceta D-Pad o WASD también pueden mover el eje izquierdo
      if (!hwInput.leftActive) {
        const dpadX = (hwInput.btn.RIGHT || rawKeys['KeyD'] ? 0.85 : 0) - (hwInput.btn.LEFT || rawKeys['KeyA'] ? 0.85 : 0);
        const dpadY = (hwInput.btn.UP    || rawKeys['KeyW'] ? 0.85 : 0) - (hwInput.btn.DOWN || rawKeys['KeyS'] ? 0.85 : 0);
        hwInput.lx = dpadX;
        hwInput.ly = dpadY;
      }
      if (!hwInput.rightActive) {
        hwInput.rx = (rawKeys['ArrowRight'] ? 0.8 : 0) - (rawKeys['ArrowLeft'] ? 0.8 : 0);
        hwInput.ry = (rawKeys['ArrowUp'] ? 0.8 : 0)    - (rawKeys['ArrowDown'] ? 0.8 : 0);
      }

      // Escaneo de Gamepads USB-C / Bluetooth (Windows XInput/DInput, Android Bluetooth HID, TX16S EdgeTX USB/ELRS BT)
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      let activeGp = null;
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (gp && gp.connected) {
          activeGp = gp;
          // Si hay varios dispositivos en el navegador, priorizar una emisora EdgeTX/OpenTX/ELRS o el que tenga más ejes activos
          const idLow = (gp.id || '').toLowerCase();
          if (idLow.includes('opentx') || idLow.includes('edgetx') || idLow.includes('tx16') || idLow.includes('radiomaster') || idLow.includes('elrs')) {
            break;
          }
        }
      }

      if (activeGp) {
        if (!rcInputConfig.connected) {
          detectControllerProfile(activeGp);
          rcInputConfig.connected = true;
          const btnRc = document.getElementById('btnRcPad');
          if (btnRc) {
            btnRc.classList.add('active');
            btnRc.textContent = rcInputConfig.isEdgeTxRadio ? '🎮 TX16S OK' : '🎮 PAD OK';
          }
        }

        // Copiar hasta 8 ejes y 16 botones en buffers estáticos para telemetría en vivo
        const axLen = Math.min(8, activeGp.axes ? activeGp.axes.length : 0);
        for (let a = 0; a < 8; a++) {
          rcInputConfig.rawAxes[a] = a < axLen ? (activeGp.axes[a] || 0.0) : 0.0;
        }
        const btLen = Math.min(16, activeGp.buttons ? activeGp.buttons.length : 0);
        for (let b = 0; b < 16; b++) {
          const btnObj = b < btLen ? activeGp.buttons[b] : null;
          rcInputConfig.rawBtns[b] = (btnObj && (btnObj.pressed || btnObj.value > 0.65)) ? 1 : 0;
        }

        // Resolver modo de mapeo de los 4 canales principales (Throttle, Yaw, Pitch, Roll)
        let mode = rcInputConfig.mapMode;
        if (mode === 0) {
          if (rcInputConfig.isEdgeTxRadio) {
            mode = 1; // TX16S / EdgeTX / ELRS BT usa orden estándar Betaflight AETR (CH1=Ail, CH2=Ele, CH3=Thr, CH4=Rud)
          } else if (activeGp.mapping !== 'standard' && axLen >= 6 && Math.abs(rcInputConfig.rawAxes[5]) > 0.02 && Math.abs(rcInputConfig.rawAxes[3] + 1.0) < 0.05) {
            mode = 4; // Android Bluetooth HID genérico donde Right Stick Y viene en axes[5] (RZ) y axes[3] es gatillo L2 en -1.0
          } else {
            mode = 2; // Gamepad Estándar Mode 2 (Xbox, PlayStation, 8BitDo, Android Standard)
          }
        }
        rcInputConfig.activeMapResolved = mode;

        const a0 = rcInputConfig.rawAxes[0];
        const a1 = rcInputConfig.rawAxes[1];
        const a2 = rcInputConfig.rawAxes[2];
        const a3 = rcInputConfig.rawAxes[3];
        const a5 = rcInputConfig.rawAxes[5];

        let rawThr = 0, rawYaw = 0, rawPit = 0, rawRol = 0;
        if (mode === 1) {
          // 1: TX16S / EDGETX AETR (CH1=Roll, CH2=Pitch, CH3=Throttle, CH4=Yaw)
          rawRol = a0 - rcInputConfig.trimRol;
          rawPit = a1 - rcInputConfig.trimPit;
          rawThr = a2;
          rawYaw = a3 - rcInputConfig.trimYaw;
        } else if (mode === 3) {
          // 3: RC TAER (CH1=Throttle, CH2=Roll, CH3=Pitch, CH4=Yaw)
          rawThr = a0;
          rawRol = a1 - rcInputConfig.trimRol;
          rawPit = a2 - rcInputConfig.trimPit;
          rawYaw = a3 - rcInputConfig.trimYaw;
        } else if (mode === 4) {
          // 4: ANDROID BT ALT (Left=AX0/AX1, Right=AX2/AX5)
          rawYaw =  a0 - rcInputConfig.trimYaw;
          rawThr = -a1;
          rawRol =  a2 - rcInputConfig.trimRol;
          rawPit = -a5 - rcInputConfig.trimPit;
        } else {
          // 2: GAMEPAD ESTÁNDAR MODE 2 (Left=AX0/AX1, Right=AX2/AX3)
          rawYaw =  a0 - rcInputConfig.trimYaw;
          rawThr = -a1;
          rawRol =  a2 - rcInputConfig.trimRol;
          rawPit = -a3 - rcInputConfig.trimPit;
        }

        const dz = rcInputConfig.deadzone;
        const thrRadio = isRadioThrottleActive();
        const mappedThr = Math.max(-1.0, Math.min(1.0, (thrRadio ? rawThr : applyAxisDeadzone(rawThr, dz)) * rcInputConfig.invThr));
        const mappedYaw = applyAxisDeadzone(rawYaw * rcInputConfig.invYaw, dz);
        const mappedPit = applyAxisDeadzone(rawPit * rcInputConfig.invPit, dz);
        const mappedRol = applyAxisDeadzone(rawRol * rcInputConfig.invRol, dz);

        if (!hwInput.leftActive) {
          if (thrRadio || Math.abs(mappedThr) > 0.001) hwInput.ly = mappedThr;
          if (Math.abs(mappedYaw) > 0.001) hwInput.lx = mappedYaw;
        }
        if (!hwInput.rightActive) {
          if (Math.abs(mappedRol) > 0.001) hwInput.rx = mappedRol;
          if (Math.abs(mappedPit) > 0.001) hwInput.ry = mappedPit;
        }

        // Botones de Gamepad / Switches HID + D-Pad por ejes Hat (Android Bluetooth suele enviar D-Pad en axes[6]/axes[7])
        const hatX = axLen >= 8 ? rcInputConfig.rawAxes[6] : 0.0;
        const hatY = axLen >= 8 ? rcInputConfig.rawAxes[7] : 0.0;

        const curGpBtn = {
          A:      !!(rcInputConfig.rawBtns[0] || rcInputConfig.rawBtns[7]), // A / Cross / R2 / Switch 1
          B:      !!(rcInputConfig.rawBtns[1] || rcInputConfig.rawBtns[5]), // B / Circle / R1 / Switch 2
          X:      !!(rcInputConfig.rawBtns[2] || rcInputConfig.rawBtns[4]), // X / Square / L1 / Switch 3
          Y:      !!(rcInputConfig.rawBtns[3] || rcInputConfig.rawBtns[6]), // Y / Triangle / L2 / Switch 4
          SELECT: !!(rcInputConfig.rawBtns[8]),
          MENU:   !!(rcInputConfig.rawBtns[9]),
          L3:     !!(rcInputConfig.rawBtns[10]),
          R3:     !!(rcInputConfig.rawBtns[11]),
          UP:     !!(rcInputConfig.rawBtns[12] || hatY < -0.5),
          DOWN:   !!(rcInputConfig.rawBtns[13] || hatY >  0.5),
          LEFT:   !!(rcInputConfig.rawBtns[14] || hatX < -0.5),
          RIGHT:  !!(rcInputConfig.rawBtns[15] || hatX >  0.5)
        };

        // Actualizar hwInput.btn liberando correctamente cuando se suelta el botón en el Gamepad/TX16S
        for (const k in curGpBtn) {
          if (curGpBtn[k]) {
            hwInput.btn[k] = true;
          } else if (rcInputConfig.prevGpBtn[k] && !btnTouchCounts[k]) {
            hwInput.btn[k] = false;
          }
          rcInputConfig.prevGpBtn[k] = curGpBtn[k];
        }

        // Soporte de Switches Auxiliares de 3 posiciones en Emisoras EdgeTX (CH5 = axes[4] Modo de Vuelo, CH6 = axes[5] Reset/Cámara)
        if ((mode === 1 || mode === 3) && axLen >= 5) {
          const aux5 = rcInputConfig.rawAxes[4];
          const zone5 = aux5 < -0.35 ? 0 : (aux5 > 0.35 ? 2 : 1);
          if (rcInputConfig.prevAux5Zone !== -99 && zone5 !== rcInputConfig.prevAux5Zone) {
            hwInput.btn.Y = true; // Dispara cambio de modo (MANU / ACRO / HOR) al mover switch SA/SB (CH5)
            rcInputConfig.prevGpBtn.Y = true;
          }
          rcInputConfig.prevAux5Zone = zone5;

          if (axLen >= 6) {
            const aux6 = rcInputConfig.rawAxes[5];
            const zone6 = aux6 < -0.35 ? 0 : (aux6 > 0.35 ? 2 : 1);
            if (rcInputConfig.prevAux6Zone !== -99 && zone6 !== rcInputConfig.prevAux6Zone && zone6 === 2) {
              hwInput.btn.X = true; // Dispara Reset al subir el switch SC/SD (CH6)
              rcInputConfig.prevGpBtn.X = true;
            }
            rcInputConfig.prevAux6Zone = zone6;
          }
        }
      }

      const showHoldBar = (typeof activeRomId !== 'undefined' && activeRomId === 'fpv_wing' && typeof fpvWingSim !== 'undefined' && isWingStickyThrottleActive())
        ? fpvWingSim.thrLatch
        : -1;
      drawThumbstickWell(ctxLeft, stickLeftCanvas, hwInput.lx, hwInput.ly, hwInput.leftActive || rcInputConfig.connected, hwInput.btn.L3, rcInputConfig.connected ? 'THR / YAW' : 'LEFT STICK', showHoldBar);
      drawThumbstickWell(ctxRight, stickRightCanvas, hwInput.rx, hwInput.ry, hwInput.rightActive || rcInputConfig.connected, hwInput.btn.R3, rcInputConfig.connected ? 'PIT / ROL' : 'RIGHT STICK', -1);

      const adcLX = Math.round((hwInput.lx + 1) * 2047.5);
      const adcLY = Math.round((hwInput.ly + 1) * 2047.5);
      const adcRX = Math.round((hwInput.rx + 1) * 2047.5);
      const adcRY = Math.round((hwInput.ry + 1) * 2047.5);

      document.getElementById('readoutLeft').textContent  = `L:${adcLX},${adcLY}`;
      document.getElementById('readoutRight').textContent = `R:${adcRX},${adcRY}`;
    }

    function snapshotPrevButtons() {
      for (const k in hwInput.btn) hwInput.prevBtn[k] = hwInput.btn[k];
    }

    function setFaceLabels(y, x, b, a, hint) {
      document.getElementById('lblY').textContent = y;
      document.getElementById('lblX').textContent = x;
      document.getElementById('lblB').textContent = b;
      document.getElementById('lblA').textContent = a;
      document.getElementById('uiHintBar').textContent = hint;
    }

                            /***************************************************************************
     * 4. MOTOR VOXEL (TERRENO SUAVE + CIELO AZUL CON NUBES VOXEL) + INAV OSD 320x240
     ***************************************************************************/
    const DEG2RAD = Math.PI / 180.0;
    const RAD2DEG = 180.0 / Math.PI;

    // =========================================================================
    // MAPA VOXEL EN PSRAM OCTAL (ESP32-S3 N16R8: 6.5 MB de 8.0 MB PSRAM)
    // - Terreno Satelital 2048x1024 a escala real: 6,000m (6 km) x 4,000m (4 km)
    //   * voxHeight: 2048 * 1024 * 1B = 2.0 MB PSRAM
    //   * voxColor : 2048 * 1024 * 2B = 4.0 MB PSRAM
    // - Domo de Cielo + Nubes Voxel 512x512:
    //   * voxSkyMap:  512 *  512 * 2B = 0.5 MB PSRAM
    // =========================================================================
    const MAP_W        = 2048;
    const MAP_H        = 1024;
    const MAP_MASK_X   = 2047;
    const MAP_MASK_Z   = 1023;
    const MAP_SHIFT_X  = 11;           // mz << 11 == mz * 2048
    let   WORLD_W_M    = 1500.0;       // Escala activa Este-Oeste (1.5 km en Chorobobo HD / 6.0 km en Chorobobo LR)
    let   WORLD_H_M    = 1000.0;       // Escala activa Norte-Sur  (1.0 km en Chorobobo HD / 4.0 km en Chorobobo LR)
    let   MAP_SCALE_X  = MAP_W / WORLD_W_M; // 1.365333 texels/m en 1.5x1km (0.73m/voxel) | 0.341333 en 6x4km (2.93m/voxel)
    let   MAP_SCALE_Z  = MAP_H / WORLD_H_M; // 1.024000 texels/m en 1.5x1km (0.98m/voxel) | 0.256000 en 6x4km (3.91m/voxel)
    const HEIGHT_SCALE = 0.125;        // 0.125 m por unidad uint8 (0.0m a 31.8m para árboles y lomas)

    // Coordenada exacta de la Pista Aeromodelismo A.I.A Chorobobo en el ortomosaico
    const SPAWN_MX     = 1198;         // u = 0.585 * 2048
    const SPAWN_MZ     = 650;          // v = (1 - 0.365) * 1024 (Norte hacia +wz)

    // Cielo Voxel 512x512 en PSRAM
    const SKY_DIM      = 512;
    const SKY_MASK     = 511;
    const SKY_SHIFT    = 9;

    const voxHeight    = new Uint8Array(MAP_W * MAP_H);
    const voxColor     = new Uint16Array(MAP_W * MAP_H);
    const voxSkyMap    = new Uint16Array(SKY_DIM * SKY_DIM);

    let choroDecodedImg = null;
    let choroSatelliteReady = false;
    let choroBakedInPsram = false;

    // Buffer intermedio des-rotado 256x256 en SRAM Interna (128 KB) para permitir Roll de 360°
    const VOX_W = 256;
    const VOX_H = 256;
    const voxBuf = new Uint16Array(VOX_W * VOX_H);

    // Conversión exacta de coordenada normalizada (u, v) sobre la ortofoto a metros (wx, wz) según la escala activa
    function uvToWorld(u, v) {
      return {
        x: Math.round((u - (SPAWN_MX / MAP_W)) * WORLD_W_M),
        z: Math.round(((SPAWN_MZ / MAP_H) - v) * WORLD_H_M)
      };
    }

    // Construye un circuito de 15 Gates orientados perpendicularmente a la tangente de vuelo (con altura 3D variable por puerta)
    function buildOrientedCircuit(id, name, shortCode, lineCol565, palIdx, uvList) {
      const n = uvList.length;
      const pts = uvList.map(item => {
        const p = uvToWorld(item[0], item[1]);
        p.altMul = item.length > 2 ? item[2] : 1.0;
        return p;
      });
      const isUltraCompact = WORLD_W_M <= 800.0;
      const isCompact      = WORLD_W_M <= 2000.0;
      const baseGateY = isUltraCompact ? 6.8 : (isCompact ? 9.0 : 12.0);
      const gateW     = isUltraCompact ? 9.6 : (isCompact ? 12.0 : 18.0);
      const gateH     = isUltraCompact ? 7.2 : (isCompact ? 9.0 : 12.0);
      const gates = [];
      for (let i = 0; i < n; i++) {
        const cur = pts[i];
        const nxt = pts[(i + 1) % n];
        const prv = pts[(i - 1 + n) % n];
        // Vector tangente promedio en la puerta i
        let tx = nxt.x - prv.x;
        let tz = nxt.z - prv.z;
        const tLen = Math.hypot(tx, tz) || 1.0;
        tx /= tLen;
        tz /= tLen;
        // Vector lateral derecho perpendicular a la tangente: (nx, nz) = (tz, -tx)
        gates.push({
          x: cur.x,
          y: Math.max(4.5, Math.round(baseGateY * cur.altMul * 10) / 10),
          z: cur.z,
          w: gateW,
          h: gateH,
          tx, tz,
          nx: tz,
          nz: -tx
        });
      }

      // Precalcular 120 puntos (8 por tramo x 15 puertas) sobre una Spline Catmull-Rom cerrada en el suelo
      const splinePts = [];
      const stepsPerSeg = 8;
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        for (let s = 1; s <= stepsPerSeg; s++) {
          const t = s / (stepsPerSeg + 1);
          const t2 = t * t, t3 = t2 * t;
          const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
          const z = 0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3);
          splinePts.push({ x, z, segIdx: i, stepIdx: s });
        }
      }
      return { id, name, shortCode, lineCol565, palIdx, uvList, gates, splinePts };
    }

    // 5 Circuitos de 15 Gates (con variaciones de altitud 3D [u, v, altMul] para cruces, puentes y slalom freestyle)
    const CHOROBOBO_CIRCUIT_DEFS = [
      // 1. C1 ROJO PISTA (15 Gates): Óvalo rápido por la Pista A.I.A Chorobobo y tablones centrales
      {
        id: 'rojo', name: 'C1 ROJO PISTA', shortCode: 'C1', lineCol565: rgb565(235, 52, 48), palIdx: 4,
        uvList: [
          [0.575, 0.362, 1.00], [0.532, 0.348, 0.90], [0.488, 0.334, 0.85], [0.442, 0.320, 1.00], [0.402, 0.318, 1.25],
          [0.412, 0.365, 1.10], [0.436, 0.418, 0.85], [0.462, 0.468, 0.95], [0.492, 0.502, 1.20], [0.542, 0.506, 1.35],
          [0.592, 0.510, 1.15], [0.642, 0.510, 0.95], [0.658, 0.472, 0.85], [0.656, 0.415, 1.05], [0.618, 0.382, 1.00]
        ]
      },
      // 2. C2 AZUL OCHO (15 Gates): Circuito en '8' con cruce central a doble altura (puente alto + paso bajo entre galpones)
      {
        id: 'azul_ocho', name: 'C2 AZUL OCHO 8', shortCode: 'C2', lineCol565: rgb565(45, 195, 255), palIdx: 5,
        uvList: [
