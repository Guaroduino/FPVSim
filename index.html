    }

    // =========================================================================
    // PERFILES BETAFLIGHT / INAV + PROPIEDADES FÍSICAS (100% C-STRUCT ESTÁTICO)
    // Basado en WebFPVSimulator + okalachev/flix (ESP32) + dRehmFlight + JSBSim
    // =========================================================================
    const DRONE_PRESETS = [
      { name: 'FREESTYLE', rcRate: 520, yawRate: 260, centerSens: 150, expo: 0.48, massKg: 0.62, maxThrustAcc: 31.5, camTilt: 18, airMode: 1, propwash: 1.0 },
      { name: 'RACING',    rcRate: 640, yawRate: 340, centerSens: 190, expo: 0.35, massKg: 0.48, maxThrustAcc: 39.0, camTilt: 28, airMode: 1, propwash: 0.7 },
      { name: 'CINEMATIC', rcRate: 320, yawRate: 170, centerSens: 100, expo: 0.60, massKg: 0.78, maxThrustAcc: 25.5, camTilt: 12, airMode: 1, propwash: 0.6 },
      { name: 'BANDO 6S',  rcRate: 780, yawRate: 400, centerSens: 180, expo: 0.52, massKg: 0.56, maxThrustAcc: 44.0, camTilt: 24, airMode: 1, propwash: 1.2 }
    ];

    const WING_PRESETS = [
      // Alas volantes puras (2 servos / elevones): SIN timón de dirección (hasRudder: 0, yawRate: 0)
      { name: 'Z-84 WING',   hasRudder: 0, pitchRate: 210, rollRate: 290, yawRate:   0, rudderRoll: 0.00, expo: 0.38, wingLoad: 1.00, maxThrustAcc: 18.0, cgOffset:  0.00, tipStall: 1.0, thrHold: 1 },
      { name: 'AR WING LR',  hasRudder: 0, pitchRate: 175, rollRate: 240, yawRate:   0, rudderRoll: 0.00, expo: 0.42, wingLoad: 1.25, maxThrustAcc: 20.5, cgOffset:  0.01, tipStall: 1.2, thrHold: 1 },
      // Aviones con fuselaje y cola (Alerón + Elevador + Timón de dirección Rudder activo)
      { name: 'BIXLER TAIL', hasRudder: 1, pitchRate: 145, rollRate: 195, yawRate:  95, rudderRoll: 0.48, expo: 0.48, wingLoad: 0.85, maxThrustAcc: 15.5, cgOffset:  0.02, tipStall: 0.5, thrHold: 1 },
      { name: 'TALON VTAIL', hasRudder: 1, pitchRate: 185, rollRate: 250, yawRate: 115, rudderRoll: 0.32, expo: 0.40, wingLoad: 1.15, maxThrustAcc: 19.5, cgOffset:  0.01, tipStall: 0.9, thrHold: 1 },
      { name: 'EDGE 540 3D', hasRudder: 1, pitchRate: 320, rollRate: 430, yawRate: 190, rudderRoll: 0.18, expo: 0.45, wingLoad: 0.82, maxThrustAcc: 25.0, cgOffset: -0.02, tipStall: 1.3, thrHold: 1 }
    ];

    const WIND_DIR_NAMES = ['AUTO VALLE', 'NORTE (+Z)', 'ESTE (+X)', 'SUR (-Z)', 'OESTE (-X)'];
    const WIND_DIR_RADS  = [1.12, Math.PI * 0.5, 0.0, -Math.PI * 0.5, Math.PI];

    const fcProfile = {
      windScale: 1.0,
      windDirMode: 0,     // 0 = AUTO VALLE, 1 = NORTE, 2 = ESTE, 3 = SUR, 4 = OESTE
      treeDensity: 1.0,   // 1.0 = 100%, 0.5 = 50%, 0.0 = OFF
      showSplinePath: 1,  // 1 = ON (luces guía en el piso), 0 = OFF
      dronePresetIdx: 0,
      wingPresetIdx: 0,
      drone: { ...DRONE_PRESETS[0] },
      wing:  { ...WING_PRESETS[0] }
    };

    function applyDronePreset(idx) {
      fcProfile.dronePresetIdx = ((idx % DRONE_PRESETS.length) + DRONE_PRESETS.length) % DRONE_PRESETS.length;
      const p = DRONE_PRESETS[fcProfile.dronePresetIdx];
      fcProfile.drone.name         = p.name;
      fcProfile.drone.rcRate       = p.rcRate;
      fcProfile.drone.yawRate      = p.yawRate;
      fcProfile.drone.centerSens   = p.centerSens;
      fcProfile.drone.expo         = p.expo;
      fcProfile.drone.massKg       = p.massKg;
      fcProfile.drone.maxThrustAcc = p.maxThrustAcc;
      fcProfile.drone.camTilt      = p.camTilt;
      fcProfile.drone.airMode      = p.airMode;
      fcProfile.drone.propwash     = p.propwash;
    }

    function applyWingPreset(idx) {
      fcProfile.wingPresetIdx = ((idx % WING_PRESETS.length) + WING_PRESETS.length) % WING_PRESETS.length;
      const p = WING_PRESETS[fcProfile.wingPresetIdx];
      const keepThrHold = fcProfile.wing.thrHold !== undefined ? fcProfile.wing.thrHold : p.thrHold;
      fcProfile.wing.name         = p.name;
      fcProfile.wing.hasRudder    = p.hasRudder;
      fcProfile.wing.pitchRate    = p.pitchRate;
      fcProfile.wing.rollRate     = p.rollRate;
      fcProfile.wing.yawRate      = p.yawRate;
      fcProfile.wing.rudderRoll   = p.rudderRoll;
      fcProfile.wing.expo         = p.expo;
      fcProfile.wing.wingLoad     = p.wingLoad;
      fcProfile.wing.maxThrustAcc = p.maxThrustAcc;
      fcProfile.wing.cgOffset     = p.cgOffset;
      fcProfile.wing.tipStall     = p.tipStall;
      fcProfile.wing.thrHold      = keepThrHold;
    }

    // Curva Actual Rates de Betaflight: combina sensibilidad central lineal + SuperExpo hacia Max Rate (en rad/s)
    function evalActualRateRad(rc, centerDegS, maxDegS, expo) {
      const absRc = Math.abs(rc);
      const expoFactor = absRc * (Math.pow(absRc, 3) * expo + absRc * (1.0 - expo));
      const degPerSec = rc * centerDegS + (rc >= 0 ? 1 : -1) * Math.max(0, maxDegS - centerDegS) * expoFactor;
      return degPerSec * DEG2RAD;
    }

    // Curva SuperExpo normalizada [-1..+1]
    function applySuperExpo(rc, rate = 1.0, expo = 0.45) {
      const absRc = Math.abs(rc);
      const cubic = rc * (absRc * absRc * expo + (1.0 - expo));
      return cubic * rate;
    }

    // =========================================================================
    // MOTOR ATMOSFÉRICO DE VIENTO, CIZALLADURA Y TURBULENCIA DRYDEN (ESP32-S3)
    // =========================================================================
    const aeroEnv = {
      time: 0,
      windX: 3.4,
      windY: 0.0,
      windZ: 1.5,
      turbPitch: 0,
      turbRoll: 0,
      turbYaw: 0,
      airSpd: 0,
      stallWarn: false,
      rssiPct: 99,
      rssiDbm: -50,
      edgeRatio: 0,
      failsafeTimer: 0
    };

    function updateAeroEnvironment(px, py, pz, groundH, dt) {
      aeroEnv.time += dt;
      const t = aeroEnv.time;
      const agl = Math.max(0.2, py - groundH);
      const wScale = fcProfile.windScale;

      // 0. Modelo de Enlace RF (RSSI % y dBm) que cae casi a 0% al llegar al borde del mapa (WORLD_W_M x WORLD_H_M)
      const halfW = WORLD_W_M * 0.47;
      const halfD = WORLD_H_M * 0.47;
      const normX = Math.abs(px) / halfW;
      const normZ = Math.abs(pz) / halfD;
      const edgeRatio = Math.max(normX, normZ, Math.hypot(normX, normZ) * 0.76);
      aeroEnv.edgeRatio = edgeRatio;

      // Atenuación por zona de Fresnel a baja altura lejos de base + fluctuación RF rápida
      const lowAltPenalty = (edgeRatio > 0.30 && agl < 7.0) ? (1.0 - agl / 7.0) * 8.5 * edgeRatio : 0.0;
      const rfFlutter = (Math.sin(t * 13.7 + px * 0.11) * 1.4 + Math.cos(t * 23.1 + pz * 0.13) * 1.1) * Math.min(1.5, edgeRatio + 0.2);

      let rawRssi;
      if (edgeRatio <= 0.20) {
        rawRssi = 99.0 - edgeRatio * 20.0; // 99% a 95% cerca del centro
      } else if (edgeRatio <= 0.72) {
        const u = (edgeRatio - 0.20) / 0.52;
        rawRssi = 95.0 - u * 55.0; // Cae de 95% a 40% en zona media
      } else {
        const u = Math.min(1.12, (edgeRatio - 0.72) / 0.26);
        rawRssi = 40.0 * (1.0 - u * 0.96); // Cae de 40% hasta ~1%..0% en el borde del mapa
      }
      aeroEnv.rssiPct = Math.max(0, Math.min(99, Math.round(rawRssi - lowAltPenalty + rfFlutter)));
      aeroEnv.rssiDbm = Math.round(-48 - (99 - aeroEnv.rssiPct) * 0.72);

      // Si llega al borde del mapa con RSSI crítico (<= 3%), activa Failsafe RTH automático hacia el centro (0,0)
      if (aeroEnv.rssiPct <= 3 || edgeRatio >= 0.98) {
        if (aeroEnv.failsafeTimer <= 0) {
          showToast('FAILSAFE RTH: BORDE DEL MAPA!');
          playTone(340, 0.12);
        }
        aeroEnv.failsafeTimer = 2.0;
      } else if (aeroEnv.failsafeTimer > 0) {
        aeroEnv.failsafeTimer = Math.max(0, aeroEnv.failsafeTimer - dt);
      }

      // 1. Dirección y velocidad del viento (configurable en [WORLD]: AUTO VALLE o rumbo cardinal fijo + cizalladura)
      const dirMode = fcProfile.windDirMode || 0;
      const windDir = dirMode === 0
        ? (1.12 + 0.28 * Math.sin(t * 0.09) + 0.12 * Math.cos(t * 0.23))
        : (WIND_DIR_RADS[dirMode] + 0.08 * Math.sin(t * 0.14));
      const shear   = Math.min(1.85, 0.72 + 0.28 * Math.log(1.0 + agl * 0.35));
      const baseSpd = (3.8 + 0.9 * Math.sin(t * 0.17)) * shear * wScale;

      // 2. Ráfagas espectrales multi-frecuencia (Dryden ligero) + térmicas verticales sobre parcelas
      const sPhaseX = px * 0.035 + t * 1.9;
      const sPhaseZ = pz * 0.035 + t * 1.5;
      const gustX = (1.35 * Math.sin(sPhaseX) + 0.75 * Math.cos(sPhaseZ * 1.7 + t * 3.4) + 0.42 * Math.sin(t * 6.8)) * wScale;
      const gustZ = (1.25 * Math.cos(sPhaseZ) + 0.70 * Math.sin(sPhaseX * 1.6 - t * 3.1) + 0.38 * Math.cos(t * 7.3)) * wScale;

      // Térmicas ascendentes / descendentes y rotor mecánico cerca de árboles (groundH > 2.2m)
      const treeWake = (groundH > 2.2 && agl < 14.0) ? (1.0 - agl / 14.0) * 1.95 : 0.45;
      const thermalY = (1.45 * Math.sin(px * 0.022 + pz * 0.025 + t * 0.85)
                     + 0.85 * Math.cos(pz * 0.045 - t * 1.65)
                     + 0.65 * Math.cos(px * 0.08 - t * 2.8) * treeWake) * wScale;

      aeroEnv.windX = Math.cos(windDir) * baseSpd + gustX;
      aeroEnv.windZ = Math.sin(windDir) * baseSpd + gustZ;
      aeroEnv.windY = thermalY;

      // 3. Gradientes rotacionales de turbulencia moderados + bolsas de aire suaves en cada semiala
      const turbAmp = (0.75 + treeWake * 0.65) * wScale;
      aeroEnv.turbRoll  = (0.36 * Math.sin(t * 1.45 + px * 0.025) + 0.24 * Math.cos(t * 3.1 + pz * 0.045) + 0.14 * Math.sin(t * 6.4 + px * 0.07)) * turbAmp;
      aeroEnv.turbPitch = (0.26 * Math.cos(t * 1.25 + pz * 0.022) + 0.18 * Math.sin(t * 2.8 - px * 0.040) + 0.10 * Math.cos(t * 5.8 - pz * 0.06)) * turbAmp;
      aeroEnv.turbYaw   = (0.24 * Math.sin(t * 1.15 - px * 0.026) + 0.15 * Math.cos(t * 2.6 + pz * 0.040) + 0.08 * Math.sin(t * 5.2 + px * 0.05)) * turbAmp;
    }

    function stepRotationSO3(craft, dt) {
      const p = craft.pitchRate * dt, r = craft.rollRate * dt, y = craft.yawRate * dt;
      const thSq = p*p + r*r + y*y;
      if (thSq > 1e-12) {
        const th = Math.sqrt(thSq);
        const c1 = Math.sin(th) / th, c2 = (1 - Math.cos(th)) / thSq;
        const rx = craft.rx, ry = craft.ry, rz = craft.rz;
        const ux = craft.ux, uy = craft.uy, uz = craft.uz;
        const fx = craft.fx, fy = craft.fy, fz = craft.fz;

        const v1Rx = -r*ux - y*fx, v1Ry = -r*uy - y*fy, v1Rz = -r*uz - y*fz;
        const v1Ux =  r*rx + p*fx, v1Uy =  r*ry + p*fy, v1Uz =  r*rz + p*fz;
        const v1Fx =  y*rx - p*ux, v1Fy =  y*ry - p*uy, v1Fz =  y*rz - p*uz;

        const v2Rx = -r*v1Ux - y*v1Fx, v2Ry = -r*v1Uy - y*v1Fy, v2Rz = -r*v1Uz - y*v1Fz;
        const v2Ux =  r*v1Rx + p*v1Fx, v2Uy =  r*v1Ry + p*v1Fy, v2Uz =  r*v1Rz + p*v1Fz;
        const v2Fx =  y*v1Rx - p*v1Ux, v2Fy =  y*v1Ry - p*v1Uy, v2Fz =  y*v1Rz - p*v1Uz;

        craft.rx = rx + c1*v1Rx + c2*v2Rx; craft.ry = ry + c1*v1Ry + c2*v2Ry; craft.rz = rz + c1*v1Rz + c2*v2Rz;
        craft.ux = ux + c1*v1Ux + c2*v2Ux; craft.uy = uy + c1*v1Uy + c2*v2Uy; craft.uz = uz + c1*v1Uz + c2*v2Uz;
        craft.fx = fx + c1*v1Fx + c2*v2Fx; craft.fy = fy + c1*v1Fy + c2*v2Fy; craft.fz = fz + c1*v1Fz + c2*v2Fz;

        const fL = Math.hypot(craft.fx, craft.fy, craft.fz) || 1;
        craft.fx /= fL; craft.fy /= fL; craft.fz /= fL;
        const dot = craft.ux*craft.fx + craft.uy*craft.fy + craft.uz*craft.fz;
        craft.ux -= dot*craft.fx; craft.uy -= dot*craft.fy; craft.uz -= dot*craft.fz;
        const uL = Math.hypot(craft.ux, craft.uy, craft.uz) || 1;
        craft.ux /= uL; craft.uy /= uL; craft.uz /= uL;
        craft.rx = craft.uy*craft.fz - craft.uz*craft.fy;
        craft.ry = craft.uz*craft.fx - craft.ux*craft.fz;
        craft.rz = craft.ux*craft.fy - craft.uy*craft.fx;
      }
    }

    /***************************************************************************
     * 5. SIMULADOR 1: FPV DRONE 6-DOF (WebFPVSimulator + okalachev/flix + BEM)
     *    - 4 Motores independientes (M1: Rear-R, M2: Front-R, M3: Rear-L, M4: Front-L)
     *    - Mezclador Betaflight Quad-X con AirMode + PID Cascada + I-term Relax
     *    - Ecuaciones de Euler 3D con Tensor de Inercia + Precesión Giroscópica
     ***************************************************************************/
    const fpvDroneSim = {
      px: 0, py: 2.2, pz: -10,
      vx: 0, vy: 0, vz: 0,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      mode: 'ACRO',
      chaseCam: false,
      activeGate: 0,
      thrCmd: 0.35,
      motorRpm: 0.35,
      // 4 rotores independientes en SRAM estática (0=M1 RR, 1=M2 FR, 2=M3 RL, 3=M4 FL)
      mRpm: new Float32Array([0.36, 0.36, 0.36, 0.36]),
      mCmd: new Float32Array([0.36, 0.36, 0.36, 0.36]),
      iPitch: 0, iRoll: 0, iYaw: 0,
      flightTime: 0,
      totalDistKm: 0,

      reset() {
        const g0 = CIRCUIT_GATES[0];
        const spawnBack = WORLD_W_M <= 2000.0 ? 22.0 : 35.0;
        this.px = g0.x - g0.tx * spawnBack;
        this.pz = g0.z - g0.tz * spawnBack;
        this.py = getTerrainHeightMeters(this.px, this.pz) + g0.y;
        this.vx = g0.tx * 8.0; this.vy = 0; this.vz = g0.tz * 8.0;
        this.pitchRate = 0; this.rollRate = 0; this.yawRate = 0;
        this.fx = g0.tx; this.fy = 0; this.fz = g0.tz;
        this.ux = 0;     this.uy = 1; this.uz = 0;
        this.rx = g0.nx; this.ry = 0; this.rz = g0.nz;
        this.motorRpm = 0.36;
        this.mRpm[0] = 0.36; this.mRpm[1] = 0.36; this.mRpm[2] = 0.36; this.mRpm[3] = 0.36;
        this.mCmd[0] = 0.36; this.mCmd[1] = 0.36; this.mCmd[2] = 0.36; this.mCmd[3] = 0.36;
        this.iPitch = 0; this.iRoll = 0; this.iYaw = 0;
        this.activeGate = 0;
        this.flightTime = 0;
        this.totalDistKm = 0;
        lastRollAngle = 0;
        followCamState.activeCraft = null;
        aeroEnv.stallWarn = false;
      },

      step(dt) {
        this.flightTime += dt;
        const cfg = fcProfile.drone;

        const groundH = getTerrainHeightMeters(this.px, this.pz);
        updateAeroEnvironment(this.px, this.py, this.pz, groundH, dt);

        // 1. Comando de acelerador + Anti-Gravity boost (soporta Gimbal real TX16S 0..100% o Stick con resorte)
        const baseThr = 0.34;
        let thr = evalRcThrottle(baseThr);
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.28);
        this.thrCmd = thr;

        // 2. Velocidad relativa al aire proyectada en el chasis (R=derecha, U=arriba, F=frente)
        const vAirX = this.vx - aeroEnv.windX;
        const vAirY = this.vy - aeroEnv.windY;
        const vAirZ = this.vz - aeroEnv.windZ;
        const airSpd = Math.hypot(vAirX, vAirY, vAirZ);
        aeroEnv.airSpd = airSpd;
        aeroEnv.stallWarn = false;

        const vBodyR = vAirX * this.rx + vAirY * this.ry + vAirZ * this.rz;
        const vBodyU = vAirX * this.ux + vAirY * this.uy + vAirZ * this.uz;
        const vBodyF = vAirX * this.fx + vAirY * this.fy + vAirZ * this.fz;
        const horizAirSpd = Math.hypot(vBodyR, vBodyF);

        // 3. Tasas objetivo con curva Betaflight Actual Rates (sensibilidad central + SuperExpo)
        const curPitch = Math.atan2(-this.fy, this.uy);
        const curRoll  = Math.atan2(-this.ry, this.uy);

        const ratePitchCmd = evalActualRateRad(hwInput.ry, cfg.centerSens, cfg.rcRate, cfg.expo);
        const rateRollCmd  = evalActualRateRad(hwInput.rx, cfg.centerSens, cfg.rcRate, cfg.expo);
        const tYaw         = evalActualRateRad(hwInput.lx, Math.min(140, cfg.yawRate * 0.55), cfg.yawRate, cfg.expo * 0.75);

        let tPitch = ratePitchCmd, tRoll = rateRollCmd;
        if (aeroEnv.failsafeTimer > 0) {
          // Failsafe en borde del mapa para el Dron: frena y regresa suavemente hacia el centro (0, 0)
          const toHomeX = -this.px, toHomeZ = -this.pz;
          const homeDist = Math.hypot(toHomeX, toHomeZ) || 1.0;
          const dirHomeF = (toHomeX * this.fx + toHomeZ * this.fz) / homeDist;
          const dirHomeR = (toHomeX * this.rx + toHomeZ * this.rz) / homeDist;
          tPitch = ((dirHomeF * 18.0 * DEG2RAD) - curPitch) * 4.5;
          tRoll  = ((dirHomeR * 22.0 * DEG2RAD) - curRoll)  * 4.5;
        } else if (this.mode !== 'ACRO') {
          // Modo HORIZON estilo Betaflight con flotación suave e intermedia sobre el colchón de aire
          const stickMag = Math.max(Math.abs(hwInput.rx), Math.abs(hwInput.ry));
          const acroBlend = Math.max(0, (stickMag - 0.45) / 0.55);
          const wVar = 0.45 + fcProfile.windScale * 0.45;
          const ahrsWanderP = (0.026 * Math.sin(this.flightTime * 0.95 + this.px * 0.022) + 0.016 * Math.cos(this.flightTime * 1.85 - this.pz * 0.028)) * wVar;
          const ahrsWanderR = (0.038 * Math.sin(this.flightTime * 0.82 + this.pz * 0.022) + 0.024 * Math.cos(this.flightTime * 1.65 + this.px * 0.030)) * wVar;
          const errP = (hwInput.ry * 52 * DEG2RAD + ahrsWanderP) - curPitch;
          const errR = (hwInput.rx * 55 * DEG2RAD + ahrsWanderR) - curRoll;
          // Nivelado orgánico: punto medio entre firmeza de rescate y respiración natural (±2°..3°)
          const gainP = 2.65 + 2.15 * Math.min(1.0, Math.abs(errP) / 0.25);
          const gainR = 2.80 + 2.30 * Math.min(1.0, Math.abs(errR) / 0.28);
          const lvlPitch = errP * gainP + aeroEnv.turbPitch * 0.22;
          const lvlRoll  = errR * gainR + aeroEnv.turbRoll  * 0.26;
          tPitch = lvlPitch * (1.0 - acroBlend) + ratePitchCmd * 0.88 * acroBlend;
          tRoll  = lvlRoll  * (1.0 - acroBlend) + rateRollCmd  * 0.88 * acroBlend;
        }

        // 4. Controlador PID en cascada con I-Term Relax (evita rebote al terminar flips rápidos)
        const errPitch = tPitch - this.pitchRate;
        const errRoll  = tRoll  - this.rollRate;
        const errYaw   = tYaw   - this.yawRate;

        const relaxPR = Math.max(0.1, 1.0 - Math.hypot(hwInput.rx, hwInput.ry) * 0.85);
        this.iPitch = Math.max(-0.22, Math.min(0.22, this.iPitch + errPitch * 0.14 * relaxPR * dt));
        this.iRoll  = Math.max(-0.22, Math.min(0.22, this.iRoll  + errRoll  * 0.14 * relaxPR * dt));
        this.iYaw   = Math.max(-0.18, Math.min(0.18, this.iYaw   + errYaw   * 0.10 * dt));

        const uPitch = Math.max(-0.65, Math.min(0.65, errPitch * 0.115 + this.iPitch));
        const uRoll  = Math.max(-0.65, Math.min(0.65, errRoll  * 0.115 + this.iRoll));
        const uYaw   = Math.max(-0.45, Math.min(0.45, errYaw   * 0.105 + this.iYaw));

        // 5. Mezclador Betaflight Quad-X (M1=RR, M2=FR, M3=RL, M4=FL) + AirMode real
        // Convención: Roll+ inclina a la derecha (sube M3,M4 izq); Pitch+ sube el morro (sube M2,M4 frontales)
        const d1 = -uRoll - uPitch - uYaw; // M1: Rear-Right  (CCW)
        const d2 = -uRoll + uPitch + uYaw; // M2: Front-Right (CW)
        const d3 =  uRoll - uPitch + uYaw; // M3: Rear-Left   (CW)
        const d4 =  uRoll + uPitch - uYaw; // M4: Front-Left  (CCW)

        let dMin = Math.min(d1, d2, d3, d4);
        let dMax = Math.max(d1, d2, d3, d4);
        const span = dMax - dMin;
        let mixScale = 1.0;
        let thrMix = thr;

        if (cfg.airMode) {
          // AirMode: garantiza autoridad de giro completa incluso con acelerador al 0% en caída libre
          if (span > 0.95) mixScale = 0.95 / span;
          dMin *= mixScale; dMax *= mixScale;
          if (thrMix + dMin < 0.05) thrMix = 0.05 - dMin;
          if (thrMix + dMax > 1.00) thrMix = 1.00 - dMax;
        } else {
          // Sin AirMode: a bajo gas se recorta la autoridad diferencial de los motores
          const authAtLowThr = Math.min(1.0, thr / 0.22);
          mixScale = authAtLowThr;
        }

        // Sag dinámico de batería LiPo 4S (reduce el techo real de RPM al final del vuelo o en full-punch)
        const sagFactor = Math.max(0.84, 1.0 - (thr * thr * 0.06) - Math.min(0.08, this.flightTime * 0.00025));

        this.mCmd[0] = Math.max(0.04, Math.min(1.0, thrMix + d1 * mixScale)) * sagFactor;
        this.mCmd[1] = Math.max(0.04, Math.min(1.0, thrMix + d2 * mixScale)) * sagFactor;
        this.mCmd[2] = Math.max(0.04, Math.min(1.0, thrMix + d3 * mixScale)) * sagFactor;
        this.mCmd[3] = Math.max(0.04, Math.min(1.0, thrMix + d4 * mixScale)) * sagFactor;

        // 6. Dinámica de 4 Motores Brushless (spool-up más rápido que frenado DShot Dampened Light)
        let rpmSum = 0;
        let yawAccelReaction = 0;
        for (let i = 0; i < 4; i++) {
          const prev = this.mRpm[i];
          const cmd  = this.mCmd[i];
          const tauRate = cmd >= prev ? 32.0 : 21.0; // Aceleración activa vs frenado regenerativo ESC
          this.mRpm[i] += (cmd - prev) * Math.min(1.0, tauRate * dt);
          const dRpm = (this.mRpm[i] - prev) / Math.max(0.002, dt);
          // M2(1) y M3(2) giran en sentido opuesto a M1(0) y M4(3) -> par de reacción inercial J_prop * dOmega/dt
          const dirSign = (i === 1 || i === 2) ? 1.0 : -1.0;
          yawAccelReaction += dirSign * dRpm;
          rpmSum += this.mRpm[i];
        }
        this.motorRpm = rpmSum * 0.25;

        // 7. Pares Físicos 3D de los 4 Rotores + Tensor de Inercia (Ixx, Iyy, Izz) + Precesión Giroscópica
        // Escala de inercia respecto al chasis de referencia de 0.62 kg
        const invInertia = 0.62 / Math.max(0.30, cfg.massKg);
        const tauRoll  = ((this.mRpm[2] + this.mRpm[3]) - (this.mRpm[0] + this.mRpm[1])) * 42.0 * invInertia;
        const tauPitch = ((this.mRpm[1] + this.mRpm[3]) - (this.mRpm[0] + this.mRpm[2])) * 40.0 * invInertia;
        const tauYaw   = ((this.mRpm[1] + this.mRpm[2]) - (this.mRpm[0] + this.mRpm[3])) * 26.0 * invInertia
                       + yawAccelReaction * 0.16 * invInertia;

        // Acoplamiento giroscópico de las 4 hélices (netOmega = suma con signo de rotores CW y CCW)
        const netPropOmega = (this.mRpm[1] + this.mRpm[2] - this.mRpm[0] - this.mRpm[3]) * 8.5;
        const gyroPitch =  this.rollRate  * netPropOmega * 0.08;
        const gyroRoll  = -this.pitchRate * netPropOmega * 0.08;

        // Acoplamiento de Euler de cuerpo rígido: (Iyy - Izz)*q*r / Ixx (el eje Z tiene ~1.8x más inercia que X/Y)
        const eulerPitch = -0.42 * this.rollRate * this.yawRate;
        const eulerRoll  =  0.42 * this.pitchRate * this.yawRate;

        // Oscilación de Propwash (Estado de Anillo de Vórtices) al descender sobre la propia estela
        let propwashRoll = 0, propwashPitch = 0;
        if (vBodyU < -1.6 && horizAirSpd < 6.0) {
          const pwIntensity = Math.min(2.0, (-1.6 - vBodyU) * 0.48 * (1.0 - horizAirSpd / 6.0)) * cfg.propwash;
          propwashRoll  = (Math.sin(this.flightTime * 68.0) * 1.55 + Math.cos(this.flightTime * 113.0) * 0.65) * pwIntensity;
          propwashPitch = (Math.cos(this.flightTime * 54.0) * 1.25 + Math.sin(this.flightTime * 97.0)  * 0.55) * pwIntensity;
        }

        // Momento aerodinámico de cabeceo/alabeo por traslación horizontal del disco (Blade Flapping)
        const windDihedralRoll = -vBodyR * 0.065;
        const windPitchUp      =  vBodyF * 0.042;

        this.pitchRate += (tauPitch + gyroPitch + eulerPitch + aeroEnv.turbPitch * 0.85 + propwashPitch + windPitchUp) * dt;
        this.rollRate  += (tauRoll  + gyroRoll  + eulerRoll  + aeroEnv.turbRoll  * 1.05 + propwashRoll  + windDihedralRoll) * dt;
        this.yawRate   += (tauYaw   + aeroEnv.turbYaw * 0.70) * dt;

        stepRotationSO3(this, dt);

        // 8. Aerodinámica de Elemento de Pala (BEM): Empuje no lineal + Efecto Suelo + Blade Drag Lateral
        // Curva cuadrática/lineal de empuje de hélice 5" + pérdida por ratio de avance (J = V_axial / nD)
        let thrustNorm = 0;
        for (let i = 0; i < 4; i++) {
          const r = this.mRpm[i];
          thrustNorm += (0.35 * r + 0.65 * r * r) * 0.25;
        }
        const agl = Math.max(0.1, this.py - groundH);
        const groundEffect = agl < 1.6 ? 1.0 + (1.6 - agl) * 0.095 : 1.0;
        const transLift    = horizAirSpd > 2.0 ? 1.0 + Math.min(0.15, horizAirSpd * 0.013) : 1.0;
        const inflowLoss   = Math.max(0.58, 1.0 - Math.max(0, vBodyU) * 0.022);
        const massScale    = 0.62 / Math.max(0.30, cfg.massKg);
        const thrustAcc    = thrustNorm * cfg.maxThrustAcc * massScale * groundEffect * transLift * inflowLoss;

        // Arrastre de pala inducido por los rotores (H-force de Flightmare: da agarre en curvas al acelerar)
        const bladeDragCoeff = 0.095 * this.motorRpm;
        const dragFR = (0.11 + 0.0105 * airSpd + bladeDragCoeff) * massScale;
        const dragU  = (0.28 + 0.024  * Math.abs(vBodyU)) * massScale;
        const fDragR = -vBodyR * dragFR;
        const fDragU = -vBodyU * dragU;
        const fDragF = -vBodyF * dragFR;

        const ax = this.ux * thrustAcc + this.rx * fDragR + this.ux * fDragU + this.fx * fDragF;
        const ay = this.uy * thrustAcc + this.ry * fDragR + this.uy * fDragU + this.fy * fDragF - 9.81;
        const az = this.uz * thrustAcc + this.rz * fDragR + this.uz * fDragU + this.fz * fDragF;

        this.vx += ax * dt;
        this.vy += ay * dt;
        this.vz += az * dt;

        const gndSpd = Math.hypot(this.vx, this.vy, this.vz);
        this.totalDistKm += (gndSpd * dt) / 1000.0;

        this.px += this.vx * dt; this.py += this.vy * dt; this.pz += this.vz * dt;
        if (this.py < groundH + 0.30) {
          this.py = groundH + 0.30;
          if (this.vy < 0) this.vy = -this.vy * 0.22;
          this.vx *= 0.90; this.vz *= 0.90;
        }

        if (!isFreeFlightNoGates()) {
          const g = CIRCUIT_GATES[this.activeGate];
          const gFloor = getTerrainHeightMeters(g.x, g.z);
          if (Math.hypot(this.px - g.x, this.pz - g.z) < 14.0 && Math.abs(this.py - (gFloor + g.y)) < 11.0) {
            this.activeGate = (this.activeGate + 1) % CIRCUIT_GATES.length;
            const cShort = CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode;
            showToast(`${cShort} GATE ${this.activeGate || 15}/15 OK!`);
            playTone(880, 0.08);
          }
        }
      },

      render() {
        const tilt = fcProfile.drone.camTilt * DEG2RAD;
        const cT = Math.cos(tilt), sT = Math.sin(tilt);
        let cRx = this.rx, cRy = this.ry, cRz = this.rz;
        let cUx = cT*this.ux - sT*this.fx, cUy = cT*this.uy - sT*this.fy, cUz = cT*this.uz - sT*this.fz;
        let cFx = sT*this.ux + cT*this.fx, cFy = sT*this.uy + cT*this.fy, cFz = sT*this.uz + cT*this.fz;
        let camX = this.px, camY = this.py, camZ = this.pz;

        if (this.chaseCam) {
          const fc = computeFollowCamPose(this, 4.6, 1.15, 6.0);
          camX = fc.camX; camY = fc.camY; camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
        } else {
          followCamState.activeCraft = null;
          const minCamY = getTerrainHeightMeters(camX, camZ) + 0.35;
          camY = Math.max(minCamY, this.py);
        }

        // 1. Terreno Voxel + Cielo Azul con Nubes Voxel a pantalla completa
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Objetos 3D estilo Comanche 3 (Árboles Sprite + Edificios Low-Poly) + Camino Spline + Gates 3D
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderComancheWorldObjects(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz, projPoint320);
        renderCircuitGates(projLine, this.activeGate, projPoint320);

        // 3. Modelo 3D Sólido del Dron Quad-X en vista Follow (Chase Cam)
        if (this.chaseCam) {
          renderSolidDroneModel320(this, projPoint320, projLine);
        }

        // 3. OSD estilo INAV con Horizonte Artificial proyectado directamente sobre el horizonte 3D
        const g = isFreeFlightNoGates() ? { x: 0, y: 12, z: 0 } : CIRCUIT_GATES[this.activeGate];
        const dxG = g.x - this.px, dzG = g.z - this.pz;
        const gateDist = Math.hypot(dxG, g.y - this.py, dzG);
        const gateBearingRad = Math.atan2(dxG * this.rx + dzG * this.rz, dxG * this.fx + dzG * this.fz);
        const spd = Math.hypot(this.vx, this.vy, this.vz);

        renderInavOsd320({
          callsign: `Q5 ${fcProfile.drone.name.slice(0, 7)}`,
          modeLabel: `${this.mode}${fcProfile.drone.airMode ? '+AIR' : ''}`,
          spdMs: spd,
          thrPct: this.thrCmd * 100,
          altM: this.py,
          vario: this.vy,
          activeGate: this.activeGate,
          gateDist,
          gateBearingRad,
          totalDistKm: this.totalDistKm,
          flightTimeSec: this.flightTime,
          camX, camY, camZ,
          cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz,
          projPoint320
        });
      }
    };

    /***************************************************************************
     * 6. SIMULADOR 2: FPV FIXED-WING 6-DOF (dRehmFlight + JSBSim + INAV NAV_LAUNCH)
     *    - Lanzamiento a mano (Hand-Launch) a 1.75m AGL con fase INAV LAUNCH
     *    - Sustentación estrictamente ortogonal al viento relativo (L _|_ V_air)
     *    - Giros canteados coordinados en 3D (proyección exacta en Pitch + Yaw cuerpo)
     *    - Estabilidad longitudinal (Cm_alpha) y direccional (Cn_beta) críticamente amortiguadas
     ***************************************************************************/
    // Evalúa C_L(alpha) combinando perfil réflex de ala volante + placa plana post-pérdida
    // pullUpDeflect > 0 cuando el piloto tira del stick hacia atrás (subir morro)
    function evalWingLiftCoeff(alphaEff, stallAngle, pullUpDeflect) {
      const absA = Math.abs(alphaEff);
      const flatPlate = 1.95 * Math.sin(alphaEff) * Math.cos(alphaEff);
      if (absA <= stallAngle) {
        return 4.50 * alphaEff + 0.24 * pullUpDeflect;
      }
      const blend = Math.min(1.0, (absA - stallAngle) / 0.22);
      const preStall = (alphaEff >= 0 ? 1 : -1) * (4.50 * stallAngle) + 0.14 * pullUpDeflect;
      return preStall * (1.0 - blend) + flatPlate * blend;
    }

    const fpvWingSim = {
      px: 0, py: 4.0, pz: -14,
      vx: 0, vy: 0, vz: 15.0,
      spd: 15.0,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      mode: 'ACRO', // Inicia en ACRO (estándar INAV); Y cambia ACRO -> MANU -> HOR
      launchTimer: 0, // Temporizador de asistencia de lanzamiento a mano (INAV NAV_LAUNCH)
      chaseCam: false,
      activeGate: 0,
      thrLatch: 0.55,
      thrCmd: 0.55,
      motorRpm: 0.52,
      elevL: 0,
      elevR: 0,
      lastAlpha: 0,
      flightTime: 0,
      totalDistKm: 0,

      reset() {
        const g0 = CIRCUIT_GATES[0];
        const spawnBack = WORLD_W_M <= 2000.0 ? 28.0 : 42.0;
        this.px = g0.x - g0.tx * spawnBack;
        this.pz = g0.z - g0.tz * spawnBack;
        // Lanzamiento a mano (Hand-Launch) desde altura de hombro (1.75 m sobre el suelo)
        const groundH = getTerrainHeightMeters(this.px, this.pz);
        this.py = groundH + 1.75;

        // Actitud inicial de lanzamiento: morro +13° arriba hacia la Puerta 1 y leve alabeo de mano (3.5°)
        const throwPitch = 13.0 * DEG2RAD;
        const cosP = Math.cos(throwPitch), sinP = Math.sin(throwPitch);
        this.fx =  g0.tx * cosP;
        this.fy =  sinP;
        this.fz =  g0.tz * cosP;
        this.ux = -g0.tx * sinP;
        this.uy =  cosP;
        this.uz = -g0.tz * sinP;
        this.rx =  g0.nx;
        this.ry =  0;
        this.rz =  g0.nz;

        // Impulso físico del lanzamiento a mano (~14.2 m/s = 51 km/h) con leve rotación inicial de suelta
        const throwSpd = 14.2;
        this.vx = this.fx * throwSpd;
        this.vy = this.fy * throwSpd + 0.55;
        this.vz = this.fz * throwSpd;
        this.spd = Math.hypot(this.vx, this.vy, this.vz);

        this.pitchRate = 0.0;
        this.rollRate  = 0.35; // Pequeño gesto de suelta con la mano que el ala amortigua al instante
        this.yawRate   = 0.0;

        this.launchTimer = 1.05; // 1.05s de fase INAV LAUNCH (ascenso limpio tras soltar el ala)
        this.thrLatch = 0.55;
        this.thrCmd   = 0.58;
        this.motorRpm = 0.52;
        this.elevL = 0; this.elevR = 0; this.lastAlpha = 0.05;
        this.activeGate = 0;
        this.flightTime = 0;
        this.totalDistKm = 0;
        lastRollAngle = 0;
        followCamState.activeCraft = null;
        aeroEnv.stallWarn = false;
      },

      step(dt) {
        this.flightTime += dt;
        const cfg = fcProfile.wing;

        const groundH = getTerrainHeightMeters(this.px, this.pz);
        updateAeroEnvironment(this.px, this.py, this.pz, groundH, dt);

        // Si el piloto mueve el stick de Pitch/Roll o de Gas durante el lanzamiento, termina antes la fase LAUNCH
        if (this.launchTimer > 0) {
          this.launchTimer = Math.max(0, this.launchTimer - dt);
          if (Math.hypot(hwInput.rx, hwInput.ry) > 0.22 || Math.abs(hwInput.ly) > 0.22) {
            this.launchTimer = 0;
          }
        }

        // 1. Comando de motor + spool-up de hélice trasera:
        //    - Con emisora real sin resorte (TX16S): posición directa 0..100%
        //    - Con joystick autocentrado + modo FIJO (por defecto en Ala): el stick izquierdo sube/baja y fija el gas (0..100%)
        //    - Con joystick autocentrado + modo RESORTE: posición directa alrededor de 42% crucero
        let thr;
        if (isWingStickyThrottleActive()) {
          if (Math.abs(hwInput.ly) > 0.10) {
            const dStick = (hwInput.ly > 0 ? (hwInput.ly - 0.10) : (hwInput.ly + 0.10)) / 0.90;
            this.thrLatch = Math.max(0.0, Math.min(1.0, this.thrLatch + dStick * 0.72 * dt));
          }
          thr = this.thrLatch;
        } else {
          thr = evalRcThrottle(0.42);
          this.thrLatch = thr;
        }
        if (this.launchTimer > 0 || aeroEnv.failsafeTimer > 0) {
          thr = Math.max(thr, 0.58); // Empuje automático durante lanzamiento a mano o Failsafe RTH
        }
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.38);
        this.thrCmd = thr;
        this.motorRpm += (thr - this.motorRpm) * Math.min(1.0, 14.0 * dt);

        // 2. Vector de velocidad relativa al aire V_air = V_ground - V_wind
        const vAirX = this.vx - aeroEnv.windX;
        const vAirY = this.vy - aeroEnv.windY;
        const vAirZ = this.vz - aeroEnv.windZ;
        const Va = Math.max(2.0, Math.hypot(vAirX, vAirY, vAirZ));
        aeroEnv.airSpd = Va;

        // Componentes de V_air en el sistema cuerpo (R = derecha, U = arriba, F = morro)
        const uBody = vAirX * this.fx + vAirY * this.fy + vAirZ * this.fz;
        const vBody = vAirX * this.rx + vAirY * this.ry + vAirZ * this.rz;
        const wBody = vAirX * this.ux + vAirY * this.uy + vAirZ * this.uz;

        // Ángulo de Ataque (alpha > 0 cuando el aire entra por debajo del ala: wBody < 0) y Resbalamiento (beta)
        const alpha = Math.atan2(-wBody, Math.max(2.5, uBody));
        const beta  = Math.atan2( vBody, Math.max(2.5, Math.hypot(uBody, wBody)));
        this.lastAlpha = alpha;

        // 3. Comandos RC con curva SuperExpo
        // Nota de signo en stepRotationSO3:
        //   pitchRate > 0 baja el morro (-U); pitchRate < 0 sube el morro (+U).
        //   pullUpCmd > 0 cuando el piloto tira del stick hacia abajo (hwInput.ry < 0) para subir el morro.
        //   En Alas Volantes puras (!cfg.hasRudder || cfg.yawRate <= 0), el stick de Rudder (lx) NO actúa.
        const hasRudder = !!(cfg.hasRudder && cfg.yawRate > 0);
        const rcPitch   = applySuperExpo(hwInput.ry, 1.0, cfg.expo);
        const rcRoll    = applySuperExpo(hwInput.rx, 1.0, cfg.expo);
        const rcYaw     = hasRudder ? applySuperExpo(hwInput.lx, 1.0, cfg.expo * 0.75) : 0.0;
        const pullUpCmd = -rcPitch;

        this.elevL = Math.max(-1.0, Math.min(1.0, pullUpCmd - rcRoll * 0.80));
        this.elevR = Math.max(-1.0, Math.min(1.0, pullUpCmd + rcRoll * 0.80));

        // 4. Aerodinámica de Semialas (alpha_L, alpha_R) y Pérdida Suave (Tip-Stall)
        // Cuando rollRate > 0 (alabeo a la derecha), la semiala derecha baja -> ve MAYOR ángulo de ataque (+dAlphaRoll)
        const halfSpan   = 0.45;
        const dAlphaRoll = (this.rollRate * halfSpan) / Math.max(5.0, Va);
        const alpha0     = -0.048; // Sustentación a alfa cero del perfil réflex con el ángulo de trim
        const alphaEff   = alpha - alpha0;
        const alphaEffL  = alphaEff - dAlphaRoll;
        const alphaEffR  = alphaEff + dAlphaRoll;

        const stallAngle = 0.29 / Math.sqrt(Math.max(0.6, cfg.wingLoad));
        const stallSpeed = 8.4 * Math.sqrt(Math.max(0.6, cfg.wingLoad));
        const isStalled  = (Math.abs(alphaEff) > stallAngle) || (Va < stallSpeed);
        aeroEnv.stallWarn = isStalled;

        const CL_L = evalWingLiftCoeff(alphaEffL, stallAngle, this.elevL);
        const CL_R = evalWingLiftCoeff(alphaEffR, stallAngle, this.elevR);
        const CL   = 0.5 * (CL_L + CL_R);

        // En régimen normal (sin pérdida), el ala que baja genera más sustentación y amortigua el roll;
        // solo al entrar en pérdida (isStalled) aparece asimetría de tip-stall
        let stallPitchRate = 0, stallRollRate = 0;
        if (isStalled) {
          const stallSev = Math.min(1.2, Math.max(0.15, (stallSpeed - Va) * 0.18 + Math.max(0, Math.abs(alphaEff) - stallAngle) * 2.4)) * cfg.tipStall;
          // En pérdida el morro cae (pitchRate > 0 baja el morro en stepRotationSO3) para recuperar velocidad naturalmente
          stallPitchRate = +1.35 * stallSev;
          stallRollRate  = ((CL_L - CL_R) * 1.4 + Math.sin(this.flightTime * 19.0) * 0.85) * stallSev;
        }

        // Autoridad aerodinámica de los elevones (depende de la velocidad del aire Va, no del motor pusher trasero)
        const ctrlAuth = Math.min(1.45, Math.max(0.35, (Va / 16.5)));

        // 5. Cinemática de Giro Canteado Coordinado en 3D (Bank-to-Turn real proyectado en ejes cuerpo)
        // Cuando el ala está inclinada (ry != 0), el vector de sustentación curva la trayectoria a razón:
        //   turnOmegaWorld = (g * (-ry)) / Va
        // Proyectado en la base ortonormal (R, U, F) de stepRotationSO3:
        //   - Componente Yaw cuerpo (+y gira morro hacia +R)   = turnOmegaWorld * uy
        //   - Componente Pitch cuerpo (-p gira morro hacia +U) = turnOmegaWorld * ry (siempre <= 0: sube el morro en el giro)
        const uyPos = Math.max(0.0, this.uy);
        const turnOmegaWorld = (9.81 * (-this.ry) * uyPos) / Math.max(8.5, Va);
        const coordTurnYaw   = turnOmegaWorld * uyPos * 0.92;
        const coordTurnPitch = turnOmegaWorld * this.ry * 0.82; // Negativo -> mantiene el morro en el horizonte durante el viraje

        // Estabilidad longitudinal (Cm_alpha) y direccional de winglets/cola (Cn_beta) con el signo exacto de stepRotationSO3:
        // Si alpha > alphaTrim (morro demasiado alto), weathervanePitch > 0 (baja el morro suavemente hacia el viento relativo)
        const alphaTrim        = 0.048 - cfg.cgOffset * 0.30;
        const weathervanePitch = (alpha - alphaTrim) * (2.6 + cfg.cgOffset * 18.0) * ctrlAuth;
        const weathervaneYaw   = beta * (hasRudder ? 4.2 : 3.4) * ctrlAuth;
        const sweptDihedralRoll = -beta * (hasRudder ? 1.85 : 1.4) * ctrlAuth;
        // En aviones con timón de cola, meter Rudder induce también alabeo pro-verso por diedro
        const rudderCoupledRoll = hasRudder ? (rcYaw * (cfg.rudderRoll || 0.30) * 1.8 * ctrlAuth) : 0.0;

        // Ángulos de actitud actuales para modos asistidos (LAUNCH y HORIZON)
        // En convención stepRotationSO3 (+pitch = morro abajo), noseDownAngle = asin(-fy)
        const noseDownAngle = Math.asin(Math.max(-0.99, Math.min(0.99, -this.fy)));
        const bankRightAngle = Math.atan2(-this.ry, Math.max(0.15, this.uy));

        if (aeroEnv.failsafeTimer > 0) {
          // Failsafe RTH INAV en el borde del mapa: vira automáticamente de regreso al centro (0, 0)
          const toHomeX = -this.px, toHomeZ = -this.pz;
          const homeCross = toHomeX * this.rx + toHomeZ * this.rz;
          const homeDot   = toHomeX * this.fx + toHomeZ * this.fz;
          const homeBearing = Math.atan2(homeCross, homeDot);
          const desiredBank = Math.max(-0.72, Math.min(0.72, homeBearing * 1.4));
          const desiredNoseDown = (this.py - groundH < 24.0 ? -12.0 : -4.0) * DEG2RAD;
          const tPitch = (desiredNoseDown - noseDownAngle) * 4.2 + coordTurnPitch * 0.6;
          const tRoll  = (desiredBank - bankRightAngle) * 4.8;
          const tYaw   = coordTurnYaw + weathervaneYaw;
          const gain   = Math.min(1.0, 12.0 * dt);
          this.pitchRate += (tPitch - this.pitchRate) * gain;
          this.rollRate  += (tRoll  - this.rollRate)  * gain;
          this.yawRate   += (tYaw   - this.yawRate)   * gain;
        } else if (this.launchTimer > 0) {
          // Fase INAV NAV_LAUNCH: mantiene alas niveladas y ascenso limpio de +11° tras lanzarlo con la mano
          const targetNoseDown = -11.0 * DEG2RAD;
          const tPitch = (targetNoseDown - noseDownAngle) * 5.5;
          const tRoll  = (0.0 - bankRightAngle) * 6.5;
          const tYaw   = weathervaneYaw;
          const gain   = Math.min(1.0, 14.0 * dt);
          this.pitchRate += (tPitch - this.pitchRate) * gain;
          this.rollRate  += (tRoll  - this.rollRate)  * gain;
          this.yawRate   += (tYaw   - this.yawRate)   * gain;
        } else if (this.mode === 'MANU') {
          // Modo MANU (Passthrough): elevones directos con amortiguación aerodinámica real (C_mq, C_lp, C_nr) sin oscilación
          const cmdPitchRate = rcPitch * cfg.pitchRate * DEG2RAD * ctrlAuth;
          const cmdRollRate  = rcRoll  * cfg.rollRate  * DEG2RAD * ctrlAuth + rudderCoupledRoll;
          const cmdYawRate   = rcYaw   * cfg.yawRate   * DEG2RAD * ctrlAuth;

          const targetPitch = cmdPitchRate + coordTurnPitch + weathervanePitch + stallPitchRate + aeroEnv.turbPitch * 0.45;
          const targetRoll  = cmdRollRate  + sweptDihedralRoll + stallRollRate + aeroEnv.turbRoll * 0.55;
          const targetYaw   = cmdYawRate   + coordTurnYaw + weathervaneYaw + aeroEnv.turbYaw * 0.40;

          // Amortiguación aerodinámica de periodo corto (evita el cabeceo/rebote al soltar el stick)
          this.pitchRate += (targetPitch - this.pitchRate) * Math.min(1.0, (11.5 + 0.25 * Va) * dt);
          this.rollRate  += (targetRoll  - this.rollRate)  * Math.min(1.0, (14.0 + 0.30 * Va) * dt);
          this.yawRate   += (targetYaw   - this.yawRate)   * Math.min(1.0, (9.5  + 0.20 * Va) * dt);
        } else if (this.mode === 'ACRO') {
          // Modo ACRO (INAV Rate): bloquea la actitud comandada y coordina el giro automáticamente
          const cmdPitchRate = rcPitch * cfg.pitchRate * DEG2RAD * ctrlAuth;
          const cmdRollRate  = rcRoll  * cfg.rollRate  * DEG2RAD * ctrlAuth + rudderCoupledRoll * 0.75;
          const cmdYawRate   = rcYaw   * cfg.yawRate   * DEG2RAD * ctrlAuth;

          const targetPitch = cmdPitchRate + coordTurnPitch + weathervanePitch * 0.45 + stallPitchRate + aeroEnv.turbPitch * 0.28;
          const targetRoll  = cmdRollRate  + stallRollRate * 0.65 + aeroEnv.turbRoll * 0.35;
          const targetYaw   = cmdYawRate   + coordTurnYaw + weathervaneYaw * 0.85 + aeroEnv.turbYaw * 0.25;

          const rateGain = Math.min(1.0, 16.5 * dt);
          this.pitchRate += (targetPitch - this.pitchRate) * rateGain;
          this.rollRate  += (targetRoll  - this.rollRate)  * rateGain;
          this.yawRate   += (targetYaw   - this.yawRate)   * rateGain;
        } else {
          // Modo HOR (INAV Horizon con punto medio ideal: estable pero vivo en el aire):
          // - Nivela con firmeza y suavidad al soltar el stick, manteniendo rumbo limpio.
          // - En vuelo recto presenta una respiración sutil y natural (±1.5°..2.2° en Pitch, ±2.5°..3.5° en Roll)
          //   al cruzar térmicas suaves, sin quedar rígido como un riel ni oscilar bruscamente.
          const cmdPitchRate = rcPitch * cfg.pitchRate * DEG2RAD * ctrlAuth;
          const cmdRollRate  = rcRoll  * cfg.rollRate  * DEG2RAD * ctrlAuth + rudderCoupledRoll;
          const cmdYawRate   = rcYaw   * cfg.yawRate   * DEG2RAD * ctrlAuth;

          const stickMag  = Math.hypot(hwInput.rx, hwInput.ry);
          const acroBlend = Math.min(1.0, Math.max(0.0, (stickMag - 0.35) / 0.65));

          // Ondulación atmosférica suave (térmicas lentas + trim ligero de velocidad + par sutil de hélice)
          const wVar = 0.45 + fcProfile.windScale * 0.45;
          const speedTrimDeg = Math.max(-2.2, Math.min(2.2, (Va - 14.6) * 0.18 + (this.motorRpm - 0.50) * 1.4));
          const ahrsDriftPitch = (1.35 * Math.sin(this.flightTime * 0.78 + this.px * 0.018)
                                + 0.85 * Math.cos(this.flightTime * 1.55 - this.pz * 0.022)) * wVar * DEG2RAD;
          const propTorqueDeg  = (this.motorRpm - 0.48) * 1.3;
          const rudderBankDeg  = hasRudder ? (rcYaw * (cfg.rudderRoll || 0.30) * 20.0) : 0.0;
          const ahrsDriftRoll  = (2.40 * Math.sin(this.flightTime * 0.68 + this.pz * 0.018)
                                + 1.45 * Math.cos(this.flightTime * 1.35 + this.px * 0.022)
                                + propTorqueDeg + rudderBankDeg) * wVar * DEG2RAD;

          const targetNoseDown = (hwInput.ry * 40.0 - 2.0 - speedTrimDeg) * DEG2RAD + ahrsDriftPitch;
          const targetBank     = (hwInput.rx * 55.0) * DEG2RAD + ahrsDriftRoll;

          const errPitch = targetNoseDown - noseDownAngle;
          const errRoll  = targetBank     - bankRightAngle;

          // Curva progresiva equilibrada: centro elástico pero controlado (2.15..2.25 s^-1) y rescate firme (4.1 s^-1)
          const gainPitch = (2.15 + 1.85 * Math.min(1.0, Math.abs(errPitch) / (12.0 * DEG2RAD))) * ctrlAuth;
          const gainRoll  = (2.25 + 2.05 * Math.min(1.0, Math.abs(errRoll)  / (15.0 * DEG2RAD))) * ctrlAuth;

          const lvlPitch = errPitch * gainPitch;
          const lvlRoll  = errRoll  * gainRoll;

          const tPitch = lvlPitch * (1.0 - acroBlend * 0.65) + cmdPitchRate * (0.35 + 0.65 * acroBlend)
                       + coordTurnPitch * 0.55 + weathervanePitch * 0.50 + stallPitchRate * 0.85 + aeroEnv.turbPitch * 0.30;
          const tRoll  = lvlRoll  * (1.0 - acroBlend * 0.65) + cmdRollRate  * (0.35 + 0.65 * acroBlend)
                       + sweptDihedralRoll * 0.40 + stallRollRate * 0.75 + aeroEnv.turbRoll * 0.36;
          const tYaw   = cmdYawRate * 0.90 + coordTurnYaw * 0.90 + weathervaneYaw * 0.85 + aeroEnv.turbYaw * 0.30;

          // Amortiguación limpia y sin rebote
          this.pitchRate += (tPitch - this.pitchRate) * Math.min(1.0, (10.5 + 0.22 * Va) * dt);
          this.rollRate  += (tRoll  - this.rollRate)  * Math.min(1.0, (11.5 + 0.25 * Va) * dt);
          this.yawRate   += (tYaw   - this.yawRate)   * Math.min(1.0, (9.0  + 0.18 * Va) * dt);
        }

        stepRotationSO3(this, dt);

        // 6. Fuerzas Aerodinámicas 3D con Conservación Exacta de Energía (L _|_ V_air, D || -V_air)
        const invWingLoad = 1.0 / Math.max(0.55, cfg.wingLoad);
        const invVa = 1.0 / Va;
        const airDirX = vAirX * invVa, airDirY = vAirY * invVa, airDirZ = vAirZ * invVa;

        // Vector unitario de Sustentación (liftDir) estrictamente ORTOGONAL a V_air
        const uDotAir = this.ux * airDirX + this.uy * airDirY + this.uz * airDirZ;
        let liftDirX = this.ux - uDotAir * airDirX;
        let liftDirY = this.uy - uDotAir * airDirY;
        let liftDirZ = this.uz - uDotAir * airDirZ;
        const liftLen = Math.hypot(liftDirX, liftDirY, liftDirZ) || 1.0;
        liftDirX /= liftLen; liftDirY /= liftLen; liftDirZ /= liftLen;

        // Polar de arrastre de ala volante Z-84: parásito + inducido (k*CL^2) + deflexión de elevones + resbalamiento
        const qDyn     = 0.064 * Va * Va * invWingLoad;
        const elevDrag = 0.045 * (this.elevL * this.elevL + this.elevR * this.elevR);
        const CD       = 0.046 + 0.165 * CL * CL + elevDrag + 0.55 * beta * beta + (isStalled ? 0.24 * Math.sin(Math.abs(alphaEff)) : 0);
        const CY       = -1.85 * beta;

        const liftAcc = Math.max(-30.0, Math.min(40.0, qDyn * CL));
        const dragAcc = qDyn * CD;
        const sideAcc = Math.max(-16.0, Math.min(16.0, qDyn * CY));

        // Modelo de Hélice de Paso Fijo (Advance Ratio) + Freno de Molinete (Windmilling) al cortar gas
        const propPitchMaxSpd = 18.5 + cfg.maxThrustAcc * 0.92;
        const propTargetSpd   = propPitchMaxSpd * (0.10 + 0.90 * this.motorRpm);
        let thrustAcc = 0;
        if (uBody < propTargetSpd) {
          const slipRatio = (propTargetSpd - Math.max(0, uBody)) / Math.max(4.0, propTargetSpd);
          thrustAcc = this.motorRpm * cfg.maxThrustAcc * invWingLoad * (0.38 + 0.62 * slipRatio);
        } else {
          thrustAcc = -0.22 * (uBody - propTargetSpd) * (1.0 - 0.45 * this.motorRpm) * invWingLoad;
        }

        const ax = this.fx * thrustAcc + liftDirX * liftAcc - airDirX * dragAcc + this.rx * sideAcc;
        const ay = this.fy * thrustAcc + liftDirY * liftAcc - airDirY * dragAcc + this.ry * sideAcc - 9.81;
        const az = this.fz * thrustAcc + liftDirZ * liftAcc - airDirZ * dragAcc + this.rz * sideAcc;

        this.vx += ax * dt;
        this.vy += ay * dt;
        this.vz += az * dt;

        this.spd = Math.hypot(this.vx, this.vy, this.vz);
        this.totalDistKm += (this.spd * dt) / 1000.0;

        this.px += this.vx * dt; this.py += this.vy * dt; this.pz += this.vz * dt;
        if (this.py < groundH + 0.35) {
          this.py = groundH + 0.35;
          if (this.vy < 0) this.vy = -this.vy * 0.2;
          this.vx *= 0.96; this.vz *= 0.96;
        }

        if (!isFreeFlightNoGates()) {
          const g = CIRCUIT_GATES[this.activeGate];
          const gFloor = getTerrainHeightMeters(g.x, g.z);
          if (Math.hypot(this.px - g.x, this.pz - g.z) < 15.0 && Math.abs(this.py - (gFloor + g.y)) < 11.5) {
            this.activeGate = (this.activeGate + 1) % CIRCUIT_GATES.length;
            const cShort = CHOROBOBO_CIRCUITS[currentCircuitIdx].shortCode;
            showToast(`${cShort} GATE ${this.activeGate || 15}/15 OK!`);
            playTone(920, 0.08);
          }
        }
      },

      render() {
        let cRx = this.rx, cRy = this.ry, cRz = this.rz;
        let cUx = this.ux, cUy = this.uy, cUz = this.uz;
        let cFx = this.fx, cFy = this.fy, cFz = this.fz;
        let camX = this.px, camY = this.py, camZ = this.pz;

        if (this.chaseCam) {
          const fc = computeFollowCamPose(this, 5.0, 1.25, 6.5);
          camX = fc.camX; camY = fc.camY; camZ = fc.camZ;
          cRx = fc.cRx; cRy = fc.cRy; cRz = fc.cRz;
          cUx = fc.cUx; cUy = fc.cUy; cUz = fc.cUz;
          cFx = fc.cFx; cFy = fc.cFy; cFz = fc.cFz;
        } else {
          followCamState.activeCraft = null;
          const minCamY = getTerrainHeightMeters(camX, camZ) + 0.35;
          camY = Math.max(minCamY, this.py);
        }

        // 1. Terreno Voxel + Cielo Azul con Nubes Voxel
        renderVoxelTerrainAndSky(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        // 2. Objetos 3D estilo Comanche 3 (Árboles Sprite + Edificios Low-Poly) + Camino Spline + Gates 3D
        const { projPoint320, projLine } = createProjector320(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        renderComancheWorldObjects(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz, projPoint320);
        renderCircuitGates(projLine, this.activeGate, projPoint320);

        // 3. Modelo 3D Sólido en vista Follow (Ala Volante con elevones móviles o Avión con Cola y Rudder móvil)
        if (this.chaseCam) {
          renderSolidWingModel320(this, projPoint320, projLine);
        }

        // 3. OSD estilo INAV a pantalla completa (indica si es Ala sin Rudder o Avión con Cola)
        const g = isFreeFlightNoGates() ? { x: 0, y: 12, z: 0 } : CIRCUIT_GATES[this.activeGate];
        const dxG = g.x - this.px, dzG = g.z - this.pz;
        const gateDist = Math.hypot(dxG, g.y - this.py, dzG);
        const gateBearingRad = Math.atan2(dxG * this.rx + dzG * this.rz, dxG * this.fx + dzG * this.fz);

        renderInavOsd320({
          callsign: fcProfile.wing.name.slice(0, 11),
          modeLabel: aeroEnv.failsafeTimer > 0 ? 'FS RTH' : (this.launchTimer > 0 ? 'LAUNCH' : this.mode),
          spdMs: this.spd,
          thrPct: this.thrCmd * 100,
          altM: this.py,
          vario: this.vy,
          activeGate: this.activeGate,
          gateDist,
          gateBearingRad,
          totalDistKm: this.totalDistKm,
          flightTimeSec: this.flightTime,
          camX, camY, camZ,
          cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFz,
          projPoint320
        });
      }
    };
    fpvDroneSim.reset();
    fpvWingSim.reset();

    /***************************************************************************

     ***************************************************************************/
    const ROM_LIST = [
      { id: 'fpv_wing',  sys: 'S3-FPV', name: 'FPV FIXED-WING',   size: '128KB', fav: true  },
      { id: 'fpv_drone', sys: 'S3-FPV', name: 'FPV DRONE SIM',    size: '128KB', fav: true  },

    function handleOledTouchPoint(clientX, clientY, isStart) {
      const rect = oledCanvas.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (clientX - rect.left) / (rect.width || 1)));
      const ny = Math.max(0, Math.min(1, (clientY - rect.top) / (rect.height || 1)));
      capTouch.x320 = Math.round(nx * (DISP_W - 1));
      capTouch.y240 = Math.round(ny * (DISP_H - 1));
      capTouch.lx128 = nx * SCREEN_W;
      capTouch.ly64  = ny * SCREEN_H;
      capTouch.active = true;
      if (isStart) capTouch.justTapped = true;
    }

    oledCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, true);
    }, { passive: false });
    oledCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, false);
    }, { passive: false });
    oledCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      capTouch.active = false;
    }, { passive: false });
    oledCanvas.addEventListener('mousedown', (e) => {
      handleOledTouchPoint(e.clientX, e.clientY, true);
    });
    window.addEventListener('mousemove', (e) => {
      if (capTouch.active && e.buttons === 1) handleOledTouchPoint(e.clientX, e.clientY, false);
    });
    window.addEventListener('mouseup', () => { capTouch.active = false; });

    let rgOverlayOpen = false;

    let rgTuningTab   = 0; // 0 = FPV DRONE 5", 1 = FPV WING Z-84

    let rgOverlayCursor = 0;

      'CONTINUE FLIGHT',
      'RATES & PHYSICS CFG',
      'C1: CIRCUITO ROJO (15G)',
      'C2: CIRCUITO MORADO (15G)',
      'C3: CIRCUITO NARANJA (15G)',
      'OFF: MAPA SIN GATES (LIBRE)',
      'SWITCH: DRONE <-> WING',
      'TERRAIN THEME (1-4)',
      'QUIT TO RETRO-GO'

      toastMsg = msg;
      toastTimer = 1.4;
      blinkSdLed();

    function launchRom(romId) {
      blinkSdLed();
      if (romId === 'fc_tuning') {
        if (activeRomId !== 'fpv_drone' && activeRomId !== 'fpv_wing') activeRomId = 'fpv_wing';
        osState = 'ingame';
        rgOverlayOpen = true;
        rgTuningOpen = true;
        rgTuningTab = 0;
        setFaceLabels('TAB', 'DEF', 'FLY', 'STEP+', 'Y/SELECT:PESTAÑA | UP/DN:ITEM | L/R:AJUSTAR | B:VOLAR');
        playTone(820, 0.08);
        return;
      }
      activeRomId = romId;
      osState = 'ingame';
      rgOverlayOpen = false;
      rgTuningOpen = false;
      playTone(820, 0.08);

      if (romId === 'fpv_drone') {
        setFaceLabels('MODO', 'RST', 'CAM', 'BOOST', 'L:THR/YAW R:PIT/ROL | MENU:RATES');
        fpvDroneSim.reset();
      } else if (romId === 'fpv_wing') {
        setFaceLabels('MODO', 'LNCH', 'CAM', 'BOOST', 'L:THR/YAW R:ELV/AIL | X:HAND LAUNCH');
        fpvWingSim.reset();
        showToast('HAND LAUNCH! Z-84');
      } else if (romId === 'hwtest') {
        setFaceLabels('Y', 'X', 'B', 'A', 'TOCA LA PANTALLA IPS O PULSA ★ MENU');
      }
    }

    function drawRomBoxArt(romId, t) {

      fbRect(bx, by, bw, bh, true, 8);
      fbRect(bx, by, bw, bh, false, 2);

        const dy = Math.round(Math.sin(t * 4) * 2);
        const cx = bx + 19, cy = by + 20 + dy;
        fbDrawLine(cx - 8, cy - 3, cx + 8, cy + 3, 0, 5);
        fbDrawLine(cx - 8, cy + 3, cx + 8, cy - 3, 0, 5);
        fbCircle(cx - 8, cy - 3, 2, 3);
        fbCircle(cx + 8, cy - 3, 2, 3);
        fbDrawText('DRON', bx + 11, by + 29, 2);
      } else if (romId === 'fpv_wing') {
        const cx = bx + 19, cy = by + 16;

        fbDrawLine(cx, cy - 6, cx + 13, cy + 6 - bank, 0, 1);
        fbDrawLine(cx - 13, cy + 6 + bank, cx, cy + 2, 0, 4);
        fbDrawLine(cx + 13, cy + 6 - bank, cx, cy + 2, 0, 4);

        fbDrawLine(bx + 6, by + 24, bx + 33, by + 24, 0, 6);
        fbDrawLine(bx + 19, by + 6, bx + 19, by + 26, 0, 6);
        fbDrawLine(bx + 7, by + 24, bx + 19, by + 18, 0, 3);
        fbDrawLine(bx + 19, by + 18, bx + 31, by + 7, 0, 2);
        fbDrawText('RATE', bx + 11, by + 29, 5);
      } else {
        fbRect(bx + 9, by + 6, 20, 18, false, 3);
        fbDrawLine(bx + 12, by + 15, bx + 26, by + 15, 0, 2);
        fbDrawLine(bx + 19, by + 9, bx + 19, by + 21, 0, 2);
        fbDrawText('DIAG', bx + 11, by + 29, 3);
      }
    }

    function updateAndRenderRetroGoBoot(dt) {
      bootTimer -= dt;
      fbClear(0);
      fbRect(2, 2, 124, 60, false, 5);
      fbRect(3, 3, 122, 11, true, 8);
      fbDrawText('RETRO-GO S3 // INAV VOXEL', 10, 6, 2);
      fbDrawText('MCU : ESP32-S3 LX7 240MHZ', 8, 18, 1);
      fbDrawText('MEM : 16MB FLASH / 8MB PSRAM', 8, 26, 3);
      fbDrawText('DEF : Z-84 FIXED-WING LAUNCH', 8, 34, 5);
      fbDrawText('OSD : INAV MAX7456 + RATES', 8, 42, 2);

      const pct = Math.min(1.0, (0.7 - bootTimer) / 0.6);
      fbRect(12, 51, 104, 6, false, 1);
      fbRect(14, 53, Math.round(pct * 100), 2, true, 3);

      if (bootTimer <= 0 || hwInput.justPressed('A') || hwInput.justPressed('MENU') || capTouch.justTapped) {
        // Iniciar por defecto directamente lanzando el Ala Fija Z-84 (FPV FIXED-WING)
        launchRom('fpv_wing');
      }
    }

    function updateAndRenderRetroGoLauncher(dt) {
      previewAnimT += dt;
      if (navCooldown > 0) navCooldown -= dt;

      const filteredRoms = rgTabIdx === 1 ? ROM_LIST.filter(r => r.fav) : ROM_LIST;
      if (rgCursor >= filteredRoms.length) rgCursor = Math.max(0, filteredRoms.length - 1);

      if (capTouch.justTapped) {
        if (capTouch.ly64 <= 11) {
          if (capTouch.lx128 < 32) rgTabIdx = 0;
          else if (capTouch.lx128 < 60) rgTabIdx = 1;
          else rgTabIdx = 2;
          playTone(620, 0.03);
        } else if (rgTabIdx !== 2 && capTouch.ly64 >= 12 && capTouch.ly64 <= 52) {
          const idx = Math.floor((capTouch.ly64 - 12) / 9);
          if (idx >= 0 && idx < filteredRoms.length) {
            if (rgCursor === idx || capTouch.lx128 > 82) {
              launchRom(filteredRoms[idx].id);
              capTouch.justTapped = false;
              return;
            } else {
              rgCursor = idx;
              playTone(480, 0.025);
            }
          }
        }
      }

      const navY = isRadioThrottleActive() ? hwInput.ry : (Math.abs(hwInput.ly) > Math.abs(hwInput.ry) ? hwInput.ly : hwInput.ry);
      const navX = Math.abs(hwInput.lx) > Math.abs(hwInput.rx) ? hwInput.lx : hwInput.rx;

      if (navCooldown <= 0) {
        if (navY < -0.45 || hwInput.justPressed('DOWN')) {
          rgCursor = (rgCursor + 1) % (filteredRoms.length || 1);
          navCooldown = 0.17;
          playTone(480, 0.025);
        } else if (navY > 0.45 || hwInput.justPressed('UP')) {
          rgCursor = (rgCursor - 1 + (filteredRoms.length || 1)) % (filteredRoms.length || 1);
          navCooldown = 0.17;
          playTone(480, 0.025);
        } else if (navX > 0.55 || hwInput.justPressed('RIGHT')) {
          rgTabIdx = (rgTabIdx + 1) % 3;
          navCooldown = 0.22;
          playTone(620, 0.03);
        } else if (navX < -0.55 || hwInput.justPressed('LEFT')) {
          rgTabIdx = (rgTabIdx + 2) % 3;
          navCooldown = 0.22;
          playTone(620, 0.03);
        }
      }

      if (hwInput.justPressed('SELECT') || hwInput.justPressed('Y')) {
        generateGentleVoxelMap(currentThemeIdx + 1);
        showToast(TERRAIN_THEMES[currentThemeIdx].name);
        playTone(700, 0.04);
      }

      if (hwInput.justPressed('X')) {
        launchRom('fc_tuning');
        return;
      }

      if (hwInput.justPressed('B')) {
        launchRom('fpv_wing');
        return;
      }

      if ((hwInput.justPressed('A') || hwInput.justPressed('L3') || hwInput.justPressed('R3')) && rgTabIdx !== 2) {
        const rom = filteredRoms[rgCursor];
        if (rom) {
          launchRom(rom.id);
          return;
        }
      }

      fbClear(0);
      fbRect(0, 0, 128, 10, true, 8);
      const tabs = ['[FPV]', '[FAV]', '[S3-INFO]'];
      let tx = 2;
      for (let i = 0; i < tabs.length; i++) {
        if (i === rgTabIdx) {
          fbRect(tx - 1, 1, tabs[i].length * 4 + 2, 8, true, 2);
          fbDrawText(tabs[i], tx, 2, 0);
        } else {
          fbDrawText(tabs[i], tx, 2, 1);
        }
        tx += tabs[i].length * 4 + 4;
      }
      fbDrawText('BF/INAV', 96, 2, 3);

      if (rgTabIdx === 2) {
        fbDrawText('QUAD: 4-MOTOR PID + AIRMODE', 4, 13, 2);
        fbDrawText('WING: SEMIALAS + TIP-STALL', 4, 21, 5);
        fbDrawText('USB/BT: TX16S AETR + GAMEPAD', 4, 29, 3);
        fbDrawText('CFG : PULSA X O 🎮 RC/PAD', 4, 37, 1);
        fbDrawText('FPS : 240HZ PHY / 60FPS DMA', 4, 45, 9);
        fbDrawLine(0, 53, 127, 53, 0, 6);
        fbDrawText('SELECT: CAMBIAR TEMA VOXEL', 4, 56, 2);
        return;
      }

      for (let i = 0; i < filteredRoms.length; i++) {
        const rom = filteredRoms[i];
        const y = 14 + i * 9;
        const sel = (i === rgCursor);
        const label = (rom.fav ? '*' : ' ') + rom.name.slice(0, 18);
        if (sel) {
          fbRect(1, y - 1, 82, 8, true, 4);
          fbDrawText('>' + label, 2, y, 1);
        } else {
          fbDrawText(' ' + label, 2, y, rom.fav ? 2 : 1);
        }
      }

      const currentRom = filteredRoms[rgCursor];
      if (currentRom) {
        drawRomBoxArt(currentRom.id, previewAnimT);
        fbRect(0, 53, 128, 11, true, 8);
        fbDrawText(`${TERRAIN_THEMES[currentThemeIdx].name} | X:RATES`, 2, 56, 3);
      }
    }

    // =========================================================================
    // MENÚ UNIFICADO CONGRUENTE 320x240 EN 4 PESTAÑAS: [WORLD] | [WING] | [DRONE] | [RC/PAD]
