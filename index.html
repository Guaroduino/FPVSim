        this.thrCmd = thr;

        const mode = this.modes[this.modeIdx];
        const curPitch = Math.asin(Math.max(-1, Math.min(1, this.fy)));
        const curRoll  = Math.atan2(this.ry, Math.max(0.12, this.uy));

        const elevInput = hwInput.ry;
        const ailInput  = hwInput.rx;
        const rudInput  = hwInput.lx;

        let tPitch = 0, tRoll = 0, tYaw = rudInput * 65 * DEG2RAD;

        if (mode === 'ACRO') {
          tPitch = elevInput * 175 * DEG2RAD;
          tRoll  = ailInput  * 250 * DEG2RAD;
        } else if (mode === 'FBWA') {
          const targetPitch = elevInput * 36 * DEG2RAD;
          const targetRoll  = -ailInput * 58 * DEG2RAD;
          tPitch = (targetPitch - curPitch) * 5.2;
          tRoll  = (targetRoll  - curRoll)  * 6.0;
        } else {
          const targetPitch = (elevInput * 22 * DEG2RAD) - (this.vy * 0.025);
          const targetRoll  = -ailInput * 42 * DEG2RAD;
          tPitch = (targetPitch - curPitch) * 4.5;
          tRoll  = (targetRoll  - curRoll)  * 5.0;
        }

        const bankTurnYaw = -this.ry * (9.81 / Math.max(14.0, this.airspeed)) * 1.45;
        tYaw += bankTurnYaw;

        const stallSpeed = 13.5;
        this.isStalling = (!this.onGround && this.airspeed < stallSpeed);
        if (this.isStalling) {
          tPitch -= (stallSpeed - this.airspeed) * 0.35;
        }

        const ctrlAuth = Math.min(1.25, Math.max(0.35, this.airspeed / 24.0));
        const alpha = Math.min(1.0, 16.0 * dt);
        this.pitchRate += (tPitch * ctrlAuth - this.pitchRate) * alpha;
        this.rollRate  += (tRoll  * ctrlAuth - this.rollRate)  * alpha;
        this.yawRate   += (tYaw   - this.yawRate)   * alpha;

        integrateRotationSO3(this, this.pitchRate, this.rollRate, this.yawRate, dt);

        const maxThrustAccel = (hwInput.btn.A ? 24.0 : 16.5) * thr;
        const parasiteDrag   = 0.011 * this.airspeed * this.airspeed;
        const inducedDrag    = (Math.abs(elevInput) * 1.8 + (1.0 - Math.abs(this.uy)) * 1.2);
        const gravityAlongF  = -9.81 * this.fy;

        this.airspeed += (maxThrustAccel - parasiteDrag - inducedDrag + gravityAlongF) * dt;
        this.airspeed = Math.max(6.0, Math.min(72.0, this.airspeed));

        const liftFactor = Math.min(1.35, (this.airspeed / 20.5) * (this.airspeed / 20.5));
        const wingLift = 9.81 * liftFactor;

        const groundHere  = getTerrainHeightMeters(this.px, this.pz);
        const groundAhead = getTerrainHeightMeters(this.px + this.fx * 8, this.pz + this.fz * 8);
        const agl = this.py - groundHere;
        let ridgeUpdraft = 0;
        if (agl < 22.0 && groundAhead > groundHere + 1.2) {
          ridgeUpdraft = Math.min(5.5, (groundAhead - groundHere) * 0.9);
          this.inUpdraft = true;
        } else {
          this.inUpdraft = false;
        }

        const targetVx = this.fx * this.airspeed;
        const targetVy = this.fy * this.airspeed + (this.uy * wingLift - 9.81 + ridgeUpdraft) * 0.45;
        const targetVz = this.fz * this.airspeed;

        const aeroLock = Math.min(1.0, 9.0 * dt);
        this.vx += (targetVx - this.vx) * aeroLock;
        this.vy += (targetVy - this.vy) * aeroLock;
        this.vz += (targetVz - this.vz) * aeroLock;

        this.px += this.vx * dt;
        this.py += this.vy * dt;
        this.pz += this.vz * dt;

        const newGroundH = getTerrainHeightMeters(this.px, this.pz);
        if (this.py <= newGroundH + 0.75) {
          this.py = newGroundH + 0.75;
          this.onGround = true;
          if (this.vy < 0) this.vy = 0;
          this.ry *= 0.85;
          this.uy = Math.max(0.9, this.uy);
        } else {
          this.onGround = false;
        }

        const gates = VOXEL_MAPS[currentMapIdx].gates;
        const g = gates[this.activeGate];
        if (g && Math.hypot(this.px - g.x, this.py - g.y, this.pz - g.z) < g.w * 0.85) {
          this.activeGate = (this.activeGate + 1) % gates.length;
          showToast(`WAYPOINT ${this.activeGate}/${gates.length} OK!`);
          playTone(940, 0.08);
        }
      },

      render() {
        const cRx = this.rx, cRy = this.ry, cRz = this.rz;
        const cUx = this.ux, cUy = this.uy, cUz = this.uz;
        const cFx = this.fx, cFy = this.fy, cFz = this.fz;

        const groundAtWing = getTerrainHeightMeters(this.px, this.pz);
        const camX = this.chaseCam ? this.px - cFx * 5.2 + cUx * 1.4 : this.px;
        const camZ = this.chaseCam ? this.pz - cFz * 5.2 + cUz * 1.4 : this.pz;
        const minCamY = getTerrainHeightMeters(camX, camZ) + 0.6;
        const camY = Math.max(minCamY, this.chaseCam ? this.py - cFy * 5.2 + cUy * 1.4 : this.py);

        const voxInfo = renderVoxelSpaceComanche(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        const projLine3D = create3DProjector(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        const gates = VOXEL_MAPS[currentMapIdx].gates;
        renderCourseGates3D(projLine3D, gates, this.activeGate);

        if (this.chaseCam) {
          const noseX = this.px + this.fx * 1.5, noseY = this.py + this.fy * 1.5, noseZ = this.pz + this.fz * 1.5;
          const tailX = this.px - this.fx * 0.9, tailY = this.py - this.fy * 0.9, tailZ = this.pz - this.fz * 0.9;
          const lwX = this.px - this.fx * 0.5 - this.rx * 2.1, lwY = this.py - this.fy * 0.5 - this.ry * 2.1, lwZ = this.pz - this.fz * 0.5 - this.rz * 2.1;
          const rwX = this.px - this.fx * 0.5 + this.rx * 2.1, rwY = this.py - this.fy * 0.5 + this.ry * 2.1, rwZ = this.pz - this.fz * 0.5 + this.rz * 2.1;
          const lTipX = lwX + this.ux * 0.55, lTipY = lwY + this.uy * 0.55, lTipZ = lwZ + this.uz * 0.55;
          const rTipX = rwX + this.ux * 0.55, rTipY = rwY + this.uy * 0.55, rTipZ = rwZ + this.uz * 0.55;

          projLine3D(noseX, noseY, noseZ, lwX, lwY, lwZ, 0, 1);
          projLine3D(noseX, noseY, noseZ, rwX, rwY, rwZ, 0, 1);
          projLine3D(lwX, lwY, lwZ, tailX, tailY, tailZ, 0, 4);
          projLine3D(rwX, rwY, rwZ, tailX, tailY, tailZ, 0, 4);
          projLine3D(noseX, noseY, noseZ, tailX, tailY, tailZ, 0, 5);
          projLine3D(lwX, lwY, lwZ, lTipX, lTipY, lTipZ, 0, 2);
          projLine3D(rwX, rwY, rwZ, rTipX, rTipY, rTipZ, 0, 2);
        }

        renderMiniRadar(this.px, this.pz, this.fx, this.fz, this.activeGate);

        const g = gates[this.activeGate] || gates[0];
        const dxG = g.x - this.px, dzG = g.z - this.pz;
        const gateDist = Math.hypot(dxG, g.y - this.py, dzG);
        const gateBearing = Math.atan2(dxG * this.rx + dzG * this.rz, dxG * this.fx + dzG * this.fz);

        renderFpvOsd({
          craftType: 'WING',
          mode: this.modes[this.modeIdx],
          spdMs: this.airspeed,
          thrPct: this.thrCmd * 100,
          altMsl: this.py,
          altAgl: this.py - groundAtWing,
          vario: this.vy,
          activeGate: this.activeGate,
          totalGates: gates.length,
          gateDist,
          gateBearing,
          rollRad: voxInfo.roll,
          pitchRad: Math.asin(Math.max(-1, Math.min(1, cFy))),
          stallWarn: this.isStalling,
          updraftWarn: this.inUpdraft,
          chaseCam: this.chaseCam
        });
      }
    };

    /***************************************************************************
     * 7. EXPLORADOR INTERACTIVO DE MAPAS VOXEL COMANCHE 3 + BENCHMARK ESP32-S3
     ***************************************************************************/
    let explorerCamAngle = 0;
    function renderVoxelExplorer(dt) {
      explorerCamAngle += dt * 0.35;
      if (hwInput.justPressed('LEFT') || hwInput.justPressed('UP')) {
        generateVoxelMap(currentMapIdx - 1);
        showToast(`MAP: ${VOXEL_MAPS[currentMapIdx].name}`);
        playTone(620, 0.04);
      }
      if (hwInput.justPressed('RIGHT') || hwInput.justPressed('DOWN') || hwInput.justPressed('SELECT') || capTouch.justTapped) {
        capTouch.justTapped = false;
        generateVoxelMap(currentMapIdx + 1);
        showToast(`MAP: ${VOXEL_MAPS[currentMapIdx].name}`);
        playTone(720, 0.04);
      }
      if (hwInput.justPressed('Y')) {
        voxelDetailMode = (voxelDetailMode + 1) % VOXEL_DETAIL_NAMES.length;
        showToast(VOXEL_DETAIL_NAMES[voxelDetailMode]);
      }
      if (hwInput.justPressed('A')) {
        launchRom('fpv_drone');
        return;
      }
      if (hwInput.justPressed('B')) {
        launchRom('fpv_wing');
        return;
      }

      const camX = Math.sin(explorerCamAngle) * 55 + hwInput.lx * 40;
      const camZ = Math.cos(explorerCamAngle) * 55 + hwInput.ly * 40;
      const camY = getTerrainHeightMeters(camX, camZ) + 26 + hwInput.ry * 15;
      const yaw = explorerCamAngle + Math.PI * 0.5 + hwInput.rx * 1.2;
      const roll = Math.sin(explorerCamAngle * 2) * 0.22;

      const cY = Math.cos(yaw), sY = Math.sin(yaw);
      const cR = Math.cos(roll), sR = Math.sin(roll);
      renderVoxelSpaceComanche(
        camX, camY, camZ,
        cY * cR, sR, -sY * cR,
        -cY * sR, cR, sY * sR,
        sY, -0.18, cY
      );

      const m = VOXEL_MAPS[currentMapIdx];
      fbRect(0, 0, 128, 9, true, 0);
      fbDrawText(`MAP ${currentMapIdx + 1}/4: ${m.name}`, 2, 2, 2);
      fbRect(0, 48, 128, 16, true, 0);
      fbDrawText(`${m.desc} (768KB PSRAM)`, 2, 50, 5);
      fbDrawText('DPAD:MAPA | A:DRONE | B:ALA FIJA', 2, 57, 3);
    }

    function handleOledTouchPoint(clientX, clientY, isStart) {
      const rect = oledCanvas.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (clientX - rect.left) / (rect.width || 1)));
      const ny = Math.max(0, Math.min(1, (clientY - rect.top) / (rect.height || 1)));
      capTouch.x320 = Math.round(nx * (DISP_W - 1));
      capTouch.y240 = Math.round(ny * (DISP_H - 1));
      capTouch.lx128 = nx * SCREEN_W;
      capTouch.ly64  = ny * SCREEN_H;
      capTouch.active = true;
      if (isStart) capTouch.justTapped = true;
    }

    oledCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, true);
    }, { passive: false });
    oledCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      handleOledTouchPoint(t.clientX, t.clientY, false);
    }, { passive: false });
    oledCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      capTouch.active = false;
    }, { passive: false });
    oledCanvas.addEventListener('mousedown', (e) => {
      handleOledTouchPoint(e.clientX, e.clientY, true);
    });
    window.addEventListener('mousemove', (e) => {
      if (capTouch.active && e.buttons === 1) handleOledTouchPoint(e.clientX, e.clientY, false);
    });
    window.addEventListener('mouseup', () => { capTouch.active = false; });

    function updateAndRenderRetroGoLauncher(dt) {

        if (capTouch.ly64 <= 11) {
          if (capTouch.lx128 < 32) rgTabIdx = 0;
          else if (capTouch.lx128 < 60) rgTabIdx = 1;
          else rgTabIdx = 2;
          playTone(620, 0.03);
        } else if (rgTabIdx !== 2 && capTouch.ly64 >= 12 && capTouch.ly64 <= 52) {
          const idx = Math.floor((capTouch.ly64 - 12) / 9);
          if (idx >= 0 && idx < filteredRoms.length) {
            if (rgCursor === idx || capTouch.lx128 > 82) {
              launchRom(filteredRoms[idx].id);
              capTouch.justTapped = false;

              rgCursor = idx;
              playTone(480, 0.025);

      }

      if (hwInput.justPressed('A')) {
        hwInput.btn.A = false;
        playTone(740, 0.05);
        if (rgOverlayCursor === 0) {
          rgOverlayOpen = false;
        } else if (rgOverlayCursor === 1) {
          const nextId = activeRomId === 'fpv_drone' ? 'fpv_wing' : 'fpv_drone';
          launchRom(nextId);
          showToast(nextId === 'fpv_drone' ? 'CRAFT: FPV DRONE' : 'CRAFT: FIXED-WING');
        } else if (rgOverlayCursor === 2) {
          generateVoxelMap(currentMapIdx + 1);
          if (activeRomId === 'fpv_drone') fpvDroneSim.reset();
          if (activeRomId === 'fpv_wing') fpvWingSim.reset();
          showToast(`MAP: ${VOXEL_MAPS[currentMapIdx].name}`);
          rgOverlayOpen = false;
        } else if (rgOverlayCursor === 3) {
          voxelDetailMode = (voxelDetailMode + 1) % VOXEL_DETAIL_NAMES.length;
          showToast(VOXEL_DETAIL_NAMES[voxelDetailMode]);
          rgOverlayOpen = false;
        } else if (rgOverlayCursor === 4) {
          launchRom(activeRomId);
          showToast('RUNWAY RESET');
        } else if (rgOverlayCursor === 5) {
          rgOverlayOpen = false;
          osState = 'launcher';
          setFaceLabels('MAPA', 'INFO', 'WING', 'RUN', 'TOUCH/DPAD/STICK:NAV | A:RUN');
        }
        return;
      }

      fbRect(12, 4, 104, 56, true, 0);
      fbRect(12, 4, 104, 56, false, 2);
      fbRect(12, 4, 104, 9, true, 4);
      fbDrawText('FPV VOXEL IN-FLIGHT MENU', 16, 6, 1);

      for (let i = 0; i < RG_OVERLAY_ITEMS.length; i++) {
        const y = 15 + i * 7;
        if (i === rgOverlayCursor) {
          fbRect(15, y - 1, 98, 7, true, 2);
          fbDrawText('>' + RG_OVERLAY_ITEMS[i], 17, y, 0);
        } else {
          fbDrawText(' ' + RG_OVERLAY_ITEMS[i], 17, y, 1);
        }
      }
    }

    // CARTUCHO 4: ILI9341V SPI + FT6336 TOUCH + ADC DIAGNOSTIC
    function renderHwDiagnostic() {
      fbClear(0);
      fbRect(0, 0, 128, 8, true, 8);
      fbDrawText('S3 ILI9341V + FT6336 + ADC', 4, 2, 2);

      fbRect(4, 11, 34, 34, false, 5);
      const lxPx = 21 + Math.round(hwInput.lx * 14), lyPx = 28 - Math.round(hwInput.ly * 14);
      fbDrawLine(21, 28, lxPx, lyPx, 0, 3);
      fbRect(lxPx - 1, lyPx - 1, 3, 3, true, 2);
      fbDrawText(`L3:${hwInput.btn.L3 ? 1 : 0}`, 6, 47, hwInput.btn.L3 ? 3 : 1);

      fbRect(90, 11, 34, 34, false, 5);
      const rxPx = 107 + Math.round(hwInput.rx * 14), ryPx = 28 - Math.round(hwInput.ry * 14);
      fbDrawLine(107, 28, rxPx, ryPx, 0, 3);
      fbRect(rxPx - 1, ryPx - 1, 3, 3, true, 2);
      fbDrawText(`R3:${hwInput.btn.R3 ? 1 : 0}`, 92, 47, hwInput.btn.R3 ? 3 : 1);

      const btns = ['Y', 'X', 'B', 'A'];
      for (let i = 0; i < 4; i++) {
        const bx = 44 + i * 10, pressed = hwInput.btn[btns[i]];
        fbRect(bx, 12, 8, 9, pressed, pressed ? 2 : 5);
        fbDrawText(btns[i], bx + 2, 14, pressed ? 0 : 1);
      }

      const dpad = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
      const dLbl = ['U', 'D', 'L', 'R'];
      for (let i = 0; i < 4; i++) {
        const bx = 44 + i * 10, pressed = hwInput.btn[dpad[i]];
        fbRect(bx, 23, 8, 9, pressed, pressed ? 3 : 5);
        fbDrawText(dLbl[i], bx + 2, 25, pressed ? 0 : 1);
      }

      const mode = SPI_MODES[paletteIdx];
      const dmaMs = (1228800 / (mode.spiMhz * 1e6) * 1000).toFixed(1);
      fbDrawText(`SPI:${mode.spiMhz}MHZ (${dmaMs}MS)`, 40, 35, 3);
      fbDrawText(`TCH:${capTouch.x320},${capTouch.y240}`, 40, 43, capTouch.active ? 2 : 5);
      fbRect(0, 55, 128, 9, true, 8);
      fbDrawText('VOXEL PSRAM: 768KB | 60FPS OK', 4, 57, 3);

      if (capTouch.active) {
        fbCircle(capTouch.lx128, capTouch.ly64, 5, 4);
        fbDrawLine(capTouch.lx128 - 8, capTouch.ly64, capTouch.lx128 + 8, capTouch.ly64, 0, 2);
        fbDrawLine(capTouch.lx128, capTouch.ly64 - 8, capTouch.lx128, capTouch.ly64 + 8, 0, 2);
      }
    }

    /***************************************************************************
     * 9. BUCLE PRINCIPAL DE SISTEMA RETRO-GO (CON SIMULADOR SPI DMA ILI9341V)
     ***************************************************************************/
    document.getElementById('btnPalette').addEventListener('click', (e) => {
      paletteIdx = (paletteIdx + 1) % SPI_MODES.length;
      const m = SPI_MODES[paletteIdx];
      e.currentTarget.textContent = `🎨 ${m.name}`;
      showToast(m.name);
    });

    document.getElementById('btnAudio').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      e.currentTarget.textContent = soundEnabled ? '🔊 SND' : '🔇 SND';
      e.currentTarget.classList.toggle('active', soundEnabled);
    });

    document.getElementById('btnGrid').addEventListener('click', (e) => {
      const c = document.getElementById('oledContainer');
      c.classList.toggle('pixel-grid');
      e.currentTarget.classList.toggle('active', c.classList.contains('pixel-grid'));
    });

    document.getElementById('btnFull').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    let lastTime = performance.now();
    let fpsFrames = 0;
    let fpsClock = performance.now();

    function retroGoMainLoop(now) {
      requestAnimationFrame(retroGoMainLoop);

      try {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000.0));
        lastTime = now;

        updateInputPolling();

        if (osState === 'boot') {
          updateAndRenderRetroGoBoot(dt);
        } else if (osState === 'launcher') {
          updateAndRenderRetroGoLauncher(dt);
        } else if (osState === 'ingame') {
          if (hwInput.justPressed('MENU')) {
            rgOverlayOpen = !rgOverlayOpen;
            rgOverlayCursor = 0;
            playTone(600, 0.04);
          }

          if (!rgOverlayOpen) {
            if (activeRomId === 'fpv_drone') {
              for (let s = 0; s < 4; s++) fpvDroneSim.step(dt / 4);
              fpvDroneSim.render();
            } else if (activeRomId === 'fpv_wing') {
              for (let s = 0; s < 4; s++) fpvWingSim.step(dt / 4);
              fpvWingSim.render();
            } else if (activeRomId === 'vox_maps') {
              renderVoxelExplorer(dt);
            } else if (activeRomId === 'hwtest') {
              renderHwDiagnostic();
            }
          } else {
            if (activeRomId === 'fpv_drone') fpvDroneSim.render();
            else if (activeRomId === 'fpv_wing') fpvWingSim.render();
            else if (activeRomId === 'vox_maps') renderVoxelExplorer(0);
            else if (activeRomId === 'hwtest') renderHwDiagnostic();

            updateAndRenderRetroGoOverlay(dt);
          }
        }

        if (toastTimer > 0) {
          toastTimer -= dt;
          const tw = toastMsg.length * 4 + 6;
          fbRect(64 - (tw >> 1), 1, tw, 9, true, 2);
          fbDrawText(toastMsg, 64 - (tw >> 1) + 3, 3, 0);
        }

        fbPresentToCanvas();
        snapshotPrevButtons();
        capTouch.justTapped = false;

        fpsFrames++;
        if (now - fpsClock >= 500) {
          const rawFps = Math.round((fpsFrames * 1000) / (now - fpsClock));
          const mode = SPI_MODES[paletteIdx];
          const dispFps = Math.min(rawFps, mode.targetFps);
          document.getElementById('uiFpsBattery').textContent = `${dispFps}FPS | SPI ${mode.spiMhz}MHz`;
          fpsFrames = 0;
          fpsClock = now;
        }
      } catch (err) {
        console.error('Frame error recovered:', err);
      }
    }

    requestAnimationFrame(retroGoMainLoop);
  </script>
</body>
