<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#181a22" />
  <title>RETRO-GO // ESP32-S3 + 2.8" ILI9341V IPS 320x240 RGB565 v10</title>
  <style>
    :root {
      --case-main: #222530;
      --case-dark: #15171e;
      --bezel-black: #08090c;
      --rg-red: #e53935;
      --rg-gold: #ffb300;
      --rg-cyan: #00e5ff;
      --rg-green: #00e676;
      --btn-a: #d32f2f;
      --btn-b: #f57c00;
      --btn-x: #1976d2;
      --btn-y: #388e3c;
      --text: #eceff4;
      --muted: #9aa5b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: var(--case-dark);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      touch-action: none;
    }

    /* Fullscreen Edge-to-Edge Console Shell on Mobile */
    .retrogo-shell {
      width: 100%;
      height: 100%;
      container-type: size;
      background: linear-gradient(180deg, #2b2f3d 0%, #1e212b 55%, #15171f 100%);
      padding: env(safe-area-inset-top, 6px) 2.2vw env(safe-area-inset-bottom, 8px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8dvh;
    }

    /* Only constrain width on large desktop PC monitors with mouse */
    @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #090a0e;
      }
      .retrogo-shell {
        max-width: 460px;
        max-height: 920px;
        padding: 10px 12px;
        border: 3px solid #3c4254;
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      }
    }

    /* 1. Top Status Bar */
    .shell-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7dvh 2vw;
      background: #14161d;
      border: 1px solid #313646;
      border-radius: 8px;
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      flex-shrink: 0;
    }

    .led-cluster {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
    }

    .led {
      width: clamp(7px, 1.8cqw, 12px);
      height: clamp(7px, 1.8cqw, 12px);
      border-radius: 50%;
      background: var(--rg-green);
      box-shadow: 0 0 6px var(--rg-green);
    }

    .led.sd-act {
      background: var(--rg-gold);
      box-shadow: 0 0 6px var(--rg-gold);
      opacity: 0.3;
      transition: opacity 0.08s;
    }

    .led.sd-act.blink {
      opacity: 1;
    }

    .top-hw-pills {
      display: flex;
      gap: 1.2cqw;
    }

    .pill-btn {
      background: #232734;
      color: var(--text);
      border: 1.5px solid #404659;
      border-radius: 6px;
      padding: 0.5dvh 2cqw;
      font-family: inherit;
      font-size: clamp(0.64rem, 2.2cqw, 1rem);
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      border-color: var(--rg-gold);
      color: var(--rg-gold);
    }

    /* 2. Retro-Go Screen Lens (128x64 Native 1-Bit OLED) */
    .screen-lens {
      background: var(--bezel-black);
      border: 3px solid #141720;
      border-radius: 12px 12px 20px 12px;
      padding: 0.7dvh 2cqw 0.8dvh;
      box-shadow:
        inset 0 0 18px rgba(0, 0, 0, 1),
        0 2px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.4dvh;
      flex-shrink: 0;
    }

    .lens-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.6rem, 2.1cqw, 0.95rem);
      color: #828c9e;
      letter-spacing: 0.6px;
    }

    .rg-stripe {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .rg-stripe i {
      width: clamp(9px, 2.2cqw, 15px);
      height: clamp(3px, 0.8cqw, 5px);
      display: inline-block;
      border-radius: 1px;
    }

    .oled-container {
      width: min(100%, 42cqh);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background: #040609;
      border: 2px solid #2b3344;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      cursor: pointer;
    }

    #oledCanvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .oled-container.pixel-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 50%, transparent 50%);
      background-size: 100% 2px;
      pointer-events: none;
    }

    .lens-branding {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1px;
    }

    .rg-logo-text {
      font-size: clamp(0.75rem, 2.8cqw, 1.25rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      color: #d8dee9;
    }

    .rg-logo-text span {
      color: var(--rg-red);
    }

    .rg-sub-status {
      font-size: clamp(0.58rem, 2cqw, 0.92rem);
      color: var(--rg-gold);
    }

    /* 3. UPPER CONTROLS: DUAL ANALOG JOYSTICKS (WITH L3 / R3 INTEGRATED) */
    .upper-joysticks-section {
      flex: 1.08;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5cqw;
      align-items: center;
      justify-items: center;
      padding: 0.4dvh 1cqw;
    }

    .stick-unit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7dvh;
      position: relative;
    }

    .stick-top-row {
      width: 94%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1cqw;
    }

    .stick-adc-label {
      font-size: clamp(0.65rem, 2.3cqw, 1.05rem);
      color: var(--muted);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .btn-stick-click {
      background: #1b1f2a;
      border: 2px solid #48526a;
      color: var(--rg-cyan);
      border-radius: 8px;
      padding: 0.6dvh 2.6cqw;
      font-family: inherit;
      font-size: clamp(0.68rem, 2.5cqw, 1.1rem);
      font-weight: 800;
      box-shadow: 0 3px 0 #0c0e13;
    }

    .btn-stick-click.pressed {
      transform: translateY(2px);
      background: var(--rg-cyan);
      color: #000;
    }

    .stick-canvas {
      width: min(44cqw, 26.5cqh);
      height: min(44cqw, 26.5cqh);
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at center, #1a1f2b 0%, #0b0d13 100%);
      border: 3px solid #3f485e;
      border-radius: 50%;
      touch-action: none;
      display: block;
      box-shadow: inset 0 6px 20px rgba(0, 0, 0, 0.95), 0 3px 8px rgba(255, 255, 255, 0.07);
    }

    .stick-canvas.engaged {
      border-color: var(--rg-gold);
      box-shadow: inset 0 6px 20px rgba(0,0,0,0.95), 0 0 16px rgba(255, 179, 0, 0.45);
    }

    /* 4. LOWER CONTROLS: [D-PAD LEFT] — [SELECT / MENU CENTER] — [4 DIAMOND BUTTONS RIGHT] */
    .lower-controls-deck {
      flex: 1.05;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      gap: 1.5cqw;
      padding: 0.8dvh 1.5cqw 1dvh;
      background: rgba(12, 14, 20, 0.42);
      border-top: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
    }

    .hw-btn {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.04s;
    }

    .hw-btn.pressed {
      transform: translateY(2px);
      filter: brightness(1.3);
    }

    /* Classic Cross D-Pad (Left Side) - Scaled to fill left zone */
    .dpad-cross {
      width: min(37cqw, 25cqh);
      height: min(37cqw, 25cqh);
      position: relative;
    }

    .dpad-arm {
      position: absolute;
      background: linear-gradient(180deg, #323848 0%, #1d202b 100%);
      border: 2.5px solid #4a5268;
      color: #d0d8e8;
      font-size: clamp(1rem, 4.2cqw, 1.9rem);
      box-shadow: 0 4px 0 #090b10, 0 6px 12px rgba(0,0,0,0.55);
    }

    .dpad-arm.pressed {
      background: #41495f;
      color: var(--rg-gold);
      border-color: var(--rg-gold);
    }

    .dpad-up {
      top: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 18% 18% 0 0;
      border-bottom: none;
    }
    .dpad-down {
      bottom: 0; left: 33%; width: 34%; height: 36%;
      border-radius: 0 0 18% 18%;
      border-top: none;
    }
    .dpad-left {
      top: 33%; left: 0; width: 36%; height: 34%;
      border-radius: 18% 0 0 18%;
      border-right: none;
    }
    .dpad-right {
      top: 33%; right: 0; width: 36%; height: 34%;
      border-radius: 0 18% 18% 0;
      border-left: none;
    }
    .dpad-center {
      position: absolute;
      top: 33%; left: 33%; width: 34%; height: 34%;
      background: #242834;
      pointer-events: none;
    }
    .dpad-center::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, #141720 20%, #292e3d 100%);
    }

    /* Center 2 System Buttons (SELECT + START/MENU) */
    .center-sys-cluster {
      display: flex;
      flex-direction: column;
      gap: 2.2cqh;
      align-items: center;
      justify-content: center;
      padding: 0 0.5cqw;
    }

    .btn-sys-pill {
      width: clamp(74px, 19.5cqw, 140px);
      height: clamp(36px, 5.4cqh, 62px);
      background: #1a1e28;
      border: 2.5px solid #4e566e;
      border-radius: 999px;
      color: #dce3ef;
      font-size: clamp(0.72rem, 2.5cqw, 1.18rem);
      letter-spacing: 0.6px;
      box-shadow: 0 4px 0 #0a0c10, 0 5px 10px rgba(0,0,0,0.45);
    }

    .btn-sys-pill.menu-pill {
      border-color: var(--rg-red);
      color: var(--rg-gold);
    }

    /* 4 Action Buttons in Classic Diamond (X Top, Y Left, A Right, B Bottom) - Scaled to fill right zone */
    .diamond-cluster {
      width: min(38cqw, 25.5cqh);
      height: min(38cqw, 25.5cqh);
      position: relative;
    }

    .btn-diamond {
      position: absolute;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3d4356, #1d202b);
      border: 3px solid #525a72;
      color: #fff;
      font-size: clamp(0.95rem, 3.8cqw, 1.75rem);
      line-height: 1;
      box-shadow: 0 5px 0 #090b10, 0 6px 12px rgba(0,0,0,0.6);
    }

    .btn-diamond small {
      font-size: clamp(0.54rem, 1.95cqw, 0.9rem);
      color: #d4dce8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Posiciones del Diamante en porcentaje: X arriba, Y izquierda, A derecha, B abajo */
    .btn-diamond.pos-top {
      top: 0; left: 32%;
      border-color: var(--btn-x);
    }
    .btn-diamond.pos-left {
      top: 32%; left: 0;
      border-color: var(--btn-y);
    }
    .btn-diamond.pos-right {
      top: 32%; right: 0;
      border-color: var(--btn-a);
    }
    .btn-diamond.pos-bottom {
      bottom: 0; left: 32%;
      border-color: var(--btn-b);
    }
  </style>
</head>
<body>
  <div class="retrogo-shell">
    <!-- 1. Top Hardware Bar -->
    <header class="shell-top-bar">
      <div class="led-cluster">
        <span class="led" title="Power ON"></span>
        <span>PWR</span>
        <span id="sdLed" class="led sd-act" title="Flash / SD Activity"></span>
        <span>SPI</span>
        <span style="color:#828c9e;margin-left:3px;">S3 N16R8 + VOXEL (v12)</span>
      </div>
      <div class="top-hw-pills">
        <button id="btnPalette" class="pill-btn">🎨 IPS 60MHz</button>
        <button id="btnAudio" class="pill-btn">🔇 SND</button>
        <button id="btnGrid" class="pill-btn">SCAN</button>
        <button id="btnFull" class="pill-btn">⛶</button>
      </div>
    </header>

    <!-- 2. Retro-Go 2.8" 320x240 IPS RGB565 ILI9341V + Capacitive Touch Screen Lens -->
    <section class="screen-lens">
      <div class="lens-header">
        <div class="rg-stripe">
          <i style="background:#e53935"></i>
          <i style="background:#ffb300"></i>
          <i style="background:#00e676"></i>
          <i style="background:#00e5ff"></i>
          <span style="margin-left:4px;">2.8" IPS 320×240 RGB565 (ILI9341V + TOUCH)</span>
        </div>
        <span id="uiFpsBattery">60FPS | DMA 60MHz</span>
      </div>

      <div id="oledContainer" class="oled-container">
        <canvas id="oledCanvas" width="320" height="240"></canvas>
      </div>

      <div class="lens-branding">
        <div class="rg-logo-text">RETRO<span>-GO</span> <small style="font-size:0.55em;color:#8b9bb4;font-style:normal;">ILI9341V + FT6336</small></div>
        <div id="uiHintBar" class="rg-sub-status">TOUCH/DPAD/STICK:NAV | A:RUN | MENU:OSD</div>
      </div>
    </section>

    <!-- 3. Upper Controls: 2 Analog Joysticks with L3 / R3 Click -->
    <section class="upper-joysticks-section">
      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutLeft" class="stick-adc-label">L:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="L3">L3 CLICK</button>
        </div>
        <canvas id="stickLeft" class="stick-canvas" width="200" height="200"></canvas>
      </div>

      <div class="stick-unit">
        <div class="stick-top-row">
          <span id="readoutRight" class="stick-adc-label">R:2048,2048</span>
          <button class="hw-btn btn-stick-click" data-btn="R3">R3 CLICK</button>
        </div>
        <canvas id="stickRight" class="stick-canvas" width="200" height="200"></canvas>
      </div>
    </section>

    <!-- 4. Lower Controls: [Cruceta D-Pad Izquierda] + [2 Botones Centro] + [4 Botones Diamante Derecha] -->
    <section class="lower-controls-deck">
      <!-- Left: Cross D-Pad -->
      <div class="dpad-cross">
        <button class="hw-btn dpad-arm dpad-up" data-btn="UP">▲</button>
        <button class="hw-btn dpad-arm dpad-down" data-btn="DOWN">▼</button>
        <button class="hw-btn dpad-arm dpad-left" data-btn="LEFT">◀</button>
        <button class="hw-btn dpad-arm dpad-right" data-btn="RIGHT">▶</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Center: 2 System Buttons (SELECT & MENU/START) -->
      <div class="center-sys-cluster">
        <button class="hw-btn btn-sys-pill" data-btn="SELECT">SELECT</button>
        <button class="hw-btn btn-sys-pill menu-pill" data-btn="MENU">★ MENU</button>
      </div>

      <!-- Right: 4 Action Buttons in Diamond Layout (X Top, Y Left, A Right, B Bottom) -->
      <div class="diamond-cluster">
        <button class="hw-btn btn-diamond pos-top" data-btn="X">
          <span>X</span>
          <small id="lblX">RST</small>
        </button>
        <button class="hw-btn btn-diamond pos-left" data-btn="Y">
          <span>Y</span>
          <small id="lblY">MOD</small>
        </button>
        <button class="hw-btn btn-diamond pos-right" data-btn="A">
          <span>A</span>
          <small id="lblA">GAS</small>
        </button>
        <button class="hw-btn btn-diamond pos-bottom" data-btn="B">
          <span>B</span>
          <small id="lblB">BRK</small>
        </button>
      </div>
    </section>
  </div>

  <script>
    /***************************************************************************
     * 1. HARDWARE ABSTRACTION LAYER (HAL) — 2.8" ILI9341V IPS 320x240 RGB565
     *    - Framebuffer real de 16 bits RGB565: 320 x 240 x 2 = 153,600 Bytes (150 KB)
     *    - Compatible con doble buffer DMA en SRAM del ESP32-S3 (LovyanGFX / esp_lcd)
     *    - Rasterizador Bresenham en resolución nativa 320x240 blindado contra bloqueos
     ***************************************************************************/
    const DISP_W = 320;
    const DISP_H = 240;
    const VRAM_PIXELS = DISP_W * DISP_H; // 76,800 píxeles
    const VRAM_BYTES  = VRAM_PIXELS * 2; // 153,600 bytes (150 KB RGB565)
    const vram565 = new Uint16Array(VRAM_PIXELS);

    // Coordenadas lógicas base (128x64 -> escaladas en hardware a 320x240 = x2.5, x3.75)
    const SCREEN_W = 128;
    const SCREEN_H = 64;
    const SCALE_X = DISP_W / SCREEN_W; // 2.5
    const SCALE_Y = DISP_H / SCREEN_H; // 3.75

    const oledCanvas = document.getElementById('oledCanvas');
    const oledCtx = oledCanvas.getContext('2d', { alpha: false });
    const oledImgData = oledCtx.createImageData(DISP_W, DISP_H);
    const rgbaPixels = oledImgData.data;

    function rgb565(r, g, b) {
      return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | ((b & 0xF8) >> 3);
    }

    // Tabla LUT precalculada para convertir RGB565 -> RGBA8888 en <0.3ms
    const LUT_R = new Uint8Array(65536);
    const LUT_G = new Uint8Array(65536);
    const LUT_B = new Uint8Array(65536);
    for (let c = 0; c < 65536; c++) {
      const r5 = (c >> 11) & 0x1F;
      const g6 = (c >> 5)  & 0x3F;
      const b5 =  c        & 0x1F;
      LUT_R[c] = (r5 << 3) | (r5 >> 2);
      LUT_G[c] = (g6 << 2) | (g6 >> 4);
      LUT_B[c] = (b5 << 3) | (b5 >> 2);
    }

    // Paleta de índices rápidos RGB565 (además de aceptar cualquier color 16-bit directo)
    const C565 = {
      BG:      rgb565(8, 12, 22),     // 0: Fondo oscuro IPS
      WHITE:   rgb565(240, 250, 255), // 1: Blanco brillante
      GOLD:    rgb565(255, 190, 0),   // 2: Retro-Go Gold / Ámbar
      GREEN:   rgb565(0, 235, 118),   // 3: Verde Neón
      RED:     rgb565(245, 55, 65),   // 4: Rojo Carmesí
      CYAN:    rgb565(0, 229, 255),   // 5: Cian HUD
      GREY:    rgb565(90, 102, 125),  // 6: Gris Asfalto / UI
      DARKGRN: rgb565(18, 85, 48),    // 7: Verde Terreno
      NAVY:    rgb565(20, 34, 68),    // 8: Azul Retro-Go Header
      ORANGE:  rgb565(255, 120, 20),  // 9: Naranja Rally / Fuego
      MAGENTA: rgb565(245, 60, 210),  // 10: Magenta Gate Activo
      SKYTOP:  rgb565(12, 24, 58),    // 11: Cielo Superior
      SKYBOT:  rgb565(38, 78, 138),   // 12: Horizonte Cielo
      GNDTOP:  rgb565(18, 46, 30),    // 13: Suelo Horizonte
      GNDBOT:  rgb565(10, 24, 18)     // 14: Suelo Cercano
    };

    const INDEX_PALETTE = [
      C565.BG, C565.WHITE, C565.GOLD, C565.GREEN,
      C565.RED, C565.CYAN, C565.GREY, C565.DARKGRN,
      C565.NAVY, C565.ORANGE, C565.MAGENTA, C565.SKYTOP,
      C565.SKYBOT, C565.GNDTOP, C565.GNDBOT
    ];

    // Modos de bus SPI en el ESP32-S3 + ILI9341V
    const SPI_MODES = [
      { name: 'IPS 60MHz DMA', spiMhz: 60, mono: false, targetFps: 60 },
      { name: 'IPS 80MHz QIO', spiMhz: 80, mono: false, targetFps: 60 },
      { name: 'IPS 40MHz SPI', spiMhz: 40, mono: false, targetFps: 45 },
      { name: '1-BIT MONO SIM',spiMhz: 40, mono: true,  targetFps: 60 }
    ];
    let paletteIdx = 0;

    function resolveColor565(color) {
      if (SPI_MODES[paletteIdx].mono) {
        return color === 0 ? rgb565(6, 10, 14) : rgb565(0, 235, 130);
      }
      if (color >= 0 && color < INDEX_PALETTE.length) return INDEX_PALETTE[color];
      return color & 0xFFFF;
    }

    function blinkSdLed() {
      const el = document.getElementById('sdLed');
      el.classList.add('blink');
      setTimeout(() => el.classList.remove('blink'), 120);
    }

    function fbClear(bgColor = 0) {
      vram565.fill(resolveColor565(bgColor));
    }

    // Relleno uniforme de cielo y tierra en 320x240 (sin sub-bandas artificiales)
    function fbFillHorizon320(horizonY240, skyCol, gndCol) {
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return;
      }
      const hy = Math.max(0, Math.min(DISP_H, horizonY240 | 0));
      if (hy > 0) vram565.fill(skyCol, 0, hy * DISP_W);
      if (hy < DISP_H) vram565.fill(gndCol, hy * DISP_W, DISP_H * DISP_W);
    }

    // Relleno de trapecio horizontal (para asfalto y pianos en WRC Rally a 320x240)
    function fbFillQuadScanline(x0Top, x1Top, yTop, x0Bot, x1Bot, yBot, color565) {
      if (SPI_MODES[paletteIdx].mono) return;
      const c = resolveColor565(color565);
      let ya = Math.round(yTop * SCALE_Y);
      let yb = Math.round(yBot * SCALE_Y);
      let xa0 = x0Top * SCALE_X, xa1 = x1Top * SCALE_X;
      let xb0 = x0Bot * SCALE_X, xb1 = x1Bot * SCALE_X;
      if (ya > yb) {
        [ya, yb] = [yb, ya];
        [xa0, xb0] = [xb0, xa0];
        [xa1, xb1] = [xb1, xa1];
      }
      const span = Math.max(1, yb - ya);
      const yStart = Math.max(0, ya), yEnd = Math.min(DISP_H - 1, yb);
      for (let y = yStart; y <= yEnd; y++) {
        const t = (y - ya) / span;
        const lx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa0 + (xb0 - xa0) * t)));
        const rx = Math.max(0, Math.min(DISP_W - 1, Math.round(xa1 + (xb1 - xa1) * t)));
        if (rx >= lx) vram565.fill(c, y * DISP_W + lx, y * DISP_W + rx + 1);
      }
    }

    function fbSetPixel320(px, py, c565) {
      const ix = px | 0, iy = py | 0;
      if (ix < 0 || ix >= DISP_W || iy < 0 || iy >= DISP_H) return;
      vram565[iy * DISP_W + ix] = c565;
    }

    function fbSetPixel(x, y, color = 1) {
      const c = resolveColor565(color);
      const px = Math.round(x * SCALE_X);
      const py = Math.round(y * SCALE_Y);
      fbSetPixel320(px, py, c);
      fbSetPixel320(px + 1, py, c);
      fbSetPixel320(px, py + 1, c);
      fbSetPixel320(px + 1, py + 1, c);
    }

    function fbRect(x, y, w, h, fill = false, color = 1) {
      const c = resolveColor565(color);
      const x0 = Math.max(0, Math.round(x * SCALE_X));
      const y0 = Math.max(0, Math.round(y * SCALE_Y));
      const x1 = Math.min(DISP_W - 1, Math.round((x + w) * SCALE_X) - 1);
      const y1 = Math.min(DISP_H - 1, Math.round((y + h) * SCALE_Y) - 1);
      if (x1 < x0 || y1 < y0) return;

      if (fill) {
        for (let py = y0; py <= y1; py++) {
          vram565.fill(c, py * DISP_W + x0, py * DISP_W + x1 + 1);
        }
      } else {
        for (let px = x0; px <= x1; px++) {
          fbSetPixel320(px, y0, c); fbSetPixel320(px, y0 + 1, c);
          fbSetPixel320(px, y1, c); fbSetPixel320(px, y1 - 1, c);
        }
        for (let py = y0; py <= y1; py++) {
          fbSetPixel320(x0, py, c); fbSetPixel320(x0 + 1, py, c);
          fbSetPixel320(x1, py, c); fbSetPixel320(x1 - 1, py, c);
        }
      }
    }

    function fbCircle(cx, cy, r, color = 1) {
      if (!Number.isFinite(cx) || !Number.isFinite(cy) || !Number.isFinite(r)) return;
      const c = resolveColor565(color);
      const x0 = Math.round(cx * SCALE_X), y0 = Math.round(cy * SCALE_Y);
      let x = Math.min(280, Math.max(1, Math.round(r * ((SCALE_X + SCALE_Y) * 0.5)))), y = 0, err = 0;
      let guard = 0;
      while (x >= y && ++guard < 400) {
        const pts = [
          [x0 + x, y0 + y], [x0 + y, y0 + x], [x0 - y, y0 + x], [x0 - x, y0 + y],
          [x0 - x, y0 - y], [x0 - y, y0 - x], [x0 + y, y0 - x], [x0 + x, y0 - y]
        ];
        for (let i = 0; i < 8; i++) {
          fbSetPixel320(pts[i][0], pts[i][1], c);
          fbSetPixel320(pts[i][0] + 1, pts[i][1], c);
        }
        y += 1;
        if (err <= 0) err += 2 * y + 1;
        if (err > 0) { x -= 1; err -= 2 * x + 1; }
      }
    }

    const CLIP_LEFT = 1, CLIP_RIGHT = 2, CLIP_BOTTOM = 4, CLIP_TOP = 8;
    function computeOutCode320(x, y) {
      let c = 0;
      if (x < 0) c |= CLIP_LEFT; else if (x >= DISP_W) c |= CLIP_RIGHT;
      if (y < 0) c |= CLIP_TOP;  else if (y >= DISP_H) c |= CLIP_BOTTOM;
      return c;
    }

    // Bresenham en resolución nativa 320x240 con clipping Cohen-Sutherland blindado
    function fbDrawLine(lx0, ly0, lx1, ly1, dashedMask = 0, color = 1) {
      if (!Number.isFinite(lx0) || !Number.isFinite(ly0) || !Number.isFinite(lx1) || !Number.isFinite(ly1)) return;
      let x0 = lx0 * SCALE_X, y0 = ly0 * SCALE_Y;
      let x1 = lx1 * SCALE_X, y1 = ly1 * SCALE_Y;
      const c = resolveColor565(color);

      let out0 = computeOutCode320(x0, y0), out1 = computeOutCode320(x1, y1), accept = false;
      let clipIter = 0;

      while (++clipIter <= 12) {
        if (!(out0 | out1)) { accept = true; break; }
        else if (out0 & out1) break;
        else {
          let x = 0, y = 0;
          const out = out0 ? out0 : out1;
          const dx = x1 - x0, dy = y1 - y0;

          if (out & CLIP_BOTTOM) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (DISP_H - 1 - y0) / dy : x0;
            y = DISP_H - 1;
          } else if (out & CLIP_TOP) {
            x = Math.abs(dy) > 1e-6 ? x0 + dx * (0 - y0) / dy : x0;
            y = 0;
          } else if (out & CLIP_RIGHT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (DISP_W - 1 - x0) / dx : y0;
            x = DISP_W - 1;
          } else if (out & CLIP_LEFT) {
            y = Math.abs(dx) > 1e-6 ? y0 + dy * (0 - x0) / dx : y0;
            x = 0;
          }

          if (!Number.isFinite(x) || !Number.isFinite(y)) return;
          if (out === out0) { x0 = x; y0 = y; out0 = computeOutCode320(x0, y0); }
          else { x1 = x; y1 = y; out1 = computeOutCode320(x1, y1); }
        }
      }

      if (!accept) return;

      let ix0 = Math.max(0, Math.min(DISP_W - 1, Math.round(x0)));
      let iy0 = Math.max(0, Math.min(DISP_H - 1, Math.round(y0)));
      const ix1 = Math.max(0, Math.min(DISP_W - 1, Math.round(x1)));
      const iy1 = Math.max(0, Math.min(DISP_H - 1, Math.round(y1)));

      const dx = Math.abs(ix1 - ix0), sx = ix0 < ix1 ? 1 : -1;
      const dy = -Math.abs(iy1 - iy0), sy = iy0 < iy1 ? 1 : -1;
      let err = dx + dy, step = 0;

      while (step < 640) {
        if (!dashedMask || ((step >> 1) & dashedMask) === 0) {
          fbSetPixel320(ix0, iy0, c);
          if (ix0 + 1 < DISP_W) fbSetPixel320(ix0 + 1, iy0, c);
        }
        if (ix0 === ix1 && iy0 === iy1) break;
        const e2 = err << 1;
        if (e2 >= dy) { err += dy; ix0 += sx; }
        if (e2 <= dx) { err += dx; iy0 += sy; }
        step++;
      }
    }

    const FONT_3X5 = {
      '0': [7,5,5,5,7], '1': [2,6,2,2,7], '2': [7,1,7,4,7], '3': [7,1,7,1,7],
      '4': [5,5,7,1,1], '5': [7,4,7,1,7], '6': [7,4,7,5,7], '7': [7,1,1,2,2],
      '8': [7,5,7,5,7], '9': [7,5,7,1,7],
      'A': [2,5,7,5,5], 'B': [6,5,6,5,6], 'C': [7,4,4,4,7], 'D': [6,5,5,5,6],
      'E': [7,4,6,4,7], 'F': [7,4,6,4,4], 'G': [7,4,5,5,7], 'H': [5,5,7,5,5],
      'I': [7,2,2,2,7], 'J': [1,1,1,5,7], 'K': [5,5,6,5,5], 'L': [4,4,4,4,7],
      'M': [5,7,7,5,5], 'N': [5,7,7,7,5], 'O': [7,5,5,5,7], 'P': [7,5,7,4,4],
      'Q': [7,5,5,7,3], 'R': [6,5,6,5,5], 'S': [7,4,7,1,7], 'T': [7,2,2,2,2],
      'U': [5,5,5,5,7], 'V': [5,5,5,5,2], 'W': [5,5,7,7,5], 'X': [5,5,2,5,5],
      'Y': [5,5,2,2,2], 'Z': [7,1,2,4,7],
      ':': [0,2,0,2,0], '-': [0,0,7,0,0], '/': [1,1,2,4,4], '.': [0,0,0,0,2],
      '+': [0,2,7,2,0], '>': [4,2,1,2,4], '<': [1,2,4,2,1], '%': [5,1,2,4,5],
      '[': [7,4,4,4,7], ']': [7,1,1,1,7], '*': [5,2,7,2,5], '(': [2,4,4,4,2],
      ')': [2,1,1,1,2], '|': [2,2,2,2,2], ',': [0,0,0,2,4], '=': [0,7,0,7,0]
    };

    function fbDrawText(str, x, y, color = 1) {
      const s = String(str).toUpperCase();
      const c = resolveColor565(color);
      let cx = Math.round(x * SCALE_X);
      const cy = Math.round(y * SCALE_Y);
      for (let i = 0; i < s.length; i++) {
        const g = FONT_3X5[s[i]];
        if (g) {
          for (let r = 0; r < 5; r++) {
            const b = g[r];
            for (let col = 0; col < 3; col++) {
              if (b & (4 >> col)) {
                const px = cx + col * 2;
                const py = cy + r * 3;
                for (let dy = 0; dy < 3; dy++) {
                  fbSetPixel320(px, py + dy, c);
                  fbSetPixel320(px + 1, py + dy, c);
                }
              }
            }
          }
        }
        cx += 10;
      }
    }

    function fbPresentToCanvas() {
      let pIdx = 0;
      for (let i = 0; i < VRAM_PIXELS; i++) {
        const c = vram565[i];
        rgbaPixels[pIdx]     = LUT_R[c];
        rgbaPixels[pIdx + 1] = LUT_G[c];
        rgbaPixels[pIdx + 2] = LUT_B[c];
        rgbaPixels[pIdx + 3] = 255;
        pIdx += 4;
      }
      oledCtx.putImageData(oledImgData, 0, 0);
    }

    /***************************************************************************
     * 2. AUDIO SINTETIZADO RETRO-GO
     ***************************************************************************/
    let audioCtx = null;
    let soundEnabled = false;

    function playTone(freq = 600, dur = 0.05, type = 'square', vol = 0.04) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.stop(audioCtx.currentTime + dur + 0.01);
      } catch (_) {}
    }

    /***************************************************************************
     * 3. ENTRADAS HARDWARE:
     *    - ARRIBA: 2 Joysticks Analógicos (con L3/R3 Click y doble toque)
     *    - ABAJO IZQ: Cruceta D-Pad (UP, DOWN, LEFT, RIGHT)
     *    - ABAJO CENTRO: SELECT y ★ MENU
     *    - ABAJO DER: 4 Botones en Diamante (X, Y, A, B)
     ***************************************************************************/
    const stickLeftCanvas = document.getElementById('stickLeft');
    const stickRightCanvas = document.getElementById('stickRight');
    const ctxLeft = stickLeftCanvas.getContext('2d');
    const ctxRight = stickRightCanvas.getContext('2d');

    const hwInput = {
      lx: 0.0, ly: 0.0,
      rx: 0.0, ry: 0.0,
      leftActive: false,
      rightActive: false,
      btn: {
        A: false, B: false, X: false, Y: false,
        L3: false, R3: false,
        SELECT: false, MENU: false,
        UP: false, DOWN: false, LEFT: false, RIGHT: false
      },
      prevBtn: {},
      justPressed(k) { return !!this.btn[k] && !this.prevBtn[k]; }
    };

    const touchTrack = { leftId: null, rightId: null, lastTapLeft: 0, lastTapRight: 0 };

    function computeStickXY(canvasEl, clientX, clientY) {
      const rect = canvasEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const maxR = Math.max(22, rect.width * 0.40);
      const dx = clientX - cx, dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const scale = dist > maxR ? (maxR / dist) : 1.0;
      return { x: (dx * scale) / maxR, y: (-dy * scale) / maxR };
    }

    // Eventos Touch dedicados directamente a los 2 Canvases de los Joysticks Superiores
    function attachStickCanvasEvents(canvasEl, side) {
      let activeId = null;

      canvasEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeId = t.identifier;
        const now = performance.now();
        if (side === 'left') {
          if (now - touchTrack.lastTapLeft < 260) hwInput.btn.L3 = true;
          touchTrack.lastTapLeft = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true;
        } else {
          if (now - touchTrack.lastTapRight < 260) hwInput.btn.R3 = true;
          touchTrack.lastTapRight = now;
          const v = computeStickXY(canvasEl, t.clientX, t.clientY);
          hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true;
        }
      }, { passive: false });

      canvasEl.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === activeId) {
            const v = computeStickXY(canvasEl, t.clientX, t.clientY);
            if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
            else { hwInput.rx = v.x; hwInput.ry = v.y; }
            break;
          }
        }
      }, { passive: false });

      const endStick = (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeId) {
            activeId = null;
            if (side === 'left') {
              hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false;
              if (!btnTouchCounts.L3) hwInput.btn.L3 = false;
            } else {
              hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false;
              if (!btnTouchCounts.R3) hwInput.btn.R3 = false;
            }
            break;
          }
        }
      };

      canvasEl.addEventListener('touchend', endStick, { passive: false });
      canvasEl.addEventListener('touchcancel', endStick, { passive: false });

      // Soporte Mouse en PC
      let mouseDown = false;
      canvasEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        mouseDown = true;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; hwInput.leftActive = true; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; hwInput.rightActive = true; }
      });
      window.addEventListener('mousemove', (e) => {
        if (!mouseDown) return;
        const v = computeStickXY(canvasEl, e.clientX, e.clientY);
        if (side === 'left') { hwInput.lx = v.x; hwInput.ly = v.y; }
        else { hwInput.rx = v.x; hwInput.ry = v.y; }
      });
      window.addEventListener('mouseup', () => {
        if (!mouseDown) return;
        mouseDown = false;
        if (side === 'left') { hwInput.lx = 0; hwInput.ly = 0; hwInput.leftActive = false; }
        else { hwInput.rx = 0; hwInput.ry = 0; hwInput.rightActive = false; }
      });
    }

    attachStickCanvasEvents(stickLeftCanvas, 'left');
    attachStickCanvasEvents(stickRightCanvas, 'right');

    // Botones físicos (D-Pad UP/DOWN/LEFT/RIGHT, SELECT, MENU, Y, X, B, A, L3, R3)
    const btnTouchCounts = {};
    document.querySelectorAll('.hw-btn').forEach((btnEl) => {
      const key = btnEl.getAttribute('data-btn');
      btnTouchCounts[key] = 0;
      const press = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 1;
        hwInput.btn[key] = true;
        btnEl.classList.add('pressed');
        playTone(540, 0.02, 'square', 0.02);
      };
      const release = (e) => {
        e.preventDefault(); e.stopPropagation();
        btnTouchCounts[key] = 0;
        hwInput.btn[key] = false;
        btnEl.classList.remove('pressed');
      };
      btnEl.addEventListener('touchstart', press, { passive: false });
      btnEl.addEventListener('touchend', release, { passive: false });
      btnEl.addEventListener('touchcancel', release, { passive: false });
      btnEl.addEventListener('mousedown', press);
      btnEl.addEventListener('mouseup', release);
      btnEl.addEventListener('mouseleave', release);
    });

    const keyMap = {
      KeyZ: 'A', Space: 'A', Enter: 'A',
      KeyX: 'B', Backspace: 'B',
      KeyC: 'X', KeyR: 'X',
      KeyV: 'Y', KeyM: 'Y',
      KeyQ: 'L3', KeyE: 'R3',
      Tab: 'SELECT', Escape: 'MENU'
    };
    const rawKeys = {};
    window.addEventListener('keydown', (e) => {
      rawKeys[e.code] = true;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = true;
    });
    window.addEventListener('keyup', (e) => {
      rawKeys[e.code] = false;
      if (keyMap[e.code]) hwInput.btn[keyMap[e.code]] = false;
    });

    function drawThumbstickWell(ctxG, canvasEl, x, y, active, clicked, label) {
      const w = canvasEl.width, h = canvasEl.height;
      const cx = w * 0.5, cy = h * 0.5, maxR = w * 0.36;
      const capR = w * 0.21;
      ctxG.clearRect(0, 0, w, h);

      ctxG.strokeStyle = active ? 'rgba(255, 179, 0, 0.5)' : 'rgba(154, 165, 180, 0.22)';
      ctxG.lineWidth = 2;
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR, 0, Math.PI * 2); ctxG.stroke();
      ctxG.beginPath(); ctxG.arc(cx, cy, maxR * 0.52, 0, Math.PI * 2); ctxG.stroke();

      ctxG.beginPath();
      ctxG.moveTo(cx - maxR, cy); ctxG.lineTo(cx + maxR, cy);
      ctxG.moveTo(cx, cy - maxR); ctxG.lineTo(cx, cy + maxR);
      ctxG.stroke();

      const kx = cx + x * maxR;
      const ky = cy - y * maxR;

      ctxG.strokeStyle = '#5c6375';
      ctxG.lineWidth = 10;
      ctxG.lineCap = 'round';
      ctxG.beginPath(); ctxG.moveTo(cx, cy); ctxG.lineTo(kx, ky); ctxG.stroke();

      ctxG.fillStyle = clicked ? '#e53935' : (active ? '#3e4454' : '#2b303c');
      ctxG.beginPath(); ctxG.arc(kx, ky, capR, 0, Math.PI * 2); ctxG.fill();
      ctxG.lineWidth = 3;
      ctxG.strokeStyle = clicked ? '#ffb300' : (active ? '#00e5ff' : '#586178');
      ctxG.stroke();

      ctxG.beginPath(); ctxG.arc(kx, ky, capR * 0.62, 0, Math.PI * 2);
      ctxG.lineWidth = 2;
      ctxG.strokeStyle = 'rgba(255,255,255,0.22)';
      ctxG.stroke();

      ctxG.fillStyle = '#aeb9c9';
      ctxG.font = 'bold 12px monospace';
      ctxG.textAlign = 'center';
      ctxG.fillText(label, cx, 20);
      canvasEl.classList.toggle('engaged', active || clicked);
    }

    function updateInputPolling() {
      // Si no se toca el stick izquierdo, la cruceta D-Pad o WASD también pueden mover el eje izquierdo
      if (!hwInput.leftActive) {
        const dpadX = (hwInput.btn.RIGHT || rawKeys['KeyD'] ? 0.85 : 0) - (hwInput.btn.LEFT || rawKeys['KeyA'] ? 0.85 : 0);
        const dpadY = (hwInput.btn.UP    || rawKeys['KeyW'] ? 0.85 : 0) - (hwInput.btn.DOWN || rawKeys['KeyS'] ? 0.85 : 0);
        hwInput.lx = dpadX;
        hwInput.ly = dpadY;
      }
      if (!hwInput.rightActive) {
        hwInput.rx = (rawKeys['ArrowRight'] ? 0.8 : 0) - (rawKeys['ArrowLeft'] ? 0.8 : 0);
        hwInput.ry = (rawKeys['ArrowUp'] ? 0.8 : 0)    - (rawKeys['ArrowDown'] ? 0.8 : 0);
      }

      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (gp && gp.connected) {
          if (Math.abs(gp.axes[0]) > 0.08) hwInput.lx = gp.axes[0];
          if (Math.abs(gp.axes[1]) > 0.08) hwInput.ly = -gp.axes[1];
          if (Math.abs(gp.axes[2]) > 0.08) hwInput.rx = gp.axes[2];
          if (Math.abs(gp.axes[3]) > 0.08) hwInput.ry = -gp.axes[3];
          if (gp.buttons[0]?.pressed) hwInput.btn.A = true;
          if (gp.buttons[1]?.pressed) hwInput.btn.B = true;
          if (gp.buttons[2]?.pressed) hwInput.btn.X = true;
          if (gp.buttons[3]?.pressed) hwInput.btn.Y = true;
          if (gp.buttons[10]?.pressed) hwInput.btn.L3 = true;
          if (gp.buttons[11]?.pressed) hwInput.btn.R3 = true;
          if (gp.buttons[8]?.pressed) hwInput.btn.SELECT = true;
          if (gp.buttons[9]?.pressed) hwInput.btn.MENU = true;
          if (gp.buttons[12]?.pressed) hwInput.btn.UP = true;
          if (gp.buttons[13]?.pressed) hwInput.btn.DOWN = true;
          if (gp.buttons[14]?.pressed) hwInput.btn.LEFT = true;
          if (gp.buttons[15]?.pressed) hwInput.btn.RIGHT = true;
          break;
        }
      }

      drawThumbstickWell(ctxLeft, stickLeftCanvas, hwInput.lx, hwInput.ly, hwInput.leftActive, hwInput.btn.L3, 'LEFT STICK');
      drawThumbstickWell(ctxRight, stickRightCanvas, hwInput.rx, hwInput.ry, hwInput.rightActive, hwInput.btn.R3, 'RIGHT STICK');

        /***************************************************************************
     * 4. MOTOR VOXEL SPACE "COMANCHE 3" (6-DOF ROLL + 512x512 HEIGHT/COLOR PSRAM)

    const DEG2RAD = Math.PI / 180.0;

    // En ESP32-S3 N16R8 (8MB Octal PSRAM):
    // Mapa 512x512: Heightmap (256KB) + Colormap RGB565 (512KB) = 768KB por mapa en PSRAM
    const MAP_DIM   = 512;
    const MAP_MASK  = 511;
    const MAP_SHIFT = 9;
    const MAP_SCALE = 1.6; // 1 metro = 1.6 texels (mapa de 320m x 320m cíclico infinito)

    const voxHeight = new Uint8Array(MAP_DIM * MAP_DIM);
    const voxColor  = new Uint16Array(MAP_DIM * MAP_DIM);

    // Buffer intermedio des-rotado 256x256 (Comanche 3 6-DOF Roll buffer: 128KB SRAM/PSRAM)
    const VOX_W = 256;
    const VOX_H = 256;
    const voxBuf  = new Uint16Array(VOX_W * VOX_H);
    const voxZBuf = new Uint16Array(VOX_W * VOX_H);
    const skyGradLut = new Uint16Array(512);

    // 4 Mapas Voxel Space estilo Comanche 3
    const VOXEL_MAPS = [

    let currentMapIdx = 0;
    // Modos de detalle Voxel: 0 = ULTRA (256 col), 1 = HYBRID (Voxel + Contornos), 2 = FAST (128 col)
    let voxelDetailMode = 0;
    const VOXEL_DETAIL_NAMES = ['VOXEL ULTRA 256C', 'VOXEL+GRID HYB', 'VOXEL FAST 128C'];

    function clampByte(v) {
      return v < 0 ? 0 : (v > 255 ? 255 : (v | 0));
    }

    // Construye el LUT de cielo atmosférico con dithering Bayer para evitar bandas
    function buildSkyGradient(mapDef) {
      const [rt, gt, bt] = mapDef.skyTop;
      const [rm, gm, bm] = mapDef.skyMid;
      const [rb, gb, bb] = mapDef.skyBot;
      for (let i = 0; i < 512; i++) {
        const t = Math.max(0, Math.min(1, i / 260));
        let r, g, b;
        if (t < 0.62) {
          const u = t / 0.62;
          r = rt + (rm - rt) * u;
          g = gt + (gm - gt) * u;
          b = bt + (bm - bt) * u;
        } else {
          const u = (t - 0.62) / 0.38;
          r = rm + (rb - rm) * u;
          g = gm + (gb - gm) * u;
          b = bm + (bb - bm) * u;
        }
        const d = (i & 1) ? 1.5 : -1.5;
        skyGradLut[i] = rgb565(clampByte(r + d), clampByte(g + d), clampByte(b + d));
      }
    }

    // Ruido periódico rápido (repetible módulo 512 para mapas sin costuras)
    const sinLut = new Float32Array(512);
    for (let i = 0; i < 512; i++) sinLut[i] = Math.sin((i * 2 * Math.PI) / 512);

    function fbmPeriodic(mx, mz) {
      const s1 = sinLut[(mx * 1 + mz * 1) & 511] * sinLut[(mx * 1 - mz * 2 + 128) & 511];
      const s2 = sinLut[(mx * 2 + mz * 3 + 64) & 511] * sinLut[(mz * 2 - mx * 1 + 200) & 511];
      const s3 = sinLut[(mx * 4 - mz * 3 + 30) & 511] * sinLut[(mx * 3 + mz * 4 + 90) & 511];
      const s4 = sinLut[(mx * 7 + mz * 5) & 511] * 0.5 + sinLut[(mx * 11 - mz * 9) & 511] * 0.5;
      return s1 * 0.45 + s2 * 0.28 + s3 * 0.17 + s4 * 0.10;
    }

    // Genera el Heightmap (512x512) y el Colormap RGB565 con iluminación solar direccional (estilo Comanche 3)
    function generateVoxelMap(mapIdx) {
      currentMapIdx = ((mapIdx % VOXEL_MAPS.length) + VOXEL_MAPS.length) % VOXEL_MAPS.length;
      const mapDef = VOXEL_MAPS[currentMapIdx];
      buildSkyGradient(mapDef);

      const TWO_PI_512 = (2 * Math.PI) / 512;
      const rwyAltTex = Math.round(mapDef.runwayAlt / 0.35);
      const waterTex  = Math.round(mapDef.waterLvl / 0.35);

      // Paso 1: Generar alturas (0..255)
      for (let mz = 0; mz < MAP_DIM; mz++) {
        const zOff = mz << MAP_SHIFT;
        const dz0 = ((mz + 256) & 511) - 256;

        for (let mx = 0; mx < MAP_DIM; mx++) {
          const dx0 = ((mx + 256) & 511) - 256;
          const n = fbmPeriodic(mx, mz);
          let h = 60;

          if (mapDef.id === 'canyon') {
            const riverCenter = Math.sin(mz * TWO_PI_512 * 2) * 58 + Math.cos(mz * TWO_PI_512) * 28;
            const distRiver = Math.abs(dx0 - riverCenter - 65);
            let canyonProfile = Math.min(1.0, distRiver / 52.0);
            canyonProfile = Math.pow(canyonProfile, 0.75);
            const rawH = 42 + canyonProfile * 145 + n * 58;
            const step = Math.floor(rawH / 18) * 18;
            h = step * 0.55 + rawH * 0.45;
            if (distRiver < 11) h = waterTex - 2;
          } else if (mapDef.id === 'andes') {
            const ridge = Math.abs(Math.sin((mx + mz * 0.5) * TWO_PI_512 * 1.5));
            const valley = Math.min(1.0, Math.abs(dx0) / 85.0);
            h = 46 + (ridge * 125 + (n + 0.4) * 75) * (0.25 + 0.75 * valley);
          } else if (mapDef.id === 'volcano') {
            const vx = dx0 - 115, vz = dz0 - 115;
            const rVolc = Math.hypot(vx, vz);
            let cone = Math.max(0, 1.0 - rVolc / 135.0);
            let volcH = Math.pow(cone, 1.35) * 235;
            if (rVolc < 24) {
              volcH = 152 - (1.0 - rVolc / 24.0) * 38;
            }
            const isle2 = Math.max(0, 1.0 - Math.hypot(dx0 + 95, dz0 - 80) / 85.0) * 125;
            h = Math.max(waterTex - 4, 34 + volcH + isle2 + n * 42);
          } else {
            const corridor = Math.abs(Math.sin(mz * TWO_PI_512 * 2) * 45 - dx0);
            const wall = Math.min(1.0, corridor / 48.0);
            h = 48 + wall * 130 + n * 55;
          }

          // Aplanar suavemente la zona de la pista de aterrizaje principal alrededor de (x=0, z=-75..+75 texels)
          const rxDist = Math.abs(dx0);
          const rzDist = Math.max(0, Math.abs(dz0) - 72);
          const rwyDist = Math.hypot(rxDist, rzDist * 0.5);
          if (rwyDist < 36) {
            const blend = Math.max(0, Math.min(1, (rwyDist - 12) / 24.0));
            const smooth = blend * blend * (3 - 2 * blend);
            h = rwyAltTex * (1 - smooth) + h * smooth;
          }

          if (h < waterTex) h = waterTex;
          voxHeight[zOff + mx] = Math.max(4, Math.min(254, Math.round(h)));
        }
      }

      // Paso 2: Generar Colormap RGB565 con sombreado direccional (Sol desde Noroeste) + Pista + Agua
      for (let mz = 0; mz < MAP_DIM; mz++) {
        const zOff = mz << MAP_SHIFT;
        const dz0 = ((mz + 256) & 511) - 256;

        for (let mx = 0; mx < MAP_DIM; mx++) {
          const dx0 = ((mx + 256) & 511) - 256;
          const h = voxHeight[zOff + mx];

          const hR = voxHeight[zOff + ((mx + 2) & MAP_MASK)];
          const hD = voxHeight[((mz + 2) & MAP_MASK) << MAP_SHIFT | mx];
          const slope = (h - hR) * 2.2 + (h - hD) * 1.6;
          const shade = Math.max(0.42, Math.min(1.42, 1.0 + slope * 0.032));

          if (Math.abs(dx0) <= 9 && Math.abs(dz0) <= 72) {
            let rr = 42, gg = 46, bb = 56;
            if (Math.abs(dx0) === 8) {
              if ((mz & 7) < 2) { rr = 255; gg = 220; bb = 80; }
              else { rr = 180; gg = 190; bb = 205; }
            } else if (dx0 === 0 && (mz & 7) < 4 && Math.abs(dz0) < 62) {
              rr = 235; gg = 240; bb = 250;
            } else if (Math.abs(dz0) >= 64 && Math.abs(dz0) <= 70 && (mx & 1) === 0) {
              rr = dz0 < 0 ? 40 : 250;
              gg = dz0 < 0 ? 245 : 60;
              bb = 70;
            }
            voxColor[zOff + mx] = rgb565(rr, gg, bb);
            continue;
          }

          let r = 80, g = 100, b = 70;

          if (h <= waterTex) {
            const wave = ((mx ^ mz) & 3) * 4;
            if (mapDef.id === 'volcano') {
              r = 12 + wave; g = 125 + wave * 2; b = 175 + wave * 2;
            } else if (mapDef.id === 'night') {
              r = 4; g = 38 + wave; b = 48 + wave;
            } else {
              r = 16 + wave; g = 78 + wave; b = 138 + wave * 2;
            }
            voxColor[zOff + mx] = rgb565(clampByte(r), clampByte(g), clampByte(b));
            continue;
          }

          if (mapDef.id === 'canyon') {
            const band = (h >> 3) & 3;
            if (h < waterTex + 8) {
              r = 65; g = 115; b = 52;
            } else if (band === 0) {
              r = 188; g = 96; b = 54;
            } else if (band === 1) {
              r = 212; g = 126; b = 68;
            } else if (band === 2) {
              r = 165; g = 78; b = 46;
            } else {
              r = 224; g = 152; b = 88;
            }
          } else if (mapDef.id === 'andes') {
            if (h > 152) {
              r = 220; g = 232; b = 248;
            } else if (h > 110) {
              r = 115; g = 122; b = 135;
            } else if (h > 68) {
              r = 38; g = 88; b = 48;
            } else {
              r = 64; g = 128; b = 56;
            }
          } else if (mapDef.id === 'volcano') {
            const vx = dx0 - 115, vz = dz0 - 115;
            const rVolc = Math.hypot(vx, vz);
            if (rVolc < 22) {
              const glow = ((mx * 3 + mz * 5) & 7) * 12;
              r = 250; g = clampByte(75 + glow); b = 16;
              voxColor[zOff + mx] = rgb565(r, g, b);
              continue;
            } else if (h < waterTex + 7) {
              r = 218; g = 195; b = 132;
            } else if (h > 128) {
              r = 72; g = 64; b = 68;
            } else {
              r = 42; g = 132; b = 54;
            }
          } else {
            const isGrid = ((mx & 15) === 0) || ((mz & 15) === 0);
            const isContour = ((h & 15) === 0);
            if (isGrid) {
              r = 16; g = 195; b = 145;
            } else if (isContour) {
              r = 0; g = 230; b = 195;
            } else {
              r = 8; g = 45 + (h >> 1); b = 38 + (h >> 2);
            }
          }

          r = clampByte(r * shade);
          g = clampByte(g * shade);
          b = clampByte(b * shade);
          voxColor[zOff + mx] = rgb565(r, g, b);
        }
      }
    }

    // Inicializar el primer mapa Voxel
    generateVoxelMap(0);

    // Consulta la altura del terreno en metros en cualquier coordenada del mundo (x, z)
    function getTerrainHeightMeters(wx, wz) {
      const mx = Math.floor(wx * MAP_SCALE) & MAP_MASK;
      const mz = Math.floor(wz * MAP_SCALE) & MAP_MASK;
      return voxHeight[(mz << MAP_SHIFT) | mx] * 0.35;
    }

    // Mezcla rápida RGB565 al 50% para niebla atmosférica lejana
    function blend565Half(c1, c2) {
      return (((c1 & 0xF7DE) >> 1) + ((c2 & 0xF7DE) >> 1));
    }

    let lastCamRoll = 0;

    // Renderizador Voxel Space 2 (Comanche 3) con soporte 6-DOF completo (Pitch + Yaw + 360° Roll)
    function renderVoxelSpaceComanche(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz) {
      const mapDef = VOXEL_MAPS[currentMapIdx];
      const fogCol = mapDef.fogCol;

      // 1. Extraer ángulo de alabeo (Roll) exacto de la cámara y vectores des-rotados (R0, U0, H0)
      const upMag = Math.hypot(cRy, cUy);
      if (upMag > 0.04) {
        lastCamRoll = Math.atan2(cRy, cUy);
      }
      const roll = lastCamRoll;
      const cR = Math.cos(roll), sR = Math.sin(roll);

      let R0x = cR * cRx - sR * cUx;
      let R0z = cR * cRz - sR * cUz;
      const rNorm = Math.hypot(R0x, R0z) || 1.0;
      R0x /= rNorm;
      R0z /= rNorm;

      const H0x = -R0z;
      const H0z =  R0x;

      const U0y = Math.max(0.22, Math.abs(sR * cRy + cR * cUy));

      const focal = 136.0;
      const invFocal = 1.0 / focal;
      const horizonV = Math.max(-96, Math.min(352, Math.round(128 + (cFy / U0y) * focal)));

      const colStep = (voxelDetailMode === 2) ? 2 : 1;
      const showContour = (voxelDetailMode === 1);
      const maxDist = 215.0;

      // 2. Raycasting Voxel Front-to-Back por cada columna u del buffer des-rotado (256 columnas)
      for (let u = 0; u < VOX_W; u += colStep) {
        const xi = (u - 128) * invFocal;
        const dirX = (H0x + xi * R0x) * MAP_SCALE;
        const dirZ = (H0z + xi * R0z) * MAP_SCALE;
        const startX = camX * MAP_SCALE;
        const startZ = camZ * MAP_SCALE;

        let yMax = VOX_H;
        let z = 1.4;
        let dz = 0.75;

        while (z < maxDist && yMax > 0) {
          const mx = (startX + dirX * z) & MAP_MASK;
          const mz = (startZ + dirZ * z) & MAP_MASK;
          const mIdx = (mz << MAP_SHIFT) | mx;

          const hMeters = voxHeight[mIdx] * 0.35;
          let v = (horizonV - ((hMeters - camY) * focal) / z) | 0;

          if (v < yMax) {
            const vTop = v < 0 ? 0 : v;
            let col = voxColor[mIdx];

            if (showContour && (((mx & 7) === 0) || ((mz & 7) === 0))) {
              col = blend565Half(col, C565.CYAN);
            }
            if (z > 115.0) {
              col = blend565Half(col, fogCol);
              if (z > 165.0) col = blend565Half(col, fogCol);
            }

            const zVal = (z * 16) | 0;
            let ptr = (vTop << 8) | u;
            if (colStep === 1) {
              for (let y = vTop; y < yMax; y++, ptr += VOX_W) {
                voxBuf[ptr]  = col;
                voxZBuf[ptr] = zVal;
              }
            } else {
              for (let y = vTop; y < yMax; y++, ptr += VOX_W) {
                voxBuf[ptr]      = col;
                voxBuf[ptr + 1]  = col;
                voxZBuf[ptr]     = zVal;
                voxZBuf[ptr + 1] = zVal;
              }
            }
            yMax = vTop;
          }

          z += dz;
          dz += 0.026;
        }

        if (yMax > 0) {
          let ptr = u;
          if (colStep === 1) {
            for (let y = 0; y < yMax; y++, ptr += VOX_W) {
              const lutIdx = Math.max(0, Math.min(511, 256 + (y - horizonV)));
              voxBuf[ptr]  = skyGradLut[lutIdx];
              voxZBuf[ptr] = 65535;
            }
          } else {
            for (let y = 0; y < yMax; y++, ptr += VOX_W) {
              const lutIdx = Math.max(0, Math.min(511, 256 + (y - horizonV)));
              const sc = skyGradLut[lutIdx];
              voxBuf[ptr]      = sc;
              voxBuf[ptr + 1]  = sc;
              voxZBuf[ptr]     = 65535;
              voxZBuf[ptr + 1] = 65535;
            }
          }
        }
      }

      // 3. Blit Rotado en Punto Fijo 16.16 desde voxBuf (256x256) hacia vram565 (320x240)
      if (SPI_MODES[paletteIdx].mono) {
        fbClear(0);
        return { roll, cR, sR, focal };
      }

      const scale = 0.62;
      const du_dx = ( cR * scale * 65536) | 0;
      const dv_dx = (-sR * scale * 65536) | 0;
      const du_dy = ( sR * scale * 65536) | 0;
      const dv_dy = ( cR * scale * 65536) | 0;

      const centerU = 128 * 65536;
      const centerV = 128 * 65536;

      let rowU = centerU - 160 * du_dx - 120 * du_dy;
      let rowV = centerV - 160 * dv_dx - 120 * dv_dy;

      let dstIdx = 0;
      for (let sy = 0; sy < DISP_H; sy++) {
        let uFP = rowU;
        let vFP = rowV;
        for (let sx = 0; sx < DISP_W; sx++) {
          const uu = (uFP >> 16) & 255;
          const vv = (vFP >> 16) & 255;
          vram565[dstIdx++] = voxBuf[(vv << 8) | uu];
          uFP += du_dx;
          vFP += dv_dx;
        }
        rowU += du_dy;
        rowV += dv_dy;
      }

      return { roll, cR, sR, focal };
    }

    function create3DProjector(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz) {
      const f128 = 87.5;
      return function projLine3D(x0, y0, z0, x1, y1, z1, dash = 0, col = 1) {
        const dx0 = x0 - camX, dy0 = y0 - camY, dz0 = z0 - camZ;
        const dx1 = x1 - camX, dy1 = y1 - camY, dz1 = z1 - camZ;
        let cx0 = dx0*cRx + dy0*cRy + dz0*cRz, cy0 = dx0*cUx + dy0*cUy + dz0*cUz, cz0 = dx0*cFx + dy0*cFy + dz0*cFz;
        let cx1 = dx1*cRx + dy1*cRy + dz1*cRz, cy1 = dx1*cUx + dy1*cUy + dz1*cUz, cz1 = dx1*cFx + dy1*cFy + dz1*cFz;
        if (cz0 < 0.4 && cz1 < 0.4) return;
        if (cz0 > 185 && cz1 > 185) return;
        if (cz0 < 0.4) { const t = (0.4 - cz0)/(cz1 - cz0); cx0 += t*(cx1 - cx0); cy0 += t*(cy1 - cy0); cz0 = 0.4; }
        else if (cz1 < 0.4) { const t = (0.4 - cz1)/(cz0 - cz1); cx1 += t*(cx0 - cx1); cy1 += t*(cy0 - cy1); cz1 = 0.4; }
        fbDrawLine(64 + cx0 * f128 / cz0, 32 - cy0 * f128 / cz0, 64 + cx1 * f128 / cz1, 32 - cy1 * f128 / cz1, dash, col);
      };
    }

    function renderCourseGates3D(projLine3D, gates, activeGate) {
      for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        const hw = g.w * 0.5, hh = g.h * 0.5;
        const isAct = (i === activeGate);
        const col = isAct ? 2 : 5;
        const postCol = isAct ? 4 : 9;
        const gTerr = getTerrainHeightMeters(g.x, g.z);
        projLine3D(g.x - hw, gTerr, g.z, g.x - hw, g.y + hh, g.z, 0, postCol);
        projLine3D(g.x + hw, gTerr, g.z, g.x + hw, g.y + hh, g.z, 0, postCol);
        projLine3D(g.x - hw, g.y + hh, g.z, g.x + hw, g.y + hh, g.z, 0, col);
        projLine3D(g.x - hw, g.y - hh, g.z, g.x + hw, g.y - hh, g.z, 0, col);
        if (isAct) {
          projLine3D(g.x - hw - 0.6, g.y - hh - 0.6, g.z, g.x + hw + 0.6, g.y - hh - 0.6, g.z, 0, 3);
          projLine3D(g.x - hw - 0.6, g.y + hh + 0.6, g.z, g.x + hw + 0.6, g.y + hh + 0.6, g.z, 0, 3);
          projLine3D(g.x, g.y + hh + 1.5, g.z, g.x - 2.2, g.y + hh + 4.0, g.z, 0, 2);
          projLine3D(g.x, g.y + hh + 1.5, g.z, g.x + 2.2, g.y + hh + 4.0, g.z, 0, 2);
        }
      }
    }

    function renderMiniRadar(px, pz, fx, fz, activeGate) {
      const rx0 = 266, ry0 = 24, rw = 48, rh = 48;
      const cxMap = Math.floor(px * MAP_SCALE);
      const czMap = Math.floor(pz * MAP_SCALE);
      const borderCol = C565.CYAN;

      for (let py = 0; py < rh; py++) {
        const mz = (czMap + ((rh >> 1) - py) * 3) & MAP_MASK;
        const rowOff = (ry0 + py) * DISP_W + rx0;
        const mRow = mz << MAP_SHIFT;
        for (let x = 0; x < rw; x++) {
          if (py === 0 || py === rh - 1 || x === 0 || x === rw - 1) {
            vram565[rowOff + x] = borderCol;
          } else {
            const mx = (cxMap + (x - (rw >> 1)) * 3) & MAP_MASK;
            vram565[rowOff + x] = blend565Half(voxColor[mRow | mx], C565.BLACK);
          }
        }
      }

      const gates = VOXEL_MAPS[currentMapIdx].gates;
      const g = gates[activeGate];
      if (g) {
        const gx = Math.round((rw >> 1) + ((g.x - px) * MAP_SCALE) / 3);
        const gy = Math.round((rh >> 1) - ((g.z - pz) * MAP_SCALE) / 3);
        const gxClamped = Math.max(3, Math.min(rw - 4, gx));
        const gyClamped = Math.max(3, Math.min(rh - 4, gy));
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            vram565[(ry0 + gyClamped + dy) * DISP_W + (rx0 + gxClamped + dx)] = C565.YELLOW;
          }
        }
      }

      const midX = rx0 + (rw >> 1), midY = ry0 + (rh >> 1);
      const hLen = Math.hypot(fx, fz) || 1;
      const hx = fx / hLen, hz = fz / hLen;
      for (let s = 0; s < 10; s++) {
        const pxLine = Math.round(midX + hx * s);
        const pyLine = Math.round(midY - hz * s);
        vram565[pyLine * DISP_W + pxLine] = C565.WHITE;
      }
      vram565[midY * DISP_W + midX] = C565.RED;
    }

    function renderFpvOsd({
      craftType, mode, spdMs, thrPct, altMsl, altAgl, vario,
      activeGate, totalGates, gateDist, gateBearing,
      rollRad, pitchRad, stallWarn, updraftWarn, chaseCam
    }) {
      const mapDef = VOXEL_MAPS[currentMapIdx];

      if (!chaseCam) {
        const cR = Math.cos(rollRad), sR = Math.sin(rollRad);
        const pitchOff = Math.max(-18, Math.min(18, pitchRad * 28));
        const hx = 64 + sR * pitchOff;
        const hy = 32 + cR * pitchOff;
        fbDrawLine(hx - cR * 18, hy + sR * 18, hx - cR * 6, hy + sR * 6, 0, 3);
        fbDrawLine(hx + cR * 6,  hy - sR * 6,  hx + cR * 18, hy - sR * 18, 0, 3);
        fbDrawLine(60, 32, 62, 32, 0, 2);
        fbDrawLine(66, 32, 68, 32, 0, 2);
        fbSetPixel(64, 32, 2);
      }

      fbRect(0, 0, 128, 8, true, 0);
      fbDrawText(`${craftType}:${mode}`, 2, 1, mode === 'ACRO' ? 2 : 3);
      fbDrawText(mapDef.short, 48, 1, 5);

      const dirChar = gateBearing < -0.35 ? '<' : (gateBearing > 0.35 ? '>' : '^');
      fbDrawText(`G${activeGate + 1}/${totalGates}${dirChar}${Math.min(999, Math.round(gateDist))}M`, 82, 1, 10);

      if (stallWarn) {
        fbRect(34, 12, 60, 8, true, 4);
        fbDrawText('! STALL PULL DN !', 36, 13, 1);
      } else if (altAgl < 3.2 && spdMs > 18 && vario < -3.0) {
        fbRect(38, 12, 52, 8, true, 4);
        fbDrawText('! PULL UP !', 44, 13, 2);
      } else if (updraftWarn) {
        fbRect(38, 12, 52, 7, true, 7);
        fbDrawText('RIDGE LIFT ++', 41, 13, 3);
      }

      fbRect(0, 56, 128, 8, true, 0);
      const kmh = Math.round(spdMs * 3.6);
      fbDrawText(`${kmh}KMH`, 2, 57, 1);
      fbDrawText(`THR:${Math.round(thrPct)}%`, 36, 57, 2);
      fbDrawText(`AGL:${Math.max(0, Math.round(altAgl))}M`, 74, 57, altAgl < 5 ? 9 : 3);
      const vsSign = vario >= 0 ? '+' : '';
      fbDrawText(`${vsSign}${vario.toFixed(0)}`, 112, 57, vario >= 0 ? 5 : 9);
    }

    function handleCommonFlightHotkeys(currentCraft) {

      }
      if (hwInput.justPressed('DOWN')) {

      if (hwInput.justPressed('LEFT') || hwInput.justPressed('RIGHT')) {

        } else {

          launchRom(nextId);
          showToast(nextId === 'fpv_drone' ? 'SIM: FPV DRONE 5"' : 'SIM: FPV FIXED-WING');
          return true;
        }
        capTouch.justTapped = false;
      }
      return false;
    }

    function integrateRotationSO3(state, pitchRate, rollRate, yawRate, dt) {
      const p = pitchRate * dt, r = rollRate * dt, y = yawRate * dt;
      const thSq = p*p + r*r + y*y;
      if (thSq <= 1e-12) return;
      const th = Math.sqrt(thSq);
      const c1 = Math.sin(th) / th, c2 = (1 - Math.cos(th)) / thSq;
      const rx = state.rx, ry = state.ry, rz = state.rz;
      const ux = state.ux, uy = state.uy, uz = state.uz;
      const fx = state.fx, fy = state.fy, fz = state.fz;

      const v1Rx = -r*ux - y*fx, v1Ry = -r*uy - y*fy, v1Rz = -r*uz - y*fz;
      const v1Ux =  r*rx + p*fx, v1Uy =  r*ry + p*fy, v1Uz =  r*rz + p*fz;
      const v1Fx =  y*rx - p*ux, v1Fy =  y*ry - p*uy, v1Fz =  y*rz - p*uz;

      const v2Rx = -r*v1Ux - y*v1Fx, v2Ry = -r*v1Uy - y*v1Fy, v2Rz = -r*v1Uz - y*v1Fz;
      const v2Ux =  r*v1Rx + p*v1Fx, v2Uy =  r*v1Ry + p*v1Fy, v2Uz =  r*v1Rz + p*v1Fz;
      const v2Fx =  y*v1Rx - p*v1Ux, v2Fy =  y*v1Ry - p*v1Uy, v2Fz =  y*v1Rz - p*v1Uz;

      state.rx = rx + c1*v1Rx + c2*v2Rx; state.ry = ry + c1*v1Ry + c2*v2Ry; state.rz = rz + c1*v1Rz + c2*v2Rz;
      state.ux = ux + c1*v1Ux + c2*v2Ux; state.uy = uy + c1*v1Uy + c2*v2Uy; state.uz = uz + c1*v1Uz + c2*v2Uz;
      state.fx = fx + c1*v1Fx + c2*v2Fx; state.fy = fy + c1*v1Fy + c2*v2Fy; state.fz = fz + c1*v1Fz + c2*v2Fz;

      const fL = Math.hypot(state.fx, state.fy, state.fz) || 1;
      state.fx /= fL; state.fy /= fL; state.fz /= fL;
      const dot = state.ux*state.fx + state.uy*state.fy + state.uz*state.fz;
      state.ux -= dot*state.fx; state.uy -= dot*state.fy; state.uz -= dot*state.fz;
      const uL = Math.hypot(state.ux, state.uy, state.uz) || 1;
      state.ux /= uL; state.uy /= uL; state.uz /= uL;
      state.rx = state.uy*state.fz - state.uz*state.fy;
      state.ry = state.uz*state.fx - state.ux*state.fz;
      state.rz = state.ux*state.fy - state.uy*state.fx;
    }

    /***************************************************************************
     * 5. SIMULADOR 1: FPV DRONE 5" FREESTYLE / RACING (BETAFLIGHT ACRO/ANGLE/HORIZON)
     ***************************************************************************/
    const fpvDroneSim = {
      px: 0, py: 38, pz: -30,
      vx: 0, vy: 0, vz: 0,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,
      fx: 0, fy: 0, fz: 1,
      modes: ['ACRO', 'ANGLE', 'HORZN'],
      modeIdx: 0,
      chaseCam: false,
      activeGate: 0,
      thrCmd: 0.35,
      propPhase: 0,

      reset() {
        this.px = 0;
        this.pz = -32;
        this.py = getTerrainHeightMeters(this.px, this.pz) + 2.2;
        this.vx = 0; this.vy = 0; this.vz = 0;
        this.pitchRate = 0; this.rollRate = 0; this.yawRate = 0;
        this.rx = 1; this.ry = 0; this.rz = 0;
        this.ux = 0; this.uy = 1; this.uz = 0;
        this.fx = 0; this.fy = 0; this.fz = 1;
        this.activeGate = 0;
        lastCamRoll = 0;
      },

      cycleMode() {
        this.modeIdx = (this.modeIdx + 1) % this.modes.length;
        showToast(`DRONE MODE: ${this.modes[this.modeIdx]}`);
        playTone(680, 0.04);
      },

      step(dt) {
        if (handleCommonFlightHotkeys(this)) return;

        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) this.cycleMode();
        if (hwInput.justPressed('X')) { this.reset(); showToast('DRONE RUNWAY RESET'); }
        if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
          this.chaseCam = !this.chaseCam;
          showToast(this.chaseCam ? 'CAM: CHASE 3RD PERSON' : 'CAM: FPV 20° UPTILT');
        }

        const baseThr = 0.34;
        let thr = hwInput.ly >= 0 ? baseThr + hwInput.ly * (1 - baseThr) : baseThr * (1 + hwInput.ly);
        if (hwInput.btn.A) thr = Math.min(1.0, thr + 0.30);
        this.thrCmd = thr;
        this.propPhase += (25 + thr * 65) * dt;

        const mode = this.modes[this.modeIdx];
        const curPitch = Math.atan2(-this.fy, Math.max(0.1, this.uy));
        const curRoll  = Math.atan2(-this.ry, Math.max(0.1, this.uy));

        let tPitch = 0, tRoll = 0, tYaw = hwInput.lx * 220 * DEG2RAD;
        if (mode === 'ACRO') {
          tPitch = hwInput.ry * 320 * DEG2RAD;
          tRoll  = hwInput.rx * 320 * DEG2RAD;
        } else if (mode === 'ANGLE') {
          tPitch = ((hwInput.ry * 50 * DEG2RAD) - curPitch) * 7.5;
          tRoll  = ((hwInput.rx * 50 * DEG2RAD) - curRoll)  * 7.5;
        } else {
          const stickDeflect = Math.min(1.0, Math.hypot(hwInput.rx, hwInput.ry));
          const acroP = hwInput.ry * 300 * DEG2RAD;
          const acroR = hwInput.rx * 300 * DEG2RAD;
          const stabP = ((hwInput.ry * 50 * DEG2RAD) - curPitch) * 7.0;
          const stabR = ((hwInput.rx * 50 * DEG2RAD) - curRoll)  * 7.0;
          tPitch = stabP * (1 - stickDeflect) + acroP * stickDeflect;
          tRoll  = stabR * (1 - stickDeflect) + acroR * stickDeflect;
        }

        const alpha = Math.min(1.0, 22.0 * dt);
        this.pitchRate += (tPitch - this.pitchRate) * alpha;
        this.rollRate  += (tRoll  - this.rollRate)  * alpha;
        this.yawRate   += (tYaw   - this.yawRate)   * alpha;

        integrateRotationSO3(this, this.pitchRate, this.rollRate, this.yawRate, dt);

        const thrust = thr * 29.0;
        const spd = Math.hypot(this.vx, this.vy, this.vz);
        const drag = 0.08 + 0.0075 * spd;
        this.vx += (this.ux * thrust - this.vx * drag) * dt;
        this.vy += (this.uy * thrust - 9.81 - this.vy * drag) * dt;
        this.vz += (this.uz * thrust - this.vz * drag) * dt;

        this.px += this.vx * dt;
        this.py += this.vy * dt;
        this.pz += this.vz * dt;

        const groundH = getTerrainHeightMeters(this.px, this.pz);
        if (this.py < groundH + 0.6) {
          this.py = groundH + 0.6;
          if (this.vy < 0) this.vy = -this.vy * 0.25;
          this.vx *= 0.90;
          this.vz *= 0.90;
        }

        const gates = VOXEL_MAPS[currentMapIdx].gates;
        const g = gates[this.activeGate];
        if (g && Math.hypot(this.px - g.x, this.py - g.y, this.pz - g.z) < g.w * 0.75) {
          this.activeGate = (this.activeGate + 1) % gates.length;
          showToast(`GATE ${this.activeGate}/${gates.length} CLEAR!`);
          playTone(880, 0.08);
        }
      },

      render() {
        const tilt = (this.chaseCam ? 8 : 18) * DEG2RAD;
        const cT = Math.cos(tilt), sT = Math.sin(tilt);
        const cRx = this.rx, cRy = this.ry, cRz = this.rz;
        const cUx = cT*this.ux - sT*this.fx, cUy = cT*this.uy - sT*this.fy, cUz = cT*this.uz - sT*this.fz;
        const cFx = sT*this.ux + cT*this.fx, cFy = sT*this.uy + cT*this.fy, cFz = sT*this.uz + cT*this.fz;

        const groundAtDrone = getTerrainHeightMeters(this.px, this.pz);
        const camX = this.chaseCam ? this.px - cFx * 4.2 + cUx * 1.3 : this.px;
        const camZ = this.chaseCam ? this.pz - cFz * 4.2 + cUz * 1.3 : this.pz;
        const minCamY = getTerrainHeightMeters(camX, camZ) + 0.5;
        const camY = Math.max(minCamY, this.chaseCam ? this.py - cFy * 4.2 + cUy * 1.3 : this.py);

        const voxInfo = renderVoxelSpaceComanche(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);

        const projLine3D = create3DProjector(camX, camY, camZ, cRx, cRy, cRz, cUx, cUy, cUz, cFx, cFy, cFz);
        const gates = VOXEL_MAPS[currentMapIdx].gates;
        renderCourseGates3D(projLine3D, gates, this.activeGate);

        if (this.chaseCam) {
          const arm = 0.85;
          const p1x = this.px + (this.fx + this.rx) * arm, p1y = this.py + (this.fy + this.ry) * arm, p1z = this.pz + (this.fz + this.rz) * arm;
          const p2x = this.px + (this.fx - this.rx) * arm, p2y = this.py + (this.fy - this.ry) * arm, p2z = this.pz + (this.fz - this.rz) * arm;
          const p3x = this.px + (-this.fx + this.rx) * arm, p3y = this.py + (-this.fy + this.ry) * arm, p3z = this.pz + (-this.fz + this.rz) * arm;
          const p4x = this.px + (-this.fx - this.rx) * arm, p4y = this.py + (-this.fy - this.ry) * arm, p4z = this.pz + (-this.fz - this.rz) * arm;
          projLine3D(p1x, p1y, p1z, p4x, p4y, p4z, 0, 1);
          projLine3D(p2x, p2y, p2z, p3x, p3y, p3z, 0, 1);
          projLine3D(p3x, p3y, p3z, p4x, p4y, p4z, 0, 4);
          const pr = 0.42 * Math.cos(this.propPhase), ps = 0.42 * Math.sin(this.propPhase);
          for (const [mx, my, mz] of [[p1x, p1y, p1z], [p2x, p2y, p2z], [p3x, p3y, p3z], [p4x, p4y, p4z]]) {
            projLine3D(mx - this.rx*pr, my - this.ry*pr, mz - this.rz*pr, mx + this.rx*pr, my + this.ry*pr, mz + this.rz*pr, 0, 5);
            projLine3D(mx - this.fx*ps, my - this.fy*ps, mz - this.fz*ps, mx + this.fx*ps, my + this.fy*ps, mz + this.fz*ps, 0, 3);
          }
        }

        renderMiniRadar(this.px, this.pz, this.fx, this.fz, this.activeGate);

        const g = gates[this.activeGate] || gates[0];
        const dxG = g.x - this.px, dzG = g.z - this.pz;
        const gateDist = Math.hypot(dxG, g.y - this.py, dzG);
        const gateBearing = Math.atan2(dxG * this.rx + dzG * this.rz, dxG * this.fx + dzG * this.fz);
        const spd = Math.hypot(this.vx, this.vy, this.vz);

        renderFpvOsd({
          craftType: 'QUAD',
          mode: this.modes[this.modeIdx],
          spdMs: spd,
          thrPct: this.thrCmd * 100,
          altMsl: this.py,
          altAgl: this.py - groundAtDrone,
          vario: this.vy,
          activeGate: this.activeGate,
          totalGates: gates.length,
          gateDist,
          gateBearing,
          rollRad: voxInfo.roll,
          pitchRad: Math.asin(Math.max(-1, Math.min(1, cFy))),
          stallWarn: false,
          updraftWarn: false,
          chaseCam: this.chaseCam
        });
      }
    };

    /***************************************************************************
     * 6. SIMULADOR 2: FPV FIXED-WING / ALA FIJA (INAV ACRO / FBWA / CRUISE)
     ***************************************************************************/
    const fpvWingSim = {
      px: 0, py: 38, pz: -38,
      vx: 0, vy: 0, vz: 24,
      airspeed: 24,
      thrCmd: 0.55,
      pitchRate: 0, rollRate: 0, yawRate: 0,
      rx: 1, ry: 0, rz: 0,
      ux: 0, uy: 1, uz: 0,

      modes: ['FBWA', 'ACRO', 'CRUISE'],

      isStalling: false,

      onGround: false,

      reset() {
        this.px = 0;
        this.pz = -38;
        const rwyH = getTerrainHeightMeters(this.px, this.pz);
        this.py = rwyH + 4.5;
        this.airspeed = 26.0;

        this.fx = 0; this.fy = 0; this.fz = 1;

        this.isStalling = false;

      },

      cycleMode() {
        this.modeIdx = (this.modeIdx + 1) % this.modes.length;
        showToast(`WING MODE: ${this.modes[this.modeIdx]}`);
        playTone(740, 0.04);
      },

      step(dt) {
        if (handleCommonFlightHotkeys(this)) return;

        if (hwInput.justPressed('Y') || hwInput.justPressed('L3')) this.cycleMode();
        if (hwInput.justPressed('X')) { this.reset(); showToast('WING LAUNCH ON RUNWAY'); }
        if (hwInput.justPressed('B') || hwInput.justPressed('R3')) {
          this.chaseCam = !this.chaseCam;
          showToast(this.chaseCam ? 'CAM: CHASE WING' : 'CAM: COCKPIT HUD');
        }

        let thr = (hwInput.ly + 1.0) * 0.5;
        if (Math.abs(hwInput.ly) < 0.05) thr = 0.55;
