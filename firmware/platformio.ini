; ============================================================================
; FPVSim Retro-Go Firmware — ESP32-S3 N16R8 + 2.8" IPS ILI9341V (320x240 RGB565)
; ============================================================================
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Configuración obligatoria para el módulo ESP32-S3-WROOM-1-N16R8:
; - Flash 16 MB en modo Quad I/O (qio) a 80 MHz
; - PSRAM 8 MB en modo Octal SPI (opi) a 80 MHz (pines internos GPIO 33..37)
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O3
    -ffast-math
    -funroll-loops

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
